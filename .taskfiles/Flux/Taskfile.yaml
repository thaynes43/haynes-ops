---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  CLUSTER_SECRET_SOPS_FILE: "{{.KUBERNETES_DIR}}/main/flux/vars/cluster-secrets.sops.yaml"
  CLUSTER_SETTINGS_FILE: "{{.KUBERNETES_DIR}}/main/flux/vars/cluster-settings.yaml"
  HELMFILE_FILE: "{{.KUBERNETES_DIR}}/main/bootstrap/helmfile.yaml"

tasks:

  install-helm-apps:
    desc: Install the pre-Flux core (cilium, coredns, csr-approver, spegel) with helmfile
    summary: |-
      Cluster bring-up step 2 — run after `omni:sync` has provisioned the nodes and
      before `flux:bootstrap`. Flux cannot reconcile anything until the CNI and DNS
      are up, so these charts are applied imperatively from
      kubernetes/main/bootstrap/helmfile.yaml. See docs/cluster/index.md.
    dir: "{{.KUBERNETES_DIR}}/main/bootstrap"
    cmd: helmfile --kubeconfig {{.KUBECONFIG_FILE}} --file {{.HELMFILE_FILE}} apply --skip-diff-on-install --suppress-diff
    preconditions:
      - msg: Missing kubeconfig
        sh: test -f {{.KUBECONFIG_FILE}}
      - msg: Missing helmfile
        sh: test -f {{.HELMFILE_FILE}}

  bootstrap:
    desc: Bootstrap Flux into a Kubernetes cluster
    summary: |-
      Cluster bring-up step 4 — installs the Flux components, seeds the sops-age
      secret and applies the cluster vars + the top-level `cluster` Kustomization.
      Needs the Age key, so this runs from the workstation, not the dev-env pod.
    cmds:
      - kubectl apply --kubeconfig {{.KUBECONFIG_FILE}} --server-side --kustomize {{.KUBERNETES_DIR}}/main/bootstrap/flux
      - |
        if ! kubectl --kubeconfig {{.KUBECONFIG_FILE}} -n flux-system get secret sops-age >/dev/null 2>&1; then
          cat {{.AGE_FILE}} | kubectl --kubeconfig {{.KUBECONFIG_FILE}} -n flux-system create secret generic sops-age --from-file=age.agekey=/dev/stdin
        else
          echo "sops-age secret already exists, skipping creation."
        fi
      - sops --decrypt {{.CLUSTER_SECRET_SOPS_FILE}} | kubectl apply --kubeconfig {{.KUBECONFIG_FILE}} --server-side --filename -
      - kubectl apply --kubeconfig {{.KUBECONFIG_FILE}} --server-side --filename {{.CLUSTER_SETTINGS_FILE}}
      - kubectl apply --kubeconfig {{.KUBECONFIG_FILE}} --server-side --kustomize {{.KUBERNETES_DIR}}/main/flux/config
    preconditions:
      - msg: Missing kubeconfig
        sh: test -f {{.KUBECONFIG_FILE}}
      - msg: Missing Sops Age key file
        sh: test -f {{.AGE_FILE}}
      - msg: Missing cluster secrets file
        sh: test -f {{.CLUSTER_SECRET_SOPS_FILE}}
      - msg: Missing cluster settings file
        sh: test -f {{.CLUSTER_SETTINGS_FILE}}

  reconcile:
    desc: Force update Flux to pull in changes from your Git repository
    cmd: flux --kubeconfig {{.KUBECONFIG_FILE}} reconcile --namespace flux-system kustomization cluster --with-source
    preconditions:
      - msg: Missing kubeconfig
        sh: test -f {{.KUBECONFIG_FILE}}
