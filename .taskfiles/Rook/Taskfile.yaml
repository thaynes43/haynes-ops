---
# yaml-language-server: $schema=https://gist.githubusercontent.com/thaynes43/21ef53eace2d3c6c8f00c8ee0fe4ec24/raw/b0fd8341723eee62b8a47127d40cb75f00056b67/empty-json-schema.json
version: "3"

rook-task-vars: &task-vars
  node: "{{.node}}"
  ceph_disk: "{{.ceph_disk}}"
  ts: "{{.ts}}"
  jobName: "{{.jobName}}"
  secondJobName: "{{.secondJobName}}"

vars:
  waitForJobScript: "{{.ROOT_DIR}}/.taskfiles/_scripts/wait-for-k8s-job.sh"
  wipeRookDataJobTemplate: "{{.ROOT_DIR}}/.taskfiles/Rook/WipeRookDataJob.tmpl.yaml"
  wipeRookDiskJobTemplate: "{{.ROOT_DIR}}/.taskfiles/Rook/WipeDiskJob.tmpl.yaml"
  secondTryDiskWipeTemplate: "{{.ROOT_DIR}}/.taskfiles/Rook/SecondTryDiskWipe.tmpl.yaml"
  tempNamespace: "{{.ROOT_DIR}}/.taskfiles/Rook/CreateTempNamespace.yaml"
  ts: '{{now | date "150405"}}'

tasks:
  # TODO This did not quite work - need to add "RookDiskWipe" to the mix
  # TODO Worked for 4/6 disks, then manually "RookDiskWipe"'ing them fixed it so IDK
  # TODO https://github.com/onedr0p/home-ops/blob/main/.taskfiles/bootstrap/resources/rook-disk-job.yaml.j2
  #
  # !! The /dev/nvmeXn1 paths below are NOT stable — Talos re-enumerates them on
  # re-image. ALWAYS confirm with `talosctl -n <node-ip> disks` (or the CephCluster
  # spec's by-id paths: kubectl -n rook-ceph get cephcluster -o jsonpath='{.items[0].spec.storage}')
  # before running any of these.
  #
  # CHECK /dev MOUNTS WITH `talosctl -n 192.168.40.93 disks` FIRST
  wipe-disks-talosm01:
    desc: '!! DESTRUCTIVE !! Wipe the Rook-Ceph OSD disks on node "talosm01"'
    prompt: This ERASES both Ceph OSD disks on talosm01. Continue?
    cmds:
      - task: wipe-disk
        vars:
          node: "{{.node}}"
          ceph_disk: "/dev/nvme0n1"
      - task: wipe-disk
        vars:
          node: "{{.node}}"
          ceph_disk: "/dev/nvme2n1"
    vars:
      node: talosm01

  # CHECK /dev MOUNTS WITH `talosctl -n 192.168.40.59 disks` FIRST
  wipe-disks-talosm02:
    desc: '!! DESTRUCTIVE !! Wipe the Rook-Ceph OSD disks on node "talosm02"'
    prompt: This ERASES both Ceph OSD disks on talosm02. Continue?
    cmds:
      - task: wipe-disk
        vars:
          node: "{{.node}}"
          ceph_disk: "/dev/nvme0n1"
      - task: wipe-disk
        vars:
          node: "{{.node}}"
          ceph_disk: "/dev/nvme1n1"
    vars:
      node: talosm02

  # CHECK /dev MOUNTS WITH `talosctl -n 192.168.40.10 disks` FIRST
  wipe-disks-talosm03:
    desc: '!! DESTRUCTIVE !! Wipe the Rook-Ceph OSD disks on node "talosm03"'
    prompt: This ERASES both Ceph OSD disks on talosm03. Continue?
    cmds:
      - task: wipe-disk
        vars:
          node: "{{.node}}"
          ceph_disk: "/dev/nvme0n1"
      - task: wipe-disk
        vars:
          node: "{{.node}}"
          ceph_disk: "/dev/nvme2n1"
    vars:
      node: talosm03

  # Generic form, for a node that has no wipe-disks-<node> target above (e.g. a new
  # master joining the cluster). Also the only caller of wipe-data, which clears the
  # /var/lib/rook leftovers that make a re-created OSD complain about a bluestore fs.
  wipe-node:
    desc: '!! DESTRUCTIVE !! Wipe one Ceph disk AND /var/lib/rook on an arbitrary node'
    summary: |-
      node: node to wipe (required, e.g. talosm01)
      ceph_disk: device to erase (required, e.g. /dev/nvme0n1 — confirm with `talosctl -n <ip> disks`)
    prompt: This ERASES {{.ceph_disk}} and /var/lib/rook on {{.node}}. Continue?
    cmds:
      - task: wipe-disk
        vars:
          node: "{{.node}}"
          ceph_disk: "{{.ceph_disk}}"
      - task: wipe-data
        vars:
          node: "{{.node}}"
    requires:
      vars: [node, ceph_disk]

  wipe-disk:
    # internal — reached via wipe-disks-<node> or wipe-node, which carry the prompt
    desc: Wipe all remnants of rook-ceph from a given disk
    silent: true
    internal: true
    cmds:
      # Isolate
      - kubectl create -f {{.tempNamespace}}
      # First type
      - echo "----------------First Wipe----------------"
      - envsubst < <(cat {{.wipeRookDiskJobTemplate}}) | kubectl apply -f -
      - bash {{.waitForJobScript}} {{.jobName}} temp-ns
      - kubectl -n temp-ns wait job/{{.jobName}} --for condition=complete --timeout=1m
      - kubectl -n temp-ns logs job/{{.jobName}}
      - kubectl -n temp-ns delete job {{.jobName}}
      # Second try
      - echo "----------------Second Wipe----------------"
      - envsubst < <(cat {{.secondTryDiskWipeTemplate}}) | kubectl apply -f -
      - bash {{.waitForJobScript}} {{.secondJobName}} temp-ns
      - kubectl -n temp-ns wait job/{{.secondJobName}} --for condition=complete --timeout=1m
      - kubectl -n temp-ns logs job/{{.secondJobName}}
      - kubectl -n temp-ns delete job {{.secondJobName}}
      # Cleanup
      - kubectl delete -f {{.tempNamespace}}
    vars:
      node: '{{ or .node (fail "`node` is required") }}'
      ceph_disk: '{{ or .ceph_disk (fail "`ceph_disk` is required") }}'
      jobName: "wipe-disk-{{- .node -}}"
      secondJobName: "second-wipe-{{- .node -}}"
    env: *task-vars
    preconditions:
      - sh: test -f {{.waitForJobScript}}
      - sh: test -f {{.wipeRookDiskJobTemplate}}
      - sh: test -f {{.secondTryDiskWipeTemplate}}
      - sh: test -f {{.tempNamespace}}

  wipe-data:
    # internal — reached via wipe-node, which carries the prompt
    desc: Wipe the /var/lib/rook state directory on a given node
    silent: true
    internal: true
    cmds:
      - kubectl create -f {{.tempNamespace}}
      - envsubst < <(cat {{.wipeRookDataJobTemplate}}) | kubectl apply -f -
      - bash {{.waitForJobScript}} {{.jobName}} temp-ns
      - kubectl -n temp-ns wait job/{{.jobName}} --for condition=complete --timeout=1m
      - kubectl -n temp-ns logs job/{{.jobName}}
      - kubectl -n temp-ns delete job {{.jobName}}
      - kubectl delete -f {{.tempNamespace}}
    vars:
      node: '{{ or .node (fail "`node` is required") }}'
      jobName: "wipe-rook-data-{{- .node -}}"
    env: *task-vars
    preconditions:
      - sh: test -f {{.waitForJobScript}}
      - sh: test -f {{.wipeRookDataJobTemplate}}
      - sh: test -f {{.tempNamespace}}
