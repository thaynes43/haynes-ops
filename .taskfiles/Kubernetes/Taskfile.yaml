---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  KUBECONFORM_SCRIPT: "{{.SCRIPTS_DIR}}/kubeconform.sh"

tasks:

  resources:
    desc: Gather common resources in your cluster, useful when asking for support
    cmds:
      - for: { var: resource }
        cmd: kubectl get {{.ITEM}} {{.CLI_ARGS | default "-A"}}
    vars:
      resource: >-
        nodes
        gitrepositories
        kustomizations
        helmrepositories
        helmreleases
        certificates
        certificaterequests
        ingresses
        pods

  kubeconform:
    desc: Validate Kubernetes manifests with kubeconform
    summary: |-
      CLUSTER: Cluster to validate (optional, default: every cluster under kubernetes/)
    cmd: bash {{.KUBECONFORM_SCRIPT}} {{.KUBERNETES_DIR}} {{.CLUSTER}}
    vars:
      CLUSTER: '{{ .CLUSTER | default "" }}'
    preconditions:
      - msg: Missing kubeconform script
        sh: test -f {{.KUBECONFORM_SCRIPT}}
      - msg: Missing kubeconform binary
        sh: command -v kubeconform
      - msg: Missing kustomize binary
        sh: command -v kustomize
      - msg: Missing yq binary
        sh: command -v yq

  apply-ks:
    desc: Apply a Flux Kustomization resource for a cluster
    summary: |-
      PATH: Path to the Flux Kustomization resource from the apps base dir (required, e.g. home-automation/home-assistant)
      CLUSTER: Cluster to run command against (default: main)
      NS: Namespace the Flux Kustomization lives in (default: whatever its ks.yaml declares)
    cmd: >
      flux build --namespace {{.NS}} ks {{base .PATH}}
      --kustomization-file {{.CLUSTER_DIR}}/apps/{{.PATH}}/ks.yaml
      --path {{.CLUSTER_DIR}}/apps/{{.PATH}}
      {{if contains "not found" .KS}}--dry-run{{end}}
      | yq 'with(select(.apiVersion == "kustomize.toolkit.fluxcd.io/v1" and .kind == "Kustomization"); .metadata.namespace = "{{.NS}}")' -
      | kubectl apply --server-side --field-manager=kustomize-controller -f -
    requires:
      vars: [PATH]
    vars:
      # CLUSTER_DIR has to be resolved here, not at the root: Taskfile-level vars are
      # evaluated before CLI vars are merged, so a root-level definition would never
      # see `CLUSTER=...` from the command line.
      CLUSTER: '{{.CLUSTER | default "main"}}'
      CLUSTER_DIR: '{{.KUBERNETES_DIR}}/{{.CLUSTER | default "main"}}'
      # Every app ks.yaml in this repo declares its own namespace (home-automation,
      # observability, ...) — never flux-system. Defaulting NS to flux-system made the
      # yq step below rewrite .metadata.namespace and apply a DUPLICATE Kustomization
      # into flux-system, orphaning the real one (see the PVC-prune safety rule).
      NS_FROM_KS:
        sh: yq --exit-status 'select(.kind == "Kustomization") | .metadata.namespace' {{.CLUSTER_DIR}}/apps/{{.PATH}}/ks.yaml 2>/dev/null | head -1 || true
      NS: '{{.NS | default .NS_FROM_KS | default "flux-system"}}'
      # `flux get` exits 1 when the Kustomization is not in the cluster yet — which is
      # precisely the case the `contains "not found"` branch exists for — so swallow the
      # status or the task dies before it can add --dry-run.
      KS:
        sh: flux --namespace {{.NS | default .NS_FROM_KS | default "flux-system"}} get kustomizations {{base .PATH}} 2>&1 || true
    preconditions:
      - msg: No ks.yaml at {{.CLUSTER_DIR}}/apps/{{.PATH}}
        sh: test -f {{.CLUSTER_DIR}}/apps/{{.PATH}}/ks.yaml

  browse-pvc:
    desc: Exec into a container to browse a PersistentVolumeClaim
    summary: |-
      CLAIM: PersistentVolumeClaim to browse (required)
      NS: Namespace to browse PersistentVolumeClaims in (default: default)
      CLUSTER: accepted and ignored — KUBECONFIG already selects the cluster
    interactive: true
    cmd: kubectl browse-pvc --namespace {{.NS}} --image docker.io/library/alpine:latest {{.CLAIM}}
    vars:
      NS: '{{.NS | default "default"}}'
    requires:
      vars: [CLAIM]
    preconditions:
      - kubectl --namespace {{.NS}} get persistentvolumeclaims {{.CLAIM}}

  sync-secrets:
    desc: Sync ExternalSecret resources from provider
    summary: |-
      NS: Namespace to sync secret in (default: default)
      SECRET: Secret to sync (default: all secrets)
      CLUSTER: accepted and ignored — KUBECONFIG already selects the cluster
    cmd: >
      {{if eq .SECRET ""}}
      kubectl get externalsecret --all-namespaces --no-headers -A | awk '{print $1, $2}'
      | xargs --max-procs=2 -l bash -c 'kubectl -n $0 annotate externalsecret $1 force-sync=$(date +%s) --overwrite'
      {{else}}
      kubectl --namespace {{.NS}} annotate externalsecret {{.SECRET}} force-sync=$(date +%s) --overwrite
      {{end}}
    vars:
      NS: '{{.NS | default "default"}}'
      SECRET: '{{ .SECRET | default ""}}'
    preconditions:
      - '{{if ne .SECRET ""}}kubectl --namespace {{.NS}} get externalsecret {{.SECRET}}{{end}}'
