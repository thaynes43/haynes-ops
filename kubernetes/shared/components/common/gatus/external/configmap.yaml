---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "${APP}-gatus-ep"
  labels:
    gatus.io/enabled: "true"
data:
  config.yaml: |
    endpoints:
      - name: "${APP}"
        group: external
        url: "https://${GATUS_SUBDOMAIN:-${APP}}.${GATUS_DOMAIN:-haynesnetwork.com}${GATUS_PATH:-/}"
        interval: 1m
        client:
          dns-resolver: tcp://1.1.1.1:53
        conditions:
          - "[STATUS] < ${GATUS_STATUS_MAX:-500}"
        alerts:
          # 10 consecutive 1m failures before paging: routine Renovate image
          # rollouts (multi-GB pulls) dip endpoints for a few minutes and were
          # paging nightly. Real outages persist and still page (~10 min in);
          # broken upgrades are the shepherd's job, not the pager's.
          - type: pushover
            failure-threshold: 10
            success-threshold: 2
