---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "${APP}-gatus-ep"
  labels:
    gatus.io/enabled: "true"
data:
  config.yaml: |
    endpoints:
      - name: "${APP}"
        group: internal
        # Internal services are often behind SSO; treat any non-5xx as "up".
        # This also makes the service URL visible in the UI.
        url: "https://${GATUS_SUBDOMAIN:-${APP}}.${GATUS_DOMAIN:-haynesops.com}${GATUS_PATH:-/}"
        interval: 1m
        conditions:
          # Floor guards against the timeout case: no response resolves [STATUS] to 0,
          # which would pass "< 500" (see external/configmap.yaml, 2026-08-12 incident).
          - "[STATUS] >= 200"
          - "[STATUS] < ${GATUS_STATUS_MAX:-500}"
        alerts:
          - type: pushover
