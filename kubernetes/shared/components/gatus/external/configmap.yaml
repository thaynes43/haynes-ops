---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "${APP}-gatus-ep"
  labels:
    gatus.io/enabled: "true"
data:
  config.yaml: |
    endpoints:
      - name: "${APP}"
        group: external
        url: "https://${GATUS_SUBDOMAIN:-${APP}}.${GATUS_DOMAIN:-haynesnetwork.com}${GATUS_PATH:-/}"
        interval: 1m
        client:
          dns-resolver: tcp://1.1.1.1:53
        conditions:
          # A client timeout / connection failure resolves [STATUS] to 0, which passes "< 500";
          # the floor makes a hung app (no response at all) count as DOWN. Mirrors the same fix
          # in components/common/gatus (PR #2407) — this older component tree was missed there.
          - "[STATUS] >= 200"
          - "[STATUS] < ${GATUS_STATUS_MAX:-500}"
        alerts:
          # 10 consecutive 1m failures before paging: transient blips (image
          # rollouts, the 2026-08-27 worker-NotReady window) self-resolve in
          # minutes; real outages persist and still page (~10 min in). Ported
          # from components/common/gatus/external, which this tree missed.
          - type: pushover
            failure-threshold: 10
            success-threshold: 2
