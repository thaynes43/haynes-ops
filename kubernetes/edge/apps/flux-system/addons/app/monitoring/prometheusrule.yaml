---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux-rules
  namespace: flux-system
spec:
  groups:
    - name: flux.rules
      rules:
        - alert: FluxComponentAbsent
          annotations:
            summary: Flux component has disappeared from Prometheus target discovery.
          expr: |
            absent(up{job=~".*flux-system.*"} == 1)
          for: 15m
          labels:
            severity: critical
        # gotk_resource_info comes from kube-state-metrics customResourceState (see
        # kube-prometheus-stack values), NOT the Flux controllers — Flux ≥2.1 removed
        # gotk_reconcile_condition, which left the previous expr querying a metric that
        # cannot exist (alert dark; rewritten 2026-07-17 after the mcp-grafana stall).
        # ready=~"False|Unknown": a Helm upgrade→rollback loop flips Ready False↔Unknown;
        # matching only "False" would reset the `for:` clock on every flip. The max by()
        # drops the churning `ready` label so the alert series identity stays stable.
        - alert: FluxReconciliationFailure
          annotations:
            summary: >-
              {{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }}
              reconciliation has been failing for more than 15 minutes.
          expr: |
            max by (exported_namespace, name, customresource_kind) (
              gotk_resource_info{ready=~"False|Unknown", suspended!="true"}
            )
          for: 15m
          labels:
            severity: critical
        # Absent-metric tripwire: if the KSM customResourceState pipeline breaks (RBAC,
        # config regression, chart bump dropping the values), FluxReconciliationFailure
        # goes dark SILENTLY again — exactly the failure mode this rewrite fixes. There
        # are always Kustomizations in flux-system, so this series must always exist.
        - alert: FluxResourceMetricsAbsent
          annotations:
            summary: >-
              gotk_resource_info is absent — kube-state-metrics customResourceState is
              broken and FluxReconciliationFailure is blind. Check KSM rbac.extraRules +
              customResourceState in the kube-prometheus-stack values.
          expr: |
            absent(gotk_resource_info{customresource_kind="Kustomization"})
          for: 30m
          labels:
            severity: critical
