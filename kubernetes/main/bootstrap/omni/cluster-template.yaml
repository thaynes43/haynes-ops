# cluster (and before that the Proxmox host pve01). Same machine id as on the decommissioned
# self-hosted Omni (SMBIOS UUID); it re-joined from SaaS-Omni boot media. Fifth etcd member
# (ruling 2026-10-03, #3332). Hardware read live from machinestatus/talosctl on 2026-10-04,
# in maintenance mode: BIOS AHWSA.1.22, UKI boot, Secure Boot off, RTX A2000 12GB at 01:00.0.
kind: Machine
