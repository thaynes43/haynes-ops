# talosm04: Minisforum MS-01 (i9-13900H, 96 GiB), the ex-`edgem03` of the retired edge
# cluster (and before that the Proxmox host pve03). Same machine id as on the decommissioned
# self-hosted Omni (SMBIOS UUID); it re-joined from SaaS-Omni boot media. Fourth etcd member
# (ruling 2026-10-03, #3332). Hardware read live from machinestatus/talosctl on 2026-10-03,
# in maintenance mode: BIOS AHWSA.1.22, UKI boot, Secure Boot off.
kind: Machine
# NVIDIA extensions removed until #3348 is fixed (the RTX A2000 is fitted but never
# enumerates on PCI). Without the card, ext-nvidia-persistenced and ext-nvidia-cdi-gen
# never start, startAllServices hits its 1h deadline, "boot sequence: failed", and Talos
# reboots: an hourly reboot loop on 2026-10-04 that dropped osd.6/osd.8, a mon and an
# etcd member each time. Restore siderolabs/nvidia-container-toolkit-lts and
# siderolabs/nvidia-open-gpu-kernel-modules-lts here, plus the kernel.modules block
# below, only once `lspci -d 10de:` on talosm04 lists the card (steps on #3348).
systemExtensions:
  - siderolabs/intel-ucode
  - siderolabs/nut-client
  - siderolabs/thunderbolt
name: 0412ab80-f1ae-11ee-9e2d-bdcefa626900
# Omni-native kernel args (gotcha #2: under UKI, install.extraKernelArgs is silently
# ignored, so this block has none). The boot media carries the same single arg and Omni's
# KernelArgs for this machine already reads [net.ifnames=0], so the installed set matches
# and nothing re-applies (the omni#2382 reboot loop needs an arg duplicated outside Omni).
kernelArgs:
  - net.ifnames=0
patches:
  - idOverride: 400-cm-0412ab80-f1ae-11ee-9e2d-bdcefa626900
    inline:
      machine:
        # Talos service-log shipping to the vector aggregator (see talosm01).
        logging:
          destinations:
            - endpoint: udp://192.168.40.212:6051/
              format: json_lines
              extraTags:
                hostname: talosm04
                cluster: main
        install:
          # The 1 TB Crucial T500 (serial 240646DDEE52, nvme0n1 in maintenance). The only
          # CT1000T500SSD8 in the box: the two Samsung PM983s are the Rook OSD disks, and
          # the model match also keeps the install off the USB boot stick (/dev/sda).
          diskSelector:
            model: CT1000T500SSD8
          wipe: true
        # NVIDIA kernel.modules (nvidia with NVreg_OpenRmEnableUnsupportedGpus=1, nvidia_uvm,
        # nvidia_drm, nvidia_modeset; same as talosm01) removed with the extensions above
        # until #3348 is fixed. Put them back in the same PR that restores the extensions.
        network:
          hostname: talosm04
          # Same enumeration as talosm01, verified live: eth2/eth3 = X710 SFP+,
          # eth0 = I226-V, eth1 = I226-LM. MACs lowercase (gotcha #1).
          interfaces:
            - deviceSelector:
                hardwareAddr: 58:47:ca:77:0a:7a # eth2, mgmt, Pro Aggregation SFP+ 7 (Hayneslab 4)
              mtu: 1500
              dhcp: true
              dhcpOptions:
                routeMetric: 100
              vip:
                ip: 192.168.40.202
            - deviceSelector:
                hardwareAddr: 58:47:ca:77:0a:7b # eth3, ceph, Pro Aggregation SFP+ 16 (RookLan 6)
              mtu: 1500
              dhcp: true
              dhcpOptions:
                routeMetric: 2000
            - deviceSelector:
                hardwareAddr: 58:47:ca:77:0a:7c # eth0, Default, Pro Max 24 PoE port 12
              mtu: 1500
              dhcp: true
              dhcpOptions:
                routeMetric: 3000
            - deviceSelector:
                hardwareAddr: 58:47:ca:77:0a:7d # eth1, IoT, Pro Max 24 PoE port 16 (IoT 5)
              mtu: 1500
              dhcp: true
              dhcpOptions:
                routeMetric: 4000
          nameservers:
            - 192.168.40.1
          disableSearchDomain: true
        sysctls:
