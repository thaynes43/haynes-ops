            kubePrism:
                enabled: true
                port: 7445
            hostDNS:
                enabled: true
                resolveMemberNames: true
                forwardKubeDNSToHost: false
        nodeLabels:
            topology.kubernetes.io/region: main
            # Same zone as the other workers on purpose: a zone of its own would be a
            # topology domain no untolerating pod can ever fill.
            topology.kubernetes.io/zone: w
            # Selector for the GPU exporter and the test Jobs, and the opt-out for Cilium L2
            # announcements (kube-system/cilium/config/cilium-l2.yaml).
            haynesops.com/gpu-test: "true"
