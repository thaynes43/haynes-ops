# talosw04: bare-metal mini PC + OCuLink eGPU dock (a direct PCIe x4 cable, so no Thunderbolt
# extension or authorization is involved), the ex-`edgew01` of the retired edge cluster (same
# machine id; it was registered only with the decommissioned self-hosted Omni, so it re-joins
# from SaaS-Omni boot media). OCuLink is not hot-pluggable: the dock must be cabled and
# powered before the PC boots or the card does not enumerate. It is a swappable GPU TEST
# node: the kubelet registers it with the NoSchedule taint `haynesops.com/gpu-test`, so only
# pods that tolerate it land here (the nvidia device plugin, the GPU exporter, the
# toleration-everything DaemonSets, and the test Jobs). First card on it: the suspect RTX
# 3090 from #3052.
# Procedure and test ladder: .agents/runbooks/egpu-test-node.md.
kind: Machine
systemExtensions:
  # AMD Ryzen 9 8945HS (machinestatus, 2026-10-02).
  - siderolabs/amd-ucode
