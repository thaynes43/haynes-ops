---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta1.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      # https://github.com/piraeusdatastore/helm-charts/tree/main/charts/snapshot-controller
      chart: snapshot-controller
      version: 5.0.2
      sourceRef:
        kind: HelmRepository
        name: piraeus
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  values:
    controller:
      replicaCount: 1
      serviceMonitor:
        create: true
      # #3389: requests sized from Prometheus (7d p95, 30d peak); no CPU limits.
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
