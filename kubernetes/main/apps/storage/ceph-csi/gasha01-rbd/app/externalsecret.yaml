---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# client.k8s key minted on pve04 2026-08-21:
#   ceph auth get-or-create client.k8s mon 'profile rbd' \
#     osd 'profile rbd pool=k8s-rbd' mgr 'profile rbd pool=k8s-rbd'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gasha01-ceph-csi
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: gasha01-ceph-csi
    template:
      engineVersion: v2
      data:
        userID: k8s
        userKey: "{{ .cephKey }}"
  data:
    - secretKey: cephKey
      remoteRef:
        key: gasha01-ceph
        property: CEPH_K8S_KEY
