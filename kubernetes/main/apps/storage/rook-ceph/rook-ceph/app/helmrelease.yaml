---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
spec:
  interval: 30m
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: snapshot-controller
      namespace: volsync-system
  values:
    csi:
      # v1.20: cephFSKernelMountOptions and enableLiveness were removed from the
      # rook-ceph chart. CSI is now managed by the bundled ceph-csi-operator
      # (csi.installCsiOperator defaults true). The ms_mode=prefer-crc CephFS mount
      # option is dropped here — re-add via the ceph-csi-operator Driver CR if needed.
      serviceMonitor:
        enabled: true
      # v1.21 renders ROOK_CREATE_CSI_OPERATOR_RESOURCES from this key but the chart's
      # values.yaml never defines it, so it renders as null. If that lands in the
      # operator ConfigMap as "", Rook reads the setting as disabled and DELETES the
      # rook-ceph CephConnection + ClientProfile (pkg/operator/ceph/cluster/mon/mon.go)
      # — every StorageClass clusterID, i.e. new provisioning and mounts. Pin the code
      # default explicitly. Inert on charts < v1.21 (no template references it).
      createCsiOperatorResources: true
    enableDiscoveryDaemon: true
    # #3389: rook-discover DaemonSet requests, sized from Prometheus (7d p95,
    # 30d peak); no CPU limit. The operator parses this string as YAML.
    discover:
      resources: |
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 512Mi
    monitoring:
      enabled: true
    resources:
      requests:
        memory: 128Mi # unchangable
        cpu: 100m # unchangable
      # `limits: {}` did NOT drop the chart's default 512Mi limit (helm map-merge
      # keeps defaults an empty map doesn't override). At 512Mi the operator was
      # OOMKilled 4x on 2026-08-20 while orchestrating the 20.2.2->20.2.4 daemon
      # roll — an operator death mid-OSD-upgrade risks a half-applied roll, and
      # today's storm shows how that ends. Steady-state usage fits comfortably;
      # 1Gi covers upgrade churn.
      limits:
        memory: 1Gi
