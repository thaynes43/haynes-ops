---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  interval: 30m
  # A chart bump that moves the Ceph image rolls every daemon (mons, mgr, mds,
  # rgw, then OSDs one-by-one) — far more than 15m. 2026-08-20: the v1.20.5 bump
  # (Ceph 20.2.2→20.2.4) hit the old 15m timeout mid-roll; the rollback
  # remediation then reset the CephCluster spec to 20.2.2 while mons were
  # already 20.2.4 — Ceph daemons cannot downgrade, so the operator wedged
  # "waiting for monitors" and every ceph-dependent app went NotReady.
  timeout: 60m
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    # NO rollback remediation: helm rollback re-applies the previous Ceph image,
    # which is a downgrade Ceph does not support. On timeout/failure, leave the
    # release failed (the operator keeps converging toward the new version) and
    # let the FluxReconciliationFailure alert page instead.
    remediation:
      retries: 0
  # Drop the chronically-fragile CephPoolGrowthWarning rule (2026-07-08). It does
  # predict_linear(ceph_pool_percent_used[2d]) joined on labels that ignore `pod`, so
  # EVERY ceph-mgr restart (upgrades, failovers, drains) leaves the old + new mgr pod
  # series in the 2-day window -> "many-to-many matching not allowed" -> the rule errors
  # every eval -> PrometheusRuleFailures pages for ~2 days. It's a low-value 5-day
  # pool-full forecast; we drop it rather than fight it (rook v1.20.2 upgrade paged it).
  # FAIL-SAFE: the `test` op asserts the target is still CephPoolGrowthWarning; if a rook
  # chart bump shifts the group/rule index, the patch fails -> the HR goes NotReady (the
  # gate pages) instead of silently removing the wrong rule. Re-verify the index on a
  # rook chart bump: kubectl -n rook-ceph get prometheusrule prometheus-ceph-rules -o json
  #   | jq '.spec.groups[7].rules[0].alert'  (expect "CephPoolGrowthWarning").
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: PrometheusRule
              name: prometheus-ceph-rules
            patch: |
              - op: test
                path: /spec/groups/7/rules/0/alert
                value: CephPoolGrowthWarning
              - op: remove
                path: /spec/groups/7/rules/0
          # alert-responder scope (owner ruling 2026-07-10): tag the PHYSICAL-hardware
          # ceph rules (group 'hardware': fans/PSU/DIMM/processor/network/storage — these
          # read ceph_health_detail HARDWARE_* and represent unfixable, self-evident host
          # faults) with `scope: host` so the LLM alert-responder SKIPS its redundant
          # diagnosis. The Ceph OSD/mon/pool/PG cluster-health rules are deliberately NOT
          # tagged — those still get diagnosed. Fail-safe: the group-name `test` op means a
          # rook chart bump that shifts group[9] fails the patch -> HR NotReady (pages)
          # rather than silently mislabeling. Re-verify on a rook bump: kubectl -n rook-ceph
          # get prometheusrule prometheus-ceph-rules -o json | jq '.spec.groups[9].name'.
          - target:
              kind: PrometheusRule
              name: prometheus-ceph-rules
            patch: |
              - op: test
                path: /spec/groups/9/name
                value: hardware
              - op: add
                path: /spec/groups/9/rules/0/labels/scope
                value: host
              - op: add
                path: /spec/groups/9/rules/1/labels/scope
                value: host
              - op: add
                path: /spec/groups/9/rules/2/labels/scope
                value: host
              - op: add
                path: /spec/groups/9/rules/3/labels/scope
                value: host
              - op: add
                path: /spec/groups/9/rules/4/labels/scope
                value: host
              - op: add
                path: /spec/groups/9/rules/5/labels/scope
                value: host
          # NAS false-positive (owner ruling 2026-08-06): CephNodeDiskspaceWarning is a
          # per-filesystem predict_linear ("full within 5d") that also evaluates the
          # Unraid NAS's node-exporter series. Unraid's high-water allocator fills ONE
          # data disk toward the next step (75% → 87.5%) then rotates to another disk,
          # so a mover burst on the current fill-target trips the prediction while the
          # array holds ~100TB free — the disk never actually fills (it fired for
          # /mnt/disk17 at 85% used / 3TB free). Scope the rule to non-NAS hosts: the
          # `role: nas` label rides on the NAS scrape config; k8s nodes carry no role
          # label. Array-level NAS capacity backstop lives in
          # observability/kube-prometheus-stack/app/prometheusrule.yaml (nas-capacity).
          # Same fail-safe as above: the test op pins the rule index, so a rook chart
          # bump that shifts it fails the patch -> HR NotReady (pages) instead of
          # silently rewriting the wrong rule. Re-verify on a rook bump: kubectl -n
          # rook-ceph get prometheusrule prometheus-ceph-rules -o json
          #   | jq '.spec.groups[6].rules[4].alert'  (expect "CephNodeDiskspaceWarning").
          - target:
              kind: PrometheusRule
              name: prometheus-ceph-rules
            patch: |
              - op: test
                path: /spec/groups/6/rules/4/alert
                value: CephNodeDiskspaceWarning
              - op: replace
                path: /spec/groups/6/rules/4/expr
                value: predict_linear(node_filesystem_free_bytes{device=~"/.*", role!="nas"}[2d], 3600 * 24 * 5) * on(cluster, instance) group_left(nodename) node_uname_info < 0
  dependsOn:
    - name: rook-ceph-operator
      namespace: rook-ceph
    - name: snapshot-controller
      namespace: volsync-system
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
    ingress:
      dashboard:
        annotations:
          external-dns.alpha.kubernetes.io/target: internal.haynesops
        ingressClassName: traefik-internal
        host:
          name: rook.haynesops.com
          path: /
    toolbox:
      enabled: true
    cephClusterSpec:
      crashCollector:
        disable: false
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://prometheus-operated.observability.svc.cluster.local:9090
      mgr:
        modules:
          - name: insights
            enabled: true
          - name: pg_autoscaler
            enabled: true
          # DISABLED 2026-08-20 (Ceph 20.2.4): the mgr prometheus module's 15s
          # collection cycle now calls orchestrator node_proxy_fullreport, which
          # the rook orchestrator module does not implement -> NotImplementedError
          # crash report EVERY 15s (786 RECENT_MGR_MODULE_CRASH entries in ~3.5h).
          # With the module off the collector logs a single graceful "Module not
          # found" line instead. Cost: `ceph orch` views/dashboard orchestrator
          # pages; the Rook operator itself never needed the module. Re-enable
          # only if a future ceph image implements node_proxy_fullreport for the
          # rook backend.
          - name: rook
            enabled: false
      network:
        provider: host
        addressRanges:
          public: ["192.168.40.0/24"]
          cluster: ["192.168.60.0/24"]
        # TODO https://rook.io/docs/rook/latest/CRDs/Cluster/network-providers/#multus needed?
        #provider: multus
        #selectors:
        #  public: network/multus-public
        #  cluster: network/multus-ceph
        connections:
          requireMsgr2: true
      storage:
        useAllNodes: false
        useAllDevices: false
        nodes:
          - name: talosm01
            devices:
              - name: "/dev/disk/by-id/nvme-SAMSUNG_MZ1LB1T9HALS-00007_S436NA0N639078"
              - name: "/dev/disk/by-id/nvme-SAMSUNG_MZ1LB1T9HALS-00007_S436NA0N665541"
          - name: talosm02
            devices:
              - name: "/dev/disk/by-id/nvme-MZ1LB1T9HBLS-000FB_S5XANE0NC09500"
              - name: "/dev/disk/by-id/nvme-SAMSUNG_MZ1LB1T9HALS-00007_S436NA0N910125"
          - name: talosm03
            devices:
              - name: "/dev/disk/by-id/nvme-MZ1LB1T9HBLS-000FB_S5XANA0T113526"
              - name: "/dev/disk/by-id/nvme-SAMSUNG_MZ1LB1T9HALS-00007_S436NA0N910040"
      placement:
        mgr: &placement
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: Exists
        mon: *placement
      resources:
        mgr:
          requests:
            cpu: 100m
            memory: 512Mi
          # Raised 2Gi -> 4Gi 2026-06-19. The ACTIVE mgr leaks ~0.05Gi/day
          # (modules/maps/metrics; standby stays flat ~0.5Gi), so it climbed
          # to 2Gi in ~2wk and got cgroup-OOMKilled (node had 78Gi free — a
          # per-container limit, not node pressure). 4Gi pushes the self-heal
          # restart cycle to ~8wk. A bigger limit only delays the leak; the
          # real fix is finding the leaking module (likely prometheus/dashboard).
          limits:
            memory: 4Gi
        mon:
          requests:
            cpu: 50m
            memory: 512Mi
          limits:
            memory: 1Gi
        osd:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 6Gi
        mgr-sidecar:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
      # ── CephX key hygiene (2026-08-20, issue #2538) ──
      # Ceph 20.2.4 flags the legacy `aes` cipher (CVE-2025-30156): the two
      # ERR-level AUTH_INSECURE_{SERVICE_KEY_TYPE,SERVICE_TICKETS} checks put the
      # cluster in HEALTH_ERR and block Rook's upgrade gate (the 2026-08-20
      # storm). Rotating DAEMON keys to aes256k is the upstream-prescribed fix
      # and does not affect client connections. To rotate again later (or after
      # adding daemons), bump keyGeneration by 1 — never lower it.
      security:
        cephx:
          daemon:
            keyType: aes256k
            keyRotationPolicy: KeyGeneration
            keyGeneration: 1
          # rbd-mirror-peer key is unused (no mirroring deployed) but counts
          # toward AUTH_INSECURE_CLIENT_KEY_TYPE; rotating it is free.
          rbdMirrorPeer:
            keyType: aes256k
            keyRotationPolicy: KeyGeneration
            keyGeneration: 1
          # csi: DELIBERATELY left at the chart default (aes). aes256k CSI keys
          # require Linux kernel >= 7.0 on every node and Talos is on 6.18.x —
          # a premature rotation would fail every NEW rbd/cephfs mount. When a
          # 7.0+ Talos kernel lands: rotate csi with keyType aes256k +
          # keepPriorKeyCountMax: 1, then drain each node to remount, then set
          # allowedCiphers: [aes256k] and drop the mutes below (issue #2538).
      healthCheck:
        muteHealthWarning:
          # Long-tail legacy-cipher WARNs that CANNOT clear until the CSI keys
          # rotate (kernel >= 7.0, see security.cephx.csi above). Muted in git —
          # declarative and permanent, unlike the runtime `ceph health mute`
          # 4-week TTLs used during the 2026-08-20 incident (which would have
          # silently expired ~09-17 and re-fired CephHealthWarning).
          AUTH_INSECURE_CLIENT_KEY_TYPE:
            policy: mute
          AUTH_INSECURE_KEYS_ALLOWED:
            policy: mute
          AUTH_INSECURE_KEYS_CREATABLE:
            policy: mute
          # Set by Rook itself during the 2026-08-20 daemon rotation: mons carry
          # --mon-auth-emergency-allowed-ciphers=aes so the four still-aes CSI
          # clients keep authenticating after auth_service_cipher moved to
          # aes256k. Expected and REQUIRED until the kernel-gated CSI rotation
          # (issue #2538); clears when that lands and the flag is removed.
          AUTH_EMERGENCY_CIPHERS_SET:
            policy: mute
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          parameters:
            imageFormat: "2"
            imageFeatures: layering
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete
    cephFileSystems:
      - name: &cephFileSystemName ceph-filesystem
        spec:
          metadataPool:
            replicated:
              size: 3
          dataPools:
            - failureDomain: host
              replicated:
                size: 3
              name: data0
          metadataServer:
            activeCount: 1
            activeStandby: true
            priorityClassName: system-cluster-critical
            placement:
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: ceph-mds
                      app.kubernetes.io/part-of: *cephFileSystemName
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
        storageClass:
          enabled: true
          isDefault: false
          name: ceph-filesystem
          pool: data0
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          parameters:
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
            csi.storage.k8s.io/fstype: ext4
    cephFileSystemVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-filesystem
      isDefault: false
      deletionPolicy: Delete
    cephObjectStores:
      - name: ceph-objectstore
        spec:
          metadataPool:
            failureDomain: host
            replicated:
              size: 3
          dataPool:
            failureDomain: host
            erasureCoded:
              dataChunks: 2
              codingChunks: 1
          preservePoolsOnDelete: true
          gateway:
            hostNetwork: false
            port: 80
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi
            instances: 2
            priorityClassName: system-cluster-critical
          healthCheck:
            bucket:
              interval: 60s
        storageClass:
          enabled: true
          name: ceph-bucket
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
          parameters:
            region: us-east-1
        ingress:
          enabled: true
          annotations:
            external-dns.alpha.kubernetes.io/target: internal.haynesops
            nginx.ingress.kubernetes.io/proxy-body-size: "0"
            nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
          ingressClassName: traefik-internal
          host:
            name: rgw.haynesops.com
            path: /
