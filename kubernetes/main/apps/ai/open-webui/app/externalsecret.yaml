---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: openwebui-secret
    template:
      engineVersion: v2
      data:
        # Index-matched to the HelmRelease's `openaiBaseApiUrls` (which the chart
        # renders with the Pipelines endpoint prepended): Open WebUI splits both
        # lists on `;` and zips them, so they must be the same length and order.
        # 1Password holds the two real keys — Pipelines, then api.openai.com —
        # already `;`-joined. `none` is the third slot, for
        # llama-server.ai.svc.cluster.local:8080/v1: llama.cpp runs without
        # `--api-key` and ignores Authorization, but Open WebUI still needs a
        # non-empty entry to keep the lists aligned. Keep this in step with the
        # URL list; a placeholder is not a secret and stays out of 1Password.
        OPENAI_API_KEYS: "{{ .OPENAI_API_KEYS }};none"
        OAUTH_CLIENT_ID: "{{ .OAUTH_CLIENT_ID }}"
        OAUTH_CLIENT_SECRET: "{{ .OAUTH_CLIENT_SECRET }}"
        OPENWEBUI_API_KEY: "{{ .OPENWEBUI_API_KEY }}"
  dataFrom:
    - extract:
        key: openwebui