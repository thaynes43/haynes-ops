---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta1.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  chart:
    spec:
      # https://github.com/open-webui/helm-charts/releases
      chart: open-webui
      version: 10.2.1
      sourceRef:
        kind: HelmRepository
        name: open-webui
  interval: 15m
  timeout: 5m
  releaseName: open-webui
  values: # found here https://github.com/open-webui/helm-charts/blob/main/charts/open-webui/values.yaml
    # -- Automatically install Ollama Helm chart from https://otwld.github.io/ollama-helm/. Use [Helm Values](https://github.com/otwld/ollama-helm/#helm-values) to configure
    ollama:
      enabled: false

    # -- A list of Ollama API endpoints. These can be added in lieu of automatically installing the Ollama Helm chart, or in addition to it.
    ollamaUrls: [http://ollama-prime.ai.svc.cluster.local:11434]

    # -- OpenAI-compatible endpoints, in the order Open WebUI indexes them.
    # The chart prepends the Pipelines service endpoint itself (`pipelines.enabled`
    # is true, so the rendered value is
    # `http://open-webui-pipelines.ai.svc.cluster.local:9099;<these>`), so list only
    # the endpoints after it here.
    #
    # This used to be spelled out as an `OPENAI_API_BASE_URLS` entry under
    # extraEnvVars, which made the chart emit the variable TWICE (once from its own
    # `openaiBaseApiUrl` default, once from extraEnvVars) and left the container
    # relying on last-one-wins. Two entries with the same name and *different*
    # values is a trap, so the list moved here: the chart now emits exactly one.
    #
    # ⚠️ Index-matched to `OPENAI_API_KEYS` — Open WebUI splits both on `;` and
    # zips them (config.py `openai.api_base_urls` / `openai.api_keys`). The key list
    # is built in app/externalsecret.yaml: two real keys from 1Password (Pipelines,
    # api.openai.com) plus a `none` placeholder for llama-server, which serves
    # without `--api-key` and ignores Authorization. Add or reorder a URL here and
    # the secret template must move with it.
    openaiBaseApiUrls:
      - https://api.openai.com/v1
      # The resident local model: llama.cpp server, alias `muse-glimmer-30b`
      # (owner ruling 2026-09-22, haynes-ops#2960 — 3090 #1, VM bus 02:00.0,
      # the cool slot; see llama-server's helmrelease for why).
      - http://llama-server.ai.svc.cluster.local:8080/v1

    annotations:
      reloader.stakater.com/auto: "true"

    ingress:
      enabled: true
      class: traefik-external
      annotations:
        external-dns.kubernetes.io/target: ingress-ext.haynesnetwork.com
        # Homepage
        gethomepage.dev/href: &url "https://ai.haynesnetwork.com"
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: AI
        gethomepage.dev/name: Open WebUI
        gethomepage.dev/description: Chat UI for Ollama + OpenAI
        gethomepage.dev/icon: open-webui
        gethomepage.dev/app: open-webui
        gethomepage.dev/siteMonitor: "http://open-webui.ai.svc.cluster.local:80"
      host: ai.haynesnetwork.com
      tls: true
      existingSecret: certificate-haynesnetwork

    persistence:
      enabled: true
      existingClaim: open-webui

    # Probes (2026-08-12): uvicorn hung during the 08-06 talosm02/Ceph event and the pod sat
    # Running-but-dead for 6 days — with no probes there was no self-heal, and the gatus external
    # check passed on timeout. Startup probe gives slow cold starts (~5 min) room before liveness arms.
    startupProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 5
      failureThreshold: 60
    livenessProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 4
    readinessProbe:
      httpGet:
        path: /health/db
        port: http
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3

    extraEnvVars:
      GLOBAL_LOG_LEVEL:
        value: "DEBUG"
      # The URL list lives in `openaiBaseApiUrls` above, not here — see the note
      # there. This is the matching key list, assembled in app/externalsecret.yaml.
      OPENAI_API_KEYS:
        valueFrom:
          secretKeyRef:
            name: openwebui-secret
            key: OPENAI_API_KEYS
      OPENID_PROVIDER_URL:
        value: "https://authentik.haynesnetwork.com/application/o/open-webui/.well-known/openid-configuration"
      OAUTH_CLIENT_ID:
        valueFrom:
          secretKeyRef:
            name: openwebui-secret
            key: OAUTH_CLIENT_ID
      OAUTH_CLIENT_SECRET:
        valueFrom:
          secretKeyRef:
            name: openwebui-secret
            key: OAUTH_CLIENT_SECRET
      OAUTH_PROVIDER_NAME:
        value: "authentik"
      ENABLE_OAUTH_SIGNUP:
        value: "true"
      ENABLE_LOGIN_FORM:
        value: "false"
      DEFAULT_USER_ROLE:
        value: "user"
      # OIDC group sync (PLAN-021 / PLAN-026 portal model, 2026-07-10): request the `groups`
      # scope and sync OWUI group membership from Authentik's groups claim on every login, so
      # `family` (large-model access) follows Authentik — no per-platform user management. The
      # Authentik-side `hnet-groups` scope mapping + `family` group are already live; membership
      # is API/app-owned (NOT blueprinted) so the future haynesnetwork portal can write it.
      # Group CREATION stays off — OWUI only syncs into groups that already exist (family exists).
      OAUTH_SCOPES:
        value: "openid email profile groups"
      ENABLE_OAUTH_GROUP_MANAGEMENT:
        value: "true"
      OAUTH_GROUP_CLAIM:
        value: "groups"
      # ComfyUI image generation (2026-09-21; device pin revised 2026-09-22).
      # The SelectXDevice nodes in the graphs say `gpu:0` because ComfyUI now
      # sees exactly ONE card: the owner ruling of 2026-09-22 (haynes-ops#2960)
      # pins the ComfyUI container to 3090 #0 (GPU-18bf6eab-…, VM bus 01:00.0)
      # with NVIDIA_VISIBLE_DEVICES, and the other 3090 belongs to llama-server.
      # `gpu:0` just means "the one visible card", so it survived the 2026-09-22
      # role swap unchanged (ComfyUI took the thermally-limited slot so the chat
      # LLM could have the cool one — see #3052 and comfyui's own helmrelease).
      # The graphs said `gpu:1` only back when the container could see both.
      # ~35-50 s warm at 25
      # steps, against the ~477 s the old 50-step Qwen-Image-2512 graph took.
      # Full write-up + the once-only admin step:
      # resources/PLAN-021-ai-config.md section (f).
      #
      # ⚠️ PersistentConfig: every var below is a PersistentConfig in Open WebUI
      # — the env value only SEEDS the database, and a value already stored in
      # the `config` table wins on every later start. This instance already has
      # image_generation persisted (engine/enable/base_url/workflow/nodes were
      # saved on 2026-07-10), so these vars are the declarative record + the DR
      # seed for a rebuilt PVC; they do NOT change the live instance until the
      # admin applies them once (PLAN-021 f, "Applying it to the live instance").
      ENABLE_IMAGE_GENERATION:
        value: "true"
      IMAGE_GENERATION_ENGINE:
        value: "comfyui"
      COMFYUI_BASE_URL:
        value: "http://comfyui.ai.svc.cluster.local:8188"
      # Injected into the graph's UNETLoader (node 2) via the `model` mapping in
      # nodes.json, so it MUST be an exact filename from ComfyUI's unet list.
      # The CLIP + VAE are pinned to the Qwen-Image-2.1 pair, so anything other
      # than a Qwen-Image-2.1 UNET here will fail graph validation.
      IMAGE_GENERATION_MODEL:
        value: "qwen_image_2.1_int8_convrot.safetensors"
      IMAGE_SIZE:
        value: "1024x1024"
      IMAGE_STEPS:
        value: "25"
      # The graph and the Open WebUI-field -> node mapping, kept as reviewable
      # JSON files under app/comfyui/ (kustomize builds the ConfigMap).
      COMFYUI_WORKFLOW:
        valueFrom:
          configMapKeyRef:
            name: open-webui-comfyui-workflow
            key: generate-workflow.json
      COMFYUI_WORKFLOW_NODES:
        valueFrom:
          configMapKeyRef:
            name: open-webui-comfyui-workflow
            key: generate-nodes.json
      # Image EDIT (the "Edit Image" half of Admin -> Settings -> Images).
      # ComfyUI is one of the three engines 0.7.2 offers there (OpenAI / ComfyUI
      # / Gemini); the graph is the same Qwen-Image-2.1 stack on gpu:0 with a
      # LoadImage reference frame instead of an empty latent. Open WebUI POSTs
      # the attached image to ComfyUI's /api/upload/image first and then patches
      # the returned filename into node 1.
      #
      # The edit mapping is deliberately only image/prompt/seed — see
      # resources/PLAN-021-ai-config.md: 0.7.2's edit path never populates
      # steps/n/width/height (they arrive as None and would be written into the
      # graph as null), and ComfyUIEditImageForm has no negative_prompt field at
      # all, so mapping it raises. Steps stay at the graph's literal 25.
      ENABLE_IMAGE_EDIT:
        value: "true"
      IMAGE_EDIT_ENGINE:
        value: "comfyui"
      # Inert unless a `model` entry is added to edit-nodes.json (nothing injects
      # it today); kept here so the value is already right if one ever is.
      IMAGE_EDIT_MODEL:
        value: "qwen_image_2.1_int8_convrot.safetensors"
      IMAGES_EDIT_COMFYUI_BASE_URL:
        value: "http://comfyui.ai.svc.cluster.local:8188"
      IMAGES_EDIT_COMFYUI_WORKFLOW:
        valueFrom:
          configMapKeyRef:
            name: open-webui-comfyui-workflow
            key: edit-workflow.json
      IMAGES_EDIT_COMFYUI_WORKFLOW_NODES:
        valueFrom:
          configMapKeyRef:
            name: open-webui-comfyui-workflow
            key: edit-nodes.json