---
# One no-load power-limit write on Card C. The soak load runs in its own unprivileged Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: egpu-test-cap-cardc-20261030-200w
  namespace: ai
  labels: {app: gpu-power-setter}
  annotations: {haynes-ops/op: "221", haynes-ops/gpu: "GPU-d8a856f1-f955-f683-bc24-654561496774"}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels: {app: gpu-power-setter}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      nodeSelector: {kubernetes.io/hostname: "talosw01"}
      securityContext: {runAsUser: 0, runAsGroup: 0, runAsNonRoot: false}
      containers:
        - name: power-cap
          image: ghcr.io/thaynes43/comfyui:0.39.0-2@sha256:991867f5dafc1eddc9ed70b307d8bf1d2d91c50f53a428a6315e8fd7dbe1a61b
          command: ["/bin/sh", "-c"]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"], add: ["SYS_ADMIN"]}}
          env:
            - {name: NVIDIA_VISIBLE_DEVICES, value: "GPU-d8a856f1-f955-f683-bc24-654561496774"}
            - {name: NVIDIA_DRIVER_CAPABILITIES, value: "utility"}
            - {name: HOME, value: /tmp}
            - {name: TARGET_W, value: "200"}
            - name: POD_NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          args:
            - |
              # Card C only, target fixed above. No CUDA context, model or other GPU.
              set -eu
              export LC_ALL=C
              gpu=GPU-d8a856f1-f955-f683-bc24-654561496774
              fail() { echo "card-c-power: $*" >&2; exit 1; }
              smi() { timeout 15 nvidia-smi -i "$gpu" "$@"; }
              [ "$POD_NODE_NAME" = talosw01 ] || fail 'refusing another node'
              # The runtime rewrites a pinned UUID to "void" under utility capabilities.
              case "$NVIDIA_VISIBLE_DEVICES" in
                "$gpu"|void) ;;
                *) fail "refusing visible-device selection '$NVIDIA_VISIBLE_DEVICES'" ;;
              esac
              q() { smi --query-gpu=uuid,persistence_mode,power.limit,enforced.power.limit --format=csv,noheader,nounits; }
              state=$(q) || fail 'GPU state query failed'
              echo "card-c-power: before $state"
              [ "$(printf '%s\n' "$state" | cut -d, -f1 | tr -d ' ')" = "$gpu" ] || fail 'unexpected GPU identity'
              processes=$(smi --query-compute-apps=pid --format=csv,noheader,nounits) || fail 'cannot verify idle GPU'
              [ -z "$processes" ] || fail 'GPU has compute processes; no changes made'
              smi -pl "$TARGET_W" || fail 'power limit write failed'
              state=$(q) || fail 'read-back failed'
              echo "card-c-power: after $state"
              printf '%s\n' "$state" | awk -F, -v t="$TARGET_W" '{ exit !($3+0 == t && $4+0 == t) }' || fail 'read-back does not match target'
              echo "card-c-power: verified $TARGET_W W; no GPU load started"
