apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wan-video
  namespace: ai
spec:
  targetNamespace: ai
  commonMetadata:
    labels:
      app.kubernetes.io/name: wan-video
  dependsOn:
    - name: nvidia-device-plugin
      namespace: kube-system
  path: ./kubernetes/main/apps/ai/wan-video/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  wait: false
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: wan-video
      GATUS_SUBDOMAIN: video
      GATUS_PATH: /ready
      GATUS_STATUS_MAX: "300"
