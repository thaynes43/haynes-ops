apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: wan-local-model-provision
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: wan-local-model-provision
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: ANY}
          rules:
            dns:
              - matchName: huggingface.co
              - matchPattern: "**.cdn.hf.co"
    - toFQDNs:
        - matchName: huggingface.co
        - matchPattern: "**.cdn.hf.co"
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
