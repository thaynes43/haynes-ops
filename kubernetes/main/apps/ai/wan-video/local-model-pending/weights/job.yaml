apiVersion: batch/v1
kind: Job
metadata:
  name: wan-local-model-provision
spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 0
  podReplacementPolicy: Failed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wan-local-model-provision
    spec:
      nodeSelector:
        kubernetes.io/hostname: talosw01
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: provision
          image: docker.io/library/python:3.12.16-slim-bookworm@sha256:1475c4f5b6bcb7d35e57661d6f5d7429ec4041275633c15f2b49350ac898276d
          command: [python3, -B, /config/provision.py]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "2", memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: workspace, mountPath: /workspace/local-model-weights, subPath: local-model-weights}
      volumes:
        - name: config
          configMap:
            name: wan-local-model-provision
        - name: workspace
          persistentVolumeClaim:
            claimName: wan-video
