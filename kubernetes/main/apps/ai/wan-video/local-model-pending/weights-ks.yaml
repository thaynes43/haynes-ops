apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wan-local-model-weights
  namespace: ai
spec:
  targetNamespace: ai
  dependsOn:
    - name: wan-local-model-download-policy
    - name: wan-video
  path: ./kubernetes/main/apps/ai/wan-video/local-model-pending/weights
  prune: true
  interval: 30m
  timeout: 33m
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: wan-local-model-provision
      namespace: ai
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
