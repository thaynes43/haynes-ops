---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
components:
  - ../../../../../shared/components/common/repos/app-template
configMapGenerator:
  # The predecessor pod uses this exact config if it needs to restart before Helm upgrades.
  - name: studio-render-requirements
    files:
      - requirements.txt=requirements-op964.txt
  - name: studio-render-environment-op967
    files:
      - requirements.txt
      - render-init.py
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
