---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Haynes Studio CPU render worker (decals, keying, compositing, encoding) on
# talosw01, next to wan-video. Tom approved up to 24 vCPUs on talosw01 (studio
# decision D18, 2026-11-03); the host keeps 8 threads for Ceph and nas01.
# Low priority: a small CPU request (cpu.weight) yields under contention, the
# dev-env-agent class never preempts, and jobs run under nice. Media lives on
# gasha01 NFS (decision D4) under data/studio. Agents drive it with
# kubectl cp/exec; it serves nothing. The Python env (pinned in
# requirements.txt) lives on the NFS share so the root filesystem stays read-only.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: studio-render
  namespace: ai
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      studio-render:
        # No Reloader: a pin bump (Renovate) must not restart the pod mid-render. The new
        # env is built on the next natural restart.
        strategy: Recreate
        pod:
          nodeSelector:
            kubernetes.io/hostname: talosw01
          priorityClassName: dev-env-agent
          automountServiceAccountToken: false
        containers:
          app:
            image:
              repository: docker.io/library/python
              tag: 3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
            command: [sh, -c]
            args:
              - |
                set -e
                # The venv is keyed by the Python version and the pinned requirements, so a
                # tag bump or a requirements change builds a fresh one beside the old.
                py=$(python -c 'import sys; print("%d%d" % sys.version_info[:2])')
                req=$(sha256sum /config/requirements.txt | cut -c1-12)
                V=/studio/.venv/py$py-$req
                # Only this worker uses /studio/.venv: drop envs from older pins.
                for old in /studio/.venv/*; do [ "$old" = "$V" ] || rm -rf "$old"; done
                if [ ! -f "$V/.complete" ]; then
                  rm -rf "$V"; python -m venv "$V"
                  "$V/bin/pip" install --no-cache-dir -q -r /config/requirements.txt
                  touch "$V/.complete"
                fi
                ln -sfn "$V" /tmp/venv
                touch /tmp/ready
                exec sleep infinity
            env:
              HOME: /tmp
              PATH: /tmp/venv/bin:/usr/local/bin:/usr/bin:/bin
              PYTHONDONTWRITEBYTECODE: "1"
              OMP_NUM_THREADS: "24"
              OPENBLAS_NUM_THREADS: "24"
            probes:
              liveness: {enabled: false}
              startup: {enabled: false}
              readiness:
                enabled: true
                custom: true
                spec:
                  exec: {command: [test, -f, /tmp/ready]}
                  periodSeconds: 10
            resources:
              requests: {cpu: 250m, memory: 1Gi}
              limits: {cpu: "24", memory: 32Gi}
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    defaultContainerOptions:
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
    persistence:
      studio:
        type: nfs
        server: gasha01.haynesnetwork
        path: /hdd-nfs-repl
        globalMounts:
          - path: /studio
            subPath: data/studio
      config:
        type: configMap
        name: studio-render-requirements
        globalMounts:
          - path: /config
            readOnly: true
      tmp:
        type: emptyDir
        sizeLimit: 8Gi
        globalMounts:
          - path: /tmp
