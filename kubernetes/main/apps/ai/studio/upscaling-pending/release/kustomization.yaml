apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - release.yaml
replacements:
  - source:
      kind: ConfigMap
      name: studio-upscaling-release
      fieldPath: data.image
    targets:
      - select:
          kind: Job
          name: studio-upscaling-provision-00|studio-upscaling-smoke-00|studio-upscaling-compare-00
        fieldPaths:
          - spec.template.spec.containers.[name=upscaling].image
          - spec.template.spec.containers.[name=upscaling].env.[name=STUDIO_UPSCALING_IMAGE].value
      - select:
          kind: Job
          name: studio-upscaling-compare-00
        fieldPaths:
          - spec.template.spec.initContainers.[name=reserve-output].image
  - source:
      kind: ConfigMap
      name: studio-upscaling-release
      fieldPath: data.allocation
    targets:
      - select:
          kind: Job
          name: studio-upscaling-provision-00
        fieldPaths:
          - spec.template.spec.containers.[name=upscaling].env.[name=STUDIO_UPSCALING_ALLOCATION].value
      - select:
          kind: Job
          name: studio-upscaling-smoke-00|studio-upscaling-compare-00
        fieldPaths:
          - spec.template.spec.containers.[name=upscaling].volumeMounts.[name=weights].subPath
        options:
          delimiter: /
          index: 3
  - source:
      kind: ConfigMap
      name: studio-upscaling-release
      fieldPath: data.storeSubPath
    targets:
      - select:
          kind: Job
          name: studio-upscaling-compare-00
        fieldPaths:
          - metadata.annotations.[studio.haynesops.com/store-sub-path]
  - source:
      kind: ConfigMap
      name: studio-upscaling-release
      fieldPath: data.memoryRequest
    targets:
      - select:
          kind: Job
          name: studio-upscaling-smoke-00|studio-upscaling-compare-00
        fieldPaths:
          - spec.template.spec.containers.[name=upscaling].resources.requests.memory
  - source:
      kind: ConfigMap
      name: studio-upscaling-release
      fieldPath: data.memoryLimit
    targets:
      - select:
          kind: Job
          name: studio-upscaling-smoke-00|studio-upscaling-compare-00
        fieldPaths:
          - spec.template.spec.containers.[name=upscaling].resources.limits.memory
  - source:
      kind: ConfigMap
      name: studio-upscaling-release
      fieldPath: data.allocation
      options:
        delimiter: "-"
        index: 5
    targets:
      - select:
          kind: Job
          name: studio-upscaling-provision-00|studio-upscaling-smoke-00|studio-upscaling-compare-00
        fieldPaths:
          - metadata.name
        options:
          delimiter: "-"
          index: 3
