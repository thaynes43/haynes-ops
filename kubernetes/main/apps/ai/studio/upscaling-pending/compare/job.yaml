apiVersion: batch/v1
kind: Job
metadata:
  # The runbook assigns a fresh name and supplies the authorized input and digest.
  name: studio-upscaling-compare-00
  annotations:
    studio.haynesops.com/store-sub-path: replaced-by-release
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: studio-upscaling-compare
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: talosw01
      priorityClassName: dev-env-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        supplementalGroups: [1000]
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: reserve-output
          image: image-replaced-by-release
          command: [python, -B, -c]
          args: [script-replaced-by-kustomize]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: jobs, mountPath: /jobs, subPath: data/studio/jobs}
      containers:
        - name: upscaling
          image: image-replaced-by-release
          command: [studio-upscaling, compare]
          args: [--proxy, proxy-locator-required, --frame-index, frame-index-required]
          env:
            - {name: STUDIO_UPSCALING_IMAGE, value: image-replaced-by-release}
          resources:
            # Use the measuring allowance until the smoke establishes memory bounds.
            requests: {cpu: 250m, memory: replaced-by-release}
            limits: {cpu: "2", memory: replaced-by-release}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: scratch, mountPath: /upscaling}
            - name: source
              mountPath: /store/source-shard
              subPath: private-input-directory-replaced-by-runbook
              readOnly: true
            - name: master
              mountPath: /store/master-shard
              subPath: private-master-directory-replaced-by-runbook
              readOnly: true
            - name: jobs
              mountPath: /output
              subPath: data/studio/jobs/output-directory-replaced-by-runbook
            - name: weights
              mountPath: /weights
              subPath: data/studio/jobs/allocation-replaced-by-release/weights
              readOnly: true
      volumes:
        - name: scratch
          emptyDir: {sizeLimit: 256Mi}
        - name: weights
          nfs:
            server: gasha01.haynesnetwork
            path: /hdd-nfs-repl
            readOnly: true
        - name: source
          nfs:
            server: gasha01.haynesnetwork
            path: /hdd-nfs-repl
            readOnly: true
        - name: master
          nfs:
            server: gasha01.haynesnetwork
            path: /hdd-nfs-repl
            readOnly: true
        - name: jobs
          nfs:
            server: gasha01.haynesnetwork
            path: /hdd-nfs-repl
