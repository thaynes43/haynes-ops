apiVersion: batch/v1
kind: Job
metadata:
  # The runbook assigns a fresh name and supplies the authorized input and digest.
  name: studio-upscaling-compare
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: studio-upscaling-compare
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: talosw01
      priorityClassName: dev-env-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: upscaling
          image: image-replaced-by-release
          command: [studio-upscaling, compare]
          args: [--input, input-required, --input-sha256, sha256-required, --allocation, allocation-required]
          env:
            - {name: STUDIO_UPSCALING_IMAGE, value: image-replaced-by-release}
          resources:
            # Use the measuring allowance until the smoke establishes memory bounds.
            requests: {cpu: 250m, memory: replaced-by-release}
            limits: {cpu: "2", memory: replaced-by-release}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: scratch, mountPath: /upscaling}
            - {name: source, mountPath: /studio-source, subPath: data/studio, readOnly: true}
            - {name: jobs, mountPath: /jobs, subPath: data/studio/jobs}
            - name: weights
              mountPath: /weights
              subPath: data/studio/jobs/allocation-replaced-by-release/weights
              readOnly: true
      volumes:
        - name: scratch
          emptyDir: {sizeLimit: 256Mi}
        - name: weights
          nfs:
            server: gasha01.haynesnetwork
            path: /hdd-nfs-repl
            readOnly: true
        - name: source
          nfs:
            server: gasha01.haynesnetwork
            path: /hdd-nfs-repl
            readOnly: true
        - name: jobs
          nfs:
            server: gasha01.haynesnetwork
            path: /hdd-nfs-repl
