apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio-worker
spec:
  template:
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: worker
          volumeMounts:
            - {name: upscale-scratch, mountPath: /upscaling}
        - name: upscaling
          image: image-replaced-by-release
          command: [studio-upscaling, serve]
          env:
            - {name: STUDIO_UPSCALING_IMAGE, value: image-replaced-by-release}
          resources:
            requests: {cpu: 250m, memory: replaced-by-release}
            limits: {cpu: "2", memory: replaced-by-release}
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            exec: {command: [studio-upscaling, ready]}
            periodSeconds: 5
            failureThreshold: 8
            timeoutSeconds: 3
          readinessProbe:
            exec: {command: [studio-upscaling, ready]}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: [studio-upscaling, ready]}
            periodSeconds: 5
            failureThreshold: 8
            timeoutSeconds: 3
          volumeMounts:
            - {name: upscale-scratch, mountPath: /upscaling}
            - name: weights
              mountPath: /weights
              subPath: data/studio/jobs/allocation-replaced-by-release/weights
              readOnly: true
      volumes:
        - name: upscale-scratch
          emptyDir: {sizeLimit: 256Mi}
        - name: weights
          nfs:
            server: gasha01.haynesnetwork
            path: /hdd-nfs-repl
            readOnly: true
