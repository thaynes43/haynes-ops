apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
resources:
  - job.yaml
components:
  - ../release
configMapGenerator:
  - name: studio-matting-quality-script
    files:
      - trial.py
    options:
      disableNameSuffixHash: true
      annotations:
        config.kubernetes.io/local-config: "true"
replacements:
  - source:
      kind: ConfigMap
      name: studio-matting-quality-script
      fieldPath: data.[trial.py]
    targets:
      - select:
          kind: Job
          name: studio-matting-quality-template
        fieldPaths:
          - spec.template.spec.containers.[name=matting].args.0
