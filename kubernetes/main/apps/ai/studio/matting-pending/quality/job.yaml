apiVersion: batch/v1
kind: Job
metadata:
  name: studio-matting-quality-template
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: studio-matting-quality
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: talosw01
      priorityClassName: dev-env-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        supplementalGroups: [1000]
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: reserve-output
          image: image-replaced-by-release
          command: [python, -B, -c]
          args: [script-replaced-by-kustomize]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: jobs, mountPath: /jobs, subPath: data/studio/jobs}
      containers:
        - name: matting
          image: image-replaced-by-release
          command: [python, -B, -c]
          args: [script-replaced-by-kustomize]
          env:
            - {name: STUDIO_MATTING_IMAGE, value: image-replaced-by-release}
          resources:
            requests: {cpu: "2", memory: replaced-by-release}
            limits: {cpu: "2", memory: replaced-by-release}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: scratch, mountPath: /matting}
            - name: weights
              mountPath: /weights
              subPath: data/studio/jobs/allocation-replaced-by-release/weights
              readOnly: true
            - name: input
              mountPath: /input
              subPath: private-input-directory-replaced-by-runbook
              readOnly: true
            - name: jobs
              mountPath: /output
              subPath: data/studio/jobs/output-directory-replaced-by-runbook
      volumes:
        - name: scratch
          emptyDir: {sizeLimit: 256Mi}
        - name: weights
          nfs: {server: gasha01.haynesnetwork, path: /hdd-nfs-repl, readOnly: true}
        - name: input
          nfs: {server: gasha01.haynesnetwork, path: /hdd-nfs-repl, readOnly: true}
        - name: jobs
          nfs: {server: gasha01.haynesnetwork, path: /hdd-nfs-repl}
