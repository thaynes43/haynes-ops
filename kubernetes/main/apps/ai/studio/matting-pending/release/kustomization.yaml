apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - release.yaml
replacements:
  - source:
      kind: ConfigMap
      name: studio-matting-release
      fieldPath: data.image
    targets:
      - select:
          kind: Job|Deployment
          name: studio-matting-provision-00|studio-matting-smoke-00|studio-matting-quality-template|studio-matte-worker
        fieldPaths:
          - spec.template.spec.containers.[name=matting].image
          - spec.template.spec.containers.[name=matting].env.[name=STUDIO_MATTING_IMAGE].value
      - select:
          kind: Job
          name: studio-matting-quality-template
        fieldPaths:
          - spec.template.spec.initContainers.[name=reserve-output].image
  - source:
      kind: ConfigMap
      name: studio-matting-release
      fieldPath: data.allocation
    targets:
      - select:
          kind: Job
          name: studio-matting-provision-00
        fieldPaths:
          - spec.template.spec.containers.[name=matting].env.[name=STUDIO_MATTING_ALLOCATION].value
      - select:
          kind: Job|Deployment
          name: studio-matting-smoke-00|studio-matting-quality-template|studio-matte-worker
        fieldPaths:
          - spec.template.spec.containers.[name=matting].volumeMounts.[name=weights].subPath
        options:
          delimiter: /
          index: 3
  - source:
      kind: ConfigMap
      name: studio-matting-release
      fieldPath: data.memoryRequest
    targets:
      - select:
          kind: Job|Deployment
          name: studio-matting-smoke-00|studio-matting-quality-template|studio-matte-worker
        fieldPaths:
          - spec.template.spec.containers.[name=matting].resources.requests.memory
  - source:
      kind: ConfigMap
      name: studio-matting-release
      fieldPath: data.memoryLimit
    targets:
      - select:
          kind: Job|Deployment
          name: studio-matting-smoke-00|studio-matting-quality-template|studio-matte-worker
        fieldPaths:
          - spec.template.spec.containers.[name=matting].resources.limits.memory
  - source:
      kind: ConfigMap
      name: studio-matting-release
      fieldPath: data.allocation
      options:
        delimiter: "-"
        index: 5
    targets:
      - select:
          kind: Job
          name: studio-matting-provision-00|studio-matting-smoke-00
        fieldPaths:
          - metadata.name
        options:
          delimiter: "-"
          index: 3
  - source:
      kind: ConfigMap
      name: studio-matting-release
      fieldPath: data.image
    targets:
      - select: {kind: Deployment, name: studio-matte-worker}
        fieldPaths:
          - spec.template.spec.containers.[name=worker].env.[name=STUDIO_MATTING_IMAGE].value
  - source:
      kind: ConfigMap
      name: studio-matting-release
      fieldPath: data.revision
    targets:
      - select: {kind: Deployment, name: studio-matte-worker}
        fieldPaths:
          - spec.template.spec.containers.[name=worker].env.[name=STUDIO_MATTING_REVISION].value
  - source:
      kind: ConfigMap
      name: studio-matting-release
      fieldPath: data.profileSha256
    targets:
      - select: {kind: Deployment, name: studio-matte-worker}
        fieldPaths:
          - spec.template.spec.containers.[name=worker].env.[name=STUDIO_MATTING_PROFILE_SHA256].value
          - spec.template.spec.containers.[name=matting].env.[name=STUDIO_MATTING_PROFILE_SHA256].value
