apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - release.yaml
replacements:
  - source:
      kind: ConfigMap
      name: studio-matting-release
      fieldPath: data.image
    targets:
      - select:
          kind: Job|Deployment
          name: studio-matting-provision-00|studio-matting-smoke-00-r2|studio-worker
        fieldPaths:
          - spec.template.spec.containers.[name=matting].image
          - spec.template.spec.containers.[name=matting].env.[name=STUDIO_MATTING_IMAGE].value
  - source:
      kind: ConfigMap
      name: studio-matting-release
      fieldPath: data.allocation
    targets:
      - select:
          kind: Job
          name: studio-matting-provision-00
        fieldPaths:
          - spec.template.spec.containers.[name=matting].env.[name=STUDIO_MATTING_ALLOCATION].value
      - select:
          kind: Job|Deployment
          name: studio-matting-smoke-00-r2|studio-worker
        fieldPaths:
          - spec.template.spec.containers.[name=matting].volumeMounts.[name=weights].subPath
        options:
          delimiter: /
          index: 3
  - source:
      kind: ConfigMap
      name: studio-matting-release
      fieldPath: data.allocation
      options:
        delimiter: "-"
        index: 5
    targets:
      - select:
          kind: Job
          name: studio-matting-provision-00|studio-matting-smoke-00-r2
        fieldPaths:
          - metadata.name
        options:
          delimiter: "-"
          index: 3
