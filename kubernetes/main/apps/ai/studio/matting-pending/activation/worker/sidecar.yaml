apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio-matte-worker
spec:
  template:
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: worker
          volumeMounts:
            - {name: matte-scratch, mountPath: /matting}
        - name: matting
          image: image-replaced-by-release
          command: [studio-matting, serve]
          env:
            - {name: STUDIO_MATTING_IMAGE, value: image-replaced-by-release}
            - {name: STUDIO_MATTING_PROFILE_SHA256, value: profile-replaced-by-release}
          resources:
            requests: {cpu: 250m, memory: replaced-by-release}
            limits: {cpu: "2", memory: replaced-by-release}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            exec: {command: [studio-matting, ready]}
            periodSeconds: 5
            failureThreshold: 26
            timeoutSeconds: 3
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          readinessProbe:
            exec:
              command:
                - python
                - -B
                - -c
                - |
                  import os
                  from pathlib import Path
                  from haynes_studio.matting.service import local_call
                  code, ready = local_call(Path("/matting/matte.sock"), "GET", "/v1/ready", timeout=2)
                  raise SystemExit(int(code != 200 or ready.get("profile_sha256") !=
                                       os.environ["STUDIO_MATTING_PROFILE_SHA256"]))
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: [studio-matting, ready]}
            periodSeconds: 5
            failureThreshold: 26
            timeoutSeconds: 3
          volumeMounts:
            - {name: matte-scratch, mountPath: /matting}
            - name: weights
              mountPath: /weights
              subPath: data/studio/jobs/allocation-replaced-by-release/weights
              readOnly: true
      volumes:
        - name: matte-scratch
          emptyDir: {sizeLimit: 256Mi}
        - name: weights
          nfs:
            server: gasha01.haynesnetwork
            path: /hdd-nfs-repl
            readOnly: true
