---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio-matte-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  minReadySeconds: 20
  selector:
    matchLabels:
      app.kubernetes.io/name: studio-matte-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: studio-matte-worker
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      serviceAccountName: studio-matte-worker
      priorityClassName: dev-env-agent
      nodeSelector:
        kubernetes.io/hostname: talosw01
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: ghcr.io/thaynes43/haynes-studio@sha256:c4f06807de8c852426dfd79e996d1e4e9b8859ca44eb2dc683395d5b0dbb1be6
          command: [python, -B, /etc/studio/matte-start.py]
          args: [studio-worker, --lane, matte]
          env:
            - name: STUDIO_API_URL
              value: http://studio-api.ai.svc.cluster.local:8002
            - name: STUDIO_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: studio-matte-worker-token
                  key: STUDIO_WORKER_TOKEN
            - {name: STUDIO_MATTING_IMAGE, value: image-replaced-by-release}
            - {name: STUDIO_MATTING_REVISION, value: revision-replaced-by-release}
            - {name: STUDIO_MATTING_PROFILE_SHA256, value: profile-replaced-by-release}
            - name: STUDIO_STORE_ROOT
              value: /studio
            - name: STUDIO_WORKER_PROGRESS_FILE
              value: /run/studio/worker-progress
            - name: STUDIO_THREADS
              value: "1"
            - name: OMP_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
          startupProbe:
            exec:
              command: [studio-worker, --progress-file, /run/studio/worker-progress, --check-progress, "300"]
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 12
          # The marker covers bounded matting readiness, recovery and staging.
          livenessProbe:
            exec:
              command: [studio-worker, --progress-file, /run/studio/worker-progress, --check-progress, "300"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 1Gi}
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: config
              mountPath: /etc/studio
              readOnly: true
            - name: store
              mountPath: /studio
              subPath: data/studio/api-store-v1
            - name: progress
              mountPath: /run/studio
      volumes:
        - name: config
          configMap:
            name: studio-matte-worker-config
        - name: store
          nfs:
            server: gasha01.haynesnetwork
            path: /hdd-nfs-repl
        - name: progress
          emptyDir:
            sizeLimit: 1Mi
