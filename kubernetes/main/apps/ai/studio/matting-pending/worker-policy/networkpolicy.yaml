---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: studio-matte-worker
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: studio-matte-worker
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: studio-api
      ports:
        - {port: 8002, protocol: TCP}
