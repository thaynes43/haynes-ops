apiVersion: batch/v1
kind: Job
metadata:
  # A new image needs a new immutable weight/profile allocation. The third
  # smoke measures the CPU arena change against the installed artifact hashes.
  name: studio-matting-smoke-00-r3
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: studio-matting-smoke
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: talosw01
      priorityClassName: dev-env-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: matting
          image: image-replaced-by-release
          command: [studio-matting, smoke, --no-cpu-arena]
          env:
            - {name: STUDIO_MATTING_IMAGE, value: image-replaced-by-release}
          resources:
            requests: {cpu: 250m, memory: replaced-by-release}
            limits: {cpu: "2", memory: replaced-by-release}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: scratch, mountPath: /matting}
            - name: weights
              mountPath: /weights
              subPath: data/studio/jobs/allocation-replaced-by-release/weights
              readOnly: true
      volumes:
        - name: scratch
          emptyDir: {sizeLimit: 256Mi}
        - name: weights
          nfs:
            server: gasha01.haynesnetwork
            path: /hdd-nfs-repl
            readOnly: true
