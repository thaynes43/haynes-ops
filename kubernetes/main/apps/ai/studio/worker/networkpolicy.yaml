---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: studio-worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: studio-worker
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    # WorkerRoute authorizes the internal HTTP paths on the Studio API port.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: studio-api
      ports:
        - {port: 8000, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: wan-video
      ports:
        - {port: 8080, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: whisper
      ports:
        - {port: 10300, protocol: TCP}
