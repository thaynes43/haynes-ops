---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: studio-worker
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  minReadySeconds: 20
  selector:
    matchLabels:
      app.kubernetes.io/name: studio-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: studio-worker
    spec:
      automountServiceAccountToken: false
      serviceAccountName: studio-worker
      nodeSelector:
        kubernetes.io/hostname: talosw01
      priorityClassName: dev-env-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: ghcr.io/thaynes43/haynes-studio@sha256:c4f06807de8c852426dfd79e996d1e4e9b8859ca44eb2dc683395d5b0dbb1be6
          command: [studio-worker]
          env:
            - name: STUDIO_API_URL
              value: http://studio-api.ai.svc.cluster.local:8000
            - name: STUDIO_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: studio-worker-token
                  key: STUDIO_WORKER_TOKEN
            - name: STUDIO_WAN_URL
              value: http://wan-video.ai.svc.cluster.local:8080
            - name: STUDIO_WAN_STORY_URL
              value: https://work.haynesnetwork.com/work_packages/362
            - name: STUDIO_ASR_HOST
              value: whisper.ai.svc.cluster.local
            - name: STUDIO_ASR_PORT
              value: "10300"
            - name: STUDIO_STORE_ROOT
              value: /studio
            - name: STUDIO_BUILD_STAGE_ROOT
              value: /build-stage
            - name: STUDIO_BUILD_REVISION
              value: git:0f6ca21e48f8a8e4d6745cba91267c4726733b47
            - name: STUDIO_BUILD_IMAGE_DIGEST
              value: sha256:c4f06807de8c852426dfd79e996d1e4e9b8859ca44eb2dc683395d5b0dbb1be6
            - name: STUDIO_WORKER_PROGRESS_FILE
              value: /run/studio/worker-progress
            - name: STUDIO_THREADS
              value: "2"
          startupProbe:
            exec:
              command: [studio-worker, --check-progress, "1500"]
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 12
          # A healthy Wan clip can take 20 minutes. Its polling refreshes this
          # marker, and the 25-minute budget also covers long local steps.
          livenessProbe:
            exec:
              command: [studio-worker, --check-progress, "1500"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 250m, memory: 2Gi}
            limits: {cpu: "4", memory: 8Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: media
              mountPath: /studio
              subPath: data/studio/api-store-v1
              readOnly: true
            - name: media
              mountPath: /build-stage
              subPath: data/studio/build-stage-v1
            - name: progress
              mountPath: /run/studio
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: media
          nfs:
            server: gasha01.haynesnetwork
            path: /hdd-nfs-repl
        - name: progress
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 8Gi
