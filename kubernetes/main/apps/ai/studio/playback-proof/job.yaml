---
apiVersion: batch/v1
kind: Job
metadata:
  name: studio-verify-playback-1aa9b4736da9
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: studio-playback-proof
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: verify
          image: ghcr.io/thaynes43/haynes-studio@sha256:1aa9b4736da902031613d957d5db3ddd17831c6cc344c5e108d761b485f3501c
          command: [python, /proof/verify.py]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 96Mi}
          volumeMounts:
            - name: keys
              mountPath: /run/studio-playback
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: proof
              mountPath: /proof
              readOnly: true
      volumes:
        - name: keys
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: studio-playback-one-more-meeting-1aa9b4736da9
                  items:
                    - key: token
                      path: one-more-meeting
              - secret:
                  name: studio-playback-winter-menu-1aa9b4736da9
                  items:
                    - key: token
                      path: winter-menu
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
        - name: proof
          configMap:
            name: studio-playback-proof
