---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: studio-worker-registration
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  # Keep this name and its Flux health check tied to the image digest.
  name: studio-register-worker-1aa9b4736da9
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: studio-worker-registration
    spec:
      automountServiceAccountToken: false
      serviceAccountName: studio-worker-registration
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: register
          image: ghcr.io/thaynes43/haynes-studio@sha256:1aa9b4736da902031613d957d5db3ddd17831c6cc344c5e108d761b485f3501c
          command: [studio-api-admin]
          args:
            - worker-token
            - register
            - --worker-id
            - studio-worker
            - --token-file
            - /run/studio-credentials/token
            # The same token is a no-op. A different token (a deliberate rotation:
            # a new Job name with an -rN suffix) revokes the old one and registers
            # the new one, instead of failing with a conflict.
            - --replace
          env:
            - name: STUDIO_DATABASE_SCHEMA
              value: studio
            - name: STUDIO_MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: studio-migrator-db
                  key: STUDIO_MIGRATION_DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 192Mi}
          volumeMounts:
            - name: token
              mountPath: /run/studio-credentials
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: token
          secret:
            secretName: studio-worker-token
            defaultMode: 0440
            items:
              - key: STUDIO_WORKER_TOKEN
                path: token
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
