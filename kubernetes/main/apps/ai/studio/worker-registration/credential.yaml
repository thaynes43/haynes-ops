---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: studio-worker-token
spec:
  length: 64
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - STUDIO_WORKER_TOKEN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: studio-worker-token
spec:
  refreshPolicy: CreatedOnce
  target:
    name: studio-worker-token
    creationPolicy: Owner
    # A pruned or deleted ExternalSecret must not take the registered token with
    # it: a regenerated value would no longer match the registration, and the
    # worker would be refused until the token is rotated on purpose.
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: studio-worker-token
