---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: studio
  annotations:
    external-dns.kubernetes.io/target: internal.haynesops
    kubernetes.io/ingress.class: traefik-internal
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`studio.haynesops.com`) && PathPrefix(`/auth/`)
      priority: 30
      middlewares:
        - name: studio-headers
        - name: studio-auth-rate
      services:
        - name: studio-api
          port: 8000
    - kind: Rule
      match: Host(`studio.haynesops.com`) && PathPrefix(`/v1/`)
      priority: 20
      middlewares:
        - name: studio-headers
      services:
        - name: studio-api
          port: 8000
    - kind: Rule
      match: Host(`studio.haynesops.com`) && !PathRegexp(`^/(healthz|readyz|internal|mcp)(/|$)`)
      priority: 10
      middlewares:
        - name: studio-headers
      services:
        - name: studio-web
          port: 8080
  tls:
    secretName: certificate-haynesops
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: studio-headers
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: no-referrer
    stsSeconds: 31536000
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: studio-auth-rate
spec:
  rateLimit:
    average: 30
    period: 1m
    burst: 10
