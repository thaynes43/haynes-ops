---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: studio-api-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: studio-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: traefik-internal-network
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: studio-mcp
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: studio-worker
      ports:
        - port: 8000
          protocol: TCP
    # Port 8002 accepts only media-worker POST routes. Keep these callers
    # off the public API listener on port 8000.
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [studio-voice-worker, studio-image-worker, studio-matte-worker]
      ports:
        - port: 8002
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: studio-web-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: studio-web
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: traefik-internal-network
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: studio-mcp-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: studio-mcp
  policyTypes: [Ingress]
  ingress:
    # Callers are agent sessions (their own egress policy in dev-env decides
    # whether they can reach this at all) and the studio's own pods. Other
    # workloads in ai have no business here, key or not.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dev-agents
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: studio-api
      ports:
        - port: 8001
          protocol: TCP
