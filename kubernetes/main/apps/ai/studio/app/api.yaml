---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: studio-api
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio-api
  annotations:
    secret.reloader.stakater.com/reload: studio-runtime-db,studio-oidc-client
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: studio-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: studio-api
    spec:
      automountServiceAccountToken: false
      serviceAccountName: studio-api
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: studio-api
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ghcr.io/thaynes43/haynes-studio@sha256:1614b3f8355cd062402646720586a62c252007adb028bf6ba2239d94e4cd6115
          command: [sh, -eu, -c]
          args:
            - |
              # /readyz checks directory freshness. Check NFS publication primitives
              # as this UID before serving, using one directory private to this start.
              python - <<'PY'
              import os
              from pathlib import Path
              from tempfile import TemporaryDirectory

              from haynes_studio.store.local import LocalStore

              probe = Path(os.environ["STUDIO_STORE_ROOT"]) / ".probe"
              probe.mkdir(mode=0o700, exist_ok=True)
              with TemporaryDirectory(dir=probe) as path:
                  store = LocalStore(path)
                  data = b"{}"
                  blob = store.publish(data, scope="library", media_type="application/json")
                  if store.publish(data, scope="library", media_type="application/json") != blob:
                      raise OSError("Studio store could not adopt the existing blob")
                  with store.open(blob.locator) as handle:
                      if handle.read() != data:
                          raise OSError("Studio store read-back failed")
              PY
              exec studio-api serve --host 0.0.0.0 --port 8000
          env:
            - name: STUDIO_DATABASE_SCHEMA
              value: studio
            - name: STUDIO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: studio-runtime-db
                  key: STUDIO_DATABASE_URL
            - name: STUDIO_STORE_ROOT
              value: /studio
            - name: STUDIO_BUILD_REVISION
              value: git:eeeb2a40105ae1e64325063b0aa93c890fdefa43
            - name: STUDIO_BUILD_STAGE_ROOT
              value: /build-stage
            - name: STUDIO_PUBLIC_ORIGIN
              value: https://studio.haynesops.com
            - name: STUDIO_OIDC_ISSUER
              value: https://authentik.haynesnetwork.com/application/o/haynes-studio/
            - name: STUDIO_OIDC_CLIENT_ID
              value: haynes-studio
            - name: STUDIO_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: studio-oidc-client
                  key: STUDIO_OIDC_CLIENT_SECRET
            - name: STUDIO_OIDC_ALLOWED_GROUPS
              value: '["authentik Admins"]'
            - name: STUDIO_GO_LIVE_APPROVER_SUBJECTS
              value: '[]'
            - name: STUDIO_ESCALATION_AUTHORIZATION
              value: person
          ports:
            - name: http
              containerPort: 8000
          lifecycle:
            # The ingress keeps a terminating pod in rotation for a moment. Keep
            # serving while it is removed, then stop: no 502 on a delete or a roll.
            preStop:
              sleep: {seconds: 8}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            # The first request starts the store check and returns 503.
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 6
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 160Mi}
            limits: {memory: 640Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: media
              mountPath: /studio
              subPath: data/studio/api-store-v1
            - name: media
              mountPath: /build-stage
              subPath: data/studio/build-stage-v1
            - name: tmp
              mountPath: /tmp
        - name: media-worker-routes
          image: ghcr.io/thaynes43/haynes-studio-web@sha256:e53e2d1fc7d2dbb916a58fe1ec6c3822a7eacc7074623cc9f547a51591a46122
          command: [/usr/sbin/nginx]
          args: [-c, /etc/studio-worker-routes/nginx.conf, -g, "daemon off;"]
          ports:
            - name: worker-http
              containerPort: 8002
          lifecycle:
            # The ingress keeps a terminating pod in rotation for a moment. Keep
            # serving while it is removed, then stop: no 502 on a delete or a roll.
            preStop:
              sleep: {seconds: 8}
          readinessProbe:
            tcpSocket: {port: worker-http}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: worker-http}
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 16Mi}
            limits: {memory: 32Mi}
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: media-worker-routes
              mountPath: /etc/studio-worker-routes
              readOnly: true
            - name: media-worker-routes-tmp
              mountPath: /tmp
      volumes:
        - name: media
          nfs:
            server: gasha01.haynesnetwork
            path: /hdd-nfs-repl
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: media-worker-routes
          configMap:
            name: studio-media-worker-routes
        - name: media-worker-routes-tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: studio-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: studio-api
  ports:
    - name: http
      port: 8000
      targetPort: http
    - name: worker-http
      port: 8002
      targetPort: worker-http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: studio-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: studio-api
