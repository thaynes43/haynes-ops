---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio-web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: studio-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: studio-web
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: studio-web
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          image: ghcr.io/thaynes43/haynes-studio-web@sha256:05f112c48a86bd52b5d0b77472c43db8b685de7d34bb98e16327ab72f534c097
          ports:
            - name: http
              containerPort: 8080
          lifecycle:
            # The ingress keeps a terminating pod in rotation for a moment. Keep
            # serving while it is removed, then stop: no 502 on a delete or a roll.
            preStop:
              sleep: {seconds: 8}
          readinessProbe:
            httpGet: {path: /index.html, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /index.html, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 16Mi}
            limits: {memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: studio-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: studio-web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: studio-web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: studio-web
