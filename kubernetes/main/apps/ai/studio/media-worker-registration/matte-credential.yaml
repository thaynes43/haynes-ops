---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: studio-matte-worker-token
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  length: 64
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - STUDIO_WORKER_TOKEN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: studio-matte-worker-token
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshPolicy: CreatedOnce
  target:
    name: studio-matte-worker-token
    # Orphan: the Secret carries no owner reference, so deleting this
    # ExternalSecret does not garbage-collect the registered token. With Owner it
    # would, a new value would be minted, and the worker would be refused until
    # the token is rotated on purpose. Both objects here are also exempt from
    # Flux pruning.
    creationPolicy: Orphan
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: studio-matte-worker-token
