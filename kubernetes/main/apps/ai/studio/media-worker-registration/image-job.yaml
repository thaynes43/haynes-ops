---
apiVersion: batch/v1
kind: Job
metadata:
  # Keep this name and its Flux health check tied to the image digest.
  name: studio-register-image-worker-c4fda0b05f60
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: studio-media-worker-registration
    spec:
      automountServiceAccountToken: false
      serviceAccountName: studio-media-worker-registration
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: register
          image: ghcr.io/thaynes43/haynes-studio@sha256:c4fda0b05f60086d7df542a402d864108f0ec4844d9f81afe6362bba975fd17b
          command: [studio-api-admin]
          args:
            - worker-token
            - register
            - --worker-id
            - studio-image-worker
            - --token-file
            - /run/studio-credentials/token
            # A digest-only upgrade uses the same token. Fail if rotation would be required.
          env:
            - name: STUDIO_DATABASE_SCHEMA
              value: studio
            - name: STUDIO_MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: studio-migrator-db
                  key: STUDIO_MIGRATION_DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 192Mi}
          volumeMounts:
            - name: token
              mountPath: /run/studio-credentials
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: token
          secret:
            secretName: studio-image-worker-token
            defaultMode: 0440
            items:
              - key: STUDIO_WORKER_TOKEN
                path: token
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
