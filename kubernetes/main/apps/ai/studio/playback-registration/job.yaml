---
apiVersion: batch/v1
kind: Job
metadata:
  name: studio-register-playback-1aa9b4736da9
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: studio-playback-registration
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: register
          image: ghcr.io/thaynes43/haynes-studio@sha256:1aa9b4736da902031613d957d5db3ddd17831c6cc344c5e108d761b485f3501c
          command: [sh, -eu, -c]
          args:
            - |
              expiry=$(python -c 'from datetime import UTC, datetime, timedelta; print((datetime.now(UTC) + timedelta(minutes=5)).isoformat())')
              studio-api-admin register --key-file /run/studio-playback/one-more-meeting \
                --production prd_01M7ZGYNHFET1GKR4304FVD4PE --scope read --expires-at "$expiry"
              studio-api-admin register --key-file /run/studio-playback/winter-menu \
                --production prd_01M79V9FC00000000000000001 --scope read --expires-at "$expiry"
          env:
            - name: STUDIO_MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: studio-migrator-db
                  key: STUDIO_MIGRATION_DATABASE_URL
            - name: STUDIO_DATABASE_SCHEMA
              value: studio
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 192Mi}
          volumeMounts:
            - name: keys
              mountPath: /run/studio-playback
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: keys
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: studio-playback-one-more-meeting-1aa9b4736da9
                  items:
                    - key: token
                      path: one-more-meeting
              - secret:
                  name: studio-playback-winter-menu-1aa9b4736da9
                  items:
                    - key: token
                      path: winter-menu
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
