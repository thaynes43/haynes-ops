---
# One-shot proof keys. Unlike the worker's token these should not outlive their
# stage: the Secrets are owned by their ExternalSecrets and nothing here is exempt
# from pruning, so removing this stage from Git removes the generators, the
# ExternalSecrets and, through their owner references, the Secrets. The keys
# themselves expire five minutes after registration and are revoked by hand.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: studio-playback-one-more-meeting-1aa9b4736da9
spec:
  length: 64
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: studio-playback-one-more-meeting-1aa9b4736da9
spec:
  refreshPolicy: CreatedOnce
  target:
    name: studio-playback-one-more-meeting-1aa9b4736da9
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: studio-playback-one-more-meeting-1aa9b4736da9
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: studio-playback-winter-menu-1aa9b4736da9
spec:
  length: 64
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: studio-playback-winter-menu-1aa9b4736da9
spec:
  refreshPolicy: CreatedOnce
  target:
    name: studio-playback-winter-menu-1aa9b4736da9
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: studio-playback-winter-menu-1aa9b4736da9
