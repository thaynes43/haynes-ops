---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: studio-matte-policy
  namespace: ai
spec:
  targetNamespace: ai
  path: ./kubernetes/main/apps/ai/studio/matting-pending/worker-policy
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  prune: true
  deletionPolicy: Orphan
  interval: 30m
  retryInterval: 1m
  timeout: 2m
