  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: studio-segmentation-policy
  namespace: ai
spec:
  targetNamespace: ai
  path: ./kubernetes/main/apps/ai/studio/segmentation-pending/policy
  sourceRef:
    kind: GitRepository
    name: haynes-ops
