---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: studio-migration
  namespace: ai
spec:
  targetNamespace: ai
  dependsOn:
    - name: cloudnative-pg-cluster
      namespace: database
    - name: studio-database
    - name: studio-oidc
  path: ./kubernetes/main/apps/ai/studio/migration
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  prune: true
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: studio-migrate-1614b3f8355c
      namespace: ai
  interval: 30m
  retryInterval: 1m
  timeout: 6m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: studio
  namespace: ai
spec:
  targetNamespace: ai
  # With a shared sourceRef, Flux checks the dependency's Ready state AND its
  # last applied revision against this Git artifact before applying workloads.
  dependsOn:
    - name: studio-migration
  path: ./kubernetes/main/apps/ai/studio/app
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  prune: true
  wait: true
  postBuild:
    substitute:
      APP: studio
      GATUS_PATH: /v1/me
      GATUS_STATUS_MAX: "402"
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: studio-worker-registration
  namespace: ai
spec:
  targetNamespace: ai
  dependsOn:
    - name: studio-migration
    - name: studio-render
  path: ./kubernetes/main/apps/ai/studio/worker-registration
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  prune: true
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: studio-register-worker-1614b3f8355c
      namespace: ai
    # studio-render's Kustomization applies the HelmRelease but does not wait
    # for Helm. Wait here for the offline render app to turn over.
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: studio-render
      namespace: ai
  interval: 30m
  retryInterval: 1m
  timeout: 6m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: studio-worker
  namespace: ai
spec:
  targetNamespace: ai
  dependsOn:
    - name: studio
    - name: studio-worker-registration
  path: ./kubernetes/main/apps/ai/studio/worker
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  prune: true
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: studio-matting-policy
  namespace: ai
spec:
  targetNamespace: ai
  path: ./kubernetes/main/apps/ai/studio/matting-pending/policy
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  prune: true
  interval: 30m
  retryInterval: 1m
  timeout: 2m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: studio-upscaling-policy
  namespace: ai
spec:
  targetNamespace: ai
  path: ./kubernetes/main/apps/ai/studio/upscaling-pending/policy
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  prune: true
  interval: 30m
  retryInterval: 1m
  timeout: 2m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: studio-media-worker-registration
  namespace: ai
spec:
  targetNamespace: ai
  dependsOn:
    - name: studio-migration
  path: ./kubernetes/main/apps/ai/studio/media-worker-registration
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  prune: true
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: studio-register-voice-worker-1614b3f8355c
      namespace: ai
    - apiVersion: batch/v1
      kind: Job
      name: studio-register-image-worker-1614b3f8355c
      namespace: ai
  interval: 30m
  retryInterval: 1m
  timeout: 6m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: studio-media-workers
  namespace: ai
spec:
  targetNamespace: ai
  dependsOn:
    - name: studio
    - name: studio-media-worker-registration
  path: ./kubernetes/main/apps/ai/studio/media-workers
  sourceRef:
    kind: GitRepository
    name: haynes-ops
