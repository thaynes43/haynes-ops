---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: studio-migration
  namespace: ai
spec:
  targetNamespace: ai
  dependsOn:
    - name: cloudnative-pg-cluster
      namespace: database
    - name: studio-database
    - name: studio-oidc
  path: ./kubernetes/main/apps/ai/studio/migration
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  prune: true
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: studio-migrate-8de1942e806c
      namespace: ai
  interval: 30m
  retryInterval: 1m
  timeout: 6m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: studio
  namespace: ai
spec:
  targetNamespace: ai
  # With a shared sourceRef, Flux checks the dependency's Ready state AND its
  # last applied revision against this Git artifact before applying workloads.
  dependsOn:
    - name: studio-migration
  path: ./kubernetes/main/apps/ai/studio/app
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  prune: true
  wait: true
  postBuild:
    substitute:
      APP: studio
      GATUS_PATH: /v1/me
      GATUS_STATUS_MAX: "402"
  interval: 30m
  retryInterval: 1m
  timeout: 5m
