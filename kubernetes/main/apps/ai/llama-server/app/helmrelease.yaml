---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app llama-server
  namespace: ai
spec:
  interval: 30m
  # A cold start reads a ~17 GB GGUF off HDD-backed NFS before the server ever
  # answers /health. The default 5m timed the upgrade out and rolled it back.
  timeout: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    controllers:
      llama-server:
        # Local Jarvis and Phone Assist run on Muse. Card B is on the talosw04
        # OCuLink dock while card C is repadded (#3052). B drops off the bus
        # above ~300 W, so it serves Muse only behind the 250 W power gate below.
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        # One resident model on one card: never two copies during rollout.
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: talosw04
          # Keep the test worker isolated; only this deployment is admitted.
          tolerations:
            - key: haynesops.com/gpu-test
              operator: Equal
              value: "true"
              effect: NoSchedule
          # GPU access comes from the nvidia RuntimeClass, not from an
          # nvidia.com/gpu request: the device plugin hands out *a* card and
          # cannot pin a named one, and nothing else in `ai` claims one either.
          runtimeClassName: nvidia
        initContainers:
          # Runs once per pod startup (including after a node boot), without CUDA
          # load. Requires the separately reviewed, init-only Kyverno exception.
          # Its exit and the independent read-only power-gate must BOTH succeed.
          power-cap:
            image:
              repository: ghcr.io/ggml-org/llama.cpp
              tag: server-cuda-b11096@sha256:0192ab2545efcbe79c240645e34abd8fffbe4813aedcef5a0e3a886ef6d6d82f
            env:
              NVIDIA_VISIBLE_DEVICES: GPU-18bf6eab-c76a-26ba-74c8-76093b705b8b
              # utility mounts nvidia-smi without CUDA, then the runtime rewrites
              # the UUID above to void. The script allows only that rewrite.
              NVIDIA_DRIVER_CAPABILITIES: utility
              POD_NODE_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            # Keep these bytes identical to card-b-power-cap.sh. The scoped
            # capability exception pins their SHA-256 before admitting this init.
            command: ["/bin/sh", "-c"]
            args:
              - |
                #!/bin/sh
                # Card B only. No CUDA context, model, benchmark, other GPU or power-limit increase.
                # Shared by the startup init container and render-job.sh --cap-only.
                # Use bare shell variables: Flux substitutes braced variable syntax in rendered resources.
                set -eu
                export LC_ALL=C
                gpu=GPU-18bf6eab-c76a-26ba-74c8-76093b705b8b

                fail() { echo "card-b-power-cap: $*" >&2; exit 1; }
                smi() { timeout 15 nvidia-smi -i "$gpu" "$@"; }

                [ "$POD_NODE_NAME" = talosw04 ] || fail 'refusing another node'
                # The NVIDIA runtime rewrites a pinned UUID to "void" after mounting that
                # device when NVIDIA_DRIVER_CAPABILITIES=utility. void is that rewrite, not a
                # request for every GPU. Any other value is a different selection and must not
                # reach nvidia-smi. The query below still requires Card B's UUID.
                case "$NVIDIA_VISIBLE_DEVICES" in
                  "$gpu"|void) ;;
                  *) fail "refusing visible-device selection '$NVIDIA_VISIBLE_DEVICES'" ;;
                esac

                read_state() {
                  state=$(smi --query-gpu=uuid,persistence_mode,power.limit,enforced.power.limit --format=csv,noheader,nounits) || fail 'GPU state query failed'
                  # Reject missing/extra GPUs, non-finite or non-positive limits, and unknown modes.
                  printf '%s\n' "$state" | awk -F, -v uuid="$gpu" '
                    { for (i=1; i<=NF; i++) gsub(/^[[:space:]]+|[[:space:]]+$/, "", $i) }
                    NF != 4 || $1 != uuid || ($2 != "Enabled" && $2 != "Disabled") ||
                      $3 !~ /^[0-9]+([.][0-9]+)?$/ || $4 !~ /^[0-9]+([.][0-9]+)?$/ ||
                      $3+0 <= 0 || $4+0 <= 0 { bad=1 }
                    END { exit (NR != 1 || bad) }
                  ' || fail 'unreadable or unexpected GPU identity/limit'
                  mode=$(printf '%s\n' "$state" | cut -d, -f2 | tr -d '[:space:]')
                  configured=$(printf '%s\n' "$state" | cut -d, -f3 | tr -d '[:space:]')
                  enforced=$(printf '%s\n' "$state" | cut -d, -f4 | tr -d '[:space:]')
                  echo "card-b-power-cap: $state"
                }

                read_state
                processes=$(smi --query-compute-apps=pid --format=csv,noheader,nounits) || fail 'cannot verify idle GPU'
                [ -z "$processes" ] || fail 'GPU has an active or unreadable compute-process list; no changes made'

                # Keep a deliberately lower limit; never turn 150 W into 250 W. An inconsistent
                # low configured/high enforced limit is an error, not permission to increase it.
                if awk -v p="$configured" 'BEGIN { exit !(p <= 250) }'; then
                  awk -v p="$enforced" 'BEGIN { exit !(p <= 250) }' || fail 'configured/enforced limits disagree'
                  ceiling=$configured
                else
                  ceiling=250
                fi

                if [ "$mode" != Enabled ]; then
                  smi -pm 1 || fail 'persistence mode failed; model must remain stopped'
                fi
                if awk -v p="$configured" 'BEGIN { exit !(p > 250) }'; then
                  smi -pl 250 || fail '250 W write failed; model must remain stopped'
                fi

                read_state
                [ "$mode" = Enabled ] || fail 'persistence mode did not remain enabled'
                awk -v c="$configured" -v e="$enforced" -v ceiling="$ceiling" '
                  BEGIN { exit !(c <= ceiling && e <= ceiling) }
                ' || fail 'cap read-back failed; model must remain stopped'
                echo "card-b-power-cap: verified $configured W configured / $enforced W enforced; no GPU load started"
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"], add: ["SYS_ADMIN"] }
            resources:
              requests: { cpu: 50m, memory: 32Mi }
              limits: { cpu: 100m, memory: 128Mi }
          # Card B fails at 300-350 W (Xid 79, #3052) and holds at 250 W. A power
          # limit resets on every boot. The preceding power-cap init reapplies
          # it, then this independent read-only gate verifies it again. This
          # container cannot change the limit itself.
          power-gate:
            image:
              repository: ghcr.io/ggml-org/llama.cpp
              tag: server-cuda-b11096@sha256:0192ab2545efcbe79c240645e34abd8fffbe4813aedcef5a0e3a886ef6d6d82f
            env:
              NVIDIA_VISIBLE_DEVICES: GPU-18bf6eab-c76a-26ba-74c8-76093b705b8b
            command: ["/bin/sh", "-c"]
            args:
              - |
                while true; do
                  pl=$(nvidia-smi --query-gpu=enforced.power.limit --format=csv,noheader,nounits | cut -d. -f1)
                  # Bare $pl only: Flux postBuild envsubst would eat a braced form.
                  if [ -n "$pl" ] && [ "$pl" -le 250 ]; then echo "enforced $pl W: ok"; exit 0; fi
                  echo "enforced limit '$pl' W is above 250 W or unreadable: waiting for the cap"; sleep 30
                done
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { memory: 128Mi }
        containers:
          app:
            image:
              repository: ghcr.io/ggml-org/llama.cpp
              # llama.cpp build b11096 (server, CUDA 12). Pinned, never `latest`
              # or the floating `server-cuda`: a model this size is not something
              # to re-quantise expectations around on an unannounced rebuild.
              # talosw01's driver is 580.178.04 (CUDA 13 capable), so the CUDA 12
              # build runs fine; `server-cuda-bNNNNN` == `server-cuda12-bNNNNN`
              # (identical digest upstream).
              tag: server-cuda-b11096@sha256:0192ab2545efcbe79c240645e34abd8fffbe4813aedcef5a0e3a886ef6d6d82f
            env:
              # Card B on the dock; card A in the rack has no voice tenant.
              # Exact UUID selection is paired with the hostname selector above.
              NVIDIA_VISIBLE_DEVICES: GPU-18bf6eab-c76a-26ba-74c8-76093b705b8b
              TZ: America/New_York
            args:
              - --host
              - 0.0.0.0
              - --port
              - "8080"
              - -m
              - /models/muse-glimmer-30b/Muse-Glimmer-30B-KQuant-17GB-Q4_K_M.gguf
              # Stable client-facing name. Without it the API reports the GGUF
              # path, which would change under every re-quant.
              - --alias
              - muse-glimmer-30b
              # Offload everything. 999 is "an exact number" per --help; the
              # default is `auto`, which does not guarantee a full offload.
              - --n-gpu-layers
              - "999"
              # --ctx-size is the TOTAL KV pool and is divided across the slots
              # (-np), because --kv-unified only defaults on when the slot count
              # is auto — and it is set explicitly here. 131072 / 2 slots =
              # 65536 tokens per slot. Verify after a config change: the startup
              # log prints `n_ctx_slot`.
              #
              # History, so nobody trims this back to "something sensible":
              #   32768 (16k/slot) — the original sizing.
              #   65536 (32k/slot), 2026-09-22 — Home Assistant's Assist prompt
              #     is ~15k tokens on EVERY turn (n_tokens 14,930-15,147 in this
              #     server's log), which sat right on the 16k slot edge.
              #   131072 (64k/slot), 2026-09-22 — HA then attached the
              #     cigar-journal MCP server (35 tools) to the local agent and a
              #     single Assist turn became ~43.6k tokens. Every call failed
              #     with "request (43607 tokens) exceeds the available context
              #     size (32768 tokens)". 64k/slot clears that with room for a
              #     second MCP server later.
              #
              # 65536 per slot needs NO rope scaling: the model's own
              # n_ctx_train is 131072, so each slot stays inside the trained
              # window. Going past 65536/slot would not — check for an
              # `n_ctx_train` warning in the log if you ever raise it again.
              # KV cost is roughly linear: 16k->32k per slot measured ~+240 MiB.
              - --ctx-size
              - "131072"
              - --parallel
              - "2"
              # Muse Glimmer's chat template is the ATEM tool-calling protocol
              # (reasoning channel + tool channels), so the jinja engine is not
              # optional for tool calls. Default-on in b11096; stated anyway.
              - --jinja
              # The template reads a `reasoning_strength` kwarg (it even
              # normalises "Reasoning effort" -> "Reasoning strength" in a system
              # prompt). `low` keeps assistant/HA latency down; the flag is
              # accepted by this build (`minimal|low|medium|high|xhigh|max`).
              - --reasoning-effort
              - low
              - --flash-attn
              - "on"
              # q8_0 KV roughly halves cache VRAM against the f16 default at
              # negligible quality cost — the headroom that keeps the loaded
              # model under ~22.5 GB on a 24 GB card.
              - --cache-type-k
              - q8_0
              - --cache-type-v
              - q8_0
              # Prometheus endpoint at /metrics. No ServiceMonitor or alert rules
              # yet — deliberately a separate change.
              - --metrics
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            probes:
              # llama-server answers /health with 503 while the model loads and
              # 200 once every slot is ready. The startup probe is what absorbs
              # the cold read off HDD-NFS (up to 30m) so liveness never fires
              # mid-load.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /health, port: 8080 }
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 4
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /health, port: 8080 }
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /health, port: 8080 }
                  periodSeconds: 10
                  failureThreshold: 180
            resources:
              requests:
                cpu: 1000m
                memory: 8Gi
              limits:
                # The GGUF is mmap'd from NFS, so RSS tracks the page cache the
                # kernel keeps for it; talosw04 has ~60 GiB. Generous on
                # purpose — an OOMKill here is a multi-minute reload.
                memory: 32Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        # http://llama-server.ai.svc.cluster.local:8080
        controller: llama-server
        ports:
          http:
            port: 8080
    persistence:
      # Models live on the NAS beside comfyui's (misc/comfyui/models) and
      # ollama's (misc/ollama/models). Read-only: nothing here downloads.
      models:
        type: nfs
        server: gasha01.haynesnetwork
        path: /hdd-nfs-repl
        advancedMounts:
          llama-server:
            app:
              - path: /models
                subPath: misc/llama/models
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          llama-server:
            app:
              - path: /tmp
            power-gate:
              - path: /tmp
