---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app llama-server
  namespace: ai
spec:
  interval: 30m
  # A cold start reads a ~17 GB GGUF off HDD-backed NFS before the server ever
  # answers /health. The default 5m timed the upgrade out and rolled it back.
  timeout: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    controllers:
      llama-server:
        # Local Jarvis and Phone Assist need Muse while rack card A is tested.
        # Card C is temporarily its sole GPU on the talosw04 OCuLink dock.
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        # One resident model on one card: never two copies during rollout.
        strategy: Recreate
        pod:
          nodeSelector:
            kubernetes.io/hostname: talosw04
          # Keep the test worker isolated; only this deployment is admitted.
          tolerations:
            - key: haynesops.com/gpu-test
              operator: Equal
              value: "true"
              effect: NoSchedule
          # GPU access comes from the nvidia RuntimeClass, not from an
          # nvidia.com/gpu request: the device plugin hands out *a* card and
          # cannot pin a named one, and nothing else in `ai` claims one either.
          runtimeClassName: nvidia
        containers:
          app:
            image:
              repository: ghcr.io/ggml-org/llama.cpp
              # llama.cpp build b11096 (server, CUDA 12). Pinned, never `latest`
              # or the floating `server-cuda`: a model this size is not something
              # to re-quantise expectations around on an unannounced rebuild.
              # talosw01's driver is 580.178.04 (CUDA 13 capable), so the CUDA 12
              # build runs fine; `server-cuda-bNNNNN` == `server-cuda12-bNNNNN`
              # (identical digest upstream).
              tag: server-cuda-b11096@sha256:0192ab2545efcbe79c240645e34abd8fffbe4813aedcef5a0e3a886ef6d6d82f
            env:
              # Card C stays on the dock; card A in the rack has no voice tenant.
              # Exact UUID selection is paired with the hostname selector above.
              NVIDIA_VISIBLE_DEVICES: GPU-d8a856f1-f955-f683-bc24-654561496774
              TZ: America/New_York
            args:
              - --host
              - 0.0.0.0
              - --port
              - "8080"
              - -m
              - /models/muse-glimmer-30b/Muse-Glimmer-30B-KQuant-17GB-Q4_K_M.gguf
              # Stable client-facing name. Without it the API reports the GGUF
              # path, which would change under every re-quant.
              - --alias
              - muse-glimmer-30b
              # Offload everything. 999 is "an exact number" per --help; the
              # default is `auto`, which does not guarantee a full offload.
              - --n-gpu-layers
              - "999"
              # --ctx-size is the TOTAL KV pool and is divided across the slots
              # (-np), because --kv-unified only defaults on when the slot count
              # is auto — and it is set explicitly here. 131072 / 2 slots =
              # 65536 tokens per slot. Verify after a config change: the startup
              # log prints `n_ctx_slot`.
              #
              # History, so nobody trims this back to "something sensible":
              #   32768 (16k/slot) — the original sizing.
              #   65536 (32k/slot), 2026-09-22 — Home Assistant's Assist prompt
              #     is ~15k tokens on EVERY turn (n_tokens 14,930-15,147 in this
              #     server's log), which sat right on the 16k slot edge.
              #   131072 (64k/slot), 2026-09-22 — HA then attached the
              #     cigar-journal MCP server (35 tools) to the local agent and a
              #     single Assist turn became ~43.6k tokens. Every call failed
              #     with "request (43607 tokens) exceeds the available context
              #     size (32768 tokens)". 64k/slot clears that with room for a
              #     second MCP server later.
              #
              # 65536 per slot needs NO rope scaling: the model's own
              # n_ctx_train is 131072, so each slot stays inside the trained
              # window. Going past 65536/slot would not — check for an
              # `n_ctx_train` warning in the log if you ever raise it again.
              # KV cost is roughly linear: 16k->32k per slot measured ~+240 MiB.
              - --ctx-size
              - "131072"
              - --parallel
              - "2"
              # Muse Glimmer's chat template is the ATEM tool-calling protocol
              # (reasoning channel + tool channels), so the jinja engine is not
              # optional for tool calls. Default-on in b11096; stated anyway.
              - --jinja
              # The template reads a `reasoning_strength` kwarg (it even
              # normalises "Reasoning effort" -> "Reasoning strength" in a system
              # prompt). `low` keeps assistant/HA latency down; the flag is
              # accepted by this build (`minimal|low|medium|high|xhigh|max`).
              - --reasoning-effort
              - low
              - --flash-attn
              - "on"
              # q8_0 KV roughly halves cache VRAM against the f16 default at
              # negligible quality cost — the headroom that keeps the loaded
              # model under ~22.5 GB on a 24 GB card.
              - --cache-type-k
              - q8_0
              - --cache-type-v
              - q8_0
              # Prometheus endpoint at /metrics. No ServiceMonitor or alert rules
              # yet — deliberately a separate change.
              - --metrics
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            probes:
              # llama-server answers /health with 503 while the model loads and
              # 200 once every slot is ready. The startup probe is what absorbs
              # the cold read off HDD-NFS (up to 30m) so liveness never fires
              # mid-load.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /health, port: 8080 }
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 4
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /health, port: 8080 }
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /health, port: 8080 }
                  periodSeconds: 10
                  failureThreshold: 180
            resources:
              requests:
                cpu: 1000m
                memory: 8Gi
              limits:
                # The GGUF is mmap'd from NFS, so RSS tracks the page cache the
                # kernel keeps for it; talosw04 has ~60 GiB. Generous on
                # purpose — an OOMKill here is a multi-minute reload.
                memory: 32Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        # http://llama-server.ai.svc.cluster.local:8080
        controller: llama-server
        ports:
          http:
            port: 8080
    persistence:
      # Models live on the NAS beside comfyui's (misc/comfyui/models) and
      # ollama's (misc/ollama/models). Read-only: nothing here downloads.
      models:
        type: nfs
        server: gasha01.haynesnetwork
        path: /hdd-nfs-repl
        globalMounts:
          - path: /models
            subPath: misc/llama/models
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
