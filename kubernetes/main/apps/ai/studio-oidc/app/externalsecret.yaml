---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: studio-oidc-client-reader
  namespace: ai
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: studio-oidc-client
  namespace: ai
spec:
  provider:
    kubernetes:
      remoteNamespace: network
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: studio-oidc-client-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: studio-oidc-client
  namespace: ai
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: studio-oidc-client
  target:
    name: studio-oidc-client
    creationPolicy: Owner
  data:
    - secretKey: STUDIO_OIDC_CLIENT_SECRET
      remoteRef:
        key: studio-oidc-client
        property: STUDIO_OIDC_CLIENT_SECRET
