---
# Vexa upstream, pinned by commit — the HelmRelease consumes the in-repo chart
# at deploy/helm/charts/vexa (no published Helm repo exists for it).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: vexa-src
spec:
  interval: 12h
  url: https://github.com/Vexa-ai/vexa
  ref:
    commit: e0b356d6de3f8322db45d3cb9d66282ae108bebf
  ignore: |
    /*
    !/deploy/helm/
