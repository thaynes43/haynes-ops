---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./whisper.yaml
  - ./mcp.yaml
  - ./recordings-bucket.yaml
  - ./dispatcher.yaml
  - ./scribe-notes.yaml
configMapGenerator:
  # stt.py overlay for vexa-whisper: a copy of the in-image faster-whisper-server
  # router with a minimal diff that defaults `hotwords` from WHISPER_DEFAULT_HOTWORDS.
  # The default content-hash name suffix rolls the whisper Deployment whenever the
  # overlay changes; the volume in whisper.yaml references the base name.
  - name: vexa-whisper-stt-overlay
    files:
      - stt.py=./whisper-stt.py
  # scribe-notes worker code + its pinned summarizer prompt (auditable in PR
  # diffs, shepherd pattern), mounted at /app in the dispatcher-spawned Job. Stable
  # name (disableNameSuffixHash): the runtime-created Job references this ConfigMap
  # by name, which kustomize cannot rewrite (the Job isn't part of this kustomize
  # build). Only these two generators opt out — the whisper overlay above keeps its
  # roll-on-change hash.
  - name: scribe-notes-worker
    options:
      disableNameSuffixHash: true
    files:
      - scribe_notes.py=./resources/scribe_notes.py
      - summarize-prompt.md=./resources/summarize-prompt.md
  # The Job manifest the dispatcher fills + POSTs (mounted at /templates in the
  # dispatcher). JSON so python's stdlib parses it with no pyyaml dependency.
  - name: scribe-notes-jobtemplate
    options:
      disableNameSuffixHash: true
    files:
      - scribe-notes-job.json=./resources/scribe-notes-job.json
