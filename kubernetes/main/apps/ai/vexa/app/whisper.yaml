---
# OpenAI-compatible STT the Vexa bots transcribe against (the same
# faster-whisper server Vexa's own lite deployment bundles). On the 3090
# (talosw01) since 2026-08-18 night: large-v3 at GPU speed — the dry run's
# CPU `small` misheard plenty and the offline re-transcription crawled.
# meeting-scribe/01.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vexa-whisper
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vexa-whisper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vexa-whisper
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        feature.node.kubernetes.io/nvidia-3090-gpu: "true"
      containers:
        - name: whisper
          image: docker.io/fedirz/faster-whisper-server:latest-cuda
          env:
            - name: WHISPER_MODEL
              value: "Systran/faster-whisper-large-v3"
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 10Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /root/.cache/huggingface
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: models
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vexa-whisper
spec:
  selector:
    app.kubernetes.io/name: vexa-whisper
  ports:
    - port: 8000
      targetPort: 8000
