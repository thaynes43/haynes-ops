---
# OpenAI-compatible STT the Vexa bots transcribe against (the same
# faster-whisper server Vexa's own lite deployment bundles). large-v3 at
# GPU speed — the dry run's CPU `small` misheard plenty and the offline
# re-transcription crawled. Runs on the RTX A2000 12GB (talosm01) as of
# 2026-08-19: the 3090 (talosw01) is reserved for ComfyUI (camera→image
# flow) and ollama-prime, so transcription gets the least-contended GPU.
# talosm01 is a control-plane node — fine for whisper's bounded resources;
# it already hosts ollama-assist01 on the same A2000. meeting-scribe/01.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vexa-whisper
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate: the pod claims the node's only
  # nvidia.com/gpu, so a rolling surge pod can never schedule (the old pod holds
  # the GPU) and the rollout deadlocks in Pending until the old pod is deleted by
  # hand. Recreate tears the old pod down first, freeing the GPU for the new one.
  # The stt.py overlay is configMapGenerator-hashed, so overlay edits roll this
  # Deployment automatically — this keeps that roll from deadlocking. The brief
  # gap is acceptable: whisper rollouts are already gated on no active meeting.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vexa-whisper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vexa-whisper
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        feature.node.kubernetes.io/nvidia-a2000: "true"
      containers:
        - name: whisper
          # Pinned by digest: latest-cuda is an unpinned floating tag, and the
          # stt.py overlay below is written against THIS image's source layout.
          # A silent upstream rebuild of latest-cuda could move/rename the file
          # the overlay mounts over and break transcription, so we pin the exact
          # digest that was running when the overlay was authored (2026-08-19).
          # To adopt a new upstream image: re-copy stt.py from it, re-apply the
          # minimal diff, and bump this digest in the same PR.
          image: docker.io/fedirz/faster-whisper-server:latest-cuda@sha256:0b64050ad0b9244745746b652473ee42a8d5454d501877a252c3e65f631ffc99
          env:
            - name: WHISPER_MODEL
              value: "Systran/faster-whisper-large-v3"
            # Static name-bias lexicon (meeting-scribe). The stt.py overlay
            # defaults `hotwords` to this when a transcription request omits it;
            # an explicit request-supplied hotwords still wins. Biases the model
            # toward chapter/brother proper nouns. Approved by Tom 2026-08-19.
            - name: WHISPER_DEFAULT_HOTWORDS
              value: "ΣΦΟ, Sigo, Sigma Phi Omicron, Thomas Haynes, Zach Koch, Zak, Dennis Livoli, Liron Feldman, Matthew Sharp, Scott Scarbro, Rohan Solanki, Ryan Carreiro, Herns Farel"
            # Keep the model RESIDENT — never offload on idle. The A2000's
            # 12GB VRAM is shared UNMANAGED with ollama-assist01 on talosm01
            # (it uses runtimeClassName: nvidia with no device-plugin claim),
            # so the default 300s idle offload makes whisper re-load its model
            # mid-meeting and race it for VRAM → CUDA out-of-memory crashloop
            # (that failure mode crashed whisper on the busier 3090 on
            # 2026-08-19). Claim VRAM once at startup and hold it. WHISPER__TTL
            # maps to WhisperConfig.ttl (pydantic env_nested_delimiter "__");
            # -1 = never unload. Verified against the running image 2026-08-19
            # (single-underscore WHISPER_TTL is ignored).
            - name: WHISPER__TTL
              value: "-1"
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              # 16Gi (was 10Gi): crash-spiral headroom. On a CUDA-OOM the
              # server retries loading the model; the host peak during that
              # spiral OOMKilled the pod (exit 137) at 10Gi on 2026-08-19.
              # Idle host RSS is ~1.6Gi; talosm01 has ~96Gi (~15% used).
              memory: 16Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /root/.cache/huggingface
            # Overlay a single file (stt.py) over the in-image router source.
            # subPath replaces just this file, leaving the rest of the routers
            # package (__init__.py, misc.py, list_models.py) intact. Python
            # recompiles from the mounted source on import (size differs from
            # the cached .pyc), so the overlay takes effect on pod start.
            - name: stt-overlay
              mountPath: /root/faster-whisper-server/faster_whisper_server/routers/stt.py
              subPath: stt.py
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: models
          emptyDir: {}
        - name: stt-overlay
          configMap:
            # Name is rewritten with a content-hash suffix by the
            # configMapGenerator in kustomization.yaml, so any edit to the
            # overlay rolls the Deployment automatically.
            name: vexa-whisper-stt-overlay
---
apiVersion: v1
kind: Service
metadata:
  name: vexa-whisper
spec:
  selector:
    app.kubernetes.io/name: vexa-whisper
  ports:
    - port: 8000
      targetPort: 8000
