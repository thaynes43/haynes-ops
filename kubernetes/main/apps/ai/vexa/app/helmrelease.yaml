---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vexa
spec:
  interval: 30m
  chart:
    spec:
      # Vendored from Vexa-ai/vexa @ 31122f96 (deploy/helm/charts/vexa) — no
      # published Helm repo exists; vendoring keeps flux-local able to validate
      # and pins the chart by copy. Re-vendor to upgrade.
      chart: ./kubernetes/main/apps/ai/vexa/chart
      sourceRef:
        kind: GitRepository
        name: haynes-ops
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  # Upstream v0.12.29 image set (Vexa-ai/vexa #1921). Pin the registry manifests
  # together: the floating v012 tag previously let meeting-api move ahead of
  # admin-api and take GET /meetings down. Check upstream MIGRATION-* notes before
  # advancing these pins. The MCP and spawned browser are pinned separately.
  postRenderers:
    - kustomize:
        images:
          - name: vexaai/v012-meeting-api
            digest: sha256:defd77f00c96d2f3c94f607d0a89bbaaa8777514ed080ac8b05c0eb238ef7186
          - name: vexaai/v012-gateway
            digest: sha256:6cf8fa87700d4630a43cce1665d1266049dca28f051383c2a6fd1e30cb09ae19
          - name: vexaai/v012-admin-api
            digest: sha256:601b3f7e42ce389f920dd05a191749b11ccbce356456ea7b11b5dec409bde262
          - name: vexaai/v012-runtime
            digest: sha256:34ba41d196be3c8f8da1a3a689e94e85f6108d59ccb7c21fc5dfce07892baacc
  values:
    # STOPGAP (2026-08-18): inline tokens in a public repo — acceptable only
    # because every service is ClusterIP with no ingress (tokens are unusable
    # without cluster network access). Rotate + move to SOPS/external-secrets
    # before any ingress is added. Tracked in sigo-alumni backlog.
    secrets:
      adminApiToken: "567ffa0192bc16e8dfac2fa4df6b60613585da3f7b8f107e"
      internalApiSecret: "3007ea2182b4b20dcddf4bfe8b2aad5639f89c22841a2ddf"
    meetingApi:
      replicaCount: 1
      # Base URL; the bot's client appends /v1/audio/transcriptions.
      transcriptionServiceUrl: "http://vexa-whisper:8000"
    # The upstream S3 settings point to the existing recordings bucket and its
    # ObjectBucketClaim credentials.
    storage:
      s3:
        endpoint: "http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80"
        bucket: "vexa-recordings"
        existingSecret: "vexa-recordings"
    gateway:
      replicaCount: 1
    runtime:
      backend: "k8s"
      # Dispatch joins up to 10 minutes early; allow 20 more minutes for
      # remote audio before the bot completes due to silence.
      aloneSilenceWindowMs: "1800000"
      # Stamped onto every SPAWNED bot pod (RUNTIME_K8S_NODE_SELECTOR): keep
      # bots off control-plane nodes and next to whisper — the dry-run bot
      # landed on a control-plane node amid the Redis-reachability blip
      # (meeting-scribe saga). Revisit with a proper worker-role label.
      nodeSelector:
        kubernetes.io/hostname: talosw01
      # Preserve the existing bot sizing. The new chart's small-cluster
      # defaults set both requests and hard limits for each spawned bot.
      workloadResources:
        meetingBot:
          cpu: ""
          memoryMb: ""
      # BROWSER_IMAGE for the bot Pods the runtime spawns. This is an env var on
      # the runtime Deployment, NOT a container image field, so the postRenderers
      # images transformer above cannot reach it — it is pinned here instead. The
      # chart passes runtime.browserImage through verbatim (vexa.botImage helper),
      # so a digest ref is expressible. Same digest discipline as the block above.
      browserImage: "vexaai/vexa-bot@sha256:3bfc16a82f931c75b69233665befb4033159829fe89d5ccf295172be82a8548e"
    # Transcription-only deployment: no web UI, no agent platform (and none of
    # their secret/PVC requirements). Enable later if the copilot is wanted.
    terminal:
      enabled: false
    agentApi:
      enabled: false
    flows:
      enabled: false
    # admin-api converges the schema at startup, including the v0.12.29 user
    # email index. The chart's legacy hook imports a removed meeting-api module.
    migrations:
      enabled: false
