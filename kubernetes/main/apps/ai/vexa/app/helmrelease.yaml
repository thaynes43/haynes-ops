---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vexa
spec:
  interval: 30m
  chart:
    spec:
      # Vendored from Vexa-ai/vexa @ e0b356d6 (deploy/helm/charts/vexa) — no
      # published Helm repo exists; vendoring keeps flux-local able to validate
      # and pins the chart by copy. Re-vendor to upgrade.
      chart: ./kubernetes/main/apps/ai/vexa/chart
      sourceRef:
        kind: GitRepository
        name: haynes-ops
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  # IMAGE DRIFT INCIDENT (2026-09-12 -> 2026-09-16). Every image in the vendored
  # chart ships on the FLOATING `v012` tag with imagePullPolicy: Always, so an
  # unrelated meeting-api restart silently pulled a newer upstream build whose
  # `GET /meetings` calls the Postgres function meeting_event_time() (added by
  # upstream's MIGRATION-0005). admin-api did NOT drift, so nothing ever created
  # that function and every `GET /meetings` returned 500 for four days. These
  # digests are the builds verified running on 2026-09-16; kustomize's images
  # transformer rewrites the chart's `repository:tag` refs to `repository@digest`.
  # TO BUMP: re-vendor the chart, update ALL of these digests together, and run
  # upstream's MIGRATION-000N docs for the new build FIRST (schema before image).
  postRenderers:
    - kustomize:
        images:
          - name: vexaai/v012-meeting-api
            digest: sha256:4e9c201f656788755458fd6f2b9fbf3bfe0722d5b17d4cebd82b874b5aee98e1
          - name: vexaai/v012-gateway
            digest: sha256:2e76319812f28adbb6bc328ac0a7484d3826924a9d38a9dd9599dd190fbb0f19
          - name: vexaai/v012-admin-api
            digest: sha256:49a8bd29268250cb37976c3170fde41c960f00d55f31ef4a42e17062b968b114
          - name: vexaai/v012-runtime
            digest: sha256:a1f6448fbb380b9433364e8b572ec25a12aa4f274bf403f1d83a89cbf5812f2d
  values:
    # STOPGAP (2026-08-18): inline tokens in a public repo — acceptable only
    # because every service is ClusterIP with no ingress (tokens are unusable
    # without cluster network access). Rotate + move to SOPS/external-secrets
    # before any ingress is added. Tracked in sigo-alumni backlog.
    secrets:
      adminApiToken: "567ffa0192bc16e8dfac2fa4df6b60613585da3f7b8f107e"
      internalApiSecret: "3007ea2182b4b20dcddf4bfe8b2aad5639f89c22841a2ddf"
    meetingApi:
      replicaCount: 1
      # Base URL; the bot's client appends /v1/audio/transcriptions.
      transcriptionServiceUrl: "http://vexa-whisper:8000"
      # Recordings → rook RGW via the vexa-recordings OBC (bundled MinIO off:
      # upstream archived 2026-04-25). Same MINIO_* env the chart would set,
      # pointed at the cluster's native S3; creds from the OBC-minted Secret.
      extraEnv:
        - name: MINIO_ENDPOINT
          value: "rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80"
        - name: MINIO_BUCKET
          value: "vexa-recordings"
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: vexa-recordings
              key: AWS_ACCESS_KEY_ID
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: vexa-recordings
              key: AWS_SECRET_ACCESS_KEY
    gateway:
      replicaCount: 1
    runtime:
      backend: "k8s"
      # Stamped onto every SPAWNED bot pod (RUNTIME_K8S_NODE_SELECTOR): keep
      # bots off control-plane nodes and next to whisper — the dry-run bot
      # landed on a control-plane node amid the Redis-reachability blip
      # (meeting-scribe saga). Revisit with a proper worker-role label.
      nodeSelector:
        kubernetes.io/hostname: talosw01
      # BROWSER_IMAGE for the bot Pods the runtime spawns. This is an env var on
      # the runtime Deployment, NOT a container image field, so the postRenderers
      # images transformer above cannot reach it — it is pinned here instead. The
      # chart passes runtime.browserImage through verbatim (vexa.botImage helper),
      # so a digest ref is expressible. Same digest discipline as the block above.
      browserImage: "vexaai/vexa-bot@sha256:a7f8feae7870b722e3542fb7cb054ff7c092e62f4c5a6b6a3b63e52f8cd1fe47"
    # Transcription-only deployment: no web UI, no agent platform (and none of
    # their secret/PVC requirements). Enable later if the copilot is wanted.
    terminal:
      enabled: false
    agentApi:
      enabled: false
    minio:
      enabled: false
    # Explicit + documented, not just the chart default. The vendored hook's
    # command is `python -c "from meeting_api.database import init_db ..."` and
    # `meeting_api.database` no longer exists in the pinned meeting-api image, so
    # this pre-upgrade hook would ModuleNotFoundError on EVERY helm upgrade if it
    # were ever switched on. Schema changes here are a deliberate out-of-band step
    # following upstream's MIGRATION-000N docs (MIGRATION-0005 run by hand on
    # 2026-09-16) until the chart is re-vendored together with its images.
    migrations:
      enabled: false
