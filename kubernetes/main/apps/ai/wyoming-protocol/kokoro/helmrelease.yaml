---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kokoro
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    controllers:
      kokoro:
        pod:
          # Same card as whisper and vexa-whisper, pinned by hostname rather
          # than the `nvidia-a2000` label — see the whisper HelmRelease.
          nodeSelector:
            kubernetes.io/hostname: talosm01
          runtimeClassName: nvidia
        containers:
          app:
            # Kokoro-82M behind the Wyoming protocol, on the GPU.
            #
            # WHY THIS IMAGE AND NOT nordwestt/kokoro-wyoming. nordwestt's is
            # the better-known project, but its `:cuda` tag does not use the
            # GPU: `kokoro-onnx[gpu]` declares BOTH onnxruntime and
            # onnxruntime-gpu, the CPU build shadows the GPU one, and the
            # unpinned onnxruntime it resolved (1.30.0) is a CUDA 13 wheel on a
            # CUDA 12.6 base. Probed on this node, that image reports
            # `available providers: ['AzureExecutionProvider',
            # 'CPUExecutionProvider']` — a "cuda" image running wholly on the
            # CPU. This one uninstalls the CPU package, force-reinstalls
            # onnxruntime-gpu and asserts CUDAExecutionProvider at build time;
            # probed the same way on the same node it reports
            # `session providers: ['CUDAExecutionProvider',
            # 'CPUExecutionProvider']`.
            #
            # It is a small single-maintainer project, so it is pinned by
            # digest and piper stays deployed as the fallback TTS engine.
            image:
              repository: ghcr.io/flight777/kokoro-wyoming-ml
              tag: latest@sha256:46418df6e485de71f7177a61bab931fa8ad9d67c901fc13ba2534b5c19017e6c
            env:
              TZ: America/New_York
              # The image defaults to a Mandarin voice (it exists for a
              # bilingual household); af_heart is Kokoro's default American
              # English voice. HA can still pick any of the other 53 per
              # request — this is only the default.
              KOKORO_VOICE: af_heart
              KOKORO_SPEED: "1.0"
              # Explicit, so a CUDA regression fails loudly at startup instead
              # of silently synthesizing on the CPU. This is the image default
              # too; naming it here is the guard, not the setting.
              ONNX_PROVIDER: CUDAExecutionProvider
              URI: tcp://0.0.0.0:10210
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                # Kokoro-82M is 82M parameters (~330 MB of fp32 ONNX); the rest
                # is onnxruntime's CUDA arena and the voice pack.
                memory: 4Gi
            probes:
              # Model and voices are baked into the image, so there is no
              # download — but the CUDA session build plus the warm-up
              # synthesis still take a while on a cold start.
              startup:
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 5
              liveness:
                enabled: true
              readiness:
                enabled: true
    service:
      app:
        # kokoro.ai.svc.cluster.local:10210
        controller: kokoro
        ports:
          http:
            port: 10210
