---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  # No ingress / DNS entry for this internal-only service.
  # No volsync component either: unlike piper and whisper this server needs no
  # persistent state — its model and voice pack are baked into the image, so
  # there is nothing to download at runtime and nothing to back up.
components:
  - ../../../../../shared/components/common/repos/app-template
