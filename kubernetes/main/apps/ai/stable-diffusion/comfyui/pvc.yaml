---
# LEGACY — node-local openebs-hostpath on talosw01, from the ai-dock image era when models and the
# Python env lived in the workspace. Replaced by comfyui-data below (2026-09-23): local storage pins
# ComfyUI to one node, which blocked moving it off talosw01 when both 3090s dropped off the bus.
# Kept only until its 13 MB (UI workflows, settings, comfyui.db, inputs) is copied and verified.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: comfyui-workspace
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 80Gi
  storageClassName: openebs-hostpath
---
# ComfyUI's writable workspace: user dir (saved UI workflows, settings, the comfyui.db SQLite —
# which is why this is Ceph block, not the NFS share), uploaded inputs, temp. Models and outputs
# are on the gasha01 NFS share, so this stays small and can follow the pod to any node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: comfyui-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: ceph-block
