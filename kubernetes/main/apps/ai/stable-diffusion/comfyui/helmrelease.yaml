---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app comfyui
  namespace: ai
spec:
  interval: 30m
  # A start can mean a dependency reinstall, tens of GB of model downloads and
  # a cold model load. With the default 5m the upgrade timed out, Helm rolled
  # back to the previous COMFYUI_VERSION, retried, and thrashed the pod.
  timeout: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    controllers:
      comfyui:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Same image as the app. Downloads whatever the stored workflows need
          # that is not on the NAS yet, and installs the UI workflows. Model URLs
          # come from the workflow files themselves (official ComfyUI templates
          # embed them); the API graphs AppDaemon sends are checked against the
          # result. Non-strict: a Hugging Face outage must not stop ComfyUI
          # starting with the models it already has. See scripts/comfyui/README.md.
          provision-models:
            image: &image
              repository: ghcr.io/thaynes43/comfyui
              # <ComfyUI version>-<image revision>; built by .github/workflows/comfyui-build.yml
              tag: 0.37.0-1@sha256:b4f45c1154cd7aa898f737b471af1cafa649e21eefdf6a4a6b64f84b39d5293b
            args:
              - provision
              - --workflows-dir
              - /config/workflows
              - --workflows-dir
              - /config/api-workflows
              - --install-workflows-to
              - /workspace/ComfyUI/user/default/workflows
            envFrom: &envFrom
              - secretRef:
                  name: comfyui-secret
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        pod:
          nodeSelector:
            feature.node.kubernetes.io/nvidia-3090-gpu: "true"
          # GPUs come from the nvidia runtime, not from an nvidia.com/gpu request
          # (the device plugin hands out *a* card, it cannot pin a named one) and
          # not from `privileged`. Which cards the runtime injects is decided by
          # NVIDIA_VISIBLE_DEVICES on the app container below.
          runtimeClassName: nvidia
        containers:
          app:
            image: *image
            args: ["serve"]
            env:
              # Owner ruling 2026-09-22 (haynes-ops#2960, which previously said
              # "no per-app GPU pinning" — that is now lifted): talosw01's two
              # 3090s are split per app. The roles were SWAPPED later the same
              # day for a thermal reason — read this before "fixing" it back:
              #
              #   3090 #0 — VM bus 01:00.0, GPU-18bf6eab-… (the NEW card, #3052)
              #     -> ComfyUI, this container, exclusively. This is the HOT
              #     slot: intake air passes the CPU radiator first, so the card
              #     drops to 225 MHz at ~87 °C within ~10 s of sustained load
              #     with the fan already at 100 % (SW thermal slowdown 0x20).
              #     ComfyUI is the right tenant for it — a render that throttles
              #     is just a slower render, whereas a throttled chat turn is a
              #     user sitting and waiting. The card itself is fine; the
              #     chassis airflow is the fault, tracked in haynes-ops#3052.
              #   3090 #1 — VM bus 02:00.0, GPU-d8a856f1-… (the ORIGINAL card)
              #     -> llama-server, the resident assist/chat LLM. It gets the
              #     cool slot because it is the latency-sensitive tenant: a
              #     bench on the hot card fell from 38 to 8 tok/s.
              #
              # If #3052 is ever fixed, this split can go back to whatever is
              # convenient; until then, ComfyUI owns 01:00.0.
              #
              # ollama-prime keeps NVIDIA_VISIBLE_DEVICES=all and takes whatever
              # is left over, spilling to CPU when neither card has room.
              # Why ComfyUI gets exactly one card: its per-job peak is ~16-20 GB,
              # which fits on a single 3090; AppDaemon's camera renders and Open
              # WebUI's chat renders load the SAME qwen_image_2.1_int8_convrot +
              # qwen3vl_8b_int8_convrot files, so one resident copy serves both;
              # and the LLM needs a whole card to itself to stay resident.
              # This overrides the NVIDIA_VISIBLE_DEVICES=all baked into
              # ghcr.io/thaynes43/comfyui. The container therefore sees ONE GPU,
              # so anything that names a device index inside ComfyUI must say
              # `gpu:0` — that stays true across this swap, because `gpu:0` just
              # means "the one visible card", whichever it is (see
              # open-webui/app/comfyui/*-workflow.json; unchanged by the swap).
              NVIDIA_VISIBLE_DEVICES: GPU-18bf6eab-c76a-26ba-74c8-76093b705b8b
              # Existing PVC layout, so saved UI workflows and inputs carry over.
              COMFYUI_USER_DIR: /workspace/ComfyUI/user
              COMFYUI_INPUT_DIR: /workspace/ComfyUI/input
              COMFYUI_OUTPUT_DIR: /workspace/ComfyUI/output
              COMFYUI_TEMP_DIR: /workspace/ComfyUI/temp
              # No server-wide dtype flag (--fp8_e4m3fn-unet mis-loads int8
              # checkpoints such as Qwen-Image-2.1); workflows that need fp8
              # set weight_dtype on their own loader.
              COMFYUI_ARGS: ""
            envFrom: *envFrom
            securityContext: *securityContext
            resources:
              requests:
                cpu: 500m
                memory: 8Gi
              limits:
                # Loading the qwen models (~20GB) spiked past 32Gi during the
                # v0.24.1 upgrade and OOMKilled the pod; node has ~135GB.
                memory: 48Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: comfyui
        ports:
          http:
            port: 8188
    persistence:
      workspace:
        enabled: true
        existingClaim: comfyui-workspace
        globalMounts:
          - path: /workspace
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      output:
        type: nfs
        server: gasha01.haynesnetwork
        path: /hdd-nfs-repl
        advancedMounts:
          comfyui:
            app:
              - path: /workspace/ComfyUI/output
                subPath: misc/comfyui
                readOnly: false
      # Models live on the NAS (like Ollama's), mounted over the image's models
      # dir for the init container too so provisioning sees what is already there.
      models:
        type: nfs
        server: gasha01.haynesnetwork
        path: /hdd-nfs-repl
        globalMounts:
          - path: /opt/ComfyUI/models
            subPath: misc/comfyui/models
            readOnly: false
      workflows:
        type: configMap
        name: comfyui-workflows
        globalMounts:
          - path: /config/workflows
            readOnly: true
      api-workflows:
        type: configMap
        name: comfyui-api-workflows
        globalMounts:
          - path: /config/api-workflows
            readOnly: true
