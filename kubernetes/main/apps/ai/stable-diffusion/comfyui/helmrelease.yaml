---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app comfyui
  namespace: ai
spec:
  interval: 30m
  # A start can mean a dependency reinstall, tens of GB of model downloads and
  # a cold model load. With the default 5m the upgrade timed out, Helm rolled
  # back to the previous COMFYUI_VERSION, retried, and thrashed the pod.
  timeout: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    controllers:
      comfyui:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          prepare-workspace:
            image:
              repository: busybox
              tag: latest
            command: ["sh", "-c"]
            args:
              - |
                echo "Preparing workspace volume for non-root user (UID 1000)..."

                if [ ! -d "/workspace/ComfyUI/user/default" ]; then
                  echo "Creating /workspace/ComfyUI/user/default..."
                  mkdir -p /workspace/ComfyUI/user/default
                fi

                if [ ! -d "/workspace/ComfyUI/user/default/workflows" ]; then
                  echo "Creating /workspace/ComfyUI/user/default/workflows..."
                  mkdir -p /workspace/ComfyUI/user/default/workflows
                fi
                
                if [ ! -d "/workspace/ComfyUI/temp" ]; then
                  echo "Creating /workspace/ComfyUI/temp..."
                  mkdir -p /workspace/ComfyUI/temp
                fi

                if [ ! -d "/workspace/ComfyUI/custom_nodes/ComfyUI-Manager/.cache" ]; then
                  echo "Creating /workspace/ComfyUI/custom_nodes/ComfyUI-Manager/.cache..."
                  mkdir -p /workspace/ComfyUI/custom_nodes/ComfyUI-Manager/.cache
                fi

                if [ ! -d "/workspace/ComfyUI/models/checkpoints" ]; then
                  echo "Creating /workspace/ComfyUI/models/checkpoints..."
                  mkdir -p /workspace/ComfyUI/models/checkpoints
                fi

                if [ ! -d "/workspace/ComfyUI/models/loras" ]; then
                  echo "Creating /workspace/ComfyUI/models/loras..."
                  mkdir -p /workspace/ComfyUI/models/loras
                fi

                if [ ! -d "/workspace/ComfyUI/models/controlnet" ]; then
                  echo "Creating /workspace/ComfyUI/models/controlnet..."
                  mkdir -p /workspace/ComfyUI/models/controlnet
                fi

                if [ ! -d "/workspace/ComfyUI/models/vae" ]; then
                  echo "Creating /workspace/ComfyUI/models/vae..."
                  mkdir -p /workspace/ComfyUI/models/vae
                fi

                if [ ! -d "/workspace/ComfyUI/models/upscale_models" ]; then
                  echo "Creating /workspace/ComfyUI/models/upscale_models..."
                  mkdir -p /workspace/ComfyUI/models/upscale_models
                fi

                if [ ! -d "/workspace/storage/stable_diffusion/models/unet" ]; then
                  echo "Creating /workspace/storage/stable_diffusion/models/unet..."
                  mkdir -p /workspace/storage/stable_diffusion/models/unet
                fi

                if [ ! -d "/workspace/storage/stable_diffusion/models/vae" ]; then
                  echo "Creating /workspace/storage/stable_diffusion/models/vae..."
                  mkdir -p /workspace/storage/stable_diffusion/models/vae
                fi

                if [ ! -d "/workspace/storage/stable_diffusion/models/clip" ]; then
                  echo "Creating /workspace/storage/stable_diffusion/models/clip..."
                  mkdir -p /workspace/storage/stable_diffusion/models/clip
                fi

                if [ ! -d "/workspace/storage/stable_diffusion/models/esrgan" ]; then
                  echo "Creating /workspace/storage/stable_diffusion/models/esrgan..."
                  mkdir -p /workspace/storage/stable_diffusion/models/esrgan
                fi

                if [ -f "/workspace/storage/stable_diffusion/models/unet/flux1-dev.safetensors" ]; then
                  echo "Removing stale legacy Flux model artifact..."
                  rm -f /workspace/storage/stable_diffusion/models/unet/flux1-dev.safetensors
                fi

                if ls /opt/comfyui-workflows/*.json >/dev/null 2>&1; then
                  echo "Installing bundled UI workflows into ComfyUI user workflows..."
                  cp -f /opt/comfyui-workflows/*.json /workspace/ComfyUI/user/default/workflows/
                fi

                if [ ! -d "/workspace/home/user/.local/share/jupyter/runtime" ]; then
                  echo "Creating /workspace/home/user/.local/share/jupyter/runtime..."
                  mkdir -p /workspace/home/user/.local/share/jupyter/runtime
                fi

                echo "Setting ownership of /workspace to 1000:1000..."
                chown -R 1000:1000 /workspace
                
                echo "Workspace preparation complete."
          provision-models:
            image:
              repository: ghcr.io/ai-dock/comfyui
              tag: v2-cuda-12.1.1-base-22.04-v0.2.7@sha256:ca4c95d4d4743d7d5683e57f5e0358fe586bc57578f66c2a844e9fa0650cc619
            command: ["bash"]
            args: ["/opt/comfyui-provisioning/provisioning.sh"]
            env:
              WORKSPACE: "/workspace"
              MODEL_MANIFEST: "/opt/comfyui-provisioning/models.txt"
              PROVISIONING_UPDATE_EXISTING: "false"
              # Pin ComfyUI code so a fresh openebs workspace self-heals to a
              # version with the nodes the stored workflows need (bump here to
              # upgrade). v0.37.0 is the floor for Qwen-Image-2.1.
              COMFYUI_VERSION: "v0.37.0"
            envFrom:
              - secretRef:
                  name: comfyui-secret
        pod:
          nodeSelector:
            feature.node.kubernetes.io/nvidia-3090-gpu: "true"
          runtimeClassName: nvidia
        containers:
          app:
            image:
              repository: ghcr.io/ai-dock/comfyui
              tag: v2-cuda-12.1.1-base-22.04-v0.2.7@sha256:ca4c95d4d4743d7d5683e57f5e0358fe586bc57578f66c2a844e9fa0650cc619
            env:
              AUTO_UPDATE: "false"
              DIRECT_ADDRESS_GET_WAN: "true"
              SERVICEPORTAL_URL: "comfyui.haynesops.com"
              WEB_ENABLE_AUTH: "false"
              WORKSPACE: "/workspace"
              PYTHONPATH: "/workspace/.python-deps"
              CF_QUICK_TUNNELS: "false"
              SERVERLESS: "false"
              COMFYUI_DISABLE_EXTRA_NODES: "0"
              # No server-wide dtype flag: --fp8_e4m3fn-unet forces fp8 onto EVERY
              # diffusion model, including int8 checkpoints such as Qwen-Image-2.1
              # ("model weight dtype torch.float8_e4m3fn" on an int8_convrot file).
              # The fp8 Qwen-Image-Edit-2509 workflows AppDaemon can still send
              # set weight_dtype=fp8_e4m3fn on their own UNETLoader instead
              # (appdaemon >= 1.20.0).
              COMFYUI_ARGS: ""
            envFrom:
              - secretRef:
                  name: comfyui-secret
            securityContext:
              privileged: true
            resources:
              requests:
                #nvidia.com/gpu: 1
                cpu: 500m
                memory: 8Gi
              limits:
                # Loading the qwen models (~20GB) spiked past 32Gi during the
                # v0.24.1 upgrade and OOMKilled the pod; node has ~135GB.
                memory: 48Gi
                #nvidia.com/gpu: 1
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: comfyui
        ports:
          http:
            port: 8188
    persistence:
      workspace:
        enabled: true
        existingClaim: comfyui-workspace
        globalMounts:
          - path: /workspace
      output:
        type: nfs
        server: gasha01.haynesnetwork
        path: /hdd-nfs-repl
        advancedMounts:
          comfyui:
            app:
              - path: /workspace/ComfyUI/output
                subPath: misc/comfyui
                readOnly: false
      # Models on the NFS/cephFS share so a node re-image doesn't wipe them
      # (was ~50GB on openebs-hostpath). Only the small code+deps stay local
      # and are re-bootstrapped by provisioning.
      models:
        type: nfs
        server: gasha01.haynesnetwork
        path: /hdd-nfs-repl
        # globalMounts (all containers incl. the provision-models init) so the
        # provisioning model-download SKIPS files already on NFS instead of
        # re-downloading ~20GB to local disk. advancedMounts skips init containers.
        globalMounts:
          - path: /workspace/ComfyUI/models
            subPath: misc/comfyui/models
            readOnly: false
      config:
        type: configMap
        name: comfyui-configmap
        globalMounts:
          - path: /opt/comfyui-provisioning
            readOnly: true
        advancedMounts:
          comfyui:
            app:
              - path: /workspace/ComfyUI/custom_nodes/ComfyUI-Manager/config.ini
                subPath: config.ini
                readOnly: true
      workflows:
        type: configMap
        name: comfyui-workflows
        globalMounts:
          - path: /opt/comfyui-workflows
            readOnly: true
