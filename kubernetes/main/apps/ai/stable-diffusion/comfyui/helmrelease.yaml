---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app comfyui
  namespace: ai
spec:
  interval: 30m
  # A start can mean a dependency reinstall, tens of GB of model downloads and
  # a cold model load. With the default 5m the upgrade timed out, Helm rolled
  # back to the previous COMFYUI_VERSION, retried, and thrashed the pod.
  timeout: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    controllers:
      comfyui:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Same image as the app. Downloads whatever the stored workflows need
          # that is not on the NAS yet, and installs the UI workflows. Model URLs
          # come from the workflow files themselves (official ComfyUI templates
          # embed them); the API graphs AppDaemon sends are checked against the
          # result. Non-strict: a Hugging Face outage must not stop ComfyUI
          # starting with the models it already has. See scripts/comfyui/README.md.
          provision-models:
            image: &image
              repository: ghcr.io/thaynes43/comfyui
              # <ComfyUI version>-<image revision>; built by .github/workflows/comfyui-build.yml
              tag: 0.37.0-2@sha256:efa589c52458a29709bd5a6f85844cbab2f9e007d747a346494f59f7ba5703fc
            args:
              - provision
              - --workflows-dir
              - /config/workflows
              - --workflows-dir
              - /config/api-workflows
              - --install-workflows-to
              - /workspace/ComfyUI/user/default/workflows
            envFrom: &envFrom
              - secretRef:
                  name: comfyui-secret
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        pod:
          # talosm03's RTX 2000 Ada (16 GB) since 2026-09-23 — see NVIDIA_VISIBLE_DEVICES below.
          nodeSelector:
            feature.node.kubernetes.io/nvidia-2000-ada-gpu: "true"
          # GPUs come from the nvidia runtime, not from an nvidia.com/gpu request
          # (the device plugin hands out *a* card, it cannot pin a named one) and
          # not from `privileged`. Which cards the runtime injects is decided by
          # NVIDIA_VISIBLE_DEVICES on the app container below.
          runtimeClassName: nvidia
        containers:
          app:
            image: *image
            args: ["serve"]
            env:
              # Owner ruling 2026-09-23 (evening): ComfyUI runs on talosm03's RTX
              # 2000 Ada (16 GB, 70 W), NOT on talosw01's 3090s. Both 3090s dropped
              # off the PCIe bus that day: #0 (GPU-18bf6eab-…) mid-render at 14:47
              # EDT and #1 (GPU-d8a856f1-…) at the start of a render at 19:03 EDT,
              # idle at 60 °C. Two cards within hours, after five clean days,
              # points at something they share (power, riser, slot), not one bad
              # card. Tom will fix that hardware; until then nothing runs on them
              # (haynes-ops#3052).
              #
              # Benchmarked here before the move, with the production
              # Qwen-Image-2.1 edit graph: 1.42-1.50 s/it (the throttled 3090 did
              # 1.4), warm render 80-86 s (3090 ~69 s), cold first render 306 s
              # (models load off the NFS share). AppDaemon allows 900-1200 s per
              # render and sends at most ~8/h. The card is SHARED with
              # ollama-assist02 (qwen3.5:9b, ~6.5 GB resident, detection
              # summaries): ComfyUI's dynamic VRAM works in the remaining ~9 GB
              # (UNet 6.9 GB, text encoder 8.9 GB, VAE 0.6 GB, loaded in turn). The
              # A2000 on talosm01 has no room for that LLM (voice STT/TTS + Vexa
              # hold 8.6 of 12 GB).
              #
              # Pinned by UUID so it never lands on a different card by accident.
              # Moving back to a 3090 = nodeSelector + this UUID together (the
              # 2026-09-22 per-3090 layout is in open-webui's PLAN-021).
              # The container sees exactly ONE GPU, so anything naming a device
              # index inside ComfyUI must say `gpu:0` ("the one visible card"), as
              # open-webui/app/comfyui/*-workflow.json do. AppDaemon's camera
              # renders and Open WebUI's chat renders share one model copy.
              NVIDIA_VISIBLE_DEVICES: GPU-71a3aea4-020b-83ea-4221-cc9f901c7a67
              # Existing PVC layout, so saved UI workflows and inputs carry over.
              COMFYUI_USER_DIR: /workspace/ComfyUI/user
              COMFYUI_INPUT_DIR: /workspace/ComfyUI/input
              COMFYUI_OUTPUT_DIR: /workspace/ComfyUI/output
              COMFYUI_TEMP_DIR: /workspace/ComfyUI/temp
              # No server-wide dtype flag (--fp8_e4m3fn-unet mis-loads int8
              # checkpoints such as Qwen-Image-2.1); workflows that need fp8
              # set weight_dtype on their own loader.
              COMFYUI_ARGS: ""
            envFrom: *envFrom
            securityContext: *securityContext
            resources:
              requests:
                cpu: 500m
                memory: 8Gi
              limits:
                # Loading the qwen models (~20GB) spiked past 32Gi during the
                # v0.24.1 upgrade and OOMKilled the pod; node has ~135GB.
                memory: 48Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: comfyui
        ports:
          http:
            port: 8188
    persistence:
      workspace:
        enabled: true
        # Ceph block (2026-09-23), not node-local openebs-hostpath: it must follow the pod.
        existingClaim: comfyui-data
        globalMounts:
          - path: /workspace
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      output:
        type: nfs
        server: gasha01.haynesnetwork
        path: /hdd-nfs-repl
        advancedMounts:
          comfyui:
            app:
              - path: /workspace/ComfyUI/output
                subPath: misc/comfyui
                readOnly: false
      # Models live on the NAS (like Ollama's), mounted over the image's models
      # dir for the init container too so provisioning sees what is already there.
      models:
        type: nfs
        server: gasha01.haynesnetwork
        path: /hdd-nfs-repl
        globalMounts:
          - path: /opt/ComfyUI/models
            subPath: misc/comfyui/models
            readOnly: false
      workflows:
        type: configMap
        name: comfyui-workflows
        globalMounts:
          - path: /config/workflows
            readOnly: true
      api-workflows:
        type: configMap
        name: comfyui-api-workflows
        globalMounts:
          - path: /config/api-workflows
            readOnly: true
