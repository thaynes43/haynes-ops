---
# ComfyUI writes every render to its output dir on the NAS and nothing ever
# removed them (8.6k PNGs since 2025-08). AppDaemon copies the image it wants
# into Home Assistant's media dir at render time, so these are debug copies —
# each PNG embeds the exact graph that produced it. Keep 30 days.
#
# SAFETY: the output dir (misc/comfyui) is the PARENT of the models library
# (misc/comfyui/models). The sweep is therefore image files in the top level
# only — `-maxdepth 1 -type f`, never a recursive delete — and it runs as the
# same uid that owns the files, with no write path to anything but this mount.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: comfyui-output-retention
  annotations:
    # The script below uses shell variables; keep Flux's postBuild envsubst
    # (strict mode) away from them.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  schedule: "15 5 * * *"
  timeZone: America/New_York
  # The next kickoff is the deadline: Replace, with a backstop just under a day.
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 82800
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sweep
              image: docker.io/library/busybox:1.38.0
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: RETENTION_DAYS
                  value: "30"
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  cd /output
                  [ -d models ] || { echo "refusing to run: /output does not look like the ComfyUI share (no models/ dir)"; exit 1; }
                  before=$(find . -maxdepth 1 -type f | wc -l)
                  n=0
                  for ext in png jpg jpeg webp; do
                    c=$(find . -maxdepth 1 -type f -name "*.$ext" -mtime "+$RETENTION_DAYS" | wc -l)
                    find . -maxdepth 1 -type f -name "*.$ext" -mtime "+$RETENTION_DAYS" -delete
                    n=$((n + c))
                  done
                  after=$(find . -maxdepth 1 -type f | wc -l)
                  echo "deleted $n image(s) older than $RETENTION_DAYS days; top-level files $before -> $after"
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
              volumeMounts:
                - name: output
                  mountPath: /output
                  subPath: misc/comfyui
          volumes:
            - name: output
              nfs:
                server: gasha01.haynesnetwork
                path: /hdd-nfs-repl
