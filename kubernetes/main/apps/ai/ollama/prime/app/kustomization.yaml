---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  # Temporary (#4038): stable endpoint for the Assist model A/B eval Jobs on card A.
  - ./assist-eval-service.yaml
components:
  - ../../../../../../shared/components/common/repos/app-template
  - ../../../../../../shared/components/volsync/aws
  - ../../../../../../shared/components/common/gatus/guarded

patches:
  - patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "${APP}-gatus-ep"
      data:
        config.yaml: |
          endpoints:
            - name: "${APP}"
              enabled: false
              group: internal
              # Internal services are often behind SSO; treat any non-5xx as "up".
              # This also makes the service URL visible in the UI.
              url: "https://${GATUS_SUBDOMAIN:-${APP}}.${GATUS_DOMAIN:-haynesops.com}${GATUS_PATH:-/}"
              interval: 1m
              conditions:
                # Floor guards against the timeout case: no response resolves [STATUS] to 0,
                # which would pass "< 500" (see external/configmap.yaml, 2026-08-12 incident).
                - "[STATUS] >= 200"
                - "[STATUS] < ${GATUS_STATUS_MAX:-500}"
              alerts:
                # 10x1m failures before paging — see external/configmap.yaml.
                - type: pushover
                  failure-threshold: 10
                  success-threshold: 2
