---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: arc-sigmaphiomicron-com
  namespace: arc-runners
spec:
  targetNamespace: arc-runners
  dependsOn:
    - name: arc-runner-infrastructure
      namespace: arc-runners
    - name: arc-controller
      namespace: arc-systems
    - name: arc-github-app
      namespace: arc-runners
    - name: kyverno-policies
      namespace: kyverno
  path: ./kubernetes/main/apps/arc-runners/sigmaphiomicron-com/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  wait: true
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: arc-sigmaphiomicron-com
      ARC_REPOSITORY: sigmaphiomicron-com
