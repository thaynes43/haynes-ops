---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: arc-github-app
  namespace: arc-runners
spec:
  # Activate with the dedicated App credentials and public runner image ready.
  # Keeping the auth/pools suspended avoids critical alerts for intentional setup.
  targetNamespace: arc-runners
  dependsOn:
    - name: external-secrets-stores
      namespace: external-secrets
  path: ./kubernetes/main/apps/arc-runners/github-app/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  wait: true
  interval: 30m
  timeout: 5m
  # A missing 1Password item keeps pools blocked without affecting the controller.
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: arc-github-app
      namespace: arc-runners
