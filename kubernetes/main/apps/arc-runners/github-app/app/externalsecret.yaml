---
# Install the dedicated repository-scoped ARC GitHub App on the five private repos.
# The controller reads this Secret; runner ServiceAccounts have no Kubernetes RBAC.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: arc-github-app
    creationPolicy: Owner
  data:
    - secretKey: github_app_id
      remoteRef:
        key: arc-github-app
        property: github_app_id
    - secretKey: github_app_installation_id
      remoteRef:
        key: arc-github-app
        property: github_app_installation_id
    - secretKey: github_app_private_key
      remoteRef:
        key: arc-github-app
        property: github_app_private_key
