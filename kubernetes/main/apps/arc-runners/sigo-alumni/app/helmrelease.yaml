---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-sigo-alumni
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: arc-runner-scale-set
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    githubConfigUrl: https://github.com/thaynes43/sigo-alumni
    githubConfigSecret: arc-github-app
    runnerScaleSetName: arc-sigo-alumni
    minRunners: 0
    maxRunners: 1
    controllerServiceAccount:
      namespace: arc-systems
      name: arc-controller
    # Manual DinD configuration pins its image and bounds every native sidecar.
    containerMode: {}
    listenerTemplate:
      metadata:
        labels:
          haynesops.com/arc-component: listener
      spec:
        nodeSelector:
          kubernetes.io/arch: amd64
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values: [talosw01, talosw02, talosw03]
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: listener
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
                ephemeral-storage: 64Mi
              limits:
                cpu: 250m
                memory: 256Mi
                ephemeral-storage: 256Mi
    template:
      metadata:
        labels:
          haynesops.com/arc-runner: "true"
          haynesops.com/arc-repository: sigo-alumni
          haynesops.com/arc-container-mode: plain
      spec:
        automountServiceAccountToken: false
        nodeSelector:
          kubernetes.io/arch: amd64
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values: [talosw01, talosw02, talosw03]
        securityContext:
          fsGroup: 1001
          supplementalGroups: [123]
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: runner
            image: ghcr.io/thaynes43/actions-runner:0.1.0@sha256:2166736618b66c2496af112461d1a2ebfd6df050d6d6de3d2c89914b86939cb9
            command: ["/home/runner/run.sh"]
            securityContext:
              # Existing setup actions use sudo apt (e.g. Playwright --with-deps).
              # Keep the bounded default capabilities needed by sudo, without NET_RAW.
              allowPrivilegeEscalation: true
              runAsNonRoot: true
              runAsUser: 1001
              runAsGroup: 1001
              capabilities:
                drop: [NET_RAW]
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
                ephemeral-storage: 1Gi
              limits:
                cpu: "2"
                memory: 4Gi
                ephemeral-storage: 12Gi
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
        volumes:
          - name: work
            emptyDir:
              sizeLimit: 10Gi
