---
# Read-only Postgres access for the Books Census: the haynesnetwork database through the CNPG `-ro` service (a hot
# standby, so the connection cannot write; the script also forces default_transaction_read_only and BEGIN READ ONLY).
# Only the rendered URL lands in the target Secret. Same items as the owed-check runner's.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: books-census
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: books-census-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        BOOKS_CENSUS_DATABASE_URL: "postgres://{{ .HAYNESNETWORK_POSTGRESQL__USER }}:{{ .HAYNESNETWORK_POSTGRESQL__PASSWORD }}@postgres16-ro.database.svc.cluster.local:5432/haynesnetwork"
  dataFrom:
    - extract:
        key: haynesnetwork
    - extract:
        key: cloudnative-pg
