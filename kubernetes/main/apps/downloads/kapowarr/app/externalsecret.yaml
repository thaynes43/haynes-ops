---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kapowarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kapowarr-secret
    template:
      engineVersion: v2
      data:
        # TRANSPORT / REFERENCE ONLY — this Secret is NOT mounted into the pod.
        # Kapowarr reads its config from its PVC-backed SQLite DB, not from env.
        # These fields are the 1Password->cluster source of record for values that
        # are persisted through Kapowarr's Settings/API:
        #   - KAPOWARR_API_KEY: Kapowarr's own API key (Settings -> General),
        #     already persisted in the DB; mirrored here for reference/rotation.
        #   - COMICVINE_API_KEY: set into Settings -> General -> Comic Vine API key
        #     via Kapowarr's API — the last gate on comic GRABs.
        KAPOWARR_API_KEY: "{{ .KAPOWARR_API_KEY }}"
        COMICVINE_API_KEY: "{{ .COMICVINE_API_KEY }}"
  data:
    - secretKey: KAPOWARR_API_KEY
      remoteRef:
        key: kapowarr
        property: KAPOWARR_API_KEY
    - secretKey: COMICVINE_API_KEY
      remoteRef:
        key: kapowarr
        property: COMICVINE_API_KEY
