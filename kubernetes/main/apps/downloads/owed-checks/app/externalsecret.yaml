---
# Read-only Postgres access for the owed-check runner: the haynesnetwork database through the CNPG `-ro` service (a
# hot standby, so the connection cannot write; the runner also forces default_transaction_read_only and BEGIN READ
# ONLY). Only the rendered URL lands in the target Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: owed-checks
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: owed-checks-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OWED_CHECKS_DATABASE_URL: "postgres://{{ .HAYNESNETWORK_POSTGRESQL__USER }}:{{ .HAYNESNETWORK_POSTGRESQL__PASSWORD }}@postgres16-ro.database.svc.cluster.local:5432/haynesnetwork"
  # The same items the haynesnetwork app's ExternalSecret extracts its database credentials from.
  dataFrom:
    - extract:
        key: haynesnetwork
    - extract:
        key: cloudnative-pg
