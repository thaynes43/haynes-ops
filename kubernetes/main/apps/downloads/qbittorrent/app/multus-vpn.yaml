---
# Pod egress path: macvlan child on the node's eth1 (the VLAN-3 "VPNLan" NIC,
# vmbr2 on the Proxmox workers), static 192.168.30.249, all public ranges
# routed to 192.168.30.1 (the UDM), which policy-routes VPNLan out the
# wg0-chicago Mullvad tunnel. RFC1918 stays on the cluster default route.
#
# 2026-08-21 (Talos roll): the pod landed on talosw02 and sat NotReady for ~1h
# (VPN egress dead), which read as "w02/w03 can't route". DISPROVEN the same
# day: probe Jobs with this exact attachment on both w02 and w03 confirmed the
# Mullvad exit — the path works from ALL THREE workers; the outage was a
# transient of the roll window (pre-reboot w02 state; cleared by its reboot).
# So there is deliberately NO node pin here. To re-verify a node, run a
# short-lived Job in this namespace with nodeSelector on the suspect node,
# `k8s.v1.cni.cncf.io/networks: static-vpn-qbittorrent` in pod annotations, and
# `curl https://am.i.mullvad.net/json` — expect "mullvad_exit_ip": true.
# (Safe while qb runs elsewhere: keep it short — it shares IP .249.)
# If a pod is stuck NotReady on one node, `kubectl delete pod` to reschedule.
# Detection: readiness probe (helmrelease.yaml) + QbittorrentVpnDown
# (prometheusrule.yaml, pages in ~10m) + Gatus (slower, ~1h threshold).
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: static-vpn-qbittorrent
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "eth1",
      "mode": "bridge",
      "ipam": {
        "type": "static",
        "addresses": [
          { "address": "192.168.30.249/24" }
        ],
        "routes": [
          { "dst": "0.0.0.0/5", "gw": "192.168.30.1" },
          { "dst": "8.0.0.0/7", "gw": "192.168.30.1" },
          { "dst": "11.0.0.0/8", "gw": "192.168.30.1" },
          { "dst": "12.0.0.0/6", "gw": "192.168.30.1" },
          { "dst": "16.0.0.0/4", "gw": "192.168.30.1" },
          { "dst": "32.0.0.0/3", "gw": "192.168.30.1" },
          { "dst": "64.0.0.0/2", "gw": "192.168.30.1" },
          { "dst": "128.0.0.0/3", "gw": "192.168.30.1" },
          { "dst": "160.0.0.0/5", "gw": "192.168.30.1" },
          { "dst": "168.0.0.0/6", "gw": "192.168.30.1" },
          { "dst": "172.0.0.0/12", "gw": "192.168.30.1" },
          { "dst": "172.32.0.0/11", "gw": "192.168.30.1" },
          { "dst": "172.64.0.0/10", "gw": "192.168.30.1" },
          { "dst": "172.128.0.0/9", "gw": "192.168.30.1" },
          { "dst": "173.0.0.0/8", "gw": "192.168.30.1" },
          { "dst": "174.0.0.0/7", "gw": "192.168.30.1" },
          { "dst": "176.0.0.0/4", "gw": "192.168.30.1" },
          { "dst": "192.0.0.0/9", "gw": "192.168.30.1" },
          { "dst": "192.128.0.0/11", "gw": "192.168.30.1" },
          { "dst": "192.160.0.0/13", "gw": "192.168.30.1" },
          { "dst": "192.169.0.0/16", "gw": "192.168.30.1" },
          { "dst": "192.170.0.0/15", "gw": "192.168.30.1" },
          { "dst": "192.172.0.0/14", "gw": "192.168.30.1" },
          { "dst": "192.176.0.0/12", "gw": "192.168.30.1" },
          { "dst": "192.192.0.0/10", "gw": "192.168.30.1" },
          { "dst": "193.0.0.0/8", "gw": "192.168.30.1" },
          { "dst": "194.0.0.0/7", "gw": "192.168.30.1" },
          { "dst": "196.0.0.0/6", "gw": "192.168.30.1" },
          { "dst": "200.0.0.0/5", "gw": "192.168.30.1" },
