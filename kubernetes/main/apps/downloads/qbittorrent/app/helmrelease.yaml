---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      qbittorrent:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          nodeSelector:
            network.haynesops.com/vpn: "true"
          annotations:
            k8s.v1.cni.cncf.io/networks: static-vpn-qbittorrent
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.2.1
            env:
              TZ: America/New_York
              QBT_WEBUI_PORT: &port 8080
              QBT_TORRENTING_PORT: &torrentPort 50469
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              # Readiness = Mullvad-egress check (ported from the SABs when they
              # went direct): VPN dead OR leaking out the WAN -> NotReady ->
              # traefik 503 -> Gatus pages Pushover. Readiness (not liveness)
              # on purpose: restarting the pod can't fix the VPN.
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - sh
                      - -c
                      - wget -q -T 10 -O- https://am.i.mullvad.net/connected | grep -q "You are connected"
                  periodSeconds: 60
                  timeoutSeconds: 15
                  failureThreshold: 4
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 6Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
          # Community qBittorrent exporter as a sidecar in the same pod so it
          # reaches the WebUI over localhost — qBittorrent has
          # WebUI\LocalHostAuth=false, so localhost is auth-bypassed and no
          # credentials are needed (PLAN-018). It scrapes qbt on each request
          # and reports qbittorrent_up=0 when unreachable.
          # IMPORTANT: no readiness/startup probe. A sidecar readiness probe
          # would gate POD readiness and 503 the VPN-gated WebUI (false Gatus
          # page); only the app container's Mullvad egress check may gate
          # readiness. TCP liveness restarts only this container if it wedges.
          exporter:
            image:
              repository: ghcr.io/esanchezm/prometheus-qbittorrent-exporter
              tag: v1.7.0
            env:
              QBITTORRENT_HOST: localhost
              QBITTORRENT_PORT: *port
              QBITTORRENT_SSL: "false"
              EXPORTER_PORT: &metricsPort 8000
              EXPORTER_LOG_LEVEL: INFO
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *metricsPort
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
          # MyAnonaMouse dynamic-seedbox IP keeper (PLAN-031). In THIS pod on
          # purpose: it shares the macvlan netns, so its dynamicSeedbox.php calls
          # egress the exact Mullvad exit IP qBittorrent announces from — the IP we
          # register is provably the IP MAM sees. It confirms the Mullvad exit before
          # every call (fail-closed), self-throttles to <=1 call/hr, and persists the
          # rotating mam_id cookie to /state (a subpath of the config PVC) so it
          # survives restarts. See scripts/mam-update.sh for the full contract.
          # IMPORTANT: no readiness/startup probe — only the app container's Mullvad
          # egress check may gate pod readiness (same rule as the exporter sidecar).
          mam-update:
            image:
              repository: docker.io/curlimages/curl
              tag: 8.21.0
            command: ["/bin/sh", "/scripts/mam-update.sh"]
            env:
              TZ: America/New_York
              HOME: /tmp
              STATE_DIR: /state
              MAM_SEEDBOX_URL: https://t.myanonamouse.net/json/dynamicSeedbox.php
              MAM_CHECK_URL: https://am.i.mullvad.net/json
              INTERVAL: "3600"
              MIN_GAP: "3600"
              MAM_ID_SEED:
                valueFrom:
                  secretKeyRef:
                    name: myanonamouse-secret
                    key: MAM_ID_SEEDBOX
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        forceRename: "{{ .Release.Name }}"
        primary: true
        ports:
          http:
            port: *port
          metrics:
            port: *metricsPort
    serviceMonitor:
      app:
        serviceName: qbittorrent
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 30s
    ingress:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/target: internal.haynesops
          gethomepage.dev/href: &url "https://qbittorrent.haynesops.com"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Downloads
          gethomepage.dev/name: qBittorrent
          gethomepage.dev/description: BitTorrent client
          gethomepage.dev/icon: qbittorrent
          gethomepage.dev/app: qbittorrent
          gethomepage.dev/siteMonitor: *url
        className: traefik-internal
        hosts:
          - host: qbittorrent.haynesops.com
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
    persistence:
      config:
        existingClaim: qbittorrent
        advancedMounts:
          qbittorrent:
            app:
              - path: /config
            # mam-update persists its rotating mam_id cookie + IP/rate-limit state
            # under a subpath of the same PVC (backed up by volsync with the rest of
            # /config). Isolated from qBittorrent's own config tree.
            mam-update:
              - path: /state
                subPath: mam-update
      # mam-update sidecar script (configMapGenerator; hash-suffixed name wired in
      # via kustomizeconfig.yaml so edits roll the pod).
      mam-update-script:
        type: configMap
        name: qbittorrent-mam-update
        advancedMounts:
          qbittorrent:
            mam-update:
              - path: /scripts/mam-update.sh
                subPath: mam-update.sh
                readOnly: true
      data-tower:
        type: nfs
        server: haynestower.haynesnetwork
        path: /mnt/user/data
        advancedMounts:
          qbittorrent:
            app:
              - path: /data/haynestower
                readOnly: false
      data-proxmox:
        type: nfs
        server: gasha01.haynesnetwork
        path: /hdd-nfs-repl
        advancedMounts:
          qbittorrent:
            app:
              - path: /data/cephfs-hdd
                readOnly: false
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
