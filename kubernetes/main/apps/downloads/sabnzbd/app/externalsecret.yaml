---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sabnzbd
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: sabnzbd-secret
    template:
      engineVersion: v2
      data:
        # Pinned API key (entrypoint rewrites sabnzbd.ini on start) so the
        # *arrs/Seerr can consume the same media-stack field later.
        SABNZBD__API_KEY: "{{ .SABNZBD_API_KEY }}"
  # Targeted fetch from the shared media-stack item — only this app's key
  # lands in the namespace, not every field in the item.
  data:
    - secretKey: SABNZBD_API_KEY
      remoteRef:
        key: media-stack
        property: SABNZBD_API_KEY
