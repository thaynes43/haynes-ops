---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  # The cutover that drops the hostpath scratch PVC (epic haynes-ops#4648)
  # can move the pod to another worker: image pull, config-volume re-attach
  # and the 5m startup probe. A failed-upgrade rollback would return to a
  # revision whose PVC Flux has pruned, so give the upgrade room.
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      sabnzbd:
        # Scratch moved to NFS (epic haynes-ops#4648): download_dir, set
        # through SAB's API, is a folder on the haynestower share (see
        # persistence below), so downloads no longer fill a node's /var (the
        # 2026-08-01 DiskPressure incident) or talosw02's shared 511G scratch
        # disk (the 2026-11-03 full-disk pause). download_free=150G
        # (sabnzbd.ini) now measures the share's free space. Unraid lands new
        # writes on its cache pool first, and SAB cannot see that pool fill.
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # Off the VPN (2026-07-03): usenet is TLS end-to-end; the Mullvad
          # tunnel at the UDM capped downloads at ~330Mbps. Torrent clients
          # (qbt/slskd) stay behind the VPN — peers see raw IPs there.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sabnzbd
              tag: 5.1.3
            env:
              TZ: America/New_York
              SABNZBD__PORT: &port 8080
              SABNZBD__HOST_WHITELIST_ENTRIES: >-
                sabnzbd,
                sabnzbd.downloads,
                sabnzbd.downloads.svc,
                sabnzbd.downloads.svc.cluster.local,
                sabnzbd.haynesops.com
            envFrom:
              - secretRef:
                  name: sabnzbd-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api?mode=version
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api?mode=version
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 4Gi
              limits:
                cpu: 4000m
                # 16Gi still OOMKilled under the 450-job/17TB A-list backfill
                # (par2 on 60-80GB UHD remuxes + queue metadata). Workers have
                # 117-189GB; a 32Gi ceiling is proportionate. Idle use <1GB —
                # this is a burst ceiling, not a reservation (request is 4GB).
                memory: 32Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
          exportarr:
            image:
              repository: ghcr.io/onedr0p/exportarr
              tag: v2.3.0
            args: ["sabnzbd"]
            env:
              PORT: &metricsPort 9711
              URL: http://localhost:8080
              APIKEY:
                valueFrom:
                  secretKeyRef:
                    name: sabnzbd-secret
                    key: SABNZBD__API_KEY
            probes:
              liveness: &exportarrProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *metricsPort
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *exportarrProbes
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        forceRename: "{{ .Release.Name }}"
        primary: true
        ports:
          http:
            port: *port
          metrics:
            port: *metricsPort
    serviceMonitor:
      app:
        serviceName: sabnzbd
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 4m
            scrapeTimeout: 90s
    ingress:
      app:
        annotations:
          external-dns.kubernetes.io/target: internal.haynesops
          gethomepage.dev/href: &url "https://sabnzbd.haynesops.com"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Downloads
          gethomepage.dev/name: SABnzbd
          gethomepage.dev/description: Usenet downloads (automation lane)
          gethomepage.dev/icon: sabnzbd
          gethomepage.dev/app: sabnzbd
          gethomepage.dev/siteMonitor: *url
          gethomepage.dev/widget.type: sabnzbd
          gethomepage.dev/widget.url: "http://sabnzbd.downloads.svc.cluster.local:8080"
          # app-template uses tpl on annotations; escape Homepage var so Helm doesn't render it
          gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_SABNZBD_API_KEY}}" }}'
        className: traefik-internal
        hosts:
          - host: sabnzbd.haynesops.com
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
    persistence:
      config:
        existingClaim: sabnzbd
      # Scratch (incomplete + unpack) is a per-instance folder on this share,
      # not a volume of its own: download_dir =
      # /data/haynestower/usenet/incomplete-k8s/sabnzbd-main, set through
      # SAB's API. It sits in the same mount as complete_dir
      # (usenet/complete-k8s), so finishing a job is a rename on the Unraid
      # server, not a copy over NFS. Never share the folder with another SAB:
      # each instance's nightly orphan sweep deletes every entry there that is
      # not one of its jobs. "-main" keeps it from being a string prefix of
      # sabnzbd-fast's folder (SAB bounds some deletes with startswith).
      data-tower:
        type: nfs
        server: haynestower.haynesnetwork
        path: /mnt/user/data
        advancedMounts:
          sabnzbd:
            app:
              - path: /data/haynestower
                readOnly: false
      # Same mount convention as qbittorrent so *arr remote-path mappings are
      # identical across download clients.
      data-proxmox:
        type: nfs
        server: gasha01.haynesnetwork
        path: /hdd-nfs-repl
        advancedMounts:
          sabnzbd:
            app:
              - path: /data/cephfs-hdd
                readOnly: false
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # Post-processing scripts from the sabnzbd-scripts ks (script_dir=/scripts in
      # sabnzbd.ini, set through SAB's API): unpack-archives.sh extracts the .7z that SABnzbd's own unpack
      # misses on obfuscated posts (haynes-ops#3834). Set on the sonarrtv,
      # radarrmovies and lidarr categories.
      scripts:
        type: configMap
        name: sabnzbd-scripts
        defaultMode: 0555
        globalMounts:
          - path: /scripts
            readOnly: true
