---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      sabnzbd:
        # Guardrail against the 2026-08-01 DiskPressure incident: SAB's
        # download_free=150G (sabnzbd.ini) pauses downloads well before
        # kubelet's 15% eviction threshold on talosw02's 548G /var. The
        # hostpath incomplete PV has no enforced quota — the ini setting
        # is the real backstop.
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # Off the VPN (2026-07-03): usenet is TLS end-to-end; the Mullvad
          # tunnel at the UDM capped downloads at ~330Mbps. Torrent clients
          # (qbt/slskd) stay behind the VPN — peers see raw IPs there.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sabnzbd
              tag: 5.1.2
            env:
              TZ: America/New_York
              SABNZBD__PORT: &port 8080
              SABNZBD__HOST_WHITELIST_ENTRIES: >-
                sabnzbd,
                sabnzbd.downloads,
                sabnzbd.downloads.svc,
                sabnzbd.downloads.svc.cluster.local,
                sabnzbd.haynesops.com
            envFrom:
              - secretRef:
                  name: sabnzbd-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api?mode=version
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api?mode=version
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 4Gi
              limits:
                cpu: 4000m
                # 16Gi still OOMKilled under the 450-job/17TB A-list backfill
                # (par2 on 60-80GB UHD remuxes + queue metadata). Workers have
                # 117-189GB; a 32Gi ceiling is proportionate. Idle use <1GB —
                # this is a burst ceiling, not a reservation (request is 4GB).
                memory: 32Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
          exportarr:
            image:
              repository: ghcr.io/onedr0p/exportarr
              tag: v2.3.0
            args: ["sabnzbd"]
            env:
              PORT: &metricsPort 9711
              URL: http://localhost:8080
              APIKEY:
                valueFrom:
                  secretKeyRef:
                    name: sabnzbd-secret
                    key: SABNZBD__API_KEY
            probes:
              liveness: &exportarrProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *metricsPort
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *exportarrProbes
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        forceRename: "{{ .Release.Name }}"
        primary: true
        ports:
          http:
            port: *port
          metrics:
            port: *metricsPort
    serviceMonitor:
      app:
        serviceName: sabnzbd
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 4m
            scrapeTimeout: 90s
    ingress:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/target: internal.haynesops
          gethomepage.dev/href: &url "https://sabnzbd.haynesops.com"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Downloads
          gethomepage.dev/name: SABnzbd
          gethomepage.dev/description: Usenet downloads (automation lane)
          gethomepage.dev/icon: sabnzbd
          gethomepage.dev/app: sabnzbd
          gethomepage.dev/siteMonitor: *url
          gethomepage.dev/widget.type: sabnzbd
          gethomepage.dev/widget.url: "http://sabnzbd.downloads.svc.cluster.local:8080"
          # app-template uses tpl on annotations; escape Homepage var so Helm doesn't render it
          gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_SABNZBD_API_KEY}}" }}'
        className: traefik-internal
        hosts:
          - host: sabnzbd.haynesops.com
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
    persistence:
      config:
        existingClaim: sabnzbd
      # Local scratch for incomplete + unpack: par2/unrar on node-local disk,
      # only the finished move crosses to NFS (usenet has no hardlink needs).
      incomplete:
        existingClaim: sabnzbd-incomplete
        globalMounts:
          - path: /incomplete
      data-tower:
        type: nfs
        server: haynestower.haynesnetwork
        path: /mnt/user/data
        advancedMounts:
          sabnzbd:
            app:
              - path: /data/haynestower
                readOnly: false
      # Same mount convention as qbittorrent so *arr remote-path mappings are
      # identical across download clients.
      data-proxmox:
        type: nfs
        server: gasha01.haynesnetwork
        path: /hdd-nfs-repl
        advancedMounts:
          sabnzbd:
            app:
              - path: /data/cephfs-hdd
                readOnly: false
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
