---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../../shared/components/gatus/gaurded
  - ../../../../../shared/components/volsync/aws
resources:
  - ./pvc.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./cleanup-cronjob.yaml
configMapGenerator:
  # Post-processing script that extracts the 7z archives SABnzbd leaves behind on
  # obfuscated posts (haynes-ops#3834). Single source for BOTH instances: the
  # sabnzbd-fast ks dependsOn this one and mounts the same ConfigMap.
  - name: sabnzbd-scripts
    files:
      - unpack-archives.sh=./resources/unpack-archives.sh
    options:
      # Stable name: the HelmReleases mount it by name from inside `values`.
      disableNameSuffixHash: true
      annotations:
        # MANDATORY: the script's ${7:-0} and ${archive%.*} would be eaten by
        # Flux's postBuild envsubst.
        kustomize.toolkit.fluxcd.io/substitute: disabled
