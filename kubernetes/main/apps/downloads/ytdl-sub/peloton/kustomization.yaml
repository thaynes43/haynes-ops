---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
configMapGenerator:
  - name: ytdl-sub-peloton-config
    files:
      - config/config.yaml
  # M3 repoint: the ytdl-sub-peloton-subscriptions configMap is retired — the downloader
  # now reads ytdrivarr's projected subscriptions.yaml from /media/peloton. The dead
  # config/subscriptions.yaml snapshot was swept post-validation; only config.yaml (still
  # mounted) remains. Rollback: revert the repoint PR (#2181) plus git history.
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
configurations:
  - kustomizeconfig.yaml
