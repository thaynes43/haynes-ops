---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ytdl-sub-youtube
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      ytdl-sub:
        type: cronjob

        pod:
          restartPolicy: Never

        cronjob:
          #schedule: "0 0 5 12 2" # Disable cronjob by giving it a schedule that will never run
          schedule: "*/15 * * * *"
          backoffLimit: 0
          concurrencyPolicy: Forbid
          failedJobsHistory: 1
          successfulJobsHistory: 1

        containers:
          app:
            image:
              repository: ghcr.io/jmbannon/ytdl-sub
              tag: 2026.07.16
            command:
              - bash
              - -c
            args:
              - |
                ytdl-sub --log-level=debug --config=/config/config.yaml sub /config/subscriptions.yaml
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 6Gi

    persistence:
      # M2 cutover (DESIGN-045 D-14): config now comes from ytdrivarr's PROJECTION, not a git
      # configMap. ytdrivarr atomically renders config.yaml + subscriptions.yaml for the YouTube
      # Library to `data/media/youtube/` on the shared NFS media volume; each */15 CronJob pod
      # re-binds these subPath file mounts and reads the freshly-projected files. subPath on an
      # EPHEMERAL pod is the right primitive: the pod is short-lived, so it always picks up the
      # latest atomically-renamed file (no stale-inode problem a long-running pod would have).
      # Rollback = revert this commit (restores the configMap mounts + generators).
      config:
        type: nfs
        server: gasha01.haynesnetwork
        path: /hdd-nfs-repl
        advancedMounts:
          ytdl-sub:
            app:
              - path: /config/config.yaml
                subPath: data/media/youtube/config.yaml
                readOnly: true
      subscriptions:
        type: nfs
        server: gasha01.haynesnetwork
        path: /hdd-nfs-repl
        advancedMounts:
          ytdl-sub:
            app:
              - path: /config/subscriptions.yaml
                subPath: data/media/youtube/subscriptions.yaml
                readOnly: true
      media:
        type: nfs
        server: gasha01.haynesnetwork
        path: /hdd-nfs-repl
        advancedMounts:
          ytdl-sub:
            app:
              - path: /media/youtube
                subPath: data/media/youtube
                readOnly: false
      tmp:
        type: emptyDir
        advancedMounts:
          ytdl-sub:
            app:
              - path: /tmp
                subPath: tmp
              - path: /config
                subPath: config
              - path: /workdir
                subPath: workdir