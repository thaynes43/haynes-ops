---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lazylibrarian
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: lazylibrarian-secret
    template:
      engineVersion: v2
      data:
        # GoogleBooks metadata API key. NOTE: the LinuxServer image does NOT
        # template config.ini from env, so this Secret is a 1Password->cluster
        # transport only — the value is injected into /config/config.ini
        # (gb_api, section [API]) via the LL writeCFG API. Not mounted into the
        # pod. See the deploy note in the LazyLibrarian runbook.
        GOOGLE_BOOKS_API_KEY: "{{ .GOOGLE_BOOKS_API_KEY }}"
  # Fold into the shared media-stack item (same 1P item as PROWLARR/SABNZBD keys).
  data:
    - secretKey: GOOGLE_BOOKS_API_KEY
      remoteRef:
        key: media-stack
        property: GOOGLE_BOOKS_API_KEY
