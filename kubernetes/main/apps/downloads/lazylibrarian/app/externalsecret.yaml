---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lazylibrarian
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: lazylibrarian-secret
    template:
      engineVersion: v2
      data:
        # TRANSPORT / REFERENCE ONLY — this Secret is NOT mounted into the pod.
        # The LinuxServer LazyLibrarian image does NO env->config templating;
        # config lives on the PVC at /config/config.ini and is written through
        # LL's own writeCFG API (persists + applies immediately). These fields are
        # the 1Password->cluster source of record so the persisted values have a
        # versioned, rotatable origin:
        #   - LAZYLIBRARIAN_API_KEY: LL's own API key ([API] api_key), already
        #     persisted on the PVC; mirrored here for reference/rotation.
        #   - GOOGLE_BOOKS_API_KEY: injected into /config/config.ini ([API] gb_api)
        #     via writeCFG — the last gate on addBook (book_api=GoogleBooks is set).
        # See the LazyLibrarian deploy note in the books runbook.
        LAZYLIBRARIAN_API_KEY: "{{ .LAZYLIBRARIAN_API_KEY }}"
        GOOGLE_BOOKS_API_KEY: "{{ .GOOGLE_BOOKS_API_KEY }}"
  data:
    # LL's own API key lives in its dedicated 1Password item.
    - secretKey: LAZYLIBRARIAN_API_KEY
      remoteRef:
        key: lazylibrarian
        property: LAZYLIBRARIAN_API_KEY
    # GoogleBooks metadata key — folded into the shared media-stack item
    # (same item as the PROWLARR/SABNZBD keys), targeted fetch.
    - secretKey: GOOGLE_BOOKS_API_KEY
      remoteRef:
        key: media-stack
        property: GOOGLE_BOOKS_API_KEY
