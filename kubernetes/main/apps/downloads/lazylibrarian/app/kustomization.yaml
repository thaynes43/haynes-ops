---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../../shared/components/gatus/gaurded
  - ../../../../../shared/components/volsync/aws
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./library-scan-externalsecret.yaml
  - ./library-scan-cronjob.yaml
configMapGenerator:
  # Patched upstream librarysync.py (the library scan's id carry-over bug,
  # thaynes43/haynesnetwork#631), mounted over the image's copy by
  # helmrelease.yaml. Pinned to the image tag there; see the file's header.
  - name: lazylibrarian-librarysync
    files:
      - librarysync.py=./patches/librarysync.py
    options:
      # Stable name: a Helm rollback must land on a ConfigMap that still
      # exists (the qbittorrent 2026-09-22 FailedMount outage). The pod
      # carries reloader.stakater.com/auto, so a content change still rolls it.
      disableNameSuffixHash: true
  # Patched upstream searchbook.py (indexer query volume, 2026-10-03): the
  # daily backlog search honours DELAYSEARCH and never repeats a query for
  # one book. Mounted by helmrelease.yaml; pinned to the image tag there.
  - name: lazylibrarian-searchbook
    files:
      - searchbook.py=./patches/searchbook.py
    options:
      disableNameSuffixHash: true
  # Patched upstream sabnzbd.py (2026-10-03): uploads the NZB to SABnzbd
  # (mode=addfile) instead of handing it the Prowlarr URL, so the Prowlarr API
  # key no longer shows in SABnzbd's history. Mounted by helmrelease.yaml;
  # pinned to the image tag there.
  - name: lazylibrarian-sabnzbd
    files:
      - sabnzbd.py=./patches/sabnzbd.py
    options:
      disableNameSuffixHash: true
  # Patched upstream gb.py + dbupgrade.py (thaynes43/haynesnetwork#665): the
  # API's addBook writes the bookauthors row it skipped, and the start-up
  # check never deletes an author that still owns books (books.AuthorID
  # cascades). dbupgrade.py also logs a census of books no author counts
  # (LL_UNLINKED_BOOKS, alerted by lokirule.yaml; thaynes43/haynesnetwork#736).
  # Mounted by helmrelease.yaml; pinned to the image tag there.
  - name: lazylibrarian-gb
    files:
      - gb.py=./patches/gb.py
    options:
      disableNameSuffixHash: true
  - name: lazylibrarian-dbupgrade
    files:
      - dbupgrade.py=./patches/dbupgrade.py
    options:
      disableNameSuffixHash: true
  # Patched upstream postprocess.py (thaynes43/haynesnetwork#688): a SABnzbd
  # job that failed (e.g. "Duplicate NZB") is never post-processed, so the
  # fuzzy pass cannot import another book's same-named download. Mounted by
  # helmrelease.yaml; pinned to the image tag there.
  - name: lazylibrarian-postprocess
    files:
      - postprocess.py=./patches/postprocess.py
    options:
      disableNameSuffixHash: true
  # Patched upstream resultlist.py (thaynes43/haynesnetwork#688): a later
  # volume of a series named after the wanted book no longer scores as that
  # book. thaynes43/haynesnetwork#755: a Failed row blocks its release under
  # any spelling, and a release tagged with another language loses the match
  # for an English book. Mounted by helmrelease.yaml; pinned to the image tag
  # there.
  - name: lazylibrarian-resultlist
    files:
      - resultlist.py=./patches/resultlist.py
    options:
      disableNameSuffixHash: true
  # Loki ruler picks this up by label (same pattern as qbittorrent). Stable
  # name: the rule file is read by the ruler sidecar, nothing references it.
  - name: lazylibrarian-lokirule
    files:
      - lazylibrarian.yaml=./lokirule.yaml
    options:
      disableNameSuffixHash: true
      labels:
        loki_rule: "true"
generatorOptions:
  # Python source with $Author-style strings: keep Flux post-build
  # substitution away from it.
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
