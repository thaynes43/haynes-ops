---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lazylibrarian
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      lazylibrarian:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # Keep off the control-plane nodes (critical smart-home stack).
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
        containers:
          app:
            # Docker Hub mirror of the LinuxServer image — lscr.io is not on the
            # cluster's allowlisted-registry Kyverno policy; docker.io is.
            image:
              repository: docker.io/linuxserver/lazylibrarian
              tag: version-40a389ea
            env:
              TZ: America/New_York
              PUID: "1000"
              PGID: "1000"
              UMASK: "022"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 5299
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  failureThreshold: 40
                  periodSeconds: 10
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                cpu: 2000m
                # Owner 2026-07-10: generous headroom for scaling ebook/audiobook imports + catalog.
                memory: 8Gi
            # LinuxServer s6-overlay v3 init starts as root, fixes /config
            # ownership, then drops to PUID/PGID 1000 for the app — this is NOT
            # the rootless home-operations *arr model, so no runAsNonRoot / cap
            # drop here (the init needs CHOWN/SETUID/SETGID).
            securityContext:
              readOnlyRootFilesystem: false
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        forceRename: "{{ .Release.Name }}"
        primary: true
        ports:
          http:
            port: *port
    ingress:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/target: internal.haynesops
          gethomepage.dev/href: &url "https://lazylibrarian.haynesops.com"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Downloads
          gethomepage.dev/name: LazyLibrarian
          gethomepage.dev/description: EBook & audiobook acquisition
          gethomepage.dev/icon: lazylibrarian
          gethomepage.dev/app: lazylibrarian
          gethomepage.dev/siteMonitor: *url
        className: traefik-internal
        hosts:
          - host: lazylibrarian.haynesops.com
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
    persistence:
      config:
        existingClaim: lazylibrarian
        globalMounts:
          - path: /config
      # RW mount of the gasha01 share at the SAME mountpoint the *arrs +
      # qBittorrent + SABnzbd use, so completed-download paths
      # (data/usenet/complete-k8s, data/torrents-k8s) and the library dest
      # (data/media/books/{EBooks,AudioBooks}) are one filesystem — imports move
      # (atomic rename), never copy.
      data-proxmox:
        type: nfs
        server: gasha01.haynesnetwork
        path: /hdd-nfs-repl
        advancedMounts:
          lazylibrarian:
            app:
              - path: /data/cephfs-hdd
                readOnly: false
