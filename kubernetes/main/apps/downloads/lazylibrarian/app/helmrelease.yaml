---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lazylibrarian
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      lazylibrarian:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # Keep off the control-plane nodes (critical smart-home stack).
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
        containers:
          app:
            # Docker Hub mirror of the LinuxServer image — lscr.io is not on the
            # cluster's allowlisted-registry Kyverno policy; docker.io is.
            image:
              repository: docker.io/linuxserver/lazylibrarian
              # librarysync.py, searchbook.py, sabnzbd.py, gb.py, dbupgrade.py,
              # postprocess.py and resultlist.py in this image are overridden by
              # the lazylibrarian-librarysync, -searchbook, -sabnzbd, -gb,
              # -dbupgrade, -postprocess and -resultlist ConfigMaps (persistence
              # below), copies of THIS tag's files plus marked fixes. Bumping the
              # tag means re-deriving all seven files from the new image, or
              # dropping them if upstream fixed the bugs: see the headers of the
              # files in patches/. patches/tests/ is their harness: CI runs it
              # inside THIS tag (pins + tests); README.md there has the bump steps.
              tag: version-40a389ea
            env:
              TZ: America/New_York
              PUID: "1000"
              PGID: "1000"
              UMASK: "022"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 5299
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  failureThreshold: 40
                  periodSeconds: 10
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                cpu: 2000m
                # Owner 2026-07-10: generous headroom for scaling ebook/audiobook imports + catalog.
                memory: 8Gi
            # LinuxServer s6-overlay v3 init starts as root, fixes /config
            # ownership, then drops to PUID/PGID 1000 for the app — this is NOT
            # the rootless home-operations *arr model, so no runAsNonRoot / cap
            # drop here (the init needs CHOWN/SETUID/SETGID).
            securityContext:
              readOnlyRootFilesystem: false
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        forceRename: "{{ .Release.Name }}"
        primary: true
        ports:
          http:
            port: *port
    ingress:
      app:
        annotations:
          external-dns.kubernetes.io/target: internal.haynesops
          gethomepage.dev/href: &url "https://lazylibrarian.haynesops.com"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Downloads
          gethomepage.dev/name: LazyLibrarian
          gethomepage.dev/description: EBook & audiobook acquisition
          gethomepage.dev/icon: lazylibrarian
          gethomepage.dev/app: lazylibrarian
          # Internal URL, not *url: LazyLibrarian's CherryPy 303-redirects every
          # request to a hardcoded http:// Location, and homepage v2's fetch
          # refuses https->http downgrade redirects (v1 followed them), so the
          # public-https monitor reads as down. http->http stays legal.
          gethomepage.dev/siteMonitor: http://lazylibrarian.downloads.svc.cluster.local:5299
        className: traefik-internal
        hosts:
          - host: lazylibrarian.haynesops.com
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
    persistence:
      # Also mounted, read-only at the database level, by the hourly downloads/owed-checks CronJob (pinned to this
      # pod's node, at most 3 minutes a pass). A new LL pod on ANOTHER node that sits in Multi-Attach for a few
      # minutes at :50 is waiting for that Job to end.
      config:
        existingClaim: lazylibrarian
        globalMounts:
          - path: /config
      # The library scan's id carry-over fix (thaynes43/haynesnetwork#631):
      # one patched file over the image's own, read-only. Pinned to the
      # image tag above; patches/librarysync.py's header says how to bump.
      librarysync-patch:
        type: configMap
        name: lazylibrarian-librarysync
        advancedMounts:
          lazylibrarian:
            app:
              - path: /app/lazylibrarian/lazylibrarian/librarysync.py
                subPath: librarysync.py
                readOnly: true
      # Indexer-load fixes to the book search (2026-10-03): the daily backlog
      # search honours DELAYSEARCH (capped at 7 skipped runs), and one book's
      # search never sends the same query twice. Pinned to the image tag above;
      # patches/searchbook.py's header says how to bump.
      searchbook-patch:
        type: configMap
        name: lazylibrarian-searchbook
        advancedMounts:
          lazylibrarian:
            app:
              - path: /app/lazylibrarian/lazylibrarian/searchbook.py
                subPath: searchbook.py
                readOnly: true
      # SABnzbd hand-off fix (2026-10-03): the NZB is uploaded, not sent as
      # the Prowlarr URL (whose apikey SABnzbd kept in its history). Pinned to
      # the image tag above; patches/sabnzbd.py's header says how to bump.
      sabnzbd-patch:
        type: configMap
        name: lazylibrarian-sabnzbd
        advancedMounts:
          lazylibrarian:
            app:
              - path: /app/lazylibrarian/lazylibrarian/sabnzbd.py
                subPath: sabnzbd.py
                readOnly: true
      # Books the API's addBook created vanished at the next restart
      # (thaynes43/haynesnetwork#665): addBook never wrote the bookauthors row
      # the start-up check counts, so it deleted their author and the books
      # cascaded. gb.py writes the row; dbupgrade.py spares any author that
      # owns books. Pinned to the image tag above; see the files' headers.
      gb-patch:
        type: configMap
        name: lazylibrarian-gb
        advancedMounts:
          lazylibrarian:
            app:
              - path: /app/lazylibrarian/lazylibrarian/gb.py
                subPath: gb.py
                readOnly: true
      dbupgrade-patch:
        type: configMap
        name: lazylibrarian-dbupgrade
        advancedMounts:
          lazylibrarian:
            app:
              - path: /app/lazylibrarian/lazylibrarian/dbupgrade.py
                subPath: dbupgrade.py
                readOnly: true
      # A SABnzbd job that failed ("Duplicate NZB") was post-processed anyway,
      # and the fuzzy pass imported another book's same-named download
      # (thaynes43/haynesnetwork#688). Pinned to the image tag above;
      # patches/postprocess.py's header says how to bump.
      postprocess-patch:
        type: configMap
        name: lazylibrarian-postprocess
        advancedMounts:
          lazylibrarian:
            app:
              - path: /app/lazylibrarian/lazylibrarian/postprocess.py
                subPath: postprocess.py
                readOnly: true
      # A series named after its first book made every later volume's release
      # score 100+ for book 1 (thaynes43/haynesnetwork#688). Pinned to the
      # image tag above; patches/resultlist.py's header says how to bump.
      resultlist-patch:
        type: configMap
        name: lazylibrarian-resultlist
        advancedMounts:
          lazylibrarian:
            app:
              - path: /app/lazylibrarian/lazylibrarian/resultlist.py
                subPath: resultlist.py
                readOnly: true
      # RW mount of the gasha01 share at the SAME mountpoint the *arrs +
      # qBittorrent + SABnzbd use, so completed-download paths
      # (data/usenet/complete-k8s, data/torrents-k8s) and the library dest
      # (data/media/books/{EBooks,AudioBooks}) are one filesystem — imports move
      # (atomic rename), never copy.
      data-proxmox:
        type: nfs
        server: gasha01.haynesnetwork
        path: /hdd-nfs-repl
        advancedMounts:
          lazylibrarian:
            app:
              - path: /data/cephfs-hdd
                readOnly: false
