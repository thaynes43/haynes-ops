---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lazylibrarian-library-scan
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: lazylibrarian-library-scan-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        LAZYLIBRARIAN_API_KEY: "{{ .LAZYLIBRARIAN_API_KEY }}"
  data:
    # The SAME dedicated 1Password item + property the sibling `lazylibrarian`
    # ExternalSecret and the frontend `haynesnetwork` one already read (both
    # SecretSynced; the value matches LL's persisted /config/config.ini
    # [API] api_key, confirmed 2026-09-22 by hash, never printed).
    #
    # Its own Secret with a single targeted fetch rather than reusing
    # `lazylibrarian-secret`: that one is documented transport/reference-only
    # (nothing mounts it) and also carries GOOGLE_BOOKS_API_KEY, which the scan
    # job has no business holding.
    - secretKey: LAZYLIBRARIAN_API_KEY
      remoteRef:
        key: lazylibrarian
        property: LAZYLIBRARIAN_API_KEY
