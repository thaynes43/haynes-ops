---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Kavita API key for the EPUB converter's library scan (epub-convert-cronjob.yaml),
# from the shared media-stack item, the same property Libretto reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lazylibrarian-epub-convert
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: lazylibrarian-epub-convert-secret
    creationPolicy: Owner
  data:
    - secretKey: KAVITA_API_KEY
      remoteRef:
        key: media-stack
        property: KAVITA_API_KEY
