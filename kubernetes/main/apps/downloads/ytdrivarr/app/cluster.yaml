---
# yaml-language-server: $schema=https://gist.githubusercontent.com/thaynes43/21ef53eace2d3c6c8f00c8ee0fe4ec24/raw/b0fd8341723eee62b8a47127d40cb75f00056b67/empty-json-schema.json
# ytdrivarr's OWN small Postgres 16 instance in `downloads` (DESIGN-045 Q-02 ruling — an own
# instance, standalone-shaped, not the shared database-ns cluster). CNPG generates the
# `ytdrivarr-postgres16-app` secret whose `uri` key the service consumes as DATABASE_URL.
# Barman S3 backups added 2026-08-21 (was the only unprotected durable state on
# openebs-hostpath): daily ScheduledBackup + WAL archiving to the same
# cnpg-haynesops bucket the database-ns clusters use (creds via
# backup.yaml's ExternalSecret). Still single-instance by design.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ytdrivarr-postgres16
spec:
  instances: 1
  # Single-instance cluster: the operator-generated `-primary` PDB (minAvailable: 1)
  # would make the pod eviction-proof and stall every node drain (2026-08-21 Talos
  # roll). No PDB on a singleton — availability is the pod itself.
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4-34
  primaryUpdateStrategy: unsupervised
  storage:
    size: 10Gi
    storageClass: openebs-hostpath
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 128MB
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  monitoring:
    enablePodMonitor: true
  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      data:
        compression: bzip2
      wal:
        compression: bzip2
        maxParallel: 8
      destinationPath: s3://cnpg-haynesops/
      endpointURL: https://s3.us-east-2.amazonaws.com
      # Note: serverName version needs to be incremented
      # when recovering from an existing cnpg cluster
      serverName: ytdrivarr-postgres16-v1
      s3Credentials:
        accessKeyId:
          name: ytdrivarr-postgres16-backup-secret
          key: aws-access-key-id
        secretAccessKey:
          name: ytdrivarr-postgres16-backup-secret
          key: aws-secret-access-key
        region:
          name: ytdrivarr-postgres16-backup-secret
          key: aws-region
  bootstrap:
    initdb:
      database: ytdrivarr
      owner: ytdrivarr
