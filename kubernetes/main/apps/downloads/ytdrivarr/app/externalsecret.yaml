---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ytdrivarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ytdrivarr-secret
    template:
      engineVersion: v2
      data:
        # The single API key that guards ytdrivarr's REST API (the *arr X-Api-Key idiom).
        # Comma-separated for rotation. haynesnetwork holds one key and calls the service
        # server-side at ytdrivarr.downloads.svc.cluster.local.
        YTDRIVARR_API_KEYS: "{{ .YTDRIVARR_API_KEYS }}"
  data:
    - secretKey: YTDRIVARR_API_KEYS
      remoteRef:
        # 1Password item `ytdrivarr` in the HaynesKube vault — the OWNER must create it
        # with a generated strong key in the YTDRIVARR_API_KEYS field before merge.
        key: ytdrivarr
        property: YTDRIVARR_API_KEYS
