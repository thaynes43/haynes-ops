---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ytdrivarr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      ytdrivarr:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # Keep off the control-plane nodes (critical smart-home stack), matching the *arrs.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
        containers:
          app:
            image:
              repository: ghcr.io/thaynes43/ytdrivarr
              # v0.9.0 (pinned by immutable digest): the Prometheus /metrics endpoint + "ytdrivarr"
              # dashboard (#19), the *arr operator console (#20), the emit window (#17) + the dry-run
              # preview stack — recomposeLibrary (#31), preview engine (#32), POST /api/v1/runs/preview
              # (#34); v0.9.0 adds config-override preview (thaynes43/ytdrivarr#36, dry-run PR4 —
              # preview an unsaved config change before it goes live), on AUTH_MODE=open + M3 Peloton.
              tag: v0.9.0@sha256:5bb4b12d0aff2308ce2929482a35af9d23e10e1bfbba9b0c9ec7d4472218a466
            env:
              TZ: America/New_York
              PORT: &port 8080
              LOG_LEVEL: info
              # Keyless on the LAN-only ingress: no X-Api-Key required for any request, so the console
              # opens with no credential. A presented key is still accepted (never rejected), so
              # haynesnetwork (ESO) and the Peloton worker keep working. Public reuse defaults to api-key.
              AUTH_MODE: open
              # ytdrivarr renders each Library's config here (DESIGN-045 D-14). The M2 cutover
              # points the ytdl-sub downloaders at these projected files.
              PROJECTION_ROOT: /projections
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: ytdrivarr-postgres16-app
                    key: uri
            envFrom:
              - secretRef:
                  name: ytdrivarr-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        primary: true
        ports:
          http:
            port: *port
    # Prometheus scrapes ytdrivarr's in-process /metrics on the same http port (the exposition
    # carries no secrets; the app runs AUTH_MODE=open). The kube-prometheus-stack Prometheus in
    # `observability` discovers ServiceMonitors cluster-wide (no release label needed). Feeds the
    # "ytdrivarr" Grafana dashboard (the retired config-manager PR-body surface).
    serviceMonitor:
      app:
        serviceName: ytdrivarr
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 30s
    ingress:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/target: internal.haynesops
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Downloads
          gethomepage.dev/name: ytdrivarr
          gethomepage.dev/description: ytdl-content suite service
          gethomepage.dev/icon: youtube
        # LAN-only, NEVER a public host (DESIGN-045 D-17 / owner 2026-07-20). Matches the *arrs.
        className: traefik-internal
        hosts:
          - host: ytdrivarr.haynesops.com
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
    persistence:
      # The downloader-mounted projection volume (NFS, the same media volume the ytdl-sub
      # downloaders use). ytdrivarr projects <projectionPath> under /projections.
      projections:
        type: nfs
        server: gasha01.haynesnetwork
        path: /hdd-nfs-repl
        advancedMounts:
          ytdrivarr:
            app:
              - path: /projections
                subPath: data/media
              # Session-artifact delivery (M3, D-05): `deliverSession` writes bearer.txt /
              # cookies.txt to the Library's ABSOLUTE mediaRoot verbatim (`/media/peloton`) —
              # the core is expected to see the estate's downloader-view path. Same NFS dir the
              # projection mount above already covers (data/media/peloton); this adds the
              # /media/peloton window onto it so the report leg can deliver credentials.
              - path: /media/peloton
                subPath: data/media/peloton
      tmp:
        type: emptyDir
        advancedMounts:
          ytdrivarr:
            app:
              - path: /tmp
