---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The Peloton worker's own secret. It reuses the SAME Peloton login as the retiring
# config-manager (1Password `peloton-scraper`) and the SAME ytdrivarr API key surface
# (1Password `ytdrivarr`). Kept as a dedicated ExternalSecret (not the config-manager's
# secret) so retiring the config-manager does not delete the worker's credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ytdrivarr-peloton-worker
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ytdrivarr-peloton-worker-secret
    template:
      engineVersion: v2
      data:
        PELOTON_USERNAME: "{{ .PELOTON_USERNAME }}"
        PELOTON_PASSWORD: "{{ .PELOTON_PASSWORD }}"
        # One API key the worker presents to the ytdrivarr core (the *arr X-Api-Key idiom).
        # Derived from the core's EXISTING `YTDRIVARR_API_KEYS` (the comma-separated rotation
        # list on the same 1Password `ytdrivarr` item) — the worker presents its FIRST key,
        # which is by construction a member of the core's valid-key set (core splits on ","
        # and trims, exact-match). No new 1Password field required.
        YTDRIVARR_API_KEY: '{{ (splitList "," .YTDRIVARR_API_KEYS) | first | trim }}'
  data:
    - secretKey: PELOTON_USERNAME
      remoteRef:
        key: peloton-scraper
        property: PELOTON_USERNAME
    - secretKey: PELOTON_PASSWORD
      remoteRef:
        key: peloton-scraper
        property: PELOTON_PASSWORD
    - secretKey: YTDRIVARR_API_KEYS
      remoteRef:
        key: ytdrivarr
        property: YTDRIVARR_API_KEYS
