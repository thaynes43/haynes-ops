---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The Peloton worker's own secret. It reuses the SAME Peloton login as the retiring
# config-manager (1Password `peloton-scraper`) and the SAME ytdrivarr API key surface
# (1Password `ytdrivarr`). Kept as a dedicated ExternalSecret (not the config-manager's
# secret) so retiring the config-manager does not delete the worker's credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ytdrivarr-peloton-worker
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ytdrivarr-peloton-worker-secret
    template:
      engineVersion: v2
      data:
        PELOTON_USERNAME: "{{ .PELOTON_USERNAME }}"
        PELOTON_PASSWORD: "{{ .PELOTON_PASSWORD }}"
        # One API key the worker presents to the ytdrivarr core (the *arr X-Api-Key idiom).
        # GATE: the OWNER must add a `YTDRIVARR_API_KEY` field to the 1Password `ytdrivarr`
        # item whose value is one of the comma-separated entries in the core's
        # `YTDRIVARR_API_KEYS`, or the core will reject the worker.
        YTDRIVARR_API_KEY: "{{ .YTDRIVARR_API_KEY }}"
  data:
    - secretKey: PELOTON_USERNAME
      remoteRef:
        key: peloton-scraper
        property: PELOTON_USERNAME
    - secretKey: PELOTON_PASSWORD
      remoteRef:
        key: peloton-scraper
        property: PELOTON_PASSWORD
    - secretKey: YTDRIVARR_API_KEY
      remoteRef:
        key: ytdrivarr
        property: YTDRIVARR_API_KEY
