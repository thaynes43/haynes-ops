---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kavita
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kavita-secret
    template:
      engineVersion: v2
      data:
        # TRANSPORT / REFERENCE ONLY — this Secret is NOT mounted into the pod.
        # Kavita stores its admin credential in its PVC-backed DB (set at
        # first-run bootstrap). This field is the 1Password->cluster source of
        # record for the bootstrap password of the `hnetadmin` account (OIDC
        # replaces it for day-to-day login) — kept for reference/recovery, not
        # consumed by the pod.
        KAVITA_ADMIN_PASS: "{{ .KAVITA_ADMIN_PASS }}"
  data:
    - secretKey: KAVITA_ADMIN_PASS
      remoteRef:
        key: kavita
        property: KAVITA_ADMIN_PASS
