---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kavita
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      kavita:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # Keep off the control-plane nodes (critical smart-home stack).
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
        containers:
          app:
            image:
              repository: docker.io/jvmilazz0/kavita
              tag: 0.9.0.2
            env:
              TZ: America/New_York
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 5000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 2000m
                memory: 2Gi
            securityContext:
              # Kavita's official image runs the dotnet app as the container user
              # (no s6/root init); all writable state lives under /kavita/config
              # (config, covers, backups, bookmarks), which is the PVC. Root FS
              # stays writable for /tmp scans; caps dropped, no privilege escalation.
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: false
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        forceRename: "{{ .Release.Name }}"
        primary: true
        ports:
          http:
            port: *port
    ingress:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/target: internal.haynesops
          gethomepage.dev/href: &url "https://kavita.haynesops.com"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/name: Kavita
          gethomepage.dev/description: EBooks & comics library
          gethomepage.dev/icon: kavita
          gethomepage.dev/app: kavita
          gethomepage.dev/siteMonitor: *url
        className: traefik-internal
        hosts:
          - host: kavita.haynesops.com
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
    persistence:
      config:
        existingClaim: kavita
        globalMounts:
          - path: /kavita/config
      # Serving is read-only: LazyLibrarian (RW mount) writes the EBooks library
      # and Kapowarr (RW) writes Comics; Kavita only scans/serves them. Same NFS
      # server + mountpoint convention as the *arrs so paths resolve identically
      # across the stack. Libraries live at
      # /data/cephfs-hdd/data/media/books/{EBooks,Comics}.
      data-proxmox:
        type: nfs
        server: gasha01.haynesnetwork
        path: /hdd-nfs-repl
        advancedMounts:
          kavita:
            app:
              - path: /data/cephfs-hdd
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
