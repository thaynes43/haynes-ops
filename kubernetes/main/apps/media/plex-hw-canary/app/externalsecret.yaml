---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# HaynesTower's Plex is outside the cluster, so the canary needs its token over HTTP. This is the
# owner token homepage (dataFrom) and haynesnetwork (PLEX_HAYNESTOWER_TOKEN) already sync from the
# 1Password `homepage` item. The in-cluster servers need no token here: the probe reads theirs
# inside the pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plex-hw-canary
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: plex-hw-canary-secret
  data:
    - secretKey: HAYNESTOWER_TOKEN
      remoteRef:
        key: homepage
        property: HAYNESTOWER_PLEX_API_KEY
