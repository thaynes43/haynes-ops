---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: audiobookshelf
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: audiobookshelf-secret
    template:
      engineVersion: v2
      data:
        # TRANSPORT / REFERENCE ONLY — this Secret is NOT mounted into the pod.
        # Audiobookshelf stores its root credential in its PVC-backed DB (set at
        # first-run bootstrap). This field is the 1Password->cluster source of
        # record for the bootstrap password of the `root` account (OIDC replaces
        # it for day-to-day login) — kept for reference/recovery, not consumed by
        # the pod.
        ABS_ROOT_PASS: "{{ .ABS_ROOT_PASS }}"
  data:
    - secretKey: ABS_ROOT_PASS
      remoteRef:
        key: audiobookshelf
        property: ABS_ROOT_PASS
