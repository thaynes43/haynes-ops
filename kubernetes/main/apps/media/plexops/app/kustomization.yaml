---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../../shared/components/gatus/external
  - ../../../../../shared/components/volsync/aws
resources:
  - ./pvc.yaml
  - ./helmrelease.yaml
patches:
  # Temporary Story 174 backup; remove after Kometa acceptance to resume the weekly schedule.
  - patch: |-
      apiVersion: volsync.backube/v1alpha1
      kind: ReplicationSource
      metadata:
        name: "${APP}-aws"
      spec:
        trigger:
          manual: story174-kometa-preupgrade-20261023-01
configMapGenerator:
  - name: plexops-loki-rules
    files:
      - plexops.yaml=./lokirule.yaml
    options:
      labels:
        loki_rule: "true"
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
