---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plexops-cache
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Gi
  storageClassName: ceph-block
---
# Regenerable Plex artwork (Metadata + Media). Kept OFF the backed-up `plexops`
# config PVC so VolSync only protects the library DB. Plex re-fetches anything
# missing here, so it is intentionally not backed up. Sized above k8plex's
# 120Gi — plexops mirrors the full Unraid video library.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plexops-metadata
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 200Gi
  storageClassName: ceph-block
