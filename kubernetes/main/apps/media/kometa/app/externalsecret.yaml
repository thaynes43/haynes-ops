---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Renders the config.yml SEED. An init container copies it to the PVC ONLY IF
# /config/config.yml doesn't exist — after that the PVC copy is authoritative
# (Kometa rewrites config.yml itself, e.g. the trakt authorization block if
# trakt is ever added). To force a re-seed: delete /config/config.yml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kometa
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kometa-secret
    template:
      engineVersion: v2
      data:
        config.yml: |
          ## Seeded from git (kometa externalsecret.yaml) — LIVE copy is on the
          ## PVC and may drift (Kometa self-writes). Collection/overlay FILES
          ## are always live from git via /config/git (ConfigMap mount).
          libraries:
            # Plex library names on plexops are "HOps Movies" / "HOps TV Shows".
            HOps Movies:
              # Hand-curated collection files restored from the 2023 config +
              # a few Kometa Defaults the user actually ran (universe/seasonal/
              # oscars/golden). The franchise/studio/director/actor Defaults were
              # REMOVED — those are now the user's own explicit files below, not
              # generic auto-generated Defaults.
              collection_files:
                # Acquisition-ON Defaults — parity with the old HaynesTower stack,
                # which acquired from universe/seasonal/oscars/golden (they had no
                # radarr_add_missing override, so they inherited the global true).
                # radarr_add_missing + radarr_search send missing titles to Radarr
                # and trigger a search; radarr_tag marks every ADDED item with the
                # umbrella ("Kometa-Added") + a per-Default tag for source
                # traceability. (radarr_tag = tag-on-ADD, chosen over item_radarr_tag
                # so "Kometa-Added" stays a pure "acquired-by-Kometa" marker for the
                # Maintainerr flow-out side, rather than also tagging pre-existing
                # library items — this matches what the old config used on these
                # exact Defaults. Flip to item_radarr_tag if existing items should
                # also be tagged.) NOTE: oscars/golden/seasonal are the largest
                # one-time-wave contributors (decades of award films / every
                # seasonal title on the Default lists not yet in the library).
                # radarr_availability: released is the THEATRICAL-WINDOW GUARD
                # (owner ruling 2026-07-10) — these acquisition-ON Defaults may
                # name a title still in its theatrical window (oscars especially
                # can list a current-season theatrical contender), so Radarr must
                # not search until the title's home (physical/digital) release per
                # TMDB. Redundant-but-explicit with the global radarr.availability:
                # released below (which is already LIVE on the PVC — verified by a
                # Radarr add showing minimumAvailability=released). Kept explicit so
                # the guard survives any change to the global and is auditable here.
                - default: universe
                  template_variables:
                    radarr_add_missing: true
                    radarr_search: true
                    radarr_availability: released
                    radarr_tag: "Kometa-Added,UniverseCollection"
                - default: seasonal
                  template_variables:
                    radarr_add_missing: true
                    radarr_search: true
                    radarr_availability: released
                    radarr_tag: "Kometa-Added,SeasonalCollection"
                - default: oscars
                  template_variables:
                    radarr_add_missing: true
                    radarr_search: true
                    radarr_availability: released
                    radarr_tag: "Kometa-Added,OscarsCollection"
                - default: golden
                  template_variables:
                    radarr_add_missing: true
                    radarr_search: true
                    radarr_availability: released
                    radarr_tag: "Kometa-Added,GoldenGlobeCollection"
                # franchise Default = COMPLEMENT to the hand-curated
                # movies-franchises.yml, NOT a replacement. It auto-discovers a
                # collection per TMDb Collection present in the library (type:
                # tmdb_collection, remove_suffix "Collection"), re-adopting the
                # ~168 orphan franchises the OLD default created then abandoned
                # (Dune, Mission: Impossible, Justice League Tomorrowverse, Space
                # Odyssey, ...). Kept ARR-safe: no radarr/add_missing template
                # vars (the Default's radarr_* knobs are all optional/unset), and
                # global radarr.add_missing/search are false. minimum_items: 2
                # (also the Default's own default + the settings block) hides
                # sparse franchises; delete_below_minimum: true prunes them.
                # DEDUP: listed BEFORE the curated file so that where a curated
                # collection and the Default share the EXACT same name (Alien,
                # Batman, Harry Potter, ...) they resolve to ONE Plex collection
                # with the curated file (loaded last) winning on name/summary/
                # sort_title. Where the curated name deliberately differs
                # (curated "Bourne"/"Mission Impossible"/"Planet of the Apes" vs
                # Default "The Bourne"/"Mission: Impossible"/"...(Original/Reboot)")
                # both are kept: the Default simply re-adopts the pre-existing
                # orphan twin instead of leaving it unmanaged. Nothing is lost.
                - default: franchise
                  template_variables:
                    minimum_items: 2
                    # 1704738 was removed from TMDb (404) — exclude to silence the
                    # recurring auto-build error on the franchise Default.
                    # 11716 (Addams Family) is excluded because the curated
                    # "The Addams Family" umbrella in movies-franchises.yml covers
                    # it plus 750822 + an imdb_list — the Default's subset
                    # collection just duplicated it (QA 2026-07-07).
                    exclude:
                      - 1704738
                      - 11716
                    # ACQUISITION-OFF for the franchise Default: it auto-discovers
                    # ~168 TMDb Collections already present in the library; with
                    # add_missing it would try to COMPLETE every one (thousands of
                    # movies) — a net-new amplifier the old HaynesTower stack never
                    # had. The hand-curated movies-franchises.yml already drives
                    # franchise acquisition. Tag-only here so Kometa-managed
                    # franchise items stay traceable without a runaway wave.
                    radarr_add_missing: false
                    radarr_tag: "Kometa-Added,FranchiseCollection"
                - file: config/git/movies-franchises.yml
                - file: config/git/movies-people.yml
                - file: config/git/movies-lists.yml
                - file: config/git/movies-charts.yml
                - file: config/git/movies-collections.yml
              overlay_files:
                - default: resolution
                - default: audio_codec
                - default: video_format
                - default: ribbon
                # Ratings redraw a poster whenever a score drifts (weekly ops
                # churn) — bounded at movie level; first knob to drop if
                # Saturday runs creep.
                - default: ratings
                  template_variables:
                    rating1: critic
                    rating1_image: rt_tomato
                    rating2: audience
                    rating2_image: rt_popcorn
                    rating3: user
                    rating3_image: imdb
              operations:
                mass_critic_rating_update: mdb_tomatoes
                mass_audience_rating_update: mdb_tomatoesaudience
                mass_user_rating_update: imdb
            HOps TV Shows:
              collection_files:
                - file: config/git/shows-franchises.yml
                - file: config/git/shows-collections.yml
              # SHOW-LEVEL ONLY. The old config ran resolution/audio/video
              # overlays at builder_level: episode+season across ~100k episodes
              # — the documented dominant cost of day-long runs. Never again.
              overlay_files:
                - default: resolution
                - default: audio_codec
                - default: video_format
                - default: status
                - default: ribbon
                - default: ratings
                  template_variables:
                    rating1: critic
                    rating1_image: rt_tomato
                    rating2: audience
                    rating2_image: rt_popcorn
                    rating3: user
                    rating3_image: imdb
              operations:
                mass_critic_rating_update: mdb_tomatoes
                mass_audience_rating_update: mdb_tomatoesaudience
                mass_user_rating_update: imdb
            # No Music library exists on plexops yet (Plex reports only
            # "HOps Movies" / "HOps TV Shows"). music.yml is kept in git; enable
            # this block once an "HOps Music" library exists in Plex.
            # HOps Music:
            #   collection_files:
            #     - file: config/git/music.yml
          settings:
            cache: true
            cache_expiration: 60
            sync_mode: sync
            minimum_items: 2
            delete_below_minimum: true
            run_again_delay: 2
            show_unmanaged: true
            show_unconfigured: true
            show_missing: false
            save_report: false
          plex:
            url: http://plexops.media.svc.cluster.local:32400
            token: "{{ .PLEXOPS_TOKEN }}"
            timeout: 120
            db_cache: 4096
            clean_bundles: false
            empty_trash: false
            optimize: false
          tmdb:
            apikey: "{{ .TMDB_API_KEY }}"
            language: en
            region: US
            cache_expiration: 60
          mdblist:
            apikey: "{{ .MDBLIST_API_KEY }}"
            cache_expiration: 60
          # ACQUISITION ON (post-cutover): restores the old HaynesTower behavior —
          # collections send MISSING titles to Radarr/Sonarr (add_missing) and
          # trigger a SEARCH. `tag: Kometa-Added` is the GLOBAL UMBRELLA applied to
          # every ADDED item (the old "PMM-Added" role, renamed) so the Maintainerr
          # flow-out side can find ALL Kometa acquisitions by one tag. Per-collection
          # files additionally set "Kometa-Added,<Collection>" (umbrella first) for
          # source traceability. Chart over-acquisition is held off by the
          # original_language:en / vote_count filters in movies-charts.yml; the
          # people / studio / hand-seasonal collections keep radarr_add_missing:false
          # (tag-only) exactly as the old stack did — acquiring every actor's or
          # studio's full filmography is deliberately NOT enabled.
          radarr:
            url: http://radarr.media.svc.cluster.local:7878
            token: "{{ .RADARR_API_KEY }}"
            add_missing: true
            add_existing: false
            upgrade_existing: false
            monitor: true
            # THEATRICAL-WINDOW GUARD (owner ruling 2026-07-10): 'released' =
            # Radarr minimumAvailability=released, so a newly-added movie is not
            # searched until its physical/digital (home) release per TMDB dates —
            # even if a chart/list/Default names a title still in theaters. This is
            # the global default inherited by every acquisition-ON movie builder;
            # the charts/franchises files and the Defaults above also set it
            # explicitly. VERIFIED LIVE: Radarr movie records added by Kometa show
            # minimumAvailability=released.
            availability: released
            # MUST match a LIVE Radarr profile or Kometa fails the whole Radarr
            # connection (every add_missing/tag op then errors). FHD-UHD is the
            # recyclarr-managed profile (see recyclarr.yml); the old "HD Bluray +
            # WEB" was deleted in the TRaSH rebuild.
            quality_profile: FHD-UHD
            root_folder_path: /data/haynestower/Media/Movies
            search: true
            tag: Kometa-Added
          sonarr:
            url: http://sonarr.media.svc.cluster.local:8989
            token: "{{ .SONARR_API_KEY }}"
            add_missing: true
            add_existing: false
            upgrade_existing: false
            monitor: all
            # recyclarr-managed live profile (old "WEB-1080p" deleted in rebuild)
            quality_profile: FHD-UHD
            root_folder_path: /data/haynestower/Media/TV Shows
            series_type: standard
            season_folder: true
            search: true
            cutoff_search: false
            tag: Kometa-Added
  data:
    - secretKey: TMDB_API_KEY
      remoteRef:
        key: media-stack
        property: TMDB_API_KEY
    - secretKey: MDBLIST_API_KEY
      remoteRef:
        key: media-stack
        property: MDBList_API_KEY
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: media-stack
        property: RADARR_API_KEY
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: media-stack
        property: SONARR_API_KEY
    - secretKey: PLEXOPS_TOKEN
      remoteRef:
        key: homepage
        property: HAYNESOPS_PLEX_API_KEY
