---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./prometheusrule.yaml
  - ./pvc.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: kometa-config-files
    files:
      - movies-franchises.yml=./config/movies-franchises.yml
      - movies-people.yml=./config/movies-people.yml
      - movies-lists.yml=./config/movies-lists.yml
      - movies-charts.yml=./config/movies-charts.yml
      - movies-collections.yml=./config/movies-collections.yml
      - movies-awards.yml=./config/movies-awards.yml
      - movies-star-wars-labels.yml=./config/movies-star-wars-labels.yml
      - shows-franchises.yml=./config/shows-franchises.yml
      - shows-collections.yml=./config/shows-collections.yml
      - shows-default-labels.yml=./config/shows-default-labels.yml
      - music.yml=./config/music.yml
      # App-owned managed includes (ADR-072 / DESIGN-042). haynesnetwork owns these
      # two files exclusively — it regenerates them from validated recipes and opens
      # a bot PR (docs/ops/014-haynesops-collection-writes.md). Empty stubs here until
      # the first app write; Flux mounts them at /config/git alongside the hand files.
      - hnet-managed-movies.yml=./config/hnet-managed-movies.yml
      - hnet-managed-tv.yml=./config/hnet-managed-tv.yml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
