---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kometa
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # Three cadences, one config, ALL NIGHTLY (overlays went nightly
    # 2026-08-01 so new content gets badges next morning instead of
    # waiting for Saturday): operations 03:00 (~5m warm) → overlays
    # 04:00 (~75m — a FIXED ~0.7s/item pass over every overlaid item,
    # trial-proven churn-independent, so nightly costs the same as
    # weekly did) → collections 06:30 (~40-55m; Saturdays add the
    # weekly(saturday) audio-collection filter passes). Spacing gives
    # each run ~2x its healthy ceiling before the next starts, and the
    # PrometheusRule runaway alerts (ops >1h, overlays >2h, collections
    # >2h) page well before neighbors could ever overlap. Overlays
    # runtime scales with LIBRARY SIZE, not new-content volume — if it
    # drifts toward 2h, shrink the pass (drop the ratings overlay
    # first) rather than re-spacing the schedule.
    controllers:
      collections:
        type: cronjob
        cronjob:
          schedule: "30 6 * * *"
          timeZone: America/New_York
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 2
        pod: &pod
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
        initContainers:
          seed-config: &seed
            image: &busybox
              repository: docker.io/library/busybox
              tag: 1.38.0
            command:
              - /bin/sh
              - -c
              - '[ -f /config/config.yml ] && echo "config.yml present, keeping PVC copy" || { cp /seed/config.yml /config/config.yml && echo "seeded config.yml from git"; }'
            securityContext: &sc
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
        containers:
          app: &app
            image:
              repository: docker.io/kometateam/kometa
              tag: v2.4.8
            args: ["--run", "--collections-only"]
            env:
              TZ: America/New_York
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                cpu: 2000m
                # 4Gi OOMKilled on the full-badge overlay pass; 8Gi held but the
                # post-drain overlay run (whole library + audio-collection
                # reorder) is heavier. 16Gi ceiling; workers have plenty.
                memory: 16Gi
            securityContext: *sc
      overlays:
        type: cronjob
        cronjob:
          schedule: "0 4 * * *"
          timeZone: America/New_York
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 2
        pod: *pod
        initContainers:
          seed-config: *seed
        containers:
          app:
            <<: *app
            args: ["--run", "--overlays-only"]
      operations:
        type: cronjob
        cronjob:
          # DAILY (was weekly Sun 1am, 2026-07-19). operations runs mass_*_rating_update,
          # which pulls MDBList per library item. Weekly + a synchronized 60-day rating-
          # cache expiry batched ~6.4k lookups into ONE run and blew the free 1000/day
          # MDBList quota (429s from item ~1000 on; dragged the run to 2h15m). Daily keeps
          # the cache warm so each run only refreshes that day's expired items
          # (~lib/cache_expiration ≈ 50-100/day, well under quota) AND re-caches them
          # across different days, de-synchronizing the expiry. Runs at 03:00 — BEFORE the
          # 04:00 nightly overlays (whose ratings badges redraw off scores this run just
          # refreshed) and the 06:30 collections (which consume the ratings). ~2h during
          # the initial catch-up week, then minutes once the cache is warm. The plex
          # upgrade preflight (shepherd) holds a Plex merge while this runs.
          schedule: "0 3 * * *"
          timeZone: America/New_York
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 2
        pod: *pod
        initContainers:
          seed-config: *seed
        containers:
          app:
            <<: *app
            args: ["--run", "--operations-only"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    persistence:
      config:
        existingClaim: kometa
        globalMounts:
          - path: /config
      # git-managed collection/overlay files — always live, never seeded
      config-git:
        type: configMap
        name: kometa-config-files
        globalMounts:
          - path: /config/git
            readOnly: true
      # config.yml seed (rendered with secrets by external-secrets)
      seed:
        type: secret
        name: kometa-secret
        globalMounts:
          - path: /seed
            readOnly: true
      tmp:
        type: emptyDir
