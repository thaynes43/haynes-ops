---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kometa
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # Three cadences, one config: bounded runtimes instead of the old
    # day-long monolith. Schedules are spaced so runs can't overlap
    # (collections-only finishes well before the weekend jobs start).
    controllers:
      collections:
        type: cronjob
        cronjob:
          schedule: "30 6 * * *"
          timeZone: America/New_York
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 2
        pod: &pod
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
        initContainers:
          seed-config: &seed
            image: &busybox
              repository: docker.io/library/busybox
              tag: 1.38.0
            command:
              - /bin/sh
              - -c
              - '[ -f /config/config.yml ] && echo "config.yml present, keeping PVC copy" || { cp /seed/config.yml /config/config.yml && echo "seeded config.yml from git"; }'
            securityContext: &sc
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
        containers:
          app: &app
            image:
              repository: docker.io/kometateam/kometa
              tag: v2.4.4
            args: ["--run", "--collections-only"]
            env:
              TZ: America/New_York
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 2000m
                memory: 4Gi
            securityContext: *sc
      overlays:
        type: cronjob
        cronjob:
          schedule: "0 1 * * 6"
          timeZone: America/New_York
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 2
        pod: *pod
        initContainers:
          seed-config: *seed
        containers:
          app:
            <<: *app
            args: ["--run", "--overlays-only"]
      operations:
        type: cronjob
        cronjob:
          schedule: "0 1 * * 0"
          timeZone: America/New_York
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 2
        pod: *pod
        initContainers:
          seed-config: *seed
        containers:
          app:
            <<: *app
            args: ["--run", "--operations-only"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    persistence:
      config:
        existingClaim: kometa
        globalMounts:
          - path: /config
      # git-managed collection/overlay files — always live, never seeded
      config-git:
        type: configMap
        name: kometa-config-files
        globalMounts:
          - path: /config/git
            readOnly: true
      # config.yml seed (rendered with secrets by external-secrets)
      seed:
        type: secret
        name: kometa-secret
        globalMounts:
          - path: /seed
            readOnly: true
      tmp:
        type: emptyDir
