---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      seerr:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # Keep off the control-plane nodes (critical smart-home stack).
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
        containers:
          app:
            image:
              # Seerr = the unified Overseerr/Jellyseerr successor; migrated
              # in place from jellyseerr 2.7.3 (automatic on first start).
              repository: ghcr.io/seerr-team/seerr
              tag: v3.3.0
            env:
              TZ: America/New_York
              PORT: &port 5055
              LOG_LEVEL: info
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/status
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 2000m
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              # Next.js writes inside /app at runtime; config PVC covers state
              # but the rootfs can't be locked down like the *arrs.
              readOnlyRootFilesystem: false
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        forceRename: "{{ .Release.Name }}"
        primary: true
        ports:
          http:
            port: *port
    ingress:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/target: internal.haynesops
          gethomepage.dev/href: &url "https://seerr.haynesops.com"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/name: Seerr
          gethomepage.dev/description: Media requests
          gethomepage.dev/icon: jellyseerr
          gethomepage.dev/app: seerr
          gethomepage.dev/siteMonitor: *url
          gethomepage.dev/widget.type: jellyseerr
          gethomepage.dev/widget.url: "http://seerr.media.svc.cluster.local:5055"
          # app-template uses tpl on annotations; escape Homepage var so Helm doesn't render it
          gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_SEERR_API_KEY}}" }}'
        # INTERNAL ONLY by design. The family-facing external URL
        # (overseerr.haynesnetwork.com) cut over from the Unraid overseerr to
        # this app on 2026-07-03 and is served by the traefik-external
        # IngressRoute `overseerr` in the network namespace, which targets this
        # app's Service directly. Keep that host there — do NOT add it here.
        className: traefik-internal
        hosts:
          - host: seerr.haynesops.com
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
    persistence:
      config:
        existingClaim: seerr
        globalMounts:
          - path: /app/config
      tmp:
        type: emptyDir
