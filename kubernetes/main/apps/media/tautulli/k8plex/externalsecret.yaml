---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Seeds Tautulli's config.ini (init container copies only-if-absent, kometa
# pattern): binds the Plex server + skips the first-run wizard. Tautulli
# owns the live copy afterward; its self-generated API key gets harvested
# to media-stack for the homepage widget.
#
# SSO front door (DESIGN-041 D-07 / Q-08, 2026-07-20): the [General] http_basic_
# auth block below is the credential half of the Authentik forward-auth front
# door (blueprints/70-tautulli-lan-frontdoor.yaml). http_hashed_password = 0 so
# Tautulli compares the injected Basic password LITERALLY; user/pass come from
# the 1Password HaynesKube `tautulli-k8plex` Login item (username/password).
# The SAME values are set owner-side on the Authentik `authentik Admins` group
# attributes tautulli_k8plex_user / tautulli_k8plex_password so the outpost
# injects exactly these.
#
# SEED-ONLY: this arms FRESH config.ini copies only. The LIVE instance already
# has a config.ini on its PVC, so this change does NOT enable basic-auth live
# (the init container is copy-if-absent) — the running instance stays OPEN until
# a deliberate arm-time step edits the live config.ini. Enabling live basic-auth
# and attaching the front-door middleware is a coordinated arm-time change (own
# PR), never done before the Authentik attributes are set and the front door is
# verified, so no LAN user is locked out.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tautulli-k8plex
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: tautulli-k8plex-secret
    template:
      engineVersion: v2
      data:
        config.ini: |
          [General]
          first_run_complete = 1
          launch_browser = 0
          check_github = 0
          http_basic_auth = 1
          http_hashed_password = 0
          http_username = {{ .TAUTULLI_BASIC_USER }}
          http_password = {{ .TAUTULLI_BASIC_PASS }}
          [PMS]
          pms_ip = plex.media.svc.cluster.local
          pms_port = 32400
          pms_is_remote = 0
          pms_ssl = 0
          pms_token = {{ .PLEXOPS_TOKEN }}
          pms_identifier = c1b23d688afea4a39ec2c214776832c16be6504d
          pms_name = K8Plex
          pms_url = http://plex.media.svc.cluster.local:32400
          pms_url_manual = 1
  data:
    - secretKey: PLEXOPS_TOKEN
      remoteRef:
        key: homepage
        property: HAYNESKUBE_PLEX_API_KEY
    # 1Password HaynesKube `tautulli-k8plex` Login item (top-level Login fields).
    - secretKey: TAUTULLI_BASIC_USER
      remoteRef:
        key: tautulli-k8plex
        property: username
    - secretKey: TAUTULLI_BASIC_PASS
      remoteRef:
        key: tautulli-k8plex
        property: password
