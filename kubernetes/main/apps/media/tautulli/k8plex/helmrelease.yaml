---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tautulli-k8plex
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      tautulli-k8plex:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
        initContainers:
          seed-config:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0
            command:
              - /bin/sh
              - -c
              - '[ -f /config/config.ini ] && echo "config present" || { cp /seed/config.ini /config/config.ini && echo "seeded"; }'
            securityContext: &sc
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/tautulli
              tag: 2.17.2
            env:
              TZ: America/New_York
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status
                    port: &port 8181
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi
            securityContext: *sc
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        forceRename: "{{ .Release.Name }}"
        primary: true
        ports:
          http:
            port: *port
    ingress:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/target: internal.haynesops
          gethomepage.dev/href: &url "https://tautulli-k8plex.haynesops.com"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/name: Tautulli (K8Plex)
          gethomepage.dev/description: K8Plex watch stats
          gethomepage.dev/icon: tautulli
          gethomepage.dev/app: tautulli-k8plex
          gethomepage.dev/siteMonitor: "http://tautulli-k8plex.media.svc.cluster.local:8181/status"
          gethomepage.dev/widget.type: tautulli
          gethomepage.dev/widget.url: "http://tautulli-k8plex.media.svc.cluster.local:8181"
          # app-template uses tpl on annotations; escape Homepage var so Helm doesn't render it
          gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_TAUTULLI_K8PLEX_API_KEY}}" }}'
        className: traefik-internal
        hosts:
          - host: tautulli-k8plex.haynesops.com
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
    persistence:
      config:
        existingClaim: tautulli-k8plex
      seed:
        type: secret
        name: tautulli-k8plex-secret
        globalMounts:
          - path: /seed
            readOnly: true
      tmp:
        type: emptyDir
