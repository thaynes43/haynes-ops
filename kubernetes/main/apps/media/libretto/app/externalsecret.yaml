---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: libretto
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: libretto-secret
    template:
      engineVersion: v2
      data:
        # Metadata sources, from the dedicated `libretto` item (validated at
        # use, not boot — Libretto degrades per-source if a key is absent).
        HARDCOVER_TOKEN: "{{ .HARDCOVER_TOKEN }}"
        NYT_API_KEY: "{{ .NYT_API_KEY }}"
        # Targets. Env names match libretto's src/config.ts (the ABS token env
        # is ABS_TOKEN); the values are targeted fetches from the items that
        # already own them — nothing is duplicated into the libretto item.
        KAVITA_API_KEY: "{{ .KAVITA_API_KEY }}"
        ABS_TOKEN: "{{ .ABS_API_TOKEN }}"
        LAZYLIBRARIAN_API_KEY: "{{ .LAZYLIBRARIAN_API_KEY }}"
        # Google Books key for the ISBN-first resolve broker (the M3 resolution
        # fix). Rides the shared media-stack item — the SAME key haynesnetwork's
        # goodreads-sync uses. Absent ⇒ the broker is disabled and acquisition
        # falls back to LazyLibrarian's addBookByISBN (validated at use, not boot).
        GOOGLE_BOOKS_API_KEY: "{{ .GOOGLE_BOOKS_API_KEY }}"
        # Shared key guarding everything under /api (unset would mean the API
        # is locked). Owner mints a random string into the `libretto` item —
        # same pattern as haynesnetwork's BETTER_AUTH_SECRET. Consumers
        # (haynesnetwork, curl) present it as a Bearer token: the API checks
        # `Authorization: Bearer <LIBRETTO_API_KEY>` (src/api/app.ts).
        LIBRETTO_API_KEY: "{{ .LIBRETTO_API_KEY }}"
  data:
    # Dedicated `libretto` item: HARDCOVER_TOKEN + NYT_API_KEY (owner-added)
    # and LIBRETTO_API_KEY (owner mints a random string).
    - secretKey: HARDCOVER_TOKEN
      remoteRef:
        key: libretto
        property: HARDCOVER_TOKEN
    - secretKey: NYT_API_KEY
      remoteRef:
        key: libretto
        property: NYT_API_KEY
    - secretKey: LIBRETTO_API_KEY
      remoteRef:
        key: libretto
        property: LIBRETTO_API_KEY
    # Kavita API key from the shared media-stack item (owner ruling
    # 2026-07-16). If the property name is wrong, ESO fails the sync visibly
    # (SecretSyncedError on this ExternalSecret) — fix this one line.
    - secretKey: KAVITA_API_KEY
      remoteRef:
        key: media-stack
        property: KAVITA_API_KEY
    # Google Books key from the shared media-stack item (the same key the
    # frontend haynesnetwork ExternalSecret extracts for its goodreads-sync).
    - secretKey: GOOGLE_BOOKS_API_KEY
      remoteRef:
        key: media-stack
        property: GOOGLE_BOOKS_API_KEY
    # Audiobookshelf root API token — the same dedicated-item fetch the
    # frontend homepage ExternalSecret uses.
    - secretKey: ABS_API_TOKEN
      remoteRef:
        key: audiobookshelf
        property: ABS_API_TOKEN
    # LazyLibrarian API key — the same dedicated-item fetch the
    # downloads-namespace lazylibrarian AND frontend haynesnetwork
    # ExternalSecrets use.
    - secretKey: LAZYLIBRARIAN_API_KEY
      remoteRef:
        key: lazylibrarian
        property: LAZYLIBRARIAN_API_KEY
