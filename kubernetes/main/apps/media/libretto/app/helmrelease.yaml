---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: libretto
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      libretto:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # Keep off the control-plane nodes (critical smart-home stack) —
          # same rule as the rest of the book stack.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
        containers:
          app:
            image:
              # Pre-alpha: pin the publish workflow's sha-<commit> tag — the
              # node's pull path served a STALE `latest` resolution (2026-07-17:
              # two Always-pull restarts kept landing sha-59a653d while GHCR's
              # latest was sha-6094c54), so `latest` is not a reliable deploy
              # key here. Bump this tag per deploy; once releases start, pin
              # tag@digest and let Renovate drive bumps like the siblings.
              repository: ghcr.io/thaynes43/libretto
              tag: sha-4437da2
              pullPolicy: IfNotPresent
            env:
              TZ: America/New_York
              # Targets — in-cluster service DNS (verified against the kavita /
              # audiobookshelf / lazylibrarian app manifests in this repo).
              # LIBRETTO_FAKE_TARGET stays unset: real targets only.
              KAVITA_URL: http://kavita.media.svc.cluster.local:5000
              ABS_URL: http://audiobookshelf.media.svc.cluster.local:13378
              LAZYLIBRARIAN_URL: http://lazylibrarian.downloads.svc.cluster.local:5299
            envFrom:
              - secretRef:
                  name: libretto-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi
            securityContext:
              # Image runs as the node user (uid 1000); the only writable
              # state is /config (the PVC), so the root FS stays read-only.
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        forceRename: "{{ .Release.Name }}"
        primary: true
        ports:
          http:
            port: *port
    # No ingress: cluster-internal only for now — haynesnetwork reaches it at
    # http://libretto.media.svc.cluster.local:8080 with X-Api-Key. Internal
    # ingress (libretto.haynesops.com) is a PLAN-052 follow-up if the owner
    # wants browser access.
    persistence:
      config:
        existingClaim: libretto
        globalMounts:
          - path: /config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
