---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app opsplex
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      opsplex:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          nodeSelector:
            feature.node.kubernetes.io/intel-arrow-lake-gpu: "true"
          # One Plex per iGPU twin while both are up; soft so either instance
          # can fail over to the surviving node (each twin has 3 i915 slots).
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: plex
                    topologyKey: kubernetes.io/hostname
        initContainers:
          # On a FRESH (empty) config volume the runtime creates the parent dirs
          # for the nested Cache/Metadata/Logs mounts as root:root, so Plex
          # (uid 1000) can't write Preferences.xml next to them. Chown just the
          # chain dirs (non-recursive — never touches the DB). No-op once owned.
          # A VolSync restore preserves ownership, so this only matters on
          # first bootstrap.
          init-perms:
            image:
              repository: docker.io/library/busybox
              tag: 1.37.0
            command:
              - /bin/sh
              - -c
              - |-
                mkdir -p '/config/Library/Application Support/Plex Media Server'
                chown 1000:1000 /config/Library '/config/Library/Application Support' '/config/Library/Application Support/Plex Media Server'
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/plex
              tag: 1.43.2.10687@sha256:be00a2ad851ea3193cd870636f908eb6425ad89390f23cdb08daa35ab5cceacc
            env:
              TZ: America/New_York
              PLEX_ADVERTISE_URL: https://opsplex.haynesnetwork.com:443,http://192.168.40.211:32400
              PLEX_NO_AUTH_NETWORKS: 192.168.0.0/24
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /identity
                    port: &port 32400
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
               allowPrivilegeEscalation: false
               readOnlyRootFilesystem: true
               capabilities: { drop: ["ALL"] }
            resources:
              requests:
                gpu.intel.com/i915: 1
                cpu: 1000m
              limits:
                gpu.intel.com/i915: 1
                memory: 32Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [44]
    service:
      app:
        controller: opsplex
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.40.211
        ports:
          http:
            port: 32400
    ingress:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/target: ingress-ext.haynesnetwork.com
          # Homepage
          gethomepage.dev/href: &url "https://opsplex.haynesnetwork.com"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/name: OpsPlex
          gethomepage.dev/description: Media server (Unraid mirror)
          gethomepage.dev/icon: plex
          gethomepage.dev/app: opsplex
          # Use Service directly for accurate monitoring
          gethomepage.dev/siteMonitor: "http://opsplex.media.svc.cluster.local:32400/identity"
        className: traefik-external
        hosts:
          - host: "opsplex.haynesnetwork.com"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - secretName: certificate-haynesnetwork
            hosts:
                - opsplex.haynesnetwork.com
    persistence:
      config:
        existingClaim: opsplex
      config-cache:
        existingClaim: opsplex-cache
        globalMounts:
          - path: /config/Library/Application Support/Plex Media Server/Cache
      # Regenerable artwork on a separate, non-backed-up PVC (keeps the VolSync
      # backup of `opsplex` to just the library DB + prefs). Plex re-fetches if lost.
      config-metadata:
        existingClaim: opsplex-metadata
        globalMounts:
          - path: /config/Library/Application Support/Plex Media Server/Metadata
            subPath: Metadata
          - path: /config/Library/Application Support/Plex Media Server/Media
            subPath: Media
      config-logs:
        type: emptyDir
        globalMounts:
          - path: /config/Library/Application Support/Plex Media Server/Logs
      transcode:
        type: emptyDir
      # Unraid media library (movies/TV) — read-only mirror of what the
      # haynestower Plex serves.
      media-haynestower:
        type: nfs
        server: haynestower.haynesnetwork
        path: /mnt/user/data
        advancedMounts:
          opsplex:
            app:
              - path: /data/haynestower
                readOnly: true
      # Cluster-side media root (music from lidarr, ytdl content) so opsplex
      # can take over everything when it becomes the primary server.
      media-gasha:
        type: nfs
        server: gasha01.haynesnetwork
        path: /hdd-nfs-repl
        advancedMounts:
          opsplex:
            app:
              - path: /data/gasha01
                subPath: data
                readOnly: true
      tmp:
        type: emptyDir
