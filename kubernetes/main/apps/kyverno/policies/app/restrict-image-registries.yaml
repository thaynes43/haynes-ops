---
# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/kyverno/main/api/kyverno/v1/clusterpolicy.json
# Blocks images from a non-allowlisted registry HOST (a brand-new registry, e.g.
# attacker.io/...). NOTE its residual value is modest: a host allowlist of
# ghcr.io/docker.io/quay.io barely constrains an attacker (anyone can push there).
# The org-swap threat (ghcr.io/home-operations/x -> ghcr.io/attacker/x) is caught by
# diff-scope, and image *provenance* by the cosign verifyImages policy — this is the
# weakest of the three, kept as defense-in-depth (per Tom, 2026-07-02).
#
# WHY foreach + {{ images }} instead of a pattern match: Kyverno's `images` context
# NORMALIZES each image (bare `busybox:latest` -> registry `docker.io`), so this
# correctly allows implicit-docker.io images that a literal `docker.io/*` pattern
# rejected (that mismatch was the bulk of the 101 Phase-A audit fails; the rest were
# reg.kyverno.io + mirror.gcr.io, now allowlisted).
#
# PHASE C: still Audit here; flip to Enforce (first of the three) only after the audit
# report shows ~0 unexpected fails. fail-open so a Kyverno outage never wedges a Flux
# apply.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
spec:
  background: true
  webhookConfiguration:
    failurePolicy: Ignore
  rules:
    - name: validate-registries
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Enforce
        message: >-
          A container image is from a non-allowlisted registry. Allowed: ghcr.io,
          docker.io, quay.io, registry.k8s.io, gcr.io, mirror.gcr.io, k8s.gcr.io,
          public.ecr.aws, mcr.microsoft.com, cgr.dev, registry.gitlab.com, reg.kyverno.io,
          nvcr.io, us-east1-docker.pkg.dev.
        foreach:
          - list: request.object.spec.containers
            deny:
              conditions:
                all:
                  - key: '{{ images.containers."{{ element.name }}".registry }}'
                    operator: AnyNotIn
                    value: &allowed
                      - ghcr.io
                      - docker.io
                      - quay.io
                      - registry.k8s.io
                      - gcr.io
                      - mirror.gcr.io
                      - k8s.gcr.io
                      - public.ecr.aws
                      - mcr.microsoft.com
                      - cgr.dev
                      - registry.gitlab.com
                      - reg.kyverno.io
                      - nvcr.io
                      # Google Artifact Registry, us-east1 — the sigoalumni.org
                      # front page image (frontend/sigoalumni, ADR 0004 wave 1)
                      # is pulled from the private sigo-alumni-prod repo there.
                      # Host-level like every other entry; org/repo-swap and
                      # provenance are the other two policies' jobs (see header).
                      - us-east1-docker.pkg.dev
          - list: request.object.spec.initContainers
            deny:
              conditions:
                all:
                  - key: '{{ images.initContainers."{{ element.name }}".registry }}'
                    operator: AnyNotIn
                    value: *allowed
          - list: request.object.spec.ephemeralContainers
            deny:
              conditions:
                all:
                  - key: '{{ images.ephemeralContainers."{{ element.name }}".registry }}'
                    operator: AnyNotIn
                    value: *allowed
