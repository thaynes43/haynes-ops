---
# Two existing cluster-admin ClusterRoleBindings are RE-APPLIED by Flux on every
# reconcile, so under restrict-rbac-escalation Enforce they'd be denied on the next
# apply and wedge their controller:
#   - cluster-reconciler-flux-system : the Flux bootstrap binding, re-applied by
#     kustomize-controller (label kustomize.toolkit.fluxcd.io/name=flux). Denying it
#     stops GitOps entirely.
#   - headlamp-admin : chart RBAC, re-applied by helm-controller.
# (The third cluster-admin binding, `cluster-admin`, is a kube-apiserver bootstrap
# default — never re-applied — so it needs no exception.)
#
# Exempt them BY RESOURCE NAME, not by requester/subject (invalid under
# background:true) and NOT by excluding kustomize-controller globally (that is the
# apply path a malicious shepherd PR would take — it must stay covered). Any OTHER
# cluster-admin binding is still denied.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: rbac-flux-headlamp-bootstrap-bindings
  namespace: kyverno
spec:
  exceptions:
    - policyName: restrict-rbac-escalation
      ruleNames:
        - no-privileged-role-binding
        - autogen-no-privileged-role-binding
  match:
    any:
      - resources:
          kinds:
            - ClusterRoleBinding
          names:
            - cluster-reconciler-flux-system
            - headlamp-admin
