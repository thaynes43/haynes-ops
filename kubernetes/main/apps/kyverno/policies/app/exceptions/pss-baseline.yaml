---
# Per-workload exemptions from pod-security-baseline for the legitimately-privileged
# infrastructure enumerated from the Phase-A audit report (2026-07-02). Each violates a
# baseline control for a real infra reason (hostNetwork, hostPath to /dev|/sys|/lib/
# modules|/var/lib/rook, NET_ADMIN/NET_RAW, privileged). Scoped by namespace + name so a
# NEW/other workload in the same namespace is still checked — NOT a whole-namespace
# webhook exclude (kube-system/flux-system must never be blanket-excluded).
#
# Rule names cover the base rule + both autogen variants (baseline / autogen-baseline /
# autogen-cronjob-baseline) so controllers, Jobs, and bare Pods are all exempted.
#
# App-level flags to revisit (not infra — could be tightened instead of exempted):
#   - ai/comfyui           : securityContext.privileged=true (GPU usually needs the
#                            device plugin, NOT privileged — candidate to drop).
#   - frontend/omni        : NET_ADMIN+NET_RAW+privileged; it's the self-hosted Omni for
#                            the powered-off/unused edge cluster — candidate to remove.
#   - home-automation/music-assistant : hostNetwork for cast/DLNA discovery (legit).
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: pss-baseline-privileged-infra
  namespace: kyverno
spec:
  exceptions:
    - policyName: pod-security-baseline
      ruleNames:
        - baseline
        - autogen-baseline
        - autogen-cronjob-baseline
  match:
    any:
      # Dedicated privileged storage namespace (mons/osds/mgr/mds/rgw/csi/crash/exporter/
      # discover) — the entire namespace is Ceph infra.
      - resources:
          kinds: [Pod, Deployment, StatefulSet, DaemonSet, Job, CronJob, ReplicaSet]
          namespaces: [rook-ceph]
      # Standalone ceph-csi for the EXTERNAL proxmox ceph (gasha01-rbd StorageClass,
      # 2026-08-21): nodeplugin + provisioner need privileged/hostPath (/sys,
      # /lib/modules, /dev, kubelet dirs) for the same reasons rook's csi pods do.
      # Named, not whole-namespace, per this file's rule.
      - resources:
          kinds: [Pod, Deployment, StatefulSet, DaemonSet, Job, CronJob, ReplicaSet]
          namespaces: [ceph-csi]
          names:
            - gasha01-rbd-ceph-csi-rbd-nodeplugin*
            - gasha01-rbd-ceph-csi-rbd-provisioner*
      # kube-system: CNI, device plugins, spegel, NFD, and the control-plane STATIC pods
      # (mirror pods re-created on node reboot). Named, never whole-namespace.
      - resources:
          kinds: [Pod, Deployment, StatefulSet, DaemonSet, Job, CronJob, ReplicaSet]
          namespaces: [kube-system]
          names:
            - cilium*
            - generic-device-plugin*
            - intel-gpu-plugin*
            - nvidia-device-plugin*
            - inteldeviceplugins*
            - node-feature-discovery*
            - spegel*
            - kube-apiserver-*
            - kube-controller-manager-*
            - kube-scheduler-*
      - resources:
          kinds: [Pod, Deployment, StatefulSet, DaemonSet, Job, CronJob, ReplicaSet]
          namespaces: [observability]
          names:
            - node-exporter*
            - promtail*
            - smartctl-exporter*
            - blackbox-exporter*
      - resources:
          kinds: [Pod, Deployment, StatefulSet, DaemonSet, Job, CronJob, ReplicaSet]
          namespaces: [network]
          names:
            - multus*
      - resources:
          kinds: [Pod, Deployment, StatefulSet, DaemonSet, Job, CronJob, ReplicaSet]
          namespaces: [ai]
          names:
            - comfyui*
      - resources:
          kinds: [Pod, Deployment, StatefulSet, DaemonSet, Job, CronJob, ReplicaSet]
          namespaces: [home-automation]
          names:
            - music-assistant*
      - resources:
          kinds: [Pod, Deployment, StatefulSet, DaemonSet, Job, CronJob, ReplicaSet]
          namespaces: [frontend]
          names:
            - omni*
      # VolSync movers — EPHEMERAL (only exist during a backup/restore), so they were
      # absent from the audit scan but can fail baseline (privileged / host mounts,
      # depending on the mover config) when they run, in ~18 app namespaces. Matched by
      # the stable label VolSync stamps on every mover pod (verified on a live mover
      # 2026-07-02: `volsync-src-open-webui-aws-nkgff` carried it) PLUS the name pattern
      # as belt-and-braces.
      - resources:
          kinds: [Pod, Job]
          selector:
            matchLabels:
              app.kubernetes.io/created-by: volsync
      - resources:
          kinds: [Pod, Job]
          names:
            - volsync-src-*
            - volsync-dst-*
      # OpenEBS localpv provisioning helpers — EPHEMERAL bare Pods the provisioner
      # spawns in the PVC's namespace to mkdir/rm the hostpath dir (privileged +
      # hostPath /var/openebs/local), so they were absent from the audit scan like
      # the VolSync movers. First hit: opsplex bootstrap 2026-07-02 (provisioning
      # of volsync-dst-opsplex-dst-cache denied -> PVC Pending forever).
      # All three prefixes from provisioner-localpv v4.5.1 helper templates
      # (init/cleanup/quota + "-<pvName>", pvName = pvc-<uid>). Helper pods carry NO
      # labels upstream, so name globs are the only in-resource scoping. NOTE: a
      # `subjects:` (provisioner-SA) scoped exception — the "stronger" fix — is NOT
      # possible: Kyverno forbids `subjects` in a PolicyException for a background:true
      # policy ("Usage of user info is forbidden", verified 2026-07-03), and dropping
      # background scanning would blind the audit reports. Name globs stand; the residual
      # name-spoof risk needs pre-existing pod-create RBAC to exploit. Periodic check that
      # no new ephemeral spawner is being denied: .agents/runbooks/kyverno-enforce-verify.md.
      - resources:
          kinds: [Pod]
          names:
            - init-pvc-*
            - cleanup-pvc-*
            - quota-pvc-*
