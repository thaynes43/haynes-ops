---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/policies.kyverno.io/validatingpolicy_v1.json
# dev-env v2: guard CONNECT pods/exec, pods/attach, pods/proxy and pods/portforward
# to privileged pods (DESIGN-001 6.11, D-19; DESIGN-064 5.8, OP859 rule 2).
# This policy does not match services/proxy. The identity guard refuses CONNECT
# services/proxy in upgrade-agent for the same matched dev-agents identities.
# Elsewhere, where the identity guard permits it, services/proxy still reaches a
# pod behind a Service even when its account is listed below (DESIGN-064 5.8).
# The agent keeps v1's exec everywhere else, as v1 has it (Tom, 2026-08-06): exec
# reads the Secrets of the pod it enters, which is accepted. Exec into a pod that runs as
# a powerful ServiceAccount is not: it hands the agent that identity (haynes-ops #3392;
# for example the cluster-admin headlamp pod). Nor is exec into a privileged or host-PID
# pod, which is root on its node.
#
# Kyverno, not the ValidatingAdmissionPolicy guards in apps/dev-env-system/rbac: the rule
# needs the target pod, and only Kyverno's resource.Get can look it up at admission.
# The VAP dev-env-identity-guard refuses all four Pod CONNECT subresources in the
# dev-env namespaces. Its controller-namespace rule 1b covers exec and attach only.
# For the baseline dev-env-agent, this policy's target checks refuse Pod proxy and
# port-forward in other controller namespaces only for a listed account, hostPID,
# or a privileged regular/init container; lookup errors also refuse. Neither guard
# covers that baseline identity's Pod proxy or port-forward in kube-system or kyverno:
# Kyverno's resourceFilters and webhook namespaceSelector skip both namespaces.
# Grant identities are separately refused by identity-guard rule 2 in flux-system,
# external-secrets, kube-system and kyverno, including CONNECT (DESIGN-064 5.8).
#
# THE PRIVILEGED LIST below is the one place to add a new powerful ServiceAccount outside
# those namespaces: any ServiceAccount bound cluster-wide to cluster-admin, a wildcard
# write, Secret read, serviceaccounts/token, pod create, nodes/proxy or
# escalate/bind/impersonate, and any pod holding v1's unguarded OPERATOR tier. Built from
# the cluster's ClusterRoleBindings on 2026-10-06. A new controller namespace goes in the
# identity guard's controllerNamespaces.
#
# Summoning callers are listed because their operator API tokens identify the caller
# (dev-env DESIGN-064 5.8, OpenProject #811/#859). This policy refuses pods/exec,
# pods/attach, pods/proxy and pods/portforward by a matched dev-agents session identity
# to a pod running as a listed account, or with hostPID or a privileged regular/init
# container, where Kyverno receives the request.
# The workbench identity and identities outside dev-agents, including v1's
# upgrade-agent/dev-env-ops, are not matched. The operator API authenticates the
# caller's ServiceAccount and CallerPolicy, not a CronJob; upgrade-shepherd's account
# is shared by three CronJobs. Summoned-session creates are currently disabled.
# Add every new summoning caller here in the PR that adds its CallerPolicy.
# TestSummoningCallerExecGuardCoverage fails if its account is missing.
#
# Matched by username to every dev-agents identity but the workbench (the same identities
# as dev-env-identity-guard). failurePolicy Fail: Kyverno 1.19 copies a CEL policy's
# matchConditions into its own fine-grained webhook, so the API server applies the
# username match first and a Kyverno outage refuses these connections only to matched
# dev-agents identities. If the pod cannot be read the connection is refused too.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: dev-env-exec-guard
  annotations:
    policies.kyverno.io/title: >-
      dev-env Pod connections; services/proxy is not matched here, is refused in
      upgrade-agent by the identity guard, and elsewhere can still reach a pod
      behind a Service even when that pod's account is listed
    policies.kyverno.io/category: dev-env
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Refuses CONNECT pods/exec, pods/attach, pods/proxy and pods/portforward by a
      matched dev-agents identity to a pod that runs as a listed ServiceAccount,
      has hostPID, or has a privileged regular or init container where Kyverno
      receives the request. The workbench and identities outside dev-agents are
      not matched. This policy does not match services/proxy; the identity guard
      refuses it in upgrade-agent. Elsewhere, where that guard permits it, a
      session can still reach a pod behind a Service even when its account is
      listed here (DESIGN-064 5.8).
spec:
  failurePolicy: Fail
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CONNECT"]
        resources: ["pods/exec", "pods/attach", "pods/proxy", "pods/portforward"]
  matchConditions:
    - name: dev-agents-identity
      expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:dev-agents:') &&
        request.userInfo.username != 'system:serviceaccount:dev-agents:dev-env-workbench'
  variables:
    # ServiceAccounts, '<namespace>/<name>', outside the controller namespaces.
    - name: privilegedServiceAccounts
      expression: >-
        ['frontend/headlamp',
         'dev/dev-env', 'upgrade-agent/dev-env-ops',
         'upgrade-agent/alert-responder', 'upgrade-agent/upgrade-shepherd',
         'upgrade-agent/upgrade-health-gate', 'upgrade-agent/cigar-curation',
         'database/cloudnative-pg', 'database/dragonfly-operator-controller-manager',
         'network/multus', 'network/traefik-external', 'network/traefik-internal',
         'observability/grafana', 'observability/kube-prometheus-stack-operator',
         'observability/kube-state-metrics', 'observability/loki', 'observability/promtail',
         'rook-ceph/rook-ceph-system', 'rook-ceph/objectstorage-provisioner',
         'rook-ceph/rook-ceph-cephfs-csi-ceph-com-ctrlplugin-sa',
         'rook-ceph/rook-ceph-cephfs-csi-ceph-com-nodeplugin-sa',
         'rook-ceph/rook-ceph-rbd-csi-ceph-com-ctrlplugin-sa',
         'rook-ceph/rook-ceph-rbd-csi-ceph-com-nodeplugin-sa']
    # Kubernetes pod proxy names are pod, pod:port or scheme:pod:port, with
    # numeric or named ports. Resolve the Pod before resource.Get; looking up the
    # colon-bearing endpoint would also fail closed for an ordinary allowed pod.
    - name: proxyNameParts
      expression: request.name.split(':')
    - name: podName
      expression: >-
        request.subResource != 'proxy' ? request.name :
        size(variables.proxyNameParts) == 3 ? variables.proxyNameParts[1] :
        size(variables.proxyNameParts) == 2 ? variables.proxyNameParts[0] : request.name
    - name: pod
      expression: resource.Get("v1", "pods", request.namespace, variables.podName)
    - name: serviceAccount
      expression: >-
        request.namespace + '/' + variables.pod.spec.?serviceAccountName.orValue('default')
  validations:
    - expression: "!(variables.serviceAccount in variables.privilegedServiceAccounts)"
      messageExpression: >-
        'dev-env-exec-guard: a dev-env agent may not ' + request.subResource + ' to ' + request.name +
        ', which runs as the privileged ServiceAccount ' + variables.serviceAccount +
        ' (haynes-ops #3392, DESIGN-001 D-19; DESIGN-064 5.8, OP859 rule 2)'
    - expression: >-
        !variables.pod.spec.?hostPID.orValue(false) &&
        !(variables.pod.spec.?containers.orValue([]) + variables.pod.spec.?initContainers.orValue([])).exists(c,
          c.?securityContext.?privileged.orValue(false))
      messageExpression: >-
        'dev-env-exec-guard: a dev-env agent may not ' + request.subResource + ' to ' + request.name +
        ', a privileged or host-PID pod, which is root on its node (DESIGN-001 D-19; DESIGN-064 5.8, OP859 rule 2)'
