---
# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/kyverno/main/api/kyverno/v1/clusterpolicy.json
# Closes the backdoored-image gap for our HIGHEST-trust images: a pure tag/digest bump
# to a malicious image on our OWN repo path passes diff-scope + the registry allowlist,
# but NOT this — it requires a keyless cosign signature proving the image was built by
# OUR GitHub Actions workflow (OIDC identity), not swapped by an attacker.
#
# SCOPE: only the images whose build workflows sign (upgrade-agent, upgrade-shepherd,
# dev-env). Other ghcr.io/thaynes43/* images (appdaemon, hass-immich-addon,
# todos-for-dues, ytdl-sub-config-manager) are NOT covered yet — add them here as
# their builds gain `cosign sign` (appdaemon is the next one, in hass-sandbox).
#
# PHASE: Audit first (observe the report), then flip to Enforce once the running/summoned
# pods are all on signed digests. fail-open (failurePolicy: Ignore). background:false —
# verifyImages verifies at admission (it needs the request + reaches Fulcio/Rekor).
#
# STATUS (2026-09-01): NOT VERIFYING. The Cosign-type attestor below reads the legacy
# signature tag (`sha256-<digest>.sig`). The build workflows moved to cosign v3 on
# 2026-07-25 (Renovate bump of cosign-installer's cosign-release), and v3 writes only
# the Sigstore bundle format (`sha256-<digest>` referrer tag on GHCR) with no legacy
# switch — so every self-built image since then reports "no signatures found" here
# (policyreports in dev + upgrade-agent). Audit hides it. Do NOT flip to Enforce until
# either the workflows pin cosign v2 again or this rule moves to a bundle-aware
# verifier; details next to `cosign-release` in .github/workflows/dev-env-build.yml.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-thaynes43-images
spec:
  background: false
  webhookConfiguration:
    failurePolicy: Ignore
  rules:
    - name: verify-self-built
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/thaynes43/upgrade-agent*"
            - "ghcr.io/thaynes43/upgrade-shepherd*"
            - "ghcr.io/thaynes43/dev-env*"
          failureAction: Audit
          mutateDigest: false   # we pin tag@digest in the manifests; don't rewrite
          verifyDigest: false
          required: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    # The GitHub Actions OIDC identity of our build workflows on main.
                    subject: "https://github.com/thaynes43/haynes-ops/.github/workflows/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
    - name: verify-cigar-journal
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/thaynes43/cigar-journal:*"
          failureAction: Audit
          mutateDigest: false
          verifyDigest: false
          required: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    # Signed by the cigar-journal repo's publish workflow
                    # (release tags; workflow_dispatch runs sign from main).
                    subject: "https://github.com/thaynes43/cigar-journal/.github/workflows/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
