---
# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/kyverno/main/api/kyverno/v1/clusterpolicy.json
# Closes the backdoored-image gap for our HIGHEST-trust images: a pure tag/digest bump
# to a malicious image on our OWN repo path passes diff-scope + the registry allowlist,
# but NOT this — it requires a keyless cosign signature proving the image was built by
# OUR GitHub Actions workflow (OIDC identity), not swapped by an attacker.
#
# SCOPE: only the images whose build workflows sign (upgrade-agent, upgrade-shepherd,
# dev-env, comfyui, actions-runner). Other ghcr.io/thaynes43/* images (appdaemon, hass-immich-addon,
# todos-for-dues, ytdl-sub-config-manager) are NOT covered yet — add them here as
# their builds gain `cosign sign` (appdaemon is the next one, in hass-sandbox).
#
# PHASE: Audit first (observe the report), then flip to Enforce once the running/summoned
# pods are all on signed digests. fail-open (failurePolicy: Ignore). background:false —
# verifyImages verifies at admission (it needs the request + reaches Fulcio/Rekor).
#
# STATUS (2026-10-07): the Cosign-type attestor reads legacy
# `sha256-<digest>.sig` tags. The haynes-ops image workflows now keep cosign v3.1.3
# and explicitly emit that format with --new-bundle-format=false,
# --use-signing-config=false and --registry-referrers-mode=legacy. Their existing
# bundle-only digests need the verified repair-image-signatures.yml helper;
# rebuilding a tag does not repair an older pinned digest. Keep Audit until the
# running digests have legacy signatures or the verifier supports bundles.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-thaynes43-images
spec:
  background: false
  webhookConfiguration:
    failurePolicy: Ignore
  rules:
    - name: verify-self-built
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/thaynes43/upgrade-agent*"
            - "ghcr.io/thaynes43/upgrade-shepherd*"
            # 2026-10-06: v1 only (`0.*`). Every v1 pin (dev-env HR, dev-env-ops HR, vexa
            # scribe-notes job) is 0.6.x. The old `dev-env*` glob also matched the v2
            # images (dev-env-operator:sha-*, dev-env:2.*) that verify-dev-env-v2 owns.
            - "ghcr.io/thaynes43/dev-env:0.*"
            - "ghcr.io/thaynes43/comfyui*"
            - "ghcr.io/thaynes43/actions-runner:*"
          failureAction: Audit
          mutateDigest: false   # we pin tag@digest in the manifests; don't rewrite
          verifyDigest: false
          required: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    # The GitHub Actions OIDC identity of our build workflows on main.
                    subject: "https://github.com/thaynes43/haynes-ops/.github/workflows/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
    # 2026-10-06 (dev-env v2, plan 01 item 8.2): the thaynes43/dev-env repo signs
    # `dev-env-operator:sha-<short>` from .github/workflows/publish.yml on main, and the
    # v2 agent image `dev-env:2.x.y` from publish-agent.yml on a v2.x.y release tag
    # (KICKOFF B5, D-53). Each image has its own verifyImages entry below: the operator's
    # subject allows any workflow of that repo but ONLY on refs/heads/main (unlike the
    # haynes-ops rule above, which has no ref pin); the agent's is that one workflow on
    # refs/tags/v2.*. Separate rule so a
    # haynes-ops workflow cannot vouch for a v2 image or the reverse. `dev-env:2.*`
    # keeps v1's 0.x tags out. Same attestor settings as verify-self-built, same cosign
    # v3.1.3 signing pin: so it has the SAME "no signatures found" gap (haynes-ops
    # #3092, legacy .sig vs Sigstore bundle). Audit, so nothing is gated; do not flip
    # to Enforce before #3092 is fixed. verify-self-built's v1 glob was narrowed to
    # `dev-env:0.*` on 2026-10-06 so the two rules no longer overlap. Both rules are
    # still Audit and still unverifying (#3092). Move to ImageValidatingPolicy with #3405.
    - name: verify-dev-env-v2
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        # The operator image: signed by thaynes43/dev-env publish.yml on main.
        - imageReferences:
            - "ghcr.io/thaynes43/dev-env-operator*"
          failureAction: Audit
          mutateDigest: false
          verifyDigest: false
          required: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    # thaynes43/dev-env workflows, main branch only.
                    subject: "https://github.com/thaynes43/dev-env/.github/workflows/*@refs/heads/main"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
        # The agent image `dev-env:2.x.y` (thaynes43/dev-env KICKOFF B5, D-53): signed by
        # publish-agent.yml, which runs from a release tag, so the certificate subject
        # ends in `@refs/tags/v2.x.y`, not `@refs/heads/main`. A separate entry so a
        # main-branch workflow cannot vouch for the agent image, or a tag for the operator.
        # `dev-env:2.*` keeps v1's 0.x tags out.
        - imageReferences:
            - "ghcr.io/thaynes43/dev-env:2.*"
          failureAction: Audit
          mutateDigest: false
          verifyDigest: false
          required: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: "https://github.com/thaynes43/dev-env/.github/workflows/publish-agent.yml@refs/tags/v2.*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
    - name: verify-cigar-journal
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/thaynes43/cigar-journal:*"
          failureAction: Audit
          mutateDigest: false
          verifyDigest: false
          required: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    # Signed by the cigar-journal repo's publish workflow
                    # (release tags; workflow_dispatch runs sign from main).
                    subject: "https://github.com/thaynes43/cigar-journal/.github/workflows/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
