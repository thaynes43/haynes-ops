---
# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/kyverno/main/api/kyverno/v1/clusterpolicy.json
# Kyverno-native Pod Security Standards (baseline) — covers hostNamespaces, privileged,
# capabilities.add, hostPath, hostPorts, procMount, seccomp, sysctls (the
# holes a hand-rolled pattern would miss). Autogen covers all controllers.
#
# The baseline is enforced without namespace exclusions. Per-workload
# PolicyExceptions admit approved workloads that need an exception; background
# reports record violations. The webhook fails open so a Kyverno outage never
# wedges a Flux apply.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: pod-security-baseline
spec:
  background: true
  webhookConfiguration:
    failurePolicy: Ignore
  rules:
    - name: baseline
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Enforce
        podSecurity:
          level: baseline
          version: latest
