---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
# Regression guard for the default-cpu-request backstop (#3408). Since #3389 no
# long-running pod is BestEffort, and the LimitRange keeps new ones out of that class in
# every namespace it covers. This fires if one appears anyway:
#   - in a namespace the LimitRange skips (kube-system, flux-system, kyverno, ...), e.g.
#     a new chart there that ships without requests;
#   - in a covered namespace whose LimitRange is missing (it was created while Kyverno
#     was down, since the generate webhook fails open) or that set an explicit `cpu: 0`.
# Built on kube-state-metrics rather than a Kyverno audit policy, because Kyverno's
# resourceFilters skip kube-system, kube-public, kube-node-lease and kyverno entirely, so
# an audit rule could not see the namespaces this most needs to watch.
# Job pods are excluded: they are short-lived. warning = visible in Alertmanager and
# Grafana, never a page (the root route is null; only critical pages).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: besteffort-pod-rules
  namespace: kyverno
spec:
  groups:
    - name: besteffort-pod.rules
      rules:
        - alert: BestEffortPod
          annotations:
            summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} is BestEffort.
            description: >-
              {{ $labels.namespace }}/{{ $labels.pod }} has been running for 1h with no CPU
              or memory request on any container, so it gets CPU weight 1 and starves
              first when its node is saturated (the 2026-10-05 talosm02 outage). Give
              the workload requests in its HelmRelease. If the namespace is not
              excluded by the default-cpu-request ClusterPolicy, also check that its
              LimitRange exists: `kubectl get limitrange -n {{ $labels.namespace }}`.
          expr: |
            (
              max by (namespace, pod) (kube_pod_status_qos_class{qos_class="BestEffort"} == 1)
                and on (namespace, pod)
              max by (namespace, pod) (kube_pod_status_phase{phase="Running"} == 1)
            )
              unless on (namespace, pod)
            max by (namespace, pod) (kube_pod_info{created_by_kind="Job"})
          for: 1h
          labels:
            severity: warning
