# UNAPPLIED. Named GET lookups by admission, not executor or session authority.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-env-maintenance-admission-lookups
  namespace: dev-agents
rules:
  - apiGroups: [dev-env.haynesops.com]
    resources: [accessgrants]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-env-maintenance-admission-lookups
  namespace: dev-agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dev-env-maintenance-admission-lookups
subjects:
  - kind: ServiceAccount
    name: kyverno-admission-controller
    namespace: kyverno
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dev-env-maintenance-admission-lookups
rules:
  - apiGroups: ['']
    resources: [nodes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dev-env-maintenance-admission-lookups
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dev-env-maintenance-admission-lookups
subjects:
  - kind: ServiceAccount
    name: kyverno-admission-controller
    namespace: kyverno
