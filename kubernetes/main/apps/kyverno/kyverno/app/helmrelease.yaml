---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
spec:
  interval: 30m
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: kyverno
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  values:
    # HA so admission is not a single point of failure.
    admissionController:
      replicas: 2
      # Scrape Kyverno metrics (admission-request/block counters) so we can alert on
      # admission denials + controller health (was unscraped -> the OOM + OpenEBS-deny
      # incidents were both silent).
      serviceMonitor:
        enabled: true
      container:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
    backgroundController:
      replicas: 1
      serviceMonitor:
        enabled: true
      # Chart default (64Mi/128Mi) OOMKilled during a large Renovate reconcile wave
      # (2026-07-19, ~22 image bumps merged together): the background-controller
      # re-scans every changed resource against all policies and churns policy reports,
      # so a big batch spikes it past 128Mi (sawtooth, not a leak). Cluster has ample
      # RAM — give it a wide 2Gi ceiling so no bulk reconcile can OOM it again (request
      # stays modest at 256Mi; steady-state working set is ~65Mi).
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 2Gi
    reportsController:
      replicas: 1
      serviceMonitor:
        enabled: true
      # Chart default (64Mi/128Mi) OOMKills on this cluster: the reports-controller holds
      # informer caches for every scanned resource (~2200 pods/deployments/RBAC objects,
      # incl. the cluster RBAC we added for restrict-rbac-escalation visibility) plus the
      # background-scan report churn + verifyImages. Working set is ~85-125Mi with
      # scan-cycle spikes that tipped over 128Mi (sawtooth OOM, not a leak — 24h trend).
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
    cleanupController:
      replicas: 1
      serviceMonitor:
        enabled: true
    features:
      # PolicyExceptions ONLY creatable in the kyverno namespace (GHSA-qjvc-p88j-j9rm)
      # — otherwise the shepherd could commit a self-exempting exception anywhere.
      policyExceptions:
        enabled: true
        namespace: kyverno
    config:
      # Exclude ONLY Kyverno's own components from admission — NOT flux-system/
      # kube-system (the two highest-value namespaces the shepherd could target).
      excludeKyvernoNamespace: true
