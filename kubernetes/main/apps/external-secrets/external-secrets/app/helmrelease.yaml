---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: external-secrets
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: onepassword-connect
      namespace: external-secrets
  values:
    installCRDs: true
    serviceMonitor:
      enabled: true
      interval: 1m
    # #3389: requests sized from Prometheus (7d p95, 30d peak); no CPU limits.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 768Mi
    webhook:
      serviceMonitor:
        enabled: true
        interval: 1m
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          memory: 192Mi
    certController:
      serviceMonitor:
        enabled: true
        interval: 1m
      resources:
        requests:
          cpu: 25m
          memory: 96Mi
        limits:
          memory: 768Mi
