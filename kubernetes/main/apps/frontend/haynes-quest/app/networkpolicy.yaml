---
# A future ephemeral validation Job may read app and Immich credentials. Keep its
# egress limited to DNS resolution of, and API traffic to, Immich.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: haynes-quest-secret-check
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: haynes-quest-secret-check
  ingress: []
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: immich-server.photos.svc.cluster.local
    - toServices:
        - k8sService:
            serviceName: immich-server
            namespace: photos
      toPorts:
        - ports:
            - port: "2283"
              protocol: TCP
---
# The provisioning Job can resolve and reach only the shared PostgreSQL writer.
# Its administrator credential never enters an application pod.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: haynes-quest-db-init
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: haynes-quest
      app.kubernetes.io/component: database-init
  ingress: []
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: postgres16-rw.database.svc.cluster.local
    - toServices:
        - k8sService:
            serviceName: postgres16-rw
            namespace: database
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
# The family release (haynes-quest ADR-005 D-07) accepts traffic only
# through traefik-external (the Cloudflare tunnel path). Its egress is limited to:
#   * DNS for exactly the names below;
#   * its PostgreSQL database;
#   * the in-cluster Immich API (private memory photos, sanitized in-app);
#   * Authentik's public OIDC endpoints (discovery, token, userinfo, JWKS),
#     which resolve to Cloudflare, hence toFQDNs.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: haynes-quest-family
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: haynes-quest
      app.kubernetes.io/controller: main
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/instance: traefik-external-network
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: postgres16-rw.database.svc.cluster.local
              - matchName: immich-server.photos.svc.cluster.local
              - matchName: authentik.haynesnetwork.com
    - toServices:
        - k8sService:
            serviceName: postgres16-rw
            namespace: database
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toServices:
        - k8sService:
            serviceName: immich-server
            namespace: photos
      toPorts:
        - ports:
            - port: "2283"
              protocol: TCP
    - toFQDNs:
        - matchName: authentik.haynesnetwork.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
