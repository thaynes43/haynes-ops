---
apiVersion: batch/v1
kind: Job
metadata:
  name: haynes-quest-db-init
  annotations:
    # Job pod templates are immutable. Recreate the Job if a future, reviewed
    # provisioning revision changes this manifest; postgres-init is idempotent.
    # Keep the completed Job so Flux does not recreate it on every reconcile.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haynes-quest
        app.kubernetes.io/component: database-init
    spec:
      automountServiceAccountToken: false
      # The exact Cilium DNS allowlist permits the service FQDN. With the
      # cluster default ndots:5, libc first tries search-suffixed variants that
      # are deliberately denied; resolve this four-dot FQDN directly instead.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      enableServiceLinks: false
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init-db
          image: ghcr.io/home-operations/postgres-init:19.0.0@sha256:b49e2f1f373d932ab41614633ac89fa506e5d21bb13cc18d9c96ca026e51f502
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                # Provisioning-only: no application container mounts this.
                name: haynes-quest-db-init-secret
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
