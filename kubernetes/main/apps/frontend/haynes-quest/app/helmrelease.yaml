---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app haynes-quest
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/thaynes43/haynes-quest
              # haynes-quest main e63f549 (PRs #79-#86: growth moves, v4 pieces, family
              # journeys, Immich name search, final copy), signed image from main.
              tag: sha-e63f5491ad6622c4aced010c29cd690156a711f8@sha256:754756fe341e7056b664077b5cb272bdeef7d8898d4ac80855f404a254976630
              pullPolicy: IfNotPresent
            env:
              # Family release (haynes-quest ADR-005): Authentik sign-in, real
              # private memories, internet-facing through traefik-external.
              NODE_ENV: production
              QUEST_APP_ORIGIN: https://quest.haynesnetwork.com
              QUEST_OIDC_DISCOVERY_URL: https://authentik.haynesnetwork.com/application/o/haynes-quest/.well-known/openid-configuration
              QUEST_OIDC_CLIENT_ID: haynes-quest
              # Offers "sign out of Haynes Network too" on shared devices.
              QUEST_AUTH_END_SESSION: https://authentik.haynesnetwork.com/application/o/haynes-quest/end-session/
              # Authentik resolves to Cloudflare over both families; the pod
              # network is IPv4 (cigar-journal precedent).
              NODE_OPTIONS: --dns-result-order=ipv4first
              # "Today" for chapter ends and pick windows (household is US Eastern).
              QUEST_HOUSEHOLD_TIME_ZONE: America/New_York
              PORT: "3000"
            envFrom:
              # Session + app database fields, and the Immich URL/key used
              # only server-side for the children's private memory photos.
              # The database-init Secret is never mounted here.
              - secretRef:
                  name: haynes-quest-secret
              - secretRef:
                  name: haynes-quest-immich-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 3000
                  periodSeconds: 30
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 3000
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 3000
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 60
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      main:
        controller: main
        ports:
          http:
            port: 3000
