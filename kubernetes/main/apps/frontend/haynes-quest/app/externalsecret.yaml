---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: haynes-quest
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: haynes-quest-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        BETTER_AUTH_SECRET: "{{ .BETTER_AUTH_SECRET }}"
        # The agreed username is URI-safe and the password is alphanumeric, so
        # both are already safe in the URI userinfo fields.
        DATABASE_URL: "postgres://{{ .DB_USER }}:{{ .DB_PASSWORD }}@postgres16-rw.database.svc.cluster.local:5432/haynes_quest"
  data:
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: haynes-quest
        property: BETTER_AUTH_SECRET
    - secretKey: DB_USER
      remoteRef:
        key: haynes-quest
        property: HAYNES_QUEST_POSTGRESQL__USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: haynes-quest
        property: HAYNES_QUEST_POSTGRESQL__PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: haynes-quest-immich
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: haynes-quest-immich-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        IMMICH_URL: "http://immich-server.photos.svc.cluster.local:2283"
        IMMICH_API_KEY: "{{ .IMMICH_API_KEY }}"
  data:
    - secretKey: IMMICH_API_KEY
      remoteRef:
        key: appdaemon
        property: IMMICH_API_KEY
---
# Provisioning-only credentials for a future one-shot database initialization
# Job. Application workloads must never mount this Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: haynes-quest-db-init
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: haynes-quest-db-init-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        INIT_POSTGRES_DBNAME: haynes_quest
        INIT_POSTGRES_HOST: postgres16-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .DB_USER }}"
        INIT_POSTGRES_PASS: "{{ .DB_PASSWORD }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  data:
    - secretKey: DB_USER
      remoteRef:
        key: haynes-quest
        property: HAYNES_QUEST_POSTGRESQL__USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: haynes-quest
        property: HAYNES_QUEST_POSTGRESQL__PASSWORD
    - secretKey: POSTGRES_SUPER_PASS
      remoteRef:
        key: cloudnative-pg
        property: POSTGRES_SUPER_PASS
