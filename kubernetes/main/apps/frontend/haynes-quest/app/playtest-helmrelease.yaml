---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app haynes-quest-playtest
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/thaynes43/haynes-quest
              # Haynes Quest PR67 (Rat Casino fun pass: instant contact, casino tokens and
              # golden tickets); checked main publication 36070469997. Exact artwork
              # approval remains pending.
              tag: sha-dc52e4b2c4d42c58e5c6bbf2c1e0b18d7701cf36@sha256:e8a4aba00b78d92ce4d997c277b3896a54dc0c21c0eb58d0636c0fddbeb97521
              pullPolicy: IfNotPresent
            env:
              NODE_ENV: development
              QUEST_FIXTURE_MODE: "true"
              QUEST_EPHEMERAL_PLAYTEST: "true"
              QUEST_APP_ORIGIN: https://haynes-quest-playtest.haynesops.com
              PORT: "3000"
            envFrom:
              # The isolated fixture uses only the existing session/app database
              # Secret. It never mounts Immich or database-init credentials.
              - secretRef:
                  name: haynes-quest-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 3000
                  periodSeconds: 30
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 3000
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 3000
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 60
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      main:
        controller: main
        ports:
          http:
            port: 3000
