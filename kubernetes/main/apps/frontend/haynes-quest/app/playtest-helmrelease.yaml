---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app haynes-quest-playtest
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/thaynes43/haynes-quest
              # Haynes Quest main 91e2679 (the family release image, in fixture mode): World A/B v2, Update world, era models, sound cues.
              tag: sha-91e2679eba497ba3b4cb56beeeaeb44acfe55519@sha256:d9dc20c6961345b869859b17f4e6f2e1e1431c5acb74df116843a931f2cde990
              pullPolicy: IfNotPresent
            env:
              NODE_ENV: development
              QUEST_FIXTURE_MODE: "true"
              QUEST_EPHEMERAL_PLAYTEST: "true"
              QUEST_APP_ORIGIN: https://haynes-quest-playtest.haynesops.com
              PORT: "3000"
            # No Secret at all (haynes-quest ADR-006 D-01): the ephemeral fixture
            # keeps everything in memory, mints its own per-process session secret
            # and refuses to start if it is handed a DATABASE_URL. It must never
            # mount haynes-quest-secret, whose DATABASE_URL and BETTER_AUTH_SECRET
            # belong to the family release, nor any Immich or database-init Secret.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 3000
                  periodSeconds: 30
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 3000
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 3000
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 60
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      main:
        controller: main
        ports:
          http:
            port: 3000
