---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app haynes-quest-playtest
spec:
  interval: 30m
  # A new asset-heavy image digest can take more than Helm's default 5m to pull.
  timeout: 20m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    # Use the same forward retry policy as the family combat schema.
    strategy:
      name: RetryOnFailure
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        replicas: 1
        # Keep fixture sessions and the combat schema on one version at a time.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/thaynes43/haynes-quest
              # Quest main 7678bf3: smaller memory textures; A8/B7 worlds retained.
              tag: sha-7678bf35ee2e77071158e63f52d301af84a18f2f@sha256:ee98b3de7831c86b0c7377598a99ee61d0a841aa477c53c6ed610972f13d7890
              pullPolicy: IfNotPresent
            env:
              NODE_ENV: development
              QUEST_FIXTURE_MODE: "true"
              QUEST_EPHEMERAL_PLAYTEST: "true"
              QUEST_APP_ORIGIN: https://haynes-quest-playtest.haynesops.com
              PORT: "3000"
            # No Secret at all (haynes-quest ADR-006 D-01): the ephemeral fixture
            # keeps everything in memory, mints its own per-process session secret
            # and refuses to start if it is handed a DATABASE_URL. It must never
            # mount haynes-quest-secret, whose DATABASE_URL and BETTER_AUTH_SECRET
            # belong to the family release, nor any Immich or database-init Secret.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 3000
                  periodSeconds: 30
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 3000
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 3000
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 60
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      main:
        controller: main
        ports:
          http:
            port: 3000
