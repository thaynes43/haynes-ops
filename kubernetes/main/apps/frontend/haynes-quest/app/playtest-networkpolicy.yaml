---
# The isolated synthetic fixture accepts only internal Traefik traffic and has
# no egress at all: the ephemeral playtest needs no DNS, database or external
# service, and must never reach the family release's PostgreSQL
# (haynes-quest ADR-006 D-01).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: haynes-quest-playtest
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: haynes-quest-playtest
      app.kubernetes.io/controller: main
  # Explicit, because a direction with no rules would otherwise default to allow.
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/instance: traefik-internal-network
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
