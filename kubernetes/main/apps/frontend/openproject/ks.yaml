---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openproject
  namespace: frontend
spec:
  targetNamespace: frontend
  dependsOn:
  - name: external-secrets-stores
    namespace: external-secrets
  - name: cloudnative-pg
    namespace: database
  path: ./kubernetes/main/apps/frontend/openproject/app
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  prune: true
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 10m
