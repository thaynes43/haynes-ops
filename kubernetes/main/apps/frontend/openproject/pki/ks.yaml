---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openproject-portal-pki
  namespace: frontend
spec:
  targetNamespace: frontend
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  path: ./kubernetes/main/apps/frontend/openproject/pki
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  prune: true
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  healthChecks:
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: openproject-portal-ca
      namespace: frontend
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: openproject-portal-api
      namespace: frontend
