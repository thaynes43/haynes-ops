---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./externalsecret.yaml
- ./database.yaml
- ./pvc.yaml
- ./backup.yaml
- ./helmrelease.yaml
- ./ingressroute.yaml
- ./networkpolicy.yaml
configMapGenerator:
- name: openproject-nginx
  options:
    disableNameSuffixHash: true
    annotations:
      kustomize.toolkit.fluxcd.io/substitute: disabled
  files:
  - nginx.conf.template
