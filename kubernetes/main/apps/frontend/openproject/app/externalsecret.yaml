---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openproject
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 1h
  target:
    name: openproject-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: postgres://openproject:{{ .DB_PASSWORD }}@openproject-db-rw.frontend.svc.cluster.local:5432/openproject
        SECRET_KEY_BASE: '{{ .SECRET_KEY_BASE }}'
        OPENPROJECT_AUTH__SOURCE__SSO_SECRET: '{{ .HEADER_SECRET }}'
        HEADER_SECRET: '{{ .HEADER_SECRET }}'
        OPENPROJECT_SEED__ADMIN__USER__PASSWORD: '{{ .BOOTSTRAP_ADMIN_PASSWORD }}'
        OPENPROJECT_SEED__LDAP: '{{ dict "authentik" (dict "host" "ak-outpost-openproject-ldap.network.svc.cluster.local"
          "port" 636 "security" "simple_tls" "tls_verify" true "tls_certificate" .LDAP_CA_CERT
          "binduser" "cn=openproject-ldap,ou=users,ou=openproject,dc=ldap,dc=haynesops,dc=com"
          "bindpassword" .LDAP_BIND_PASSWORD "basedn" "ou=openproject,dc=ldap,dc=haynesops,dc=com"
          "filter" "(&(ak-active=TRUE)(memberOf=cn=authentik Admins,ou=groups,ou=openproject,dc=ldap,dc=haynesops,dc=com))"
          "sync_users" true "login_mapping" "cn" "firstname_mapping" "givenName" "lastname_mapping"
          "sn" "mail_mapping" "mail") | toJson }}'
  data:
  - secretKey: DB_PASSWORD
    remoteRef:
      key: openproject
      property: DB_PASSWORD
  - secretKey: SECRET_KEY_BASE
    remoteRef:
      key: openproject
      property: SECRET_KEY_BASE
  - secretKey: HEADER_SECRET
    remoteRef:
      key: openproject
      property: HEADER_SECRET
  - secretKey: BOOTSTRAP_ADMIN_PASSWORD
    remoteRef:
      key: openproject
      property: BOOTSTRAP_ADMIN_PASSWORD
  - secretKey: LDAP_BIND_PASSWORD
    remoteRef:
      key: openproject
      property: LDAP_BIND_PASSWORD
  - secretKey: LDAP_CA_CERT
    remoteRef:
      key: openproject
      property: LDAP_CA_CERT
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openproject-database-auth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 1h
  target:
    name: openproject-database-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: 'true'
      data:
        username: openproject
        password: '{{ .password }}'
  data:
  - secretKey: password
    remoteRef:
      key: openproject
      property: DB_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openproject-backup
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 1h
  target:
    name: openproject-backup-secret
    creationPolicy: Owner
  data:
  - secretKey: aws-access-key-id
    remoteRef:
      key: aws
      property: AWS_ACCESS_KEY_ID
  - secretKey: aws-secret-access-key
    remoteRef:
      key: aws
      property: AWS_SECRET_ACCESS_KEY
  - secretKey: aws-region
    remoteRef:
      key: aws
      property: AWS_REGION
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openproject-agent
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 1h
  target:
    name: openproject-agent-secret
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: openproject
        property: API_TOKEN
