---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openproject
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  interval: 30m
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    remediation:
      retries: 2
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 2
  values:
    defaultPodOptions:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    controllers:
      web:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: 'true'
        initContainers:
          migrate-seed:
            image:
              repository: docker.io/openproject/openproject
              tag: 17.9.3-slim@sha256:72ff4c11bacff9113a5400c8f99a9e3a32ef1d1014e289f7bc95a1df4dcd4e89
            env:
              RAILS_ENV: production
              BIND: 127.0.0.1
              PORT: '8080'
              OPENPROJECT_HOST__NAME: work.haynesnetwork.com
              OPENPROJECT_HTTPS: 'true'
              OPENPROJECT_HSTS: 'true'
              OPENPROJECT_LOG__LEVEL: warn
              OPENPROJECT_LOGIN__REQUIRED: 'true'
              OPENPROJECT_SELF__REGISTRATION: '0'
              OPENPROJECT_RAILS__CACHE__STORE: memcache
              OPENPROJECT_CACHE__MEMCACHE__SERVER: openproject-cache.frontend.svc.cluster.local:11211
              OPENPROJECT_WEB__WORKERS: '2'
              OPENPROJECT_WEB__MIN__THREADS: '2'
              OPENPROJECT_WEB__MAX__THREADS: '4'
              OPENPROJECT_AUTH__SOURCE__SSO_HEADER: X-Authenticated-User
              OPENPROJECT_AUTH__SOURCE__SSO_OPTIONAL: 'false'
              OPENPROJECT_AUTH__SOURCE__SSO_LOGOUT__URL: https://work.haynesnetwork.com/outpost.goauthentik.io/sign_out
              OPENPROJECT_SEED__ADMIN__USER__LOCKED: 'true'
              OPENPROJECT_SEED__ADMIN__USER__PASSWORD__RESET: 'false'
              OPENPROJECT_SEED__LOCALE: en
              OPENPROJECT_EMAIL__DELIVERY__METHOD: test
            envFrom:
            - secretRef:
                name: openproject-secret
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources: &id001
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 2Gi
            command:
            - bash
            - -ec
            - until pg_isready -h openproject-db-rw.frontend.svc.cluster.local -U
              openproject >/dev/null 2>&1; do sleep 2; done; exec /app/docker/prod/seeder
        containers:
          app:
            image:
              repository: docker.io/openproject/openproject
              tag: 17.9.3-slim@sha256:72ff4c11bacff9113a5400c8f99a9e3a32ef1d1014e289f7bc95a1df4dcd4e89
            env:
              RAILS_ENV: production
              BIND: 127.0.0.1
              PORT: '8080'
              OPENPROJECT_HOST__NAME: work.haynesnetwork.com
              OPENPROJECT_HTTPS: 'true'
              OPENPROJECT_HSTS: 'true'
              OPENPROJECT_LOG__LEVEL: warn
              OPENPROJECT_LOGIN__REQUIRED: 'true'
              OPENPROJECT_SELF__REGISTRATION: '0'
              OPENPROJECT_RAILS__CACHE__STORE: memcache
              OPENPROJECT_CACHE__MEMCACHE__SERVER: openproject-cache.frontend.svc.cluster.local:11211
              OPENPROJECT_WEB__WORKERS: '2'
              OPENPROJECT_WEB__MIN__THREADS: '2'
              OPENPROJECT_WEB__MAX__THREADS: '4'
              OPENPROJECT_AUTH__SOURCE__SSO_HEADER: X-Authenticated-User
              OPENPROJECT_AUTH__SOURCE__SSO_OPTIONAL: 'false'
              OPENPROJECT_AUTH__SOURCE__SSO_LOGOUT__URL: https://work.haynesnetwork.com/outpost.goauthentik.io/sign_out
              OPENPROJECT_SEED__ADMIN__USER__LOCKED: 'true'
              OPENPROJECT_SEED__ADMIN__USER__PASSWORD__RESET: 'false'
              OPENPROJECT_SEED__LOCALE: en
              OPENPROJECT_EMAIL__DELIVERY__METHOD: test
            envFrom:
            - secretRef:
                name: openproject-secret
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 4Gi
            command:
            - bash
            - /app/docker/prod/web
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - sh
                    - -ec
                    - 'test "$(curl --silent --max-time 4 --output /dev/null --write-out
                      ''%{http_code}'' -H ''Host: work.haynesnetwork.com'' -H ''X-Forwarded-Proto:
                      https'' http://127.0.0.1:8080/health_checks/web)" = 200'
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 40
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - sh
                    - -ec
                    - 'test "$(curl --silent --max-time 4 --output /dev/null --write-out
                      ''%{http_code}'' -H ''Host: work.haynesnetwork.com'' -H ''X-Forwarded-Proto:
                      https'' http://127.0.0.1:8080/health_checks/web)" = 200'
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - sh
                    - -ec
                    - 'test "$(curl --silent --max-time 4 --output /dev/null --write-out
                      ''%{http_code}'' -H ''Host: work.haynesnetwork.com'' -H ''X-Forwarded-Proto:
                      https'' http://127.0.0.1:8080/health_checks/web)" = 200'
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
          nginx:
            image:
              repository: docker.io/library/nginx
              tag: stable-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
            command:
            - sh
            - -ec
            - 'case "$HEADER_SECRET" in ''''|*[!0-9a-fA-F]*) echo ''HEADER_SECRET
              must be hexadecimal'' >&2; exit 1;; esac; test "${#HEADER_SECRET}" -eq
              64 || { echo ''HEADER_SECRET must contain 64 hex characters'' >&2; exit
              1; }; umask 077; mkdir -p /tmp/client_body /tmp/proxy /tmp/fastcgi /tmp/uwsgi
              /tmp/scgi; sed "s/@@HEADER_SECRET@@/$HEADER_SECRET/g" /config/nginx.conf.template
              > /tmp/nginx.conf; nginx -t -c /tmp/nginx.conf; exec nginx -c /tmp/nginx.conf
              -g ''daemon off;'' '
            env:
              HEADER_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: openproject-secret
                    key: HEADER_SECRET
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                memory: 128Mi
      worker:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: 'true'
        initContainers:
          wait-for-database:
            image:
              repository: docker.io/openproject/openproject
              tag: 17.9.3-slim@sha256:72ff4c11bacff9113a5400c8f99a9e3a32ef1d1014e289f7bc95a1df4dcd4e89
            env:
              RAILS_ENV: production
              BIND: 127.0.0.1
              PORT: '8080'
              OPENPROJECT_HOST__NAME: work.haynesnetwork.com
              OPENPROJECT_HTTPS: 'true'
              OPENPROJECT_HSTS: 'true'
              OPENPROJECT_LOG__LEVEL: warn
              OPENPROJECT_LOGIN__REQUIRED: 'true'
              OPENPROJECT_SELF__REGISTRATION: '0'
              OPENPROJECT_RAILS__CACHE__STORE: memcache
              OPENPROJECT_CACHE__MEMCACHE__SERVER: openproject-cache.frontend.svc.cluster.local:11211
              OPENPROJECT_WEB__WORKERS: '2'
              OPENPROJECT_WEB__MIN__THREADS: '2'
              OPENPROJECT_WEB__MAX__THREADS: '4'
              OPENPROJECT_AUTH__SOURCE__SSO_HEADER: X-Authenticated-User
              OPENPROJECT_AUTH__SOURCE__SSO_OPTIONAL: 'false'
              OPENPROJECT_AUTH__SOURCE__SSO_LOGOUT__URL: https://work.haynesnetwork.com/outpost.goauthentik.io/sign_out
              OPENPROJECT_SEED__ADMIN__USER__LOCKED: 'true'
              OPENPROJECT_SEED__ADMIN__USER__PASSWORD__RESET: 'false'
              OPENPROJECT_SEED__LOCALE: en
              OPENPROJECT_EMAIL__DELIVERY__METHOD: test
            envFrom:
            - secretRef:
                name: openproject-secret
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources: *id001
            command:
            - bash
            - -ec
            - >-
              for attempt in $(seq 1 200); do
              if schema_state="$(psql "$DATABASE_URL" -qtAX -v ON_ERROR_STOP=1
              -c 'SELECT EXISTS (SELECT 1 FROM public.schema_migrations)' 2>&1)";
              then
                if test "$schema_state" = t; then exec /app/docker/prod/wait-for-db; fi;
                echo "Waiting for initial schema import ($attempt/200)" >&2;
              else
                case "$schema_state" in
                  *"password authentication failed"*) echo 'Database authentication failed' >&2; exit 1;;
                  *"database"*"does not exist"*) echo 'Configured database does not exist' >&2; exit 1;;
                  *) echo "Waiting for database/schema availability ($attempt/200)" >&2;;
                esac;
              fi;
              sleep 3;
              done;
              echo 'Database schema did not become ready within 10 minutes' >&2;
              exit 1
        containers:
          app:
            image:
              repository: docker.io/openproject/openproject
              tag: 17.9.3-slim@sha256:72ff4c11bacff9113a5400c8f99a9e3a32ef1d1014e289f7bc95a1df4dcd4e89
            env:
              RAILS_ENV: production
              BIND: 127.0.0.1
              PORT: '8080'
              OPENPROJECT_HOST__NAME: work.haynesnetwork.com
              OPENPROJECT_HTTPS: 'true'
              OPENPROJECT_HSTS: 'true'
              OPENPROJECT_LOG__LEVEL: warn
              OPENPROJECT_LOGIN__REQUIRED: 'true'
              OPENPROJECT_SELF__REGISTRATION: '0'
              OPENPROJECT_RAILS__CACHE__STORE: memcache
              OPENPROJECT_CACHE__MEMCACHE__SERVER: openproject-cache.frontend.svc.cluster.local:11211
              OPENPROJECT_WEB__WORKERS: '2'
              OPENPROJECT_WEB__MIN__THREADS: '2'
              OPENPROJECT_WEB__MAX__THREADS: '4'
              OPENPROJECT_AUTH__SOURCE__SSO_HEADER: X-Authenticated-User
              OPENPROJECT_AUTH__SOURCE__SSO_OPTIONAL: 'false'
              OPENPROJECT_AUTH__SOURCE__SSO_LOGOUT__URL: https://work.haynesnetwork.com/outpost.goauthentik.io/sign_out
              OPENPROJECT_SEED__ADMIN__USER__LOCKED: 'true'
              OPENPROJECT_SEED__ADMIN__USER__PASSWORD__RESET: 'false'
              OPENPROJECT_SEED__LOCALE: en
              OPENPROJECT_EMAIL__DELIVERY__METHOD: test
            envFrom:
            - secretRef:
                name: openproject-secret
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 3Gi
            command:
            - bash
            - /app/docker/prod/worker
      cache:
        replicas: 1
        containers:
          app:
            image:
              repository: docker.io/library/memcached
              tag: 1.6-alpine@sha256:6d687bc26426d092694743054fc674fc54d3c161fefa1ad20b54192f8580a8c1
            args:
            - -m
            - '64'
            - -I
            - 16m
            - -U
            - '0'
            securityContext:
              runAsNonRoot: true
              runAsUser: 11211
              runAsGroup: 11211
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 25m
                memory: 96Mi
              limits:
                memory: 128Mi
    service:
      web:
        controller: web
        ports:
          http:
            port: 8081
          api:
            port: 8082
      cache:
        controller: cache
        ports:
          memcache:
            port: 11211
    persistence:
      assets:
        existingClaim: openproject-assets
        advancedMounts:
          web:
            app:
            - path: /var/openproject/assets
            migrate-seed:
            - path: /var/openproject/assets
          worker:
            app:
            - path: /var/openproject/assets
            wait-for-database:
            - path: /var/openproject/assets
      nginx-config:
        type: configMap
        name: openproject-nginx
        advancedMounts:
          web:
            nginx:
            - path: /config
              readOnly: true
