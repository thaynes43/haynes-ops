---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openproject
  annotations:
    kubernetes.io/ingress.class: traefik-internal
    external-dns.kubernetes.io/target: 192.168.40.203
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`work.haynesops.com`) && PathPrefix(`/`)
    services:
    - kind: Service
      name: openproject-web
      port: 8081
  tls:
    secretName: certificate-haynesops
