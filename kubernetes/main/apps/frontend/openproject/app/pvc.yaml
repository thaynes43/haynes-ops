---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openproject-assets
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: ceph-filesystem
  resources:
    requests:
      storage: 20Gi
