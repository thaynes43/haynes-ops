---
# cigars.haynesnetwork.com — Cigar Journal. Same pattern as the
# haynesnetwork apex: external-dns creates the CNAME to the tunnel edge,
# wildcard cert covers the subdomain.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cigar-journal
  annotations:
    external-dns.alpha.kubernetes.io/target: ingress-ext.haynesnetwork.com
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    # /mcp → the MCP adapter service; Traefik prefers the longer rule, so
    # everything else (incl. /.well-known and /oauth/*) falls through to web.
    - kind: Rule
      match: Host(`cigars.haynesnetwork.com`) && PathPrefix(`/mcp`)
      services:
        - kind: Service
          name: cigar-journal-mcp
          port: 8081
    - kind: Rule
      match: Host(`cigars.haynesnetwork.com`) && PathPrefix(`/`)
      services:
        - kind: Service
          name: cigar-journal-main
          port: 3000
  tls:
    secretName: certificate-haynesnetwork
