---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cigar-journal
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cigar-journal-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # App — Better Auth (local accounts, ADR-004). The Authentik OIDC
        # credentials ride a SEPARATE ExternalSecret below, deliberately.
        # BETTER_AUTH_URL is the canonical origin — drives cookies, CSRF, and
        # every self-referential URL.
        BETTER_AUTH_SECRET: "{{ .BETTER_AUTH_SECRET }}"
        BETTER_AUTH_URL: "https://cigars.haynesnetwork.com"
        # First-run admin bootstrap + the session-create admin re-assert only
        # (ADR-010). Registration itself is invite-gated; an allowlisted address
        # can register solely while the users table is empty.
        BOOTSTRAP_ADMIN_EMAILS: "{{ .BOOTSTRAP_ADMIN_EMAILS }}"

        # Database connection — composed from the cluster16 cnpg creds.
        DATABASE_URL: "postgres://{{ .CIGAR_JOURNAL_POSTGRESQL__USER }}:{{ .CIGAR_JOURNAL_POSTGRESQL__PASSWORD }}@postgres16-rw.database.svc.cluster.local:5432/cigar_journal"

        # postgres-init bootstrap (creates DB + role idempotently on every
        # pod start). Same INIT_POSTGRES_* contract as todos-for-dues.
        INIT_POSTGRES_DBNAME: cigar_journal
        INIT_POSTGRES_HOST: postgres16-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .CIGAR_JOURNAL_POSTGRESQL__USER }}"
        INIT_POSTGRES_PASS: "{{ .CIGAR_JOURNAL_POSTGRESQL__PASSWORD }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: cigar-journal
    - extract:
        key: cloudnative-pg
---
# The release-please PAT, for the credential-expiry CronJob ONLY (it probes
# GitHub with the token to read its own expiry header). Deliberately a SEPARATE
# secret rather than another key on cigar-journal-secret:
#   * the web/mcp controllers carry reloader.stakater.com/auto, so touching that
#     secret bounces prod for a monitoring change;
#   * no application pod should ever be handed a GitHub PAT.
# OWNER PREREQUISITE: add a RELEASE_PLEASE_TOKEN property (the same value already
# in the cigar-journal repo's Actions secrets) to the 1Password `cigar-journal`
# item. Until then this ExternalSecret reports SecretSyncedError and the Job's
# `optional: true` secretRef makes it log a clean skip instead of paging.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cigar-journal-monitor
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cigar-journal-monitor-secret
    creationPolicy: Owner
  data:
    - secretKey: RELEASE_PLEASE_TOKEN
      remoteRef:
        key: cigar-journal
        property: RELEASE_PLEASE_TOKEN
---
# Authentik OIDC client credentials (cigar-journal ADR-010).
#
# Deliberately a SEPARATE ExternalSecret rather than two more template lines on
# cigar-journal-secret, for the reason this directory already records twice: a
# 1Password property that cannot resolve fails the WHOLE sync, and that secret
# also carries DATABASE_URL and BETTER_AUTH_SECRET. Isolated here (the
# cigar-journal-monitor / dev-env-omni-operator shape, haynes-ops#2673), a typo
# or a not-yet-created field degrades to "SSO stays off" — the app is built to
# fail closed to local email+password sign-in when these are absent — instead of
# risking the app's own configuration.
#
# OWNER PREREQUISITE: add two TOP-LEVEL fields to the 1Password `cigar-journal`
# item in vault HaynesKube (nested/section fields do not resolve; the label must
# match exactly, no trailing space):
#   * OIDC_CLIENT_ID     — the client id Authentik generated for the provider
#   * OIDC_CLIENT_SECRET — the client secret Authentik generated
# Until then this ExternalSecret reports SecretSyncedError and the app's
# `optional: true` secretRef makes the pod start without it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cigar-journal-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cigar-journal-oidc-secret
    creationPolicy: Owner
  data:
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: cigar-journal
        property: OIDC_CLIENT_ID
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: cigar-journal
        property: OIDC_CLIENT_SECRET
