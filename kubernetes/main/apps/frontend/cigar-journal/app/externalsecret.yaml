---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cigar-journal
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cigar-journal-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Phase 0 spike only: passcode gating the spike's OAuth login form.
        # 1Password item "cigar-journal", field SPIKE_PASSCODE. Replaced by
        # real Better Auth secrets at Phase 1.
        SPIKE_PASSCODE: "{{ .SPIKE_PASSCODE }}"
  dataFrom:
    - extract:
        key: cigar-journal
