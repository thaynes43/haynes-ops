---
# Daily countdown on the two cigar-journal credentials that expire silently
# (cigar-journal #48; the dated deadline is #129). Both fail the same way: the
# credential lapses, the thing it powers stops working, and nothing says so —
# the dev-env MCP client just starts 401ing, or release-please just stops
# opening PRs on merges to main.
#
# MECHANISM: the Job's own terminal failure IS the alert. Exit 1 -> failed Job
# -> kube_job_failed -> CigarJournalCredentialExpiring (prometheusrule.yaml,
# severity=critical -> Pushover; nothing else pages, the root receiver is null).
# Same shape as outline-backup — no new exporter, and there is no pushgateway
# in this cluster to push a gauge to.
#
# NEITHER EXPIRY IS A HAND-COPIED CONSTANT — both are queried from the source of
# truth at run time, so a re-mint updates them with no edit here:
#   * dev-env-cli OAuth token -> the app's own Postgres (oauth_access_token).
#   * RELEASE_PLEASE_TOKEN    -> GitHub's `github-authentication-token-expiration`
#     response header, which the API returns on a call made WITH that token.
#
# The Job log is the countdown record in Loki: one structured line per
# credential (`credential=… days_left=… lead=… status=…`), emitted on every run
# including the green ones. Credential VALUES are never echoed.
#
# WHEN #129 IS DECIDED: if the ruling re-registers the pod under a NEW OAuth
# client, update OAUTH_CLIENT_ID below in the same PR. Left stale, this watches
# a retired client's row and pages forever once it lapses. The client-existence
# check catches a deleted client, not a superseded one.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cigar-journal-credential-expiry
  annotations:
    # The inline shell below uses ${VAR}/$(...) that must reach the container
    # shell verbatim. Flux postBuild runs envsubst in STRICT mode over every
    # resource in this path (ks.yaml substitutes ${APP}), so an unopted-out
    # manifest with shell vars fails the WHOLE cigar-journal Kustomization —
    # taking web, mcp and the crawlers with it. This Job needs no Flux
    # variables. Same mechanism as outline-backup / qbittorrent / ytdl-sub.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  # 08:00 America/New_York (cluster tz convention). Deliberately a waking hour,
  # unlike the estate's overnight janitors: the only action this alert can
  # produce is the owner re-minting a credential, so it should land when he can.
  schedule: "0 8 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Exactly one pod attempt. backoffLimit counts RETRIES, so 1 permits two
      # attempts — and a retry both re-reads the same two expiry dates (same
      # answer) and papers over a flapping check: attempt 1 db-unreachable,
      # attempt 2 ok, Job succeeds, nobody learns the monitor was blind. 0 is
      # what keeps "terminal failure IS the alert" true.
      backoffLimit: 0
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cigar-journal
            app.kubernetes.io/component: credential-expiry
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            # No runAsUser pin: the two images have different non-root defaults
            # (curl 100, CNPG postgres 26) and forcing 65534 onto the CNPG image
            # is unproven here. fsGroup is what actually matters — it setgid's
            # the shared emptyDir so the file the init container writes is
            # readable by the differently-uid'd main container.
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # 1) Ask GitHub how long the PAT has left. The expiry is in a
            #    response header on any authenticated call made with the token,
            #    so this doubles as a liveness check: a dead/revoked PAT 401s.
            #
            #    Always exits 0 and hands a verdict to the main container via
            #    /work/pat-status, so ONE run always reports on BOTH credentials.
            #    A hard exit here would fail the Job before the OAuth half ran,
            #    and the log would not say which credential is in trouble.
            - name: pat
              image: docker.io/curlimages/curl:8.21.0
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  WORK=/work  # shared emptyDir; the selftest rewrites this line
                  if [ -z "${RELEASE_PLEASE_TOKEN:-}" ]; then
                    # Mirrors release-please.yml's own skip guard: the workflow
                    # no-ops without this secret, so monitoring it would page
                    # about a credential that is not in use yet. Lets this land
                    # before the owner's 1Password step.
                    echo "[pat] RELEASE_PLEASE_TOKEN not configured; skipping"
                    printf 'skip' > "$WORK/pat-status"
                    exit 0
                  fi
                  # --retry absorbs a transient api.github.com blip; an
                  # unreachable API is otherwise reported as uncheckable, which
                  # pages. The timeouts are load-bearing: curl's default connect
                  # timeout is 300s, which alone equals the Job's
                  # activeDeadlineSeconds — one blackholed api.github.com would
                  # burn the whole budget here and the OAuth half would never
                  # run, so a GitHub outage would silently mask the #129
                  # countdown. Bounded worst case now: 4 attempts x 30s + 3 x 5s
                  # delay = 135s. Headers to a file, never to the log.
                  code="$(curl -sS --retry 3 --retry-delay 5 --retry-all-errors \
                    --connect-timeout 10 --max-time 30 \
                    -o /dev/null -D "$WORK/pat-headers" -w '%{http_code}' \
                    -H "Authorization: Bearer ${RELEASE_PLEASE_TOKEN}" \
                    -H "Accept: application/vnd.github+json" \
                    "https://api.github.com/repos/${PAT_PROBE_REPO}")" || code="000"
                  echo "[pat] GET /repos/${PAT_PROBE_REPO} -> HTTP ${code}"
                  case "$code" in
                    200)
                      # tail -n1: --retry appends each attempt's headers to the
                      # dump, so after a retried blip the grep can match more
                      # than once. Two lines would fail `date -d` and page.
                      exp="$(grep -i '^github-authentication-token-expiration:' \
                        "$WORK/pat-headers" | tail -n1 | cut -d: -f2- \
                        | tr -d '\r' | sed 's/^ *//')" || exp=""
                      if [ -n "$exp" ]; then
                        printf '%s' "$exp" > "$WORK/pat-status"
                      else
                        # A missing header is NOT proof the credential cannot
                        # lapse. GitHub also omits it for App-issued tokens,
                        # which die within the hour: verified 2026-08-29 against
                        # api.github.com with this pod's own `ghs_` installation
                        # token — HTTP 200, 28 header lines, none matching
                        # `expir`. Treating that as "no expiry, exit 0" would
                        # report an hour-old credential as green forever, which
                        # is the exact silent failure this Job exists to catch.
                        #
                        # Discriminate on the token's documented prefix — no
                        # extra call, and the value is never echoed:
                        #   ghp_ / github_pat_       a PAT; no header means it
                        #                            was minted with no
                        #                            expiration, so there is
                        #                            genuinely nothing to count
                        #                            down and the 200 was the
                        #                            liveness check.
                        #   ghs_ ghu_ gho_ ghr_      App/OAuth token, short-lived
                        #                            by construction; pinned into
                        #                            an Actions secret it is
                        #                            already expiring.
                        #   anything else            unknown shape — fail closed
                        #                            rather than assume durable.
                        case "${RELEASE_PLEASE_TOKEN}" in
                          ghp_*|github_pat_*)
                            printf 'none' > "$WORK/pat-status" ;;
                          ghs_*|ghu_*|gho_*|ghr_*)
                            printf 'ephemeral' > "$WORK/pat-status" ;;
                          *)
                            printf 'unknown-shape' > "$WORK/pat-status" ;;
                        esac
                      fi
                      ;;
                    401|403)
                      # Already dead or scope-stripped — the silent failure this
                      # whole Job exists to catch.
                      printf 'unauthorized' > "$WORK/pat-status"
                      ;;
                    *)
                      printf 'unreachable' > "$WORK/pat-status"
                      ;;
                  esac
              env:
                - name: PAT_PROBE_REPO
                  value: thaynes43/cigar-journal
              envFrom:
                # Its own secret, not cigar-journal-secret: the web/mcp
                # Deployments carry reloader auto-annotations, so a new key
                # there would bounce prod — and no app pod should ever be handed
                # a GitHub PAT. optional: true so the Job still runs (and the
                # OAuth half still guards #129) before the 1Password property
                # exists.
                - secretRef:
                    name: cigar-journal-monitor-secret
                    optional: true
              volumeMounts:
                - name: work
                  mountPath: /work
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
          containers:
            # 2) Read the OAuth token's expiry from the app's own database, fold
            #    in the PAT verdict, print one line per credential, and set the
            #    single exit code the alert keys off.
            - name: expiry
              image: ghcr.io/cloudnative-pg/postgresql:16.6-34@sha256:53be6d727c7b3cf0df2b147f7ce7cdd31d37fd285314294871a4ccc3837b6872
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  WORK=/work  # shared emptyDir; the selftest rewrites this line
                  fail=0

                  emit() {  # name days_left lead status
                    echo "credential=$1 days_left=$2 lead=$3 status=$4"
                  }

                  # ── dev-env-cli OAuth access token (#129) ──────────────────
                  # Authoritative and rot-proof: the row the MCP server actually
                  # validates against. Two counts in one round trip — whether the
                  # client is still registered at all, and the expiry of its
                  # NEWEST live token. A NULL second column (empty field) means
                  # no live row: the token has already lapsed or was revoked.
                  #
                  # max(), not min(): cigar-journal never revokes a superseded
                  # access token (packages/oauth writes revoked_at only for
                  # family-wide reuse detection), so unrevoked older rows pile
                  # up — the ChatGPT client held two simultaneous live rows when
                  # this was written. min() would count down the OLDEST row and
                  # keep paging for days
                  # after a re-mint had already fixed the problem. The pod holds
                  # exactly one token string, and after a re-mint that is the
                  # newest row.
                  #
                  # PREMISE: one long-lived access token, no refresher. If #129
                  # lands option B (offline_access + a refresher), every live row
                  # is <1h old by design and this query must be re-pointed at the
                  # refresh token in the same PR.
                  #
                  # The SQL goes in on STDIN, not `-c`. psql performs :'var'
                  # interpolation only in its own lexer, which `-c` bypasses —
                  # the string is handed to the server verbatim and errors with
                  # `syntax error at or near ":"`, which this script would report
                  # as db-unreachable on every single run. Covered by
                  # scripts/credential-expiry-selftest.sh, which runs this exact
                  # argv against a real psql.
                  #
                  # -X so psql needs no readable HOME for ~/.psqlrc. DATABASE_URL
                  # is never echoed; psql errors go to $WORK and are re-emitted
                  # prefixed, so a connectivity fault is legible in the same log.
                  if ! row="$(psql -X -At -F '|' -P pager=off -v ON_ERROR_STOP=1 \
                    -v cid="$OAUTH_CLIENT_ID" -d "$DATABASE_URL" \
                    2>"$WORK/psql.err" <<'SQL'
                  SELECT
                    (SELECT count(*) FROM oauth_client
                      WHERE client_id = :'cid'),
                    (SELECT EXTRACT(EPOCH FROM (max(expires_at) - now()))::bigint
                       FROM oauth_access_token
                      WHERE client_id = :'cid'
                        AND revoked_at IS NULL
                        AND expires_at > now());
                  SQL
                  )"; then
                    emit dev-env-cli - "$OAUTH_LEAD_DAYS" db-unreachable
                    sed 's/^/[psql] /' "$WORK/psql.err" >&2
                    fail=1
                  else
                    client_rows="${row%%|*}"
                    secs="${row##*|}"
                    if [ "$client_rows" = "0" ]; then
                      # The client_id below no longer exists. Either it was
                      # deleted, or #129 landed and this env var was not updated.
                      emit dev-env-cli - "$OAUTH_LEAD_DAYS" client-missing
                      fail=1
                    elif [ -z "$secs" ]; then
                      emit dev-env-cli 0 "$OAUTH_LEAD_DAYS" expired
                      fail=1
                    else
                      days=$(( secs / 86400 ))
                      if [ "$days" -le "$OAUTH_LEAD_DAYS" ]; then
                        emit dev-env-cli "$days" "$OAUTH_LEAD_DAYS" expiring
                        fail=1
                      else
                        emit dev-env-cli "$days" "$OAUTH_LEAD_DAYS" ok
                      fi
                    fi
                  fi

                  # ── RELEASE_PLEASE_TOKEN (fine-grained PAT) ────────────────
                  pat="$(cat "$WORK/pat-status")"
                  case "$pat" in
                    skip)
                      # Not configured; release-please.yml skips too. Not a fault.
                      emit RELEASE_PLEASE_TOKEN - "$PAT_LEAD_DAYS" not-configured
                      ;;
                    none)
                      # Alive, and a PAT shape that GitHub sends no expiry header
                      # for — minted with no expiration, so there is nothing to
                      # count down. The 200 was the liveness check.
                      emit RELEASE_PLEASE_TOKEN - "$PAT_LEAD_DAYS" no-expiry
                      ;;
                    ephemeral)
                      # 200 with no expiry header, but the prefix says an
                      # App/OAuth token: minted short-lived (1h for ghs_), so it
                      # is already expiring and must not sit in an Actions
                      # secret. Fix: mint the token per run with
                      # actions/create-github-app-token, or store a real PAT.
                      emit RELEASE_PLEASE_TOKEN 0 "$PAT_LEAD_DAYS" ephemeral-token
                      fail=1
                      ;;
                    unknown-shape)
                      # 200, no expiry header, unrecognised prefix. Fail closed:
                      # an unprovable lifetime is what this Job exists to flag.
                      emit RELEASE_PLEASE_TOKEN - "$PAT_LEAD_DAYS" unknown-token-shape
                      fail=1
                      ;;
                    unauthorized)
                      emit RELEASE_PLEASE_TOKEN 0 "$PAT_LEAD_DAYS" unauthorized
                      fail=1
                      ;;
                    unreachable)
                      emit RELEASE_PLEASE_TOKEN - "$PAT_LEAD_DAYS" uncheckable
                      fail=1
                      ;;
                    *)
                      # GNU date parses GitHub's header format
                      # ("2026-09-26 20:30:38 UTC" / RFC-1123-ish) directly.
                      if exp_epoch="$(date -d "$pat" +%s 2>/dev/null)"; then
                        days=$(( (exp_epoch - $(date +%s)) / 86400 ))
                        if [ "$days" -le "$PAT_LEAD_DAYS" ]; then
                          emit RELEASE_PLEASE_TOKEN "$days" "$PAT_LEAD_DAYS" expiring
                          fail=1
                        else
                          emit RELEASE_PLEASE_TOKEN "$days" "$PAT_LEAD_DAYS" ok
                        fi
                      else
                        # Header present but in a shape GNU date rejects: report
                        # it rather than silently treating the PAT as fine.
                        emit RELEASE_PLEASE_TOKEN - "$PAT_LEAD_DAYS" unparseable-expiry
                        fail=1
                      fi
                      ;;
                  esac

                  exit "$fail"
              env:
                # dev-env-cli, the client the dev-env pod's MCP server uses.
                # See the WHEN #129 IS DECIDED note in the header.
                - name: OAUTH_CLIENT_ID
                  value: d784af277ef8376ed9b621d8f0b5ffac
                # 30-day credential: 7 days is enough notice to schedule a
                # re-mint without nagging for a quarter of every cycle.
                - name: OAUTH_LEAD_DAYS
                  value: "7"
                # Re-minting a PAT needs a GitHub UI visit plus an Actions-secret
                # update, so it gets a longer runway.
                - name: PAT_LEAD_DAYS
                  value: "14"
              envFrom:
                # Supplies DATABASE_URL — same secret the crawler CronJobs in
                # this directory already consume.
                - secretRef:
                    name: cigar-journal-secret
              volumeMounts:
                - name: work
                  mountPath: /work
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 1Mi
