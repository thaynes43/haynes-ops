apiVersion: batch/v1
kind: CronJob
metadata:
  name: cigar-journal-crawl-enrich-fox-cigar
spec:
  suspend: false
  # Daily 06:00 UTC (= 23:00 America/Phoenix). DAILY, not alternating: this is the
  # only live enrich drain, so there is no second vendor to double-burn a request's
  # shared EXHAUST_ATTEMPTS against, and a daily cadence spends both attempts on
  # CONSECUTIVE MORNINGS — a transient Fox failure is retried tomorrow instead of
  # exhausting the row, which is exactly the pre-PR `0 9 * * *` behaviour. It also
  # leaves no uncovered day; an every-other-day pair over a 7-day week cannot.
  # Moved off 09:00, which landed INSIDE the ~92 min Fox offers walk and put a second
  # pod on foxcigar.com mid-crawl. Latest start 06:10, hard stop 07:40, so it clears
  # the 08:00 offers windows by 20 min. If the Cuban Lou's drain is ever unsuspended
  # this MUST narrow to `0 6 * * 0,1,3,5` in the same PR (see its comment).
  schedule: "0 6 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      # Wedge guard sized ABOVE the worst run the code can produce, NOT a capacity
      # estimate and NOT a mid-drain kill: a kill here strands the claimed
      # enrichment_requests row at 'in_progress' forever (header tripwire,
      # cigar-journal#157), so the deadline must only ever fire on a genuinely stuck
      # process. A healthy run is seconds — the measured 2026-08-29 Fox drain was
      # 3 pages / 8 s. Ceiling: --limit 10 x MAX_ENRICH_CANDIDATES 8 = up to 80 page
      # fetches, plus 10 photos, robots and the sitemap ~= 96 serialized requests.
      # The slowest per-request path that does NOT throw is one 15 s abort, a 1 s
      # backoff and a slow-but-successful retry, ~36 s with throttles — about 58 min
      # for all 96. (A true timeout storm cannot run longer: core/fetcher.ts:107-114
      # rethrows on the SECOND consecutive failure and nothing catches it, so the run
      # ends at ~36 s. A 5xx storm is faster still — `status >= 500 && attempt === 0`
      # is false on the retry, so fetchText returns the 503 and the loop continues at
      # ~7 s per URL, ~11 min.) 5400 s = 90 min is 1.5x the 58 min ceiling and still
      # stops by 07:40, clearing the 08:00 offers windows.
      activeDeadlineSeconds: 5400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cigar-journal
            app.kubernetes.io/component: crawl-enrich
            vendor: fox-cigar
        spec:
          restartPolicy: Never
          containers:
            - name: crawl
              image: ghcr.io/thaynes43/cigar-journal:v0.27.0
              imagePullPolicy: IfNotPresent
              # workingDir is required: `node --import tsx` resolves the loader from
              # CWD, and tsx ships in /app/crawler/node_modules.
              workingDir: /app/crawler
              command:
                - /sbin/tini
                - "--"
                - node
                - --import
                - tsx
                - src/cli.ts
                - --vendor
                - fox-cigar
                - --mode
                - enrich
                - --limit
                - "10"
              # Raw CronJob needs core/v1 list-form env — the HR's map form is a
              # bjw-s chart-values idiom and does not apply here.
              env:
                # No IPv6 egress in this cluster; force A-record-first for the
                # crawler's outbound fetches (same trap the HR web/mcp roles hit).
                - name: NODE_OPTIONS
                  value: --dns-result-order=ipv4first
                # Photo capture during gap-fill — mirrored from the HR.
                - name: PHOTOS_S3_ENDPOINT
                  value: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80
                - name: PHOTOS_S3_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: cigar-journal-photos
                      key: BUCKET_NAME
                - name: PHOTOS_S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: cigar-journal-photos
                      key: AWS_ACCESS_KEY_ID
                - name: PHOTOS_S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cigar-journal-photos
                      key: AWS_SECRET_ACCESS_KEY
              envFrom:
                - secretRef:
                    name: cigar-journal-secret
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  memory: 512Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cigar-journal-crawl-enrich-cuban-lous
spec:
  # SHIPS SUSPENDED, and unlike everything else in this file that is not a posture
  # call — it is an unfixed cross-vendor defect. Enrich matching has no vendor-focus
  # predicate, so this CC drain can answer an NC request, link a Habanos listing to a
  # non-Cuban cigar, and permanently attach a Habanos photo to it (header, with the
  # live 0.583-similarity example). A manifest cannot add that predicate; the fix is
  # in packages/crawler, tracked as cigar-journal#170. UNSUSPEND only together with
  # it, and in the same PR narrow the Fox drain to `0 6 * * 0,1,3,5` — see below.
  suspend: true
  # Tue/Thu/Sat 06:00 UTC, pre-set as the alternating half of the enrich pair so the
  # unsuspend is a one-line flip here plus one on the Fox job. `0,1,3,5` + `2,4,6`
  # tiles all seven days with no shared day, which matters because drainEnrichment
  # claims rows with a SELECT then a separate UPDATE and no FOR UPDATE SKIP LOCKED,
  # and finalizeEnrichment writes `request.attempts + 1` from the snapshot read at
  # SELECT time — two same-day drains double-burn or lose the shared per-request
  # attempt budget outright (cigar-journal#157).
  schedule: "0 6 * * 2,4,6"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      # Wedge guard sized ABOVE the worst run the code can produce, NOT a capacity
      # estimate and NOT a mid-drain kill: a kill here strands the claimed
      # enrichment_requests row at 'in_progress' forever (header tripwire,
      # cigar-journal#157), so the deadline must only ever fire on a genuinely stuck
      # process. A healthy run is seconds — the measured 2026-08-29 Fox drain was
      # 3 pages / 8 s. Ceiling: --limit 10 x MAX_ENRICH_CANDIDATES 8 = up to 80 page
      # fetches, plus 10 photos, robots and the sitemap ~= 96 serialized requests.
      # The slowest per-request path that does NOT throw is one 15 s abort, a 1 s
      # backoff and a slow-but-successful retry, ~36 s with throttles — about 58 min
      # for all 96. (A true timeout storm cannot run longer: core/fetcher.ts:107-114
      # rethrows on the SECOND consecutive failure and nothing catches it, so the run
      # ends at ~36 s. A 5xx storm is faster still — `status >= 500 && attempt === 0`
      # is false on the retry, so fetchText returns the 503 and the loop continues at
      # ~7 s per URL, ~11 min.) 5400 s = 90 min is 1.5x the 58 min ceiling and still
      # stops by 07:40, clearing the 08:00 offers windows.
      activeDeadlineSeconds: 5400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cigar-journal
            app.kubernetes.io/component: crawl-enrich
            vendor: cuban-lous
        spec:
          restartPolicy: Never
          containers:
            - name: crawl
              image: ghcr.io/thaynes43/cigar-journal:v0.27.0
              imagePullPolicy: IfNotPresent
              # workingDir is required: `node --import tsx` resolves the loader from
              # CWD, and tsx ships in /app/crawler/node_modules.
              workingDir: /app/crawler
              command:
                - /sbin/tini
                - "--"
                - node
                - --import
                - tsx
                - src/cli.ts
                - --vendor
                - cuban-lous
                - --mode
                - enrich
                - --limit
                - "10"
              # Raw CronJob needs core/v1 list-form env — the HR's map form is a
              # bjw-s chart-values idiom and does not apply here.
              env:
                # No IPv6 egress in this cluster; force A-record-first for the
                # crawler's outbound fetches (same trap the HR web/mcp roles hit).
                - name: NODE_OPTIONS
                  value: --dns-result-order=ipv4first
                # Photo capture during gap-fill — mirrored from the HR.
                - name: PHOTOS_S3_ENDPOINT
                  value: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80
                - name: PHOTOS_S3_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: cigar-journal-photos
                      key: BUCKET_NAME
                - name: PHOTOS_S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: cigar-journal-photos
                      key: AWS_ACCESS_KEY_ID
                - name: PHOTOS_S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cigar-journal-photos
                      key: AWS_SECRET_ACCESS_KEY
              envFrom:
                - secretRef:
                    name: cigar-journal-secret
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  memory: 512Mi
