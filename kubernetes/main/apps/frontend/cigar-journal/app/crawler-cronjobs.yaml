apiVersion: batch/v1
kind: CronJob
metadata:
  name: cigar-journal-crawl-enrich-fox-cigar
spec:
  suspend: false
  # Mon/Wed/Fri 06:00 UTC (= 23:00 America/Phoenix). ALTERNATING DAYS with the Cuban
  # Lou's enrich job, never the same day: the drain queue is global, so two runs in
  # one morning spend both of a request's EXHAUST_ATTEMPTS before either vendor gets
  # a second look (header). Different days also make the two windows trivially
  # disjoint, which adjacent 30 min slots were not — startingDeadlineSeconds 600
  # lets a 06:00 Job start at 06:10 and run to 06:40, overlapping a 06:30 peer.
  # Moved off the old 09:00, which landed INSIDE the ~92 min Fox offers walk and put
  # a second pod on foxcigar.com mid-crawl. At worst this ends 06:40, clearing the
  # 08:00 offers windows by 80 min.
  schedule: "0 6 * * 1,3,5"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      # Wedge guard, NOT a capacity estimate. A healthy run is seconds — the measured
      # 2026-08-29 Fox drain was 3 pages / 8 s. The true upper bound is well above
      # 1800: --limit 10 x MAX_ENRICH_CANDIDATES 8 = up to 82 page fetches plus 10
      # photos, and a timeout costs ~36 s each (two 15 s aborts + two throttles + a
      # 1 s backoff, core/fetcher.ts), so a vendor timeout storm runs ~55 min. Such a
      # run is therefore killed mid-drain on purpose; alternating days mean that kill
      # can never collide with the other vendor's drain.
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cigar-journal
            app.kubernetes.io/component: crawl-enrich
            vendor: fox-cigar
        spec:
          restartPolicy: Never
          containers:
            - name: crawl
              image: ghcr.io/thaynes43/cigar-journal:v0.26.1
              imagePullPolicy: IfNotPresent
              # workingDir is required: `node --import tsx` resolves the loader from
              # CWD, and tsx ships in /app/crawler/node_modules.
              workingDir: /app/crawler
              command:
                - /sbin/tini
                - "--"
                - node
                - --import
                - tsx
                - src/cli.ts
                - --vendor
                - fox-cigar
                - --mode
                - enrich
                - --limit
                - "10"
              # Raw CronJob needs core/v1 list-form env — the HR's map form is a
              # bjw-s chart-values idiom and does not apply here.
              env:
                # No IPv6 egress in this cluster; force A-record-first for the
                # crawler's outbound fetches (same trap the HR web/mcp roles hit).
                - name: NODE_OPTIONS
                  value: --dns-result-order=ipv4first
                # Photo capture during gap-fill — mirrored from the HR.
                - name: PHOTOS_S3_ENDPOINT
                  value: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80
                - name: PHOTOS_S3_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: cigar-journal-photos
                      key: BUCKET_NAME
                - name: PHOTOS_S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: cigar-journal-photos
                      key: AWS_ACCESS_KEY_ID
                - name: PHOTOS_S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cigar-journal-photos
                      key: AWS_SECRET_ACCESS_KEY
              envFrom:
                - secretRef:
                    name: cigar-journal-secret
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  memory: 512Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cigar-journal-crawl-enrich-cuban-lous
spec:
  suspend: false
  # Tue/Thu/Sat 06:00 UTC — the alternating half of the enrich pair (see the Fox
  # enrich job and the header). Never the same day as the Fox drain, so the two can
  # never run concurrently: drainEnrichment claims rows with a SELECT then a separate
  # UPDATE and no FOR UPDATE SKIP LOCKED, and finalizeEnrichment writes
  # `request.attempts + 1` from the snapshot read at SELECT time, so concurrent runs
  # would double-burn or lose the shared per-request attempt budget outright
  # (cigar-journal#157).
  schedule: "0 6 * * 2,4,6"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      # Wedge guard, NOT a capacity estimate. A healthy run is seconds — the measured
      # 2026-08-29 Fox drain was 3 pages / 8 s. The true upper bound is well above
      # 1800: --limit 10 x MAX_ENRICH_CANDIDATES 8 = up to 82 page fetches plus 10
      # photos, and a timeout costs ~36 s each (two 15 s aborts + two throttles + a
      # 1 s backoff, core/fetcher.ts), so a vendor timeout storm runs ~55 min. Such a
      # run is therefore killed mid-drain on purpose; alternating days mean that kill
      # can never collide with the other vendor's drain.
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cigar-journal
            app.kubernetes.io/component: crawl-enrich
            vendor: cuban-lous
        spec:
          restartPolicy: Never
          containers:
            - name: crawl
              image: ghcr.io/thaynes43/cigar-journal:v0.26.1
              imagePullPolicy: IfNotPresent
              # workingDir is required: `node --import tsx` resolves the loader from
              # CWD, and tsx ships in /app/crawler/node_modules.
              workingDir: /app/crawler
              command:
                - /sbin/tini
                - "--"
                - node
                - --import
                - tsx
                - src/cli.ts
                - --vendor
                - cuban-lous
                - --mode
                - enrich
                - --limit
                - "10"
              # Raw CronJob needs core/v1 list-form env — the HR's map form is a
              # bjw-s chart-values idiom and does not apply here.
              env:
                # No IPv6 egress in this cluster; force A-record-first for the
                # crawler's outbound fetches (same trap the HR web/mcp roles hit).
                - name: NODE_OPTIONS
                  value: --dns-result-order=ipv4first
                # Photo capture during gap-fill — mirrored from the HR.
                - name: PHOTOS_S3_ENDPOINT
                  value: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80
                - name: PHOTOS_S3_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: cigar-journal-photos
                      key: BUCKET_NAME
                - name: PHOTOS_S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: cigar-journal-photos
                      key: AWS_ACCESS_KEY_ID
                - name: PHOTOS_S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cigar-journal-photos
                      key: AWS_SECRET_ACCESS_KEY
              envFrom:
                - secretRef:
                    name: cigar-journal-secret
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  memory: 512Mi
