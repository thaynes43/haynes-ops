apiVersion: batch/v1
kind: CronJob
metadata:
  name: cigar-journal-crawl-enrich-cuban-lous
spec:
  suspend: false
  # Daily, 06:30 UTC — 30 min behind the Fox enrich run (~8s typical, 3.8 min worst
  # case), so the two never overlap. drainEnrichment claims rows with a SELECT then a
  # separate UPDATE and no FOR UPDATE SKIP LOCKED, so an overlap would double-burn
  # the shared per-request attempt budget.
  schedule: "30 6 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
