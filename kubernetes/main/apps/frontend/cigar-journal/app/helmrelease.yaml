---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Cigar Journal (thaynes43/cigar-journal) — replaces the Phase 0 spike at
# the same hostname. One image, roles selected by command: web (default),
# migrate (init container).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cigar-journal
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18.6"
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: cigar-journal-secret
          migrate:
            image: &mainImage
              repository: ghcr.io/thaynes43/cigar-journal
              tag: v0.32.0
              pullPolicy: IfNotPresent
            # workingDir is required: node --import tsx resolves the loader
            # from CWD, and tsx ships in /app/migrate/node_modules.
            workingDir: /app/migrate
            command:
              - /sbin/tini
              - "--"
              - node
              - --import
              - tsx
              - src/scripts/migrate.ts
            envFrom:
              - secretRef:
                  name: cigar-journal-secret
        containers:
          app:
            image: *mainImage
            env:
              NODE_ENV: production
              PORT: "3000"
              HOSTNAME: "0.0.0.0"
              # No IPv6 egress in this cluster; force A-record-first for any
              # outbound fetch (same trap as todos-for-dues).
              NODE_OPTIONS: --dns-result-order=ipv4first
              # Authentik OIDC discovery (cigar-journal ADR-010). Plain env —
              # a discovery URL is not a secret; the client id/secret ride
              # cigar-journal-oidc-secret. The app enables SSO only when all
              # three are present, so this alone changes nothing.
              OIDC_DISCOVERY_URL: https://authentik.haynesnetwork.com/application/o/cigar-journal/.well-known/openid-configuration
              PHOTOS_S3_ENDPOINT: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80
              PHOTOS_S3_BUCKET:
                valueFrom:
                  configMapKeyRef:
                    name: cigar-journal-photos
                    key: BUCKET_NAME
              PHOTOS_S3_ACCESS_KEY_ID:
                valueFrom:
                  secretKeyRef:
                    name: cigar-journal-photos
                    key: AWS_ACCESS_KEY_ID
              PHOTOS_S3_SECRET_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: cigar-journal-photos
                    key: AWS_SECRET_ACCESS_KEY
            envFrom:
              - secretRef:
                  name: cigar-journal-secret
              # Optional so the pod starts before the 1Password fields exist;
              # absent credentials simply mean SSO is off (ADR-010 fail-closed).
              - secretRef:
                  name: cigar-journal-oidc-secret
                  optional: true
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 24
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
      # MCP role: same image, long-running six-tool adapter (thaynes43/
      # cigar-journal docs/mcp/tool-contract.md). Shares the origin with web —
      # /mcp routes here, /.well-known + /oauth/* + everything else to web.
      mcp:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: *mainImage
            workingDir: /app/mcp
            command:
              - /sbin/tini
              - "--"
              - node
              - --import
              - tsx
              - src/index.ts
            env:
              PORT: "8081"
              # Cut SSE stream overhead per call; clients negotiating JSON get
              # single-response mode (latency feedback 2026-08-27).
              MCP_JSON_RESPONSE: "true"
              NODE_OPTIONS: --dns-result-order=ipv4first
              PHOTOS_S3_ENDPOINT: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80
              PHOTOS_S3_BUCKET:
                valueFrom:
                  configMapKeyRef:
                    name: cigar-journal-photos
                    key: BUCKET_NAME
              PHOTOS_S3_ACCESS_KEY_ID:
                valueFrom:
                  secretKeyRef:
                    name: cigar-journal-photos
                    key: AWS_ACCESS_KEY_ID
              PHOTOS_S3_SECRET_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: cigar-journal-photos
                    key: AWS_SECRET_ACCESS_KEY
            envFrom:
              - secretRef:
                  name: cigar-journal-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 3
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
      # ==================================================================
      # VENDOR CRAWLER CADENCE (cigar-journal ADR-006, go-live #93)
      # ==================================================================
      # These four controllers were raw CronJob manifests in crawler-cronjobs.yaml
      # until cigar-journal#159. They live here so the `image: *mainImage` anchor
      # above is the SINGLE image pin for all six consumers — a separate manifest
      # cannot reach a Helm values anchor, which is why the v0.27.1 bump
      # (haynes-ops#2688, a one-line edit to that anchor) shipped two Deployments
      # on the new tag and left four CronJobs on the old one, repaired by
      # haynes-ops#2689. Same image as the web/mcp roles; the `crawl` role is
      # selected by the container command (see the ROLE DISPATCH marker in the
      # cigar-journal Dockerfile). FOUR schedules, one per (vendor, mode):
      #   * offers — weekly re-visit of every known listing. NOT append-only.
      #   * enrich — drains the gap-fill queue in small bounded batches.
      #
      # WHAT AN `offers` WALK ACTUALLY DOES — read this before changing a suspend
      # flag. `walkListings` calls `findCatalogMatch` for EVERY listing on EVERY
      # run, and `upsertListingMatch` rewrites cigar_id AND status on any row whose
      # decided_by='crawler' and status<>'confirmed' (packages/crawler/src/core/
      # ingest.ts `ingestListing`; core/match.ts:70). Crawler offers reach their
      # cigar through listing_match_id (offers.cigar_id is null for them), so
      # re-pointing a match drags that listing's entire price history onto a
      # different cigar. A completed walk is a full re-derivation of crawler-owned
      # links, not a price append.
      #
      # WHAT THE GUARD PROTECTS. These counts MOVE — the daily curation agent writes
      # verdicts continuously, so re-read them rather than trusting the snapshot.
      # Read against the live DB 2026-08-30 02:10Z:
      #   Fox Cigar   | agent   | unmatched |  291   <- returned untouched (match.ts:70)
      #   Fox Cigar   | crawler | auto      | 1487
      #   Fox Cigar   | crawler | unmatched |   14
      #   Cuban Lou's | crawler | auto      |   82
      # The 291 are the curation agent's own verdicts, and they are safe: all 291
      # audit_log `listing_match.set_status` actor='agent' rows join to a
      # listing_matches row that reads decided_by='agent' / status='unmatched'
      # today. (Migration 0017 had added decided_by with DEFAULT 'crawler' and so
      # mislabelled them as crawler-owned; the coordinator repaired the column in
      # prod on 2026-08-30. `select count(*) from listing_matches where
      # decided_by='agent'` -> 291.) The 14 crawler-owned 'unmatched' Fox rows are
      # genuine crawler verdicts and are correctly re-writable.
      #
      # The pre-flight simulation predicted a completed Fox walk would touch only
      # crawler-owned rows — 52 of 1487 'auto' re-pointing, and all 14 'unmatched'
      # becoming 'auto'. THE WALK HAS SINCE RUN FOR REAL: Sunday 2026-08-30 08:00Z
      # completed in 91m58s, status 'succeeded', 2004 pages fetched, 1787 auto
      # matches, 1789 offers written, 0 errors — inside the 9000 s deadline with
      # 58 min to spare. No agent verdict was clobbered: decided_by='agent' rows
      # numbered 591 at 2026-08-31 00:38Z, and 300 of those were logged AFTER the
      # walk finished, so the growth is the curation agent working, not the walk
      # rewriting. The guard protects whatever the agent owns at run time, not a
      # fixed count. Both offers walks therefore stay UNSUSPENDED.
      #
      # THE ENRICH QUEUE IS GLOBAL AND VENDOR-BLIND. `--vendor` picks only the
      # candidate sitemap to search; it does NOT scope which enrichment_requests
      # are claimed. `drainEnrichment` selects `status='pending' order by
      # created_at asc limit N` with no vendor predicate, and enrichment_requests
      # has no vendor column at all (packages/db/src/schema/enrichment-requests.ts).
      # The open set is additionally filtered by the market predicate and by
      # vendorNotRetired, so which rows a given vendor may claim is narrower than
      # the queue — but the QUEUE itself still has no vendor column.
      # CORRECTED 2026-08-31 (v0.29.0 / cigar-journal#192, #157). This note used to
      # read "EXHAUST_ATTEMPTS=2 is a per-request budget shared across every enrich
      # job, therefore AT MOST ONE ENRICH DRAIN PER DAY, always." That is no longer
      # true and must not be used to justify a schedule: attempts now live in
      # enrichment_attempts, UNIQUE(request_id, vendor_id), incremented by an atomic
      # ON CONFLICT upsert. The budget is PER VENDOR and two vendors cannot burn or
      # lose each other's. Consequences that survive:
      #   * 'exhausted' means "this vendor was tried twice", never "every enabled
      #     vendor was tried". Fleet-level exhaustion is #158 and still open.
      #   * Two drains on one day is no longer a budget bug, but the two enrich jobs
      #     are still kept on disjoint days — for the product_photos slot race, not
      #     for attempts. The reasoning is on crawl-enrich-fox-cigar below; read it
      #     before merging the two schedules back together.
      #   * The `vendor:` pod label on an enrich Job names the sitemap it searches,
      #     NOT the rows it drains. Do not build a per-vendor drain dashboard or
      #     alert on it.
      #
      # WHY THE CUBAN LOU'S ENRICH DRAIN WAS SUSPENDED, AND WHY IT NO LONGER IS.
      # It shipped suspended for a real defect, not caution: enrich matching was
      # name-similarity only (sim > 0.55 against the QUEUED cigar,
      # ingest.ts tryEnrichCandidates) with NO vendor-focus predicate — `focus` was
      # written by cli.ts and read only by approved-import.ts, so a
      # `--vendor cuban-lous` (focus CC) drain answered an NC request, hung a
      # Habanos listing off a non-Cuban cigar, and — because tryEnrichCandidates
      # then called capturePhoto with that cigar's id — wrote a Habanos product
      # image onto it. product_photos is UNIQUE(cigar_id) with onConflictDoNothing
      # and nothing in the crawler ever removes one, so that photo was permanent.
      # Verified live, not hypothesised: similarity('Romeo y Julieta Mini White
      # Original', 'Romeo y Julieta Mini') = 0.583 > 0.55, against Cuban Lou's
      # listing /cuban-cigarillos/romeo-y-julieta-mini/.
      #
      # FIXED AND DEPLOYED in cigar-journal v0.29.0 (PR #192, closes #170/#157/
      # #155/#185), live here 2026-08-31. Three guards now stand where none did:
      #   * The drain's open set and the write itself both apply the market
      #     predicate (ingest.ts coversMarketSql / coversMarket, re-checked inside
      #     the match transaction), and findCatalogMatch returns a three-way
      #     none|match|refused so a refusal no longer falls through and mints a
      #     duplicate. A refusal is recorded as listing_matches.unmatched_reason
      #     = 'market_refusal' (migration 0025) and is visible in triage.
      #   * capturePhoto is gated by photo authority (mayWriteCatalogPhoto),
      #     restated as the INSERT's own WHERE, and returns wrote|refused|skipped
      #     instead of void — so a refused capture no longer resolves the ask.
      #   * Migration 0025 corrected this shop's registry row from focus='CC' to
      #     focus='both' (it stocks Perdomo, Gurkha, CAO, Rocky Patel and more
      #     alongside genuine Habanos) and deleted the one cross-market photo,
      #     guarded on source_url.
      # READ THIS BEFORE RELAXING THE SCHEDULE BELOW. Because the row is 'both',
      # coversMarket('both', …) is unconditionally true — the market predicate is
      # INERT for this vendor and never was the thing protecting the photo slot.
      # Only the photo-authority half (`!focusedStockist`) does that, and it is
      # snapshot-correct rather than serialized: it cannot see a link Fox has
      # begun but not committed. The residual is stated openly at ingest.ts:273.
      #
      # ENRICH AND OFFERS FIGHT OVER THE SAME ROW. Enrich links listing L to the
      # queued cigar C on sim(C.canonicalName, L.name) > 0.55; the next offers walk
      # recomputes findCatalogMatch(L.name) and takes the GLOBAL argmax, which is
      # often a different cigar, and rewrites the same crawler-owned row. The
      # request is already 'fulfilled' by then, so nothing re-queues it. Live
      # example: findCatalogMatch('Romeo y Julieta Mini') -> 'Romeo y Julieta Mini
      # Red Aroma' at 0.724, beating the 0.583 an enrich drain would have used.
      # This is pre-existing for Fox (both Fox jobs were already live); suspending
      # the Cuban Lou's drain keeps it from being introduced for Cuban Lou's too.
      # Durable fix is cigar-journal-side.
      #
      # UNSUSPENDED 2026-08-29 (owner's vendor-expansion directive; Fox posture
      # live-verified 2026-08-28) — three of four, the Cuban Lou's drain excepted.
      #
      # New vendors join only after their own in-cluster robots/ToS probe passes —
      # and after a controller pair lands HERE (see the crawl_enabled note below).
      # Adding that pair is NOT a mechanical copy/paste: read the enrich-queue note
      # above first.
      #
      # ONE CONTROLLER PER VENDOR because `--vendor` takes exactly one adapter slug
      # (packages/crawler/src/cli.ts — there is no --all / --all-enabled mode).
      # Per-vendor also buys independent failure (one wedged vendor fails one Job
      # and keeps its own crawl_runs row), an activeDeadlineSeconds sized to that
      # vendor's own catalog, and an independent `suspend: true` emergency stop —
      # which the Cuban Lou's enrich drain is using right now, and which matters
      # most for that vendor (approval_status unapproved, no purchase link-out,
      # US-embargo exposure note in its adapter).
      #
      # CADENCE MODEL — measured, not guessed. The fetcher serializes EVERY request
      # (pages, sitemap, photos) through one limiter at >=2.5s + jitter, PER
      # PROCESS. Two seed runs both land at 2.75 s/request (Fox 2857 req / 2h11m;
      # Cuban Lou's 1047 req / 48m), so an offers re-walk costs:
      #   * Fox         2004 product URLs => ~92 min  (measured 91m58s, 2026-08-30)
      #   * Cuban Lou's  987 product URLs => ~45 min
      # (Offers re-walks are text-only in practice: capturePhoto short-circuits on
      # an existing product_photos row, and no linked Fox cigar is missing one.)
      # Because the limiter is per POD, two pods on one host double the effective
      # rate, and concurrencyPolicy Forbid guards a CronJob only against ITSELF,
      # never across CronJobs. So every pair here is separated by DAY or by a gap
      # wider than both deadlines: the two offers walks sit on different days
      # (Sun / Wed), at most one enrich drain runs per day, and no enrich window can
      # reach an offers window — an enrich Job starts by 06:10 at the latest
      # (startingDeadlineSeconds 600) and is hard stopped 5400 s later at 07:40,
      # while an offers Job never starts before 08:00.
      #
      # vendors.crawl_enabled GATES NOTHING. Every consumer was grepped: it is only
      # ever written (cli.ts resolveVendor, approved-import.ts, purchase-writer.ts)
      # and never read — the crawler crawls whatever --vendor says. THIS BLOCK is
      # the real crawl gate. A vendor flipped crawl_enabled=true in the DB with no
      # controller here is silently never crawled. Durable fix: cigar-journal#156.
      #
      # THE IMAGE PIN IS THE ANCHOR ABOVE, and that is the entire point of this
      # consolidation. `image: *mainImage` resolves to the one `tag:` on the
      # &mainImage anchor, so a Renovate bump that edits that single line moves
      # init-migrate, web, mcp and all four crawl jobs atomically. There is no
      # longer a per-job pin to forget. The retired `grep -c ... expects 4` guard
      # is replaced by scripts/crawl-cronjob-invariants.sh, which asserts that
      # every controller resolves to the SAME image reference.
      #
      # WHAT THE CHART HIDES — the one thing that got WORSE in the move. Raw
      # manifests made a deleted field visible as a deleted line; app-template
      # substitutes a default instead:
      #   * startingDeadlineSeconds omitted -> 30 (not absent). A >30 s controller
      #     hiccup then makes a CronJob skip the fire entirely — for a weekly walk
      #     that is a silently missed week.
      #   * backoffLimit omitted -> 6 (not 1). A wedged crawl retries six times.
      #   * successfulJobsHistory / failedJobsHistory omitted -> 1 (not 3).
      #   * activeDeadlineSeconds omitted -> emitted NOWHERE, so a wedged crawl runs
      #     forever. This is the field the whole deadline discussion is about.
      # All four are therefore written out explicitly on EVERY job below, even where
      # three jobs share a value. Do not "DRY" them into an anchor and do not delete
      # one because it looks redundant. Note the chart's key spellings:
      # successfulJobsHistory / failedJobsHistory carry NO "Limit" suffix, and every
      # one of these lives under `cronjob:`, not under `pod:` or `containers:`.
      # A misspelling is loud (values.schema.json is additionalProperties:false, so
      # `helm template` and flux-local both fail); a MISSING key is silent, which is
      # why scripts/crawl-cronjob-invariants.sh exists — run it from any PR that
      # touches these four controllers.
      #
      # THE TIMEZONE IS NOT THE CHART'S TO KEEP. Every schedule below is UTC and
      # `timeZone: Etc/UTC` renders correctly — verified against 5.1.0, the value
      # reaches the CronJob. It does not SURVIVE. The cluster runs the k8tz
      # mutating webhook (kube-system/k8tz, injectAll + cronJobTimeZone), and it
      # does not fill spec.timeZone when absent, it REWRITES it: helm-controller
      # applied Etc/UTC on 2026-08-31 and all four CronJobs came up
      # America/New_York. That is not cosmetic — it moves every window 4-5 h and
      # collapses the separation the cadence model above is built on, putting the
      # 06:00 enrich drains onto the 08:00 offers walks.
      # The webhook rule is CREATE-only (batch/v1 cronjobs), which cuts both ways:
      # a helm UPDATE restores Etc/UTC and is never re-stamped, but nothing
      # re-asserts it either — spec.driftDetection is unset here, and
      # helm-controller's default is off, so a stamped value is never corrected.
      # The stamp is therefore permanent until the next CREATE — and permanent
      # again after it. `k8tz.io/inject: "false"` is what makes the value survive that
      # CREATE. Keep it on all four. It belongs at the CONTROLLER level (sibling
      # of `type:`), NOT under `cronjob:`, and it lands only on CronJob metadata:
      # k8tz never wrote into the jobTemplate here — the `migrate` init container
      # on each job below is OURS (haynes-ops#2705), not an injected TZ shim, and
      # there is still no TZ env — so pod-level timezone injection continues to
      # happen at Pod CREATE and is unaffected by this opt-out.
      #
      # FAILURE VISIBILITY (#93 observability) AND ITS TWO BLIND SPOTS. The crawl
      # CLI exits 0 only on a succeeded run and 1 on failure (Dockerfile ROLE
      # DISPATCH; runIngest brackets each run in a crawl_runs row), so a failed run
      # surfaces as a failed Job (restartPolicy Never, backoffLimit 1) in
      # kube-state-metrics and the run's stderr is a Loki-alertable log line. Two
      # things that does NOT catch:
      #   * A deadline kill is not bracketed — the crawler installs no SIGTERM
      #     handler, so an activeDeadlineSeconds kill strands its crawl_runs row at
      #     'running' forever (cigar-journal#155). Tripwire:
      #       select count(*) from crawl_runs
      #        where status='running' and started_at < now() - interval '4 hours';  -- 0
      #   * An enrich run that ENDS EARLY strands its claimed enrichment_requests
      #     row at 'in_progress', which drainEnrichment never re-selects (it filters
      #     status='pending'; cigar-journal#157). This does not need a deadline kill:
      #     tryEnrichCandidates does not wrap fetcher.fetchText in try/catch and
      #     drainEnrichment does not wrap tryEnrichCandidates, so the second
      #     consecutive network/timeout failure on ONE vendor URL rethrows
      #     (core/fetcher.ts:107-114) and ends the whole drain. runIngest then writes
      #     crawl_runs status='failed', so the 'running' tripwire above provably does
      #     NOT fire for this case. Its own tripwire, which nothing else covers:
      #       select id, cigar_id, attempts from enrichment_requests
      #        where status = 'in_progress';  -- expect none outside a live drain
      crawl-offers-fox-cigar:
        type: cronjob
        # k8tz opt-out — without it the next CREATE rewrites timeZone (note above).
        annotations:
          k8tz.io/inject: "false"
        cronjob:
          # Unsuspended. The agent's 591 verdicts are decided_by='agent' in prod and
          # the match.ts:70 guard returns them untouched (header), so a completed
          # walk re-derives only crawler-owned rows. That churn is the cost of Fox —
          # the only approved, purchase_linkout vendor — having a refresh path at
          # all; without one every Fox cigar crosses PRICING_STALE_MS (30 d,
          # packages/domain/src/reads.ts).
          suspend: false
          # Weekly, Sunday 08:00 UTC (= 01:00 America/Phoenix — Fox Cigar is an AZ
          # vendor; this is their overnight low-traffic window).
          schedule: "0 8 * * 0"
          timeZone: Etc/UTC
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 600
          successfulJobsHistory: 3
          failedJobsHistory: 3
          backoffLimit: 1
          ttlSecondsAfterFinished: 86400
          # 9000 s = 150 min. Measured walk is 91m58s (2026-08-30, 2004 product URLs
          # at 2.75 s/req), so this is 1.63x observed and deliberately 19 min ABOVE
          # the 131 min full seed rather than under it — a seed is a strict superset
          # of an offers walk, so a run that reaches this deadline is wedged, not
          # merely slow. The 3600 this job carried before go-live would have killed
          # the first run at ~62% and stranded its crawl_runs row at 'running'.
          activeDeadlineSeconds: 9000
        pod:
          # Never + backoffLimit 1 is what makes a failed crawl surface as a failed
          # Job rather than a restart loop. The chart defaults restartPolicy to
          # Never for cronjobs; stated explicitly because the failure-visibility
          # contract above depends on it.
          restartPolicy: Never
          labels:
            app.kubernetes.io/component: crawl-offers
            vendor: fox-cigar
        # SCHEMA GATE (haynes-ops#2705). These jobs share the app image with the web
        # role but had no migration step, so a Job firing during a bump ran NEW
        # crawler code against the OLD schema. Not hypothetical: v0.30.0 shipped
        # matching v2, whose widened unmatched_reason CHECK arrives in migration
        # 0027 — a walk landing between the CronJob's new tag and the web rollout's
        # migrate init container would have written a value the live CHECK rejects.
        # Ordering by hope (deploy before 06:00 UTC) is not a control; this is.
        #
        # SAFE FROM FIVE PODS AT ONCE, which is the whole reason this is an init
        # container and not a suspend window. Identical runner to the deployment's
        # `migrate` init container above (packages/db/src/scripts/migrate.ts):
        # it takes the BLOCKING session-level `pg_advisory_lock(4927710238)` before
        # it reads anything (:37-38), creates/reads the schema_migrations ledger
        # INSIDE that lock and `continue`s past every id already recorded (:39-47),
        # and unlocks in a `finally` (:60-63). So a second runner waits, wakes to an
        # empty pending set, logs "no pending migrations" and exits 0. Session-level
        # is load-bearing: DATABASE_URL points at the CNPG rw service directly
        # (externalsecret.yaml), never a transaction pooler, which would split the
        # lock and unlock across backends and silently void the mutual exclusion.
        #
        # ONE COST TO KNOW. activeDeadlineSeconds counts init-container time, so a
        # migration that hangs (there is no lock_timeout on either side) burns the
        # crawl's own budget and the Job dies DeadlineExceeded — which reads as a
        # crawl failure, not a migration wait. Check init-container logs before
        # believing a DeadlineExceeded crawl. In practice the four schedules are
        # pairwise disjoint in (day, minute), so the concurrent case only arises
        # when a rollout lands on a crawl start — precisely the case this fixes.
        #
        # NOT an alias of that block, deliberately. Anchoring it would put a YAML
        # anchor three lines from the `tag:` under &mainImage, inside the context
        # window of every image-bump diff. The copy is guarded instead:
        # scripts/crawl-cronjob-invariants.sh walks initContainers as well as
        # containers, so a stale pin here fails the one-image-pin assertion.
        initContainers:
          # Anchored and aliased by the other three jobs — same reasoning as the
          # &crawlEnv / &crawlEnvFrom / &crawlResources blocks below: nothing about
          # this step legitimately differs per vendor or mode, so the three copies
          # are made structurally identical rather than identical by review.
          migrate: &crawlMigrate
            image: *mainImage
            # workingDir is required: `node --import tsx` resolves the loader from
            # CWD, and tsx ships in /app/migrate/node_modules.
            workingDir: /app/migrate
            command:
              - /sbin/tini
              - "--"
              - node
              - --import
              - tsx
              - src/scripts/migrate.ts
            # No `resources:` — parity with the deployment's migrate init container.
            # A pod's effective request is max(sum of containers, max of init
            # containers), so the crawl container's 50m/256Mi still governs.
            envFrom:
              - secretRef:
                  name: cigar-journal-secret
        containers:
          crawl:
            image: *mainImage
            # workingDir is required: `node --import tsx` resolves the loader from
            # CWD, and tsx ships in /app/crawler/node_modules.
            workingDir: /app/crawler
            command:
              - /sbin/tini
              - "--"
              - node
              - --import
              - tsx
              - src/cli.ts
              - --vendor
              - fox-cigar
              - --mode
              - offers
            # Anchored and reused by the other three jobs: these three blocks must
            # never drift apart between vendors, and an anchor makes that structural
            # rather than a review promise. The per-job values that legitimately
            # DIFFER (schedule, suspend, deadlines, --vendor, --mode, labels) stay
            # written out at their point of use.
            env: &crawlEnv
              # No IPv6 egress in this cluster; force A-record-first for the
              # crawler's outbound fetches (same trap the web/mcp roles hit).
              NODE_OPTIONS: --dns-result-order=ipv4first
              # Photo capture for newly matched cigars — mirrored from the web role.
              PHOTOS_S3_ENDPOINT: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80
              PHOTOS_S3_BUCKET:
                valueFrom:
                  configMapKeyRef:
                    name: cigar-journal-photos
                    key: BUCKET_NAME
              PHOTOS_S3_ACCESS_KEY_ID:
                valueFrom:
                  secretKeyRef:
                    name: cigar-journal-photos
                    key: AWS_ACCESS_KEY_ID
              PHOTOS_S3_SECRET_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: cigar-journal-photos
                    key: AWS_SECRET_ACCESS_KEY
            envFrom: &crawlEnvFrom
              - secretRef:
                  name: cigar-journal-secret
            resources: &crawlResources
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi
      crawl-offers-cuban-lous:
        type: cronjob
        # k8tz opt-out — without it the next CREATE rewrites timeZone (note above).
        annotations:
          k8tz.io/inject: "false"
        cronjob:
          # Unsuspended. The re-derive described in the header costs 1 re-pointed
          # link out of 82 crawler-owned 'auto' rows here, and Cuban Lou's carries no
          # curator/agent verdicts at all. This is the coverage gap the four-job
          # shape exists to close — Cuban Lou's was seeded 2026-08-29 and had no path
          # back onto the schedule. Re-check that 1-of-82 figure if the catalog moves.
          suspend: false
          # Weekly, Wednesday 08:00 UTC. Same overnight hour as the Fox walk but a
          # different DAY, so a Fox overrun can never reach this window. 08:00 UTC is
          # 01:00-04:00 across CONUS.
          schedule: "0 8 * * 3"
          timeZone: Etc/UTC
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 600
          successfulJobsHistory: 3
          failedJobsHistory: 3
          backoffLimit: 1
          ttlSecondsAfterFinished: 86400
          # ~45 min expected (987 product URLs at 2.75 s/req); ~2x headroom.
          activeDeadlineSeconds: 5400
        pod:
          restartPolicy: Never
          labels:
            app.kubernetes.io/component: crawl-offers
            vendor: cuban-lous
        initContainers:
          migrate: *crawlMigrate
        containers:
          crawl:
            image: *mainImage
            workingDir: /app/crawler
            command:
              - /sbin/tini
              - "--"
              - node
              - --import
              - tsx
              - src/cli.ts
              - --vendor
              - cuban-lous
              - --mode
              - offers
            env: *crawlEnv
            envFrom: *crawlEnvFrom
            resources: *crawlResources
      crawl-enrich-fox-cigar:
        type: cronjob
        # k8tz opt-out — without it the next CREATE rewrites timeZone (note above).
        annotations:
          k8tz.io/inject: "false"
        cronjob:
          suspend: false
          # Sun/Mon/Wed/Fri 06:00 UTC (= 23:00 America/Phoenix). NARROWED FROM DAILY
          # 2026-08-31, in the same PR that unsuspended crawl-enrich-cuban-lous:
          # `0,1,3,5` here + `2,4,6` there tiles all seven days with no shared day.
          # Was daily while this was the ONLY live enrich drain, which bought a
          # transient-failure retry the next morning; that is the cost paid for the
          # second vendor. Both jobs are pinned at `0 6`, so a shared day is not a
          # near-miss, it is a simultaneous start.
          # WHY DISJOINT DAYS, now that #157 is fixed. The original reason — a
          # SELECT-then-UPDATE claim and a snapshot-read `attempts + 1` that two
          # same-day drains double-burned — is GONE: enrichment_attempts is now an
          # atomic upsert keyed UNIQUE(request_id, vendor_id), so the budget is
          # per-vendor and per-vendor increments cannot clobber each other. The
          # lane lock does not replace the tiling either: it is keyed per
          # (vendor, mode), so a Fox enrich and a Cuban Lou's enrich hold different
          # keys and are concurrent BY DESIGN (run-record.ts, and stated at
          # enrichment-coverage.ts:241). What disjoint days still buy is the one
          # race whose artifact is permanent: Cuban Lou's is focus='both', its
          # market predicate is inert, and if its INSERT commits before Fox's link
          # transaction does, it wins the UNIQUE(cigar_id) product_photos slot on a
          # cigar Fox stocks — forever. Cheap to avoid, unremovable if hit.
          # Moved off 09:00, which landed INSIDE the ~92 min Fox offers walk and put
          # a second pod on foxcigar.com mid-crawl. Latest start 06:10, hard stop
          # 07:40, so it clears the 08:00 offers windows by 20 min.
          schedule: "0 6 * * 0,1,3,5"
          timeZone: Etc/UTC
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 600
          successfulJobsHistory: 3
          failedJobsHistory: 3
          backoffLimit: 1
          ttlSecondsAfterFinished: 86400
          # Wedge guard sized ABOVE the worst run the code can produce, NOT a
          # capacity estimate and NOT a mid-drain kill: a kill here strands the
          # claimed enrichment_requests row at 'in_progress' forever (header
          # tripwire, cigar-journal#157), so the deadline must only ever fire on a
          # genuinely stuck process. A healthy run is seconds — the 2026-08-30 Fox
          # drain was 2 pages / 3 s. Ceiling: --limit 10 x MAX_ENRICH_CANDIDATES 8 =
          # up to 80 page fetches, plus 10 photos, robots and the sitemap ~= 96
          # serialized requests. The slowest per-request path that does NOT throw is
          # one 15 s abort, a 1 s backoff and a slow-but-successful retry, ~36 s with
          # throttles — about 58 min for all 96. (A true timeout storm cannot run
          # longer: core/fetcher.ts:107-114 rethrows on the SECOND consecutive
          # failure and nothing catches it, so the run ends at ~36 s. A 5xx storm is
          # faster still — `status >= 500 && attempt === 0` is false on the retry, so
          # fetchText returns the 503 and the loop continues at ~7 s per URL, ~11
          # min.) 5400 s = 90 min is 1.5x the 58 min ceiling and still stops by
          # 07:40, clearing the 08:00 offers windows.
          activeDeadlineSeconds: 5400
        pod:
          restartPolicy: Never
          labels:
            app.kubernetes.io/component: crawl-enrich
            vendor: fox-cigar
        initContainers:
          migrate: *crawlMigrate
        containers:
          crawl:
            image: *mainImage
            workingDir: /app/crawler
            command:
              - /sbin/tini
              - "--"
              - node
              - --import
              - tsx
              - src/cli.ts
              - --vendor
              - fox-cigar
              - --mode
              - enrich
              - --limit
              - "10"
            env: *crawlEnv
            envFrom: *crawlEnvFrom
            resources: *crawlResources
      crawl-enrich-cuban-lous:
        type: cronjob
        # k8tz opt-out — without it the next CREATE rewrites timeZone (note above).
        annotations:
          k8tz.io/inject: "false"
        cronjob:
          # UNSUSPENDED 2026-08-31. It shipped suspended for an unfixed cross-vendor
          # defect (header), not a posture call; cigar-journal#192 landed the focus
          # predicate and the photo-authority gate, and v0.29.0 deployed them here
          # together with migration 0025's focus='both' correction. The ordering was
          # required, not incidental: until 0025 ran, the live row still said 'CC'
          # and every listing this lane touched would have asserted CC about cigars
          # that are not.
          suspend: false
          # Tue/Thu/Sat 06:00 UTC — the alternating half of the enrich pair;
          # crawl-enrich-fox-cigar narrowed to `0,1,3,5` in the same PR. See that
          # job's comment for why the tiling survives the #157 fix: not the attempt
          # budget (now atomic and per-vendor) and not the lane lock (keyed per
          # (vendor, mode), so these two are concurrent by design), but the
          # UNIQUE(cigar_id) product_photos slot, whose loser never gets it back.
          # WHAT TO WATCH ON THE FIRST RUNS. This lane is focus='both', so its
          # market predicate is inert and it is refused at the PHOTO gate instead.
          # A photo_refused leaves the ask open and burns neither attempts nor
          # errors, while the open set is `ORDER BY created_at LIMIT 10` — so the
          # lane can pin on the same ten oldest Fox-stocked asks and re-fetch them
          # every scheduled night without advancing. Not corruption, and it is what
          # photoRefusedVendors exists to surface, but if the drain reports the same
          # refusals three runs running, that is the head-of-line stall and not a
          # coincidence. The operator lever is crawl_enabled=false.
          schedule: "0 6 * * 2,4,6"
          timeZone: Etc/UTC
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 600
          successfulJobsHistory: 3
          failedJobsHistory: 3
          backoffLimit: 1
          ttlSecondsAfterFinished: 86400
          # Same wedge-guard reasoning as crawl-enrich-fox-cigar above: sized above
          # the ~58 min worst non-throwing run, never as a mid-drain kill.
          activeDeadlineSeconds: 5400
        pod:
          restartPolicy: Never
          labels:
            app.kubernetes.io/component: crawl-enrich
            vendor: cuban-lous
        initContainers:
          migrate: *crawlMigrate
        containers:
          crawl:
            image: *mainImage
            workingDir: /app/crawler
            command:
              - /sbin/tini
              - "--"
              - node
              - --import
              - tsx
              - src/cli.ts
              - --vendor
              - cuban-lous
              - --mode
              - enrich
              - --limit
              - "10"
            env: *crawlEnv
            envFrom: *crawlEnvFrom
            resources: *crawlResources
    service:
      main:
        controller: main
        ports:
          http:
            port: 3000
      mcp:
        controller: mcp
        ports:
          http:
            port: 8081
