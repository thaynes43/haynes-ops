---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Cigar Journal (thaynes43/cigar-journal) — replaces the Phase 0 spike at
# the same hostname. One image, roles selected by command: web (default),
# migrate (init container).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cigar-journal
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18.6"
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: cigar-journal-secret
          migrate:
            image: &mainImage
              repository: ghcr.io/thaynes43/cigar-journal
              tag: v0.40.0
              pullPolicy: IfNotPresent
            # workingDir is required: node --import tsx resolves the loader
            # from CWD, and tsx ships in /app/migrate/node_modules.
            workingDir: /app/migrate
            command:
              - /sbin/tini
              - "--"
              - node
              - --import
              - tsx
              - src/scripts/migrate.ts
            envFrom:
              - secretRef:
                  name: cigar-journal-secret
        containers:
          app:
            image: *mainImage
            env:
              NODE_ENV: production
              PORT: "3000"
              HOSTNAME: "0.0.0.0"
              # No IPv6 egress in this cluster; force A-record-first for any
              # outbound fetch (same trap as todos-for-dues).
              NODE_OPTIONS: --dns-result-order=ipv4first
              # Authentik OIDC discovery (cigar-journal ADR-010). Plain env —
              # a discovery URL is not a secret; the client id/secret ride
              # cigar-journal-oidc-secret. The app enables SSO only when all
              # three are present, so this alone changes nothing.
              OIDC_DISCOVERY_URL: https://authentik.haynesnetwork.com/application/o/cigar-journal/.well-known/openid-configuration
              PHOTOS_S3_ENDPOINT: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80
              PHOTOS_S3_BUCKET:
                valueFrom:
                  configMapKeyRef:
                    name: cigar-journal-photos
                    key: BUCKET_NAME
              PHOTOS_S3_ACCESS_KEY_ID:
                valueFrom:
                  secretKeyRef:
                    name: cigar-journal-photos
                    key: AWS_ACCESS_KEY_ID
              PHOTOS_S3_SECRET_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: cigar-journal-photos
                    key: AWS_SECRET_ACCESS_KEY
            envFrom:
              - secretRef:
                  name: cigar-journal-secret
              # Optional so the pod starts before the 1Password fields exist;
              # absent credentials simply mean SSO is off (ADR-010 fail-closed).
              - secretRef:
                  name: cigar-journal-oidc-secret
                  optional: true
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 24
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
      # MCP role: same image, long-running six-tool adapter (thaynes43/
      # cigar-journal docs/mcp/tool-contract.md). Shares the origin with web —
      # /mcp routes here, /.well-known + /oauth/* + everything else to web.
      mcp:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: *mainImage
            workingDir: /app/mcp
            command:
              - /sbin/tini
              - "--"
              - node
              - --import
              - tsx
              - src/index.ts
            env:
              PORT: "8081"
              # Cut SSE stream overhead per call; clients negotiating JSON get
              # single-response mode (latency feedback 2026-08-27).
              MCP_JSON_RESPONSE: "true"
              NODE_OPTIONS: --dns-result-order=ipv4first
              PHOTOS_S3_ENDPOINT: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80
              PHOTOS_S3_BUCKET:
                valueFrom:
                  configMapKeyRef:
                    name: cigar-journal-photos
                    key: BUCKET_NAME
              PHOTOS_S3_ACCESS_KEY_ID:
                valueFrom:
                  secretKeyRef:
                    name: cigar-journal-photos
                    key: AWS_ACCESS_KEY_ID
              PHOTOS_S3_SECRET_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: cigar-journal-photos
                    key: AWS_SECRET_ACCESS_KEY
            envFrom:
              - secretRef:
                  name: cigar-journal-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 3
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
      # ==================================================================
      # VENDOR CRAWLER CADENCE (cigar-journal ADR-006, go-live #93)
      # ==================================================================
      # THE CRAWL FLEET — two controllers, not one pair per vendor (ADR-015,
      # cigar-journal#270, v0.39.0). Until v0.38.0 this block carried four
      # CronJobs, one per (vendor, mode), because the CLI took exactly one
      # `--vendor`. v0.39.0 added `crawl --all-enabled --mode <enrich|offers>`:
      # it reads `vendors.crawl_enabled` (finally the gate it always looked like,
      # cigar-journal#156), walks the enabled vendors SERIALLY in tier order, gives
      # each its own crawl_runs row and lane lock, logs a failing vendor and moves
      # on, and exits 1 at the end if any vendor failed. So the registry decides
      # WHO is crawled and this file decides only WHEN. A vendor is enabled with
      # `UPDATE vendors SET crawl_enabled = true` (audited by hand until the admin
      # console exposes it) and never by editing this file; the old per-vendor
      # `suspend: true` emergency stop is `crawl_enabled = false` on that row.
      #
      # Same image as the web/mcp roles; the `crawl` role is selected by the
      # container command (ROLE DISPATCH marker in the cigar-journal Dockerfile).
      # `image: *mainImage` resolves the ONE `tag:` on the &mainImage anchor, so a
      # bump moves init-migrate, web, mcp and both crawl jobs atomically;
      # scripts/crawl-cronjob-invariants.sh asserts that and the explicit CronJob
      # fields below — run it from any PR that touches these two controllers.
      #
      # WHY SERIAL, AND WHY THIS ORDER. The fetcher serializes every request
      # through one limiter per PROCESS (>= 2.5 s + jitter, measured 2.75 s/req on
      # the Fox and Cuban Lou's seeds), so one pod walking vendors one after another
      # keeps the per-domain politeness the old calendar was built to protect, and
      # it removes the race that calendar existed to avoid: two enrich drains on
      # one day could both win the UNIQUE(cigar_id) product_photos slot. Tier order
      # is what makes photo fallback a property of ONE run: a tier-2 vendor's drain
      # only takes an ask every enabled higher-tier vendor covering that market has
      # already looked at and missed (everyHigherTierLookedSql, ADR-015), and
      # because the tier-1 drains ran minutes earlier in the same pod, the miss rows
      # are already there. Within a tier the order is by name.
      #
      # WHAT AN `offers` WALK STILL DOES — unchanged from the per-vendor days, read
      # before touching a schedule: `walkListings` calls `findCatalogMatch` for
      # EVERY listing on EVERY run and `upsertListingMatch` rewrites cigar_id AND
      # status on any row whose decided_by='crawler' and status<>'confirmed'. A
      # completed walk is a full re-derivation of crawler-owned links, not a price
      # append; agent and curator verdicts are returned untouched (match.ts:70).
      # v0.39.0 adds one more thing a walk may do: a tier-1 capture REPLACES a
      # lower-tier product photo (never the reverse, `rights = suppressed` is
      # final), which is how a picture from a tier-2 Habanos shop is upgraded once
      # an approved store carries the same cigar.
      #
      # CADENCE — measured where it could be, bounded where it could not.
      #   * enrich, DAILY 02:00 UTC, `--limit 50` PER VENDOR: at most 50 asks x 8
      #     candidate pages + 50 photos + robots + sitemap ~= 450 serialized
      #     requests per vendor (~10-20 min measured on Fox). Seven enabled vendors
      #     is the realistic ceiling this year, so 10800 s (3 h) is the fleet
      #     deadline and the window closes by 05:00, three hours before the offers
      #     walk can start. Moved off 06:00 because the fleet is longer than one
      #     vendor was and must not reach the 08:00 Sunday window (a second pod on
      #     one vendor mid-walk is the thing the per-process limiter cannot see).
      #   * offers, WEEKLY Sunday 08:00 UTC (= 01:00 America/Phoenix, Fox's
      #     overnight low): Fox 2004 pages ~= 92 min (measured 91m58s), Cuban Lou's
      #     987 ~= 45 min, and every adapter enabled since caps at maxPages 500
      #     (25-42 min each at its own interval). 28800 s (8 h) covers the whole
      #     fleet with the caps in place; when a cap is lifted for a full catalogue
      #     (Small Batch is ~11k pages, 2 Guys ~3.8k), lift this with it and read
      #     the resume/chunking note on cigar-journal#270 first.
      #   * A deadline kill is not bracketed by the crawler (no SIGTERM handler): it
      #     strands that vendor's crawl_runs row at 'running' until the next start
      #     reclaims it (reclaimStrandedRuns), truncates the fleet at that vendor,
      #     and strands nothing in enrichment_requests (attempts are an atomic
      #     upsert; `ORDER BY created_at` resumes at the same head next day).
      #     Tripwire, unchanged:
      #       select count(*) from crawl_runs
      #        where status='running' and started_at < now() - interval '4 hours';  -- 0
      #
      # CUBAN LOU'S ENRICH IS BACK IN THE FLEET, on purpose. Its lane was suspended
      # on 2026-09-01 as an economics call (82 listings, no Habanos single sticks,
      # spending CC ask budget against pages that do not exist). Under ADR-015 that
      # budget is per vendor and per ask (enrichment_attempts, UNIQUE(request_id,
      # vendor_id)), so its misses cost nothing another vendor could have used —
      # about 400 fetches on a quiet night — and the Habanos picture sources
      # (Montefortuna tier 2, EGM 3, Cigarworld 4, J.J. Fox 5) are what actually
      # answer those asks once their probes pass and their rows are enabled.
      #
      # WHAT THE CHART HIDES, still true and still written out on BOTH jobs:
      # startingDeadlineSeconds omitted -> 30 (a >30 s controller hiccup skips the
      # fire; for the weekly walk that is a silently missed week), backoffLimit
      # omitted -> 6, the two history limits omitted -> 1, activeDeadlineSeconds
      # omitted -> emitted NOWHERE. Note the chart's spellings: successfulJobsHistory
      # / failedJobsHistory carry NO "Limit" suffix, and all of it lives under
      # `cronjob:`. A misspelling is loud (values.schema.json is
      # additionalProperties:false); a MISSING key is silent, which is what the
      # invariants script is for.
      #
      # THE TIMEZONE IS NOT THE CHART'S TO KEEP. The k8tz mutating webhook
      # (kube-system/k8tz, cronJobTimeZone) REWRITES spec.timeZone at CronJob
      # CREATE — Etc/UTC came up America/New_York on 2026-08-31 and moved every
      # window 4-5 h. `k8tz.io/inject: "false"` on the CONTROLLER (sibling of
      # `type:`, never under `cronjob:`) is what makes Etc/UTC survive the CREATE
      # that this very restructure performs. Keep it on both.
      #
      # FAILURE VISIBILITY: the CLI exits 0 only when every vendor succeeded (a
      # lane-lock `skipped` is not a failure) and 1 otherwise, so a red vendor
      # surfaces as a failed Job in kube-state-metrics with the per-vendor summary
      # and the fleet block in the Job's log; `tool_called`-style events are not
      # emitted by the crawl role, the log IS the record.
      crawl-enrich-fleet:
        type: cronjob
        # k8tz opt-out — without it the CREATE below rewrites timeZone (note above).
        annotations:
          k8tz.io/inject: "false"
        cronjob:
          suspend: false
          # Daily, 02:00 UTC — six hours ahead of the earliest offers window.
          schedule: "0 2 * * *"
          timeZone: Etc/UTC
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 600
          successfulJobsHistory: 3
          failedJobsHistory: 3
          backoffLimit: 1
          ttlSecondsAfterFinished: 86400
          # Fleet deadline: ~7 vendors x <= ~25 min each; closes by 05:00.
          activeDeadlineSeconds: 10800
        pod:
          restartPolicy: Never
          labels:
            app.kubernetes.io/component: crawl-enrich
        initContainers:
          migrate: &crawlMigrate
            image: *mainImage
            workingDir: /app/migrate
            command:
              - /sbin/tini
              - "--"
              - node
              - --import
              - tsx
              - src/scripts/migrate.ts
            envFrom:
              - secretRef:
                  name: cigar-journal-secret
        containers:
          crawl:
            image: *mainImage
            workingDir: /app/crawler
            command:
              - /sbin/tini
              - "--"
              - node
              - --import
              - tsx
              - src/cli.ts
              - --all-enabled
              - --mode
              - enrich
              - --limit
              - "50"
            env: &crawlEnv
              NODE_OPTIONS: --dns-result-order=ipv4first
              PHOTOS_S3_ENDPOINT: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80
              PHOTOS_S3_BUCKET:
                valueFrom:
                  configMapKeyRef:
                    name: cigar-journal-photos
                    key: BUCKET_NAME
              PHOTOS_S3_ACCESS_KEY_ID:
                valueFrom:
                  secretKeyRef:
                    name: cigar-journal-photos
                    key: AWS_ACCESS_KEY_ID
              PHOTOS_S3_SECRET_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: cigar-journal-photos
                    key: AWS_SECRET_ACCESS_KEY
            envFrom: &crawlEnvFrom
              - secretRef:
                  name: cigar-journal-secret
            resources: &crawlResources
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi
      crawl-offers-fleet:
        type: cronjob
        # k8tz opt-out — see the enrich controller.
        annotations:
          k8tz.io/inject: "false"
        cronjob:
          suspend: false
          # Weekly, Sunday 08:00 UTC (01:00 America/Phoenix — Fox Cigar is an AZ
          # vendor; their overnight low), the same window the Fox walk has used
          # since 2026-08-30.
          schedule: "0 8 * * 0"
          timeZone: Etc/UTC
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 600
          successfulJobsHistory: 3
          failedJobsHistory: 3
          backoffLimit: 1
          ttlSecondsAfterFinished: 86400
          # Fleet deadline with every new adapter capped at maxPages 500 (cadence
          # note above); lift together with the caps.
          activeDeadlineSeconds: 28800
        pod:
          restartPolicy: Never
          labels:
            app.kubernetes.io/component: crawl-offers
        initContainers:
          migrate: *crawlMigrate
        containers:
          crawl:
            image: *mainImage
            workingDir: /app/crawler
            command:
              - /sbin/tini
              - "--"
              - node
              - --import
              - tsx
              - src/cli.ts
              - --all-enabled
              - --mode
              - offers
            env: *crawlEnv
            envFrom: *crawlEnvFrom
            resources: *crawlResources
    service:
      main:
        controller: main
        ports:
          http:
            port: 3000
      mcp:
        controller: mcp
        ports:
          http:
            port: 8081
