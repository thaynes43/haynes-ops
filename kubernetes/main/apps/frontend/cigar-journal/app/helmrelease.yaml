---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Cigar Journal (thaynes43/cigar-journal) — replaces the Phase 0 spike at
# the same hostname. One image, roles selected by command: web (default),
# migrate (init container).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cigar-journal
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18.6"
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: cigar-journal-secret
          migrate:
            image: &mainImage
              repository: ghcr.io/thaynes43/cigar-journal
              tag: v0.4.2
              pullPolicy: IfNotPresent
            # workingDir is required: node --import tsx resolves the loader
            # from CWD, and tsx ships in /app/migrate/node_modules.
            workingDir: /app/migrate
            command:
              - /sbin/tini
              - "--"
              - node
              - --import
              - tsx
              - src/scripts/migrate.ts
            envFrom:
              - secretRef:
                  name: cigar-journal-secret
        containers:
          app:
            image: *mainImage
            env:
              NODE_ENV: production
              PORT: "3000"
              HOSTNAME: "0.0.0.0"
              # No IPv6 egress in this cluster; force A-record-first for any
              # outbound fetch (same trap as todos-for-dues).
              NODE_OPTIONS: --dns-result-order=ipv4first
            envFrom:
              - secretRef:
                  name: cigar-journal-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 24
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
      # MCP role: same image, long-running six-tool adapter (thaynes43/
      # cigar-journal docs/mcp/tool-contract.md). Shares the origin with web —
      # /mcp routes here, /.well-known + /oauth/* + everything else to web.
      mcp:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: *mainImage
            workingDir: /app/mcp
            command:
              - /sbin/tini
              - "--"
              - node
              - --import
              - tsx
              - src/index.ts
            env:
              PORT: "8081"
              NODE_OPTIONS: --dns-result-order=ipv4first
            envFrom:
              - secretRef:
                  name: cigar-journal-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 3
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 3000
      mcp:
        controller: mcp
        ports:
          http:
            port: 8081
