---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
#
# sigoalumni.org front page — homelab replicas (sigo-alumni ADR 0004 wave 1,
# backlog/infra/homelab-hosting/05). Runs the SAME image the Cloud Run service
# `frontpage` serves, against the SAME Cloud SQL database (shared-DB phase, no
# data migration) via a cloud-sql-proxy native sidecar. Receives NO public
# traffic yet: no ingressroute on purpose — the DNS/tunnel flip is a separate,
# explicitly-not-here step. In-cluster access: sigoalumni.frontend.svc:8080.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sigoalumni
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        # 3 replicas so no single node failure or drain takes the (future)
        # serving path down — same HA posture as haynesnetwork. Safe at 3:
        # DB-backed sessions, zero filesystem state; the image's startup
        # migrate.js serializes concurrent migrations with a session-level
        # pg_advisory_lock (losers block, then no-op).
        replicas: 3
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        # Keep two pods serving through any voluntary disruption (node drain).
        # Native app-template per-controller PDB auto-scopes to controller=main.
        podDisruptionBudget:
          minAvailable: 2
        pod:
          # AR is a private registry — pull with the homelab-ar-reader SA key
          # (ExternalSecret sigoalumni-ar-pull).
          imagePullSecrets:
            - name: sigoalumni-ar-pull
          # Spread the 3 replicas across distinct nodes. The labelSelector MUST
          # include controller=main (haynesnetwork caveat): every pod of this
          # release shares the name + instance labels, so any future extra
          # controller (cronjob etc.) would otherwise count toward per-node skew.
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: *app
                  app.kubernetes.io/instance: *app
                  app.kubernetes.io/controller: main
        initContainers:
          # Cloud SQL Auth Proxy as a NATIVE sidecar (restartPolicy Always):
          # kubelet starts it and waits for its startup probe BEFORE the app
          # container runs, so the image's boot-time migrate.js always finds
          # 127.0.0.1:5432 listening (no first-boot race), and it outlives the
          # app container for clean shutdown ordering.
          cloud-sql-proxy:
            image:
              repository: gcr.io/cloud-sql-connectors/cloud-sql-proxy
              tag: 2.25.4
              pullPolicy: IfNotPresent
            restartPolicy: Always
            args:
              - --credentials-file=/secrets/cloudsql/key.json
              - --address=127.0.0.1
              - --port=5432
              - --health-check
              - --http-address=0.0.0.0
              - --http-port=9801
              - --structured-logs
              - sigo-alumni-prod:us-east1:frontpage-pg
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /startup
                    port: 9801
                  periodSeconds: 2
                  timeoutSeconds: 3
                  failureThreshold: 30
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
        containers:
          app:
            image:
              # Pinned to sigoalumni-org main commit 4294d65 (2026-09-17):
              # Board Meeting Minutes review-gate fix (sigoalumni-org #145).
              # Live verification found the one real sample of ΣΦΟ Scribe
              # output for an unreviewed page repeats its title as an H1 BEFORE
              # the "Pending review" banner, and the byte-0-anchored predicate
              # read that as reviewed — i.e. an unchecked page would have been
              # listed and served the moment it sat under a configured year
              # page. The gate now also matches the banner under leading
              # headings (fence required there). Content-only; no schema, env,
              # or secret change.
              # On top of bf2d48f:
              # (previous pin note follows)
              # Pinned to sigoalumni-org main commit bf2d48f (2026-09-17):
              # Board Meeting Minutes (sigoalumni-org #144) — a members-area
              # reading section at /members/board-minutes projected from the
              # Meetings collection in the wiki, independent of Knowledge Base
              # exposure. A page still carrying the ΣΦΟ Scribe pipeline's
              # "Pending review" banner is neither listed nor servable, so only
              # board-verified notes reach members. New env this pin needs:
              # OUTLINE_BOARD_MINUTES_PARENT_IDS (below) — the Cloud Run service
              # declares the same value in the site repo's terraform. No schema
              # change, no new secret.
              # On top of 8d75f59:
              # (previous pin note follows)
              # Pinned to sigoalumni-org main commit 8d75f59 (2026-09-15):
              # /roadmap is reachable from inside the site (sigoalumni-org
              # #143) — a fifth members-hub tile after Knowledge Base, and a
              # closing paragraph on /about, both linking /roadmap. The main
              # nav is deliberately untouched: it has to stay one line on a
              # 360px phone. Content-only; no schema, env, or secret change.
              # On top of ee375e8:
              # (previous pin note follows)
              # one new PLANNED roadmap milestone (sigoalumni-org #142) —
              # "Move sigoboard@gmail.com to a shared Workspace inbox", second
              # in the planned group after "A single mailing list", with a new
              # "inbox" marker glyph. Content-only page; no schema, env, or
              # secret change.
              # On top of 22c5f53:
              # (previous pin note follows)
              # roadmap timeline polish (sigoalumni-org #141) — a row label no
              # longer repeats the group heading next to it: completed shows
              # its date, in progress shows "Since <date>" when it has one, and
              # everything else shows no label at all. The rail no longer hangs
              # a dashed stub above the first marker: the top row of the list
              # draws no segment and the first milestone starts it at its own
              # marker centre. Content-only page; no schema, env, or secret
              # change.
              # On top of c7daa8d:
              # (previous pin note follows)
              # the public roadmap is one vertical timeline (sigoalumni-org
              # #140) — a single rail down /roadmap with an icon marker per
              # milestone, the date or state in a left column, cards to the
              # right, read planned → in progress → completed newest-first.
              # Content-only page (no DB, no Drive); new front-end dependency
              # lucide-react. No schema, env, or secret change.
              # On top of 9bf875c:
              # (previous pin note follows)
              # invitation OPT-OUTS (sigoalumni-org #139) — a brother who asks
              # not to be invited again is recorded in a new table and every
              # surface that mints a link (Directory paste, /members/invite,
              # the internal API) refuses him; recording also revokes the live
              # links he still holds. MIGRATION 0022 creates invite_optouts
              # (additive, no backfill; applied by scripts/migrate.js at
              # container start like every other one). POST
              # /api/internal/invites gains an `optOut` body shape; its create
              # /send behaviour is unchanged. No env or secret change.
              # On top of 69b5b4f: withdrawn invitations counted on the
              # campaign tile (#138 — no schema, env or secret change).
              # On top of 1b832e1:
              # (previous pin note follows)
              # sigoalumni-org #135 (page copy sanitized), #136 (invite email
              # text approved by Tom), #137 (campaign reframed as "Improve
              # communication", headline = deliverable addresses on the list
              # we email; /roadmap/reach → /roadmap/communication redirect).
              # No schema, env, or secret change. On top of 7d0314f:
              # (previous pin note follows)
              # reach campaign — "Brothers reached by year" chart (sigoalumni-org
              # #134): seeded from the list sync's join-years.csv on Drive, plus
              # the brothers the site captures itself; weekly numbers folded
              # into a disclosure. No schema, env, or secret change. On top of
              # a863709:
              # (previous pin note follows)
              # the reach campaign's goal is now a number — 300 brothers on
              # brothers@ at addresses that don't bounce by 2026-12-31
              # (sigoalumni-org #133): "Reachable brothers" tile with progress,
              # list counts labelled by list, goal line on the chart; the live
              # count lists brothers@ over the existing DWD scope (MEMBER role
              # only). On top of 49b9115:
              # public roadmap + campaign pages (sigoalumni-org #132, PRD 0003
              # in sigo-alumni) — /roadmap and /roadmap/reach, aggregate-only
              # numbers from the site DB + the list sync's history CSV on
              # Drive (runtime SA, read-only; optional env
              # REACH_HISTORY_FOLDER_ID defaults in code), footer link,
              # sitemap. No schema change. On top of 0ca8672: internal invites
              # API (#131); 519eaec: a brother invites a brother (#130,
              # brotherhood-reach/06) — /members/invite for every Brother, no
              # board approval; migration 0021 adds the enum value
              # 'invited-by-brother' (ALTER TYPE … ADD VALUE IF NOT EXISTS,
              # additive); admin@ gets one notice per brother-invite sign-in.
              # On top of 0a4608d/b82b73d (invite links, #128/#129: table
              # invite_links via 0020, route /invite/<token>, Directory
              # "Invite brothers"). No new env. CI does not deploy here; bump
              # deliberately.
              repository: us-east1-docker.pkg.dev/sigo-alumni-prod/frontpage/site
              tag: 4294d65e7bec0bde0e6eb9c6bb05864a079b1d1e
              pullPolicy: IfNotPresent
            env:
              # ── Plain env copied 1:1 from the Cloud Run service ──────────
              # Same public origin ON PURPOSE: the homelab serves the same
              # site behind the same hostname once traffic flips (ADR 0004).
              BETTER_AUTH_URL: https://sigoalumni.org
              BOOTSTRAP_ADMIN_EMAILS: manofoz@gmail.com,admin@sigoalumni.org
              GOOGLE_OAUTH_CLIENT_ID: 30320160364-49mqt159c4rvegcqbt7lvmt6pru5kt4k.apps.googleusercontent.com
              # Workspace photo folders + events calendar (IDs are not secrets;
              # the SA's Workspace share is the access control).
              PHOTOS_PUBLIC_FOLDER_ID: 1DcbLiutwYcCQOFRw8jaSdpQ7N5ahRv8Z
              PHOTOS_FRONTPAGE_FOLDER_ID: 1kkrXlWS3sX2ywvhvqJBvb6gYXttx6YE1
              PHOTOS_MEMBERS_FOLDER_ID: 1qitzjJtfcUhhMmulrvQ5J5x9oLziqtwA
              # "Photos/Upload Inbox" — the one folder the runtime SA can WRITE
              # to; member uploads land here, never listed or served (mp/15).
              PHOTOS_INBOX_FOLDER_ID: 1IjV_4uoZCh0L-T3PhRUQYHBNGpShLiSx
              EVENTS_CALENDAR_ID: fd2537569f85b3cb0138b6729091ad91190704b6beffaadd0e357250e8967f0c@group.calendar.google.com
              # Workspace auth (Drive photos, Calendar, Sheets, Meet minting):
              # on Cloud Run the pods authenticate keylessly as frontpage-runtime
              # via the metadata server. Homelab pods have no metadata server, so
              # GOOGLE_APPLICATION_CREDENTIALS points at an impersonation-chain
              # ADC (see externalsecret.yaml #4): a low-privilege keyed SA mints
              # tokens AS frontpage-runtime, which itself stays keyless. Needs
              # image >= 21b6a87 (cloud-platform scope in lib/google/auth.ts —
              # older images 403 on the impersonated generateAccessToken).
              GOOGLE_APPLICATION_CREDENTIALS: /secrets/workspace-adc/adc.json
              MEET_IMPERSONATION_SUBJECT: admin@sigoalumni.org
              # brothers@ distro sync (members-portal 09, #76): every
              # member_registry ADD is propagated into this Google Group over the
              # keyless DWD path; REMOVE takes it out. Not a secret — the DWD
              # grant is the access control. Safe to set pre-go-live: the group's
              # absence 404s to an audited no-op until it is created at go-live.
              BROTHERS_GROUP_EMAIL: brothers@sigoalumni.org
              LEGACY_GROUP_EMAIL: sigmaphiomicron@googlegroups.com
              # Board announce audience (#106) — the radio renders only when
              # this is set; mirrors the Cloud Run service 1:1.
              BOARD_GROUP_EMAIL: board@sigoalumni.org
              # Gmail authenticated submission (smtp.gmail.com, NOT the
              # IP-vetted relay — see sigoalumni-org terraform for history).
              SMTP_RELAY_HOST: smtp.gmail.com
              SMTP_USER: admin@sigoalumni.org
              MAIL_FROM: "Sigo Alumni <admin@sigoalumni.org>"
              # Knowledge Base projection (read-only Outline client).
              OUTLINE_API_URL: https://wiki.sigoalumni.org/api
              # Board Meeting Minutes (sigoalumni-org #144) — comma-separated
              # Outline document IDs of the "year" pages whose DIRECT children
              # are the meetings to publish. Wiki page ids, not secrets; the
              # members session is the access control. Unset ⇒ the hub tile
              # greys out and the page shows its not-ready wall. Today: the 2026
              # page under Board Meetings.
              OUTLINE_BOARD_MINUTES_PARENT_IDS: eeac065b-1164-47c4-8c68-073b547e0766
              # OIDC provider (sigo-alumni ADR 0007) — todos-for-dues client.
              # Comma-separated EXACT redirect URIs (lib/auth/oidc.ts
              # parseRedirectURIs: raw.split(",") + trim; fail-closed — one bad
              # entry poisons the whole list, no wildcards). 2026-08-14: trimmed
              # to ONLY the canonical dues.sigoalumni.org callback — the legacy
              # todos-for-dues.haynesops.com hostname/route was retired.
              OIDC_DUES_REDIRECT_URIS: https://dues.sigoalumni.org/api/auth/oauth2/callback/sigo-portal
              # ── Homelab-only addition ────────────────────────────────────
              # No IPv6 egress in this cluster; public endpoints the app calls
              # (wiki.sigoalumni.org via Cloudflare, Google OAuth/APIs, Gmail
              # submission) answer AAAA + A, and undici's Happy Eyeballs would
              # time out on v6 first. Same fix as todos-for-dues/haynesnetwork.
              NODE_OPTIONS: --dns-result-order=ipv4first
            envFrom:
              - secretRef:
                  name: sigoalumni-secret
            # PROBES: readiness = GET /api/healthz (DB-touching route, image
            # >= 21b6a87): a pod whose DB path is broken stops receiving
            # traffic — correct for a DB-backed-sessions app. Startup STAYS
            # GET / ("can serve": listening implies boot migrations are done)
            # so a DB outage makes new pods unready instead of startup-probe
            # restart-looping them; liveness stays tcpSocket (Cloud Run parity
            # — never restart-loop pods on upstream slowness).
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthz
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 24
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                # Cloud Run parity (512Mi limit there).
                memory: 512Mi
    persistence:
      cloudsql-sa:
        type: secret
        name: sigoalumni-cloudsql-sa
        # Sidecar-only mount: the app container never sees the SA key.
        advancedMounts:
          main:
            cloud-sql-proxy:
              - path: /secrets/cloudsql
                readOnly: true
      workspace-adc:
        type: secret
        name: sigoalumni-workspace-adc
        # App-only mount (GOOGLE_APPLICATION_CREDENTIALS): the proxy sidecar
        # keeps its own key and never sees this one.
        advancedMounts:
          main:
            app:
              - path: /secrets/workspace-adc
                readOnly: true
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
