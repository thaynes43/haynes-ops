---
# All three secrets come from GCP Secret Manager (project sigo-alumni-prod) via
# the gcp-sm-sigo ClusterSecretStore — the SAME secret material the Cloud Run
# service reads, so the homelab replicas stay credential-identical to Cloud Run
# (ADR 0004 wave 1 shared-DB phase). No values live in 1Password or this repo.

# 1. Artifact Registry pull credential (SA homelab-ar-reader, artifactregistry.reader).
#    A dockerconfigjson with only the `auth` field (base64 "_json_key:<key JSON>")
#    — deliberately avoids embedding the raw multiline key JSON inside the JSON
#    document (quoting hazard); kubelet only needs `auth`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sigoalumni-ar-pull
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-sm-sigo
  target:
    name: sigoalumni-ar-pull
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {"auths": {"us-east1-docker.pkg.dev": {"username": "_json_key", "auth": "{{ printf "_json_key:%s" .AR_KEY | b64enc }}"}}}
  data:
    - secretKey: AR_KEY
      remoteRef:
        key: homelab-ar-reader-key
---
# 2. Cloud SQL Auth Proxy credential (SA homelab-cloudsql-client, cloudsql.client).
#    Mounted as a file into the cloud-sql-proxy sidecar only (see helmrelease
#    advancedMounts) — the app container never sees it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sigoalumni-cloudsql-sa
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-sm-sigo
  target:
    name: sigoalumni-cloudsql-sa
    creationPolicy: Owner
  data:
    - secretKey: key.json
      remoteRef:
        key: homelab-cloudsql-sa-key
---
# 3. App env — mirrors every secret-backed env var of the Cloud Run `frontpage`
#    service, from the SAME SM secrets it references. The one exception is
#    DATABASE_URL: homelab-database-url is frontpage-database-url with the
#    /cloudsql unix-socket host rewritten to 127.0.0.1:5432 (the proxy sidecar);
#    user/password/db are identical.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sigoalumni
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-sm-sigo
  target:
    name: sigoalumni-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: homelab-database-url
    - secretKey: SESSION_SECRET
      remoteRef:
        key: frontpage-session-secret
    - secretKey: GOOGLE_OAUTH_CLIENT_SECRET
      remoteRef:
        key: frontpage-oauth-client-secret
    - secretKey: OIDC_DUES_CLIENT_SECRET
      remoteRef:
        key: oidc-dues-client-secret
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: frontpage-smtp-password
    - secretKey: OUTLINE_API_TOKEN
      remoteRef:
        key: frontpage-outline-api-token
