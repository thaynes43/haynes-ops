---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app sigoalumni
  namespace: &namespace frontend
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # No cloudnative-pg dependency (unlike the other frontend apps): the database
  # is Cloud SQL (sigo-alumni-prod:us-east1:frontpage-pg), reached through the
  # cloud-sql-proxy sidecar in the HelmRelease — ADR 0004 wave 1 shared-DB phase.
  dependsOn:
    - name: external-secrets-stores
      namespace: external-secrets
  path: ./kubernetes/main/apps/frontend/sigoalumni/app
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  prune: true
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
