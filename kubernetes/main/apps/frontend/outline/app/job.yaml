---
# Single migration Job — the ONLY place DB schema work happens, so the 3 app
# replicas never race on migrations (backlog/infra/homelab-hosting/07). Outline
# auto-migrates on boot (server/utils/startup.js → migrations.up under a Redis
# MutexLock), so the app pods are started with `--no-migrate`: they fail-closed
# (Logger.fatal → exit 1) until this Job has applied the schema, then boot clean.
#
#   initContainer 01-init-db : postgres-init creates DB `outline` + role `outline`
#                              idempotently on cluster16 (superuser = postgres).
#   container      migrate    : `yarn db:migrate` (sequelize db:migrate) applies
#                              every pending migration exactly once, then exits 0.
#
# On an EMPTY DB (Stage 1) this creates the full schema; the Stage-2 pg restore
# loads it into that schema. Image PINNED to the VM's proven 1.9.2 digest.
apiVersion: batch/v1
kind: Job
metadata:
  name: outline-db-migrate
  annotations:
    # Jobs' spec.template is immutable: any manifest diff (or the controller's
    # injected labels after a TTL-expiry recreate) wedges the kustomization
    # with "field is immutable" — bit us 2026-08-15. force = Flux deletes and
    # recreates instead of patching; safe because the migration is idempotent
    # (sequelize no-ops when nothing is pending). TTL removed so the completed
    # Job persists instead of churning a delete/recreate cycle every 24h.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outline
        app.kubernetes.io/component: db-migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: 01-init-db
          image: ghcr.io/home-operations/postgres-init:18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: outline-secret
            - secretRef:
                name: outline-cnpg-superuser
      containers:
        - name: migrate
          # Same 1.9.2 image the VM runs, byte-identical digest, but pulled
          # from docker.io (the getoutline.com registry is not on the Kyverno
          # restrict-image-registries allowlist; docker.io is).
          image: docker.io/outlinewiki/outline@sha256:cc9f1f05fd7cd316745b5fc9cfe01e681b1b4cf97705d1d812a5c778d7986cfd
          imagePullPolicy: IfNotPresent
          # The production image ships NO `yarn` on PATH, so invoke sequelize-cli
          # directly (what `yarn db:migrate` == `sequelize db:migrate` runs).
          # Explicit `node <bin>` bypasses docker-entrypoint.sh's command-vs-node
          # heuristic; WORKDIR /opt/outline makes the relative path + .sequelizerc
          # resolve. This applies every pending migration exactly once, then exits.
          command: ["node", "node_modules/.bin/sequelize", "db:migrate"]
          envFrom:
            - secretRef:
                name: outline-secret
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
