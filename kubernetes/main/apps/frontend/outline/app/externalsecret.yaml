---
# Outline app env — every value comes from GCP Secret Manager (project
# sigo-alumni-prod) via the gcp-sm-sigo ClusterSecretStore, the SAME secret
# material the retiring VM reads (backlog/infra/homelab-hosting/07). The
# load-bearing pair: SECRET_KEY (outline-secret-key) + UTILS_SECRET
# (outline-utils-secret) encrypt the OAuth tokens stored in the DB — carried
# byte-identical so the pg restore's encrypted tokens decrypt (no
# ERR_OSSL_BAD_DECRYPT, no forced re-login). The hostname URL is preserved
# (wiki.sigoalumni.org) so the front-page KB API key keeps authenticating.
#
# Env parity with the VM compose: URL / FORCE_HTTPS=false / PGSSLMODE=disable /
# ENABLE_UPDATES=false / FILE_STORAGE=local. Cluster-specific rewrites: DATABASE_URL
# -> postgres16-rw with the NEW outline-db-password (SM: outline-db-password, minted
# for the cluster — distinct from the VM's outline-postgres-password); REDIS_URL ->
# passwordless shared Dragonfly db /3. WEB_CONCURRENCY=1 pins one web process per
# pod (HA comes from 3 replicas, not intra-pod forking on 16-40 vCPU nodes).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-sm-sigo
  target:
    name: outline-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        NODE_ENV: production
        # Load-bearing encryption keys (carried byte-identical from the VM).
        # `| trim` strips the trailing newline the SM values carry (the VM's
        # load-secrets.sh strips it via $(...) command substitution, so the
        # trimmed value IS what the VM actually uses — byte-identical carry).
        # Outline validates SECRET_KEY/UTILS_SECRET as EXACTLY 64 hex chars, so
        # the newline must be stripped or every migration/boot fails validation.
        SECRET_KEY: "{{ .SECRET_KEY | trim }}"
        UTILS_SECRET: "{{ .UTILS_SECRET | trim }}"
        # DB — shared CNPG cluster16, new cluster-side credential.
        DATABASE_URL: "postgres://outline:{{ .DB_PASSWORD | trim }}@postgres16-rw.database.svc.cluster.local:5432/outline"
        PGSSLMODE: disable
        # Redis — shared Dragonfly, db index /3 (passwordless in-cluster).
        REDIS_URL: redis://dragonfly.database.svc.cluster.local:6379/3
        # Public origin preserved across the migration (KB + OAuth continuity).
        URL: https://wiki.sigoalumni.org
        PORT: "3000"
        # Traefik/Cloudflare terminate TLS; Outline speaks HTTP behind them.
        FORCE_HTTPS: "false"
        ENABLE_UPDATES: "false"
        # Attachments on the CephFS RWX PVC (FILE_STORAGE=local semantics).
        FILE_STORAGE: local
        FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/files
        # Auth — Google OAuth (Cloud Identity tenant), same client as the VM.
        GOOGLE_CLIENT_ID: "{{ .GOOGLE_CLIENT_ID | trim }}"
        GOOGLE_CLIENT_SECRET: "{{ .GOOGLE_CLIENT_SECRET | trim }}"
        DEFAULT_LANGUAGE: en_US
        WEB_CONCURRENCY: "1"
        # postgres-init contract (idempotent DB + role bootstrap, run by the
        # migration Job's init container). Same INIT_POSTGRES_* keys as
        # authentik / paperless / todos-for-dues; superuser pass is injected
        # separately from the onepassword-connect ES below.
        INIT_POSTGRES_DBNAME: outline
        INIT_POSTGRES_HOST: postgres16-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: outline
        INIT_POSTGRES_PASS: "{{ .DB_PASSWORD | trim }}"
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: outline-secret-key
    - secretKey: UTILS_SECRET
      remoteRef:
        key: outline-utils-secret
    - secretKey: DB_PASSWORD
      remoteRef:
        key: outline-db-password
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: outline-oauth-client-id
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: outline-oauth-client-secret
---
# CNPG superuser password (postgres) for the postgres-init bootstrap — sourced
# from the onepassword-connect `cloudnative-pg` item (same property the CNPG
# operator uses). Separate ExternalSecret because it lives in a different
# ClusterSecretStore than the app secrets above; the migration Job's init
# container mounts BOTH secrets via envFrom.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline-cnpg-superuser
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: outline-cnpg-superuser
    creationPolicy: Owner
  data:
    - secretKey: INIT_POSTGRES_SUPER_PASS
      remoteRef:
        key: cloudnative-pg
        property: POSTGRES_SUPER_PASS
