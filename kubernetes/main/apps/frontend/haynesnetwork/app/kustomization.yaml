---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./gatus.yaml
  - ./helmrelease.yaml
  - ./ingressroute.yaml
  - ./middleware.yaml
configMapGenerator:
  # The Loki ruler sidecar picks this up by label (same pattern as
  # plex/plexops/qbittorrent). Stable name: nothing references the ConfigMap,
  # the sidecar reads it.
  - name: haynesnetwork-loki-rules
    files:
      - haynesnetwork.yaml=./lokirule.yaml
    options:
      labels:
        loki_rule: "true"
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
