---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: haynesnetwork
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: haynesnetwork-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # App — Better Auth (Authentik OIDC only; see haynesnetwork repo
        # docs/ops/001-authentik-provisioning.md for the provider of record)
        BETTER_AUTH_SECRET: "{{ .BETTER_AUTH_SECRET }}"
        # STAGED ROLLOUT (PRD R-64): internal hostname first. At root-domain
        # cutover change this to https://haynesnetwork.com and swap the
        # IngressRoute — the Authentik redirect URIs already cover both.
        BETTER_AUTH_URL: "https://haynesnetwork.com"
        TRUSTED_ORIGINS: "https://www.haynesnetwork.com"
        OIDC_CLIENT_ID: "{{ .OIDC_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"

        # App — bootstrap admins (comma-separated allowlist, ADR-002)
        # hnet-e2e is the autonomous-run live-validation user (local Authentik account,
        # 2026-07-06) — appended here so it bootstraps to Admin for staging validation.
        # Removing it does NOT demote the existing user; demote via /admin if retiring it.
        BOOTSTRAP_ADMIN_EMAILS: "{{ .BOOTSTRAP_ADMIN_EMAILS }},hnet-e2e@haynesnetwork.com"
        # e2e automation account passwords (Authentik natives in mfa-exempt, PLAN-011/OPS-009
        # 2026-07-10) — synced so validation agents fetch via kubectl instead of blind-rotating
        # them through `ak shell` (which invalidated prior sessions' knowledge).
        HNET_E2E_PASSWORD: "{{ .HNET_E2E_PASSWORD }}"
        HNET_E2E_MEMBER_PASSWORD: "{{ .HNET_E2E_MEMBER_PASSWORD }}"

        # Database connection — composed from cnpg creds
        DATABASE_URL: "postgres://{{ .HAYNESNETWORK_POSTGRESQL__USER }}:{{ .HAYNESNETWORK_POSTGRESQL__PASSWORD }}@postgres16-rw.database.svc.cluster.local:5432/haynesnetwork"

        # postgres-init bootstrap (idempotent DB + role creation on pod start)
        INIT_POSTGRES_DBNAME: haynesnetwork
        INIT_POSTGRES_HOST: postgres16-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .HAYNESNETWORK_POSTGRESQL__USER }}"
        INIT_POSTGRES_PASS: "{{ .HAYNESNETWORK_POSTGRESQL__PASSWORD }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"

        # Media stack (Phase 2 ledger sync + fix flow) — DESIGN-005 D-18.
        # URLs are omitted: @hnet/arr defaults to the in-cluster service DNS.
        SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
        RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
        LIDARR_API_KEY: "{{ .LIDARR_API_KEY }}"
        SEERR_API_KEY: "{{ .SEERR_API_KEY }}"
        # Bazarr subtitle Fix (ADR-016 / DESIGN-005 D-19). URL omitted: @hnet/arr
        # defaults to the in-cluster service DNS (bazarr.media.svc.cluster.local:6767).
        BAZARR_API_KEY: "{{ .BAZARR_API_KEY }}"
        # MAM compliance governor (PLAN-039 / ADR-054). The `mam-governor` CronJob toggles the
        # MyAnonaMouse Prowlarr indexer's enable flag near the unsatisfied-torrent cap; the key
        # comes from the shared `media-stack` item, already pulled in via the `dataFrom: extract
        # media-stack` below — TEMPLATE line only, no new data[] remoteRef. URLs + the indexer id
        # (17) default in code to the in-cluster Services; qBittorrent needs no secret.
        PROWLARR_API_KEY: "{{ .PROWLARR_API_KEY }}"
        # Metadata-harvest sources (PLAN-004 / ADR-018 / DESIGN-008). Keys come from
        # the shared `media-stack` 1Password item, already pulled in via the
        # `dataFrom: extract media-stack` below — TEMPLATE lines only, no new
        # data[] remoteRefs. All OPTIONAL (@hnet/arr per-source degradation).
        # Tautulli watch-stats x3 (cross-server history addendum). In-cluster URLs
        # default to service DNS; HaynesTower is the external legacy box (no default).
        TAUTULLI_API_KEY: "{{ .TAUTULLI_API_KEY }}"
        TAUTULLI_K8PLEX_API_KEY: "{{ .TAUTULLI_K8PLEX_API_KEY }}"
        TAUTULLI_HAYNESTOWER_API_KEY: "{{ .TAUTULLI_HAYNESTOWER_API_KEY }}"
        TAUTULLI_HAYNESTOWER_URL: "http://haynestower.haynesnetwork:8181"
        # TMDB direct fallback (v4 bearer preferred; v3 key kept as belt-and-braces)
        TMDB_API_READ_ACCESS_TOKEN: "{{ .TMDB_API_READ_ACCESS_TOKEN }}"
        TMDB_API_KEY: "{{ .TMDB_API_KEY }}"
        # TVDB v4 direct fallback (series-metadata holes)
        TVDB_API_KEY: "{{ .TVDB_API_KEY }}"
        # Maintainerr best-effort tier (opt-in; key also enables it — deployed
        # instance answers keyless, header harmlessly ignored).
        MAINTAINERR_API_KEY: "{{ .MAINTAINERR_API_KEY }}"
        # Pushover batch notifications (ADR-034 / PLAN-016) — from the shared media-stack item.
        PUSHOVER_APP_TOKEN: "{{ .HAYNESNETWORK_PUSHOVER_TOKEN }}"
        PUSHOVER_USER_KEY: "{{ .HAYNESNETWORK_PUSHOVER_USER_KEY }}"
        # Plex owner tokens (ADR-017 / DESIGN-007 D-11) — context vars fetched by the
        # targeted data[] remoteRefs below (homepage item; never the plexops item).
        PLEX_HAYNESTOWER_TOKEN: "{{ .PLEX_HAYNESTOWER_TOKEN }}"
        PLEX_HAYNESOPS_TOKEN: "{{ .PLEX_HAYNESOPS_TOKEN }}"
        PLEX_HAYNESKUBE_TOKEN: "{{ .PLEX_HAYNESKUBE_TOKEN }}"
        # Open WebUI admin API (ADR-044 / DESIGN-022 / PLAN-021 — AI usage metrics). The
        # `ai-usage-sync` CronJob polls OWUI's admin API READ-ONLY with this key; URL omitted
        # (@hnet/sync defaults to the in-cluster service DNS open-webui.ai.svc.cluster.local).
        # Targeted data[] fetch below from the shared `openwebui` 1Password item (the same item the
        # ai-namespace open-webui ExternalSecret reads) — additive, no collision with that file.
        OPENWEBUI_API_KEY: "{{ .OPENWEBUI_API_KEY }}"
        # Books read clients (ADR-046 / DESIGN-024 — PLAN-023). The `books-sync` CronJob AND the web
        # /api/books/cover proxy authenticate to Kavita (hnetadmin) + Audiobookshelf (root) with these
        # passwords (URLs default in code to the in-cluster service DNS kavita.media / audiobookshelf.media).
        # Targeted data[] fetches below from the shared `kavita` / `audiobookshelf` 1Password items (the same
        # items the media-namespace kavita/audiobookshelf ExternalSecrets read) — additive, no collision.
        KAVITA_PASSWORD: "{{ .KAVITA_PASSWORD }}"
        AUDIOBOOKSHELF_PASSWORD: "{{ .AUDIOBOOKSHELF_PASSWORD }}"
        # Goodreads Integrations MVP (ADR-055 / DESIGN-028 — PLAN-044). The `sync-goodreads`
        # CronJob + the web Integrations tab talk to LazyLibrarian (request push + manual
        # search via the confined @hnet/lazylibrarian write) and Google Books (shelf-item
        # enrichment, retry/backoff in code). LL URL defaults in code to the in-cluster
        # service DNS; GOOGLE_BOOKS_API_KEY rides the existing `media-stack` extract
        # (TEMPLATE line only); LL's key is a targeted fetch from its dedicated item.
        LAZYLIBRARIAN_API_KEY: "{{ .LAZYLIBRARIAN_API_KEY }}"
        # PLAN-048 Activity (ADR-059): the books adapter reads the SAB queue/history.
        # Rides the existing media-stack extract — TEMPLATE line only.
        SABNZBD_API_KEY: "{{ .SABNZBD_API_KEY }}"
        GOOGLE_BOOKS_API_KEY: "{{ .GOOGLE_BOOKS_API_KEY }}"
        # Kapowarr comics acquisition (ADR-056 — PLAN-046). The goodreads-sync comic leg +
        # the comics force-search route comic requests through the confined @hnet/kapowarr
        # write. KAPOWARR_URL defaults in code to the in-cluster service DNS.
        KAPOWARR_API_KEY: "{{ .KAPOWARR_API_KEY }}"
  data:
    # LazyLibrarian API key (PLAN-044) — the same dedicated-item fetch the
    # downloads-namespace lazylibrarian ExternalSecret uses.
    - secretKey: LAZYLIBRARIAN_API_KEY
      remoteRef:
        key: lazylibrarian
        property: LAZYLIBRARIAN_API_KEY
    # Kapowarr API key (PLAN-046) — dedicated-item fetch (1P `kapowarr`).
    - secretKey: KAPOWARR_API_KEY
      remoteRef:
        key: kapowarr
        property: KAPOWARR_API_KEY
    # Books read-client passwords (ADR-046) — from the `kavita`/`audiobookshelf` items' bootstrap fields.
    - secretKey: KAVITA_PASSWORD
      remoteRef:
        key: kavita
        property: KAVITA_ADMIN_PASS
    - secretKey: AUDIOBOOKSHELF_PASSWORD
      remoteRef:
        key: audiobookshelf
        property: ABS_ROOT_PASS
    # Open WebUI admin-API key (ADR-044) — targeted fetch from the `openwebui` item's OPENWEBUI_API_KEY
    # field (the field the ai-namespace openwebui-secret also templates).
    - secretKey: OPENWEBUI_API_KEY
      remoteRef:
        key: openwebui
        property: OPENWEBUI_API_KEY
    # lidarr pre-dates the media-stack item; its key lives in its own item
    # (same targeted fetch the homepage ExternalSecret uses).
    - secretKey: LIDARR_API_KEY
      remoteRef:
        key: lidarr
        property: LIDARR_API_KEY
    # Plex owner tokens (ADR-017 / DESIGN-007 D-11) — targeted fetches from the
    # `homepage` item (NEVER the `plexops` item: its HAYNESKUBE_PLEX_API_KEY field is a
    # different credential — documented collision). URLs are omitted: @hnet/plex defaults
    # to the in-cluster service DNS per seeded plex_servers.base_url.
    - secretKey: PLEX_HAYNESTOWER_TOKEN
      remoteRef:
        key: homepage
        property: HAYNESTOWER_PLEX_API_KEY
    - secretKey: PLEX_HAYNESOPS_TOKEN
      remoteRef:
        key: homepage
        property: HAYNESOPS_PLEX_API_KEY
    - secretKey: PLEX_HAYNESKUBE_TOKEN
      remoteRef:
        key: homepage
        property: HAYNESKUBE_PLEX_API_KEY
  dataFrom:
    - extract:
        key: haynesnetwork
    - extract:
        key: cloudnative-pg
    # Shared media-pipeline keys (unique <APP>_API_KEY names — collision-safe merge)
    - extract:
        key: media-stack
