---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: haynesnetwork
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: haynesnetwork-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # App — Better Auth (Authentik OIDC only; see haynesnetwork repo
        # docs/ops/001-authentik-provisioning.md for the provider of record)
        BETTER_AUTH_SECRET: "{{ .BETTER_AUTH_SECRET }}"
        # STAGED ROLLOUT (PRD R-64): internal hostname first. At root-domain
        # cutover change this to https://haynesnetwork.com and swap the
        # IngressRoute — the Authentik redirect URIs already cover both.
        BETTER_AUTH_URL: "https://haynesnetwork.haynesops.com"
        OIDC_CLIENT_ID: "{{ .OIDC_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"

        # App — bootstrap admins (comma-separated allowlist, ADR-002)
        BOOTSTRAP_ADMIN_EMAILS: "{{ .BOOTSTRAP_ADMIN_EMAILS }}"

        # Database connection — composed from cnpg creds
        DATABASE_URL: "postgres://{{ .HAYNESNETWORK_POSTGRESQL__USER }}:{{ .HAYNESNETWORK_POSTGRESQL__PASSWORD }}@postgres16-rw.database.svc.cluster.local:5432/haynesnetwork"

        # postgres-init bootstrap (idempotent DB + role creation on pod start)
        INIT_POSTGRES_DBNAME: haynesnetwork
        INIT_POSTGRES_HOST: postgres16-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .HAYNESNETWORK_POSTGRESQL__USER }}"
        INIT_POSTGRES_PASS: "{{ .HAYNESNETWORK_POSTGRESQL__PASSWORD }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"

        # Media stack (Phase 2 ledger sync + fix flow) — DESIGN-005 D-18.
        # URLs are omitted: @hnet/arr defaults to the in-cluster service DNS.
        SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
        RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
        LIDARR_API_KEY: "{{ .LIDARR_API_KEY }}"
        SEERR_API_KEY: "{{ .SEERR_API_KEY }}"
        # Bazarr subtitle Fix (ADR-016 / DESIGN-005 D-19). URL omitted: @hnet/arr
        # defaults to the in-cluster service DNS (bazarr.media.svc.cluster.local:6767).
        BAZARR_API_KEY: "{{ .BAZARR_API_KEY }}"
        # Plex owner tokens (ADR-017 / DESIGN-007 D-11) — context vars fetched by the
        # targeted data[] remoteRefs below (homepage item; never the plexops item).
        PLEX_HAYNESTOWER_TOKEN: "{{ .PLEX_HAYNESTOWER_TOKEN }}"
        PLEX_HAYNESOPS_TOKEN: "{{ .PLEX_HAYNESOPS_TOKEN }}"
        PLEX_HAYNESKUBE_TOKEN: "{{ .PLEX_HAYNESKUBE_TOKEN }}"
  data:
    # lidarr pre-dates the media-stack item; its key lives in its own item
    # (same targeted fetch the homepage ExternalSecret uses).
    - secretKey: LIDARR_API_KEY
      remoteRef:
        key: lidarr
        property: LIDARR_API_KEY
    # Plex owner tokens (ADR-017 / DESIGN-007 D-11) — targeted fetches from the
    # `homepage` item (NEVER the `plexops` item: its HAYNESKUBE_PLEX_API_KEY field is a
    # different credential — documented collision). URLs are omitted: @hnet/plex defaults
    # to the in-cluster service DNS per seeded plex_servers.base_url.
    - secretKey: PLEX_HAYNESTOWER_TOKEN
      remoteRef:
        key: homepage
        property: HAYNESTOWER_PLEX_API_KEY
    - secretKey: PLEX_HAYNESOPS_TOKEN
      remoteRef:
        key: homepage
        property: HAYNESOPS_PLEX_API_KEY
    - secretKey: PLEX_HAYNESKUBE_TOKEN
      remoteRef:
        key: homepage
        property: HAYNESKUBE_PLEX_API_KEY
  dataFrom:
    - extract:
        key: haynesnetwork
    - extract:
        key: cloudnative-pg
    # Shared media-pipeline keys (unique <APP>_API_KEY names — collision-safe merge)
    - extract:
        key: media-stack
