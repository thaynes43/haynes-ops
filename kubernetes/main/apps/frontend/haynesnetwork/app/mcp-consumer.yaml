---
# The Watch Companion's MCP consumer token (haynesnetwork ADR-087 / DESIGN-049 D-04, OPS-015).
#
# Minted HERE, in-cluster, by an External Secrets Password generator: no person and no agent ever
# sees the value, and nothing is stored in 1Password. Two readers, same namespace:
#   - the haynesnetwork web pods (envFrom, optional) compare it against the Bearer on POST /api/mcp;
#   - frontend/haynesnetwork-mcp-hop injects it as that Bearer for Home Assistant and dev-env, which
#     call the hop without any credential of their own.
#
# refreshPolicy CreatedOnce: the Secret is generated once and never regenerated by a sync or an
# unrelated spec edit (a silent rotation would 401 every consumer until both readers rolled).
# Rotation = delete the Secret `haynesnetwork-mcp-consumer`; ESO mints a new one and Reloader rolls
# the web pods and the hop together (OPS-015 section 4).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: haynesnetwork-mcp-consumer
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
  # The key IS the env var name the web container reads via envFrom.
  secretKeys:
    - HNET_MCP_HOP_TOKEN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: haynesnetwork-mcp-consumer
spec:
  refreshPolicy: CreatedOnce
  target:
    name: haynesnetwork-mcp-consumer
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: haynesnetwork-mcp-consumer
