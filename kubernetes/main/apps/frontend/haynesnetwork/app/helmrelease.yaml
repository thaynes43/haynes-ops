---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app haynesnetwork
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      # 10 retries (was 3): kyverno's signature verify can transiently deny a FRESH
      # release while GHCR propagates the .sig artifact (hit on v0.50.1 + v0.52.0,
      # 2026-07-14). Spread attempts self-heal the race without operator action;
      # a REAL unsigned image still stalls loudly at the end.
      retries: 10
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        # haynesnetwork-ha saga (haynes-ops) plan 02, decision 2 (owner-ratified 2026-07-28):
        # run 3 replicas so no single node failure or drain takes the front page down. Was 1
        # (the tightest SPOF on the serving path). Safe at 3+: DB-backed sessions, zero
        # filesystem state, background work confined to the sync CronJobs, ~10 pg conns/pod
        # vs shared max 400. Concurrent migrate init-containers are serialized by the app's
        # pg_advisory_lock (v0.90.5+, saga plan 01).
        replicas: 3
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        # Keep two main pods serving through any voluntary disruption (node drain/upgrade).
        # Native app-template per-controller PDB: its selector auto-scopes to
        # app.kubernetes.io/controller=main, so the ~18 sync CronJob pods are never counted.
        podDisruptionBudget:
          minAvailable: 2
        # Spread the 3 replicas across distinct nodes. The labelSelector MUST include
        # controller=main: every haynesnetwork pod (incl. the CronJobs) shares the name +
        # instance labels, so without it the CronJob pods would be counted toward per-node skew.
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: haynesnetwork
                  app.kubernetes.io/instance: haynesnetwork
                  app.kubernetes.io/controller: main
        initContainers:
          # 1. Create the app's database + role inside cluster16 if missing.
          #    Idempotent; same pattern as todos-for-dues/authentik/paperless.
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18.4"
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: haynesnetwork-secret
              - secretRef:
                  name: haynesnetwork-webhook
                  optional: true
          # 2. Apply Drizzle migrations (+ idempotent app_catalog seed) from
          #    the flattened migrator subtree baked into the app image.
          migrate:
            image: &mainImage
              repository: ghcr.io/thaynes43/haynesnetwork
              tag: v0.93.0
              pullPolicy: IfNotPresent
            command:
              - tsx
              - /migrator/src/scripts/migrate.ts
            envFrom:
              - secretRef:
                  name: haynesnetwork-secret
              - secretRef:
                  name: haynesnetwork-webhook
                  optional: true
        containers:
          app:
            image: *mainImage
            env:
              NODE_ENV: production
              PORT: "3000"
              HOSTNAME: "0.0.0.0"
              # No IPv6 egress in this cluster; Authentik's public endpoints
              # (Cloudflare) return AAAA + A. Same undici Happy-Eyeballs
              # timeout todos-for-dues hit with Google OIDC — force IPv4.
              NODE_OPTIONS: --dns-result-order=ipv4first
              # GB per-consumer daily call budget (env-tunable; code defaults 60/25/15). Raised
              # 2026-07-19 after LazyLibrarian + Libretto moved to their own GCP-project keys: the
              # app now owns its Google Books key's full ~1,000/day, so we use it. bookfix is the
              # interactive-Fix reserve enforced in this app container; pairing/goodreads are
              # enforced in their sync jobs below (same values set there).
              GB_DAILY_CALL_BUDGET_PAIRING: "700"
              GB_DAILY_CALL_BUDGET_GOODREADS: "200"
              GB_DAILY_CALL_BUDGET_BOOKFIX: "100"
            envFrom:
              - secretRef:
                  name: haynesnetwork-secret
              - secretRef:
                  name: haynesnetwork-webhook
                  optional: true
              # PLAN-026 (ADR-045) — the dedicated hnet-portal Authentik service-account token
              # (AUTHENTIK_API_TOKEN). Cluster-created (like haynesnetwork-webhook), optional so the
              # app boots before it lands; Reloader restarts the pod when it changes.
              - secretRef:
                  name: haynesnetwork-authentik-token
                  optional: true
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 24
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
      # Ledger sync (DESIGN-005 D-14): same image, flattened /sync subtree.
      # Incremental = *arr history cursors + Seerr requests, cheap and frequent.
      sync-incremental:
        type: cronjob
        pod:
          restartPolicy: Never
        cronjob:
          schedule: "*/15 * * * *"
          backoffLimit: 1
          concurrencyPolicy: Forbid
          failedJobsHistory: 2
          successfulJobsHistory: 1
        containers:
          main:
            image: *mainImage
            command:
              - tsx
              - /sync/src/scripts/sync.ts
              - --mode=incremental
            envFrom:
              - secretRef:
                  name: haynesnetwork-secret
              - secretRef:
                  name: haynesnetwork-webhook
                  optional: true
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
      # Metadata harvest every 6h (PLAN-004 / ADR-018): *arr ratings/genres/posters,
      # Tautulli watch-stats, TMDB/TVDB fallback for tombstones — per-source degradation.
      sync-metadata:
        type: cronjob
        pod:
          restartPolicy: Never
        cronjob:
          schedule: "15 */6 * * *"
          backoffLimit: 1
          concurrencyPolicy: Forbid
          failedJobsHistory: 2
          successfulJobsHistory: 1
        containers:
          main:
            image: *mainImage
            command:
              - tsx
              - /sync/src/scripts/sync.ts
              - --mode=metadata-refresh
            envFrom:
              - secretRef:
                  name: haynesnetwork-secret
              - secretRef:
                  name: haynesnetwork-webhook
                  optional: true
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 768Mi
      # Trash-batch sweep hourly (PLAN-012 / ADR-025): expires leaving_soon batches whose
      # window closed — per-item guarded deletes (SAFE audit + guardian + live exclusions
      # re-run at sweep time). Only greenlit/gate-skipped batches can ever reach this path.
      sync-trash-batch-sweep:
        type: cronjob
        pod:
          restartPolicy: Never
        cronjob:
          schedule: "45 * * * *"
          backoffLimit: 1
          concurrencyPolicy: Forbid
          failedJobsHistory: 2
          successfulJobsHistory: 1
        containers:
          main:
            image: *mainImage
            command:
              - tsx
              - /sync/src/scripts/sync.ts
              - --mode=trash-batch-sweep
            envFrom:
              - secretRef:
                  name: haynesnetwork-secret
              - secretRef:
                  name: haynesnetwork-webhook
                  optional: true
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
      # Pushover outbox drain every 13 min (PLAN-016 / ADR-034 / DESIGN-015 D-05): drains DUE
      # notification_outbox rows (sent_at IS NULL AND attempts<5 AND earliest_send_at<=now) to
      # api.pushover.net, deep-linking …/trash?tab=<movies|tv>. Staggered off the other jobs.
      # NOT suspended (active): a safe no-op that leaves rows queued when PUSHOVER_* env is absent.
      # ADR-060 follow-up (PLAN-048 tail, v0.59.0) — the NIGHTLY admin failure digest: reads OPEN
      # activity_import_failures and enqueues ONE email-channel outbox row (none when clean); the
      # sync-notify-outbox drainer delivers it over the F-04 SMTP relay. 21:05 local sits inside
      # the default notify window and clear of every other job's minute.
      sync-failure-digest:
        type: cronjob
        pod:
          restartPolicy: Never
        cronjob:
          schedule: "5 21 * * *"
          backoffLimit: 1
          concurrencyPolicy: Forbid
          failedJobsHistory: 2
          successfulJobsHistory: 1
        containers:
          main:
            image: *mainImage
            command:
              - tsx
              - /sync/src/scripts/sync.ts
              - --mode=failure-digest
            envFrom:
              - secretRef:
                  name: haynesnetwork-secret
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 256Mi
      sync-notify-outbox:
        type: cronjob
        pod:
          restartPolicy: Never
        cronjob:
          schedule: "*/13 * * * *"
          backoffLimit: 1
          concurrencyPolicy: Forbid
          failedJobsHistory: 2
          successfulJobsHistory: 1
        containers:
          main:
            image: *mainImage
            command:
              - tsx
              - /sync/src/scripts/sync.ts
              - --mode=notify-outbox
            envFrom:
              - secretRef:
                  name: haynesnetwork-secret
              - secretRef:
                  name: haynesnetwork-webhook
                  optional: true
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
      # SMART alert detection every 15 min (PLAN-019 / ADR-040 / DESIGN-020): evaluates
      # smartctl series in Prometheus against the persisted smart_drive_state baseline and
      # enqueues notification_outbox rows ONLY on critical transitions (owner ruling: FAIL flip,
      # media_errors 0->n, spare threshold, new critical_warning bits, critical-pool wear 80/90).
      # Baseline was established manually 2026-07-10 (3 validated runs) so this won't flood.
      sync-smart-alerts:
        type: cronjob
        pod:
          restartPolicy: Never
        cronjob:
          schedule: "9,24,39,54 * * * *"
          backoffLimit: 1
          concurrencyPolicy: Forbid
          failedJobsHistory: 2
          successfulJobsHistory: 1
        containers:
          main:
            image: *mainImage
            command:
              - tsx
              - /sync/src/scripts/sync.ts
              - --mode=smart-alerts
            envFrom:
              - secretRef:
                  name: haynesnetwork-secret
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
      # MAM compliance governor every 15 min (PLAN-039 / ADR-054 / DESIGN-027): counts UNSATISFIED
      # torrents locally in qBittorrent (books-mam: still-downloading + complete-but-<72h-seeded —
      # zero MAM API surface, no qB credential) and, near the rank cap (unsatisfied >=
      # MAM_UNSATISFIED_LIMIT − MAM_UNSATISFIED_BUFFER, set 200/100 → pause at 100, resume-floor 60), toggles the
      # MyAnonaMouse Prowlarr indexer's enable flag (Prowlarr's fullSync LL application propagates
      # it to LazyLibrarian — verified live; usenet keeps flowing). Fail-closed on a count failure.
      # Upserts the single-row mam_gate_state + enqueues a transition / >48h-stuck Pushover row
      # same-tx (drained by sync-notify-outbox). No sync_runs row (smart-alerts shape). Needs
      # PROWLARR_API_KEY (+ DATABASE_URL) from haynesnetwork-secret; URLs + indexer id (17) default
      # in code. Owner bumps MAM_UNSATISFIED_LIMIT at each MAM rank promotion (PLAN-040 makes it an
      # admin setting). Minute offsets (4,19,34,49) avoid every other sync job's schedule.
      sync-mam-governor:
        type: cronjob
        pod:
          restartPolicy: Never
        cronjob:
          schedule: "4,19,34,49 * * * *"
          backoffLimit: 1
          concurrencyPolicy: Forbid
          failedJobsHistory: 2
          successfulJobsHistory: 1
        containers:
          main:
            image: *mainImage
            command:
              - tsx
              - /sync/src/scripts/sync.ts
              - --mode=mam-governor
            env:
              # MAM rank Elite VIP: unsatisfied limit 200 (confirmed 2026-07-17 from the MAM Client
              # Summary; OPS-013 §10.1 tier table documents Elite VIP = 200). v0.90.0 adds resume
              # hysteresis to the governor, so the toggle is no longer a single edge:
              #   pause threshold = limit − buffer  = 100
              #   resume floor    = MAM_RESUME_FLOOR = 60   (EXPLICIT — see below)
              #   dead band 60 to 99 holds the current gate state (no flip either way)
              #
              # BUFFER 50 → 100 + AN EXPLICIT RESUME FLOOR (2026-07-26, owner-directed after the burst was
              # MEASURED). History: the margin was sized on "worst burst +17", then widened to 50 after a
              # +58, on the hypothesis that +58 was a backlog artifact of the multi-day freeze. That
              # hypothesis was FALSE. The next reopen was ordinary (no freeze, backlog drained) and burst
              # HARDER — 17:49 UTC, unsatisfied 102 → 186: **+84 in one 15-minute interval**. It paused
              # correctly at 186, but only because the burst happened to start at 102; the same burst
              # starting near the 150 edge lands near 234, past the hard 200 cap.
              #
              # The sampling invariant is `pause_edge + worst_burst < limit`. At +84 that needs an edge
              # ≤ 116, so the edge moves to 100 — 100 of headroom against the measured +84, a margin of 16
              # for the growth trend (17 → 58 → 84). Worst case from the floor: reopen at 59, +84 → 143,
              # still far under the cap.
              #
              # MAM_RESUME_FLOOR is REQUIRED here, not decoration: the derived floor is limit − 2×buffer,
              # which at buffer 100 is 0 — and a floor of 0 can never be satisfied (`unsatisfied < 0`), so
              # the gate would wedge shut permanently. ADR-077 C-03 exists for exactly this; the override
              # is validated 0 ≤ floor < threshold (60 < 100 ✓).
              #
              # COST, stated plainly: pausing at 100 of a 200 cap spends only ~50% of the rank allowance,
              # so MAM throughput is materially lower than the tier permits. That is the deliberate trade —
              # a violation costs a multi-day download block, and bursts have grown every time we measured.
              # Retune DOWNWARD only against further measured bursts, never on a quiet window.
              # Governor design:
              # https://github.com/thaynes43/haynesnetwork/blob/main/docs/adrs/077-mam-governor-resume-hysteresis.md
              MAM_UNSATISFIED_LIMIT: "200"
              MAM_UNSATISFIED_BUFFER: "100"
              MAM_RESUME_FLOOR: "60"
            envFrom:
              - secretRef:
                  name: haynesnetwork-secret
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
      # Peloton poster guard (ADR-043 / DESIGN-021 / OPS-010 — PLAN-024): re-applies the durable
      # Peloton override posters (baked into the image at /sync/assets/peloton-posters) to the k8plex
      # HOps Peloton shows/seasons whenever they drift from a ytdl-sub re-download / Plex re-scan.
      # Re-applies ONLY drifted targets (compares the live Plex thumb to the baseline recorded in the
      # append-only poster_guard_applications ledger) and writes an audit row per re-apply; never
      # destructive (Plex keeps prior art in the item gallery). No sync_runs row (smart-alerts shape).
      # Bounded (~14 reads + drift-gated writes); needs PLEX_HAYNESKUBE_TOKEN + DATABASE_URL (both in
      # haynesnetwork-secret). First run after deploy re-applies all mapped targets once (idempotent).
      sync-poster-guard:
        type: cronjob
        pod:
          restartPolicy: Never
        cronjob:
          schedule: "37 * * * *"
          backoffLimit: 1
          concurrencyPolicy: Forbid
          failedJobsHistory: 2
          successfulJobsHistory: 1
        containers:
          main:
            image: *mainImage
            command:
              - tsx
              - /sync/src/scripts/sync.ts
              - --mode=poster-guard
            envFrom:
              - secretRef:
                  name: haynesnetwork-secret
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
      # AI usage sync (ADR-044 / DESIGN-022 — PLAN-021): polls Open WebUI's admin API READ-ONLY
      # (GET /api/v1/chats/all/db + /api/v1/users/) and UPSERTS the ai_usage_chats mirror the Metrics
      # AI sub-tab reads. Never mutates Open WebUI. No sync_runs row (smart-alerts shape). Needs
      # OPENWEBUI_API_KEY (+ DATABASE_URL) from haynesnetwork-secret; OPENWEBUI_URL defaults to the
      # in-cluster service DNS (open-webui.ai.svc.cluster.local). Bounded (2 GETs + a batch upsert).
      sync-ai-usage:
        type: cronjob
        pod:
          restartPolicy: Never
        cronjob:
          schedule: "12 * * * *"
          backoffLimit: 1
          concurrencyPolicy: Forbid
          failedJobsHistory: 2
          successfulJobsHistory: 1
        containers:
          main:
            image: *mainImage
            command:
              - tsx
              - /sync/src/scripts/sync.ts
              - --mode=ai-usage-sync
            envFrom:
              - secretRef:
                  name: haynesnetwork-secret
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
      # PLAN-026 (ADR-045 / DESIGN-023) — the authentik-users directory read sync: pages the Authentik
      # users/groups API (read-only) and upserts the authentik_users mirror the /admin/users portal reads.
      # Every 20 min (the directory changes slowly; the portal also refreshes on demand + re-reads on write).
      sync-authentik-users:
        type: cronjob
        pod:
          restartPolicy: Never
        cronjob:
          schedule: "7,27,47 * * * *"
          backoffLimit: 1
          concurrencyPolicy: Forbid
          failedJobsHistory: 2
          successfulJobsHistory: 1
        containers:
          main:
            image: *mainImage
            command:
              - tsx
              - /sync/src/scripts/sync.ts
              - --mode=authentik-users
            envFrom:
              - secretRef:
                  name: haynesnetwork-secret
              # The hnet-portal service-account token (AUTHENTIK_API_TOKEN); AUTHENTIK_URL defaults in
              # code to the in-cluster Service DNS. Optional so the job can be created before the secret.
              - secretRef:
                  name: haynesnetwork-authentik-token
                  optional: true
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
      # Books sync (ADR-046 / DESIGN-024 — PLAN-023): pages Kavita (Books+Comics) + Audiobookshelf
      # (Audio Books) READ-ONLY and UPSERTS the books_items ledger the Library Books/Audiobooks/Comics
      # walls read; tombstones vanished rows. Never mutates the book servers. No sync_runs row (ai-usage
      # shape). Needs KAVITA_PASSWORD + AUDIOBOOKSHELF_PASSWORD (+ DATABASE_URL) from haynesnetwork-secret;
      # URLs default in code to the in-cluster service DNS. Bounded (paged lists + a batch upsert).
      sync-books:
        type: cronjob
        pod:
          restartPolicy: Never
        cronjob:
          schedule: "22 * * * *"
          backoffLimit: 1
          concurrencyPolicy: Forbid
          failedJobsHistory: 2
          successfulJobsHistory: 1
        containers:
          main:
            image: *mainImage
            command:
              - tsx
              - /sync/src/scripts/sync.ts
              - --mode=books-sync
            envFrom:
              - secretRef:
                  name: haynesnetwork-secret
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
      # Goodreads shelf sync (ADR-055 / DESIGN-028 — PLAN-044): polls linked users' PUBLIC Goodreads
      # shelf RSS, mirrors shelf items, matches against books_items, mints per-format book requests
      # (comics parked unroutable), pushes wants to LazyLibrarian (addBook→queueBook→searchBook, paced,
      # GB enrichment with retry/backoff) and reconciles LL statuses back. NEVER touches LL provider
      # config (Prowlarr fullSync owns it) or MAM/qBittorrent (governor territory). Needs
      # LAZYLIBRARIAN_API_KEY + GOOGLE_BOOKS_API_KEY (+ DATABASE_URL) from haynesnetwork-secret;
      # URLs default in code to the in-cluster service DNS. No sync_runs row (books-sync shape).
      sync-goodreads:
        type: cronjob
        pod:
          restartPolicy: Never
        cronjob:
          schedule: "41 * * * *"
          backoffLimit: 1
          concurrencyPolicy: Forbid
          failedJobsHistory: 2
          successfulJobsHistory: 1
        containers:
          main:
            image: *mainImage
            command:
              - tsx
              - /sync/src/scripts/sync.ts
              - --mode=goodreads-sync
            env:
              # GB daily call budget (see the app container comment). Enforces goodreads
              # enrichment + the book-fix retry pass; app now owns its own ~1,000/day GB key.
              GB_DAILY_CALL_BUDGET_PAIRING: "700"
              GB_DAILY_CALL_BUDGET_GOODREADS: "200"
              GB_DAILY_CALL_BUDGET_BOOKFIX: "100"
            envFrom:
              - secretRef:
                  name: haynesnetwork-secret
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
      # Plex match (ADR-047 / DESIGN-025 — PLAN-028): resolves each *arr ledger media_item to its exact
      # Plex {library, ratingKey} by shared GUID (tmdb/imdb/tvdb/musicbrainz) and UPSERTS the
      # media_plex_matches cache — the Library access gate + "Watch on Plex" deep-link substrate.
      # READ-ONLY against Plex + the DB (no *arr call, never writes to Plex); reconciles titles a
      # fully-read library no longer serves. No sync_runs row (books-sync shape). Needs the three
      # PLEX_*_TOKENs (+ DATABASE_URL) from haynesnetwork-secret; URLs default in code.
      sync-plex-match:
        type: cronjob
        pod:
          restartPolicy: Never
        cronjob:
          schedule: "52 * * * *"
          backoffLimit: 1
          concurrencyPolicy: Forbid
          failedJobsHistory: 2
          successfulJobsHistory: 1
        containers:
          main:
            image: *mainImage
            command:
              - tsx
              - /sync/src/scripts/sync.ts
              - --mode=plex-match
            envFrom:
              - secretRef:
                  name: haynesnetwork-secret
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
      # PLAN-051 / ADR-066 — mirrors Kavita collections + reading lists and ABS collections
      # into the books_collections read-model. Runs at :27, after sync-books (:22), so the
      # membership resolution has a fresh books_items mirror. Standalone mode, no sync_runs row.
      sync-books-collections:
        type: cronjob
        pod:
          restartPolicy: Never
        cronjob:
          schedule: "27 * * * *"
          backoffLimit: 1
          concurrencyPolicy: Forbid
          failedJobsHistory: 2
          successfulJobsHistory: 1
        containers:
          main:
            image: *mainImage
            command:
              - tsx
              - /sync/src/scripts/sync.ts
              - --mode=books-collections-sync
            envFrom:
              - secretRef:
                  name: haynesnetwork-secret
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
      # PLAN-050 / ADR-065 — book/audiobook format pairing: rebuilds the books_format_pairs
      # cache from the books_items mirror, then auto-mints missing-format wants PACED at 25/run
      # (owner ruling: estate-wide, digested over days). Runs at :32, after sync-books (:22).
      sync-format-pairing:
        type: cronjob
        pod:
          restartPolicy: Never
        cronjob:
          schedule: "32 * * * *"
          backoffLimit: 1
          concurrencyPolicy: Forbid
          failedJobsHistory: 2
          successfulJobsHistory: 1
        containers:
          main:
            image: *mainImage
            command:
              - tsx
              - /sync/src/scripts/sync.ts
              - --mode=format-pairing
            env:
              # GB daily call budget (see the app container comment). The pairing resolve drains
              # the ~216-book cohort; at 700 legs/day on the app's own key it clears in ~1 day.
              GB_DAILY_CALL_BUDGET_PAIRING: "700"
              GB_DAILY_CALL_BUDGET_GOODREADS: "200"
              GB_DAILY_CALL_BUDGET_BOOKFIX: "100"
              # Owner ruling 2026-07-21 (revisits the R1a 25/run lean): 1,097 unpaired works still
              # await their first mint — at 25/run the backlog takes weeks. 100/run drains it in
              # days; the GB call budget above + the breaker still cap actual resolve spend, so an
              # over-budget mint lands honestly unmintable and retries.
              PAIRING_MINT_CAP_PER_RUN: "100"
            envFrom:
              - secretRef:
                  name: haynesnetwork-secret
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
      # PLAN-037 / ADR-064 — mirrors the HOps Plex server's collections (movies+TV, charts
      # included) into the plex_collections read-model. Runs at :57, right after sync-plex-match
      # (:52) so membership resolution always has fresh ratingKey matches. Standalone mode —
      # writes no sync_runs row; its trail is the mirror tables.
      sync-collections:
        type: cronjob
        pod:
          restartPolicy: Never
        cronjob:
          schedule: "57 * * * *"
          backoffLimit: 1
          concurrencyPolicy: Forbid
          failedJobsHistory: 2
          successfulJobsHistory: 1
        containers:
          main:
            image: *mainImage
            command:
              - tsx
              - /sync/src/scripts/sync.ts
              - --mode=collections-sync
            envFrom:
              - secretRef:
                  name: haynesnetwork-secret
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
      # Space-policy propose-only sweep (DESIGN-014 D-08 / ADR-031): reads *arr /diskspace +
      # Maintainerr, proposes leaving_soon batches when an array is over target. No-op unless
      # space_policy.enabled; writes no sync_runs row. Shipped suspended — owner arms it by
      # unsuspending once the first run is validated.
      sync-space-policy:
        type: cronjob
        pod:
          restartPolicy: Never
        cronjob:
          schedule: "17 * * * *"
          suspend: false
          backoffLimit: 1
          concurrencyPolicy: Forbid
          failedJobsHistory: 2
          successfulJobsHistory: 1
        containers:
          main:
            image: *mainImage
            command:
              - tsx
              - /sync/src/scripts/sync.ts
              - --mode=space-policy
            envFrom:
              - secretRef:
                  name: haynesnetwork-secret
              - secretRef:
                  name: haynesnetwork-webhook
                  optional: true
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
      # Full reconcile nightly: upserts everything + tombstones (guarded).
      sync-full:
        type: cronjob
        pod:
          restartPolicy: Never
        cronjob:
          schedule: "30 4 * * *"
          backoffLimit: 1
          concurrencyPolicy: Forbid
          failedJobsHistory: 2
          successfulJobsHistory: 1
        containers:
          main:
            image: *mainImage
            command:
              - tsx
              - /sync/src/scripts/sync.ts
              - --mode=full
            envFrom:
              - secretRef:
                  name: haynesnetwork-secret
              - secretRef:
                  name: haynesnetwork-webhook
                  optional: true
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 3000
