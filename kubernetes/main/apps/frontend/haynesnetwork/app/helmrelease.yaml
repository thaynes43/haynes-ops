---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app haynesnetwork
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # 1. Create the app's database + role inside cluster16 if missing.
          #    Idempotent; same pattern as todos-for-dues/authentik/paperless.
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18.4"
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: haynesnetwork-secret
              - secretRef:
                  name: haynesnetwork-webhook
                  optional: true
          # 2. Apply Drizzle migrations (+ idempotent app_catalog seed) from
          #    the flattened migrator subtree baked into the app image.
          migrate:
            image: &mainImage
              repository: ghcr.io/thaynes43/haynesnetwork
              tag: v0.13.0
              pullPolicy: IfNotPresent
            command:
              - tsx
              - /migrator/src/scripts/migrate.ts
            envFrom:
              - secretRef:
                  name: haynesnetwork-secret
              - secretRef:
                  name: haynesnetwork-webhook
                  optional: true
        containers:
          app:
            image: *mainImage
            env:
              NODE_ENV: production
              PORT: "3000"
              HOSTNAME: "0.0.0.0"
              # No IPv6 egress in this cluster; Authentik's public endpoints
              # (Cloudflare) return AAAA + A. Same undici Happy-Eyeballs
              # timeout todos-for-dues hit with Google OIDC — force IPv4.
              NODE_OPTIONS: --dns-result-order=ipv4first
            envFrom:
              - secretRef:
                  name: haynesnetwork-secret
              - secretRef:
                  name: haynesnetwork-webhook
                  optional: true
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 24
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
      # Ledger sync (DESIGN-005 D-14): same image, flattened /sync subtree.
      # Incremental = *arr history cursors + Seerr requests, cheap and frequent.
      sync-incremental:
        type: cronjob
        pod:
          restartPolicy: Never
        cronjob:
          schedule: "*/15 * * * *"
          backoffLimit: 1
          concurrencyPolicy: Forbid
          failedJobsHistory: 2
          successfulJobsHistory: 1
        containers:
          main:
            image: *mainImage
            command:
              - tsx
              - /sync/src/scripts/sync.ts
              - --mode=incremental
            envFrom:
              - secretRef:
                  name: haynesnetwork-secret
              - secretRef:
                  name: haynesnetwork-webhook
                  optional: true
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
      # Metadata harvest every 6h (PLAN-004 / ADR-018): *arr ratings/genres/posters,
      # Tautulli watch-stats, TMDB/TVDB fallback for tombstones — per-source degradation.
      sync-metadata:
        type: cronjob
        pod:
          restartPolicy: Never
        cronjob:
          schedule: "15 */6 * * *"
          backoffLimit: 1
          concurrencyPolicy: Forbid
          failedJobsHistory: 2
          successfulJobsHistory: 1
        containers:
          main:
            image: *mainImage
            command:
              - tsx
              - /sync/src/scripts/sync.ts
              - --mode=metadata-refresh
            envFrom:
              - secretRef:
                  name: haynesnetwork-secret
              - secretRef:
                  name: haynesnetwork-webhook
                  optional: true
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 768Mi
      # Trash-batch sweep hourly (PLAN-012 / ADR-025): expires leaving_soon batches whose
      # window closed — per-item guarded deletes (SAFE audit + guardian + live exclusions
      # re-run at sweep time). Only greenlit/gate-skipped batches can ever reach this path.
      sync-trash-batch-sweep:
        type: cronjob
        pod:
          restartPolicy: Never
        cronjob:
          schedule: "45 * * * *"
          backoffLimit: 1
          concurrencyPolicy: Forbid
          failedJobsHistory: 2
          successfulJobsHistory: 1
        containers:
          main:
            image: *mainImage
            command:
              - tsx
              - /sync/src/scripts/sync.ts
              - --mode=trash-batch-sweep
            envFrom:
              - secretRef:
                  name: haynesnetwork-secret
              - secretRef:
                  name: haynesnetwork-webhook
                  optional: true
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
      # Full reconcile nightly: upserts everything + tombstones (guarded).
      sync-full:
        type: cronjob
        pod:
          restartPolicy: Never
        cronjob:
          schedule: "30 4 * * *"
          backoffLimit: 1
          concurrencyPolicy: Forbid
          failedJobsHistory: 2
          successfulJobsHistory: 1
        containers:
          main:
            image: *mainImage
            command:
              - tsx
              - /sync/src/scripts/sync.ts
              - --mode=full
            envFrom:
              - secretRef:
                  name: haynesnetwork-secret
              - secretRef:
                  name: haynesnetwork-webhook
                  optional: true
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 3000
