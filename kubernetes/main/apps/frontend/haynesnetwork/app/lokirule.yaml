---
# Loki ruler alerts for haynesnetwork (loaded by the Loki sidecar via the
# loki_rule ConfigMap label — see kustomization.yaml; `rules.searchNamespace: ALL`
# in the loki HelmRelease means this namespace is in scope). Container names: the
# web Deployment's container is `app`, every sync CronJob's is `main`.
# Routing: severity=critical is the only Alertmanager route that reaches a human
# (everything else goes to `null` and is visible in the Alertmanager/Grafana UI
# only). A wedged MAM gate is a compliance hazard, so it pages. Of the MCP
# connector auth alerts, McpConnectorRefreshReuseDetected is critical (a replayed
# refresh token may be a stolen one, so it pages) and McpConnectorAuthRejectionBurst
# is a warning (the rate limits already contain it). Of the watchlist-protection
# alerts, TrashSweepPaused and ReleaseBlockReaddSameRelease are critical (reclaim
# stalled; a deleted release came back) and WatchlistAccountUnreadable and
# WatchlistRegistryRunsFailing are warnings (notices that come before a page).
groups:
  - name: haynesnetwork-mam-governor
    rules:
      - alert: MamGovernorActuationFailing
        # The sync-mam-governor CronJob runs at :04/:19/:34/:49. When its PUT to
        # the MyAnonaMouse Prowlarr indexer is rejected the tick records an
        # `actuationError` field and the gate does not move.
        #
        # A failing tick logs that field TWICE — once on `"msg":"mam-governor
        # evaluated"` and again in the `mamGovernor` object of `"msg":"sync
        # finished"` — so the second line filter pins the match to one line per
        # tick and the count IS the tick count (verified live 2026-09-22:
        # unfiltered = 6 over the same 50m window, filtered = 3). A 50m window
        # spans 3-4 ticks, so >= 3 means three consecutive failed actuations
        # rather than a single transient Prowlarr blip.
        #
        # Why this exists: from at least 2026-09-15 until 2026-09-22 04:19Z
        # EVERY tick failed with `PUT /api/v1/indexer/17 ... (HTTP 400)` —
        # Prowlarr's save-time validation rejected the write while the MAM
        # cookie was dead — and nothing alerted for a week. It happened to be
        # stuck while the gate wanted to OPEN, which is the harmless direction;
        # the same failure blocks the PAUSE, and an unsatisfied count past the
        # rank cap costs a 24h MAM download block.
        expr: |
          sum by (app) (count_over_time({app="haynesnetwork", container="main"} |= "actuationError" |= "mam-governor evaluated" [50m])) >= 3
        for: 5m
        annotations:
          summary: >-
            The MAM compliance governor cannot actuate the MyAnonaMouse Prowlarr indexer — three or
            more consecutive 15-minute ticks logged an actuationError, so the gate is frozen in
            whatever state it is already in and can no longer pause downloads near the unsatisfied
            cap (a breach costs a 24h MAM download block). Fix: check that Prowlarr accepts a PUT on
            indexer 17 (`/api/v1/indexer/17`) — an HTTP 400 there is save-time validation, and the
            usual cause is a dead MAM `mam_id` cookie on the MyAnonaMouse indexer. Recreate the
            ASN-locked `prowlarr` session at MAM (Security → create a session, locked to the home
            Comcast ASN), store it as MAM_ID_PROWLARR in 1Password item `myanonamouse`, and load it
            into Prowlarr's MyAnonaMouse indexer.
        labels:
          severity: critical
  - name: haynesnetwork-mcp-connector
    # The public MCP connector surface (the in-app OAuth server behind
    # https://haynesnetwork.com/mcp; haynesnetwork repo,
    # docs/designs/050-mcp-public-connector.md) logs one `[auth] <event> {…}` line
    # per OAuth step from the web pods, with masked fingerprints and never a
    # token. Same logger shape as cigar-journal's, whose live lines these filters
    # were checked against.
    rules:
      - alert: McpConnectorRefreshReuseDetected
        # A refresh token that was already rotated (or revoked) was presented
        # again. The app revokes that whole refresh family on the spot, so the
        # connector has to be re-authorized; the alert is the audit trail. One
        # event is enough: a benign retry race is rare, a replayed stolen token
        # looks exactly like this. The 10m window keeps it visible ~10 minutes.
        expr: |
          sum by (app) (count_over_time({app="haynesnetwork", container="app"} |= "[auth] refresh_reuse_detected" [10m])) > 0
        for: 0m
        annotations:
          summary: >-
            haynesnetwork's MCP connector saw a refresh token replayed, and revoked that token
            family. Check the `[auth] refresh_reuse_detected` line in Loki for the client id, then
            the Connected apps page (https://haynesnetwork.com/settings/connections). If the
            client is not one you use, disconnect it there; if it is, reconnect it.
        labels:
          severity: critical
      - alert: McpConnectorAuthRejectionBurst
        # More than 20 refused authorization requests or rate-limit hits in 10
        # minutes: someone is probing /oauth/authorize, /oauth/register or
        # /oauth/token, or a client is stuck in a retry loop. The per-IP rate
        # limits already contain it; this surfaces it.
        expr: |
          sum by (app) (count_over_time({app="haynesnetwork", container="app"} |~ `\[auth\] (authorize_rejected|rate_limited)\b` [10m])) > 20
        for: 0m
        annotations:
          summary: >-
            haynesnetwork's MCP connector refused more than 20 authorization requests or
            rate-limited callers in the last 10 minutes. Check the `[auth] authorize_rejected` and
            `[auth] rate_limited` lines in Loki for the client and reason; a single client id
            usually means a stuck connector, many means probing.
        labels:
          severity: warning
  - name: haynesnetwork-watchlist-protection
    # Watchlist protection (v0.101.0): the Watchlist Registry CronJob, the Trash
    # sweep's gate and its Release Block. Every line is one JSON object per line
    # (`{"level":…,"time":…,"msg":"[area] event",…fields}`) and never carries a
    # token, a username or a person's titles; accounts appear only as `acct:<8 hex>`.
    # Each alert links its section of the runbook,
    # https://github.com/thaynes43/haynesnetwork/blob/main/docs/ops/017-watchlist-protection.md
    # The two pages are critical (the only route that reaches a human); the two
    # notices are warnings (Alertmanager / Grafana UI only).
    rules:
      - alert: TrashSweepPaused
        # A scheduled sweep (the sync-trash-batch-sweep CronJob, hourly at :45) with
        # a batch due logs `[trash] sweep_paused {reason, step, pausedForH}` on every
        # run while reclaim is paused, whatever the reason (`gate`,
        # `release_block`, `audit_unsafe`, `arr`). Only the scheduled path carries
        # a number in pausedForH (the web Expire now logs null), hence container
        # `main`. The 90m window spans the hourly runs, so the alert holds while
        # the pause lasts and clears about 30 minutes after the next ok sweep.
        expr: |
          sum by (app, reason, step) (count_over_time({app="haynesnetwork", container="main"} |= "[trash] sweep_paused" | json | pausedForH >= 6 [90m])) > 0
        for: 0m
        annotations:
          summary: >-
            haynesnetwork's Trash sweep has been paused for 6 hours or more (reason and step in the
            labels), so nothing due has been deleted and batches wait in Leaving Soon. `gate`: the
            watchlist registry is not verified; `release_block`: the Radarr/Sonarr release profile
            could not be written or read back; `audit_unsafe`: the Maintainerr safety audit failed;
            `arr`: Maintainerr, Radarr or Sonarr is not answering. Remedy per reason and step:
            https://github.com/thaynes43/haynesnetwork/blob/main/docs/ops/017-watchlist-protection.md#3-sweep_paused-pages-6-hours-or-more-any-reason
          runbook_url: https://github.com/thaynes43/haynesnetwork/blob/main/docs/ops/017-watchlist-protection.md#3-sweep_paused-pages-6-hours-or-more-any-reason
        labels:
          severity: critical
      - alert: ReleaseBlockReaddSameRelease
        # The sweep's hourly re-add check logs `[release-block] readd {arrKind,
        # recordId, title, grabs, sameRelease}` once per verdict; at error level
        # with `sameRelease: true` a title deleted from Trash came back and grabbed
        # the very release the Release Block should have rejected. Logged once per
        # record, so the 24h window keeps it firing for a day (one page, one
        # 12h repeat). Any container: a breach must page wherever it is logged.
        # `title` is a title in our own library, never a person's watchlist.
        expr: |
          sum by (app, arrKind, title) (count_over_time({app="haynesnetwork"} |= "[release-block] readd" |= `"sameRelease":true` | json [24h])) > 0
        for: 0m
        annotations:
          summary: >-
            A title deleted from haynesnetwork's Trash was re-added and grabbed the same release the
            Release Block should have rejected (title and Radarr/Sonarr in the labels). Compare the
            grab's release name in the *arr history with the record's blocked term, and blocklist
            the grab by hand:
            https://github.com/thaynes43/haynesnetwork/blob/main/docs/ops/017-watchlist-protection.md#4-the-readd-page-samereleasetrue
          runbook_url: https://github.com/thaynes43/haynesnetwork/blob/main/docs/ops/017-watchlist-protection.md#4-the-readd-page-samereleasetrue
        labels:
          severity: critical
      - alert: WatchlistAccountUnreadable
        # `[watchlist-registry] account_unreadable {class, source, acct,
        # failingSinceH}` is logged once when one account's source (`community` or
        # `seerr`) has failed for 72 hours or went hidden: it is frozen, its last
        # titles still protect, but it no longer blocks the gate. Coverage lost,
        # not safety, so a notice. Registry runs happen in the registry and sweep
        # CronJobs only (container `main`); the 24h window keeps it visible a day.
        expr: |
          sum by (app, class, source, acct) (count_over_time({app="haynesnetwork", container="main"} |= "[watchlist-registry] account_unreadable" | json [24h])) > 0
        for: 0m
        annotations:
          summary: >-
            haynesnetwork's watchlist registry stopped reading one account's watchlist (class,
            source and acct tag in the labels). Its last-read titles still protect, but newer
            additions are not seen. Tell the cause from the same acct's earlier account_failed
            lines:
            https://github.com/thaynes43/haynesnetwork/blob/main/docs/ops/017-watchlist-protection.md#5-the-account_unreadable-notice-once-per-source
          runbook_url: https://github.com/thaynes43/haynesnetwork/blob/main/docs/ops/017-watchlist-protection.md#5-the-account_unreadable-notice-once-per-source
        labels:
          severity: warning
      - alert: WatchlistRegistryRunsFailing
        # The sync-watchlist-registry CronJob (:14/:29/:44/:59) logs
        # `[watchlist-registry] run_failed {trigger, failure}` for a whole failed
        # run and still exits 0, so only this alert says so. Eight scheduled
        # failures (2 hours) with no `run_complete` in the same window means eight
        # in a row. The window is 2h10m so a slow pod start cannot drop the oldest
        # of the eight before the newest lands; the sweep's inline refreshes
        # (trigger `sweep`) are not counted. A `busy` skip is neither, so it can
        # only delay this, never fire it. It notifies before the gate's own pause
        # reaches the 6-hour TrashSweepPaused page.
        expr: |
          (sum by (app) (count_over_time({app="haynesnetwork", container="main"} |= "[watchlist-registry] run_failed" |= `"trigger":"schedule"` [2h10m])) >= 8)
          unless
          (sum by (app) (count_over_time({app="haynesnetwork", container="main"} |= "[watchlist-registry] run_complete" [2h10m])) > 0)
        for: 0m
        annotations:
          summary: >-
            haynesnetwork's watchlist registry has failed 8 scheduled runs in a row (2 hours), so
            no watchlist has been re-read since; the Trash sweep's gate closes once the newest ok
            run is 30 minutes old, and TrashSweepPaused pages at 6 hours. The run_failed line's
            `failure` names what failed (roster, owner, owner_truncated, error):
            https://github.com/thaynes43/haynesnetwork/blob/main/docs/ops/017-watchlist-protection.md#6-the-run_failed-streak-8-runs-in-a-row-2-hours
          runbook_url: https://github.com/thaynes43/haynesnetwork/blob/main/docs/ops/017-watchlist-protection.md#6-the-run_failed-streak-8-runs-in-a-row-2-hours
        labels:
          severity: warning
