---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app haynesnetwork-mcp-hop
  namespace: &namespace frontend
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    # The consumer token Secret is generated by the haynesnetwork app (mcp-consumer.yaml).
    - name: haynesnetwork
      namespace: frontend
  path: ./kubernetes/main/apps/frontend/haynesnetwork-mcp-hop/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  wait: true
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
