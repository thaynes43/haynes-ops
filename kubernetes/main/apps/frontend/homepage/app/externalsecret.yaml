---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: homepage-secret
    template:
      engineVersion: v2
      data:
        # Immich
        HOMEPAGE_VAR_IMMICH_API_KEY: "{{ .IMMICH_API_KEY }}"
        # Home Assistant
        HOMEPAGE_VAR_HOMEASSISTANT_KEY: "{{ .HOME_ASSISTANT_API_KEY }}"
        # Paperless-ngx (Homepage widget supports username/password)
        HOMEPAGE_VAR_PAPERLESS_USERNAME: "{{ .ADMIN_USER }}"
        HOMEPAGE_VAR_PAPERLESS_PASSWORD: "{{ .ADMIN_PASS }}"
        # https://k8plex.haynesnetwork.com
        HOMEPAGE_VAR_HAYNESKUBE_PLEX_API_KEY: "{{ .HAYNESKUBE_PLEX_API_KEY }}"
        # https://plex.haynesnetwork.com
        HOMEPAGE_VAR_HAYNESTOWER_PLEX_API_KEY: "{{ .HAYNESTOWER_PLEX_API_KEY }}"
        # https://plexops.haynesnetwork.com (fetched via data:, not dataFrom:,
        # because the field inside the `plexops` item is also named
        # HAYNESKUBE_PLEX_API_KEY and a dataFrom merge would clobber k8plex's)
        HOMEPAGE_VAR_PLEXOPS_API_KEY: "{{ .PLEXOPS_PLEX_API_KEY }}"
        # Downloads/media stack — keys from the shared media-stack item
        HOMEPAGE_VAR_PROWLARR_API_KEY: "{{ .PROWLARR_API_KEY }}"
        HOMEPAGE_VAR_SABNZBD_API_KEY: "{{ .SABNZBD_API_KEY }}"
        HOMEPAGE_VAR_SABNZBD_FAST_API_KEY: "{{ .SABNZBD_FAST_API_KEY }}"
        HOMEPAGE_VAR_RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
        HOMEPAGE_VAR_SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
        # Grafana
        HOMEPAGE_VAR_GRAFANA_USERNAME: "{{ .GRAFANA_USERNAME }}"
        HOMEPAGE_VAR_GRAFANA_PASSWORD: "{{ .GRAFANA_PASSWORD }}"
        # Authentik
        HOMEPAGE_VAR_AUTHENTIK_API_TOKEN: "{{ .AUTHENTIK_API_TOKEN }}"
        # Traefik dashboard (basic auth)
        HOMEPAGE_VAR_TRAEFIK_USERNAME: "{{ .TRAEFIK_USERNAME }}"
        HOMEPAGE_VAR_TRAEFIK_PASSWORD: "{{ .TRAEFIK_PASSWORD }}"
        # UniFi Controller
        HOMEPAGE_VAR_UNIFI_USER: "{{ .UNIFI_USER }}"
        HOMEPAGE_VAR_UNIFI_PASSWORD: "{{ .UNIFI_PASSWORD }}"
  data:
    # plexops server token — targeted fetch (see template comment above)
    - secretKey: PLEXOPS_PLEX_API_KEY
      remoteRef:
        key: plexops
        property: HAYNESKUBE_PLEX_API_KEY
  dataFrom:
    - extract:
        key: homepage
    - extract:
        key: paperless
    # Shared media-pipeline keys (unique <APP>_API_KEY field names by
    # convention, so merges here are collision-safe).
    - extract:
        key: media-stack
