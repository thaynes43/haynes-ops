---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/notification.toolkit.fluxcd.io/provider_v1beta3.json
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: github
spec:
  type: github
  address: https://github.com/thaynes43/haynes-ops 
  secretRef:
    name: github-token-secret
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/notification.toolkit.fluxcd.io/alert_v1beta3.json
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: github
spec:
  providerRef:
    name: github
  eventSeverity: info
  # Only Kustomizations reconciled from the Git source may get a commit status.
  # A bare `name: "*"` also matched the OCI-sourced `flux` Kustomization
  # (sourceRef OCIRepository/flux-manifests, revision `v2.9.5@sha256:...`), so the
  # controller POSTed a commit status for a digest GitHub has no commit for and
  # logged `422 No commit found for SHA` on every reconcile (~10m).
  # Entries without `namespace` default to the Alert's namespace (flux-system),
  # which is where all four Git-sourced Kustomizations below live.
  eventSources:
    # Everything applied by `cluster-apps` (flux-addons, onepassword-connect, ...).
    # `matchLabels` requires `name: "*"`.
    - kind: Kustomization
      name: "*"
      matchLabels:
        kustomize.toolkit.fluxcd.io/name: cluster-apps
    # The two top-level Git-sourced Kustomizations. They are labelled
    # `kustomize.toolkit.fluxcd.io/name: cluster`, a label the OCI-sourced `flux`
    # Kustomization also carries, so they are matched by name instead.
    - kind: Kustomization
      name: cluster
    - kind: Kustomization
      name: cluster-apps
