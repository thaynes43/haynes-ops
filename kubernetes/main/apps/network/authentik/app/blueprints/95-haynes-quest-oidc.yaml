# Haynes Quest (thaynes43/haynes-quest ADR-005): OAuth2/OpenID provider plus
# application for the family game at https://quest.haynesnetwork.com.
#
# PUBLIC CLIENT, on purpose (ADR-005 D-01). Agent sessions cannot write
# 1Password, so a confidential secret could only arrive by hand. The app runs
# Better Auth 1.7.4 genericOAuth (providerId "authentik") without a client
# secret, so token-endpoint auth is `none`. PKCE S256 plus the single strict
# redirect URI below stop a third party redeeming a code. Hardening path: add
# OIDC_CLIENT_SECRET to the 1Password `haynes-quest` item, flip client_type to
# confidential, and set the app's optional QUEST_OIDC_CLIENT_SECRET.
#
#   * issuer    = https://authentik.haynesnetwork.com/application/o/haynes-quest/
#                 (fixed by the application slug; issuer_mode per_provider)
#   * redirect  = https://quest.haynesnetwork.com/api/auth/callback/authentik
#                 (better-auth >= 1.7 core callback/:id route, as cigar-journal)
#   * sub_mode  = user_uuid: an immutable key; the app keys players by
#                 (issuer, sub). Never an email- or username-derived mode
#                 (the account-takeover reasoning in 90-cigar-journal-oidc.yaml).
#   * scopes    = openid profile email. The managed profile mapping carries
#                 the `groups` claim; the app admits `family` / `authentik
#                 Admins` and gives the admin role only to `authentik Admins`.
#
# POLICY BINDINGS, deliberately, unlike 90-cigar-journal: this app shows the
# owner's children's real photos. Tom ruled on 2026-09-25 (haynes-quest
# PRD-004 Q-01) to use the Tautulli gate: `authentik Admins` OR `family`.
# The app re-checks the same groups claim at every sign-in (defence in depth).
# If someone's group membership has drifted from their haynesnetwork role, they
# are refused until it is fixed; for this app that failure is the safe one.
version: 1
metadata:
  name: haynes-quest-oidc
  labels:
    blueprints.goauthentik.io/description: 'Haynes Quest OIDC: public PKCE OAuth2/OpenID provider (sub=user_uuid, openid profile email) + application `haynes-quest` for https://quest.haynesnetwork.com, bound to authentik Admins + family (haynes-quest ADR-005).'
context: {}
entries:
- model: authentik_providers_oauth2.oauth2provider
  state: present
  identifiers:
    name: haynes-quest
  attrs:
    client_type: public
    client_id: haynes-quest
    # Required allow-list (authentik >= 2026.x defaults to [] and rejects
    # every authorize); exactly the code grant, no refresh tokens.
    grant_types:
    - authorization_code
    authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
    invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
    redirect_uris:
    - matching_mode: strict
      url: https://quest.haynesnetwork.com/api/auth/callback/authentik
      redirect_uri_type: authorization
    property_mappings:
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
    signing_key: !Find [authentik_crypto.certificatekeypair, [name, jwt-signing-key-rsa-longterm]]
    sub_mode: user_uuid
    issuer_mode: per_provider
    include_claims_in_id_token: true
    access_code_validity: minutes=1
    access_token_validity: minutes=5
    refresh_token_validity: days=30
- model: authentik_core.application
  state: present
  identifiers:
    slug: haynes-quest
  attrs:
    name: Haynes Quest
    provider: !Find [authentik_providers_oauth2.oauth2provider, [name, haynes-quest]]
    meta_launch_url: https://quest.haynesnetwork.com
    meta_description: Our family adventure game
    open_in_new_tab: true
    # "any" = member of EITHER bound group passes.
    policy_engine_mode: any
- model: authentik_policies.policybinding
  state: present
  identifiers:
    target: !Find [authentik_core.application, [slug, haynes-quest]]
    order: 0
  attrs:
    group: !Find [authentik_core.group, [name, authentik Admins]]
- model: authentik_policies.policybinding
  state: present
  identifiers:
    target: !Find [authentik_core.application, [slug, haynes-quest]]
    order: 10
  attrs:
    group: !Find [authentik_core.group, [name, family]]
