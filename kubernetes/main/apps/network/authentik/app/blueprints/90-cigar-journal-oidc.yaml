# Cigar Journal (thaynes43/cigar-journal ADR-010) — OAuth2/OpenID provider +
# application for "Continue with Authentik" at https://cigars.haynesnetwork.com.
# Pairs with haynes-ops#2679 (the app-side ExternalSecret + OIDC_DISCOVERY_URL).
#
# The first OIDC provider born as a blueprint (the six UI-created ones stay as
# they are — Q-11 in README.md is still open); the application/provider shape
# copies 50-dev-env.yaml. ADDITIVE ONLY: every entry creates a new object, the
# !Find references are read-only lookups.
#
# What the app expects (cigar-journal packages/auth/src/{auth,oidc}.ts, better-auth
# 1.7.2 genericOAuth, providerId "authentik"):
#   * issuer  = https://authentik.haynesnetwork.com/application/o/cigar-journal/
#     -> fixed by the application SLUG below (issuer_mode per_provider), and the
#     OIDC_DISCOVERY_URL in #2679 is that issuer + .well-known/openid-configuration.
#   * redirect URI, exactly: https://cigars.haynesnetwork.com/api/auth/callback/authentik
#     (better-auth >= 1.7 core `callback/:id` route; the 1.6-era
#     /oauth2/callback/ shape used by the haynesnetwork provider does NOT apply).
#   * confidential client, authorization-code grant, PKCE S256 (better-auth sends
#     code_challenge by default; Authentik enforces it whenever the client sends
#     one), scopes openid profile email.
#
# SUBJECT MODE — pinned deliberately to `user_uuid`. better-auth stores the
# id_token `sub` as account.account_id under UNIQUE(issuer, account_id) and that
# pair IS the link between an Authentik identity and a local user. Any mode
# derived from a re-assignable attribute (user_email, user_username, user_upn)
# is an account-takeover configuration: re-pointing that attribute at another
# Authentik user would sign them in as the linked cigar-journal account. The
# user's UUID is an immutable column on the user row — the "user id" in its
# opaque, non-enumerable form, and (unlike the hashed_user_id default) it does
# not change if AUTHENTIK_SECRET_KEY is ever rotated. Never email.
#
# CLIENT SECRET is deliberately NOT in this file: omitted on create, Authentik
# generates it (the 30-hnet-sources.yaml partial-update rule — an attr that is
# absent is never touched on reconcile). Read it once from the provider in the
# admin UI and store it in 1Password HaynesKube/cigar-journal as
# OIDC_CLIENT_SECRET (with OIDC_CLIENT_ID = the pinned client_id below) — the
# same "secret lives in Authentik + 1Password" arrangement as the other six
# providers. Rotation = regenerate in the UI, update the 1Password field.
#
# NO POLICY BINDINGS, on purpose. cigar-journal is a household-facing app, and
# 80-infra-admin-gate.yaml records the owner ruling that those are NOT hand-bound
# here (their grants derive from haynesnetwork's role_app_grants, reconciler
# pending). The app itself is the gate: OIDC can never create a user
# (disableSignUp) and an identity only ever attaches through an explicit,
# session-bound link from /settings (ADR-010) — an unlinked Authentik identity
# that completes this flow is bounced to /signin, nothing more.
version: 1
metadata:
  name: cigar-journal-oidc
  labels:
    blueprints.goauthentik.io/description: 'Cigar Journal OIDC: confidential OAuth2/OpenID provider (sub=user_uuid, PKCE, openid profile email) + application `cigar-journal` for https://cigars.haynesnetwork.com (cigar-journal ADR-010, haynes-ops#2679).'
context: {}
entries:
- model: authentik_providers_oauth2.oauth2provider
  state: present
  identifiers:
    name: cigar-journal
  attrs:
    client_type: confidential
    # Pinned so the id is known before the object exists (it is public — it
    # rides the authorize URL); only the secret has to be read back.
    client_id: cigar-journal
    authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
    invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
    redirect_uris:
    - matching_mode: strict
      url: https://cigars.haynesnetwork.com/api/auth/callback/authentik
      redirect_uri_type: authorization
    # The three standard OpenID scope mappings, nothing else — no proxy/
    # entitlements/API scopes for a plain web sign-in.
    property_mappings:
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
    # RS256 id_tokens via the long-term JWT key the newer providers (Kavita,
    # Audiobookshelf, Open WebUI) already sign with — not the Cloudflare origin
    # TLS cert the 2024-era ones reuse.
    signing_key: !Find [authentik_crypto.certificatekeypair, [name, jwt-signing-key-rsa-longterm]]
    sub_mode: user_uuid
    issuer_mode: per_provider
    include_claims_in_id_token: true
    # Authentik defaults, written out so a future edit is a diff, not a guess.
    # The app only uses the code exchange + userinfo at sign-in; it never
    # replays the access token afterwards.
    access_code_validity: minutes=1
    access_token_validity: minutes=5
    refresh_token_validity: days=30
- model: authentik_core.application
  state: present
  identifiers:
    slug: cigar-journal
  attrs:
    name: Cigar Journal
    provider: !Find [authentik_providers_oauth2.oauth2provider, [name, cigar-journal]]
    meta_launch_url: https://cigars.haynesnetwork.com
    meta_description: Cigar journal — inventory, smokes and ratings
    open_in_new_tab: true
    policy_engine_mode: any
