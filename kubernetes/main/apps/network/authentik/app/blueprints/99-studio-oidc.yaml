# OP432. Import the confidential client, application and access binding atomically.
version: 1
metadata:
  name: studio-oidc
  labels:
    blueprints.goauthentik.io/description: 'Haynes Studio OIDC with authentik Admins access.'
context:
  studio_oidc_client_secret: !File /run/secrets/studio-oidc/client-secret
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: studio-provider
    state: present
    identifiers:
      name: haynes-studio
    attrs:
      client_type: confidential
      client_id: haynes-studio
      # !Context's standalone representation in 2026.8.5 importer logs
      # resolves against an empty context. A direct !File here can log its value.
      client_secret: !Context studio_oidc_client_secret
      grant_types:
        - authorization_code
      jwt_federation_providers: []
      jwt_federation_sources: []
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      redirect_uris:
        - matching_mode: strict
          url: https://studio.haynesops.com/auth/callback
          redirect_uri_type: authorization
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        # Authentik 2026.8.5 includes group names in the managed profile scope.
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, jwt-signing-key-rsa-longterm]]
      sub_mode: user_uuid
      issuer_mode: per_provider
      include_claims_in_id_token: true
      access_code_validity: minutes=1
      access_token_validity: minutes=5
  - model: authentik_core.application
    id: studio-application
    state: present
    identifiers:
      slug: haynes-studio
    attrs:
      name: Haynes Studio
      provider: !KeyOf studio-provider
      policy_engine_mode: all
      meta_hide: true
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf studio-application
      order: 20
    attrs:
      # If no group resolves, the binding serializer rejects the entry.
      group: !Find [authentik_core.group, [name, authentik Admins]]
      enabled: true
      negate: false
      failure_result: false
