# PLAN-011 Phase 1 — haynesnetwork Authentik login flows (config-as-code baseline).
# DRIFT-ZERO: merged from the live /flows/instances/<slug>/export/ output for the four
# login-surface flows. Reproduces flow titles ('Sign in to haynesnetwork'), every stage,
# stage-binding order, and the flow expression policies + policy-bindings exactly as live.
# The order-30 authenticator-validation stage AND its flow-stage-binding are OWNED by
# 40-hnet-mfa.yaml (promoted 2026-07-10, PLAN-011 Phase 2) — they are intentionally absent
# here so the two blueprints never flip-flop the stage config on reconcile.
# compatibility_mode history (PLAN-042): set true 2026-07-12 (571c7a65) as the emergency
# workaround for the old-WebKit login crash; REVERTED to false 2026-07-13 after the real
# fix landed — the server pods now serve CSS-nesting-LOWERED web assets (helmrelease.yaml
# initContainers), which removes the actual crash trigger (WebKit #290102 via native CSS
# nesting, upstream goauthentik#19814). Native rendering restores Plex-first ordering.
version: 1
metadata:
  name: hnet-login-flows
  labels:
    blueprints.goauthentik.io/description: 'haynesnetwork login flows (PLAN-011): default-authentication-flow (identification→password→mfa-validation→login), default-source-authentication (Plex return, login-only), default-source-enrollment (Plex first-time), default-invalidation-flow (logout). Drift-zero reproduction incl. flow titles + stage/policy bindings.'
