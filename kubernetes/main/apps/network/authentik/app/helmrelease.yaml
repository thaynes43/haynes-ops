---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  interval: 30m
  # PLAN-042: the server pods' web-lowering initContainers (node image pull +
  # npm install + full-dist transform, rolling one pod at a time) need more
  # than the 5m default helm wait. 20m adds margin for cold image pulls on all
  # three nodes. (The 15m->20m bump also mints a fresh HelmRelease generation
  # after the exhausted-remediation rollbacks of 2026-07-13 evening.)
  timeout: 20m
  chart:
    spec:
      chart: authentik
      version: 2026.5.5
      sourceRef:
        kind: HelmRepository
        name: authentik
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      deploymentAnnotations:
        secret.reloader.stakater.com/reload: authentik-secret
        # PLAN-042: restart pods when the web-lowering script changes so the
        # initContainer re-runs it over the image's web dist.
        configmap.reloader.stakater.com/reload: authentik-web-lowering
      envFrom:
        - secretRef:
            name: authentik-secret
    # PLAN-011 Phase 1 — config-as-code baseline. The worker mounts this ConfigMap
    # (generated by app/kustomization.yaml's configMapGenerator) at
    # /blueprints/mounted/cm-authentik-hnet-blueprints and discovers its *.yaml keys.
    # These blueprints reproduce the CURRENT live brand/flows/source (drift-zero), so a
    # merge changes nothing. The drafted MFA blueprint is intentionally NOT in this
    # ConfigMap (see app/blueprints/pending/).
    blueprints:
      configMaps:
        - authentik-hnet-blueprints
    authentik:
      log_level: debug # TODO info once working
      error_reporting:
        enable: false
        send_pii: false
      outposts:
        container_image_base: ghcr.io/goauthentik/%(type)s:%(version)s
      redis:
        host: "{{ .Release.Name }}-redis-master"
        password: ""
    server:
      replicas: 3
      # PLAN-011: haynesnetwork brand assets mounted read-only so brand fields
      # can reference them as media values (e.g. hnet/logo-%(theme)s.svg).
      # PLAN-042: web-dist-lowered (emptyDir) holds a CSS-nesting-LOWERED copy of
      # the image's /web/dist, produced by the initContainers below, and is
      # mounted OVER /web/dist so the server only ever serves lowered assets.
      # Why: authentik >= 2025.12 ships native CSS nesting in flow-*.css AND in
      # esbuild-embedded JS component styles; old WebKit (iOS/iPadOS ~16.6-18.3.x,
      # macOS Safari ~17.6) crashes its renderer on StyleRuleNestedDeclarations
      # (WebKit #290102, upstream goauthentik#19814 RCA 2026-06-30). Lowering to
      # flat selectors (lightningcss, target safari >= 15) removes the crash.
      volumes:
        - name: brand-assets
          configMap:
            name: authentik-brand-assets
        - name: web-lowering-script
          configMap:
            name: authentik-web-lowering
        - name: web-dist-lowered
          emptyDir: {}
      volumeMounts:
        - name: brand-assets
          mountPath: /media/public/hnet
          readOnly: true
        - name: web-dist-lowered
          mountPath: /web/dist
      initContainers:
        - name: init-db
          image: ghcr.io/home-operations/postgres-init:18.4
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: authentik-secret
        # PLAN-042 step 1/2: copy the image's own web dist into the emptyDir.
        # The image reference is tpl-rendered by the chart (server.initContainers
        # goes through tpl) to the SAME image the server container runs, so image
        # bumps re-run this against the new dist automatically — no baked digests.
        - name: web-dist-copy
          image: '{{ default .Values.global.image.repository .Values.server.image.repository }}:{{ default (include "authentik.defaultTag" .) .Values.server.image.tag }}'
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -c]
          args:
            # cp -r, NOT -a: the container runs as the image's non-root user and
            # -a's final utimensat on the emptyDir mount root ('/lowered/.')
            # gets EPERM -> nonzero exit -> CrashLoop. Times are irrelevant here.
            - cp -r /web/dist/. /lowered/
          volumeMounts:
            - name: web-dist-lowered
              mountPath: /lowered
        # PLAN-042 step 2/2: lower native CSS nesting to flat selectors across the
        # copied dist — every *.css bundle AND the JS bundles' esbuild-embedded
        # component styles. The script exits nonzero if ANY nesting marker
        # remains (partial coverage does not fix the crash), which fails the pod
        # and leaves the previous ReplicaSet serving — a loud, safe failure.
        - name: web-dist-lower
          image: docker.io/library/node:22-bookworm-slim
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              export HOME=/tmp/tools npm_config_cache=/tmp/tools/.npm
              mkdir -p /tmp/tools && cd /tmp/tools
              cp /script/lower-css-nesting.mjs .
              for i in 1 2 3; do
                npm install --no-audit --no-fund --loglevel=error lightningcss@1.30.1 acorn@8.15.0 && break
                echo "npm install failed; retrying"; sleep 5
              done
              node lower-css-nesting.mjs /lowered
          volumeMounts:
            - name: web-dist-lowered
              mountPath: /lowered
            - name: web-lowering-script
              mountPath: /script
              readOnly: true
      metrics:
        serviceMonitor:
          enabled: true
      ingress:
        enabled: false
    worker:
       replicas: 3
    geoip:
      enabled: false
      existingSecret:
        secretName: "authentik-secret"
        accountId: "MAXMIND_ACCOUNT_ID"
        licenseKey: "MAXMIND_LICENSE_KEY"
    prometheus:
      rules:
        enabled: true
    postgresql:
      enabled: false
    redis:
      enabled: true
      persistence:
        enabled: false
      auth:
        enabled: false