---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  interval: 30m
  chart:
    spec:
      chart: authentik
      version: 2026.5.3
      sourceRef:
        kind: HelmRepository
        name: authentik
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      deploymentAnnotations:
        secret.reloader.stakater.com/reload: authentik-secret
      envFrom:
        - secretRef:
            name: authentik-secret
    # PLAN-011 Phase 1 — config-as-code baseline. The worker mounts this ConfigMap
    # (generated by app/kustomization.yaml's configMapGenerator) at
    # /blueprints/mounted/cm-authentik-hnet-blueprints and discovers its *.yaml keys.
    # These blueprints reproduce the CURRENT live brand/flows/source (drift-zero), so a
    # merge changes nothing. The drafted MFA blueprint is intentionally NOT in this
    # ConfigMap (see app/blueprints/pending/).
    blueprints:
      configMaps:
        - authentik-hnet-blueprints
    authentik:
      log_level: debug # TODO info once working
      error_reporting:
        enable: false
        send_pii: false
      outposts:
        container_image_base: ghcr.io/goauthentik/%(type)s:%(version)s
      redis:
        host: "{{ .Release.Name }}-redis-master"
        password: ""
    server:
      replicas: 3
      # PLAN-011: haynesnetwork brand assets mounted read-only so brand fields
      # can reference them as media values (e.g. hnet/logo-%(theme)s.svg).
      volumes:
        - name: brand-assets
          configMap:
            name: authentik-brand-assets
      volumeMounts:
        - name: brand-assets
          mountPath: /media/public/hnet
          readOnly: true
      initContainers:
        - name: init-db
          image: ghcr.io/home-operations/postgres-init:18.4
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: authentik-secret
      metrics:
        serviceMonitor:
          enabled: true
      ingress:
        enabled: false
    worker:
       replicas: 3
    geoip:
      enabled: false
      existingSecret:
        secretName: "authentik-secret"
        accountId: "MAXMIND_ACCOUNT_ID"
        licenseKey: "MAXMIND_LICENSE_KEY"
    prometheus:
      rules:
        enabled: true
    postgresql:
      enabled: false
    redis:
      enabled: true
      persistence:
        enabled: false
      auth:
        enabled: false