---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: studio-oidc-client
  namespace: network
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - STUDIO_OIDC_CLIENT_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: studio-oidc-client
  namespace: network
spec:
  refreshPolicy: CreatedOnce
  target:
    name: studio-oidc-client
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: studio-oidc-client
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: studio-oidc-client-reader
  namespace: network
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [studio-oidc-client]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: studio-oidc-client-reader
  namespace: network
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: studio-oidc-client-reader
subjects:
  - kind: ServiceAccount
    name: studio-oidc-client-reader
    namespace: ai
