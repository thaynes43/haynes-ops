---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../../shared/components/gatus/external
resources:
  - ./helmrepository.yaml
  - ./externalsecret.yaml
  - ./configmap.yaml
  - ./helmrelease.yaml
  - ./middleware.yaml
  - ./ingressroute.yaml
# PLAN-011 Phase 1 — Authentik config-as-code baseline blueprints, delivered as a
# ConfigMap the Helm chart mounts onto the worker at /blueprints/mounted/cm-authentik-
# hnet-blueprints (only *.yaml keys are discovered). disableNameSuffixHash keeps the
# name stable so helmrelease.yaml's blueprints.configMaps reference resolves.
#   40-hnet-mfa.yaml PROMOTED 2026-07-10 (PLAN-011 Phase 2, owner-present): native-account
#   MFA enforcement is live; it owns the order-30 validation stage + binding.
#   50-dev-env.yaml (2026-07-13, dev-env saga): forward-auth proxy provider +
#   application + dedicated outpost (ak-outpost-dev-env-outpost) for
#   dev-env.haynesops.com.
#   60-tautulli-frontdoor.yaml (DESIGN-041 D-07 / PLAN-058): forward-auth proxy
#   provider (HTTP-Basic injection) + application + admins/family group policy
#   bindings + dedicated outpost (ak-outpost-tautulli-outpost) for
#   tautulli.haynesnetwork.com.
#   70-tautulli-lan-frontdoor.yaml (DESIGN-041 D-07 / Q-08, 2026-07-20): the same
#   pattern for the TWO LAN-internal instances — two providers + applications +
#   admins-ONLY bindings + two dedicated outposts (ak-outpost-tautulli-k8plex-
#   outpost / ak-outpost-tautulli-plexops-outpost) for tautulli-k8plex.haynesops.com
#   and tautulli.haynesops.com. Internal outpost config (traefik-internal /
#   certificate-haynesops), per-app basic-auth attribute keys.
configMapGenerator:
  - name: authentik-hnet-blueprints
    options:
      disableNameSuffixHash: true
    files:
      - blueprints/10-hnet-brand.yaml
      - blueprints/20-hnet-flows.yaml
      - blueprints/30-hnet-sources.yaml
      - blueprints/40-hnet-mfa.yaml
      - blueprints/50-dev-env.yaml
      - blueprints/60-tautulli-frontdoor.yaml
      - blueprints/70-tautulli-lan-frontdoor.yaml
      - blueprints/80-infra-admin-gate.yaml
  # PLAN-042 Option A — CSS-nesting lowering of the served web assets (old-WebKit
  # login crash, upstream goauthentik#19814 / WebKit #290102). The server pod's
  # web-dist-lower initContainer (helmrelease.yaml) runs this script over a copy
  # of the image's /web/dist before the server starts serving it.
  - name: authentik-web-lowering
    options:
      disableNameSuffixHash: true
    files:
      - web-lowering/lower-css-nesting.mjs
