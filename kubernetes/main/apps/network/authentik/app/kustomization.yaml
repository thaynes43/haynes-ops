---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../../shared/components/gatus/external
resources:
  - ./helmrepository.yaml
  - ./externalsecret.yaml
  - ./configmap.yaml
  - ./helmrelease.yaml
  - ./middleware.yaml
  - ./ingressroute.yaml
# PLAN-011 Phase 1 — Authentik config-as-code baseline blueprints, delivered as a
# ConfigMap the Helm chart mounts onto the worker at /blueprints/mounted/cm-authentik-
# hnet-blueprints (only *.yaml keys are discovered). disableNameSuffixHash keeps the
# name stable so helmrelease.yaml's blueprints.configMaps reference resolves.
#   40-hnet-mfa.yaml PROMOTED 2026-07-10 (PLAN-011 Phase 2, owner-present): native-account
#   MFA enforcement is live; it owns the order-30 validation stage + binding.
configMapGenerator:
  - name: authentik-hnet-blueprints
    options:
      disableNameSuffixHash: true
    files:
      - blueprints/10-hnet-brand.yaml
      - blueprints/20-hnet-flows.yaml
      - blueprints/30-hnet-sources.yaml
      - blueprints/40-hnet-mfa.yaml
