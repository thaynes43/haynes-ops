  egress:
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: ANY
      rules:
        dns:
        - matchName: authentik-server.network.svc.cluster.local
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: network
        app.kubernetes.io/name: authentik
        app.kubernetes.io/component: server
