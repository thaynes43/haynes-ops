---
# Only the dedicated LDAP bind password. Used by the one-time stock Authentik
# provisioning command; no unrelated Authentik/Connect secret is exported.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openproject-ldap-bind
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 1h
  target:
    name: openproject-ldap-bind
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: openproject
        property: LDAP_BIND_PASSWORD
