---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# Tunnel token for the ORG-account (Sigo Alumni) tunnel `sigoalumni-homelab`
# (a8fe447a-2d7e-484a-a018-bb0afd3dcaaa) — sourced from GCP Secret Manager
# (project sigo-alumni-prod) like the rest of the sigoalumni estate, NOT from
# 1Password (that store backs the personal-account haynesnetwork tunnel only).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel-sigoalumni
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-sm-sigo
  target:
    name: cloudflare-tunnel-sigoalumni-secret
    creationPolicy: Owner
  data:
    - secretKey: TUNNEL_TOKEN
      remoteRef:
        key: homelab-tunnel-token-sigoalumni
