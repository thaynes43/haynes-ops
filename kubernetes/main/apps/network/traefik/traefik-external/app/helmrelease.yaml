apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-external
spec:
  chartRef:
    kind: OCIRepository
    name: traefik-external-oci
  interval: 15m
  timeout: 5m
  releaseName: traefik-external
  values:
    # Values https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml
    global:
      sendAnonymousUsage: false
      checkNewVersion: false

    additionalArguments:
      - "--serversTransport.insecureSkipVerify=true"
      - "--log.level=DEBUG"
      - "--serversTransport.maxIdleConnsPerHost=1000"
      - "--serversTransport.forwardingTimeouts.dialTimeout=60s"
      - "--serversTransport.forwardingTimeouts.responseHeaderTimeout=0s"
      - "--serversTransport.forwardingTimeouts.idleConnTimeout=0s"
      - "--entryPoints.websecure.transport.respondingTimeouts.idleTimeout=0s"
      - "--entryPoints.websecure.transport.respondingTimeouts.readTimeout=0s"
      - "--entryPoints.websecure.transport.respondingTimeouts.writeTimeout=0s"
      - "--entryPoints.websecure.http2.maxConcurrentStreams=1000"

    # HTTP access log -> stdout (JSON) -> promtail -> Loki. EXTERNAL ONLY.
    #
    # Why: there was no per-request record anywhere in the external path. The
    # apps behind this controller log no requests, and cloudflared at INFO
    # emitted 6 lines for ~25k requests, so a member reporting "the members
    # photos page is a roadblock" left zero evidence to triage. This is the
    # one place that sees every external request with its host, path, status
    # and timing.
    #
    # Unlike our other Proxy settings this uses the CHART's `accessLog:` keys
    # rather than raw `additionalArguments` flags: it is a ~12-key nested
    # block, and the chart's values.schema.json validates it so flux-local
    # catches a typo pre-merge. Raw flags are only checked by the Proxy binary
    # at boot -- on the controller that fronts ALL external ingress that is the
    # wrong place to find out. The chart renders these to `--accesslog.*` args
    # (see traefik-41.4.0 templates/_podtemplate.tpl).
    accessLog:
      enabled: true
      # JSON so Loki can `| json` it; the CLF default needs a regex to parse.
      format: json
      # Async writer queue depth. Bounds the memory the log path can hold and
      # keeps the request goroutine from blocking on the writer.
      bufferingSize: 100
      # addInternals stays false (chart default): no dashboard/ping/api noise.
      # No filters: 3xx MUST be logged -- the 307 to /members is the symptom
      # we are chasing, so status-code filtering would hide the evidence.
      fields:
        # keep = the standard request fields: ClientHost, ClientAddr,
        # RequestAddr, RequestHost, RequestPath, RequestMethod, RequestScheme,
        # RequestProtocol, DownstreamStatus, OriginStatus, Duration,
        # RouterName, ServiceName, ServiceAddr, RetryAttempts, TLSVersion,
        # StartUTC, ... None of them carry credentials.
        defaultMode: keep
        headers:
          # Drop EVERY request header except the four named below. This is the
          # privacy boundary: Cookie / Authorization / Set-Cookie are never
          # written, and stay unwritten if a new header shows up upstream.
          defaultMode: drop
          names:
            # Canonical MIME casing is required -- Traefik does an exact map
            # lookup against Go's canonicalised header key
            # (pkg/observability/types/logs.go AccessLogFields.KeepHeader).
            # These land in the JSON as request_<Name>.
            Referer: keep
            User-Agent: keep
            # Real client IP behind the Cloudflare tunnel; ClientHost is the
            # cloudflared pod IP and is useless for identifying a member.
            Cf-Connecting-Ip: keep
            # Correlates a line here with the Cloudflare-side request.
            Cf-Ray: keep
          # NOTE: query parameters are kept (Traefik default) because
          # `?callbackUrl=` on the sign-in redirect is exactly the triage
          # signal we want. If a token-bearing query parameter is ever added
          # to an external app, set fields.queryParameters.defaultMode: drop
          # (Proxy >= v3.7.3, we run v3.7.12).

    #fullnameOverride: traefik-external ## Using releaseName instead
    deployment:
      enabled: true
      replicas: 3
      annotations:
        reloader.stakater.com/auto: "true"
      podAnnotations: {}
      additionalContainers: []
      initContainers: []

    # Guarantee the 3 replicas stay spread across distinct nodes (was scheduler
    # luck) so a drain/reschedule can't co-locate the edge onto one node.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: '{{ template "traefik.name" . }}'
            app.kubernetes.io/instance: '{{ template "traefik.instance-name" . }}'

    # Keep >=2 replicas serving through any voluntary disruption (node drain).
    podDisruptionBudget:
      enabled: true
      minAvailable: 2

    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              priority: 10
      websecure:
        port: 443
        http3:
          enabled: true
        http:
          tls:
            enabled: true
          
    ingressRoute:
      dashboard:
        enabled: false # will declare in a separate file

    providers:
      kubernetesCRD:
        enabled: true
        ingressClass: traefik-external
        allowExternalNameServices: true
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: true
        ingressClass: traefik-external
        allowExternalNameServices: true
        publishedService:
          enabled: true

    rbac:
      enabled: true

    service:
      enabled: true
      annotations:
        lbipam.cilium.io/ips: 192.168.40.206
      labels: {}
      # v40: k8s Service fields moved under service.spec (aligned with ServiceSpec)
      spec:
        type: LoadBalancer
        loadBalancerSourceRanges: []
        externalIPs: []
