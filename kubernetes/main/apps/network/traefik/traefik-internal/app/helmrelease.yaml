apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-internal
spec:
  chartRef:
    kind: OCIRepository
    name: traefik-internal-oci
  interval: 15m
  timeout: 5m
  releaseName: traefik-internal
  values: 
    # Values https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml 
    global:
      sendAnonymousUsage: false
      checkNewVersion: false

    additionalArguments:
      - "--serversTransport.insecureSkipVerify=true"
      - "--log.level=DEBUG"
      - "--serversTransport.maxIdleConnsPerHost=1000"
      - "--serversTransport.forwardingTimeouts.dialTimeout=60s"
      - "--serversTransport.forwardingTimeouts.responseHeaderTimeout=0s"
      - "--serversTransport.forwardingTimeouts.idleConnTimeout=0s"
      - "--entryPoints.websecure.transport.respondingTimeouts.idleTimeout=0s"
      - "--entryPoints.websecure.transport.respondingTimeouts.readTimeout=0s"
      - "--entryPoints.websecure.transport.respondingTimeouts.writeTimeout=0s"
      - "--entryPoints.websecure.http2.maxConcurrentStreams=1000"

    deployment:
      enabled: true
      replicas: 3
      annotations:
        reloader.stakater.com/auto: "true"
      podAnnotations: {}
      additionalContainers: []
      initContainers: []

    # Guarantee the 3 replicas stay spread across distinct nodes (was scheduler
    # luck) so a drain/reschedule can't co-locate the edge onto one node.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: '{{ template "traefik.name" . }}'
            app.kubernetes.io/instance: '{{ template "traefik.instance-name" . }}'

    # Keep >=2 replicas serving through any voluntary disruption (node drain).
    podDisruptionBudget:
      enabled: true
      minAvailable: 2

    # #3385: without requests this pod was BestEffort, and every BestEffort pod
    # on a node shares cpu.weight 1. On 2026-10-05 a runaway pod saturated
    # talosm02, this pod got no CPU, /ping timed out and the kubelet killed it
    # in a loop. A request makes it Burstable with a weight that follows the
    # request, so under contention it keeps at least about this much CPU.
    # Sized from Prometheus, 7 days to 2026-10-06: CPU p95 5m-rate 4.5m, 1m-rate
    # peak 63m; working set p95 216Mi, 30-day peak 243Mi.
    # No CPU limit on purpose: CFS throttling on the ingress path adds latency.
    # The memory limit is about 4x the 30-day peak. The chart also sets
    # GOMEMLIMIT to 90% of it, so the Go GC tightens before an OOM kill.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              priority: 10
      websecure:
        http3:
          enabled: true
        http:
          tls:
            enabled: true
          
    ingressRoute:
      dashboard:
        enabled: false # will declare in a separate file
  
    providers:
      kubernetesCRD:
        enabled: true
        ingressClass: traefik-internal
        allowExternalNameServices: true
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: true
        ingressClass: traefik-internal
        allowExternalNameServices: true
        publishedService:
          enabled: true

    rbac:
      enabled: true

    service:
      enabled: true
      annotations:
        #metallb.universe.tf/loadBalancerIPs: 192.168.40.203
        lbipam.cilium.io/ips: 192.168.40.203
      labels: {}
      # v40: k8s Service fields moved under service.spec (aligned with ServiceSpec)
      spec:
        type: LoadBalancer
        loadBalancerSourceRanges: []
        externalIPs: []
