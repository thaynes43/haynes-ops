---
# Custom forward-auth middleware for the Tautulli front door (DESIGN-041 D-07).
# The outpost-GENERATED middleware (ak-outpost-tautulli-outpost) omits
# `Authorization` from authResponseHeaders, so the outpost's injected
# HTTP-Basic credentials never reach Tautulli — the popup persists even with
# correct group attributes (found live 2026-07-17). The generated object is
# controller-owned and unpatchable; this twin adds the one header. Same
# outpost address, same trust posture.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tautulli-forward-auth
  namespace: network
spec:
  forwardAuth:
    address: http://ak-outpost-tautulli-outpost.network:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
      - Authorization
