apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tautulli
  annotations:
    external-dns.alpha.kubernetes.io/target: ingress-ext.haynesnetwork.com
    kubernetes.io/ingress.class: traefik-external
    gethomepage.dev/href: "https://tautulli.haynesnetwork.com"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Unraid
    gethomepage.dev/name: Tautulli
    gethomepage.dev/description: Stats for the Unraid Plex
    gethomepage.dev/icon: tautulli
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`tautulli.haynesnetwork.com`) && PathPrefix(`/`)
      services:
        - kind: Service
          name: haynestower
          port: 8181
      middlewares:
        # Authentik forward-auth front door (DESIGN-041 D-07): tautulli's own
        # dedicated outpost (one outpost per app, like paperless/dev-env) —
        # generated by blueprints/60-tautulli-frontdoor.yaml in
        # kubernetes/main/apps/network/authentik/app/blueprints/. Login is
        # gated to the `authentik Admins` + `family` groups; /newsletter,
        # /image, /status and /api are carved out (unauthenticated surfaces).
        # Fail-closed: until the blueprint applies and the outpost pod exists,
        # the route errors.
        - name: ak-outpost-tautulli-outpost
          namespace: network
        - name: default-headers
  tls:
    secretName: certificate-haynesnetwork