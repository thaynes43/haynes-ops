apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns-unifi
spec:
  interval: 30m
  chart:
    spec:
      # https://github.com/kubernetes-sigs/external-dns/blob/master/charts/external-dns/values.yaml
      chart: external-dns
      version: 1.21.1
      sourceRef:
        kind: HelmRepository
        name: external-dns-unifi
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: *app
    logLevel: debug
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/kashalls/external-dns-unifi-webhook
          tag: v0.9.0
        env:
          - name: UNIFI_HOST
            value: https://192.168.40.1
          - name: UNIFI_USER
            valueFrom:
              secretKeyRef:
                name: &secret external-dns-unifi-secret
                key: username
          - name: UNIFI_PASS
            valueFrom:
              secretKeyRef:
                name: *secret
                key: password
          - name: LOG_LEVEL
            value: "debug"
    extraArgs:
      - --ignore-ingress-tls-spec
      # The UDM's API stalls for >5s under load (image-pull storms, busy WAN);
      # the default 5s webhook read timeout turned every stall into a fatal ->
      # CrashLoopBackOff (21 restarts in the week to 2026-08-13). Ride it out.
      - --webhook-provider-read-timeout=60s
    policy: sync
    sources: ["crd", "ingress", "traefik-proxy"]
    excludeDomains: ["haynesnetwork.com"]
    domainFilters: ["haynesops.com"]
    txtOwnerId: haynes-ops
    txtPrefix: k8s.haynes-ops.
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
