apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns-unifi
spec:
  interval: 30m
  chart:
    spec:
      # https://github.com/kubernetes-sigs/external-dns/blob/master/charts/external-dns/values.yaml
      chart: external-dns
      version: 1.22.0
      sourceRef:
        kind: HelmRepository
        name: external-dns-unifi
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: *app
    logLevel: debug
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/kashalls/external-dns-unifi-webhook
          tag: v0.9.0
        env:
          - name: UNIFI_HOST
            value: https://192.168.40.1
          - name: UNIFI_USER
            valueFrom:
              secretKeyRef:
                name: &secret external-dns-unifi-secret
                key: username
          - name: UNIFI_PASS
            valueFrom:
              secretKeyRef:
                name: *secret
                key: password
          - name: LOG_LEVEL
            value: "debug"
    extraArgs:
      - --ignore-ingress-tls-spec
      # The UDM's API stalls for >5s under load (image-pull storms, busy WAN);
      # the default 5s webhook read timeout turned every stall into a fatal ->
      # CrashLoopBackOff (21 restarts in the week to 2026-08-13). Ride it out.
      - --webhook-provider-read-timeout=60s
      # Phase 2a of the GA annotation-prefix migration (#3002). Every record is
      # dual-annotated since #3044 -- each external-dns.alpha.kubernetes.io/<key>
      # has an identical external-dns.kubernetes.io/<key> beside it -- so this
      # flip reads the same values and is a no-op. Verified against the live
      # cluster before the flip: 71/71 alpha-annotated objects carry an
      # identical GA twin.
      # external-dns reads exactly ONE prefix and has no fallback, so this flag
      # and the annotations must never disagree. Kept explicit (rather than
      # relying on the v0.22.0 default) until phase 3 removes the alpha
      # annotations; then it can go only if the default is confirmed identical.
      - --annotation-prefix=external-dns.kubernetes.io/
    policy: sync
    sources: ["crd", "ingress", "traefik-proxy"]
    excludeDomains: ["haynesnetwork.com"]
    domainFilters: ["haynesops.com"]
    txtOwnerId: haynes-ops
    txtPrefix: k8s.haynes-ops.
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
