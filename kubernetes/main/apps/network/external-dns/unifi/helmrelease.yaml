apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns-unifi
spec:
  interval: 30m
  chart:
    spec:
      # https://github.com/kubernetes-sigs/external-dns/blob/master/charts/external-dns/values.yaml
      chart: external-dns
      version: 1.22.0
      sourceRef:
        kind: HelmRepository
        name: external-dns-unifi
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: *app
    logLevel: debug
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/kashalls/external-dns-unifi-webhook
          tag: v0.9.0
        env:
          - name: UNIFI_HOST
            value: https://192.168.40.1
          - name: UNIFI_USER
            valueFrom:
              secretKeyRef:
                name: &secret external-dns-unifi-secret
                key: username
          - name: UNIFI_PASS
            valueFrom:
              secretKeyRef:
                name: *secret
                key: password
          - name: LOG_LEVEL
            value: "debug"
    extraArgs:
      - --ignore-ingress-tls-spec
      # The UDM's API stalls for >5s under load (image-pull storms, busy WAN);
      # the default 5s webhook read timeout turned every stall into a fatal ->
      # CrashLoopBackOff (21 restarts in the week to 2026-08-13). Ride it out.
      - --webhook-provider-read-timeout=60s
      # external-dns v0.22.0 (chart 1.22.0) changes the DEFAULT annotation
      # prefix to `external-dns.kubernetes.io/` with no fallback to the alpha
      # prefix. Every annotation in this repo is still
      # `external-dns.alpha.kubernetes.io/` (73 of them, 71 of which are
      # /target), so without this flag every record would silently lose its
      # target override and be re-synced to the ingress LB address -- with
      # `policy: sync` that rewrites live internal DNS. This flag also exists in
      # 0.21.0 where it is the default, so it is a no-op until the bump.
      # KEEP THIS until every external-dns.alpha.kubernetes.io/ annotation in
      # the repo has been migrated to the GA prefix, then remove it in the same
      # commit as the last migration.
      - --annotation-prefix=external-dns.alpha.kubernetes.io/
    policy: sync
    sources: ["crd", "ingress", "traefik-proxy"]
    excludeDomains: ["haynesnetwork.com"]
    domainFilters: ["haynesops.com"]
    txtOwnerId: haynes-ops
    txtPrefix: k8s.haynes-ops.
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
