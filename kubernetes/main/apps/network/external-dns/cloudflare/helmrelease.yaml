apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns-cloudflare
spec:
  interval: 30m
  chart:
    spec:
      # https://github.com/kubernetes-sigs/external-dns/blob/master/charts/external-dns/values.yaml
      chart: external-dns
      version: 1.22.0
      sourceRef:
        kind: HelmRepository
        name: external-dns-cloudflare
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: *app
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: &secret external-dns-cloudflare-secret
            key: cloudflare_api_token
    extraArgs:
      - --cloudflare-proxied
      - --ignore-ingress-tls-spec
      # Phase 2b of the GA annotation-prefix migration (#3002). Every record is
      # dual-annotated since #3044 -- each external-dns.alpha.kubernetes.io/<key>
      # has an identical external-dns.kubernetes.io/<key> beside it -- so this
      # flip reads the same values and is a no-op. The unifi instance was
      # flipped first (#3045) and ran clean: endpoints kept their
      # annotation-derived CNAME targets and no record changed.
      # external-dns reads exactly ONE prefix and has no fallback, so this flag
      # and the annotations must never disagree. Kept explicit (rather than
      # relying on the v0.22.0 default) until phase 3 removes the alpha
      # annotations; then it can go only if the default is confirmed identical.
      - --annotation-prefix=external-dns.kubernetes.io/
    logLevel: debug
    policy: sync
    sources: ["crd", "ingress", "traefik-proxy"]
    domainFilters: ["haynesnetwork.com"]
    excludeDomains: ["haynesops.com"]
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
