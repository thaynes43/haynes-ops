apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns-cloudflare
spec:
  interval: 30m
  chart:
    spec:
      # https://github.com/kubernetes-sigs/external-dns/blob/master/charts/external-dns/values.yaml
      chart: external-dns
      version: 1.22.0
      sourceRef:
        kind: HelmRepository
        name: external-dns-cloudflare
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: *app
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: &secret external-dns-cloudflare-secret
            key: cloudflare_api_token
    extraArgs:
      - --cloudflare-proxied
      - --ignore-ingress-tls-spec
      # external-dns v0.22.0 (chart 1.22.0) changes the DEFAULT annotation
      # prefix to `external-dns.kubernetes.io/` with no fallback to the alpha
      # prefix. Every annotation in this repo is still
      # `external-dns.alpha.kubernetes.io/` (73 of them, 71 of which are
      # /target), so without this flag every record would silently lose its
      # target override and be re-synced to the ingress LB address -- with
      # `policy: sync` that rewrites live public DNS. This flag also exists in
      # 0.21.0 where it is the default, so it is a no-op until the bump.
      # KEEP THIS until every external-dns.alpha.kubernetes.io/ annotation in
      # the repo has been migrated to the GA prefix, then remove it in the same
      # commit as the last migration.
      - --annotation-prefix=external-dns.alpha.kubernetes.io/
    logLevel: debug
    policy: sync
    sources: ["crd", "ingress", "traefik-proxy"]
    domainFilters: ["haynesnetwork.com"]
    excludeDomains: ["haynesops.com"]
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
