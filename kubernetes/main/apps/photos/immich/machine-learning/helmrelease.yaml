---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app immich-machine-learning
spec:
  releaseName: *app
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    remediation:
      retries: 3
  rollback:
    cleanupOnFail: true
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      immich-machine-learning:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # One CUDA replica on talosm05's RTX A2000 12 GB, shared with
          # ollama-assist02 (qwen3.5:9b, ~6.5 GB resident, OLLAMA_KEEP_ALIVE=-1).
          # This replaced three CPU-only replicas (2x talosw01, 1x talosm03) that
          # sat on GPU nodes without ever touching a GPU, because the image had
          # no `-cuda` suffix.
          #
          # Why this card (2026-10-05, 14-day VRAM peaks from nvidia-gpu-exporter,
          # nvidia-smi MiB):
          #   - talosw01's 3090 peaks at 19.8 of 24.6 GB (llama-server +
          #     ollama-prime). ML on top would cut llama-server's headroom under
          #     the 4 GB it must keep — not here.
          #   - talosm03's RTX 2000 Ada peaked at 15.9 of 16.4 GB. ComfyUI's
          #     dynamic VRAM fills whatever is free when it loads, and with
          #     assist02 gone it can grow into the whole card, so an ML model
          #     load after a render could OOM — not here.
          #   - talosm01's A2000 belongs to voice: whisper, speech-to-phrase,
          #     kokoro, vexa-whisper. Re-checked 2026-10-06 for a second replica
          #     and rejected: its 14-day peak is 9.6 of 12.3 GB, which leaves
          #     ~2.1 GB, and ML's bounded worst case is ~4.2 GB (below), so a
          #     replica there would need a cap too small for real inputs.
          #     Throughput is not needed (runbook, "Why one replica").
          #   - talosm05: ollama-assist02 holds ~7.0 GB (qwen3.5:9b, loaded
          #     forever). Unbounded, ML filled the rest: 11.9 of 12.3 GB and
          #     CUDA out-of-memory errors on 2026-10-06, even with one queue at
          #     a time (Face Detection alone took ML to ~4.4 GB). The VRAM guard
          #     below bounds ML at ~4.2 GB worst case, so the card stays under
          #     ~11.3 GB. Measured under the worst-case load test: ML 0.9-1.2 GB,
          #     and 3.0 GB for one OCR of a 1:30 screenshot.
          #     After MACHINE_LEARNING_MODEL_TTL (300 s) idle the ML worker
          #     unloads its models and exits, so it holds ~0 VRAM between jobs.
          # Pinned by hostname, not the `nvidia-a2000` label: that label also
          # matches talosm01 and talosm04.
          #
          # GPU access is the nvidia RuntimeClass plus NVIDIA_VISIBLE_DEVICES=all
          # from the -cuda image (talosm05 has one card), with no nvidia.com/gpu
          # request — the same way every other GPU app shares a card here.
          # Immich's CUDA docs need nothing else: driver >= 545 (nodes run 580),
          # compute capability >= 5.2 (A2000 is 8.6), MACHINE_LEARNING_DEVICE_IDS
          # defaults to 0 = the one visible card.
          #
          # One replica is plenty on a GPU. While talosm05 is down or drained,
          # smart search and new-asset ML jobs fail until it returns, like the
          # other hostname-pinned GPU apps.
          nodeSelector:
            kubernetes.io/hostname: talosm05
          runtimeClassName: nvidia
        replicas: 1
        # Recreate, not RollingUpdate: a rolling update starts the new pod while
        # the old one still holds its models, so for a moment two ML processes
        # would share the card next to ollama. With Recreate, requests fail for
        # the half minute the pod takes to restart, and the nightly Missing run
        # (queue-missing/) picks up any asset that failed.
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              # `-cuda` = immich's CUDA build (ONNX Runtime CUDAExecutionProvider).
              # Renovate's docker versioning treats the suffix as part of the
              # version's compatibility, so it only ever proposes other -cuda tags,
              # and the immich monorepo group still bumps it with the server.
              tag: v3.3.1-cuda@sha256:d1a195d377cfac65886901a6b2d4040b61b7e7db7ca55db1598622d3a2f125e2
            env:
              TZ: America/New_York
              IMMICH_MEDIA_LOCATION: /usr/src/app/upload
              MACHINE_LEARNING_CACHE_FOLDER: /cache
              TRANSFORMERS_CACHE: /cache
              XDG_CONFIG_HOME: /cache/.config
              MPLCONFIGDIR: /cache/.config/matplotlib
              # --- VRAM bound (2026-10-06). Runbook: .agents/runbooks/immich-ml-backlog.md,
              # "The VRAM guard". Line numbers are Immich v3.2.4 machine-learning/immich_ml/.
              # One request at a time. The default is os.cpu_count(), 20 on talosm05
              # (config.py:64), and every inference in flight holds its own working
              # memory on the card (main.py:60-63, 215-219). Requests beyond one wait in
              # ML's queue; /ping is served outside that pool, so health checks never
              # wait. (The guard also lets only one model run at a time.)
              MACHINE_LEARNING_REQUEST_THREADS: "1"
              # Faces per recognition batch. On CUDA the default is no limit
              # (models/facial_recognition/recognition.py:32-33, 84-92), so a group photo
              # with 61 faces is one 61-face batch.
              MACHINE_LEARNING_MAX_BATCH_SIZE__FACIAL_RECOGNITION: "8"
              # Text boxes per OCR recognition batch. 6 is the code default
              # (models/ocr/recognition.py:41-42); it is set here so that an upgrade
              # cannot change the bound without anyone noticing.
              MACHINE_LEARNING_MAX_BATCH_SIZE__OCR: "6"
              # The VRAM guard (vram-guard/sitecustomize.py, mounted below). Immich has
              # no setting for ONNX Runtime's CUDA options (sessions/ort.py:134-135), so
              # the guard adds them: a hard cap on each model session's memory arena
              # (IMMICH_ML_CUDA_MEM_LIMIT_MB), and the arena's unused memory handed
              # back to the card after every run. The image's own PYTHONPATH is
              # /usr/src; the guard directory goes in front of it.
              PYTHONPATH: /opt/immich-ml-vram-guard:/usr/src
              # Per model session. The largest single run measured is OCR detection on
              # a 1:30 scrolling screenshot, ~2.8 GB; everything else stays under 1 GB.
              # Worst case for the process: CUDA context + all six models' weights
              # (~1.1 GB) + one run up to this cap = ~4.2 GB, next to ollama's 7.0 GB.
              IMMICH_ML_CUDA_MEM_LIMIT_MB: "3072"
              # GPU busy at most 25% of the time: after each model run the guard waits
              # three times as long as the run took. Unthrottled, a busy ML slowed
              # ollama-assist02's voice answers by 1.7x; at 0.25, by ~1.15x. Imports
              # take about four times longer, which is fine.
              IMMICH_ML_GPU_DUTY_CYCLE: "0.25"
              # Rich (ML's log formatter) wraps at 80 columns without a terminal, which
              # splits CUDA error messages across lines; the out-of-memory alert
              # (lokirule.yaml) matches whole lines.
              COLUMNS: "200"
            envFrom:
              - secretRef:
                  name: immich-secret
              - configMapRef:
                  name: immich-configmap
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 16Gi
    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 3003
    persistence:
      vram-guard:
        type: configMap
        name: immich-ml-vram-guard
        globalMounts:
          - path: /opt/immich-ml-vram-guard
            readOnly: true
      cache:
        type: persistentVolumeClaim
        existingClaim: immich-machine-learning
        globalMounts:
          - path: /cache
      geocoding-dump:
        type: emptyDir
        globalMounts:
          - path: /usr/src/app/.reverse-geocoding-dump
      transformers-cache:
        type: emptyDir
        globalMounts:
          - path: /usr/src/app/.transformers_cache
      upload:
        type: nfs
        server: gasha01.haynesnetwork
        path: /hdd-nfs-repl
        advancedMounts:
          immich-machine-learning:
            app:
              - path: /usr/src/app/upload
                subPath: data/photos/immich
                readOnly: true
      photos:
        type: nfs
        server: gasha01.haynesnetwork
        path: /hdd-nfs-repl
        advancedMounts:
          immich-machine-learning:
            app:
              - path: /photos
                subPath: data/photos
                readOnly: true