---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
#
# The Immich API key that immich-queue-missing (cronjob.yaml) uses to queue the
# Smart Search, Face Detection and OCR "Missing" runs (#3413).
#
# It is Tom's existing unrestricted admin key, the one AppDaemon already uses
# (Tom, 2026-10-06): 1Password vault HaynesKube, item `appdaemon`, field
# `IMMICH_API_KEY`. One field feeds both, so rotating it there updates both
# after each ExternalSecret refreshes. The job itself needs only `job.create`
# (PUT /api/jobs/:name) and `queue.read` (GET /api/queues/:name), both
# admin-only routes. Runbook: .agents/runbooks/immich-ml-backlog.md.
#
# Only that one property is fetched (no dataFrom of the `appdaemon` item, which
# also carries the Home Assistant token, Gemini and Vestaboard keys and MQTT
# credentials), so this Job holds the Immich key and nothing else.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-queue-missing
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: immich-queue-missing-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Rendered as a ready-made curl header file (`curl -H @file`), so the
        # key never sits in an environment variable or on a command line.
        # trim guards against a pasted trailing space or newline.
        api-key-header: "x-api-key: {{ .IMMICH_API_KEY | trim }}\n"
  data:
    - secretKey: IMMICH_API_KEY
      remoteRef:
        key: appdaemon
        property: IMMICH_API_KEY
