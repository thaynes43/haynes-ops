apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
spec:
  chart:
    spec:
      chart: reflector
      version: 10.0.x
      sourceRef:
        kind: HelmRepository
        name: emberstack
        namespace: kube-system
  interval: 15m
  timeout: 5m
  releaseName: reflector
  values:
    # #3389: requests sized from Prometheus (7d p95, 30d peak); no CPU limit.
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 1536Mi
