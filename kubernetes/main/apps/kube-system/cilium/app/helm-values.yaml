---
autoDirectNodeRoutes: true
bpf:
  masquerade: false # Required for Talos `.machine.features.hostDNS.forwardKubeDNSToHost`
cgroup:
  automount:
    enabled: false
  hostRoot: /sys/fs/cgroup
cluster:
  id: 1
  name: "haynes-ops"
cni:
  exclusive: false
# Match both legacy eth* names and predictable enp* names. USB-reimaged nodes
# that boot without net.ifnames=0 baked into their boot assets enumerate NICs
# as enpXsX; eth+ alone matched nothing there, so Cilium crashed with "unable
# to determine direct routing device". Routing is already correct (mgmt NIC
# wins the default route at metric 100), so Cilium just needs to see the device.
devices: eth+ enp+
enableRuntimeDeviceDetection: true
endpointRoutes:
  enabled: true
envoy:
  enabled: false
hubble:
  enabled: false
ipam:
  mode: kubernetes
ipv4NativeRoutingCIDR: "10.42.0.0/16"
k8sServiceHost: 127.0.0.1
k8sServicePort: 7445
kubeProxyReplacement: true
kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
l2announcements:
  enabled: true
loadBalancer:
  algorithm: maglev
  mode: dsr
localRedirectPolicy: true
operator:
  replicas: 1
  rollOutPods: true
  # Pin the operator to control-plane nodes. WHY (verified 2026-07-04 via
  # `talosctl get kubeprismendpoints`): worker KubePrism (127.0.0.1:7445) has ONLY the
  # Omni SideroLink apiserver endpoint (fdae:41e4:649b:9303::1:10000), while CP nodes
  # also have localhost:6443 + the direct apiserver IPs. So an operator on a worker
  # reaches the apiserver over a single SideroLink tunnel; under heavy worker load (the
  # *arr pipeline) that path congests, the operator's 5s leader-election lease renewal
  # times out, and it self-terminates (`Leader election lost`) into a crash-loop. On a
  # CP node it uses a LOCAL apiserver and carries no download load. CP nodes are
  # untainted (allowSchedulingOnControlPlanes), so no tolerations are needed.
  nodeSelector:
    kubernetes.io/os: linux
    node-role.kubernetes.io/control-plane: ""
  # Defense-in-depth: relax leader-election (defaults 15s/10s/2s) so a transient
  # apiserver/KubePrism blip doesn't kill the operator even on a CP node.
  extraArgs:
    - --leader-election-lease-duration=30s
    - --leader-election-renew-deadline=20s
    - --leader-election-retry-period=4s
rollOutCiliumPods: true
routingMode: native
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
