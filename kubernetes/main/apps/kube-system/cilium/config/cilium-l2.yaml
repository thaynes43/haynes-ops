---
# https://docs.cilium.io/en/latest/network/l2-announcements
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
spec:
  loadBalancerIPs: true
  interfaces: ["^eth.*"]
  # Every node may announce LB VIPs except the eGPU test node (talosw04, label set in
  # its Omni machine block): a suspect card can hang that box, and a VIP it holds stays
  # dark until the lease times out. For every other node this matches what the old
  # `kubernetes.io/os: linux` matchLabels did.
  nodeSelector:
    matchExpressions:
      - key: kubernetes.io/os
        operator: In
        values: ["linux"]
      - key: haynesops.com/gpu-test
        operator: DoesNotExist
---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: l2-pool
spec:
  allowFirstLastIPs: "Yes"
  blocks:
    - # Controller VIP: 192.168.40.202
      start: 192.168.40.203
      stop: 192.168.40.254