---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
spec:
  interval: 30m
  chart:
    spec:
      chart: nvidia-device-plugin
      version: 0.20.1
      sourceRef:
        kind: HelmRepository
        name: nvdp
        namespace: kube-system
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    # A node needs BOTH the Talos nvidia extensions AND an NVIDIA card that is actually
    # on the PCI bus. The extensions alone are not enough: talosm04 joined (#3332) with
    # its A2000 not enumerating, and the plugin container could not even start there
    # ("failed to initialize NVML: Driver Not Loaded", RunContainerError loop). The
    # card check is the generic NFD label from the nvidia-gpu-device NodeFeatureRule
    # (any 10de display/3D device), so a new card model needs no change here.
    # The second term keeps talosw04, the tainted eGPU test node: NFD's worker does not
    # tolerate its taint, so it never gets NFD labels and is matched by its own Talos
    # node label instead. A suspect card there that drops off the bus restarts the
    # plugin by design; that node never pages.
    # (History: the old single-label selector matched only the A2000 box, and with no
    # control-plane toleration the plugin ran NOWHERE for months.) The plugin pod itself
    # needs the nvidia RuntimeClass on Talos to see the devices.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: extensions.talos.dev/nvidia-container-toolkit-lts
                  operator: Exists
                - key: feature.node.kubernetes.io/nvidia-gpu
                  operator: In
                  values: ["true"]
            - matchExpressions:
                - key: extensions.talos.dev/nvidia-container-toolkit-lts
                  operator: Exists
                - key: haynesops.com/gpu-test
                  operator: In
                  values: ["true"]
    runtimeClassName: nvidia
    flags:
      migStrategy: single
      plugin:
        deviceListStrategy: envvar
        deviceIDStrategy: uuid
        securityContext:
          privileged: true
    # talosw04 (the eGPU test node) is tainted haynesops.com/gpu-test:NoSchedule so
    # ordinary GPU apps stay off it; the plugin still runs there so its card is
    # advertised as nvidia.com/gpu (it matches the extension label above). Only
    # pods that carry the same toleration can claim that card.
    tolerations:
      - key: haynesops.com/gpu-test
        operator: Exists
        effect: NoSchedule
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 512Mi
