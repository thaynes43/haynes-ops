---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
spec:
  interval: 30m
  chart:
    spec:
      chart: nvidia-device-plugin
      version: 0.20.0
      sourceRef:
        kind: HelmRepository
        name: nvdp
        namespace: kube-system
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    # Any node whose Talos nvidia extensions are installed (a2000/2000-ada/3090
    # today) — the old single-label selector matched only the A2000 box, and
    # with no control-plane toleration the plugin has run NOWHERE for months;
    # nvidia.com/gpu was advertised on no node. The plugin pod itself needs the
    # nvidia RuntimeClass on Talos to see the devices.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: extensions.talos.dev/nvidia-container-toolkit-lts
                  operator: Exists
    runtimeClassName: nvidia
    flags:
      migStrategy: single
      plugin:
        deviceListStrategy: envvar
        deviceIDStrategy: uuid
        securityContext:
          privileged: true
    tolerations: []
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 512Mi
