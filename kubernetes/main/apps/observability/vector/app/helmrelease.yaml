---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vector
spec:
  interval: 30m
  # 10m (2026-07-24): the default 5m install timeout tripped while the first
  # rollout crashlooped on the vector-0.57 template bug, leaving the release
  # Stalled/RetriesExceeded. Headroom for slow first installs; this spec bump
  # also resets the stalled retry counter.
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      vector:
        # Aggregator role: a single receiver holds the stable LB VIP the Talos
        # nodes ship to. Scale-out would fragment the UDP endpoint, so keep 1.
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/vectordotdev/vector
              tag: 0.57.0-distroless-libc@sha256:bb5968aa63f3bf7cf77f8cd7548c1442cc91f2a8c20d7ef5c5a03e2a37fbf205
            args:
              - --config
              - /etc/vector/vector.yaml
            env:
              VECTOR_LOG: info
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  # Vector's GraphQL API (bound below) is the only TCP health
                  # signal; the log intake itself is connectionless UDP.
                  tcpSocket:
                    port: 8686
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 96Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: vector
        type: LoadBalancer
        annotations:
          # Cilium LB-IPAM pins this VIP (pool 192.168.40.203-254); the existing
          # CiliumL2AnnouncementPolicy announces it on the eth* LAN so the Talos
          # host network can reach it. Talos machine.logging ships here.
          lbipam.cilium.io/ips: 192.168.40.212
        ports:
          talos-service:
            port: 6051
            protocol: UDP
    persistence:
      config:
        type: configMap
        name: vector-configmap
        globalMounts:
          - path: /etc/vector/vector.yaml
            subPath: vector.yaml
            readOnly: true
      data:
        type: emptyDir
        globalMounts:
          - path: /vector-data-dir
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
