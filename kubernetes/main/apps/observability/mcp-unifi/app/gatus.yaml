---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-unifi-gatus-ep
  labels:
    gatus.io/enabled: "true"
data:
  config.yaml: |
    endpoints:
      - name: mcp-unifi
        group: internal
        # 0.6.0 exposes process liveness without credentials. This does not check
        # UniFi API access; verify that separately with an authenticated MCP read.
        url: "https://mcp-unifi.haynesops.com/healthz"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: pushover
            failure-threshold: 10
            success-threshold: 2
