---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dns-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dns-canary
    spec:
      # Must share a node with the flux controllers (the pods whose DNS path it
      # shadows). They were evicted talosw02 -> talosw01 on 2026-08-01 before
      # this canary first deployed; the scheduler is not aware of that intent.
      nodeSelector:
        kubernetes.io/hostname: talosw01
      containers:
        - name: canary
          image: ghcr.io/nicolaka/netshoot:v0.16
          command: ["/bin/bash", "/opt/canary/canary.sh"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: script
              mountPath: /opt/canary
        # Second probe path: the Go stdlib resolver (parallel A+AAAA, search
        # expansion) that every affected client uses and dig cannot emulate.
        - name: go-canary
          image: docker.io/library/golang:1.26-alpine
          command: ["go", "run", "/opt/canary/main.go"]
          env:
            - name: HOME
              value: /tmp
            - name: GOCACHE
              value: /tmp/gocache
            - name: GOPATH
              value: /tmp/go
            - name: CGO_ENABLED
              value: "0"
            - name: GODEBUG
              value: netdns=go
            - name: GOTOOLCHAIN
              value: local
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: script
              mountPath: /opt/canary
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: dns-canary-script
        - name: tmp
          emptyDir: {}
