---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dns-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dns-canary
    spec:
      containers:
        - name: canary
          image: ghcr.io/nicolaka/netshoot:v0.16
          command: ["/bin/bash", "/opt/canary/canary.sh"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: script
              mountPath: /opt/canary
      volumes:
        - name: script
          configMap:
            name: dns-canary-script
