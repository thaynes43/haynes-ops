---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-pve-exporter
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: prometheus-pve-exporter-secret
    template:
      engineVersion: v2
      data:
        # prometheus-pve-exporter reads token auth from PVE_* env vars
        # (config_from_env: PVE_USER + PVE_TOKEN_NAME + PVE_TOKEN_VALUE ->
        # the "default" module). The 1Password "proxmox" item is the single
        # source of truth: PROXMOX_API_TOKEN_ID is "prometheus@pve!exporter",
        # so the user is the part before "!" and the token name the part
        # after; only the token secret value is sensitive. The API host:port
        # (pvedash.haynesnetwork:443) is non-secret and set per-scrape in the
        # HelmRelease ServiceMonitor target param.
        PVE_USER: '{{ (splitList "!" .PROXMOX_API_TOKEN_ID) | first }}'
        PVE_TOKEN_NAME: '{{ (splitList "!" .PROXMOX_API_TOKEN_ID) | last }}'
        PVE_TOKEN_VALUE: '{{ .PROXMOX_API_TOKEN_SECRET }}'
  dataFrom:
    - extract:
        key: proxmox
