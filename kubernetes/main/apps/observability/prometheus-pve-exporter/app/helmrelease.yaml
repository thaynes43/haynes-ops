---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-pve-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      prometheus-pve-exporter:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/prometheus-pve/prometheus-pve-exporter
              tag: 3.10.0
            env:
              TZ: America/New_York
              # The Proxmox LB serves the API on 443 (self-signed), not the
              # default 8006. The target host:port and module are set per
              # scrape in the ServiceMonitor below; only auth comes from env.
              PVE_VERIFY_SSL: "false"
            envFrom:
              # PVE_USER / PVE_TOKEN_NAME / PVE_TOKEN_VALUE (token auth).
              - secretRef:
                  name: prometheus-pve-exporter-secret
            probes:
              # The exporter's own web server (index/ and its self /metrics)
              # is up independent of PVE reachability; PVE health surfaces via
              # the scraped pve_up series, not container readiness.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 9221
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          metrics:
            port: *port
    serviceMonitor:
      app:
        serviceName: prometheus-pve-exporter
        endpoints:
          # Scrape /pve (not the exporter's self /metrics): the exporter
          # authenticates to target and returns pve_* series for the whole
          # cluster. cluster/node collectors default on, so all five nodes
          # report from this single target.
          - port: metrics
            scheme: http
            path: /pve
            interval: 1m
            scrapeTimeout: 30s
            params:
              module: ["default"]
              target: ["pvedash.haynesnetwork:443"]
    persistence:
      # gunicorn worker temp dir; keeps readOnlyRootFilesystem intact.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
