---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app nvidia-gpu-exporter
  namespace: observability
spec:
  targetNamespace: observability
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: kube-prometheus-stack
      namespace: observability
    # The DaemonSet is scheduled purely by the NFD GPU labels
    # (kube-system/node-feature-discovery/rules/nvidia-*-gpu-device.yaml), so it
    # would land on zero nodes if those NodeFeatureRules were not applied yet.
    - name: node-feature-discovery-rules
      namespace: kube-system
  path: ./kubernetes/main/apps/observability/nvidia-gpu-exporter/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  wait: true
  interval: 30m
  timeout: 5m
