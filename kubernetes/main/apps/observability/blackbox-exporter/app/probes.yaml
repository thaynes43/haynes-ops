# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/probe_v1.json
---
kind: Probe
apiVersion: monitoring.coreos.com/v1
metadata:
  name: devices
spec:
  module: icmp
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - haynestower.haynesnetwork
        - pikvm.haynesnetwork
        - tubeszb-zigbee01.haynesnetwork
        - tubeszb-zwave01.haynesnetwork
---
# haynesnetwork.com apex front-page uptime probe (saga haynesnetwork-ha, plan 03).
# Second, independent alarm path alongside the Gatus apex check: http_2xx feeds
# probe_success into Prometheus, already covered by the BlackboxProbeFailed rule
# (probe_success == 0 for 15m, critical). Gatus and Prometheus live on different
# nodes, so either one alone can page.
kind: Probe
apiVersion: monitoring.coreos.com/v1
metadata:
  name: haynesnetwork
spec:
  module: http_2xx
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://haynesnetwork.com
---
# sigoalumni.org apex uptime probe (sigo-alumni backlog infra/06). Mirrors the
# haynesnetwork apex probe: http_2xx feeds probe_success into Prometheus as a
# second, independent alarm path alongside the Gatus WAN-path check
# (external_sigoalumni). The existing BlackboxProbeFailed rule in this app's
# helmrelease.yaml is `probe_success == 0 for 15m` with NO target selector, so it
# covers every probe_success series and picks up this new target automatically —
# no rule edit needed. Gatus and Prometheus run on different nodes, so either one
# alone can page. Note: blackbox probes GET / (a plain 2xx, process-level); the
# DB-truthful signal is Gatus's /api/healthz check, not this probe.
kind: Probe
apiVersion: monitoring.coreos.com/v1
metadata:
  name: sigoalumni
spec:
  module: http_2xx
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://sigoalumni.org
---
# gasha01 NFS export (VM 104 on twin-bottom; PVE Ceph hdd_repl_pool behind CephFS). About
# 30 apps hard-mount gasha01.haynesnetwork:/hdd-nfs-repl (nfsvers=4.2, hard), so a stalled
# export surfaces as hung pods, never as an NFS alert. tcp_connect on :2049 feeds
# probe_success; the BlackboxProbeFailed rule in this app's helmrelease.yaml
# (probe_success == 0 for 15m, critical) has no target selector and covers it without a
# rule edit. Added 2026-09-17 by the HaynesIntelligence 3090-swap blast-radius audit
# (#2954, item 5).
kind: Probe
apiVersion: monitoring.coreos.com/v1
metadata:
  name: gasha01-nfs
spec:
  module: tcp_connect
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - gasha01.haynesnetwork:2049
---
# sigoalumni shared-egress canaries (Sigo hardening story H4, plan O6). Two fixed,
# stable hostnames on TCP 443, one Probe each so they stay independent series:
# sqladmin.googleapis.com is the Google control plane the Cloud SQL proxy refreshes
# its certificates against, www.cloudflare.com is Cloudflare's web edge. They sample
# whether THIS node's egress can reach two unrelated destinations; they do not test
# Cloud SQL's data port (3307), a tunnel's active edge, TLS or authentication, and a
# second target on the same exporter is the same vantage point, not an independent one.
# interval 15s / scrapeTimeout 7s is a NEW collection cadence for these two targets
# only (the other probes stay at the 1m default); it does not improve the resolution
# of any historical data. The tcp_connect module timeout is 5s, below the 7s scrape.
# Alert: SigoalumniSharedEgressSuspected in frontend/sigoalumni/app/prometheusrule.yaml
# matches job=~"probe/observability/sigoalumni-egress-.+", so keep the name prefix. The
# BlackboxProbeFailed rule (probe_success == 0 for 15m, critical, no target selector)
# also covers both: a 15m outage of either destination pages by itself.
kind: Probe
apiVersion: monitoring.coreos.com/v1
metadata:
  name: sigoalumni-egress-sqladmin
spec:
  module: tcp_connect
  interval: 15s
  scrapeTimeout: 7s
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - sqladmin.googleapis.com:443
---
kind: Probe
apiVersion: monitoring.coreos.com/v1
metadata:
  name: sigoalumni-egress-cloudflare
spec:
  module: tcp_connect
  interval: 15s
  scrapeTimeout: 7s
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - www.cloudflare.com:443
