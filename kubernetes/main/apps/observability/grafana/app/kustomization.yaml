---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../../shared/components/gatus/gaurded
resources:
  - ./helmrepository.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
# Custom dashboards delivered as sidecar-watched ConfigMaps (label
# grafana_dashboard). The grafana sidecar (searchNamespace: ALL) auto-imports
# them into the folder named by the grafana_folder annotation. JSON is kept
# token-free ($__range/$__rate_interval removed) so Flux postBuild.substitute
# can't blank Grafana's built-in variables.
configMapGenerator:
  - name: grafana-dashboard-media-pipeline
    files:
      - dashboards/media-pipeline-resilience.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "true"
      annotations:
        grafana_folder: Media
  - name: grafana-dashboard-media-storage
    files:
      - dashboards/media-storage-utilization.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "true"
      annotations:
        grafana_folder: Media
  # PLAN-018 metrics sub-tab deep-dive boards (curated *arr/downloader panels;
  # the haynesnetwork app surfaces a trimmed subset and deep-links per group).
  - name: grafana-dashboard-arr-library-overview
    files:
      - dashboards/arr-library-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "true"
      annotations:
        grafana_folder: Media
  - name: grafana-dashboard-downloads-clients-indexers
    files:
      - dashboards/downloads-clients-indexers.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "true"
      annotations:
        grafana_folder: Downloads
  # ytdrivarr — the ytdl-content suite service's own daily-review board (the
  # retired config-manager PR-body surface): daily changes per provider + the
  # per-activity existing/added/total vs cap table, Peloton scraper health
  # (bearer age vs SLA, selector drift, links/scrolls), YouTube, and the
  # pipeline (runs, queue, worker, projection). Fed by ytdrivarr's /metrics.
  - name: grafana-dashboard-ytdrivarr
    files:
      - dashboards/ytdrivarr.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "true"
      annotations:
        grafana_folder: Downloads
  # PLAN-018 hardware deep-dive: the Unraid NAS (HaynesTower) — array capacity
  # vs the 80% target, per-disk fill, disk I/O, host CPU/mem/net/temps, and a
  # SMART section fed by the out-of-cluster node_exporter + smartctl-exporter
  # scrapes. Built to tolerate spun-down array disks (absent series = "asleep",
  # never red; temps span nulls) — nothing here forces a spin-up.
  - name: grafana-dashboard-nas-haynestower
    files:
      - dashboards/nas-haynestower.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "true"
      annotations:
        grafana_folder: Hardware
  # AppDaemon Health Checks: fed by the appdaemon_health_* metrics scraped from
  # the health-check controller (hass-sandbox #96). Checker status matrix,
  # repair rate + recovery-time percentiles, per-checker/device breakdowns,
  # domain sensor values (humidity/battery/UPS/ComfyUI queue), pipeline up.
  - name: grafana-dashboard-home-health
    files:
      - dashboards/home-health.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "true"
      annotations:
        grafana_folder: Home Assistant
  # sigoalumni observability (sigo-alumni backlog infra/06): uptime SLI (Gatus
  # 1h/24h/7d/30d for the external WAN /api/healthz + internal in-cluster
  # checks), blackbox probe_success/duration, the Cloudflare-Tunnel request
  # plane (traefik_* is NOT scraped in this cluster, so the dedicated
  # sigoalumni tunnel is the request-rate/status source of truth), replica +
  # cloud-sql-proxy health, and the Loki starter query set (text + live logs).
  - name: grafana-dashboard-sigoalumni
    files:
      - dashboards/sigoalumni.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "true"
      annotations:
        grafana_folder: Frontend
