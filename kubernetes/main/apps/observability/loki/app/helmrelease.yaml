---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      # https://github.com/grafana/loki/blob/main/production/helm/loki/values.yaml
      chart: loki
      version: 7.3.0
      sourceRef:
        kind: HelmRepository
        name: loki
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: Skip
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: gasha01-rbd
      namespace: ceph-csi
  values:
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      analytics:
        reporting_enabled: false
      server:
        log_level: info
      commonConfig:
        replication_factor: 1
      compactor:
        working_directory: /var/loki/compactor/retention
        delete_request_store: filesystem
        retention_enabled: true
      ingester:
        chunk_encoding: snappy
      storage:
        type: filesystem
        bucketNames:
          chunks: chunks
      schemaConfig:
        configs:
          - from: "2024-04-01" # quote
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      limits_config:
        # 90d (owner-sized 2026-08-21): ~47GB steady-state at the measured
        # ~0.5GB/day — comfortably inside the 128Gi RBD volume below.
        retention_period: 90d
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        # External proxmox ceph via ceph-csi (unpinned from w03; survives node
        # loss; independent of rook). Migration 2026-08-21 was a FRESH START —
        # the old 14d of logs stayed on the deleted hostpath PVC by owner call
        # (history preservation was only requested for metrics).
        storageClass: gasha01-rbd
        size: 128Gi
    # Loki exported no metrics at all before 2026-08-21 (no ServiceMonitor —
    # found during the retention audit); ingest rate is now scrapeable.
    monitoring:
      serviceMonitor:
        enabled: true
    gateway:
      replicas: 0
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
    sidecar:
      image:
        repository: ghcr.io/kiwigrid/k8s-sidecar
      rules:
        searchNamespace: ALL
