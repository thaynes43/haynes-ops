---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      # https://github.com/grafana/loki/blob/main/production/helm/loki/values.yaml
      chart: loki
      version: 7.3.0
      sourceRef:
        kind: HelmRepository
        name: loki
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: Skip
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: gasha01-rbd
      namespace: ceph-csi
  values:
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      analytics:
        reporting_enabled: false
      server:
        log_level: info
      commonConfig:
        replication_factor: 1
      compactor:
        working_directory: /var/loki/compactor/retention
        delete_request_store: filesystem
        retention_enabled: true
      ingester:
        chunk_encoding: snappy
      storage:
        type: filesystem
        bucketNames:
          chunks: chunks
      schemaConfig:
        configs:
          - from: "2024-04-01" # quote
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      # RULER WIRING (2026-09-22) — this block is what makes every `loki_rule`-labelled
      # ConfigMap in this repo actually evaluate and page. Before it, the chart default
      # rendered `ruler.storage.type: local` with NO `local.directory` and NO
      # `alertmanager_url`, so the ruler loaded ZERO groups (`/prometheus/api/v1/rules`
      # → `{"groups":[]}`, no `cortex_prometheus_*` series in Prometheus) and had nowhere
      # to send a notification anyway. Every rule file that existed at that point —
      # plex, plexops, zigbee2mqtt and qbittorrent's MamSeedboxSessionDead — was INERT and
      # had never fired once. Found while adding haynesnetwork's MamGovernorActuationFailing.
      #   * storage.local.directory + sidecar.rules.folder: Loki's local rule store is laid
      #     out <directory>/<tenant>/<file>, and `auth_enabled: false` means the tenant is
      #     `fake`. The chart mounts the shared sc-rules-volume at `sidecar.rules.folder` in
      #     BOTH containers, so pointing the sidecar one level down at /rules/fake is what
      #     makes the ruler see those files as tenant `fake` under /rules.
      #   * enable_alertmanager_v2: Alertmanager here is v0.34.0. Loki defaults to the v1
      #     /api/v1/alerts endpoint, which that version removed long ago.
      #   * alertmanager_url lists BOTH replicas of the HA pair (2026-10-06). The pair gossips
      #     silences and the notification log, NOT alerts: each replica only holds the alerts
      #     sent to it. Pointed at the ClusterIP Service, the ruler's kept-alive connection
      #     landed every alert on replica 0, so anything reading the API through the Service
      #     (Grafana's Alertmanager datasource, the alert-responder's poll) saw Loki alerts on
      #     about half its requests (found verifying haynesnetwork's OwedCheck* rules: replica 0
      #     held them, replica 1 nothing). Each comma-separated URL is its own notifier group,
      #     so every alert goes to both; the cluster still sends each notification once. A
      #     replica that is down only costs failed sends to it (loki_prometheus_notifications_errors_total).
      #   * rule_path is the ruler's scratch copy dir and must be writable — it goes on the
      #     PVC next to the WAL, never inside the sidecar's folder.
      rulerConfig:
        wal:
          dir: /var/loki/ruler-wal
        storage:
          type: local
          local:
            directory: /rules
        rule_path: /var/loki/ruler-rule-path
        alertmanager_url: http://alertmanager-kube-prometheus-stack-0.alertmanager-operated.observability.svc.cluster.local:9093,http://alertmanager-kube-prometheus-stack-1.alertmanager-operated.observability.svc.cluster.local:9093
        enable_alertmanager_v2: true
        enable_api: true
      limits_config:
        # 90d (owner-sized 2026-08-21). Re-measured 2026-08-23:
        # deriv(kubelet_volume_stats_used_bytes{persistentvolumeclaim="storage-loki-0"}[24h])
        # = ~0.86 GB/day, not the ~0.5GB/day originally recorded here — so steady
        # state is ~78GB at 90d, not ~47GB. Still comfortably inside the 128Gi RBD
        # volume below, so this is an accuracy correction, not a capacity problem.
        # Short-window figure (volume was ~2d old); re-check with deriv over [24h]
        # after a couple of weeks of steady state.
        retention_period: 90d
    singleBinary:
      replicas: 1
      # #3389: requests sized from Prometheus (7d p95, 30d peak); no CPU limits.
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
        limits:
          memory: 4Gi
      # 2026-09-09: prefer bare-metal masters — all worker VMs share one Proxmox host (see incident)
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      persistence:
        enabled: true
        # External proxmox ceph via ceph-csi (unpinned from w03; survives node
        # loss; independent of rook). Migration 2026-08-21 was a FRESH START —
        # the old 14d of logs stayed on the deleted hostpath PVC by owner call
        # (history preservation was only requested for metrics).
        storageClass: gasha01-rbd
        size: 128Gi
        # DATA-LOSS GUARD (2026-08-23). The chart default is `true`, which renders
        # persistentVolumeClaimRetentionPolicy{whenDeleted,whenScaled: Delete} —
        # it was live and invisible here, because the knob never appeared in this
        # file. Combined with the PVC's blockOwnerDeletion owner-ref to the STS and
        # the gasha01-rbd PV's reclaimPolicy: Delete, ANY StatefulSet delete/recreate
        # (or a chart change scaling singleBinary to 0) destroyed the 128Gi volume
        # AND its backing RBD image, unrecoverably — there is no ReplicationSource
        # in this namespace. Setting false omits the block entirely (the template
        # gates on this bool), so k8s defaults to Retain/Retain, matching the
        # prometheus STS. Do not remove without adding a backup first.
        enableStatefulSetAutoDeletePVC: false
    # Loki exported no metrics at all before 2026-08-21 (no ServiceMonitor —
    # found during the retention audit); ingest rate is now scrapeable.
    monitoring:
      serviceMonitor:
        enabled: true
    gateway:
      replicas: 0
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
    sidecar:
      image:
        repository: ghcr.io/kiwigrid/k8s-sidecar
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
        limits:
          memory: 256Mi
      rules:
        # <ruler local.directory>/<tenant>. auth_enabled is false, so the tenant is `fake`.
        # Both the loki container and this sidecar mount the shared emptyDir at this path.
        folder: /rules/fake
        searchNamespace: ALL
