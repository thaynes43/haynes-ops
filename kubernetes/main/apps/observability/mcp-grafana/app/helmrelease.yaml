---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mcp-grafana
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      mcp-grafana:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: grafana/mcp-grafana
              tag: 1.1.0
            args:
              - -t
              - streamable-http
              - --endpoint-path
              - /mcp
              # v0.17.1+ added DNS-rebinding protection: Host/Origin validation is
              # enforced on EVERY route (/mcp, /sse, /healthz, /metrics) and rejects
              # any Host outside the loopback allowlist with 403. That broke the
              # kubelet httpGet /healthz probes (Host: <podIP>:8000), the in-cluster
              # dev-env client (Host: <svc>.observability.svc:8000), AND the external
              # Traefik ingress client (Host: mcp-grafana.haynesops.com) — none are
              # loopback. This service is only reachable via the trusted traefik-internal
              # reverse proxy (internal.haynesops), so per upstream guidance we disable
              # the Host check with '*'. Removing this flag re-breaks the /healthz probe
              # and every non-loopback client. See grafana/mcp-grafana v0.17.1 notes.
              - --allowed-hosts
              - "*"
            env:
              GRAFANA_URL: http://grafana.observability.svc.cluster.local
            envFrom:
              - secretRef:
                  name: mcp-grafana-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8000
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8000
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8000
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: mcp-grafana
        ports:
          http:
            port: 8000
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
