---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: alertmanager-secret
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          route:
            group_by: ["alertname", "job"]
            group_interval: 10m
            group_wait: 1m
            # Catch-all is "null": only severity=critical (route below) pages the
            # phone. Warnings/infos stay visible in Alertmanager/Grafana UI only.
            # (Previously the root receiver was pushover, so every warning that no
            # child route caught paged the phone — e.g. CephHealthWarning at 2:56am.)
            receiver: "null"
            repeat_interval: 12h
            routes:
              # Dead-man's-switch: the always-firing Watchdog pings an external
              # healthchecks.io check every 5m via ALERTMANAGER_CLUSTER_MAIN_HEARTBEAT_URL
              # (1Password "alertmanager" item). If the monitoring pipeline dies, the
              # pings stop and healthchecks.io notifies out-of-band.
              - receiver: heartbeat
                group_interval: 5m
                group_wait: 0s
                matchers:
                  - alertname =~ "Watchdog"
                repeat_interval: 5m
              - receiver: "null"
                matchers:
                  - alertname =~ "InfoInhibitor"
              # ytdl-sub peloton/youtube backfills are best-effort media downloads
              # that routinely run >12h and fail (network/Peloton throttling, stale
              # cron jobs), tripping KubeJobNotCompleted and KubeJobFailed. These are
              # expected noise — subsequent runs succeed — so suppress both.
              - receiver: "null"
                matchers:
                  - alertname =~ "KubeJobNotCompleted|KubeJobFailed"
                  - job_name =~ "ytdl-sub-.*"
              # Plex hardware-transcode canary (media/plex-hw-canary, owner decision 2026-10-12):
              # on the phone in the daytime only, never at night. Normal Pushover priority (the
              # critical route below is priority 1, which bypasses quiet hours). Outside the
              # interval the route still matches, so nothing falls through to another receiver;
              # notifications wait and go out once `daytime` starts. These alerts are warnings,
              # so without this route they would hit the null catch-all.
              - receiver: pushover-daytime
                matchers:
                  - alertname =~ "PlexHwTranscodeNotHardware|PlexHwCanaryStale|PlexHwCanaryNotRunning"
                active_time_intervals:
                  - daytime
              - receiver: pushover
                matchers:
                  - severity = "critical"
          time_intervals:
            - name: daytime
              time_intervals:
                - times:
                    - start_time: "09:00"
                      end_time: "21:00"
                  location: America/New_York
          inhibit_rules:
            - equal: ["alertname", "namespace"]
              source_matchers:
                - severity = "critical"
              target_matchers:
                - severity = "warning"
          receivers:
            - name: heartbeat
              webhook_configs:
                - send_resolved: true
                  url: "{{ .ALERTMANAGER_CLUSTER_MAIN_HEARTBEAT_URL }}"
            - name: "null"
            - name: pushover
              pushover_configs:
                - html: true
                  # Anchored so pushover-daytime sends the same message and title.
                  message: &pushover_message |-
                    {{ "{{-" }} range .Alerts {{ "}}" }}
                      {{ "{{-" }} if ne .Annotations.description "" {{ "}}" }}
                        {{ "{{" }} .Annotations.description {{ "}}" }}
                      {{ "{{-" }} else if ne .Annotations.summary "" {{ "}}" }}
                        {{ "{{" }} .Annotations.summary {{ "}}" }}
                      {{ "{{-" }} else if ne .Annotations.message "" {{ "}}" }}
                        {{ "{{" }} .Annotations.message {{ "}}" }}
                      {{ "{{-" }} else {{ "}}" }}
                        Alert description not available
                      {{ "{{-" }} end {{ "}}" }}
                      {{ "{{-" }} if gt (len .Labels.SortedPairs) 0 {{ "}}" }}
                        <small>
                        {{ "{{-" }} range .Labels.SortedPairs {{ "}}" }}
                          <b>{{ "{{" }} .Name {{ "}}" }}:</b> {{ "{{" }} .Value {{ "}}" }}
                        {{ "{{-" }} end {{ "}}" }}
                        </small>
                      {{ "{{-" }} end {{ "}}" }}
                    {{ "{{-" }} end {{ "}}" }}
                  priority: |-
                    {{ "{{" }} if eq .Status "firing" {{ "}}" }}1{{ "{{" }} else {{ "}}" }}0{{ "{{" }} end {{ "}}" }}
                  send_resolved: true
                  sound: gamelan
                  # ttl: 1d
                  title: &pushover_title >-
                    [{{ "{{" }} .Status | toUpper {{ "}}" }}{{ "{{" }} if eq .Status "firing" {{ "}}" }}:{{ "{{" }} .Alerts.Firing | len {{ "}}" }}{{ "{{" }} end {{ "}}" }}]
                    {{ "{{" }} .CommonLabels.alertname {{ "}}" }}
                  token: "{{ .ALERTMANAGER_PUSHOVER_TOKEN }}"
                  url_title: View in Alertmanager
                  user_key: "{{ .PUSHOVER_USER_KEY }}"
            # Same Pushover app and user as `pushover`, at normal priority (0) instead of 1.
            - name: pushover-daytime
              pushover_configs:
                - html: true
                  message: *pushover_message
                  priority: "0"
                  send_resolved: true
                  sound: gamelan
                  title: *pushover_title
                  token: "{{ .ALERTMANAGER_PUSHOVER_TOKEN }}"
                  url_title: View in Alertmanager
                  user_key: "{{ .PUSHOVER_USER_KEY }}"
  dataFrom:
    - extract:
        key: pushover
    - extract:
        key: alertmanager