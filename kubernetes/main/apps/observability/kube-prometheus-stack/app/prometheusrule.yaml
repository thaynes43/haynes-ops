---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: miscellaneous-rules
spec:
  groups:
    - name: dockerhub
      rules:
        - alert: BootstrapRateLimitRisk
          annotations:
            summary: Kubernetes cluster at risk of being rate limited by dockerhub on bootstrap
          expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
          for: 15m
          labels:
            severity: critical
    - name: oom
      rules:
        - alert: OOMKilled
          annotations:
            summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
          # ceph-mgr excluded 2026-08-05 (user call: page only when a human is
          # needed). The ACTIVE mgr's known memory leak (documented at the mgr
          # resources block in rook-ceph/cluster/helmrelease.yaml, 2026-06-19)
          # now OOM-cycles ~daily — this rule paged critical 15 days straight
          # for it. The OOM restart IS the self-heal: mgr is active/standby HA
          # and failover is seamless; no human action exists short of chasing
          # the leaking module upstream. NOTE the leak has accelerated far past
          # the ~0.05Gi/day measured in June (daily OOM at a 4Gi limit) — worth
          # an upstream look, but not a page. A genuinely dead mgr still pages
          # via the bundled CephMgrPrometheusModuleInactive / CephHealthError.
          expr: |
            ((kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1)
            unless on (namespace, pod, container) kube_pod_container_info{namespace="rook-ceph", container="mgr"}
          labels:
            severity: critical
    - name: zfs
      rules:
        - alert: ZfsUnexpectedPoolState
          annotations:
            summary: ZFS pool {{$labels.zpool}} on {{$labels.instance}} is in a unexpected state {{$labels.state}}
          expr: node_zfs_zpool_state{state!="online"} > 0
          for: 15m
          labels:
            severity: critical
            scope: host          # host/hardware — alert-responder skips LLM diagnosis
    # 2026-08-01 sabnzbd/talosw02 incident: kubelet starts evicting at 15%
    # free (imagefs), but the stock NodeFilesystemAlmostOutOfSpace only fires
    # at 5%/3% — the eviction storm hits long before any page. These fire
    # ABOVE the eviction threshold so a human is paged while there is still
    # runway (the incident filled 66%→20% free in ~2h).
    - name: node-filesystem-eviction-runway
      rules:
        - alert: NodeVarSpaceLow
          annotations:
            summary: '{{ $labels.instance }} /var has {{ printf "%.0f" $value }}% free — kubelet evicts at 15%. Check for runaway writers (download scratch, WAL, logs).'
          expr: 100 * node_filesystem_avail_bytes{job="node-exporter", mountpoint="/var"} / node_filesystem_size_bytes{job="node-exporter", mountpoint="/var"} < 25
          for: 15m
          labels:
            severity: warning
        - alert: NodeVarEvictionImminent
          annotations:
            summary: '{{ $labels.instance }} /var has {{ printf "%.0f" $value }}% free — kubelet DiskPressure evictions begin at 15%. Stop the writer now.'
          expr: 100 * node_filesystem_avail_bytes{job="node-exporter", mountpoint="/var"} / node_filesystem_size_bytes{job="node-exporter", mountpoint="/var"} < 18
          for: 5m
          labels:
            severity: critical
    # Replaces the stock NodeNetworkTransmitErrs/ReceiveErrs (disabled in the
    # HelmRelease defaultRules) — same expr but excludes virtual/tunnel devices
    # (siderolink WireGuard, cilium_*, lxc*, veth*, etc.) that throw benign
    # TX/RX "errors", so we only alert on real NICs (eth*/enp*).
    - name: node-network
      rules:
        - alert: NodeNetworkTransmitErrs
          annotations:
            description: '{{ $labels.instance }} interface {{ $labels.device }} has encountered {{ printf "%.0f" $value }} transmit errors in the last two minutes.'
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodenetworktransmiterrs
            summary: Network interface is reporting many transmit errors.
          expr: rate(node_network_transmit_errs_total{job="node-exporter", device!~"siderolink|veth.*|cilium.*|lxc.*|cni.*|cali.*|tunl.*|wg.*|flannel.*|dummy.*|kube-ipvs.*|nodelocaldns.*"}[2m]) / rate(node_network_transmit_packets_total{job="node-exporter", device!~"siderolink|veth.*|cilium.*|lxc.*|cni.*|cali.*|tunl.*|wg.*|flannel.*|dummy.*|kube-ipvs.*|nodelocaldns.*"}[2m]) > 0.01
          for: 1h
          labels:
            severity: warning
            scope: host          # host/hardware NIC — alert-responder skips LLM diagnosis
        - alert: NodeNetworkReceiveErrs
          annotations:
            description: '{{ $labels.instance }} interface {{ $labels.device }} has encountered {{ printf "%.0f" $value }} receive errors in the last two minutes.'
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodenetworkreceiveerrs
            summary: Network interface is reporting many receive errors.
          expr: rate(node_network_receive_errs_total{job="node-exporter", device!~"siderolink|veth.*|cilium.*|lxc.*|cni.*|cali.*|tunl.*|wg.*|flannel.*|dummy.*|kube-ipvs.*|nodelocaldns.*"}[2m]) / rate(node_network_receive_packets_total{job="node-exporter", device!~"siderolink|veth.*|cilium.*|lxc.*|cni.*|cali.*|tunl.*|wg.*|flannel.*|dummy.*|kube-ipvs.*|nodelocaldns.*"}[2m]) > 0.01
          for: 1h
          labels:
            severity: warning
            scope: host          # host/hardware NIC — alert-responder skips LLM diagnosis
    # Recreated from the stock node-exporter rules (disabled in the HelmRelease
    # defaultRules) purely to add `scope: host` — exprs/for/annotations are verbatim
    # upstream. Host RAID/disk faults the cluster can't fix; responder skips diagnosis.
    - name: node-raid
      rules:
        - alert: NodeRAIDDegraded
          annotations:
            description: 'RAID array ''{{ $labels.device }}'' at {{ $labels.instance }} is in degraded state due to one or more disks failures. Number of spare drives is insufficient to fix issue automatically.'
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/noderaiddegraded
            summary: RAID Array is degraded.
          expr: node_md_disks_required{device=~"(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dm-.+|md.+|dasd.+)",job="node-exporter"} - ignoring (state) (node_md_disks{device=~"(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dm-.+|md.+|dasd.+)",job="node-exporter",state="active"}) > 0
          for: 15m
          labels:
            severity: critical
            scope: host          # host/hardware — alert-responder skips LLM diagnosis
        - alert: NodeRAIDDiskFailure
          annotations:
            description: 'At least one device in RAID array at {{ $labels.instance }} failed. Array ''{{ $labels.device }}'' needs attention and possibly a disk swap.'
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/noderaiddiskfailure
            summary: Failed device in RAID array.
          expr: node_md_disks{device=~"(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dm-.+|md.+|dasd.+)",job="node-exporter",state="failed"} > 0
          labels:
            severity: warning
            scope: host          # host/hardware — alert-responder skips LLM diagnosis
    # A node's kernel boot time changed, i.e. the node rebooted. Talos nodes should
    # only reboot on a deliberate upgrade/maintenance, so an UNPLANNED reboot means a
    # hard reset or crash. These previously surfaced only indirectly — when talosm02
    # hard-reset (2026-07-18 & 2026-07-24) the ONLY page was CephOSDDown, which
    # disguised the real root cause. This fires directly on the reboot itself.
    # `changes()>0` is a point event: it stays active only for the ~10m the boot-time
    # step remains in the window, so a rolling Talos upgrade pages once per node
    # instead of storming. severity=critical is required to page — Alertmanager's
    # root receiver is "null" and only severity=critical routes to Pushover (same tier
    # as CephOSDDown). Scoped to job="node-exporter" (the Talos fleet); the out-of-
    # cluster NAS (job=node-exporter-haynestower) is intentionally excluded.
    - name: node-reboot
      rules:
        - alert: NodeRebooted
          annotations:
            summary: Node {{ $labels.kubernetes_node }} rebooted.
            description: >-
              Node {{ $labels.kubernetes_node }} ({{ $labels.instance }}) rebooted
              within the last 10 minutes (kernel boot time changed). If this was not a
              planned Talos upgrade/maintenance it indicates an unplanned hard reset or
              crash — check the node before dependent alerts (e.g. CephOSDDown) mask it.
          expr: changes(node_boot_time_seconds{job="node-exporter"}[10m]) > 0
          for: 0m
          labels:
            severity: critical
            scope: host          # host/hardware event — alert-responder skips LLM diagnosis
    # NAS capacity backstop (owner ruling 2026-08-06, same ruling as the rook-ceph
    # postRenderer that scopes CephNodeDiskspaceWarning to role!="nas"): Unraid's
    # per-disk fill level is meaningless for capacity planning — the high-water
    # allocator deliberately runs disks to 87.5% and a predict_linear on the current
    # fill-target always cries wolf. What actually needs a human is ARRAY-level
    # exhaustion (buy/swap disks, prune shares) or a single disk draining below any
    # high-water step (allocator misconfig or a share pinned to a full disk — writes
    # to it will start failing). Both are critical because only severity=critical
    # routes to Pushover, and both are genuinely human-actionable; thresholds are far
    # below normal operation (array holds ~98TB free of 526TB as of this ruling;
    # high-water never takes a disk below ~2.5TB free).
    - name: nas-capacity
      rules:
        - alert: NASArrayFreeSpaceLow
          annotations:
            summary: "NAS {{ $labels.instance }} array free space low: {{ $value | humanize1024 }}B left."
            description: >-
              Total free space across the Unraid array's data disks dropped below 10TiB.
              This is array-level exhaustion, not a per-disk high-water artifact — plan
              disk additions/replacements or prune shares.
          expr: sum by (instance) (node_filesystem_avail_bytes{role="nas", fstype="xfs", mountpoint=~"/mnt/disk[0-9]+"}) < 10 * 1024^4
          for: 1h
          labels:
            severity: critical
            scope: host          # self-evident capacity fact — alert-responder skips LLM diagnosis
        - alert: NASDataDiskAbsoluteFull
          annotations:
            summary: "NAS disk {{ $labels.mountpoint }} nearly full: {{ $value | humanize1024 }}B left."
            description: >-
              An individual Unraid data disk fell below 100GB free — below any
              high-water allocation step, so the allocator should never have let this
              happen. Likely a share pinned/included on this disk or a split-level
              constraint; writes targeting it will start failing.
          expr: node_filesystem_avail_bytes{role="nas", fstype="xfs", mountpoint=~"/mnt/disk[0-9]+"} < 100e9
          for: 30m
          labels:
            severity: critical
            scope: host          # self-evident capacity fact — alert-responder skips LLM diagnosis
