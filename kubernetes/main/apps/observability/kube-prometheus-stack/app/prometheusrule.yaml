---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: miscellaneous-rules
spec:
  groups:
    - name: dockerhub
      rules:
        - alert: BootstrapRateLimitRisk
          annotations:
            summary: Kubernetes cluster at risk of being rate limited by dockerhub on bootstrap
          expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
          for: 15m
          labels:
            severity: critical
    - name: oom
      rules:
        - alert: OOMKilled
          annotations:
            summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
          expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
          labels:
            severity: critical
    - name: zfs
      rules:
        - alert: ZfsUnexpectedPoolState
          annotations:
            summary: ZFS pool {{$labels.zpool}} on {{$labels.instance}} is in a unexpected state {{$labels.state}}
          expr: node_zfs_zpool_state{state!="online"} > 0
          for: 15m
          labels:
            severity: critical
            scope: host          # host/hardware — alert-responder skips LLM diagnosis
    # Replaces the stock NodeNetworkTransmitErrs/ReceiveErrs (disabled in the
    # HelmRelease defaultRules) — same expr but excludes virtual/tunnel devices
    # (siderolink WireGuard, cilium_*, lxc*, veth*, etc.) that throw benign
    # TX/RX "errors", so we only alert on real NICs (eth*/enp*).
    - name: node-network
      rules:
        - alert: NodeNetworkTransmitErrs
          annotations:
            description: '{{ $labels.instance }} interface {{ $labels.device }} has encountered {{ printf "%.0f" $value }} transmit errors in the last two minutes.'
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodenetworktransmiterrs
            summary: Network interface is reporting many transmit errors.
          expr: rate(node_network_transmit_errs_total{job="node-exporter", device!~"siderolink|veth.*|cilium.*|lxc.*|cni.*|cali.*|tunl.*|wg.*|flannel.*|dummy.*|kube-ipvs.*|nodelocaldns.*"}[2m]) / rate(node_network_transmit_packets_total{job="node-exporter", device!~"siderolink|veth.*|cilium.*|lxc.*|cni.*|cali.*|tunl.*|wg.*|flannel.*|dummy.*|kube-ipvs.*|nodelocaldns.*"}[2m]) > 0.01
          for: 1h
          labels:
            severity: warning
            scope: host          # host/hardware NIC — alert-responder skips LLM diagnosis
        - alert: NodeNetworkReceiveErrs
          annotations:
            description: '{{ $labels.instance }} interface {{ $labels.device }} has encountered {{ printf "%.0f" $value }} receive errors in the last two minutes.'
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodenetworkreceiveerrs
            summary: Network interface is reporting many receive errors.
          expr: rate(node_network_receive_errs_total{job="node-exporter", device!~"siderolink|veth.*|cilium.*|lxc.*|cni.*|cali.*|tunl.*|wg.*|flannel.*|dummy.*|kube-ipvs.*|nodelocaldns.*"}[2m]) / rate(node_network_receive_packets_total{job="node-exporter", device!~"siderolink|veth.*|cilium.*|lxc.*|cni.*|cali.*|tunl.*|wg.*|flannel.*|dummy.*|kube-ipvs.*|nodelocaldns.*"}[2m]) > 0.01
          for: 1h
          labels:
            severity: warning
            scope: host          # host/hardware NIC — alert-responder skips LLM diagnosis
    # Recreated from the stock node-exporter rules (disabled in the HelmRelease
    # defaultRules) purely to add `scope: host` — exprs/for/annotations are verbatim
    # upstream. Host RAID/disk faults the cluster can't fix; responder skips diagnosis.
    - name: node-raid
      rules:
        - alert: NodeRAIDDegraded
          annotations:
            description: 'RAID array ''{{ $labels.device }}'' at {{ $labels.instance }} is in degraded state due to one or more disks failures. Number of spare drives is insufficient to fix issue automatically.'
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/noderaiddegraded
            summary: RAID Array is degraded.
          expr: node_md_disks_required{device=~"(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dm-.+|md.+|dasd.+)",job="node-exporter"} - ignoring (state) (node_md_disks{device=~"(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dm-.+|md.+|dasd.+)",job="node-exporter",state="active"}) > 0
          for: 15m
          labels:
            severity: critical
            scope: host          # host/hardware — alert-responder skips LLM diagnosis
        - alert: NodeRAIDDiskFailure
          annotations:
            description: 'At least one device in RAID array at {{ $labels.instance }} failed. Array ''{{ $labels.device }}'' needs attention and possibly a disk swap.'
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/noderaiddiskfailure
            summary: Failed device in RAID array.
          expr: node_md_disks{device=~"(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dm-.+|md.+|dasd.+)",job="node-exporter",state="failed"} > 0
          labels:
            severity: warning
            scope: host          # host/hardware — alert-responder skips LLM diagnosis
