---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 30m
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: Skip
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: prometheus-operator-crds
      namespace: observability
    # openebs still backs the Alertmanager PVCs; gasha01-rbd backs Prometheus.
    - name: openebs
      namespace: openebs-system
    - name: gasha01-rbd
      namespace: ceph-csi
  values:
    crds:
      enabled: false
    cleanPrometheusOperatorObjectNames: true
    defaultRules:
      # The stock node-exporter network-error rules watch EVERY interface,
      # including virtual/tunnel devices (siderolink WireGuard, cilium_*, lxc*),
      # which legitimately show TX/RX "errors" (e.g. WG encapsulation drops) and
      # fire false positives. Disabled here and replaced with device-filtered
      # versions in prometheusrule.yaml that only watch real NICs.
      disabled:
        NodeNetworkTransmitErrs: true
        NodeNetworkReceiveErrs: true
        # Recreated in prometheusrule.yaml with `scope: host` (alert-responder skips LLM
        # diagnosis on unfixable host RAID/disk faults — owner ruling 2026-07-10).
        NodeRAIDDegraded: true
        NodeRAIDDiskFailure: true
    alertmanager:
      ingress:
        enabled: true
        annotations:
          external-dns.alpha.kubernetes.io/target: internal.haynesops
          # Homepage
          gethomepage.dev/href: &url "https://alertmanager.haynesops.com"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Observability
          gethomepage.dev/name: Alertmanager
          gethomepage.dev/description: Alerts and silences
          gethomepage.dev/icon: alertmanager
          # Needed for Kubernetes status/metrics lookup
          gethomepage.dev/app: alertmanager
          # Homepage siteMonitor runs from inside the cluster; bypass auth/TLS by using the Service directly
          gethomepage.dev/siteMonitor: "http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093/-/ready"
        ingressClassName: traefik-internal
        hosts: ["alertmanager.haynesops.com"]
        pathType: Prefix
      alertmanagerSpec:
        # HA pair since the 2026-08-21 Talos roll: a single AM co-located with
        # Prometheus on w03 meant one node reboot silenced the entire paging
        # path (Watchdog→AM→healthchecks.io fired a false "cluster down").
        # Two replicas + hard anti-affinity = AM survives any one node. The
        # operator wires native AM clustering (gossip) automatically, so alerts
        # and the heartbeat dedup — one page, not two. Storage stays
        # openebs-hostpath: each replica gets its own node-local PVC; state
        # (silences, notification log) replicates via gossip, so losing one
        # PVC is harmless.
        replicas: 2
        podAntiAffinity: hard
        useExistingSecret: true
        configSecret: alertmanager-secret
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: openebs-hostpath
              resources:
                requests:
                  storage: 1Gi
    kubeApiServer:
      serviceMonitor:
        selector:
          k8s-app: kube-apiserver
    kubeScheduler:
      service:
        selector:
          k8s-app: kube-scheduler
    kubeControllerManager: &kubeControllerManager
      service:
        selector:
          k8s-app: kube-controller-manager
    # Re-enabled 2026-08-21: the v1.13.3→v1.13.9 Talos roll restarted etcd,
    # which picked up listen-metrics-urls=http://0.0.0.0:2381 (verified: :2381
    # /metrics answers 200 on all three masters). The controller-manager
    # selector is deliberate — those static pods are hostNetwork, so their pod
    # IPs anchor the scrape endpoints at the master node IPs.
    kubeEtcd:
      <<: *kubeControllerManager
    kubeProxy:
      enabled: false
    prometheus:
      ingress:
        enabled: true
        annotations:
          external-dns.alpha.kubernetes.io/target: internal.haynesops
          # Homepage
          gethomepage.dev/href: &url "https://prometheus.haynesops.com"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Observability
          gethomepage.dev/name: Prometheus
          gethomepage.dev/description: Metrics + queries
          gethomepage.dev/icon: prometheus
          # Needed for Kubernetes status/metrics lookup
          gethomepage.dev/app: prometheus
          # Homepage siteMonitor runs from inside the cluster; bypass auth/TLS by using the Service directly
          gethomepage.dev/siteMonitor: "http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/-/ready"
        ingressClassName: traefik-internal
        hosts: ["prometheus.haynesops.com"]
        pathType: Prefix
      prometheusSpec:
        # MIGRATION STOP (2026-08-21, remove in the follow-up PR): scaled to 0 so
        # the owner can delete the old hostpath PVC; the TSDB snapshot is already
        # staged on gasha01 NFS and gets copied into the new RBD volume after
        # Prometheus restarts on it. While this is merged the Watchdog heartbeat
        # to healthchecks.io is silent — pause that check or expect its page.
        replicas: 0
        scrapeInterval: 1m # Must match interval in Grafana Helm chart
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        enableAdminAPI: true
        walCompression: true
        enableFeatures:
          - auto-gomemlimit
          - memory-snapshot-on-shutdown
          - new-service-discovery-manager
        # Long-horizon retention on the external proxmox ceph (owner-sized
        # 2026-08-21: 2Ti cap ≈ 3.5y rolling at the measured ~1.4GB/day).
        # retentionSize is the binding cap — the time cap is deliberately above
        # it so disk, not the calendar, decides. RBD thin-provisions; the
        # volume is expandable (allowVolumeExpansion) if growth accelerates.
        retention: 5y
        retentionSize: 1800GB
        resources:
          requests:
            cpu: 500m
          limits:
            memory: 4000Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: gasha01-rbd
              resources:
                requests:
                  storage: 2Ti
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: kubernetes_node
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      metricLabelsAllowlist:
        - pods=[*]
        - deployments=[*]
        - persistentvolumeclaims=[*]
      # Flux per-resource readiness (gotk_resource_info) — Flux ≥2.1 removed
      # gotk_reconcile_condition from the controllers, so FluxReconciliationFailure
      # was querying a metric that CANNOT exist (dark since the 2.1 bump; proven
      # 2026-07-17 during the mcp-grafana 0.17.2 stall — no Alertmanager page).
      # This is the fluxcd-blessed replacement (flux2-monitoring-example): KSM
      # renders each Flux CR's Ready condition as a label on an Info metric.
      rbac:
        extraRules:
          - apiGroups: ["kustomize.toolkit.fluxcd.io", "helm.toolkit.fluxcd.io", "source.toolkit.fluxcd.io"]
            resources: ["kustomizations", "helmreleases", "gitrepositories", "ocirepositories", "helmrepositories", "helmcharts"]
            verbs: ["list", "watch"]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind: {group: kustomize.toolkit.fluxcd.io, version: v1, kind: Kustomization}
                metricNamePrefix: gotk
                metrics: &fluxResourceInfo
                  - name: resource_info
                    help: The current state of a Flux resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      suspended: [spec, suspend]
                      ready: [status, conditions, "[type=Ready]", status]
              - groupVersionKind: {group: helm.toolkit.fluxcd.io, version: v2, kind: HelmRelease}
                metricNamePrefix: gotk
                metrics: *fluxResourceInfo
              - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: GitRepository}
                metricNamePrefix: gotk
                metrics: *fluxResourceInfo
              - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: OCIRepository}
                metricNamePrefix: gotk
                metrics: *fluxResourceInfo
              - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: HelmRepository}
                metricNamePrefix: gotk
                metrics: *fluxResourceInfo
              - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: HelmChart}
                metricNamePrefix: gotk
                metrics: *fluxResourceInfo
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: kubernetes_node
    grafana:
      enabled: false
      forceDeployDashboards: true
