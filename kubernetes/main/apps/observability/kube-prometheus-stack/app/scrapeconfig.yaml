---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name node-exporter-haynestower
spec:
  # Out-of-cluster node_exporter already running on the Unraid NAS
  # (HaynesTower) — the estate's highest-value disk fleet (main Plex media
  # share, ~20TB XFS per-array-disk under /mnt/diskNN, the 80% space target).
  # Static scrape; the NAS is not a k8s node. role=nas + a distinct job keep
  # it separate from the Talos node-exporter fleet in dashboards/queries.
  staticConfigs:
    - targets:
        - haynestower.haynesnetwork:9100
      labels:
        role: nas
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: haynestower
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name smartctl-exporter-haynestower
spec:
  # Owner-installed smartctl-exporter (privileged docker, v0.14.0) on the
  # Unraid NAS. Its default --smartctl.powermode-check=standby deliberately
  # skips spun-down array disks (a whole idle array at 2AM emits no per-device
  # series), so smartctl_device_* fills in only for awake drives and grows as
  # disks wake during daytime use. The device count (smartctl_devices) is
  # always present. This standby-skip is owner-favoured — nothing here may
  # force spin-up, and dashboards/queries MUST tolerate absent per-device
  # series (sleeping disk = no data, by design).
  staticConfigs:
    - targets:
        - haynestower.haynesnetwork:9633
      labels:
        role: nas
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: haynestower
