---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: smartctl-exporter-rules
spec:
  groups:
    - name: smartctl-exporter.rules
      rules:
        - alert: SmartDeviceHighTemperature
          annotations:
            summary: Mounted drive {{ $labels.device }} on device {{ $labels.instance }}
              has a temperature higher than 65°C.
          expr: smartctl_device_temperature > 65
          for: 15m
          labels:
            severity: critical
        # KNOWN-FAILURE EXCLUSION (owner ruling 2026-07-10): haynestower nvme1+nvme2 are the
        # Cache-staging pool — Crucial P3 SSDs deliberately ridden PAST rated endurance. Their
        # SMART-status-fail + critical_warning=4 (bit 2, endurance) are KNOWN and unactionable;
        # the owner does not want repeating reminders. NEW failure modes on these same drives
        # still alert (MediaErrors / AvailableSpare / Temperature are untouched below; a critical
        # warning with any value OTHER than 4 fires). Metrics carry no serial label, so the
        # exclusion is keyed on instance+device (stable for this NAS; revisit if drives are
        # swapped/renamed). All other drives are unaffected.
        - alert: SmartDeviceTestFailed
          annotations:
            summary: Mounted drive {{ $labels.device }} on device {{ $labels.instance }}
              did not pass its SMART test.
          expr: |
            (
              smartctl_device_smart_status != 1
            or
              smartctl_device_status != 1
            )
            unless (
              smartctl_device_smart_status{instance="haynestower", device=~"nvme1|nvme2"}
            or
              smartctl_device_status{instance="haynestower", device=~"nvme1|nvme2"}
            )
          for: 15m
          labels:
            severity: critical
        - alert: SmartDeviceCriticalWarning
          annotations:
            summary: Mounted drive {{ $labels.device }} on device {{ $labels.instance }}
              is in a critical state.
          # Suppress ONLY the known endurance warning (value 4) on the two staging NVMes; a
          # different warning bit on them (value != 4) still fires as a NEW failure.
          expr: |
            smartctl_device_critical_warning != 0
            unless (
              smartctl_device_critical_warning{instance="haynestower", device=~"nvme1|nvme2"} == 4
            )
          for: 15m
          labels:
            severity: critical
        #
        # Ref: https://github.com/prometheus-community/helm-charts/blob/main/charts/prometheus-smartctl-exporter/rules/rules.txt
        #
        - alert: SmartDeviceMediaErrors
          annotations:
            summary: Mounted drive {{ $labels.device }} on device {{ $labels.instance }}
              has media errors.
          expr: smartctl_device_media_errors != 0
          for: 15m
          labels:
            severity: critical
        - alert: SmartDeviceAvailableSpareUnderThreadhold
          annotations:
            summary: Device {{ $labels.device }} on instance {{ $labels.instance }}
              is under available spare threashold.
          expr: smartctl_device_available_spare_threshold > smartctl_device_available_spare
          for: 15m
          labels:
            severity: critical
        - alert: SmartDeviceInterfaceSlow
          annotations:
            summary: Device {{ $labels.device }} on instance {{ $labels.instance }}
              interface is slower then it should be.
          expr: |
            smartctl_device_interface_speed{speed_type="current"} != on(device, instance, namespace, pod) smartctl_device_interface_speed{speed_type="max"}
          for: 15m
          labels:
            severity: critical
