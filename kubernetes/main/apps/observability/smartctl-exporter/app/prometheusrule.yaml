---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: smartctl-exporter-rules
spec:
  groups:
    - name: smartctl-exporter.rules
      rules:
        - alert: SmartDeviceHighTemperature
          annotations:
            summary: Mounted drive {{ $labels.device }} on device {{ $labels.instance }}
              has a temperature higher than 65°C.
          # Only the live reading: the exporter also publishes the drive's rated limits
          # (op_limit_max 85, critical_limit_max 95) as temperature_type series — haynes-ops#4101.
          expr: smartctl_device_temperature{temperature_type="current"} > 65
          for: 15m
          labels:
            severity: critical
            scope: host          # host/hardware — alert-responder skips LLM diagnosis
        # OP328 / owner request 2026-11-01: acknowledge ONLY the unchanged known
        # reliability-degraded mask 4 on these physical Cache-staging NVMes.
        # Oct19 serial evidence: .agents/reports/hot-nvme-2026-10-19.md.
        # B74C is now nvme0 (was nvme2); device indexes are NOT identities.
        # Bit 2 is reliability degradation, not a dedicated lifespan bit; cause unproven.
        # Require exact identity, mask, overall failure and smartctl exit 8, zero media
        # errors and the observed error-log baseline 183. Any count change (including
        # reset), extra exit/warning bits or missing/ambiguous telemetry fails closed.
        # There is no separate error-log-growth rule: changing 183 must restore alerts.
        # Independent legacy status, temperature, spare and media alerts stay enabled.
        - record: smartctl_device:known_cache_warning
          expr: |
            (smartctl_device_critical_warning{job="smartctl-exporter-haynestower", instance="haynestower"} == 4)
            and on (job, instance, device)
              (smartctl_device{job="smartctl-exporter-haynestower", instance="haynestower", model_name="CT2000P3PSSD8", serial_number=~"2331E865B76D|2331E865B74C"} == 1)
            and on (job, instance, device)
              (count by (job, instance, device) (smartctl_device{job="smartctl-exporter-haynestower", instance="haynestower"}) == 1)
            and on (job, instance, device) (smartctl_device_smart_status == 0)
            and on (job, instance, device) (smartctl_device_smartctl_exit_status == 8)
            and on (job, instance, device) (smartctl_device_media_errors == 0)
            and on (job, instance, device) (smartctl_device_num_err_log_entries == 183)
        - alert: SmartDeviceTestFailed
          annotations:
            summary: Mounted drive {{ $labels.device }} on device {{ $labels.instance }}
              did not pass its SMART test.
          expr: |
            (
              smartctl_device_smart_status != 1
              unless on (job, instance, device) smartctl_device:known_cache_warning
            )
            or
              smartctl_device_status != 1
          for: 15m
          labels:
            severity: critical
            scope: host          # host/hardware — alert-responder skips LLM diagnosis
        - alert: SmartDeviceCriticalWarning
          annotations:
            summary: Mounted drive {{ $labels.device }} on device {{ $labels.instance }}
              is in a critical state.
          # Only the exact acknowledged state above is exempt; combined masks still alert.
          expr: |
            smartctl_device_critical_warning != 0
            unless on (job, instance, device) smartctl_device:known_cache_warning
          for: 15m
          labels:
            severity: critical
            scope: host          # host/hardware — alert-responder skips LLM diagnosis
        #
        # Ref: https://github.com/prometheus-community/helm-charts/blob/main/charts/prometheus-smartctl-exporter/rules/rules.txt
        #
        - alert: SmartDeviceMediaErrors
          annotations:
            summary: Mounted drive {{ $labels.device }} on device {{ $labels.instance }}
              has media errors.
          expr: smartctl_device_media_errors != 0
          for: 15m
          labels:
            severity: critical
            scope: host          # host/hardware — alert-responder skips LLM diagnosis
        - alert: SmartDeviceAvailableSpareUnderThreadhold
          annotations:
            summary: Device {{ $labels.device }} on instance {{ $labels.instance }}
              is under available spare threashold.
          expr: smartctl_device_available_spare_threshold > smartctl_device_available_spare
          for: 15m
          labels:
            severity: critical
            scope: host          # host/hardware — alert-responder skips LLM diagnosis
        - alert: SmartDeviceInterfaceSlow
          annotations:
            summary: Device {{ $labels.device }} on instance {{ $labels.instance }}
              interface is slower then it should be.
          expr: |
            smartctl_device_interface_speed{speed_type="current"} != on(device, instance, namespace, pod) smartctl_device_interface_speed{speed_type="max"}
          for: 15m
          labels:
            severity: critical
            scope: host          # host/hardware — alert-responder skips LLM diagnosis
