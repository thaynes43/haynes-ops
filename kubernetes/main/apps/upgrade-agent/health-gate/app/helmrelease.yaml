---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: upgrade-health-gate
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      upgrade-health-gate:
        type: cronjob
        pod:
          restartPolicy: Never
        cronjob:
          schedule: "*/30 * * * *"       # aligned to Flux's ~30-min GitRepository poll
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 300
          backoffLimit: 0
          successfulJobsHistory: 3
          failedJobsHistory: 3
        containers:
          app:
            image:
              repository: ghcr.io/thaynes43/upgrade-agent
              tag: 0.1.0@sha256:300bc6124d28dbee9819b4ce38dd42e5116e65154ae6b64c4f680e618c77c875
            # Deterministic gate: run the ConfigMap-mounted script directly. No LLM,
            # no token, no git — read the six checks and page Pushover on a regression.
            command: ["/bin/bash", "/opt/gate/gate.sh"]
            env:
              PROMETHEUS_URL: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
              PERSIST_OFFSET: "10m"       # "still bad N ago" => persisted past one cycle => page
            envFrom:
              - secretRef:
                  name: upgrade-health-gate-secret
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
      # The night lane's morning summary (story 554, OP512 design comment 6193): once a day
      # at 06:30 New York, at Pushover priority -1 (no sound, still a notification). The lane
      # composes it every tick and copies it into ConfigMap upgrade-orphan-report (morning_*
      # keys), which this ServiceAccount already reads and stamps; it sends what it reads at
      # that moment, or its own "the lane wrote no summary" line. Same image, ServiceAccount,
      # secret and egress policy as the gate (its pods carry the release's name label), and
      # the same script in another mode: gate.sh morning-summary. No new access.
      # Runbook: .agents/runbooks/upgrade-night-lane.md, "The morning summary (story 554)".
      morning-summary:
        type: cronjob
        pod:
          restartPolicy: Never
        cronjob:
          schedule: "30 6 * * *"
          timeZone: America/New_York
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 1800
          backoffLimit: 0
          successfulJobsHistory: 3
          failedJobsHistory: 3
        containers:
          app:
            image:
              repository: ghcr.io/thaynes43/upgrade-agent
              tag: 0.1.0@sha256:300bc6124d28dbee9819b4ce38dd42e5116e65154ae6b64c4f680e618c77c875
            command: ["/bin/bash", "/opt/gate/gate.sh", "morning-summary"]
            env:
              MORNING_TZ: America/New_York
            envFrom:
              - secretRef:
                  name: upgrade-health-gate-secret
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      # app-template v5 defaults automountServiceAccountToken to false; the gate's
      # Flux CR reads (kubectl via the SA token) require it.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
    serviceAccount:
      upgrade-health-gate: {}
    persistence:
      gate-scripts:
        type: configMap
        name: upgrade-health-gate-scripts
        defaultMode: 0555
        globalMounts:
          - path: /opt/gate
      # Shared gate/triage coordination logic — single-sourced (see coordination-lib.sh).
      coordination-lib:
        type: configMap
        name: upgrade-coordination-lib
        defaultMode: 0555
        globalMounts:
          - path: /opt/coordination
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # ── dev-env v2 operator API transport (dev-env DESIGN-064 6.5, OpenProject #739) ──
      # The client, the CA and a token the operator API accepts. The CallerPolicy
      # dev-env-system/upgrade-agent.upgrade-health-gate sets what this account may
      # start. Story 739 starts nothing: each run makes one read-only GET /v1/sessions.
      # Moving the gate's escalation summons is #748.
      # The client (ConfigMap dev-env-api-client, built by this app's kustomization).
      # optional, here and for the CA: a missing ConfigMap leaves the directory empty
      # instead of holding the pod in ContainerCreating, which with concurrencyPolicy
      # Forbid would block every later run. Without the client (or the token) the run
      # skips its reach line silently; without the CA alone the reach line logs
      # HTTP 000. (app-template's configMap type has no optional, hence custom.)
      dev-env-api-client:
        type: custom
        volumeSpec:
          configMap:
            name: dev-env-api-client
            defaultMode: 0555
            optional: true
        advancedMounts:
          upgrade-health-gate:
            app:
              - path: /opt/dev-env-api
                readOnly: true
      # The pinned dev-env CA (public), published into upgrade-agent by dev-env-pki.
      dev-env-api-ca:
        type: custom
        volumeSpec:
          configMap:
            name: dev-env-api-ca
            defaultMode: 0444
            optional: true
            items:
              - key: ca.crt
                path: ca.crt
        advancedMounts:
          upgrade-health-gate:
            app:
              - path: /etc/dev-env
                readOnly: true
      # A projected ServiceAccount token for the operator API's audience, as the front
      # door has (dev-env-system/frontdoor/app/deployment.yaml). It is not the
      # Kubernetes API token, and the Kubernetes API does not accept it. The kubelet
      # rotates it; it expires after an hour and when the pod is deleted.
      dev-env-api-token:
        type: custom
        volumeSpec:
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: dev-env-operator
                  expirationSeconds: 3600
        advancedMounts:
          upgrade-health-gate:
            app:
              - path: /var/run/secrets/dev-env
                readOnly: true
