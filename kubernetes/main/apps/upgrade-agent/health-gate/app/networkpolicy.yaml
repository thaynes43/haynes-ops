---
# CiliumNetworkPolicy (NOT vanilla NetworkPolicy — we need toFQDNs + toEntities).
# The cluster has no other netpols, so selecting ONLY the gate pod creates a
# default-deny egress *for this pod alone*, additively. enable-l7-proxy=true is live,
# so toFQDNs + the L7 DNS rule work. Gate egress is the tightest set: DNS, apiserver,
# Prometheus, Pushover. NO GitHub, NO Anthropic, NO Home-Assistant — the gate never
# pushes, never LLMs, and no longer polls HA (device health is owned by hass-sandbox).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: upgrade-health-gate
  namespace: upgrade-agent
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: upgrade-health-gate
  egress:
    # 1. DNS via CoreDNS (required for toFQDNs). Restricted to cluster-internal names
    #    + the ONE allowlisted external, to close DNS-tunnel exfil.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              # Cilium `*` does NOT cross label boundaries: "*.cluster.local" matches
              # only single-label names under it, so multi-label service FQDNs were
              # silently unresolvable (proven live 2026-07-04 — the gate's Prometheus
              # + HA checks were BLIND since deploy). Exact matchNames for the two
              # services keep the DNS-tunnel-exfil surface closed.
              - matchPattern: "*.cluster.local"
              - matchPattern: "*.svc"
              - matchName: "kube-prometheus-stack-prometheus.observability.svc.cluster.local"
              - matchName: "api.pushover.net"
    # 2. Kube API server — the ONLY cluster read path (Flux CRs via kubectl).
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # 3. In-cluster Prometheus (checks 2-5 PromQL). NOT Loki/Grafana/Alertmanager.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # 4. Pushover — the INDEPENDENT external page channel (must not depend on the
    #    in-cluster Alertmanager the gate monitors).
    - toFQDNs:
        - matchName: api.pushover.net
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
  # No ingress rules -> all ingress denied (the gate serves nothing).
