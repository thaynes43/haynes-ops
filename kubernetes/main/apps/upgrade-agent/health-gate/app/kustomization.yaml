---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../../shared/components/common/repos/app-template
resources:
  - ./externalsecret.yaml
  - ./rbac.yaml
  - ./networkpolicy.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: upgrade-health-gate-scripts
    files:
      - resources/gate.sh
      - resources/page.sh
  # Single source of the gate/triage shared coordination logic (2026-07-06) — mounted
  # by BOTH the gate pod and the shepherd/triage pods (the shepherd ks dependsOn this
  # ks, so the CM exists before those pods reference it). Replaces the old
  # "byte-identical duplicated block" convention.
  - name: upgrade-coordination-lib
    files:
      - resources/coordination-lib.sh
      # Failure-escalation writer (backlog 12→13): executed (never sourced) by the
      # gate/shepherd/triage/responder to file esc-* entries into the work-order CM.
      - resources/escalate.sh
      # Autonomous-remediation writer (2026-08-23 "autonomy first" policy):
      # escalate.sh's quiet sibling — files rem-* orders that fix silently and
      # only reach a human by promoting themselves to esc-*.
      - resources/remediate.sh
generatorOptions:
  # Stable name so the HelmRelease can mount it by name.
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: upgrade-health-gate
