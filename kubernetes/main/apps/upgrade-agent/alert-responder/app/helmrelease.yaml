---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alert-responder
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      alert-responder:
        type: cronjob
        # Track-B1 (2026-07-06): ENRICH, DON'T ACT. Polls Alertmanager every 10 min;
        # for each NEW critical-alert incident it runs ONE read-only Claude Code
        # diagnosis and pages the result to Pushover (priority 0 — the original
        # critical already paged at 1). The human stays the actuator. Healthy path =
        # one curl, $0. At-most-once per incident; separate $15/mo spend envelope.
        # Kill switch (instant, no git):
        #   kubectl -n upgrade-agent patch cronjob alert-responder -p '{"spec":{"suspend":true}}'
        cronjob:
          suspend: false
          schedule: "*/10 * * * *"
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 300
          backoffLimit: 0
          successfulJobsHistory: 3
          failedJobsHistory: 3
        pod:
          restartPolicy: Never
        containers:
          app:
            image:
              # The shepherd image (claude + kubectl + flux + git + jq); no bot
              # initContainer here — the responder holds NO repo-write credential.
              repository: ghcr.io/thaynes43/upgrade-shepherd
              tag: 0.1.0@sha256:207159f7d80fb73d21658d608d1f6e405866ee9535bf8b47c7380a0193b5df5e
            command: ["/bin/bash", "/opt/responder/respond.sh"]
            env:
              ALERTMANAGER_URL: http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093
              PROMETHEUS_URL: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
              # NOT loki-gateway: this chart deploys gateway.replicas: 0 (Service with
              # ZERO endpoints — DNS resolves, CNP passes, every query times out =
              # silent log-blind diagnosis; caught by adversarial review 2026-07-06).
              # Every other consumer here talks to loki:3100 directly.
              LOKI_URL: http://loki.observability.svc.cluster.local:3100
              # Denylist. Skip alert classes the responder can't ADD VALUE to:
              #  - Protect.* (2026-07-09): the appdaemon Protect watchdog owns those
              #    end-to-end (detect→auto-repair→notify); the responder just double-pages.
              #  - Smart.*/Hardware.*/NodeRAIDDiskFailure (2026-07-10): HOST-HARDWARE
              #    alerts (SMART wear, fan/mem/power/RAID) — the diagnosis is self-evident
              #    from the alert, the cluster can't fix hardware, and they RECUR (each
              #    re-fire is a new incident, so at-most-once doesn't stop them). They were
              #    burning ~$0.15-0.20/diagnosis on unactionable NAS drive wear-out.
              # Keep in sync with respond.sh's default.
              RESPONDER_ALERT_DENYLIST: "^(Watchdog|InfoInhibitor|AlertmanagerReceiversNotConfigured|Protect.*|Smart.*|Hardware.*|NodeRAIDDiskFailure)$"
              # Namespace-scoped ignores (alertname@namespace, space-separated) — surgical
              # skips for KNOWN-benign recurrers without a blanket alertname denylist.
              # 2026-07-12: OOMKilled@rook-ceph = the ceph-mgr documented ~8wk memory-leak
              # self-heal OOM cycle (re-diagnosed 7x/month = $). A real OOMKilled in any
              # OTHER namespace is still diagnosed; a genuine Ceph OOM still surfaces via the
              # gate's Ceph HEALTH_ERR page. Grow this as we identify other noisy recurrers
              # (state CM + Loki logs record every diagnosis, so we can see spend triggers).
              RESPONDER_IGNORE_PAIRS: "OOMKilled@rook-ceph"
              # MODEL POLICY (2026-08-23, Tom): automated agents (responder,
              # shepherd) ALWAYS run the LATEST OPUS on the plan path. Pinned to an
              # explicit id rather than the `opus` alias — alias repoints LAG a
              # launch by days (2026-08-06: `opus` served 4.8 while claude-opus-5
              # was live) and "latest" is the whole point. Bump on an Opus launch;
              # probe first: `claude --model <id> -p 'reply with your model id'`.
              # Deliberately NOT Fable here (its plan quota is the surface Tom's own
              # dev-env work needs — and it ran out entirely on 2026-08-23).
              RESPONDER_MODEL: claude-opus-5
              # METERED path = pay-per-token: NEVER Fable, NEVER Opus (Tom's rule
              # 2026-08-23). Sonnet 5 is near-Opus quality at a fraction of the cost
              # and can dispatch a pod claude-code agent for heavy lifting.
              RESPONDER_FALLBACK_MODEL: claude-sonnet-5
              RESPONDER_MAX_PER_RUN: "1"
              # Storm/loop guards (2026-08-20: a wedged rook-ceph-cluster HR fanned
              # into ~30 FluxReconciliationFailure alerts; the responder paged 16
              # near-identical diagnoses in 2.5h, one per run, and helm-retry flapping
              # kept minting new incidents forever). Keep in sync with respond.sh.
              RESPONDER_STORM_THRESHOLD: "3"    # >=3 same-alertname incidents => ONE grouped diagnosis+page
              RESPONDER_COOLDOWN_HOURS: "6"     # same alertname@ns not re-diagnosed on resolve->refire flaps
              RESPONDER_MAX_PAGES_PER_HOUR: "3" # hard page ceiling; excess diagnoses go to logs only
              # Caps govern the METERED path only — a plan-served run is $0.
              RESPONDER_MAX_BUDGET_USD: "2.00"
              RESPONDER_MONTHLY_CAP_USD: "15"
            envFrom:
              - secretRef:
                  name: alert-responder-secret
              # Max-plan credential (2026-07-28, saga plan 07 Option A extended to
              # the responder). Same secret the shepherd uses (same namespace, same
              # 1P item). OPTIONAL on purpose: if the secret is ever absent the env
              # var is unset and respond.sh runs on the API key exactly as before.
              - secretRef:
                  name: upgrade-shepherd-plan-secret
                  optional: true
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      automountServiceAccountToken: true   # read-only cluster diagnosis via the SA
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    serviceAccount:
      alert-responder: {}
    persistence:
      responder-scripts:
        type: configMap
        name: alert-responder-scripts
        defaultMode: 0555
        globalMounts:
          - path: /opt/responder
      # Shared coordination CM (health-gate kustomization; this ks dependsOn it) —
      # the responder only EXECUTES escalate.sh from it (failure escalation,
      # backlog 12→13); it does not source the gate/triage coordination logic.
      coordination-lib:
        type: configMap
        name: upgrade-coordination-lib
        defaultMode: 0555
        globalMounts:
          - path: /opt/coordination
      # HOME + CLAUDE_CONFIG_DIR + the anonymous shallow clone (readOnlyRootFilesystem).
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
