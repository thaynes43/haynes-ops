---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../../shared/components/common/repos/app-template
resources:
  - ./pvc.yaml
  - ./externalsecret.yaml
  - ./rbac.yaml
  - ./networkpolicy.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: dev-env-ops-scripts
    files:
      - resources/ops-init.sh
      - resources/work-order-watch.sh
      - resources/session-launch.sh
      - resources/order-status.sh
      - resources/publish-report.sh
      - resources/ops-reap.sh
      - resources/ops-log.sh
      - resources/ops-digest.sh
      - resources/dev-activity-check.sh
      - resources/gh-token-refresh.sh
      - resources/ops-claude.md
      - resources/cigar-curation.md
generatorOptions:
  # Stable name so the HelmRelease can mount it by name.
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: dev-env-ops
