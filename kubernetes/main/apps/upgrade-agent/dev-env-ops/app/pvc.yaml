---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dev-env-ops-home
  annotations:
    # Survives Kustomization renames/moves (see .agents/rules/flux-pvc-prune-safety.md):
    # holds claude session state + worktrees for joinable post-mortem sessions.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ceph-block
  resources:
    requests:
      storage: 20Gi
