---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-ops
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-ops-secret
  data:
    # Failure paging ONLY (quiet-on-success is the contract — Tom 2026-08-20):
    # same Pushover app the gate/responder use.
    - secretKey: PUSHOVER_TOKEN
      remoteRef: { key: upgrade-gate, property: PUSHOVER_TOKEN }
    - secretKey: PUSHOVER_USER_KEY
      remoteRef: { key: upgrade-gate, property: PUSHOVER_USER_KEY }
    # Cigar-journal MCP curation token (curation:read/write, minted with the
    # owner's one-time admin consent — cigar-journal #126). Sessions read it
    # from the environment; re-consent + 1P update on expiry.
    - secretKey: CIGAR_MCP_TOKEN
      remoteRef: { key: cigar-curation, property: CIGAR_MCP_TOKEN }
