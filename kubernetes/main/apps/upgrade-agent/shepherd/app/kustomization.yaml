---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../../shared/components/common/repos/app-template
resources:
  - ./externalsecret.yaml
  - ./rbac.yaml
  - ./networkpolicy.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: upgrade-shepherd-scripts
    files:
      - resources/run-shepherd.sh
      - resources/triage.sh
      - resources/silence.sh
      - resources/work-order.sh
      # upgrade-night (OP512 step 1, dry-run): classifier, rules registry, tick.
      - resources/lane-classify.mjs
      - resources/upgrade-rules.json
      - resources/run-night.mjs
      # upgrade-night (story 752): the merge step, the change lock and the hand-run CLI.
      - resources/night-merge.mjs
      # upgrade-night (story 593): the history (ConfigMap upgrade-ledger), and the record
      # format it is a thin layer over: byte-identical copies of scripts/upgrade-agent/schema/
      # (record-format-selftest.mjs fails on any drift).
      - resources/upgrade-history.mjs
      - resources/record-format.mjs
      - resources/upgrade-item.v1.schema.json
      - resources/upgrade-event.v1.schema.json
      - resources/upgrade-states.v1.json
      - resources/lane-v1-to-item-v1.json
      # upgrade-night (story 553): the read-only verifier of each merge (practice verdicts in
      # upgrade-lane-state; the lane's own merges become history events only when enabled).
      - resources/night-verify.mjs
      # upgrade-night (story 554): the lane's claim on a regression signature in
      # upgrade-remediation-state (read-only in dry-run and practice), and the morning
      # summary the health gate's 06:30 CronJob sends.
      - resources/night-claim.mjs
      - resources/night-summary.mjs
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: upgrade-shepherd
