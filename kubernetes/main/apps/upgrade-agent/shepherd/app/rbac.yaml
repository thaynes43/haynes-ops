---
# The shepherd VERIFIES/diagnoses read-only — its only WRITE path is git push -> a PR
# -> Flux (never a direct cluster write). So it reuses the gate's read-only ClusterRole
# `upgrade-health-gate` (get/list/watch only; no secrets/exec/log/write) via a new
# binding for the shepherd's own ServiceAccount. No new permissions are granted.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: &app upgrade-shepherd
  labels:
    app.kubernetes.io/instance: *app
    app.kubernetes.io/name: *app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: upgrade-health-gate # the shared read-only role (defined by the gate)
subjects:
  - kind: ServiceAccount
    name: *app
    namespace: upgrade-agent
---
# The shepherd's cluster writes, both confined to TWO runtime ConfigMaps in its OWN
# namespace (deliberately NOT the read-only ClusterRole, which denies configmaps — a
# tightly namespaced Role):
#   * upgrade-shepherd-spend       — the monthly-spend counter (run-shepherd.sh).
#   * upgrade-remediation-state    — the Phase-D remediation-gating coordination state
#                                    (triage.sh owns class/attempted/result; the gate reads
#                                    it and stamps last_paged via its OWN name-scoped Role).
# Both are runtime state (create-or-updated at runtime, NOT Flux-managed — Flux would
# revert them). This Role is namespace-scoped rather than name-scoped BECAUSE it needs
# `create` (RBAC cannot restrict create by resourceName) for both CMs. Nothing
# security-relevant lives in upgrade-agent; this grants no reach into any app namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: upgrade-shepherd-spend
  namespace: upgrade-agent
  labels:
    app.kubernetes.io/name: upgrade-shepherd
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: upgrade-shepherd-spend
  namespace: upgrade-agent
  labels:
    app.kubernetes.io/name: upgrade-shepherd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: upgrade-shepherd-spend
subjects:
  - kind: ServiceAccount
    name: upgrade-shepherd
    namespace: upgrade-agent
