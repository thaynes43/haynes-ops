---
# The shepherd VERIFIES/diagnoses read-only — its only WRITE path is git push -> a PR
# -> Flux (never a direct cluster write). So it reuses the gate's read-only ClusterRole
# `upgrade-health-gate` (get/list/watch only; no secrets/exec/log/write) via a new
# binding for the shepherd's own ServiceAccount. No new permissions are granted.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: &app upgrade-shepherd
  labels:
    app.kubernetes.io/instance: *app
    app.kubernetes.io/name: *app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: upgrade-health-gate # the shared read-only role (defined by the gate)
subjects:
  - kind: ServiceAccount
    name: *app
    namespace: upgrade-agent
---
# The ONE cluster write the shepherd has: manage its own monthly-spend counter
# ConfigMap (upgrade-shepherd-spend) in its OWN namespace. Deliberately NOT the
# read-only ClusterRole (which denies configmaps) — a tightly namespaced Role. This CM
# is runtime state (create-or-updated by run-shepherd.sh, not Flux-managed). Nothing
# security-relevant lives in upgrade-agent; this grants no reach into any app namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: upgrade-shepherd-spend
  namespace: upgrade-agent
  labels:
    app.kubernetes.io/name: upgrade-shepherd
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: upgrade-shepherd-spend
  namespace: upgrade-agent
  labels:
    app.kubernetes.io/name: upgrade-shepherd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: upgrade-shepherd-spend
subjects:
  - kind: ServiceAccount
    name: upgrade-shepherd
    namespace: upgrade-agent
