---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: upgrade-shepherd
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      upgrade-shepherd:
        type: cronjob
        # PHASE D LIVE (2026-07-03): scheduled unattended auto-merge, ONE PR/day max,
        # scope-constrained by UPGRADE_AGENT_PROMPT below — the stateless clean-rollback
        # tier PLUS immich MAJORS (2026-07-05; backup-gated auto-merge for a pure major,
        # author-only if it needs a supporting edit). Non-cluster-breaker LEAF apps
        # (incl. immich minor/patch) auto-merge via Renovate Tier-2, not here.
        # Server-side safety: the bot is non-admin/non-bypass — `gh pr merge --auto`
        # only queues; GitHub merges only when Flux Local AND Diff Scope are green.
        # Kill switch (instant, no git):
        #   kubectl -n upgrade-agent patch cronjob upgrade-shepherd -p '{"spec":{"suspend":true}}'
        # One-off summon (any mode) still works per .agents/runbooks/upgrade-shepherd.md.
        cronjob:
          suspend: false
          schedule: "0 9 * * *"         # daily 09:00 ET — Flux applies ~09:30, gate watches all day
          concurrencyPolicy: Forbid
          backoffLimit: 0
          successfulJobsHistory: 3
          failedJobsHistory: 3
        pod:
          restartPolicy: Never
        initContainers:
          # Mint a short-lived (1h) installation token from the bot PEM and hand ONLY
          # the token to the main container via the shared /creds emptyDir. The PEM
          # lives ONLY in this initContainer's env — never in the LLM container.
          mint-token:
            image:
              repository: ghcr.io/thaynes43/upgrade-shepherd
              tag: 0.1.0@sha256:8b8bc5e2ab9d5cb81ca4f90115f17881c83e68504fd569280d1588a62177a7df
            command:
              - /bin/bash
              - -c
              - /opt/upgrade-shepherd/github-app-token.sh > /creds/gh_token && chmod 0400 /creds/gh_token
            env:
              # Down-scope to exactly what opening a PR needs — NOT merge-capable at
              # the endpoint level is impossible (GitHub bundles merge into PRs:write),
              # so merge-prevention is enforced by the run script's allowlist.
              GITHUB_BOT_TOKEN_PERMISSIONS: '{"contents":"write","pull_requests":"write","checks":"read"}'
            envFrom:
              - secretRef:
                  name: upgrade-shepherd-bot-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
        containers:
          app:
            image:
              repository: ghcr.io/thaynes43/upgrade-shepherd
              tag: 0.1.0@sha256:8b8bc5e2ab9d5cb81ca4f90115f17881c83e68504fd569280d1588a62177a7df
            command: ["/bin/bash", "/opt/shepherd/run-shepherd.sh"]
            env:
              UPGRADE_AGENT_MODE: auto     # Phase D: vet + `gh pr merge --auto` (server-side gated)
              UPGRADE_AGENT_MODEL: sonnet
              # THE RAMP (single definition, 2026-07-06): a component list. The path
              # map lives in run-shepherd.sh (ramp_globs_for) and derives the
              # deterministic pre-filter globs; the run also asserts every component
              # here is named in UPGRADE_AGENT_PROMPT below and REFUSES to vet (fail
              # closed, gate pages) on drift — the old two-place glob/prompt lockstep
              # footgun is gone. Widen one component at a time (docs/renovate/README.md
              # tracks the ramp) + /kyverno-verify after each. Manual/targeted summons
              # must clear this var (and UPGRADE_AGENT_PREFILTER_GLOBS if set) to
              # bypass the pre-filter.
              UPGRADE_AGENT_RAMP: coredns traefik multus device-plugins flux immich-major
              # The LLM's merge scope + per-class rules live here — every ramp
              # component above must be named in this prompt (checked at run start).
              UPGRADE_AGENT_PROMPT: >-
                You are the Tier-4 upgrade shepherd in AUTO mode (scheduled, unattended).
                Follow .agents/runbooks/upgrade-shepherd.md.
                AUTO-MERGE SCOPE (current ramp) — two classes:
                (1) STATELESS clean-tier: coredns, traefik, multus, device-plugins, flux
                — any pure version/chart/digest bump (incl. minor). No backup needed.
                (2) STATEFUL — immich MAJORS (kubernetes/main/apps/photos/immich).
                Renovate auto-merges immich MINOR/PATCH itself now — if the only in-scope
                immich PR is a minor/patch, LEAVE it (Renovate owns it, do not act). You
                own immich MAJORS: after the BACKUP GATE passes (recent <24h backup of its
                DB cluster postgres16-pgvecto per the append-system-prompt rule; if none,
                HOLD), a major that is a PURE image bump needing NO supporting edit is
                treated like class (1) and auto-merged; a major needing a supporting
                values edit is authored for review (diff-scope holds it for a human).
                Survey open Renovate PRs (gh pr list); pick the NEXT in-scope PR by the
                runbook merge-order table. CONSULT .renovate/holds.json5 FIRST — skip
                anything held. Read the release notes and the component playbook
                (.agents/runbooks/tier4-component-playbooks.md). If it is an in-scope pure
                bump needing NO supporting edit (immich majors: one that clears the backup
                gate): enable auto-merge with
                gh pr merge <N> --auto --squash --delete-branch (GitHub merges only when
                Flux Local AND Diff Scope are both green). If it needs a supporting edit:
                author it on a NEW branch shepherd/<pkg>-<version>, open a PR (diff-scope
                holds it for human review), do NOT enable auto-merge — EXCEPT the one
                TYPED shape diff-scope now admits (pattern 1): when the ONLY supporting
                edit is restoring automountServiceAccountToken: true (plus its bare
                defaultPodOptions: parent if absent) in a helmrelease.yaml that ALREADY
                declares serviceAccount:, author bump+edit on one branch and DO enable
                auto-merge; any other shape stays human-review. Everything out of
                scope — the cluster-breakers (cnpg, rook-ceph, ceph-csi-drivers, cilium,
                authentik, emqx, dragonfly-operator, cert-manager, external-secrets) and
                any non-ramp component's major: leave untouched, just list it in your
                summary. NEVER merge immediately, NEVER use --admin, NEVER push to main,
                stay inside kubernetes/**. AT MOST ONE auto-merge per run, then stop and
                summarize.
              # ANTHROPIC_API_KEY comes from the LLM secret ONLY (never the bot secret).
              ANTHROPIC_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: upgrade-shepherd-llm-secret
                    key: ANTHROPIC_API_KEY
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
      # ── Phase 4b.3 auto-summon (LIVE 2026-07-03) ───────────────────────────────
      # Deterministic (no-LLM) triage: every 30 min, summon MODE=remediate ONLY when a
      # regression correlates with a recent merge to main (healthy path = $0, proven).
      # Reuses the shared SA/secrets/CNP/volumes; spend-guarded in run-shepherd.sh.
      # Kill switch (instant, no git):
      #   kubectl -n upgrade-agent patch cronjob upgrade-shepherd-triage -p '{"spec":{"suspend":true}}'
      triage:
        type: cronjob
        cronjob:
          suspend: false
          schedule: "*/30 * * * *"
          concurrencyPolicy: Forbid
          backoffLimit: 0
          successfulJobsHistory: 3
          failedJobsHistory: 3
        pod:
          restartPolicy: Never
        initContainers:
          mint-token:
            image:
              repository: ghcr.io/thaynes43/upgrade-shepherd
              tag: 0.1.0@sha256:8b8bc5e2ab9d5cb81ca4f90115f17881c83e68504fd569280d1588a62177a7df
            command:
              - /bin/bash
              - -c
              - /opt/upgrade-shepherd/github-app-token.sh > /creds/gh_token && chmod 0400 /creds/gh_token
            env:
              GITHUB_BOT_TOKEN_PERMISSIONS: '{"contents":"write","pull_requests":"write","checks":"read"}'
            envFrom:
              - secretRef:
                  name: upgrade-shepherd-bot-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
        containers:
          triage:
            image:
              repository: ghcr.io/thaynes43/upgrade-shepherd
              tag: 0.1.0@sha256:8b8bc5e2ab9d5cb81ca4f90115f17881c83e68504fd569280d1588a62177a7df
            command: ["/bin/bash", "/opt/shepherd/triage.sh"]
            env:
              UPGRADE_AGENT_MODEL: sonnet
              TRIAGE_MERGE_LOOKBACK_HOURS: "3"
              # ANTHROPIC_API_KEY needed only if triage decides to summon remediate.
              ANTHROPIC_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: upgrade-shepherd-llm-secret
                    key: ANTHROPIC_API_KEY
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      automountServiceAccountToken: true   # read-only cluster diagnosis via the SA
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    serviceAccount:
      upgrade-shepherd: {}
    persistence:
      # Minted token handoff (init writes, main reads) — shared, in-memory.
      creds:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /creds
      # The auditable run script (ConfigMap).
      shepherd-scripts:
        type: configMap
        name: upgrade-shepherd-scripts
        defaultMode: 0555
        globalMounts:
          - path: /opt/shepherd
      # Shared gate/triage coordination logic — single-sourced from the health-gate
      # kustomization (this ks dependsOn it, so the CM exists first).
      coordination-lib:
        type: configMap
        name: upgrade-coordination-lib
        defaultMode: 0555
        globalMounts:
          - path: /opt/coordination
      # HOME + CLAUDE_CONFIG_DIR + the shallow clone (readOnlyRootFilesystem).
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
