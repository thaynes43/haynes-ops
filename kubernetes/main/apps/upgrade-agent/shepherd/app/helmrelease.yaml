---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: upgrade-shepherd
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      upgrade-shepherd:
        type: cronjob
        # PHASE D LIVE (2026-07-03): scheduled unattended auto-merge, ONE PR/day max,
        # scope-constrained by UPGRADE_AGENT_PROMPT below to the clean-rollback tier.
        # Server-side safety: the bot is non-admin/non-bypass — `gh pr merge --auto`
        # only queues; GitHub merges only when Flux Local AND Diff Scope are green.
        # Kill switch (instant, no git):
        #   kubectl -n upgrade-agent patch cronjob upgrade-shepherd -p '{"spec":{"suspend":true}}'
        # One-off summon (any mode) still works per .agents/runbooks/upgrade-shepherd.md.
        cronjob:
          suspend: false
          schedule: "0 9 * * *"         # daily 09:00 ET — Flux applies ~09:30, gate watches all day
          concurrencyPolicy: Forbid
          backoffLimit: 0
          successfulJobsHistory: 3
          failedJobsHistory: 3
        pod:
          restartPolicy: Never
        initContainers:
          # Mint a short-lived (1h) installation token from the bot PEM and hand ONLY
          # the token to the main container via the shared /creds emptyDir. The PEM
          # lives ONLY in this initContainer's env — never in the LLM container.
          mint-token:
            image:
              repository: ghcr.io/thaynes43/upgrade-shepherd
              tag: 0.1.0@sha256:afc88385606560ae21b3963e4baf53a82a84a9091bc02cf5bae147b4b4577e50
            command:
              - /bin/bash
              - -c
              - /opt/upgrade-shepherd/github-app-token.sh > /creds/gh_token && chmod 0400 /creds/gh_token
            env:
              # Down-scope to exactly what opening a PR needs — NOT merge-capable at
              # the endpoint level is impossible (GitHub bundles merge into PRs:write),
              # so merge-prevention is enforced by the run script's allowlist.
              GITHUB_BOT_TOKEN_PERMISSIONS: '{"contents":"write","pull_requests":"write","checks":"read"}'
            envFrom:
              - secretRef:
                  name: upgrade-shepherd-bot-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
        containers:
          app:
            image:
              repository: ghcr.io/thaynes43/upgrade-shepherd
              tag: 0.1.0@sha256:afc88385606560ae21b3963e4baf53a82a84a9091bc02cf5bae147b4b4577e50
            command: ["/bin/bash", "/opt/shepherd/run-shepherd.sh"]
            env:
              UPGRADE_AGENT_MODE: auto     # Phase D: vet + `gh pr merge --auto` (server-side gated)
              UPGRADE_AGENT_MODEL: sonnet
              # Deterministic PRE-FILTER (cost control): the scheduled run invokes the
              # paid LLM ONLY when an open Renovate PR touches one of these ramp path
              # prefixes; a quiet day exits $0 with no clone + no LLM. This is the
              # SECOND half of the ramp definition — keep it in lockstep with the
              # component names in UPGRADE_AGENT_PROMPT below (widen BOTH together).
              # Manual/targeted summons must clear this var to bypass the filter.
              UPGRADE_AGENT_PREFILTER_GLOBS: >-
                kubernetes/main/apps/kube-system/coredns/
                kubernetes/edge/apps/kube-system/coredns/
                kubernetes/main/apps/network/traefik/
                kubernetes/main/apps/network/multus/
                kubernetes/main/apps/kube-system/generic-device-plugin/
                kubernetes/main/apps/kube-system/intel-device-plugin/
                kubernetes/main/apps/kube-system/nvidia-device-plugin/
                kubernetes/main/flux/
                kubernetes/edge/flux/
              # The auto-merge RAMP lives here: widen the component list one entry at a
              # time as each proves quiet (docs/renovate/README.md tracks the ramp), and
              # re-run /kyverno-verify after each widening.
              UPGRADE_AGENT_PROMPT: >-
                You are the Tier-4 upgrade shepherd in AUTO mode (scheduled, unattended).
                Follow .agents/runbooks/upgrade-shepherd.md.
                AUTO-MERGE SCOPE (current ramp): pure version/chart/digest bumps for
                coredns, traefik, multus, device-plugins, and flux ONLY — no majors,
                no other components, nothing that needs a supporting values edit.
                Survey open Renovate PRs (gh pr list); pick the NEXT in-scope PR by the
                runbook merge-order table. CONSULT .renovate/holds.json5 FIRST — skip
                anything held. Read the release notes and the component playbook
                (.agents/runbooks/tier4-component-playbooks.md). If it is a pure bump
                needing NO supporting edit: enable auto-merge with
                gh pr merge <N> --auto --squash --delete-branch (GitHub merges only when
                Flux Local AND Diff Scope are both green). If an IN-SCOPE component needs
                a supporting edit: author it on a NEW branch shepherd/<pkg>-<version>,
                open a PR for HUMAN merge, and do NOT enable auto-merge on it. Everything
                out of scope (majors, cnpg, rook-ceph, ceph-csi-drivers, cilium,
                authentik, emqx, dragonfly-operator, the home-assistant pod group): leave
                untouched, just list it in your summary. NEVER merge immediately, NEVER
                use --admin, NEVER push to main, stay inside kubernetes/**. AT MOST ONE
                auto-merge per run, then stop and summarize.
              # ANTHROPIC_API_KEY comes from the LLM secret ONLY (never the bot secret).
              ANTHROPIC_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: upgrade-shepherd-llm-secret
                    key: ANTHROPIC_API_KEY
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
      # ── Phase 4b.3 auto-summon (LIVE 2026-07-03) ───────────────────────────────
      # Deterministic (no-LLM) triage: every 30 min, summon MODE=remediate ONLY when a
      # regression correlates with a recent merge to main (healthy path = $0, proven).
      # Reuses the shared SA/secrets/CNP/volumes; spend-guarded in run-shepherd.sh.
      # Kill switch (instant, no git):
      #   kubectl -n upgrade-agent patch cronjob upgrade-shepherd-triage -p '{"spec":{"suspend":true}}'
      triage:
        type: cronjob
        cronjob:
          suspend: false
          schedule: "*/30 * * * *"
          concurrencyPolicy: Forbid
          backoffLimit: 0
          successfulJobsHistory: 3
          failedJobsHistory: 3
        pod:
          restartPolicy: Never
        initContainers:
          mint-token:
            image:
              repository: ghcr.io/thaynes43/upgrade-shepherd
              tag: 0.1.0@sha256:afc88385606560ae21b3963e4baf53a82a84a9091bc02cf5bae147b4b4577e50
            command:
              - /bin/bash
              - -c
              - /opt/upgrade-shepherd/github-app-token.sh > /creds/gh_token && chmod 0400 /creds/gh_token
            env:
              GITHUB_BOT_TOKEN_PERMISSIONS: '{"contents":"write","pull_requests":"write","checks":"read"}'
            envFrom:
              - secretRef:
                  name: upgrade-shepherd-bot-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
        containers:
          triage:
            image:
              repository: ghcr.io/thaynes43/upgrade-shepherd
              tag: 0.1.0@sha256:afc88385606560ae21b3963e4baf53a82a84a9091bc02cf5bae147b4b4577e50
            command: ["/bin/bash", "/opt/shepherd/triage.sh"]
            env:
              UPGRADE_AGENT_MODEL: sonnet
              TRIAGE_MERGE_LOOKBACK_HOURS: "3"
              # ANTHROPIC_API_KEY needed only if triage decides to summon remediate.
              ANTHROPIC_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: upgrade-shepherd-llm-secret
                    key: ANTHROPIC_API_KEY
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      automountServiceAccountToken: true   # read-only cluster diagnosis via the SA
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    serviceAccount:
      upgrade-shepherd: {}
    persistence:
      # Minted token handoff (init writes, main reads) — shared, in-memory.
      creds:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /creds
      # The auditable run script (ConfigMap).
      shepherd-scripts:
        type: configMap
        name: upgrade-shepherd-scripts
        defaultMode: 0555
        globalMounts:
          - path: /opt/shepherd
      # HOME + CLAUDE_CONFIG_DIR + the shallow clone (readOnlyRootFilesystem).
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
