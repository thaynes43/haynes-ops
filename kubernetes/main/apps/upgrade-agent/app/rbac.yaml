---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: upgrade-unifi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: upgrade-unifi
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["unifi-inventory"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: upgrade-unifi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: upgrade-unifi
subjects:
  - kind: ServiceAccount
    name: upgrade-unifi
    namespace: upgrade-agent
