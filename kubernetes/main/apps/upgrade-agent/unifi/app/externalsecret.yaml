---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: upgrade-unifi
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: upgrade-unifi-secret
  data:
    - secretKey: MCP_AUTH_TOKEN
      remoteRef:
        key: unifi-mcp
        property: MCP_AUTH_TOKEN
    - secretKey: PLEX_TOKEN
      remoteRef:
        key: homepage
        property: HAYNESKUBE_PLEX_API_KEY
    - secretKey: PLEXOPS_TOKEN
      remoteRef:
        key: homepage
        property: HAYNESOPS_PLEX_API_KEY
    - secretKey: HAYNESTOWER_TOKEN
      remoteRef:
        key: homepage
        property: HAYNESTOWER_PLEX_API_KEY
