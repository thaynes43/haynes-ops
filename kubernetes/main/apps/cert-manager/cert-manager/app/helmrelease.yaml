---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta1.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: cert-manager
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
    replicaCount: 3
    extraArgs:
      - --dns01-recursive-nameservers=1.1.1.1:53,9.9.9.9:53
      - --dns01-recursive-nameservers-only
    podDnsPolicy: None
    podDnsConfig:
      nameservers:
        - 1.1.1.1
        - 9.9.9.9
    # #3389: requests sized from Prometheus (7d p95, 30d peak); no CPU limits.
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
      limits:
        memory: 320Mi
    cainjector:
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 384Mi
    webhook:
      resources:
        requests:
          cpu: 100m
          memory: 48Mi
        limits:
          memory: 192Mi
