---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The shelf (thaynes43/dev-env DESIGN-001 D-67): one pod in dev-agents that mounts only
# the shared volume and runs `agentd shelf`. The operator lists, holds and prunes the
# rescue bundles there by exec. Stateless: pruning this Kustomization removes the pod,
# never the volume (that claim lives in dev-env-shared, prune disabled).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app dev-env-shelf
  namespace: dev-env-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: dev-env-shared
    - name: dev-env-network
  path: ./kubernetes/main/apps/dev-env-system/shelf/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
