---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Spike S-12, the baseline guard (dev-env DESIGN-001 section 13, D-19; KICKOFF section 2,
# group 2): one Job in dev-agents that runs as the agent ServiceAccount and tries each
# haynes-ops #3392 path and each runbook action against ../rbac and the Kyverno exec
# guard. TEMPORARY: a follow-up PR removes this Kustomization once the result is recorded
# in the dev-env repo. Every write in the script is a server-side dry run.
#
# wait: true, so a failed check (the script exits non-zero) shows as this Kustomization
# not Ready. Read the result with `kubectl -n dev-agents logs job/s12-baseline-guard`.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app dev-env-s12
  namespace: dev-env-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: dev-env-rbac
      namespace: dev-env-system
    - name: kyverno-policies
      namespace: kyverno
  path: ./kubernetes/main/apps/dev-env-system/rbac-s12/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  wait: true
  interval: 30m
  timeout: 10m
  # NO postBuild.substitute: the script's shell ${VAR} syntax must reach the pod as written.
