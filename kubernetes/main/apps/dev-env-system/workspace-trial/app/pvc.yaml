---
# Disposable synthetic Git/build fixture only; never dev-env-shared or a v1 claim.
# Intentionally NOT prune-protected: the reviewed cleanup removes this GitOps app
# after the bounded Jobs exit. StorageClass Delete reclaims only this new volume.
# No real repositories, credentials, enrollment or conversation state belongs here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dev-env-workspace-cephfs-trial
  namespace: dev-agents
  labels:
    dev-env.haynesops.com/purpose: disposable-workspace-trial
spec:
  accessModes: [ReadWriteMany]
  volumeMode: Filesystem
  storageClassName: ceph-filesystem
  resources:
    requests:
      storage: 1Gi
