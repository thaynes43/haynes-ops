---
apiVersion: batch/v1
kind: Job
metadata:
  name: dev-env-h7-metadata-audit-1013a
  namespace: dev-env-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  backoffLimit: 0
  completions: 1
  parallelism: 1
  podReplacementPolicy: Failed
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dev-env-h7-metadata-reader
    spec:
      serviceAccountName: dev-env-h7-metadata-reader
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 5
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [talosw01, talosw02, talosw03]
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: metadata-audit
          # Immutable v2.15.1 source2da15bf installs /usr/bin/python3. No agent entrypoint.
          image: ghcr.io/thaynes43/dev-env:2.83.0@sha256:91d5a0a8443533123e1f68e64c604ec04a72bbad8b9682b0b92d895c4bd2e81c
          command: [/usr/bin/python3, -I, -B, /audit/collector.py]
          workingDir: /audit
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          volumeMounts:
            - name: audit
              mountPath: /audit
              readOnly: true
            - name: own-api
              mountPath: /var/run/h7-api
              readOnly: true
      volumes:
        - name: audit
          configMap:
            name: dev-env-h7-metadata-reader
            defaultMode: 0444
        - name: own-api
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
