---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-env-h7-metadata-audit
  namespace: dev-env-system
spec:
  path: ./kubernetes/main/apps/dev-env-system/h7-metadata-audit/app
  prune: false
  force: false
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  wait: false
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: dev-env-h7-metadata-audit-1013a
      namespace: dev-env-system
  interval: 30m
  timeout: 5m
  dependsOn:
    - name: dev-env-h7-metadata-reader
    - name: dev-env-shelf
