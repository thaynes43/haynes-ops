---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Durable volumes in a storage-only Kustomization with pruning OFF: the shared
# volume (DESIGN-001 D-22, Q-05) holds Claude's memory, rescue bundles (D-10) and
# task logs; the history archive is dev-env DESIGN-025 section 7. Pruning a PVC
# with a Delete reclaim policy loses its data (.agents/rules/flux-pvc-prune-safety.md).
# Both claims carry the prune-disabled annotation as well.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app dev-env-shared
  namespace: dev-env-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/main/apps/dev-env-system/storage/app
  prune: false
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  wait: true
  interval: 30m
  timeout: 5m
