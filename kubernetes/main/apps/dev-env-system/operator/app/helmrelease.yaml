---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# dev-env-operator (DESIGN-001 3.1, D-01, D-46; KICKOFF 8.9): the v2 control plane.
# Two replicas with leader election: only the leader reconciles AgentSessions, every
# replica serves the /v1 API on 8443.
#
# UPGRADING THIS NEVER TOUCHES A SESSION (DESIGN-001 5.1, D-03): session pods and volumes
# are owned by their AgentSession, never by this Deployment, and the CRDs live in
# dev-env-crds with pruning off. A rollout, a rollback or an uninstall of this release
# leaves every running session alone, so the image may roll at any time.
#
# The ServiceAccount, its Roles and the TokenReview ClusterRole come from dev-env-rbac
# (8.4); this release creates no ServiceAccount and no RBAC.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dev-env-operator
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      # The ServiceAccount is dev-env-rbac's (8.4).
      createDefaultServiceAccount: false
    controllers:
      dev-env-operator:
        replicas: 2
        # app-template's default is Recreate; roll one replica at a time so the API
        # stays up through an upgrade.
        strategy: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
        serviceAccount:
          name: dev-env-operator
        # Keep one replica serving the API through a node drain.
        podDisruptionBudget:
          minAvailable: 1
        pod:
          # Keep serving fresh authority while terminating service endpoints
          # withdraw, then drain the existing 16s native request envelope.
          # This is the existing default grace, not additional task budget.
          terminationGracePeriodSeconds: 30
          # DESIGN-001 7.1: the operator is tiny and may run anywhere; its two replicas
          # spread across zones m and w, so one node class going away leaves the API up.
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              matchLabelKeys:
                - pod-template-hash
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: *app
        containers:
          app:
            lifecycle:
              preStop:
                sleep:
                  seconds: 5
            image:
              repository: ghcr.io/thaynes43/dev-env-operator
              # Source 3e3e93d3cace4d8a02af08c442f80aae557d0e68 (v2.63.1; dev-env#634/#635/#636 and Kubernetes client-library patch #638).
              # Publish40810610315 succeeded; this exact digest was independently keyless-verified against dev-env publish.yml on main.
              # Four unfinished children per parent/canonical agent; unknown legacy agents charge every bucket. Existing admission/depth/profile rules and replica-local race limitation remain.
              # Operator image only: flags, pilot/worker images, templates, permissions, volumes and existing Session pods stay unchanged.
              # Source 3a22ca9b0463279d1fa312c14538a996d2096838 (v2.63.0, dev-env#632/#633); publish.yml40793043582 signed and verified this exact digest.
              # The #4390 binary-only installation left the new Codex TASK selector off. The separate future parent/key configuration below now enables it without starting a Session.
              # Existing RC automatic-drain guard, all current flags/pilot mapping, templates/worker images, mounts, permissions and rollout strategy are unchanged; this pin starts or replaces no agent Session.
              # Source 397f688ef1dfdfc433ee967bbcbde148578f1f60 (v2.62.1, dev-env#630/#631); publish.yml 40783327912 operator job signed and verified this digest.
              # Remote Control sessions are excluded from automatic template-revision drain, including the uncached pre-stop check; already-stopped recovery and explicit owner lifecycle operations remain supported.
              # Only this operator image moves. All flags, templates, task-worker/pilot images, mounts and permissions stay unchanged; no RC adoption, restart or new session is requested.
              # Intervening Reminder API remains default-off without its CRD/Role; no reminders flag is enabled. Existing rescue diagnostics and exact Codex model admission ship with the reviewed release.
              # Source fd89b72e6eac3eaca8868406031358a29c1d0514 (v2.52.0, release #592); publish.yml run 40616512876 signed and verified keyless (Sign the image, Verify the signature: success); digest re-checked on ghcr by tag.
              # v2.52.0 adds (all default off, none enabled by this pin): attested grants (D-88, dev-env#586: --enable-grant-attestation on the operator API, --enable-attested-grants on the broker; GrantPolicy spec.attested), hw-ssh credential grants (D-89, dev-env#590: --enable-hw-ssh-grants on the broker and the keeper), the usage unit B backend (dev-env#588), and the opwork link. CRD changes: credentialjobs, grantpolicies and agentsessions, so dev-env-crds must carry the v2.52.0 schemas first (haynes-ops PR "CRDs for v2.52.0"). Only the operator moves in this file; the broker and keeper pins move in the same PR.
              # Source 11be6eda454d34904e053a0d01c0ba13bfa5d749 (v2.50.0, dev-env#580 and #582, release #581, 2026-10-27); Publish 40597197081 signed/verified.
              # 11be6ed adds the default-off portal launch route (dev-env#580). It registers only with --portal-launch-repo plus a required --portal-launch-profile; neither is set here, so nothing new is served. No controller, templates, API type or CRD change. Only the operator moves.
              # Source e1f91a09ddb02dc63f00b78a5475d805c899b0e5 (v2.49.0, dev-env#578 and release #579, 2026-10-27); Publish 40576369070 signed/verified.
              # e1f91a0 adds the Remote Control entry to the portal reader's view=activity summary (dev-env#578): the state word, plus the link only as exactly https://claude.ai/code/session_<id>; never the name or session id. Read-only; no new route, flag or RBAC. The portal must already run v2.49.0 (haynes-ops#4357): older portals refuse the new key. Only the operator moves; keeper, broker, task worker image and templates image keep their pins.
              # Source 8b854b94079f585dc349fcaf35d6ca6ffd9e8c6c (dev-env#576 merge on main, 2026-10-27); Publish 40561618362 signed/verified.
              # 8b854b9 adds the default-off pilot agent image (dev-env#576): --pilot-agent-image and --pilot-agent-session make the pods of the sessions with one parent and idempotency key run another digest-pinned agent image. Only the image line of such a session's own pod changes; existing pods are never compared or replaced, and the revision label stays the templates'. No API type or CRD change. Only the operator moves; keeper, broker, task worker image and templates image keep their pins.
              # Source 7af05eff410b61bc9bac491c102348d0d58c4eaf (v2.47.0, dev-env#574 and release #575, 2026-10-27); Publish 40549518186 signed/verified.
              # 7af05ef adds the default-off portal message and conversation routes (dev-env#574). They register only with --portal-send-target or --portal-history-target, and at this pin neither was set, so the portal reader could only list session summaries; the 2026-10-29 flags below now set both for one session. No change to existing routes, the controller, the templates package, API types or CRDs. Only the operator moves; keeper, broker, task worker image and templates image keep their pins.
              # Source 0134c30f (dev-env#568 merge on main, 2026-10-27); Publish 40452436157 signed/verified.
              # 0134c30 changes only the portal reader: it lists every repository's sessions in dev-agents and adds provider, launchedBy (spec.parent, pattern-checked) and taskResult to view=activity (OpenProject #178). No other operator or keeper code changed since af402e5; no API type or CRD change. The portal must already run sha-0134c30 (haynes-ops#4331): older portals refuse the new keys. Only the operator moves; keeper, broker, task worker image and templates image keep their pins.
              # Source af402e533379bddd81e9266ee80ec6c565b81f29 (v2.45.0-2-gaf402e5, dev-env main after release 2.45.0); Publish 40368529556 signed/verified.
              # af402e5 adds the default-off portal reader (dev-env#545, #550, #557; enabled below for Story178 S3), child usage capture (#517, default off, not enabled here), fleet Pod resource specs behind an opt-in request header (#514) and read-only standby observation metrics (#512). CRD change: AgentSession spec.usageCaptureParentUID and status.capturedUsage, so dev-env-crds must carry the af402e5 schema first. Only the operator moves; keeper, broker, task worker image and templates image keep their pins.
              # Source 617ed15fa850d8fff49a9d2c45fa11e4411cd077 (v2.39.1); Publish 39706772225 signed/verified.
              # 2.39.1 makes a bad keeper notice flag disable notices instead of stopping the keeper (dev-env#505); no API type or CRD change. Operator, keeper, task worker image and templates image all move to 2.39.1. Broker stays on sha-eeb15e3.
              # Source 0c22cc0bac4f8e2151f4f27fa99a69b605b14784 (v2.39.0); Publish 39466593953 signed/verified.
              # 2.39.0 adds the keeper login-lapse gauges, the lapse date in auth status and keeper Pushover notices (dev-env#495, plan 13 story 13.1); no API type or CRD change. Operator, task worker image and templates image all move to 2.39.0.
              # 2.38.3 source 8f7311c3b6dc41aaf8b4ea3f2fb604e8f4f365b6; Publish 39391960144 signed/verified.
              # 2.38.3 fixes the standby booting/grace handling (dev-env#489); no API type or CRD change. Operator, task worker image and templates image all move to 2.38.3.
              # 2.38.2 source 2875abe48a7accefa3ba87148abd9ba145bec408 (release dev-env#488); Publish 39387698019 signed/verified.
              # 2.38.2 adds agentd's per-pod login lock (dev-env#485); no API type or CRD change. This pin also moves --task-budget-worker-image and the templates image to 2.38.2 (they were held at 2.38.0 through v2.38.1), so idle sessions drain onto the new template revision.
              # 2.38.1 source fdf2542395895adf8bfecb00e5b9b4df947a44e6 (release dev-env#484); Publish 39382009894 signed/verified.
              # 2.38.1 fixes the standby drain (dev-env#480), the keeper's Proxmox create-response shape (#481) and adds claude-login-abandon plus a quieter keeper Codex log level (#483); no API type or CRD change.
              # 2.38.0 source 702a57fe0cfd651661e7db30cadbada58a40947c (release dev-env#476); Publish 39374328506 signed/verified.
              # 2.38.0 adds the keeper-login routes for workbench sessions (dev-env#475, agent-run keeper-login; needs the operator exec Role and guard, haynes-ops #4130) and the stalled-clone abandon fix (dev-env#478); no API type or CRD change (CRDs in dev-env-crds already match v2.38.0).
              # 2.37.0 source 9539413 (release dev-env#468); Publish 39345991115 signed/verified.
              # 2.37.0 adds the standby remote session, default off (dev-env#466), the served model for Codex tasks (dev-env#465) and workbench Codex host creation (dev-env#467); no API type or CRD change (CRDs in dev-env-crds already match v2.37.0).
              # 2.36.0 source 119ca6567fc7df93a1d4528e3de054d7d3d6e719 (release dev-env#463); Publish 39341191567 signed/verified.
              # 2.36.0 adds the workbench profile's service account (dev-env#462, Story110 T24: Profile.serviceAccount, only dev-env-workbench) and agent-run auth status (dev-env#461); no API type or CRD change (CRDs in dev-env-crds already match v2.36.0).
              # 2.35.1 lets idle remote sessions drain onto a new agent image (dev-env#459); no API type or CRD change (CRDs in dev-env-crds already match v2.35.1).
              # 2.35.0 adds Codex remote sessions with phone pairing (dev-env#457): agentd's Codex remote daemon and pair command, agent-run pair, and the matching create/validate changes; no API type or CRD change.
              # 2.33.0 and 2.34.0 add shared-auth increments 2 to 5: the keeper's Claude login journal, refresh and access-only publisher and the login adoption ceremony, all behind --enable-claude-auth (default off; dev-env#450, #452, #455); agentd's one continue after a revoked-token turn (dev-env#449); private-history retention for task sessions only, an already-marked session stays protected (dev-env#453); the opwork CLI in the agent image (dev-env#454). No API type or CRD change.
              # 2.29.4 accepts gpt-6-luna on the sealed pilot contract; general private admission was disabled then; T16 (below) enables it.
              # D-92 shares archived history among existing trusted callers; authentication and mutation guards remain.
              # HOME archive, history reads and HOME deletion remain absent/default off until their H7/H8 gates. The executor stop (H3) is on since NB-06b (below).
              # Requires the v2.29.4 AgentSession schema in dev-env-crds; a sealed pilot is limited by its explicit policy window.
              # OP302 (deploys OP291): source 030133dc9dd9ac24a2c61f30f12ee8e402bd4bf2 (v2.71.0, dev-env#727: #729 terminal task pod reclaim and #730 codex-rc image flags, both default off).
              # Supersedes the OP252 pin dddc2c1 (v2.70.0, Tom approved packet bf6cbafe); every OP252 arg below is kept unchanged.
              # publish.yml run 41088359336 signed and verified this exact digest; post-merge CI run 41088359765 green.
              # Requires the v2.71.0 AgentSession schema in dev-env-crds (haynes-ops #4450). Reclaim stays off until Tom's activation ruling.
              # Operator image only: keeper, broker, portal, templates and existing Session pods stay unchanged.
              tag: sha-030133d@sha256:02e7b3bd452649e1418cfb0e80035fa63679a9a5438697f688ef3742fe1a58b5
              pullPolicy: IfNotPresent
            args:
              # Session pods report here (AGENTD_API_URL, D-41). The full name: session
              # pods use ndots:1 and the DNS allowlist refuses search-expanded names.
              - --api-url=https://dev-env-operator.dev-env-system.svc.cluster.local:8443
              # Trusted callers that are not sessions (D-46): the workbench (plan 02) and,
              # until cutover, the v1 pod, whose token is minted for its own
              # ServiceAccount (dev-env-rbac's dev-env-v2-api-token Role in `dev`,
              # held to this audience by dev-env-v1-token-guard).
              - --client-service-accounts=dev-agents/dev-env-workbench,dev/dev-env
              # Story178 S3: the portal's Sessions view. Accept the ServiceAccount
              # dev-agents/dev-env-v2-portal (portal-serviceaccount.yaml), only with a pod-bound token for
              # audience dev-env-operator from a live Pod that runs as it, and only for
              # GET /v1/sessions; every other route answers it 403 (apiserver server.go:316). It
              # lists dev-agents AgentSessions of repo dev-env, read-only, paged (at most 100).
              # The operator refuses to start with the reader on unless the session namespace is
              # dev-agents (main.go:220), so that default is stated here.
              - '--enable-portal-reader'
              # Measured usage (dev-env#588 and #591, DESIGN-029 "Interactive conversation usage"): add
              # each interactive session's measured conversation usage to the portal reader's
              # activity view as an allowlisted conversationUsage key (result, reason, per-model
              # counters, counts, observedAt; no paths, ids or text). Task sessions and sessions
              # without a valid figure send no key. It requires --enable-portal-reader (above). It
              # is on only after the portal that reads the key is rolled (the portal's activity
              # decoder is strict, so a portal from before dev-env#591 would read the view as
              # unavailable). It changes no pod and no Secret, and grants nothing. It does not
              # enable send or history: the 2026-10-29 target flags below do that for one
              # session. Launch stays off.
              - '--portal-conversation-usage=true'
              - '--session-namespace=dev-agents'
              # Measured-usage pilot (Tom, 2026-10-28; dev-env#576 mechanism, docs/portal-session-runtime.md
              # "Pilot agent image for one session"): measured conversation usage needs agentd from
              # dev-env#584 and #588, and the templates image is still 2.45.0. These two flags put
              # the sessions that dev-env-1027-111645 creates with idempotency key usage-pilot-1 on
              # the signed 2.52.0 agent image (publish-agent 40616532878, sign and verify passed).
              # The operator selects only a Claude remote or local session on repo dev-env with no
              # workspace, project canary or private pilot. It matches every such session while
              # these lines stay: using the key for one session only is the operating rule, not a
              # limit. They are read only when a pod is built, so no existing pod is recreated,
              # restarted or drained: the earlier pilot dev-env-1027-185745 (key live-ide-pilot-1,
              # on 2.47.0) keeps its running pod, and on a future recreation it gets the templates
              # image, because its key no longer matches. Existing 2.45 sessions report no
              # conversation usage and show as not measured.
              # This is code version only: profile, Secrets, egress and grants are the parent's, and
              # it authorizes no portal send or history (see the two portal target flags below);
              # launch stays off. Remove both lines when the pilot ends.
              - '--pilot-agent-image=ghcr.io/thaynes43/dev-env:2.52.0@sha256:87e8ab9346c2f656c0dfe19eb3d09ae89e220a341dd86e30e9ef0d43230204f9'
              - '--pilot-agent-session=dev-env-1027-111645/usage-pilot-1'
              # 2026-10-29, Tom chose target dev-env-1028-031951 (AskUserQuestion,
              # OpenProject #244); the 2026-10-27 approval for dev-env-1027-185745 is not reused.
              # Tom ruled that send and history follow the existing Authentik group that admits
              # portal login, with no per-person subject (OP #244, journals 2421, 2422, 2426).
              # These flags enable portal Send and history for ONE session, UID
              # 5da21936-7781-4760-82ce-2a0689b891f7, and supersede the default-off comments above.
              # The operator registers the message and conversation routes only with these flags,
              # still only for the portal ServiceAccount. The portal's own scope is the
              # session-actions.json key in portal/app/config.yaml: targets only, no issuer and
              # no subject, so no ExternalSecret. Merge only after the portal runs a release that
              # contains dev-env#649; an older portal refuses that file and exits at startup.
              # Main now pins v2.65.0 (sha-d475456), which accepts the targets-only file.
              # No automatic expiry: the immediate kill switch is a PR removing both target flags
              # and that ConfigMap key.
              - '--portal-send-target=dev-env-1028-031951=5da21936-7781-4760-82ce-2a0689b891f7'
              - '--portal-history-target=dev-env-1028-031951=5da21936-7781-4760-82ce-2a0689b891f7'
              # Separate ordinary Codex TASK image selector (dev-env#632, signed v2.63.0).
              # Exact future parent/key only; no current Session has this key. It changes only
              # the image of a first newly constructed, UID-owned ordinary dev-env task pod.
              # Existing pods are not replaced; retained executor/HOME identity and all API,
              # profile, capacity and budget-image checks remain enforced. It is not a grant.
              # Use this key once operationally: the selector is not a lifetime launch cap.
              # Keep the older remote/local pilot above and templates unchanged. Remove both
              # task-pilot lines when the separately authorized future worker is complete.
              - '--task-pilot-agent-image=ghcr.io/thaynes43/dev-env:2.63.0@sha256:010ce2db9371e0de7f12e9b2d5243a182f7c684faea2aab874c67e8a328a3a9f'
              - '--task-pilot-agent-session=dev-env-1019-205125/provider-child-cap-20261029-01'
              # OP252 (Tom approval): separate ordinary Codex REMOTE pilot image (dev-env#715, v2.70.0).
              # Exact parent|key: matches only dev-agents/dev-env-1019-205125 (UID e9a76314-3064-4dce-b4a6-5bb783105bf3).
              # Keep both lines while that Session carries the original-home-binding annotation and the
              # templates image lacks agentd home-verify (below 2.69.0): without them its next pod fails closed.
              - '--remote-pilot-agent-image=ghcr.io/thaynes43/dev-env:2.70.0@sha256:234b73da73041a8691d3d7bd6a86e73a610998b5870db10888344c2dbf42aa15'
              - '--remote-pilot-agent-session=dev/dev-env|v2-codex-host-1019-01'
              # OP252 (Tom approval): exact default-off original-HOME guard for one Session (dev-env#706).
              # Removing this line later is safe: the admitted annotation keeps the guard (homeguard.Select).
              - '--original-home-binding={"namespace":"dev-agents","session":"dev-env-1019-205125","sessionUID":"e9a76314-3064-4dce-b4a6-5bb783105bf3","pvcUID":"03912a1c-df4d-4b72-811f-2c34dd3abe25","pv":"pvc-03912a1c-df4d-4b72-811f-2c34dd3abe25","pvUID":"b9455c08-72e0-43d2-9a88-04c389c27a74"}'
              # Explicit sole zero-task fixture; ordinary native hosts remain closed.
              - '--enable-coordinator-callers'
              - '--enable-managed-codex-tasks'
              # Story110 T16 (Tom: ordinary repeatable Codex project tasks first): admit ordinary
              # `agent-run --project <p> --agent codex -p` tasks (apiserver sessions.go:116). The operator
              # refuses to start with this on AND the canary route (main.go:259), the retained-common-rules
              # route (main.go:252) or a sealed pilot (main.go:273, not configured here) on, so the first two
              # are off below. Existing Sessions, Pods, PVCs, ledgers and receipts are neither deleted nor
              # mutated. Known cost: Sessions that carry a session-directory spec now fail reconcile early
              # with ErrUnavailable (controller/reconciler.go:423, session_directory.go:12) and retry with
              # backoff until a dev-env fix lands; see the T16 PR.
              - '--enable-private-project-tasks=true'
              - '--enable-private-history-retention=true'
              # DESIGN-025 H2: record a private executor's verified terminal state (or the
              # missed marker) in its Session's status. Records only; stops and deletes nothing.
              # Needs dev-env-rbac's node and node-lease get (rbac/app/operator.yaml); without
              # them the check fails closed and nothing is recorded. Once a record exists, turn
              # this off rather than pin the operator below 2.25.0 (ADR-005 C-38).
              - '--enable-private-terminal-record=true'
              # DESIGN-025 H3 (NB-06b, 2026-10-20): stop the recorded executor of a REAPING private
              # task Session (activeDeadlineSeconds patch after a confirmed stop intent; the Pod
              # object, the HOME volume and the Session stay, nothing is deleted). A Suspended or
              # Running Session is never touched (ADR-006); an owner hold annotation
              # (dev-env.haynesops.com/home-expiry) blocks the stop. Needs the terminal record flag
              # above. Archive, archive reads and HOME delete stay off, so a reaped private task keeps
              # its HOME and Session until those later flags (H7/H9). Fixes: a reap of a task never
              # stopped its pod ("RetentionPending: private stop evidence is unknown").
              - '--enable-private-executor-stop=true'
              # DESIGN-025 section 24 (OP291, dev-env#729, v2.71.0; Tom chose 'Pin 2.71.0, then reclaim' on 2026-10-30, OP302):
              # after the grace, stop the executor of a private headless task whose agentd 2.71.0+ proved the provider exited
              # (suspend if needed, then section 4's confirmed stop intent and deadline patch). HOME, the PVC, the retained
              # history and the Session stay. Local, remote, canary, pilot, original-home, workspace, attached, held and reaping
              # Sessions never qualify; pre-2.71 executors have no proof and are not touched (OP308). Needs both flags above.
              # To turn it off, set it false. Never pin the operator below 2.71.0 once a reclaim was recorded (taskTerminal CEL).
              - '--enable-terminal-task-pod-reclaim=true'
              - '--terminal-task-pod-reclaim-grace=10m'
              # Off with the canary route (main.go:252). Ordinary project tasks get no retained common rules.
              - '--enable-retained-common-rules=false'
              # Off: main.go:259 refuses canaries together with general private admission. The
              # --private-project-canaries record below is kept for history; with the route off it is
              # parsed and then ignored (main.go:267).
              - '--enable-private-project-canaries=false'
              # Q-32 (2026-10-12): rule-canary-claude-sigo-1012b replaces the consumed sigo-1012 record
              # (Q-30). It reruns the private Sigo alumni canary on the 2.25.0 template to prove catalog
              # bootstrap reaches Ready. Only id, key, templateRevision and image changed. codex-1011
              # is byte-identical (consumed).
