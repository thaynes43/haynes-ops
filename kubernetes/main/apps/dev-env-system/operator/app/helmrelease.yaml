---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# dev-env-operator (DESIGN-001 3.1, D-01, D-46; KICKOFF 8.9): the v2 control plane.
# Two replicas with leader election: only the leader reconciles AgentSessions, every
# replica serves the /v1 API on 8443.
#
# UPGRADING THIS NEVER TOUCHES A SESSION (DESIGN-001 5.1, D-03): session pods and volumes
# are owned by their AgentSession, never by this Deployment, and the CRDs live in
# dev-env-crds with pruning off. A rollout, a rollback or an uninstall of this release
# leaves every running session alone, so the image may roll at any time.
#
# The ServiceAccount, its Roles and the TokenReview ClusterRole come from dev-env-rbac
# (8.4); this release creates no ServiceAccount and no RBAC.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dev-env-operator
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      # The ServiceAccount is dev-env-rbac's (8.4).
      createDefaultServiceAccount: false
    controllers:
      dev-env-operator:
        replicas: 2
        # app-template's default is Recreate; roll one replica at a time so the API
        # stays up through an upgrade.
        strategy: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
        serviceAccount:
          name: dev-env-operator
        # Keep one replica serving the API through a node drain.
        podDisruptionBudget:
          minAvailable: 1
        pod:
          # DESIGN-001 7.1: the operator is tiny and may run anywhere; its two replicas
          # spread across zones m and w, so one node class going away leaves the API up.
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              matchLabelKeys:
                - pod-template-hash
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: *app
        containers:
          app:
            image:
              repository: ghcr.io/thaynes43/dev-env-operator
              # Release v2.29.4 main f315635ad6fc30129da4e0310295634e57b78422; Publish 38990213487 keyless verified.
              # 2.29.4 accepts gpt-6-luna on the sealed pilot contract; general private admission remains disabled.
              # D-92 shares archived history among existing trusted callers; authentication and mutation guards remain.
              # Executor stop, HOME archive, history reads and HOME deletion remain absent/default off until their H7/H8 gates.
              # Requires the v2.29.4 AgentSession schema in dev-env-crds; a sealed pilot is limited by its explicit policy window.
              tag: sha-f315635@sha256:60f66558bd178543c64ff4b5554fbd204fd9c023f7f9d8c57b1b9016b7a4099a
              pullPolicy: IfNotPresent
            args:
              # Session pods report here (AGENTD_API_URL, D-41). The full name: session
              # pods use ndots:1 and the DNS allowlist refuses search-expanded names.
              - --api-url=https://dev-env-operator.dev-env-system.svc.cluster.local:8443
              # Trusted callers that are not sessions (D-46): the workbench (plan 02) and,
              # until cutover, the v1 pod, whose token is minted for its own
              # ServiceAccount (dev-env-rbac's dev-env-v2-api-token Role in `dev`,
              # held to this audience by dev-env-v1-token-guard).
              - --client-service-accounts=dev-agents/dev-env-workbench,dev/dev-env
              # Explicit sole zero-task fixture; ordinary native hosts remain closed.
              - '--enable-coordinator-callers'
              - '--enable-managed-codex-tasks'
              - '--enable-private-project-tasks=false'
              - '--private-project-pilot={"notBefore":"2026-10-17T05:25:00Z","expiresAt":"2026-10-17T05:55:00Z","sealUID":"b860d388-7ded-46ea-a304-d3b0c4da4948","catalogRevision":"5fe34bd347f85c4b41773fbe48f815f8655945af9d73503a1ef0e89ee89aad90","rulesRevision":"1cebe4524e65483d4854960c34a31d3f75f1cfc0acb991f0fd490b10bbc98e2b","commonRevision":"84ea7066443085f48fd9567f1155b0c224f779abccef7b5625c00f883965682b","templateRevision":"2.29.5-0ec4424c95","image":"ghcr.io/thaynes43/dev-env:2.29.5@sha256:1887be46224bfacd4a6e9c20e443c03f3b2d1516ca0f9305b939011f6a484c61","prompts":["Bounded two-agent private pilot. Follow already-loaded rules. Before claims report only actually loaded common/repo markers, own Session UID, configured model/effort from own supported Session metadata, fresh git HEAD and private worktree. Do not fetch rules to fake loading; serving model stays Unknown without evidence. Use existing TLS/identity clients, never read tokens or restricted provider session/rollout/database files. No repo edits, installs, children, auth/security/egress/deploy/archive/delete/v1 work. Own /tmp/c7-private-pilot receipts/nonce only; preserve HEAD/nonce and peers. Denied, unknown, wrong UID or exhausted deadline means stop PARTIAL; no retries, fallback, replacements or revival.\nYou are A: private-pilot-c7-rendezvous-1016-r8-a. Require fresh HEAD 56f1b8c127eae4864b241d729afae71cd7e23f2d.\nTOOL CALL 1 is one short completed call. It must return before any wait. Do not sleep, poll, or start the wait script in this call. Create one own nonce and its SHA256. Run exactly /usr/local/bin/agentd task-claim-create with JSON stdin. Do not wrap agentd in timeout, gtimeout, or any shell wrapper; do not pass --timeout. Copy taskKey verbatim from the JSON below:\n{\"identity\":{\"project\":\"dev-env\",\"repository\":\"dev-env\",\"taskKey\":\"task:c7-private-pilot-c7-rendezvous-1016-r8-a\"}}\nPrint exactly one JSON line from the ACTUAL result, then end this call: {\"operation\":\"task-claim-create\",\"exitCode\":RETURN_CODE,\"stdout\":JSON_ENCODED_ORIGINAL_STDOUT_STRING}. Use json.dumps. Never fabricate a success. Require exit 0 and Created or same-owner Confirmed. Retain claim UID, owner UID and createdAt C. An unknown result stops PARTIAL; do not repeat create.\nAfter a successful claim you MUST stay in this same task. Ending the task, submitting, or exiting after TOOL CALL 1 without completing TOOL CALL 2 is PARTIAL failure even if the claim succeeded. TOOL CALL 2 must run in this task before any final exit.\nTOOL CALL 2 starts only after call 1 has returned. Compute UTC deadlines once: startup=C+360s, ACK=C+600s, terminal=C+720s, each capped by 2026-10-17T05:54:00Z minus 60s and the 15m task/20m Pod caps. Never reset them. One finite local script, monotonic sleeps, wall-clock timestamps. Tool time counts.\nStartup: at most 8 rounds 45s apart. Each round is exactly task-claim-list and inbox-list, both --project dev-env --limit 100, via /usr/local/bin/agentd (max 16 reads). Stop early when B owns task:c7-private-pilot-c7-rendezvous-1016-r8-b and its message targets original A UID. Bind B only from that claim. A missing page is partial.\nACK: inbox-read the exact returned name; verify B sender UID, A recipient UID, message UID and B Pod. inbox-ack the same message; retain ack uid/messageUID/recipient. Publish nonce hash plus claim/message/ACK refs with /usr/local/bin/agentd ctl context-publish --kind handoff --key c7-private-pilot-c7-rendezvous-1016-r8-a-handoff and nonsecret stdin. Retain name/source.uid/contentSHA256. Reply once via inbox-publish JSON: project dev-env, recipient B namespace/name/uid, key c7-private-pilot-c7-rendezvous-1016-r8-a-to-b, text with publication name/sourceUID/hash and ACK receipt. Recheck own HEAD/nonce/worktree. Save raw outcomes, times and read counts. Report pass/partial/fail per element and exit. Do not wait for B to read the handoff. Exit 0 is not semantic acceptance or private executor stopConfirmed.\n","Bounded two-agent private pilot. Follow already-loaded rules. Before claims report only actually loaded common/repo markers, own Session UID, configured model/effort from own supported Session metadata, fresh git HEAD and private worktree. Do not fetch rules to fake loading; serving model stays Unknown without evidence. Use existing TLS/identity clients, never read tokens or restricted provider session/rollout/database files. No repo edits, installs, children, auth/security/egress/deploy/archive/delete/v1 work. Own /tmp/c7-private-pilot receipts/nonce only; preserve HEAD/nonce and peers. Denied, unknown, wrong UID or exhausted deadline means stop PARTIAL; no retries, fallback, replacements or revival.\nYou are B: private-pilot-c7-rendezvous-1016-r8-b. Require fresh HEAD 56f1b8c127eae4864b241d729afae71cd7e23f2d. Read /usr/local/bin/agentd task-claim-list --project dev-env --limit 100 and find only task:c7-private-pilot-c7-rendezvous-1016-r8-a. Retain original A owner namespace/name/uid, claim UID and createdAt C. A missing page is partial. Attempt that A identity ONCE via /usr/local/bin/agentd task-claim-create stdin {\"identity\":{\"project\":\"dev-env\",\"repository\":\"dev-env\",\"taskKey\":\"task:c7-private-pilot-c7-rendezvous-1016-r8-a\"}}. Require nonzero exit and Conflict retaining that exact A owner UID. Never do A work. Then create task:c7-private-pilot-c7-rendezvous-1016-r8-b the same way (direct /usr/local/bin/agentd only; no timeout wrapper; no --timeout). Require exit 0 and Created or same-owner Confirmed, with your original UID. Unknown outcome is not permission to repeat.\nWrite one own nonce and SHA256. Publish once via inbox-publish JSON: project dev-env, recipient original A namespace/name/uid, key c7-private-pilot-c7-rendezvous-1016-r8-b-to-a, text containing only the nonce hash and own claim reference. Retain message name/UID and sender/recipient/Pod attribution.\nDeadlines once from A createdAt C: startup=C+360s, ACK=C+600s, terminal=C+720s. Cap every phase at 2026-10-17T05:54:00Z minus 60s and the 15m task/20m Pod caps. No reset. Finite local script, monotonic sleeps, UTC receipts.\nAwait A reply with inbox-list --project dev-env --limit 100: at most 8 reads 30s apart, before the ACK deadline. inbox-read the exact name. Verify A sender UID, B recipient UID, and that A ACK messageUID equals your original message UID. inbox-ack it and retain the receipt. Do not infer ACK from message creation.\nThen at most 8 reads 15s apart before the terminal deadline: /usr/local/bin/agent-run show private-pilot-c7-rendezvous-1016-r8-a --json --once. Preserve the full raw response. Require original A UID and actual agentStatus.task.finishedAt plus exitCode 0, or the existing reviewed terminal record. Never infer terminal from idle, state or phase. Record privateHistory.stopState separately and keep Unknown as Unknown. After that fact, context-read the exact publication name from the reply: /usr/local/bin/agentd ctl context-read --project dev-env --name EXACT_NAME. Verify original A source.uid and contentSHA256 match the reply. Recheck own HEAD/nonce/worktree and the original A UID/terminal fact. Save raw outcomes, times and read counts. Report pass/partial/fail per element and exit. This proves a task-stopped published handoff only, not private executor stopConfirmed. No revival, reap, archive or history-read.\n"],"cohort":"c7-rendezvous-1016-r8"}'
              - '--enable-private-history-retention=true'
              # DESIGN-025 H2: record a private executor's verified terminal state (or the
              # missed marker) in its Session's status. Records only; stops and deletes nothing.
              # Needs dev-env-rbac's node and node-lease get (rbac/app/operator.yaml); without
              # them the check fails closed and nothing is recorded. Once a record exists, turn
              # this off rather than pin the operator below 2.25.0 (ADR-005 C-38).
              - '--enable-private-terminal-record=true'
              - '--enable-retained-common-rules=true'
              - '--enable-private-project-canaries=true'
              # Q-32 (2026-10-12): rule-canary-claude-sigo-1012b replaces the consumed sigo-1012 record
              # (Q-30). It reruns the private Sigo alumni canary on the 2.25.0 template to prove catalog
              # bootstrap reaches Ready. Only id, key, templateRevision and image changed. codex-1011
              # is byte-identical (consumed).
              - '--private-project-canaries=[{"commonRevision":"3b9b829cf224ea4bc5b2b481ff3b7c1b4f0b173e1b4e304d84d4e3ecf4e2ca61","captureOutput":true,"id":"rule-canary-claude-sigo-1012b","client":"dev/dev-env","project":"sigo-alumni","repository":"sigo-alumni","provider":"claude","profile":"rule-canary-claude","model":"claude-opus-5-5","effort":"xhigh","size":"S","catalogRevision":"5fe34bd347f85c4b41773fbe48f815f8655945af9d73503a1ef0e89ee89aad90","rulesRevision":"d070e7a6d7e10359ed9fa4de897d6e24be7c49ba7df2f8af39ef4317b83ceae0","templateRevision":"2.25.0-b7972dd7b5","image":"ghcr.io/thaynes43/dev-env:2.25.0@sha256:25b20148706fe0b735cc879891c12851977c72a32b5b83cc68ef511246a3cd29","idempotencyKey":"rule-canary-claude-sigo-1012b-once","prompt":"Perform the instruction acceptance probe described in your loaded instructions. Reply only with the common and repository rule markers you actually received, and Unknown for absent instructions. Do not use tools or fetch files.","timeout":"180s","maxTurns":1},{"commonRevision":"3b9b829cf224ea4bc5b2b481ff3b7c1b4f0b173e1b4e304d84d4e3ecf4e2ca61","captureOutput":true,"id":"rule-canary-codex-1011","client":"dev/dev-env","project":"dev-env","repository":"dev-env","provider":"codex","profile":"rule-canary-codex","model":"gpt-6-astra","effort":"max","size":"S","catalogRevision":"9c5cc110d56f9afcd360a76947523d1b73cfa8bc685556c0c47f8e00c80d6d29","rulesRevision":"1cebe4524e65483d4854960c34a31d3f75f1cfc0acb991f0fd490b10bbc98e2b","templateRevision":"2.20.0-ec26880d2a","image":"ghcr.io/thaynes43/dev-env:2.20.0@sha256:823e015567fdb34951c4e6ce7e39891e3cc8a1e2d1d219bee127fe537cb31303","idempotencyKey":"rule-canary-codex-1011-once","prompt":"Perform the instruction acceptance probe described in your loaded instructions. Reply only with the common and repository rule markers you actually received, and Unknown for absent instructions. Do not use tools or fetch files.","timeout":"180s","maxTurns":0}]'
              - '--enable-session-directory=true'
              - '--session-directory-projects=dev-env'
              - '--metadata-discovery-projects=dev-env'
              - '--enable-task-claims=true'
              - '--task-claims-read-projects=dev-env'
              - '--enable-published-contexts=true'
              # sigo-alumni: the Sigo canary (Q-30, rerun Q-32) publishes its managed output
              # and its result is read here.
              - '--context-payload-read-projects=dev-env,sigo-alumni'
              - '--enable-durable-inbox=true'
              - '--inbox-projects=dev-env'
              - '--inbox-coordinator-read-projects=dev-env'
              - '--project-catalog=dev-env-system/dev-env-project-catalog'
              - '--project-clone-owner=thaynes43'
              - '--coordinator-hosts=[{"serviceAccount":"dev-agents/dev-env-owned-native-fixture","podName":"dev-env-owned-native-lifecycle","hostID":"owned-native-fixture"}]'
              - '--enable-task-budgets'
              - '--task-budget-namespace=dev-env-budgets'
              - '--task-budget-worker-image=ghcr.io/thaynes43/dev-env:2.11.0@sha256:98761577d27feded51427a8097a9cf9492c2e7ee62b6e9a99df27bf52017532d'
              - '--assigned-task-budgets={"owned-native-fixture":"owned-native-fixture-1010"}'
              - '--enable-native-lifecycle-fixture'
              - '--native-fixture-image=ghcr.io/thaynes43/dev-env:2.11.0@sha256:98761577d27feded51427a8097a9cf9492c2e7ee62b6e9a99df27bf52017532d'
              # The other flags keep their defaults: --session-namespace dev-agents,
              # --templates-name dev-env-templates in this namespace (the Lease lives
              # here too), --api-bind-address :8443, --api-tls-dir
              # /etc/dev-env-operator/api-tls, --human-service-account
              # dev-env-system/dev-env-human, metrics :8080, probes :8081.
            env:
              POD_NAMESPACE:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8081
                  periodSeconds: 20
                  timeoutSeconds: 3
                  failureThreshold: 3
              # Ready once the manager runs and the API serves (the "api" check, D-46).
              # A replica that does not lead is still ready: it serves the API.
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 8081
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
    defaultPodOptions:
      annotations:
        # Keep the actual operator rollout free of an unbounded injected init.
        k8tz.io/inject: "false"
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        # distroless nonroot; dev-env-system enforces Pod Security "restricted".
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      # The /v1 API (D-46). Session pods, the v1 pod and the workbench call it by the
      # Certificate's name, dev-env-operator.dev-env-system.svc.cluster.local. The same
      # Service carries the metrics port, so its name does not change.
      api:
        controller: dev-env-operator
        ports:
          https:
            port: 8443
            protocol: HTTPS
          # controller-runtime's metrics, with the sessions' series (thaynes43/dev-env
          # D-56): dev_env_session_rescue_failed and dev_env_sessions. Prometheus is
          # the only caller (network/app/operator.yaml).
          metrics:
            port: 8080
            protocol: HTTP
    serviceMonitor:
      # Both replicas are scraped; they report the same series from their caches, and
      # the rules fold them with max (prometheusrule.yaml).
      app:
        serviceName: dev-env-operator
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
    persistence:
      # The API's serving certificate (dev-env-pki). A Secret volume, not a subPath, so
      # a renewal reaches the files and the operator reloads them (D-46).
      api-tls:
        type: secret
        name: dev-env-operator-api-tls
        defaultMode: 0440
        globalMounts:
          - path: /etc/dev-env-operator/api-tls
            readOnly: true
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Mi
        globalMounts:
          - path: /tmp
