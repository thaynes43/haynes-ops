---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# dev-env-operator (DESIGN-001 3.1, D-01, D-46; KICKOFF 8.9): the v2 control plane.
# Two replicas with leader election: only the leader reconciles AgentSessions, every
# replica serves the /v1 API on 8443.
#
# UPGRADING THIS NEVER TOUCHES A SESSION (DESIGN-001 5.1, D-03): session pods and volumes
# are owned by their AgentSession, never by this Deployment, and the CRDs live in
# dev-env-crds with pruning off. A rollout, a rollback or an uninstall of this release
# leaves every running session alone, so the image may roll at any time.
#
# The ServiceAccount, its Roles and the TokenReview ClusterRole come from dev-env-rbac
# (8.4); this release creates no ServiceAccount and no RBAC.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dev-env-operator
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      # The ServiceAccount is dev-env-rbac's (8.4).
      createDefaultServiceAccount: false
    controllers:
      dev-env-operator:
        replicas: 2
        # app-template's default is Recreate; roll one replica at a time so the API
        # stays up through an upgrade.
        strategy: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
        serviceAccount:
          name: dev-env-operator
        # Keep one replica serving the API through a node drain.
        podDisruptionBudget:
          minAvailable: 1
        pod:
          # DESIGN-001 7.1: the operator is tiny and may run anywhere; its two replicas
          # spread across zones m and w, so one node class going away leaves the API up.
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              matchLabelKeys:
                - pod-template-hash
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: *app
        containers:
          app:
            image:
              repository: ghcr.io/thaynes43/dev-env-operator
              # Main 598f60bece90117ae394d79a17b0a5559de35ead; Publish 39177244970 keyless verified.
              # 2.29.4 accepts gpt-6-luna on the sealed pilot contract; general private admission remains disabled.
              # D-92 shares archived history among existing trusted callers; authentication and mutation guards remain.
              # Executor stop, HOME archive, history reads and HOME deletion remain absent/default off until their H7/H8 gates.
              # Requires the v2.29.4 AgentSession schema in dev-env-crds; a sealed pilot is limited by its explicit policy window.
              tag: sha-598f60b@sha256:545e523ab20563c0948aa300013ad9d6d2ac9ee02781f69923f197cbd298fe70
              pullPolicy: IfNotPresent
            args:
              # Session pods report here (AGENTD_API_URL, D-41). The full name: session
              # pods use ndots:1 and the DNS allowlist refuses search-expanded names.
              - --api-url=https://dev-env-operator.dev-env-system.svc.cluster.local:8443
              # Trusted callers that are not sessions (D-46): the workbench (plan 02) and,
              # until cutover, the v1 pod, whose token is minted for its own
              # ServiceAccount (dev-env-rbac's dev-env-v2-api-token Role in `dev`,
              # held to this audience by dev-env-v1-token-guard).
              - --client-service-accounts=dev-agents/dev-env-workbench,dev/dev-env
              # Explicit sole zero-task fixture; ordinary native hosts remain closed.
              - '--enable-coordinator-callers'
              - '--enable-managed-codex-tasks'
              - '--enable-private-project-tasks=false'
              - '--enable-private-history-retention=true'
              # DESIGN-025 H2: record a private executor's verified terminal state (or the
              # missed marker) in its Session's status. Records only; stops and deletes nothing.
              # Needs dev-env-rbac's node and node-lease get (rbac/app/operator.yaml); without
              # them the check fails closed and nothing is recorded. Once a record exists, turn
              # this off rather than pin the operator below 2.25.0 (ADR-005 C-38).
              - '--enable-private-terminal-record=true'
              - '--enable-retained-common-rules=true'
              - '--enable-private-project-canaries=true'
              # Q-32 (2026-10-12): rule-canary-claude-sigo-1012b replaces the consumed sigo-1012 record
              # (Q-30). It reruns the private Sigo alumni canary on the 2.25.0 template to prove catalog
              # bootstrap reaches Ready. Only id, key, templateRevision and image changed. codex-1011
              # is byte-identical (consumed).
              - '--private-project-canaries=[{"commonRevision":"3b9b829cf224ea4bc5b2b481ff3b7c1b4f0b173e1b4e304d84d4e3ecf4e2ca61","captureOutput":true,"id":"rule-canary-claude-sigo-1012b","client":"dev/dev-env","project":"sigo-alumni","repository":"sigo-alumni","provider":"claude","profile":"rule-canary-claude","model":"claude-opus-5-5","effort":"xhigh","size":"S","catalogRevision":"5fe34bd347f85c4b41773fbe48f815f8655945af9d73503a1ef0e89ee89aad90","rulesRevision":"d070e7a6d7e10359ed9fa4de897d6e24be7c49ba7df2f8af39ef4317b83ceae0","templateRevision":"2.25.0-b7972dd7b5","image":"ghcr.io/thaynes43/dev-env:2.25.0@sha256:25b20148706fe0b735cc879891c12851977c72a32b5b83cc68ef511246a3cd29","idempotencyKey":"rule-canary-claude-sigo-1012b-once","prompt":"Perform the instruction acceptance probe described in your loaded instructions. Reply only with the common and repository rule markers you actually received, and Unknown for absent instructions. Do not use tools or fetch files.","timeout":"180s","maxTurns":1},{"commonRevision":"3b9b829cf224ea4bc5b2b481ff3b7c1b4f0b173e1b4e304d84d4e3ecf4e2ca61","captureOutput":true,"id":"rule-canary-codex-1011","client":"dev/dev-env","project":"dev-env","repository":"dev-env","provider":"codex","profile":"rule-canary-codex","model":"gpt-6-astra","effort":"max","size":"S","catalogRevision":"9c5cc110d56f9afcd360a76947523d1b73cfa8bc685556c0c47f8e00c80d6d29","rulesRevision":"1cebe4524e65483d4854960c34a31d3f75f1cfc0acb991f0fd490b10bbc98e2b","templateRevision":"2.20.0-ec26880d2a","image":"ghcr.io/thaynes43/dev-env:2.20.0@sha256:823e015567fdb34951c4e6ce7e39891e3cc8a1e2d1d219bee127fe537cb31303","idempotencyKey":"rule-canary-codex-1011-once","prompt":"Perform the instruction acceptance probe described in your loaded instructions. Reply only with the common and repository rule markers you actually received, and Unknown for absent instructions. Do not use tools or fetch files.","timeout":"180s","maxTurns":0}]'
              - '--enable-session-directory=true'
              - '--session-directory-projects=dev-env'
              - '--metadata-discovery-projects=dev-env'
              - '--enable-task-claims=true'
              - '--task-claims-read-projects=dev-env'
              - '--enable-published-contexts=true'
              # sigo-alumni: the Sigo canary (Q-30, rerun Q-32) publishes its managed output
              # and its result is read here.
              - '--context-payload-read-projects=dev-env,sigo-alumni'
              - '--enable-durable-inbox=true'
              - '--inbox-projects=dev-env'
              - '--inbox-coordinator-read-projects=dev-env'
              - '--project-catalog=dev-env-system/dev-env-project-catalog'
              - '--project-clone-owner=thaynes43'
              - '--coordinator-hosts=[{"serviceAccount":"dev-agents/dev-env-owned-native-fixture","podName":"dev-env-owned-native-lifecycle","hostID":"owned-native-fixture"}]'
              - '--enable-task-budgets'
              - '--task-budget-namespace=dev-env-budgets'
              - '--task-budget-worker-image=ghcr.io/thaynes43/dev-env:2.11.0@sha256:98761577d27feded51427a8097a9cf9492c2e7ee62b6e9a99df27bf52017532d'
              - '--assigned-task-budgets={"owned-native-fixture":"owned-native-fixture-1010"}'
              - '--enable-native-lifecycle-fixture'
              - '--native-fixture-image=ghcr.io/thaynes43/dev-env:2.11.0@sha256:98761577d27feded51427a8097a9cf9492c2e7ee62b6e9a99df27bf52017532d'
              # The other flags keep their defaults: --session-namespace dev-agents,
              # --templates-name dev-env-templates in this namespace (the Lease lives
              # here too), --api-bind-address :8443, --api-tls-dir
              # /etc/dev-env-operator/api-tls, --human-service-account
              # dev-env-system/dev-env-human, metrics :8080, probes :8081.
            env:
              POD_NAMESPACE:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8081
                  periodSeconds: 20
                  timeoutSeconds: 3
                  failureThreshold: 3
              # Ready once the manager runs and the API serves (the "api" check, D-46).
              # A replica that does not lead is still ready: it serves the API.
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 8081
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
    defaultPodOptions:
      annotations:
        # Keep the actual operator rollout free of an unbounded injected init.
        k8tz.io/inject: "false"
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        # distroless nonroot; dev-env-system enforces Pod Security "restricted".
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      # The /v1 API (D-46). Session pods, the v1 pod and the workbench call it by the
      # Certificate's name, dev-env-operator.dev-env-system.svc.cluster.local. The same
      # Service carries the metrics port, so its name does not change.
      api:
        controller: dev-env-operator
        ports:
          https:
            port: 8443
            protocol: HTTPS
          # controller-runtime's metrics, with the sessions' series (thaynes43/dev-env
          # D-56): dev_env_session_rescue_failed and dev_env_sessions. Prometheus is
          # the only caller (network/app/operator.yaml).
          metrics:
            port: 8080
            protocol: HTTP
    serviceMonitor:
      # Both replicas are scraped; they report the same series from their caches, and
      # the rules fold them with max (prometheusrule.yaml).
      app:
        serviceName: dev-env-operator
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
    persistence:
      # The API's serving certificate (dev-env-pki). A Secret volume, not a subPath, so
      # a renewal reaches the files and the operator reloads them (D-46).
      api-tls:
        type: secret
        name: dev-env-operator-api-tls
        defaultMode: 0440
        globalMounts:
          - path: /etc/dev-env-operator/api-tls
            readOnly: true
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Mi
        globalMounts:
          - path: /tmp
