              # Off: the directory requires the canary policy (main.go:312), which is nil with the
              # canary route off; its project scopes must go with it (main.go:321).
              - '--enable-session-directory=false'
              - '--enable-task-claims=true'
              - '--task-claims-read-projects=dev-env'
              - '--enable-published-contexts=true'
              # sigo-alumni: the Sigo canary (Q-30, rerun Q-32) published its managed output here; the
              # canary route is now off (T16), so this scope only keeps its retained result readable.
              - '--context-payload-read-projects=dev-env,sigo-alumni'
              - '--enable-durable-inbox=true'
              - '--inbox-projects=dev-env'
              - '--inbox-coordinator-read-projects=dev-env'
              - '--project-catalog=dev-env-system/dev-env-project-catalog'
              - '--project-clone-owner=thaynes43'
              - '--coordinator-hosts=[{"serviceAccount":"dev-agents/dev-env-owned-native-fixture","podName":"dev-env-owned-luna-1019-9","hostID":"owned-luna-1019-9"}]'
              - '--enable-task-budgets'
              - '--task-budget-namespace=dev-env-budgets'
              - '--task-budget-worker-image=ghcr.io/thaynes43/dev-env:2.39.1@sha256:0eb02674cd24e64a724f36fd6ff507c1279d295cc44d71effbec22af4d19b8fa'
              - '--assigned-task-budgets={"owned-luna-1019-9":"owned-luna-1019-0009"}'
              # Explicitly approved one finite Luna root; old fixture Pod/ledger retained.
              - '--owned-root-policy=dev-env-owned-luna-1019-9'
              # Story110 T25 (thaynes43/dev-env #466): keep one standby `remote` Claude session on
              # haynes-ops ready, on the workbench profile, so Tom can start a phone session without
              # a coordinator. HOLD: the pinned operator does not know these flags and would refuse
              # to start; merge only after the release containing #466 is pinned. The breaker's
              # ConfigMap and its Role are in dev-env-rbac (operator-standby.yaml).
              - '--enable-standby-session=true'
              - '--standby-profile=workbench'
              # Agent attestation (D-88, dev-env#586): serve POST /v1/grants/{name}/attestation, where
              # a grant's requesting session records its claim that the user or a coordinator
              # approved it (agent attestation, not verified human identity). The broker flag and an
              # attested GrantPolicy are what act on it. Tom's action-specific approval 2026-10-28T01:37:41Z.
              - '--enable-grant-attestation=true'
              # Off by default and not set: --enable-child-usage-capture (dev-env#517).
              # The other flags keep their defaults:
              # --templates-name dev-env-templates in this namespace (the Lease lives
              # here too), --api-bind-address :8443, --api-tls-dir
              # /etc/dev-env-operator/api-tls, --human-service-account
              # dev-env-system/dev-env-human, metrics :8080, probes :8081.
            env:
              POD_NAMESPACE:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8081
                  periodSeconds: 20
                  timeoutSeconds: 3
                  failureThreshold: 3
              # Ready once the manager runs and the API serves (the "api" check, D-46).
              # A replica that does not lead is still ready: it serves the API.
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 8081
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
    defaultPodOptions:
      annotations:
        # Keep the actual operator rollout free of an unbounded injected init.
        k8tz.io/inject: "false"
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        # distroless nonroot; dev-env-system enforces Pod Security "restricted".
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      # The /v1 API (D-46). Session pods, the v1 pod and the workbench call it by the
      # Certificate's name, dev-env-operator.dev-env-system.svc.cluster.local. The same
      # Service carries the metrics port, so its name does not change.
      api:
        controller: dev-env-operator
        ports:
          https:
            port: 8443
            protocol: HTTPS
          # controller-runtime's metrics, with the sessions' series (thaynes43/dev-env
          # D-56): dev_env_session_rescue_failed and dev_env_sessions. Prometheus is
          # the only caller (network/app/operator.yaml).
          metrics:
            port: 8080
            protocol: HTTP
    serviceMonitor:
      # Both replicas are scraped; they report the same series from their caches, and
      # the rules fold them with max (prometheusrule.yaml).
      app:
        serviceName: dev-env-operator
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
    persistence:
      # The API's serving certificate (dev-env-pki). A Secret volume, not a subPath, so
      # a renewal reaches the files and the operator reloads them (D-46).
      api-tls:
        type: secret
        name: dev-env-operator-api-tls
        defaultMode: 0440
        globalMounts:
          - path: /etc/dev-env-operator/api-tls
            readOnly: true
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Mi
        globalMounts:
          - path: /tmp
