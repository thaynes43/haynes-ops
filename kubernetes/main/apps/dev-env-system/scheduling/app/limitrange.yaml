---
# The most one container in dev-agents may ask for is size class L (DESIGN-001 7.2:
# limits 8 CPU / 24Gi). The class presets themselves are data in dev-env-templates.
#
# There is deliberately NO `default` / `defaultRequest` here. Design 7.2 describes a
# default of class M, but a LimitRange default is applied at admission BEFORE webhooks run,
# so it would hand a pod without a CPU limit one, and dev-env-require-cpu-limit (Kyverno)
# could never see the missing limit it exists to reject. Every session pod carries its
# class's requests and limits explicitly, and a pod without a CPU limit is refused.
# (The cluster-wide default-cpu-request LimitRange adds only a 50m CPU request.)
apiVersion: v1
kind: LimitRange
metadata:
  name: dev-env-agent-max
  namespace: dev-agents
spec:
  limits:
    - type: Container
      max:
        cpu: "8"
        memory: 24Gi
