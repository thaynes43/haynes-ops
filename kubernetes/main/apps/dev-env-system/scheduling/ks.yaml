---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# What keeps the household first when a worker is busy (DESIGN-001 7.1, 7.2, D-21): the
# agents' PriorityClass and the ceiling on one session pod. The Kyverno half (a CPU
# limit is mandatory in dev-agents) is dev-env-require-cpu-limit in the kyverno-policies
# Kustomization.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app dev-env-scheduling
  namespace: dev-env-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/main/apps/dev-env-system/scheduling/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  wait: true
  interval: 30m
  timeout: 5m
