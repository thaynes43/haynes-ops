---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# DESIGN-066 section 11, slice (a), install steps 1 to 5. Step 6 (who can read a private
# key) is a read-only check, not an object.
resources:
  # Step 1: only the operator writes the raise record annotation.
  - ./record-guard.yaml
  # Step 2: the depth label never changes after create; only the operator changes a
  # session pod's profile label.
  - ./label-guards.yaml
  # Steps 3 and 4: each owner alone updates or deletes its ledger and public key.
  - ./ledger-guards.yaml
  # Step 5: the empty objects and get/update by name for each owner.
  - ./operator-objects.yaml
  - ./keeper-objects.yaml
