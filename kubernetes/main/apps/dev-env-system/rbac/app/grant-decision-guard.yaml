---
# Only the operator may add a new authenticated handoff; it cannot overwrite
# one. The broker may retain or remove it, but cannot fabricate or replace one.
# This does not grant either actor new RBAC.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: dev-env-grant-decision-handoff
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [dev-env.haynesops.com]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [accessgrants, accessgrants/status]
  variables:
    - name: key
      expression: "'dev-env.haynesops.com/grant-decision'"
    - name: annotations
      expression: "object.metadata.?annotations.orValue({})"
    - name: prior
      expression: "request.operation == 'CREATE' ? {} : oldObject.metadata.?annotations.orValue({})"
  validations:
    - expression: >-
        ((variables.key in variables.annotations) == (variables.key in variables.prior) &&
         (!(variables.key in variables.annotations) || variables.annotations[variables.key] == variables.prior[variables.key])) ||
        (request.userInfo.username == 'system:serviceaccount:dev-env-system:dev-env-operator' &&
         !(variables.key in variables.prior) && variables.key in variables.annotations) ||
        (request.userInfo.username == 'system:serviceaccount:dev-env-system:dev-env-broker' &&
         variables.key in variables.prior && !(variables.key in variables.annotations))
      reason: Forbidden
      message: only the operator may add a handoff and only the broker may remove it
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: dev-env-grant-decision-handoff
spec:
  policyName: dev-env-grant-decision-handoff
  validationActions: [Deny]
