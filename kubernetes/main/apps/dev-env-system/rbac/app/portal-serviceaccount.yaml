# Story178: the internal portal's ServiceAccount. The Deployment (portal/app) runs as
# it and projects its token for audience dev-env-operator; the operator's portal
# reader accepts only this account (operator/app/helmrelease.yaml). It has no Role:
# the admission witness and recovery fence and their RBAC are gone (Tom, 2026-10-26:
# "drop the switch"; dev-env#560).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-env-v2-portal
  namespace: dev-agents
automountServiceAccountToken: false
