---
# The private Claude journal is read and compare-and-swapped by name. No create, list,
# watch or update permission, and no additional principal is bound. The access-only
# projection in dev-agents (dev-env-claude-live) is in keeper.yaml: patch, plus get.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-env-keeper-claude-auth
  namespace: dev-env-system
rules:
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [dev-env-keeper-claude-auth]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-env-keeper-claude-auth
  namespace: dev-env-system
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: dev-env-keeper-claude-auth}
subjects: [{kind: ServiceAccount, name: dev-env-keeper, namespace: dev-env-system}]
