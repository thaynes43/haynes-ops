---
# The workbench identity, dev-agents/dev-env-workbench (DESIGN-001 6.11; thaynes43/dev-env
# Story110 T24). The operator already trusts it as a client (--client-service-accounts in
# ../../operator/app/helmrelease.yaml) and the identity guard, the broker guard and the
# Kyverno exec guard already exempt it; until now nothing created it.
#
# It exists so a `workbench`-profile session (../../templates/app/templates.yaml) can run
# `agent-run login`, `pair` and `attach`, which are a `kubectl exec` into another
# session's pod, without the v1 pod. The rights are the least that does that, in
# dev-agents only:
#   - pods get: kubectl exec reads the pod (agent-run gets the pod name from the operator's
#     API, so it needs no list);
#   - pods/exec create: agent-run forces kubectl's SPDY exec, which is a POST. The default
#     WebSocket exec begins as a GET and would also need `get` on pods/exec; it is not granted.
# This Role grants no Secrets and no other write. Since CR-1020 (G-6) the same account
# also holds v1's OPERATOR write tier cluster-wide (./workbench-operator.yaml), including
# pods/exec and pod delete in every namespace. Exec into a session pod reaches that pod's mounted
# credentials (its own HOME, /creds, the keeper's login projections); that is the point of
# login and pair, and why only the workbench profile may run as this account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-env-workbench
  namespace: dev-agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-env-workbench
  namespace: dev-agents
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-env-workbench
  namespace: dev-agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dev-env-workbench
subjects:
  - kind: ServiceAccount
    name: dev-env-workbench
    namespace: dev-agents
