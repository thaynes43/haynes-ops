---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-env-keeper-credentials
  namespace: dev-env-system
rules:
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [dev-env-keeper-credential-journal]
    verbs: [get, patch]
  - apiGroups: [dev-env.haynesops.com]
    resources: [credentialjobs]
    verbs: [get, list, patch, update]
  - apiGroups: [dev-env.haynesops.com]
    resources: [credentialjobs/status]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-env-keeper-credentials
  namespace: dev-env-system
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: dev-env-keeper-credentials}
subjects: [{kind: ServiceAccount, name: dev-env-keeper, namespace: dev-env-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-env-keeper-credentials
  namespace: dev-agents
rules:
  - apiGroups: [dev-env.haynesops.com]
    resources: [accessgrants, agentsessions]
    verbs: [get]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get]
  - apiGroups: ['']
    resources: [pods/exec]
    verbs: [create]
  # hw-ssh credential grants (D-89): the keeper reads the one shared key from this Secret at
  # install time and execs it into the requesting pod. get on this one name only: no list, no
  # watch, no other Secret. Tom's action-specific approval 2026-10-28T01:37:41Z. The keeper
  # already holds pods/exec on every dev-agents pod, so this makes an existing reach explicit.
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [dev-env-hw-ssh-secret]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-env-keeper-credentials
  namespace: dev-agents
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: dev-env-keeper-credentials}
subjects: [{kind: ServiceAccount, name: dev-env-keeper, namespace: dev-env-system}]
