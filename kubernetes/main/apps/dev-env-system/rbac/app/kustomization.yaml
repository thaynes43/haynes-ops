---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./serviceaccounts.yaml
  - ./agent.yaml
  - ./operator.yaml
  - ./keeper.yaml
  - ./broker.yaml
  - ./broker-guard.yaml
  - ./grant-catalog.yaml
  - ./grant-breakglass.yaml
  - ./grant-discovery.yaml
  - ./v1-api-token.yaml
  - ./v2-read.yaml
  - ./agent-guard.yaml
  - ./identity-guard.yaml
  - ./v1-token-guard.yaml
configMapGenerator:
  - name: dev-env-grant-discovery
    namespace: dev-env-system
    files:
      - catalog/generate.py
      - catalog/discovery.json
