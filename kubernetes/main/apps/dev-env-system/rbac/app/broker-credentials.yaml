---
# D-69 execution-job rights only. The keeper's status and private journal are
# deliberately absent. Apply with the unchanged haynes-ops broker fixtures.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-env-broker-credentials
  namespace: dev-env-system
rules:
  - apiGroups: [dev-env.haynesops.com]
    resources: [credentialjobs]
    verbs: [get, list, watch, create, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-env-broker-credentials
  namespace: dev-env-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dev-env-broker-credentials
subjects:
  - kind: ServiceAccount
    name: dev-env-broker
    namespace: dev-env-system
