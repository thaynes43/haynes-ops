---
# DESIGN-070 (OP922): Flux creates the empty ledger once. The operator owns its data.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dev-env-codex-host-capacity
  namespace: dev-env-system
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-env-operator-codex-host-capacity
  namespace: dev-env-system
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [dev-env-codex-host-capacity]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-env-operator-codex-host-capacity
  namespace: dev-env-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dev-env-operator-codex-host-capacity
subjects:
  - kind: ServiceAccount
    name: dev-env-operator
    namespace: dev-env-system
