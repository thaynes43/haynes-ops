---
# The operator, dev-env-system/dev-env-operator (DESIGN-001 6.11, the operator row; D-44,
# D-45, D-46). Namespaced Roles only, plus TokenReview and, for DESIGN-025 H2 (at the
# end), `get` and `list` on Nodes and `get` on Leases in kube-node-lease, for OP252 a
# `get` on one named PersistentVolume, and for DESIGN-061 section 1.1 (OpenProject
# #521) a cluster-wide `get` on PersistentVolumes with no resourceNames: no cluster-wide
# pod or PVC rights, no Secrets, no bind. The manager's cache is scoped to dev-agents
# and the one templates ConfigMap (internal/controller/reconciler.go, CacheOptions), so
# namespaced Roles cover every cached list and watch it makes. The Node list for
# DESIGN-061 section 1.1 is an uncached APIReader list (taskVolumeReleased), so it
# needs list and not watch.
#
# Not the v1 ClusterRole `dev-env-operator`: that name is v1's OPERATOR tier for agents
# (6.11, "Naming note"). These are Roles named dev-env-operator in their own namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-env-operator
  namespace: dev-agents
rules:
  # Exact public inputs for the single approved owned root; no list/watch/write.
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [dev-env-owned-luna-1019-inputs, dev-env-owned-luna-1019-2-inputs, dev-env-owned-luna-1019-3-inputs, dev-env-owned-luna-1019-4-inputs, dev-env-owned-luna-1019-5-inputs, dev-env-owned-luna-1019-6-inputs, dev-env-owned-luna-1019-7-inputs, dev-env-owned-luna-1019-8-inputs, dev-env-owned-luna-1019-9-inputs]
    verbs: [get]
  # Session pods: built once, never rewritten after create (5.1) except the H3 stop request,
  # one activeDeadlineSeconds patch on a Reaping private Session's executor (DESIGN-025 4); deleted
  # only on the guarded paths (D-45); patch for the finalizer the rescue lifts.
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete, get, list, watch, patch]
  # Rescue runs `agentd ctl rescue` by exec before a suspend or an archive (D-10, D-48).
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  # Session volumes; patch lifts the volume's finalizer at archive (5.1, plan 01 step 5).
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, delete, get, list, watch, patch]
  - apiGroups: [""]
    resources: [services]
    verbs: [create, delete, get, list, watch]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
  # The expiry backstop reads an ended AccessGrant's same-named policy, verifies its
  # grant/session/manager labels, then deletes with a UID precondition (plan 07).
  # Direct reads only: the operator never lists or watches network policies here.
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [get, delete]
  # Its own CRD group. The /v1 API creates and deletes sessions; the reconciler patches
  # finalizers and writes status; finalizers update is for clusters that enforce
  # owner-reference permissions (D-44).
  - apiGroups: [dev-env.haynesops.com]
    resources: [agentsessions]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [dev-env.haynesops.com]
    resources: [agentsessions/status]
    verbs: [get, update, patch]
  - apiGroups: [dev-env.haynesops.com]
    resources: [agentsessions/finalizers]
    verbs: [update]
  # Access grants (plan 07, D-54, D-55): the /v1 API creates a session's request,
  # lists and reads them, and patches spec.release when the session gives one back.
  # No accessgrants/status: only the broker decides a grant, so the operator cannot
  # approve one.
  - apiGroups: [dev-env.haynesops.com]
    resources: [accessgrants]
    verbs: [get, list, watch, create, patch]
---
# Tool pods (plan 08): their pods, volumes, Services and namespaced network policies.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-env-operator
  namespace: dev-tools
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete, get, list, watch, patch]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [""]
    resources: [persistentvolumeclaims, services]
    verbs: [create, delete, get, list, watch]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [create, delete, get, list, watch, patch, update]
---
# Its own namespace: the leader-election Lease, and the one templates ConfigMap by name
# (the cache lists and watches it with a metadata.name field selector, which RBAC
# authorizes by resourceNames; D-44).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-env-operator
  namespace: dev-env-system
rules:
  # OP192: existing principal and exact precreated object only; no create/patch/delete.
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [dev-env-provider-allowances]
    verbs: [get, update]
  # OP509 (dev-env DESIGN-059): the passive session readings' store, the exact
  # precreated object only; no create/patch/delete. Unused until the operator
  # runs with --enable-session-allowances.
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [dev-env-session-allowances]
    verbs: [get, update]
  # Exact public inputs for the single approved owned root; no list/watch/write.
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [dev-env-owned-luna-1019, dev-env-owned-luna-1019-2, dev-env-owned-luna-1019-3, dev-env-owned-luna-1019-4, dev-env-owned-luna-1019-5, dev-env-owned-luna-1019-6, dev-env-owned-luna-1019-7, dev-env-owned-luna-1019-8, dev-env-owned-luna-1019-9]
    verbs: [get]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
  # declare-activity's declarations (thaynes43/dev-env D-66): the /v1 API creates, lists
  # and ends them, and the leader deletes them at expiry.
  - apiGroups: [dev-env.haynesops.com]
    resources: [activities]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [dev-env-templates]
    verbs: [get, list, watch]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-env-operator
  namespace: dev-agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dev-env-operator
subjects:
  - kind: ServiceAccount
    name: dev-env-operator
    namespace: dev-env-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-env-operator
  namespace: dev-tools
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dev-env-operator
subjects:
  - kind: ServiceAccount
    name: dev-env-operator
    namespace: dev-env-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-env-operator
  namespace: dev-env-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dev-env-operator
subjects:
  - kind: ServiceAccount
    name: dev-env-operator
    namespace: dev-env-system
---
# TokenReview: the /v1 API authenticates every request with one (D-05, D-46). The
# keeper joins this binding when its endpoint for the operator arrives (6.11, plan 03).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dev-env-tokenreview
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dev-env-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dev-env-tokenreview
subjects:
  - kind: ServiceAccount
    name: dev-env-operator
    namespace: dev-env-system
---
# DESIGN-025 H2 (thaynes43/dev-env #236, 3.2 and 3.5): before the operator records a
# private executor's terminal state, it reads that Pod's Node (exists, not deleting,
# Ready) and the Node's Lease in kube-node-lease (held and owned by that Node, renewed in
# the last 40 seconds), so a live kubelet wrote the terminal status. Those DESIGN-025
# reads are uncached `get`s by name (internal/controller/workspace_stop.go,
# executorNodeLive). No watch and no write. Without these the check fails closed:
# nothing is recorded, and nothing
# ever expires. The same reads also unblock two older paths that have always refused in
# production for lack of them: the shared-workspace stop check
# (workspace_lifecycle.go, verifyWorkspaceStop) and the task-budget evidence check for
# failure and worker-stop events (taskbudget.go). Both apply only to Sessions with
# spec.workspace; none existed when this was granted (2026-10-12).
# DESIGN-061 section 1.1 (OpenProject #521): the clean-up's volume-release check lists
# every Node, then gets each Node. `list` is added on the same rule. Still no watch
# and no write. Each Node's lease stays a `get` by name on
# dev-env-operator-node-lease-read, which already has no resourceNames.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dev-env-operator-node-read
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dev-env-operator-node-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dev-env-operator-node-read
subjects:
  - kind: ServiceAccount
    name: dev-env-operator
    namespace: dev-env-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-env-operator-node-lease-read
  namespace: kube-node-lease
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-env-operator-node-lease-read
  namespace: kube-node-lease
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dev-env-operator-node-lease-read
subjects:
  - kind: ServiceAccount
    name: dev-env-operator
    namespace: dev-env-system
---
# OP252 (Tom review): the original-HOME guard's uncached read of ONE PersistentVolume,
# the bound HOME of dev-agents/dev-env-1019-205125 (thaynes43/dev-env #706:
# internal/controller/original_home.go CheckOriginalHome; used by the /v1 resume and the
# controller). get by name only: no list, no watch, no write, no other PV. Keep it while
# that Session carries dev-env.haynesops.com/original-home-binding: without it every
# later pod creation and guarded resume fails closed (Forbidden -> backoff / 409).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dev-env-operator-original-home-pv-read
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    resourceNames: [pvc-03912a1c-df4d-4b72-811f-2c34dd3abe25]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dev-env-operator-original-home-pv-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dev-env-operator-original-home-pv-read
subjects:
  - kind: ServiceAccount
    name: dev-env-operator
    namespace: dev-env-system
---
# DESIGN-061 section 1.1 (OpenProject #521): the clean-up's volume-release check gets
# the HOME PersistentVolume by the claim's volume name (bound claim UID and the CSI
# volume handle). Cluster-wide get, no resourceNames, no list, no watch, no write.
# The named get in dev-env-operator-original-home-pv-read stays for OP252.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dev-env-operator-volume-release-pv-read
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dev-env-operator-volume-release-pv-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dev-env-operator-volume-release-pv-read
subjects:
  - kind: ServiceAccount
    name: dev-env-operator
    namespace: dev-env-system
