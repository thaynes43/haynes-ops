---
# The v2 identities (DESIGN-001 6.11). They are created here, beside their rights, and
# not by the workloads that use them: the operator and keeper HelmReleases (KICKOFF 8.9)
# must name these ServiceAccounts and not create their own.
#
# dev-env-agent: every session pod runs as it (internal/controller/pod.go,
# ServiceAccountName). Its kube API token is the pod's default projected token; the
# token for the operator's /v1 API is a second projection with audience
# dev-env-operator, which the operator adds itself.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-env-agent
  namespace: dev-agents
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-env-operator
  namespace: dev-env-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-env-keeper
  namespace: dev-env-system
---
# dev-env-broker: the access broker (plan 07), the operator binary's second mode, with
# its own identity so the operator, which serves agents all day, holds none of its
# rights (DESIGN-001 6.12; ./broker.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-env-broker
  namespace: dev-env-system
---
# dev-env-human: no rights at all. It exists so that Tom's admin kubeconfig can mint a
# token for the API's audience (`kubectl create token dev-env-human -n dev-env-system
# --audience dev-env-operator`, D-05); the operator maps it to the `human` caller class.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-env-human
  namespace: dev-env-system
automountServiceAccountToken: false
