---
# Actor-specific guard; no restriction is added to existing v1 maintenance.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: dev-env-credential-job-actors
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [dev-env.haynesops.com]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [credentialjobs, credentialjobs/status]
  matchConditions:
    - name: credential-actors
      expression: "request.userInfo.username in ['system:serviceaccount:dev-env-system:dev-env-keeper', 'system:serviceaccount:dev-env-system:dev-env-broker']"
  validations:
    - expression: "request.namespace == 'dev-env-system'"
      reason: Forbidden
      message: credential actors operate only in their system namespace
    - expression: "request.?subResource.orValue('') != 'status' || request.userInfo.username == 'system:serviceaccount:dev-env-system:dev-env-keeper'"
      reason: Forbidden
      message: only keeper writes credential receipts
    - expression: "request.userInfo.username != 'system:serviceaccount:dev-env-system:dev-env-keeper' || request.?subResource.orValue('') == 'status' || (request.operation == 'UPDATE' && object.spec == oldObject.spec && object.metadata.?labels.orValue({}) == oldObject.metadata.?labels.orValue({}) && object.metadata.?annotations.orValue({}) == oldObject.metadata.?annotations.orValue({}) && object.metadata.?ownerReferences.orValue([]) == oldObject.metadata.?ownerReferences.orValue([]) && object.metadata.?finalizers.orValue([]).filter(f, f != 'dev-env.haynesops.com/credential-cleanup') == oldObject.metadata.?finalizers.orValue([]).filter(f, f != 'dev-env.haynesops.com/credential-cleanup'))"
      reason: Forbidden
      message: keeper may only change its cleanup finalizer on a job request
    - expression: "request.userInfo.username != 'system:serviceaccount:dev-env-system:dev-env-broker' || request.operation != 'UPDATE' || (object.metadata.?labels.orValue({}) == oldObject.metadata.?labels.orValue({}) && object.metadata.?annotations.orValue({}) == oldObject.metadata.?annotations.orValue({}) && object.metadata.?ownerReferences.orValue([]) == oldObject.metadata.?ownerReferences.orValue([]) && object.metadata.?finalizers.orValue([]) == oldObject.metadata.?finalizers.orValue([]))"
      reason: Forbidden
      message: broker may only release an existing job request
    - expression: "request.userInfo.username != 'system:serviceaccount:dev-env-system:dev-env-broker' || request.operation != 'DELETE' || (oldObject.?status.?phase.orValue('') == 'Revoked' && oldObject.?status.?revokedAt.hasValue())"
      reason: Forbidden
      message: broker may only delete a keeper-confirmed revoked job
    - expression: "request.operation != 'CREATE' || object.metadata.name == 'credential-' + object.spec.grant.uid"
      reason: Forbidden
      message: a job name identifies its immutable grant UID
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: dev-env-credential-job-actors
spec:
  policyName: dev-env-credential-job-actors
  validationActions: [Deny]
