---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# dev-env v2 identities and what they may do (DESIGN-001 6.11, D-19, D-46; KICKOFF 8.4):
# the ServiceAccounts, their Roles and bindings, and the two admission policies that
# hold the agent to the runbooks (dev-env-agent-guard) and keep every dev-agents
# identity out of the dev-env namespaces and away from other identities
# (dev-env-identity-guard). The Kyverno half of the guard, the exec rule, is
# dev-env-exec-guard in the kyverno-policies Kustomization.
#
# No targetNamespace: these objects live in dev-agents, dev-env-system, dev (v1's
# own-token Role) and database (the CNPG PVC-delete binding), and cluster-wide.
# Nothing here touches a running pod; a Role or a policy change restarts nothing.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app dev-env-rbac
  namespace: dev-env-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/main/apps/dev-env-system/rbac/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  wait: true
  interval: 30m
  timeout: 5m
  # NO postBuild.substitute: the CEL in the policies must reach the API server as written.
