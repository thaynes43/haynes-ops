---
# Temporary Q-22 delivery: only the existing owner's public CA line. The private CA
# remains in the separate keeper-only projection. Remove this app after node trust.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-keeper-node-trust-public
  namespace: dev-env-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-keeper-node-trust-public
    creationPolicy: Owner
  data:
    - secretKey: public-key
      remoteRef:
        key: dev-env
        property: SSH_CA_PUBLIC_KEY
        decodingStrategy: None
