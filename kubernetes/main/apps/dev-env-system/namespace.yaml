---
apiVersion: v1
kind: Namespace
metadata:
  name: dev-env-system
  labels:
    # The operator and keeper hold the Claude Max login and the GitHub App keys, so
    # this namespace gets the same tight boundary as upgrade-agent: Pod Security
    # Admission "restricted". Their pods are non-root, read-only-rootfs, no caps.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # Marks the dev-env namespaces. The network policies select by namespace name; the
    # label is for anything that needs to tell these namespaces apart.
    dev-env.haynesops.com/role: system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
