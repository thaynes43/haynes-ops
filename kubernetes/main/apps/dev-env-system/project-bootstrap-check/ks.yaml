---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-env-project-bootstrap-check
  namespace: dev-env-system
spec:
  # Both terminal bootstrap attempts remain retained unchanged. Only the
  # separately named roots check is a health gate; cleanup requires reviewed GitOps.
  suspend: false
  path: ./kubernetes/main/apps/dev-env-system/project-bootstrap-check/app
  prune: true
  force: false
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  wait: false
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: dev-env-private-project-roots-check-1011
      namespace: dev-agents
  interval: 30m
  timeout: 11m
  dependsOn:
    - name: dev-env-projects
    - name: dev-env-network
