---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-env-project-bootstrap-check
  namespace: dev-env-system
spec:
  # One model-free check of the signed 2.13.0 binary. Retain the completed Job
  # until its receipt is captured, then retire this fixture through reviewed GitOps.
  suspend: false
  path: ./kubernetes/main/apps/dev-env-system/project-bootstrap-check/app
  prune: true
  force: false
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  wait: true
  interval: 30m
  timeout: 11m
  dependsOn:
    - name: dev-env-projects
    - name: dev-env-network
