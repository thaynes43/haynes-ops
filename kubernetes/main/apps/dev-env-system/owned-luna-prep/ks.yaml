# One approved bounded owned root; retain Pod/HOME/evidence after the attempt.
# After first admission, remove each one-shot root resource entry; prune-disabled keeps its Pod.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-env-owned-luna-prep
  namespace: dev-env-system
spec:
  path: ./kubernetes/main/apps/dev-env-system/owned-luna-prep/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  wait: true
  interval: 30m
  timeout: 3m
  dependsOn:
    - name: dev-env-network
    - name: dev-env-pki
