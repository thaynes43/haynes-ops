# Story 214: exact pod selectors and a single port per standing approval.
# These authorize network reachability only; application credentials are separate.
---
apiVersion: dev-env.haynesops.com/v1alpha1
kind: GrantPolicy
metadata:
  name: haynesnetwork-32400
  namespace: dev-env-system
  labels:
    app.kubernetes.io/part-of: dev-env-grants
spec:
  description: >-
    Haynesnetwork media service access on TCP 32400 to plex, plexops.
  repos: [haynesnetwork]
  profiles: [full, dev, workbench]
  type: egress
  egress:
    endpoints:
      - namespace: media
        matchLabels:
          app.kubernetes.io/name: plex
      - namespace: media
        matchLabels:
          app.kubernetes.io/name: plexops
    ports:
      - port: 32400
        protocol: TCP
  maxTTL: 8h
---
