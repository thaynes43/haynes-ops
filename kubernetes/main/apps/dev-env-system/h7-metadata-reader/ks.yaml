---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-env-h7-metadata-reader
  namespace: dev-env-system
spec:
  path: ./kubernetes/main/apps/dev-env-system/h7-metadata-reader/app
  prune: false
  force: false
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  wait: true
  interval: 30m
  timeout: 5m
  dependsOn:
    - name: dev-env-network
    - name: dev-env-rbac
    - name: kyverno-policies
      namespace: kyverno
