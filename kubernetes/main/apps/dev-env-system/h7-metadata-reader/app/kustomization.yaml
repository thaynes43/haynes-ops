---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: dev-env-h7-metadata-reader
    namespace: dev-env-system
    files:
      - collector.py
      - expected.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
