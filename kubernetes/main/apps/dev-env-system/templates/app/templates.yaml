# dev-env-templates, key templates.yaml (DESIGN-001 D-44). The operator parses this
# strictly: an unknown or repeated field, a missing size class, or a mount over a path
# the operator owns leaves NEW sessions Pending with the reason; running pods are not
# affected. The shape is thaynes43/dev-env internal/templates/testdata/templates.yaml,
# which that repo's tests parse.

# The agent image (thaynes43/dev-env D-53): publish-agent.yml pushes dev-env:2.x.y from the
# v2.x.y release tag and signs it keyless (Kyverno verify-dev-env-v2 trusts that subject).
# 2.0.0 is the first release (thaynes43/dev-env #52). Pinned by tag and digest; Renovate
# tracks this line with its own regex manager (.renovate/customManagers.json5), and the
# dev-env manual-merge rule applies. A change here reaches NEW sessions only: running
# pods keep their image and are reported Outdated (D-44).
# v2.29.4 source f315635ad6fc30129da4e0310295634e57b78422 (release dev-env#359).
# publish-agent.yml run 38990226874 smoke-tested/signed/verified on refs/tags/v2.29.4.
image: ghcr.io/thaynes43/dev-env:2.29.4@sha256:9f1213cce94cc0ad33fc01eb124136ec82a6cc47f1c9d7a997775ae3a5117bd2

# DESIGN-001 7.2 (Q-04): requests are typical use, limits cap bursts. A CPU limit is
# mandatory; the Kyverno policy dev-env-require-cpu-limit refuses a session pod without
# one and any container above class L.
sizes:
  S:
    requests: { cpu: 100m, memory: 1Gi }
    limits: { cpu: "2", memory: 4Gi }
  M:
    requests: { cpu: 250m, memory: 2Gi }
    limits: { cpu: "4", memory: 8Gi }
  L:
    requests: { cpu: "1", memory: 6Gi }
    limits: { cpu: "8", memory: 24Gi }

# D-22 (Q-05): one RWO volume per session on gasha01-rbd, so agent disk load stays off the
# in-cluster OSDs on the control-plane nodes. If spike S-8 shows size L slower than twice
# ceph-block, move L alone by adding `storageClassName: ceph-block` under sizes.L.
home:
  storageClassName: gasha01-rbd
  size: 20Gi

# D-09's timers (thaynes43/dev-env D-60, D-62), each optional with D-09's default.
# The revision leaves them out, so a change here marks no session Outdated. A session's
# own spec.lifecycle (agent-run --idle-suspend-after, --archive-after) overrides them.
lifecycle:
  # A task session that is not busy, once nothing has happened in it this long.
  taskIdleSuspendAfter: 1h
  # A local or remote session whose agent is idle, with no client attached.
  idleSuspendAfter: 72h
  # A suspended session's volume, after a valid rescue; the session stays Archived.
  archiveAfter: 168h
  # Rescue bundles on dev-env-shared (plan 02 step 11).
  bundleRetention: 720h

# The RWX claim every pod mounts at /home/dev/.shared (storage/app, claim dev-env-shared).
sharedClaim: dev-env-shared

env:
  - { name: CLAUDE_CONFIG_DIR, value: /home/dev/.claude }
  - { name: CODEX_HOME, value: /home/dev/.codex }
  - { name: DISABLE_AUTOUPDATER, value: "1" }
  # DESIGN-006: catalog-wide private bootstrap at startup and explicit refresh.
  # The existing dev-env-agent ClusterRole already grants ConfigMap GET; no new
  # worker permission or private-project task admission follows from these settings.
  - { name: AGENTD_ENABLE_PRIVATE_PROJECT_BOOTSTRAP, value: "true" }
  - { name: AGENTD_ENABLE_PRIVATE_PROJECT_ROOTS, value: "true" }
  - { name: AGENTD_PROJECT_CATALOG, value: dev-env-system/dev-env-project-catalog }
  - { name: AGENTD_PROJECT_CLONE_OWNER, value: thaynes43 }
  # The pod-wide Claude default (Opus 5.5). Full model ids, never aliases.
  - { name: DEV_ENV_CLAUDE_MODEL, value: claude-opus-5-5 }
  # The dev-env CA, which signed the /v1 API's certificate (D-46, KICKOFF 8.9): agentd's
  # heartbeat and agent-run both add it to the system roots. The operator sets
  # AGENTD_API_URL from its --api-url; the CA comes from the api-ca mount below.
  - { name: AGENTD_API_CA_FILE, value: /opt/dev-env/api-ca/ca.crt }

# The GitOps config agentd renders, in v1's layout (D-14, D-49). The four ConfigMaps are
# built in dev-agents by ../../session-config (KICKOFF 8.8a), as v2 copies of v1's files.
# A pod waits in ContainerCreating until every ConfigMap below exists (api-ca comes
# from ../../pki). codex-requirements is Codex's admin floor (approval never, sandbox
# danger-full-access; D-23) at the system path Codex reads; every pod gets it, because
# every image carries Codex.
mounts:
  - { name: config-claude, configMap: dev-env-config-claude, path: /opt/dev-env/config/claude }
  - { name: config-codex, configMap: dev-env-config-codex, path: /opt/dev-env/config/codex }
  - { name: scripts, configMap: dev-env-scripts, path: /opt/dev-env/scripts, defaultMode: 0555 }
  - { name: codex-requirements, configMap: dev-env-codex-requirements, path: /etc/codex }
  # The dev-env CA certificate (public), pinned in git by ../../pki (ConfigMap
  # dev-env-api-ca in dev-agents). AGENTD_API_CA_FILE above names its ca.crt.
  - { name: api-ca, configMap: dev-env-api-ca, path: /opt/dev-env/api-ca }

# The static Claude token (6.1), for task and local sessions only. The Secret is an
# ExternalSecret in dev-agents (KICKOFF 8.8).
claude:
  staticToken: { name: dev-env-claude-secret, key: CLAUDE_CODE_OAUTH_TOKEN }

# D-18. `full` and `dev` carry the cigar-journal MCP token as `ops` does (mcp.json's
# ${CIGAR_JOURNAL_TOKEN}, from its own Secret dev-env-cigar-secret, not dev-env-mcp-secret),
# so no profile that gets mcp.json renders a broken Authorization header.
# MCP-Unifi uses its own Secret in these three profiles too; bounded rule canaries
# retain their credential-minimal profiles. Platform egress already permits /mcp.
# Every Secret named below is created by 8.8 (ExternalSecrets and the empty keeper-owned
# ones). dev-env-mcp-secret must hold v1's MCP tokens WITHOUT the Proxmox
# operator token and the hw-ssh key (Q-07: those come only as grants).
defaultProfile: full
profiles:
  rule-canary-claude:
    mounts:
      - { name: gh-token, secret: dev-env-gh-token, path: /creds }
  rule-canary-codex:
    env:
      - { name: AGENTD_CODEX_ACCESS_FILE, value: /opt/dev-env/codex-access/access.json }
    mounts:
      - { name: gh-token, secret: dev-env-gh-token, path: /creds }
      - { name: codex-access, secret: dev-env-codex-live, path: /opt/dev-env/codex-access, defaultMode: 0440 }
  full:
    env:
      - name: CIGAR_JOURNAL_TOKEN
        valueFrom: { secretKeyRef: { name: dev-env-cigar-secret, key: CIGAR_JOURNAL_TOKEN } }
      - name: UNIFI_MCP_AUTH_TOKEN
        valueFrom: { secretKeyRef: { name: dev-env-unifi-secret, key: UNIFI_MCP_AUTH_TOKEN, optional: true } }
      - name: OMNI_ENDPOINT
        value: https://haynes.na-west-1.omni.siderolabs.io:443
      - name: OMNI_SERVICE_ACCOUNT_KEY
        valueFrom: { secretKeyRef: { name: dev-env-node-triage-secret, key: OMNI_SERVICE_ACCOUNT_KEY } }
      - { name: GOOGLE_APPLICATION_CREDENTIALS, value: /etc/gcp/sa_key.json }
    envFrom:
      - secretRef: { name: dev-env-mcp-secret }
      # Preserve v1's optional reader Secret; LAN access still needs an egress grant.
      - secretRef: { name: dev-env-proxmox-secret, optional: true }
      - secretRef: { name: dev-env-cloudflare-secret }
    mounts:
      - { name: gh-token, secret: dev-env-gh-token, path: /creds }
      - { name: gcp-sa, secret: dev-env-gcp-secret, path: /etc/gcp, defaultMode: 0440 }
  dev:
    env:
      - name: CIGAR_JOURNAL_TOKEN
        valueFrom: { secretKeyRef: { name: dev-env-cigar-secret, key: CIGAR_JOURNAL_TOKEN } }
      - name: UNIFI_MCP_AUTH_TOKEN
        valueFrom: { secretKeyRef: { name: dev-env-unifi-secret, key: UNIFI_MCP_AUTH_TOKEN, optional: true } }
    envFrom:
      - secretRef: { name: dev-env-mcp-secret }
    mounts:
      - { name: gh-token, secret: dev-env-gh-token, path: /creds }
  # Summoned sessions (3.7): no open web. The label selects the ops egress tier, which is
  # not built yet (an `ops` pod has the platform tier only until it is).
  ops:
    env:
      - name: CIGAR_JOURNAL_TOKEN
        valueFrom: { secretKeyRef: { name: dev-env-cigar-secret, key: CIGAR_JOURNAL_TOKEN } }
      - name: UNIFI_MCP_AUTH_TOKEN
        valueFrom: { secretKeyRef: { name: dev-env-unifi-secret, key: UNIFI_MCP_AUTH_TOKEN, optional: true } }
    envFrom:
      - secretRef: { name: dev-env-proxmox-secret, optional: true }
    mounts:
      - { name: gh-token, secret: dev-env-ops-gh-token, path: /creds }
    labels:
      dev-env.haynesops.com/egress: ops
