---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# OP477 db-check: its own Kustomization (wait false, no health checks), so a FAIL or a
# Job that never schedules cannot hold back the portal Kustomization. Nothing depends on it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-env-v2-portal-db-check
  namespace: dev-env-system
spec:
  # Only the egress policy the Job relies on. The portal Kustomization does
  # not depend on this one, and this one does not gate on the Job.
  dependsOn:
    - name: dev-env-v2-portal-policy
      namespace: dev-env-system
  path: ./kubernetes/main/apps/dev-env-system/portal-db-check/app
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  interval: 30m
  retryInterval: 1m
  timeout: 2m
