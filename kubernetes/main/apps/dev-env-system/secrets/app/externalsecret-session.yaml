---
# What a v2 session pod gets from 1Password (DESIGN-001 6.1, 6.5, D-18). The Secret names
# are the ones dev-env-templates references (templates/app/templates.yaml). Each is its own
# ExternalSecret, the isolation v1 uses: a missing or mislabelled 1Password property fails
# the WHOLE ExternalSecret, so one bad field must not take the others down. Every field
# below already feeds v1's ExternalSecrets of the same properties (apps/dev/dev-env/app/
# externalsecret.yaml), so they all resolve.
#
# NOT here, by design (Q-07): the Proxmox read and operator tokens, the hw-ssh key, the
# Omni keys, the GCP key and the Cloudflare tokens. Those reach a session only as an
# AccessGrant, never by default. Check the dev-env repo before adding a field to the
# MCP Secret.
#
# WARNING (from v1): an ExternalSecret whose 1Password field does not exist goes
# SecretSyncedError, and under `wait: true` that fails this whole Kustomization and pages.
# Add a field here only after it exists in 1Password.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-mcp
  namespace: dev-agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-mcp-secret
    creationPolicy: Owner
  data:
    # ${HA_MCP_SECRET_PATH}, ${OUTLINE_API_KEY} and ${VEXA_API_KEY} are the placeholders in
    # session-config's mcp.json. envFrom puts the keys in the pod environment, where agentd
    # expands them at registration.
    - secretKey: HA_MCP_SECRET_PATH
      remoteRef: { key: ha-mcp, property: MCP_SECRET_PATH }
    - secretKey: OUTLINE_API_KEY
      remoteRef: { key: sigo-dev-env, property: OUTLINE_API_KEY }
    - secretKey: VEXA_API_KEY
      remoteRef: { key: sigo-dev-env, property: VEXA_API_KEY }
---
# The static Claude token (6.1) for task and local sessions. No refresh token, so many pods
# may use it at once. Referenced by templates.yaml `claude.staticToken`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-claude
  namespace: dev-agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-claude-secret
    creationPolicy: Owner
  data:
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef: { key: dev-env, property: CLAUDE_CODE_OAUTH_TOKEN }
---
# Cigar Journal MCP token (${CIGAR_JOURNAL_TOKEN} in mcp.json). Its own Secret, as in v1: the
# `ops` profile mounts only this one key, and `full` and `dev` take it from the profile's
# env, so a token typo cannot take the other MCP tokens down.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-cigar
  namespace: dev-agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-cigar-secret
    creationPolicy: Owner
  data:
    - secretKey: CIGAR_JOURNAL_TOKEN
      remoteRef: { key: dev-env, property: CIGAR_JOURNAL_TOKEN }
