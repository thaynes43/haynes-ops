---
# What a v2 session pod gets from 1Password (DESIGN-001 6.1, 6.5, D-18). The Secret names
# are the ones dev-env-templates references (templates/app/templates.yaml). Each is its own
# ExternalSecret, the isolation v1 uses: a missing or mislabelled 1Password property fails
# the WHOLE ExternalSecret, so one bad field must not take the others down. Every field
# below already feeds v1's ExternalSecrets of the same properties (apps/dev/dev-env/app/
# externalsecret.yaml), so they all resolve.
#
# NOT here, by design (Q-07): the Proxmox operator token and the hw-ssh private key.
# Those reach a session only as a short-lived AccessGrant. Q-07 keeps the Proxmox read
# token in the baseline; full also retains v1's Omni Reader, GCP and Cloudflare access
# (Q-16). Their separate Secrets below keep those credentials out of profile dev's
# shared MCP Secret. The Omni operator key remains unmounted, as in v1.
#
# WARNING (from v1): an ExternalSecret whose 1Password field does not exist goes
# SecretSyncedError, and under `wait: true` that fails this whole Kustomization and pages.
# Add a field here only after it exists in 1Password.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-mcp
  namespace: dev-agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-mcp-secret
    creationPolicy: Owner
  data:
    # ${HA_MCP_SECRET_PATH}, ${OUTLINE_API_KEY} and ${VEXA_API_KEY} are the placeholders in
    # session-config's mcp.json. envFrom puts the keys in the pod environment, where agentd
    # expands them at registration.
    - secretKey: HA_MCP_SECRET_PATH
      remoteRef: { key: ha-mcp, property: MCP_SECRET_PATH }
    - secretKey: OUTLINE_API_KEY
      remoteRef: { key: sigo-dev-env, property: OUTLINE_API_KEY }
    - secretKey: VEXA_API_KEY
      remoteRef: { key: sigo-dev-env, property: VEXA_API_KEY }
---
# The static Claude token (6.1) for task and local sessions. No refresh token, so many pods
# may use it at once. Referenced by templates.yaml `claude.staticToken`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-claude
  namespace: dev-agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-claude-secret
    creationPolicy: Owner
  data:
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef: { key: dev-env, property: CLAUDE_CODE_OAUTH_TOKEN }
---
# Cigar Journal MCP token (${CIGAR_JOURNAL_TOKEN} in mcp.json). Its own Secret, as in v1, so
# a token typo cannot take the other MCP tokens down. Every profile (`full`, `dev`, `ops`)
# wires it in templates.yaml with a secretKeyRef (D-18: the MCP tokens, and for ops the
# cigar-journal token for curation).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-cigar
  namespace: dev-agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-cigar-secret
    creationPolicy: Owner
  data:
    - secretKey: CIGAR_JOURNAL_TOKEN
      remoteRef: { key: dev-env, property: CIGAR_JOURNAL_TOKEN }
---
# PVEAuditor read access, retained by full and ops (D-18, Q-07). Same existing item and
# properties as v1; the Proxmox operator token is not part of this Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-proxmox
  namespace: dev-agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-proxmox-secret
    creationPolicy: Owner
  data:
    - secretKey: PVE_TOKEN_ID
      remoteRef: { key: proxmox, property: PROXMOX_API_TOKEN_ID }
    - secretKey: PVE_TOKEN_SECRET
      remoteRef: { key: proxmox, property: PROXMOX_API_TOKEN_SECRET }
---
# Full's Omni Reader identity, unchanged from v1. talosctl obtains its proxied
# talosconfig through omnictl at runtime; no Talos certificate or operator key is mounted.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-node-triage
  namespace: dev-agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-node-triage-secret
    creationPolicy: Owner
  data:
    - secretKey: OMNI_SERVICE_ACCOUNT_KEY
      remoteRef: { key: dev-env, property: OMNI_SERVICE_ACCOUNT_KEY }
---
# Full's existing GCP ADC key. templates.yaml mounts this file at v1's /etc/gcp path.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-gcp
  namespace: dev-agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-gcp-secret
    creationPolicy: Owner
  data:
    - secretKey: sa_key.json
      remoteRef: { key: sigo-dev-env, property: SA_KEY_JSON }
---
# Full's existing Cloudflare DNS tokens. Keep them separate from the MCP Secret,
# which also feeds the narrower dev profile.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-cloudflare
  namespace: dev-agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-cloudflare-secret
    creationPolicy: Owner
  data:
    - secretKey: CLOUDFLARE_SIGO_DNS_TOKEN
      remoteRef: { key: sigo-dev-env, property: CLOUDFLARE_SIGO_DNS_TOKEN }
    - secretKey: CLOUDFLARE_PERSONAL_DNS_TOKEN
      remoteRef: { key: dev-env, property: CLOUDFLARE_PERSONAL_DNS_TOKEN }
