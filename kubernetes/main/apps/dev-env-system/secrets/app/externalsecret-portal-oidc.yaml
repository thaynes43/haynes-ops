# Single BFF consumer in dev-agents. Do not also apply the
# dev-env-system proposal. remoteRef.key is the existing HaynesKube item
# dev-env. Supersedes the prior item name dev-env-v2-portal. Object name unchanged.
# Only OIDC_CLIENT_ID and OIDC_CLIENT_SECRET. No dataFrom.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-v2-portal-oidc
  namespace: dev-agents
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 1h
  target:
    name: dev-env-v2-portal-oidc
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        OIDC_CLIENT_ID: '{{ .OIDC_CLIENT_ID }}'
        OIDC_CLIENT_SECRET: '{{ .OIDC_CLIENT_SECRET }}'
  data:
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: dev-env
        property: OIDC_CLIENT_ID
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: dev-env
        property: OIDC_CLIENT_SECRET
