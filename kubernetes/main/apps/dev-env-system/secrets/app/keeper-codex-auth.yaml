---
# GitOps creates the private Codex journal empty and never reconciles its data.
# Auth remains disabled; no token, account, login challenge or v1 state is in git.
apiVersion: v1
kind: Secret
metadata:
  name: dev-env-keeper-codex-auth
  namespace: dev-env-system
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
