---
# D-69: create the private journal once, empty. The keeper alone patches
# data.journal.json through its named get/patch Role; never add data or stringData
# here. IfNotPresent prevents Flux from re-applying keeper-owned fields, and
# prune disabled preserves durable cleanup intent when GitOps resources change.
apiVersion: v1
kind: Secret
metadata:
  name: dev-env-keeper-credential-journal
  namespace: dev-env-system
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
