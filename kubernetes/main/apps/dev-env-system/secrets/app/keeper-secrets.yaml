---
# The keeper-owned Secrets in dev-agents (plan 01 "The keeper's inputs", D-52). Created
# EMPTY (type Opaque, no data) so the keeper Role's resourceNames and the templates' mounts
# resolve before the keeper first writes. The keeper alone writes `data.gh_token` (or the
# plan's keys) and the dev-env.haynesops.com/expires-at and written-at annotations.
#
# `ssa: IfNotPresent` makes Flux create each Secret once and never touch it again, so a
# reconcile cannot blank what the keeper wrote. `prune: disabled` stops a removed line here
# from deleting a live credential. Neither annotation is a secret.
---
# the haynes-dev-bot token the keeper mints every 40 minutes (plan 01, D-52); session pods mount it at /creds
apiVersion: v1
kind: Secret
metadata:
  name: dev-env-gh-token
  namespace: dev-agents
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
---
# the ops bot's token, for summoned sessions (plan 10)
apiVersion: v1
kind: Secret
metadata:
  name: dev-env-ops-gh-token
  namespace: dev-agents
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
---
# the live Claude Max access token the keeper writes (plan 03)
apiVersion: v1
kind: Secret
metadata:
  name: dev-env-claude-live
  namespace: dev-agents
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
---
# the live Codex access token the keeper writes (plan 04)
apiVersion: v1
kind: Secret
metadata:
  name: dev-env-codex-live
  namespace: dev-agents
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
