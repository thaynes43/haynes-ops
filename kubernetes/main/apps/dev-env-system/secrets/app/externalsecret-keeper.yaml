---
# The keeper's GitHub App credentials (D-52, plan 01 "The keeper's inputs"). Same 1Password
# item and properties v1's `dev-env-bot` ExternalSecret reads (apps/dev/dev-env/app/
# externalsecret.yaml, haynes-dev-bot, App ID 4291021); v1's copy is untouched. Only the
# keeper mounts this Secret (8.9), read-only at /etc/dev-env-keeper/github-dev-bot, one
# file per key below. Session pods never see the PEM: they get the minted ghs_ token.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-keeper-github-dev-bot
  namespace: dev-env-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-keeper-github-dev-bot
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef: { key: github-dev-bot, property: GITHUB_BOT_APP_CLIENT_ID }
    - secretKey: app-id
      remoteRef: { key: github-dev-bot, property: GITHUB_BOT_APP_ID }
    - secretKey: installation-id
      remoteRef: { key: github-dev-bot, property: GITHUB_BOT_APP_INSTALLATION_ID }
    - secretKey: private-key
      remoteRef: { key: github-dev-bot, property: GITHUB_BOT_APP_PRIVATE_KEY }
