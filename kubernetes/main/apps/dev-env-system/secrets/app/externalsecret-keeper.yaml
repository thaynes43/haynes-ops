---
# The keeper's GitHub App credentials (D-52, plan 01 "The keeper's inputs"). Same 1Password
# item and properties v1's `dev-env-bot` ExternalSecret reads (apps/dev/dev-env/app/
# externalsecret.yaml, haynes-dev-bot, App ID 4291021); v1's copy is untouched. Only the
# keeper mounts this Secret (8.9), read-only at /etc/dev-env-keeper/github-dev-bot, one
# file per key below. Session pods never see the PEM: they get the minted ghs_ token.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-keeper-github-dev-bot
  namespace: dev-env-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-keeper-github-dev-bot
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef: { key: github-dev-bot, property: GITHUB_BOT_APP_CLIENT_ID }
    - secretKey: app-id
      remoteRef: { key: github-dev-bot, property: GITHUB_BOT_APP_ID }
    - secretKey: installation-id
      remoteRef: { key: github-dev-bot, property: GITHUB_BOT_APP_INSTALLATION_ID }
    - secretKey: private-key
      remoteRef: { key: github-dev-bot, property: GITHUB_BOT_APP_PRIVATE_KEY }
---
# The keeper's second GitHub App: haynes-ops-bot, the upgrade automation's bot
# (dev-env DESIGN-064 6.2, OpenProject 736). Same 1Password item and properties v1's
# `upgrade-shepherd-bot` ExternalSecret reads (apps/upgrade-agent/shepherd/app/
# externalsecret.yaml, item `github-bot`); v1's copy is untouched, and dev-env-ops keeps
# minting from it until it is retired. An installation token has no refresh token, so two
# minters of one App do not revoke each other.
# Only the keeper mounts this Secret, read-only at /etc/dev-env-keeper/github-ops-bot, one
# file per key below, and only once its HelmRelease says so: this object alone starts
# nothing. The keeper mints a token down-scoped to v1's permission set and a repository
# list into dev-agents/dev-env-ops-gh-token, which only profile `ops` mounts. Session pods
# never see the PEM.
# The keeper holding this key is Tom's decision of 2026-11-11 (gate T-1 of DESIGN-064 8.1):
# the same bot with the same rights. A wider permission set or repository list is a new
# question for him.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-keeper-github-ops-bot
  namespace: dev-env-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-keeper-github-ops-bot
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef: { key: github-bot, property: GITHUB_BOT_APP_CLIENT_ID }
    - secretKey: app-id
      remoteRef: { key: github-bot, property: GITHUB_BOT_APP_ID }
    - secretKey: installation-id
      remoteRef: { key: github-bot, property: GITHUB_BOT_APP_INSTALLATION_ID }
    - secretKey: private-key
      remoteRef: { key: github-bot, property: GITHUB_BOT_APP_PRIVATE_KEY }
