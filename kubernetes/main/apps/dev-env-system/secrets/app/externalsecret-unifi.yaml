---
# Dedicated secret so a missing UniFi field cannot break the other MCP clients.
# The owner creates MCP_AUTH_TOKEN in 1Password item unifi-mcp before this syncs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-unifi
  namespace: dev-agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-unifi-secret
    creationPolicy: Owner
  data:
    - secretKey: UNIFI_MCP_AUTH_TOKEN
      remoteRef: { key: unifi-mcp, property: MCP_AUTH_TOKEN }
