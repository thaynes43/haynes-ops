---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The hardware SSH key for the `workbench` profile ONLY (Story110 T29; Tom's ruling
# Q-110-08, which reverses Q-07 for this one profile). Same 1Password item
# and field v1 reads (apps/dev/dev-env/app/externalsecret.yaml, ES dev-env-hw-ssh:
# key `dev-env`, property HW_SSH_PRIVATE_KEY_B64), so the field already exists and this
# resolves. The value is the base64 of the key FILE on one line; agentd's `hw-ssh-key`
# boot step decodes it to ~/.ssh/dev-env-hw (0600). Its own ExternalSecret, as v1 does,
# so a bad field cannot take the others down. templates.yaml wires it into `workbench`
# and into no other profile; no `full`, `dev` or `ops` pod receives it.
# Root-equivalent reach: PVE nodes (sudo allowlist incl. `qm`), HaynesTower (Unraid root),
# PiKVM (root). Network reach still needs the lan-ssh-tier egress grant.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-hw-ssh
  namespace: dev-agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-hw-ssh-secret
    creationPolicy: Owner
  data:
    - secretKey: HW_SSH_PRIVATE_KEY_B64
      remoteRef: { key: dev-env, property: HW_SSH_PRIVATE_KEY_B64 }
