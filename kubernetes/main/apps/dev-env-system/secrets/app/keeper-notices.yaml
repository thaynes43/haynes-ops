---
# The keeper's notice deduplication state (dev-env plan 13, story 13.1): when it last warned
# about the Claude login and which NeedsLogin incidents it announced. Times and incident ids
# only, no secret. Created EMPTY so the keeper's Role (rbac/app/keeper-notices.yaml, this
# name only: get, update, patch, never create or list) resolves before the keeper first
# writes key state.json. `ssa: IfNotPresent` makes Flux create it once and never touch it
# again, so a reconcile cannot blank what the keeper wrote; `prune: disabled` keeps it if
# this line is ever removed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dev-env-keeper-notices
  namespace: dev-env-system
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    kustomize.toolkit.fluxcd.io/prune: disabled
