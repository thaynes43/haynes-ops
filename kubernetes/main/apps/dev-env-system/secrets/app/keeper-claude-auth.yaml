---
# GitOps creates the private Claude journal empty and never reconciles its data.
# A fresh keeper-owned login is required; no token, account, login challenge or v1
# state is in git. IfNotPresent keeps Flux from re-applying keeper-owned fields, and
# prune disabled keeps the journal if this line is ever removed.
apiVersion: v1
kind: Secret
metadata:
  name: dev-env-keeper-claude-auth
  namespace: dev-env-system
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
