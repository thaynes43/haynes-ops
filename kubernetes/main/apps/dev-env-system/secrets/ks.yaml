---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The v2 Secrets (DESIGN-001 6.1, 6.5, D-18, D-52; KICKOFF 8.8): ExternalSecrets that
# copy v1's 1Password items into dev-agents and dev-env-system, and the empty
# keeper-owned Secrets. No Reloader and no restart hook: a Secret change reaches a
# session pod only when it is next created (env) or re-read (mount), never by restart.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app dev-env-secrets
  namespace: dev-env-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/main/apps/dev-env-system/secrets/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  wait: true
  interval: 30m
  timeout: 5m
  # NO postBuild.substitute: nothing here is templated.
