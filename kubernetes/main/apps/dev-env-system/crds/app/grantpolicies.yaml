# The GrantPolicy CRD, generated by controller-gen v0.22.0 in thaynes43/dev-env
# (config/crd/dev-env.haynesops.com_grantpolicies.yaml, added by dev-env e588f29, PR #66, plan 07
# step 1; copied verbatim below). Never edit it here: change api/v1alpha1 in dev-env,
# run `make generate`, and copy the result. The prune-disabled annotation is added by
# kustomization.yaml, so this file stays byte-identical to the generated one.
#
# Keep it in step with the operator and the broker, as agentsessions.yaml says: copy a
# changed file here before (or with) the pin that writes its new fields.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: grantpolicies.dev-env.haynesops.com
spec:
  group: dev-env.haynesops.com
  names:
    kind: GrantPolicy
    listKind: GrantPolicyList
    plural: grantpolicies
    singular: grantpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.maxTTL
      name: Max-TTL
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          GrantPolicy is a standing approval, written in haynes-ops and applied by Flux
          to dev-env-system (DESIGN-001 6.12). The broker approves a matching request
          at once and records it under the policy's name.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              GrantPolicySpec is a standing approval. A request matches when its type is
              the policy's type, its requester matches every requester list the policy sets,
              its scope lies inside the policy's scope, and its TTL is at most maxTTL.
            properties:
              agents:
                description: Agents are the requester agent CLIs it matches; empty
                  means any.
                items:
                  description: AgentKind is the agent CLI a session runs.
                  enum:
                  - claude
                  - codex
                  - opencode
                  type: string
                maxItems: 3
                type: array
                x-kubernetes-list-type: set
              credential:
                description: Credential is the credentials it approves.
                properties:
                  names:
                    description: Names are the credentials.
                    items:
                      description: CredentialName is a credential a credential grant
                        can install (Q-07).
                      enum:
                      - proxmox
                      - hw-ssh
                      type: string
                    maxItems: 2
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                required:
                - names
                type: object
              description:
                description: |-
                  Description says what Tom accepts by this policy, for example that an
                  agent may read the Secrets frontend's workloads mount.
                maxLength: 1000
                minLength: 1
                type: string
              egress:
                description: Egress is the destinations it approves.
                properties:
                  cidrs:
                    description: CIDRs are address ranges.
                    items:
                      maxLength: 43
                      type: string
                      x-kubernetes-validations:
                      - message: must be a CIDR such as 192.168.40.21/32
                        rule: isCIDR(self)
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: set
                  endpoints:
                    description: Endpoints are in-cluster pods by namespace and labels.
                    items:
                      description: |-
                        EgressEndpoint is in-cluster pods: every pod of a namespace, or the ones with
                        these labels.
                      properties:
                        matchLabels:
                          additionalProperties:
                            description: |-
                              LabelValue is a label value: at most 63 letters, digits, '-', '_' and '.',
                              starting and ending with a letter or digit, or empty.
                            maxLength: 63
                            pattern: ^([A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?)?$
                            type: string
                          description: |-
                            MatchLabels narrows the pods; empty means every pod in the namespace. The
                            keys are plain pod labels: a Cilium or Kubernetes meta label such as
                            io.kubernetes.pod.namespace or k8s:io.cilium.k8s.policy.serviceaccount
                            would let the selector leave Namespace, so those are refused.
                          maxProperties: 8
                          type: object
                          x-kubernetes-validations:
                          - message: matchLabels keys are plain label keys, such as
                              app.kubernetes.io/name
                            rule: self.all(k, k.size() <= 253 && k.matches('^([a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?$'))
                          - message: 'matchLabels may not use the io.kubernetes.,
                              io.cilium. or k8s.io/ meta labels: the endpoint stays
                              in its namespace'
                            rule: self.all(k, !k.startsWith('io.kubernetes.') && !k.startsWith('io.cilium.')
                              && !k.startsWith('k8s.io/'))
                        namespace:
                          description: Namespace is the pods' namespace.
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                          x-kubernetes-validations:
                          - message: no grant reaches the dev-env namespaces (DESIGN-001
                              6.12)
                            rule: '!(self in [''dev-env-system'', ''dev-agents'',
                              ''dev-tools''])'
                      required:
                      - namespace
                      type: object
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: atomic
                  fqdns:
                    description: FQDNs are DNS names, each exact or with one leading
                      "*.".
                    items:
                      maxLength: 253
                      pattern: ^(\*\.)?([a-z0-9]([-a-z0-9]*[a-z0-9])?\.)+[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                      x-kubernetes-validations:
                      - message: 'in-cluster and .local names are not reached by name:
                          use endpoints, or cidrs for a LAN host'
                        rule: '!self.endsWith(''.local'')'
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: set
                  ports:
                    description: Ports are the ports it approves.
                    items:
                      description: GrantPort is one port.
                      properties:
                        port:
                          description: Port is the destination port.
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                        protocol:
                          default: TCP
                          description: Protocol is TCP or UDP.
                          enum:
                          - TCP
                          - UDP
                          type: string
                      required:
                      - port
                      type: object
                    maxItems: 16
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: atomic
                required:
                - ports
                type: object
                x-kubernetes-validations:
                - message: 'name at least one destination: fqdns, cidrs or endpoints'
                  rule: '(has(self.fqdns) ? size(self.fqdns) : 0) + (has(self.cidrs)
                    ? size(self.cidrs) : 0) + (has(self.endpoints) ? size(self.endpoints)
                    : 0) > 0'
              kube:
                description: Kube is the roles and namespaces it approves.
                properties:
                  namespaces:
                    description: |-
                      Namespaces are named one by one: no wildcard, no pattern (DESIGN-001
                      6.12).
                    items:
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                      x-kubernetes-validations:
                      - message: no grant reaches the dev-env namespaces (DESIGN-001
                          6.12)
                        rule: '!(self in [''dev-env-system'', ''dev-agents'', ''dev-tools''])'
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: set
                  roles:
                    description: |-
                      Roles are catalog roles. No policy approves dev-env-grant-breakglass or
                      dev-env-grant-secrets-read.
                    items:
                      enum:
                      - dev-env-grant-workloads
                      - dev-env-grant-storage
                      - dev-env-grant-secrets-read
                      - dev-env-grant-nodes
                      - dev-env-grant-breakglass
                      type: string
                      x-kubernetes-validations:
                      - message: 'no policy approves dev-env-grant-breakglass or dev-env-grant-secrets-read:
                          Tom approves each one on the page'
                        rule: self != 'dev-env-grant-breakglass' && self != 'dev-env-grant-secrets-read'
                    maxItems: 4
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                required:
                - roles
                type: object
                x-kubernetes-validations:
                - message: name the namespaces, one by one, for a namespaced role
                  rule: self.roles.all(r, r == 'dev-env-grant-nodes') || (has(self.namespaces)
                    && size(self.namespaces) > 0)
              maxTTL:
                description: MaxTTL is the longest TTL it approves. A longer request
                  goes to Tom.
                type: string
              profiles:
                description: |-
                  Profiles are the requester profiles it matches. Profile ops never matches
                  (D-18: every grant an ops session asks for goes to Tom).
                items:
                  maxLength: 63
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                  type: string
                  x-kubernetes-validations:
                  - message: no policy matches profile ops (D-18)
                    rule: self != 'ops'
                maxItems: 8
                type: array
                x-kubernetes-list-type: set
              repos:
                description: Repos are the requester repos it matches.
                items:
                  maxLength: 100
                  pattern: ^[A-Za-z0-9_.-]+$
                  type: string
                maxItems: 32
                type: array
                x-kubernetes-list-type: set
              type:
                description: Type is the grant type it approves.
                enum:
                - kube
                - egress
                - credential
                - breakglass
                type: string
            required:
            - description
            - maxTTL
            - type
            type: object
            x-kubernetes-validations:
            - message: 'no policy can approve break-glass: Tom approves every one
                on the page (D-27)'
              rule: self.type != 'breakglass'
            - message: kube is set for type kube, and only there
              rule: (self.type == 'kube') == has(self.kube)
            - message: egress is set for type egress, and only there
              rule: (self.type == 'egress') == has(self.egress)
            - message: credential is set for type credential, and only there
              rule: (self.type == 'credential') == has(self.credential)
            - message: 'name the requesters: profiles, repos or both'
              rule: '(has(self.profiles) ? size(self.profiles) : 0) + (has(self.repos)
                ? size(self.repos) : 0) > 0'
            - message: maxTTL runs from 10m to 8h
              rule: duration(self.maxTTL) >= duration('10m') && duration(self.maxTTL)
                <= duration('8h')
            - message: a credential grant lasts at most 4h
              rule: self.type != 'credential' || duration(self.maxTTL) <= duration('4h')
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'metadata.name is a DNS label of at most 63 characters: a grant
            records it as policy/<name>'
          rule: self.metadata.name.size() <= 63 && self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    served: true
    storage: true
    subresources: {}
