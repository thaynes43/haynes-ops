---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: agentsessions.dev-env.haynesops.com
spec:
  group: dev-env.haynesops.com
  names:
    kind: AgentSession
    listKind: AgentSessionList
    plural: agentsessions
    singular: agentsession
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.repo
      name: Repo
      type: string
    - jsonPath: .spec.agent
      name: Agent
      type: string
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.taskResult.state
      name: Task
      type: string
    - jsonPath: .status.nodeName
      name: Node
      type: string
    - jsonPath: .spec.model
      name: Model
      priority: 1
      type: string
    - jsonPath: .spec.lane
      name: Lane
      priority: 1
      type: string
    - jsonPath: .status.outcome.state
      name: Outcome
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentSession is one agent session: its pod, its volume and its lifecycle. The
          name is also the pod name, the hostname and the Remote Control name, so it is a
          DNS label of at most 63 characters.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentSessionSpec is what the caller asked for. The operator's /v1 API writes
              it; agents never write AgentSession objects themselves (DESIGN-001 6.11). The
              operator never writes spec either: what it resolves (the default profile and
              tools, the timers per mode) it reads from the templates or records in status.
            properties:
              agent:
                description: Agent is the agent CLI to run.
                enum:
                - claude
                - codex
                - opencode
                type: string
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              base:
                default: origin/main
                description: |-
                  Base is the ref the session's worktree branches from. It cannot start
                  with '-', so git never reads it as an option.
                maxLength: 255
                minLength: 1
                pattern: ^[^-\s]\S*$
                type: string
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              caller:
                description: |-
                  Caller is the CallerPolicy of a summoned session, for example
                  alert-responder (DESIGN-001 3.7). Empty for Tom's own sessions. A
                  summoned session sets caller and lane together.
                maxLength: 253
                pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                type: string
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              commonRules:
                description: |-
                  CommonRules is authored only by the enabled managed common-input route.
                  Absence is legacy Unknown provenance, never an inferred current snapshot.
                properties:
                  commonRevision:
                    maxLength: 64
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  projectDigest:
                    maxLength: 64
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  snapshot:
                    description: The entire source-authored session document has a
                      separate 192KiB cap.
                    maxLength: 499712
                    type: string
                  snapshotDigest:
                    maxLength: 64
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  version:
                    enum:
                    - 1
                    type: integer
                required:
                - commonRevision
                - projectDigest
                - snapshot
                - snapshotDigest
                - version
                type: object
                x-kubernetes-validations:
                - message: common instruction binding is immutable
                  rule: self == oldSelf
              effort:
                description: |-
                  Effort is the reasoning effort. The levels differ per model, so the API
                  checks them, not this schema.
                maxLength: 32
                pattern: ^[a-z]+$
                type: string
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              idempotencyKey:
                description: |-
                  IdempotencyKey lets a summoning caller repeat a create safely, for example
                  with an alert signature: a repeated key returns the existing session. It has
                  the form of a label value, so the API can find that session with a label
                  selector; a caller with a longer signature sends a hash of it.
                maxLength: 63
                pattern: ^[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?$
                type: string
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              lane:
                description: Lane is a summoned session's lane.
                enum:
                - remediation
                - upgrade
                - curation
                - escalation
                type: string
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              lifecycle:
                description: Lifecycle overrides the default timers of D-09.
                properties:
                  archiveAfter:
                    description: |-
                      ArchiveAfter archives a suspended session after this long, once its rescue
                      bundle is verified (D-09: 168h).
                    type: string
                    x-kubernetes-validations:
                    - message: must be a positive Go duration such as 40m or 72h
                      rule: duration(self) > duration('0s')
                  idleSuspendAfter:
                    description: |-
                      IdleSuspendAfter suspends an idle session after this long (D-09: 72h for
                      interactive and remote sessions).
                    type: string
                    x-kubernetes-validations:
                    - message: must be a positive Go duration such as 40m or 72h
                      rule: duration(self) > duration('0s')
                type: object
              limits:
                description: |-
                  Limits caps a task session; task mode only. Summoned callers get them from
                  their policy.
                properties:
                  maxTurns:
                    description: MaxTurns caps the agent's turns. 0 means no cap.
                    format: int32
                    minimum: 0
                    type: integer
                  timeout:
                    description: Timeout is the wall-clock limit, for example 3h.
                    type: string
                    x-kubernetes-validations:
                    - message: must be a positive Go duration such as 40m or 72h
                      rule: duration(self) > duration('0s')
                type: object
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              llm:
                description: LLM is the LLM pool an opencode session leases (DESIGN-001
                  8.3).
                properties:
                  pool:
                    description: Pool is the LLMPool name, for example llm-coder.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - pool
                type: object
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              mode:
                description: Mode is how the agent runs.
                enum:
                - task
                - local
                - remote
                type: string
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              model:
                description: |-
                  Model is a full model id, never an alias (for example claude-opus-5-5), so
                  a Claude model starts with claude-. For opencode it is the LLM pool's model
                  id.
                maxLength: 128
                minLength: 1
                pattern: ^\S+$
                type: string
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              operatingMode:
                default: Running
                description: OperatingMode is the desired state of the pod.
                enum:
                - Running
                - Suspended
                type: string
              parent:
                description: |-
                  Parent is the session or caller that created this one. The API sets it from
                  the caller's token, never from the request body (D-05).
                maxLength: 253
                type: string
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              privatePilot:
                description: PrivatePilot is authored only by the sealed operator
                  route, never a caller override.
                properties:
                  commonRevision:
                    maxLength: 64
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  policyDigest:
                    maxLength: 64
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  sealUID:
                    maxLength: 36
                    pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$
                    type: string
                  slot:
                    enum:
                    - 0
                    - 1
                    type: integer
                required:
                - commonRevision
                - policyDigest
                - sealUID
                - slot
                type: object
                x-kubernetes-validations:
                - message: private pilot binding is immutable
                  rule: self == oldSelf
              profile:
                description: |-
                  Profile names the Secrets, egress tier and standing grants the pod gets
                  (D-18): full, dev or ops. Profiles are template data, so the schema checks
                  the form, not the name. Empty means the templates' default; a summoned
                  session always names one.
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              projectCanary:
                description: |-
                  ProjectCanary is authored by the strict operator-owned canary route.
                  It permanently binds the original accepted source and reviewed policy.
                properties:
                  captureOutput:
                    type: boolean
                  catalogResourceVersion:
                    maxLength: 128
                    minLength: 1
                    type: string
                  catalogRevision:
                    maxLength: 64
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  catalogUID:
                    maxLength: 128
                    minLength: 1
                    type: string
                  client:
                    maxLength: 127
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?/[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  cloneOwner:
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  commonRevision:
                    maxLength: 64
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  id:
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  image:
                    maxLength: 512
                    minLength: 1
                    type: string
                  policyDigest:
                    maxLength: 64
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  rulesRevision:
                    maxLength: 64
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  snapshotDigest:
                    maxLength: 64
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  templateRevision:
                    maxLength: 63
                    minLength: 1
                    type: string
                  version:
                    enum:
                    - 1
                    type: integer
                required:
                - catalogResourceVersion
                - catalogRevision
                - catalogUID
                - client
                - cloneOwner
                - id
                - image
                - policyDigest
                - rulesRevision
                - snapshotDigest
                - templateRevision
                - version
                type: object
                x-kubernetes-validations:
                - message: project canary binding is immutable
                  rule: self == oldSelf
              prompt:
                description: Prompt is the task. Task mode only, and required there.
                maxLength: 262144
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              repo:
                description: |-
                  Repo is the repository the session works in, for example haynes-ops: a
                  name, not a path (it becomes a directory in the pod).
                maxLength: 100
                minLength: 1
                pattern: ^[A-Za-z0-9_.-]+$
                type: string
                x-kubernetes-validations:
                - message: repo is a repository name, not a path
                  rule: self != '.' && self != '..'
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              restore:
                description: |-
                  Restore is a rescue on the shared volume, <session>/<stamp> (D-67). On
                  the session's first boot agentd fetches that rescue's bundle for Repo
                  into refs/rescued/*, after checking it against the rescue's manifest.
                maxLength: 80
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?/[0-9]{8}-[0-9]{4}(-[0-9]+)?$
                type: string
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              sessionDirectory:
                description: SessionDirectory is selected only by the prospective
                  operator canary route.
                properties:
                  project:
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                    type: string
                  version:
                    enum:
                    - 1
                    type: integer
                required:
                - project
                - version
                type: object
                x-kubernetes-validations:
                - message: directory enrollment is immutable
                  rule: self == oldSelf
              size:
                default: M
                description: Size picks the requests and limits preset.
                enum:
                - S
                - M
                - L
                type: string
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              tools:
                description: |-
                  Tools are the tool pools registered at boot (DESIGN-001 8.1), by ToolPool
                  name. Empty means the profile's default.
                items:
                  maxLength: 63
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                  type: string
                maxItems: 32
                type: array
                x-kubernetes-list-type: set
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              usageCaptureParentUID:
                description: |-
                  UsageCaptureParentUID is the authenticated parent Session UID when child
                  usage capture is enabled. The API sets it from that parent object. It is
                  not a permission and it is not taken from the request body.
                maxLength: 128
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: usage capture parent UID is immutable
                  rule: self == oldSelf
              workspace:
                description: |-
                  Workspace explicitly opts this session into a pre-provisioned workspace.
                  Omission retains private repositories, even when later templates enable one.
                properties:
                  id:
                    description: ID must match the enabled template and the mounted
                      workspace marker.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - id
                type: object
                x-kubernetes-validations:
                - message: immutable after create
                  rule: self == oldSelf
            required:
            - agent
            - mode
            - model
            - repo
            type: object
            x-kubernetes-validations:
            - message: prompt is required in task mode and not allowed in local or
                remote mode
              rule: 'self.mode == ''task'' ? has(self.prompt) : !has(self.prompt)'
            - message: limits apply to task mode only
              rule: '!has(self.limits) || self.mode == ''task'''
            - message: llm is required for agent opencode and not allowed for claude
                or codex
              rule: 'self.agent == ''opencode'' ? has(self.llm) : !has(self.llm)'
            - message: a Claude model is a full id such as claude-opus-5-5, never
                an alias
              rule: self.agent != 'claude' || self.model.startsWith('claude-')
            - message: 'caller and lane go together: a summoned session sets both,
                Tom''s own sessions neither'
              rule: has(self.caller) == has(self.lane)
            - message: 'idempotencyKey is for summoned sessions only: set caller and
                lane'
              rule: '!has(self.idempotencyKey) || has(self.caller)'
            - message: a summoned session runs in task or remote mode, never local
              rule: '!has(self.caller) || self.mode != ''local'''
            - message: a summoned session names its profile, and it is never full
                (D-36)
              rule: '!has(self.caller) || (has(self.profile) && self.profile != ''full'')'
            - message: 'immutable after create: no spec field may be added or removed,
                except operatingMode and lifecycle'
              rule: has(self.base) == has(oldSelf.base) && has(self.effort) == has(oldSelf.effort)
                && has(self.prompt) == has(oldSelf.prompt) && has(self.size) == has(oldSelf.size)
                && has(self.profile) == has(oldSelf.profile) && has(self.tools) ==
                has(oldSelf.tools) && has(self.llm) == has(oldSelf.llm) && has(self.parent)
                == has(oldSelf.parent) && has(self.caller) == has(oldSelf.caller)
                && has(self.lane) == has(oldSelf.lane) && has(self.idempotencyKey)
                == has(oldSelf.idempotencyKey) && has(self.limits) == has(oldSelf.limits)
                && has(self.restore) == has(oldSelf.restore) && has(self.workspace)
                == has(oldSelf.workspace) && has(self.projectCanary) == has(oldSelf.projectCanary)
                && has(self.commonRules) == has(oldSelf.commonRules) && has(self.sessionDirectory)
                == has(oldSelf.sessionDirectory) && has(self.privatePilot) == has(oldSelf.privatePilot)
                && has(self.usageCaptureParentUID) == has(oldSelf.usageCaptureParentUID)
            - message: project canaries require their fixed private bounded subscription
                task contract
              rule: '!has(self.projectCanary) || (self.mode == ''task'' && self.agent
                in [''claude'', ''codex''] && self.size == ''S'' && has(self.parent)
                && self.parent == self.projectCanary.client && !has(self.workspace)
                && !has(self.restore) && !has(self.tools) && !has(self.llm) && !has(self.caller)
                && !has(self.lane) && !has(self.lifecycle) && has(self.limits) &&
                has(self.limits.timeout) && duration(self.limits.timeout) <= duration(''180s'')
                && (self.agent == ''codex'' ? (!has(self.limits.maxTurns) || self.limits.maxTurns
                == 0) : (has(self.limits.maxTurns) && self.limits.maxTurns > 0 &&
                self.limits.maxTurns <= 3)))'
            - message: common rules require a matching managed canary or finite private
                task binding
              rule: '!has(self.commonRules) || (has(self.projectCanary) && has(self.projectCanary.commonRevision)
                && self.projectCanary.commonRevision == self.commonRules.commonRevision)
                || (has(self.privatePilot) && self.privatePilot.commonRevision ==
                self.commonRules.commonRevision) || (!has(self.projectCanary) && !has(self.privatePilot)
                && !has(self.workspace) && self.mode == ''task'' && self.agent in
                [''claude'', ''codex''] && has(self.profile) && self.profile == ''dev''
                && has(self.parent) && has(self.limits) && has(self.limits.timeout)
                && duration(self.limits.timeout) > duration(''0s'') && duration(self.limits.timeout)
                <= duration(''45m''))'
            - message: directory enrollment requires a managed canary
              rule: '!has(self.sessionDirectory) || has(self.projectCanary) || has(self.privatePilot)'
            - message: sealed pilots require the fixed private bounded Codex contract
                and matching retained inputs
              rule: '!has(self.privatePilot) || (!has(self.projectCanary) && self.repo
                == ''dev-env'' && self.base == ''main'' && self.mode == ''task'' &&
                self.agent == ''codex'' && self.model == ''gpt-6-luna'' && self.effort
                == ''high'' && self.size == ''S'' && self.profile == ''rule-canary-codex''
                && self.parent == ''dev/dev-env'' && !has(self.workspace) && !has(self.restore)
                && !has(self.tools) && !has(self.llm) && !has(self.caller) && !has(self.lane)
                && !has(self.lifecycle) && !has(self.idempotencyKey) && has(self.limits)
                && has(self.limits.timeout) && duration(self.limits.timeout) == duration(''15m'')
                && (!has(self.limits.maxTurns) || self.limits.maxTurns == 0) && has(self.commonRules)
                && self.commonRules.commonRevision == self.privatePilot.commonRevision
                && has(self.sessionDirectory) && self.sessionDirectory.version ==
                1 && self.sessionDirectory.project == ''dev-env'')'
          status:
            description: |-
              AgentSessionStatus is what the operator and agentd observed. Reconcile is
              level-based (DESIGN-001 5.1): everything a fresh operator needs is here, not
              in its memory.
            properties:
              agent:
                description: Agent is the agent's own state, from agentd's heartbeat.
                properties:
                  agentd:
                    description: Agentd is agentd's version line.
                    type: string
                  attached:
                    description: |-
                      Attached is how many clients are attached to the agent's tmux session
                      (DESIGN-001 4.2, D-59). Drain treats any attached client as not idle.
                    minimum: 0
                    type: integer
                  boot:
                    description: 'Boot is agentd''s boot phase: booting, ready or
                      failed.'
                    type: string
                  branch:
                    description: Branch is the worktree's branch, for example agent/haynes-ops-1005-202504.
                    type: string
                  conversationId:
                    description: |-
                      ConversationID is the agent's own session id (claude --session-id), the
                      handle a resume uses.
                    type: string
                  head:
                    description: Head is the worktree's commit.
                    type: string
                  lastActivity:
                    description: LastActivity is the last time agentd saw the agent
                      or its worktree change.
                    format: date-time
                    type: string
                  lastHeartbeat:
                    description: |-
                      LastHeartbeat is when the operator last accepted a heartbeat from the
                      session's pod, by the operator's clock.
                    format: date-time
                    type: string
                  message:
                    description: Message is why agentd could not start the agent,
                      when it could not.
                    type: string
                  problems:
                    description: |-
                      Problems are the boot steps that warned or failed, each as
                      "<step>: <state>", with its first note when it has one.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  projectBootstrap:
                    description: |-
                      ProjectBootstrap is the boot's private catalog bootstrap, when it ran
                      (DESIGN-006, reason codes): catalog names, states, steps and closed-set
                      reason codes, never a path, an object id or detail text.
                    properties:
                      catalogRevision:
                        description: CatalogRevision is the accepted catalog's content
                          digest.
                        maxLength: 64
                        pattern: ^[a-f0-9]{64}$
                        type: string
                      projects:
                        description: Projects are the project roots' refreshes (DESIGN-007).
                        items:
                          description: ProjectBootstrapProjectStatus is one project
                            root's refresh.
                          properties:
                            cause:
                              description: |-
                                Cause is that repository's reason, when its clean-checkout or reference
                                proof refused.
                              enum:
                              - CloneFailed
                              - StagingPreserved
                              - ReferenceUncertain
                              - IdentityMismatch
                              - GitOperationPresent
                              - CatalogUnconfirmed
                              - FetchFailed
                              - UntrackedFiles
                              - UnsupportedTrackedEntry
                              - IndexBoundExceeded
                              - WorkingTreeDiffers
                              - StagedChanges
                              - NonDefaultBranch
                              - BranchInOtherWorktree
                              - LocalOnlyCommits
                              - ChangedDuringProof
                              - AdvanceFailed
                              - TimedOut
                              - Stopped
                              - Uncertain
                              type: string
                            name:
                              description: Name is the project's catalog name.
                              maxLength: 63
                              minLength: 1
                              pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
                              type: string
                            reason:
                              description: Reason is why a Failed refresh stopped.
                              enum:
                              - StateUncertain
                              - ReceiptUnconfirmed
                              - CatalogUnconfirmed
                              - RootUnproven
                              - AnchorRemoved
                              - RepositoryNotReady
                              - FetchFailed
                              - AnchorNotFastForward
                              - RootPrepareFailed
                              - AnchorAddFailed
                              - AnchorUnproven
                              - AnchorAdvanceFailed
                              - RootAdvanceFailed
                              - BudgetReserve
                              - TimedOut
                              - Stopped
                              type: string
                            repository:
                              description: Repository is the member repository that
                                caused it, when one did.
                              maxLength: 63
                              pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
                              type: string
                            state:
                              description: State is Ready or Failed.
