# The AgentSession CRD, generated by controller-gen v0.22.0 in thaynes43/dev-env
# (config/crd/dev-env.haynesops.com_agentsessions.yaml, last changed by dev-env
# 2149163, PR #36; copied verbatim below from dev-env v2.0.0, faeaf60). Never edit it
# here: change api/v1alpha1 in dev-env, run `make generate`, and copy the result.
# The prune-disabled annotation is added by kustomization.yaml, so this file stays
# byte-identical to the generated one.
#
# Keep it in step with the operator. When a dev-env PR changes config/crd/, copy the
# new file here before (or with) the operator pin that needs it
# (../../operator/app/helmrelease.yaml). A stale CRD fails silently: the API server
# prunes the status fields it does not know. On 2026-10-07 the CRD here was still
# #24's, so status.agent kept only state and lastActivity, and status.rescue lost the
# verdict the operator's archive waits for (#31 and #36 had added them).
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: agentsessions.dev-env.haynesops.com
spec:
  group: dev-env.haynesops.com
  names:
    kind: AgentSession
    listKind: AgentSessionList
    plural: agentsessions
    singular: agentsession
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.repo
      name: Repo
      type: string
    - jsonPath: .spec.agent
      name: Agent
      type: string
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.nodeName
      name: Node
      type: string
    - jsonPath: .spec.model
      name: Model
      priority: 1
      type: string
    - jsonPath: .spec.lane
      name: Lane
      priority: 1
      type: string
    - jsonPath: .status.outcome.state
      name: Outcome
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentSession is one agent session: its pod, its volume and its lifecycle. The
          name is also the pod name, the hostname and the Remote Control name, so it is a
          DNS label of at most 63 characters.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentSessionSpec is what the caller asked for. The operator's /v1 API writes
              it; agents never write AgentSession objects themselves (DESIGN-001 6.11). The
              operator never writes spec either: what it resolves (the default profile and
              tools, the timers per mode) it reads from the templates or records in status.
            properties:
              agent:
                description: Agent is the agent CLI to run.
                enum:
                - claude
                - codex
                - opencode
                type: string
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              base:
                default: origin/main
                description: |-
                  Base is the ref the session's worktree branches from. It cannot start
                  with '-', so git never reads it as an option.
                maxLength: 255
                minLength: 1
                pattern: ^[^-\s]\S*$
                type: string
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              caller:
                description: |-
                  Caller is the CallerPolicy of a summoned session, for example
                  alert-responder (DESIGN-001 3.7). Empty for Tom's own sessions. A
                  summoned session sets caller and lane together.
                maxLength: 253
                pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                type: string
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              effort:
                description: |-
                  Effort is the reasoning effort. The levels differ per model, so the API
                  checks them, not this schema.
                maxLength: 32
                pattern: ^[a-z]+$
                type: string
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              idempotencyKey:
                description: |-
                  IdempotencyKey lets a summoning caller repeat a create safely, for example
                  with an alert signature: a repeated key returns the existing session. It has
                  the form of a label value, so the API can find that session with a label
                  selector; a caller with a longer signature sends a hash of it.
                maxLength: 63
                pattern: ^[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?$
                type: string
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              lane:
                description: Lane is a summoned session's lane.
                enum:
                - remediation
                - upgrade
                - curation
                - escalation
                type: string
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              lifecycle:
                description: Lifecycle overrides the default timers of D-09.
                properties:
                  archiveAfter:
                    description: |-
                      ArchiveAfter archives a suspended session after this long, once its rescue
                      bundle is verified (D-09: 168h).
                    type: string
                    x-kubernetes-validations:
                    - message: must be a positive Go duration such as 40m or 72h
                      rule: duration(self) > duration('0s')
                  idleSuspendAfter:
                    description: |-
                      IdleSuspendAfter suspends an idle session after this long (D-09: 72h for
                      interactive and remote sessions).
                    type: string
                    x-kubernetes-validations:
                    - message: must be a positive Go duration such as 40m or 72h
                      rule: duration(self) > duration('0s')
                type: object
              limits:
                description: |-
                  Limits caps a task session; task mode only. Summoned callers get them from
                  their policy.
                properties:
                  maxTurns:
                    description: MaxTurns caps the agent's turns. 0 means no cap.
                    format: int32
                    minimum: 0
                    type: integer
                  timeout:
                    description: Timeout is the wall-clock limit, for example 3h.
                    type: string
                    x-kubernetes-validations:
                    - message: must be a positive Go duration such as 40m or 72h
                      rule: duration(self) > duration('0s')
                type: object
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              llm:
                description: LLM is the LLM pool an opencode session leases (DESIGN-001
                  8.3).
                properties:
                  pool:
                    description: Pool is the LLMPool name, for example llm-coder.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - pool
                type: object
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              mode:
                description: Mode is how the agent runs.
                enum:
                - task
                - local
                - remote
                type: string
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              model:
                description: |-
                  Model is a full model id, never an alias (for example claude-opus-5-5), so
                  a Claude model starts with claude-. For opencode it is the LLM pool's model
                  id.
                maxLength: 128
                minLength: 1
                pattern: ^\S+$
                type: string
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              operatingMode:
                default: Running
                description: OperatingMode is the desired state of the pod.
                enum:
                - Running
                - Suspended
                type: string
              parent:
                description: |-
                  Parent is the session or caller that created this one. The API sets it from
                  the caller's token, never from the request body (D-05).
                maxLength: 253
                type: string
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              profile:
                description: |-
                  Profile names the Secrets, egress tier and standing grants the pod gets
                  (D-18): full, dev or ops. Profiles are template data, so the schema checks
                  the form, not the name. Empty means the templates' default; a summoned
                  session always names one.
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              prompt:
                description: Prompt is the task. Task mode only, and required there.
                maxLength: 262144
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              repo:
                description: |-
                  Repo is the repository the session works in, for example haynes-ops: a
                  name, not a path (it becomes a directory in the pod).
                maxLength: 100
                minLength: 1
                pattern: ^[A-Za-z0-9_.-]+$
                type: string
                x-kubernetes-validations:
                - message: repo is a repository name, not a path
                  rule: self != '.' && self != '..'
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              size:
                default: M
                description: Size picks the requests and limits preset.
                enum:
                - S
                - M
                - L
                type: string
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
              tools:
                description: |-
                  Tools are the tool pools registered at boot (DESIGN-001 8.1), by ToolPool
                  name. Empty means the profile's default.
                items:
                  maxLength: 63
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                  type: string
                maxItems: 32
                type: array
                x-kubernetes-list-type: set
                x-kubernetes-validations:
                - message: immutable after create; only operatingMode and lifecycle
                    may change
                  rule: self == oldSelf
            required:
            - agent
            - mode
            - model
            - repo
            type: object
            x-kubernetes-validations:
            - message: prompt is required in task mode and not allowed in local or
                remote mode
              rule: 'self.mode == ''task'' ? has(self.prompt) : !has(self.prompt)'
            - message: limits apply to task mode only
              rule: '!has(self.limits) || self.mode == ''task'''
            - message: llm is required for agent opencode and not allowed for claude
                or codex
              rule: 'self.agent == ''opencode'' ? has(self.llm) : !has(self.llm)'
            - message: a Claude model is a full id such as claude-opus-5-5, never
                an alias
              rule: self.agent != 'claude' || self.model.startsWith('claude-')
            - message: 'caller and lane go together: a summoned session sets both,
                Tom''s own sessions neither'
              rule: has(self.caller) == has(self.lane)
            - message: 'idempotencyKey is for summoned sessions only: set caller and
                lane'
              rule: '!has(self.idempotencyKey) || has(self.caller)'
            - message: a summoned session runs in task or remote mode, never local
              rule: '!has(self.caller) || self.mode != ''local'''
            - message: a summoned session names its profile, and it is never full
                (D-36)
              rule: '!has(self.caller) || (has(self.profile) && self.profile != ''full'')'
            - message: 'immutable after create: no spec field may be added or removed,
                except operatingMode and lifecycle'
              rule: has(self.base) == has(oldSelf.base) && has(self.effort) == has(oldSelf.effort)
                && has(self.prompt) == has(oldSelf.prompt) && has(self.size) == has(oldSelf.size)
                && has(self.profile) == has(oldSelf.profile) && has(self.tools) ==
                has(oldSelf.tools) && has(self.llm) == has(oldSelf.llm) && has(self.parent)
                == has(oldSelf.parent) && has(self.caller) == has(oldSelf.caller)
                && has(self.lane) == has(oldSelf.lane) && has(self.idempotencyKey)
                == has(oldSelf.idempotencyKey) && has(self.limits) == has(oldSelf.limits)
          status:
            description: |-
              AgentSessionStatus is what the operator and agentd observed. Reconcile is
              level-based (DESIGN-001 5.1): everything a fresh operator needs is here, not
              in its memory.
            properties:
              agent:
                description: Agent is the agent's own state, from agentd's heartbeat.
                properties:
                  agentd:
                    description: Agentd is agentd's version line.
                    type: string
                  boot:
                    description: 'Boot is agentd''s boot phase: booting, ready or
                      failed.'
                    type: string
                  branch:
                    description: Branch is the worktree's branch, for example agent/haynes-ops-1005-202504.
                    type: string
                  conversationId:
                    description: |-
                      ConversationID is the agent's own session id (claude --session-id), the
                      handle a resume uses.
                    type: string
                  head:
                    description: Head is the worktree's commit.
                    type: string
                  lastActivity:
                    description: LastActivity is the last time agentd saw the agent
                      or its worktree change.
                    format: date-time
                    type: string
                  lastHeartbeat:
                    description: |-
                      LastHeartbeat is when the operator last accepted a heartbeat from the
                      session's pod, by the operator's clock.
                    format: date-time
                    type: string
                  message:
                    description: Message is why agentd could not start the agent,
                      when it could not.
                    type: string
                  problems:
                    description: |-
                      Problems are the boot steps that warned or failed, each as
                      "<step>: <state>", with its first note when it has one.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  status:
                    description: |-
                      Status is the agent's state. In plan 01 it is agentd's agent state:
                      pending, busy, exited, failed or interrupted. Plan 02 adds Claude's own
                      busy, idle and waiting; agentd derives them for Codex and opencode.
                    type: string
                  task:
                    description: Task is how a task ended, once it has.
                    properties:
                      exitCode:
                        description: ExitCode is the CLI's exit code.
                        format: int32
                        type: integer
                      finishedAt:
                        description: FinishedAt is when the CLI exited.
                        format: date-time
                        type: string
                      isError:
                        description: IsError is the result event's is_error.
                        type: boolean
                      numTurns:
                        description: NumTurns is the number of turns the task took.
                        format: int32
                        type: integer
                      subtype:
                        description: |-
                          Subtype is the result event's subtype: success, error_max_turns or
                          error_during_execution.
                        type: string
                      timedOut:
                        description: TimedOut is set when agentd stopped the task
                          at limits.timeout.
                        type: boolean
                    required:
                    - exitCode
                    - finishedAt
                    type: object
                type: object
              conditions:
                description: Conditions are the standard conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              nodeName:
                description: NodeName is the node the pod runs on.
                type: string
              outcome:
                description: Outcome is what a summoned session reported about its
                  work.
                properties:
                  at:
                    description: At is when the outcome was reported.
                    format: date-time
                    type: string
                  note:
                    description: Note is the session's one-line note with its report.
                    type: string
                  state:
                    description: State is the reported outcome.
                    enum:
                    - pending
                    - running
                    - done
                    - failed
                    - escalated
                    type: string
                type: object
              pending:
                description: |-
                  PendingReason is the scheduler's reason while the session is Pending
                  (DESIGN-001 7.3).
                type: string
              phase:
                description: Phase is the lifecycle state.
                enum:
                - Pending
                - Running
                - Idle
                - Draining
                - Suspended
                - Archived
                - Failed
                type: string
              podName:
                description: PodName is the session's pod. It equals the session's
                  name.
                type: string
              remoteControl:
                description: |-
                  RemoteControl is the session's Remote Control entry, for remote mode
                  (DESIGN-001 6.7).
                properties:
                  name:
                    description: Name is the entry's name, which equals the session's
                      name.
                    type: string
                  sessionId:
                    description: SessionID is the Remote Control session id.
                    type: string
                  state:
                    description: State is the entry's registration state, for example
                      registered.
                    type: string
                  url:
                    description: URL is the session's claude.ai link.
                    type: string
                type: object
              rescue:
                description: Rescue records the session's newest rescue (D-10, D-51).
                properties:
                  at:
                    format: date-time
                    type: string
                  generation:
                    description: |-
                      Generation is the session's metadata.generation when the rescue ran. A
                      spec change since then (a resume, say) means the pod may have done more
                      work, and its next removal needs a new rescue.
                    format: int64
                    type: integer
                  lastBundle:
                    description: |-
                      LastBundle is the newest rescue's manifest on the shared volume, for
                      example rescue/haynes-ops-1005-202504/20261006-0130/manifest.json (D-48).
                      It stays when a later rescue needed no bundle, or a new pod superseded
                      it, because a restore starts from it.
                    type: string
                  message:
                    description: Message says what the rescue saved, or why it failed.
                    type: string
                  omittedRefs:
                    description: OmittedRefs is how many refs did not fit in UnpushedRefs.
                    format: int32
                    minimum: 0
                    type: integer
                  podUID:
                    description: |-
                      PodUID is the pod the rescue ran in. A suspend deletes that pod, and no
                      other, on this record.
                    type: string
                  result:
                    description: Result is the newest rescue's verdict.
                    enum:
                    - Verified
                    - CleanAndPushed
                    - Failed
                    type: string
                  stamp:
                    description: |-
                      Stamp is the rescue's stamp (UTC YYYYMMDD-HHMM); At is when the operator
                      recorded it.
                    type: string
                  superseded:
                    description: |-
                      Superseded is set as soon as the session asks for its pod again (a
                      resume), before the operator starts a new pod on the volume: from then
                      on the rescue does not cover what the volume holds, and a pod delete or
                      an archive needs a new one (D-10: an old bundle never counts).
                    type: boolean
                  unpushedRefs:
                    description: |-
                      UnpushedRefs is D-10 step 4's list: the local refs origin lacked at the
                      rescue, each with its clone and the bundle that holds it. At most 256 are
                      kept; OmittedRefs counts the rest. The verdict covers all of them.
                    items:
                      description: RescuedRef is one local ref origin lacked at a
                        rescue.
                      properties:
                        bundle:
                          description: Bundle is the bundle file on the shared volume
                            that holds it.
                          type: string
                        commit:
                          description: Commit is the commit it named.
                          type: string
                        name:
                          description: |-
                            Name is the ref, for example refs/heads/rescue/haynes-ops-1005-202504-20261006-0130,
                            or stash@{n} for a stash entry.
                          type: string
                        repo:
                          description: Repo is the clone, for example /home/dev/repos/haynes-ops.
                          type: string
                      required:
                      - commit
                      - name
                      - repo
                      type: object
                    maxItems: 256
                    type: array
                type: object
              revision:
                description: Revision is the template revision the pod runs (DESIGN-001
                  5.2).
                type: string
              usage:
                description: Usage is the session's cost record (DESIGN-001 3.7, V-16).
                properties:
                  costUSD:
                    description: |-
                      CostUSD is the CLI's total_cost_usd as a decimal string, because CRDs
                      avoid floating-point fields.
                    pattern: ^[0-9]+(\.[0-9]+)?$
                    type: string
                  inputTokens:
                    description: InputTokens is the number of input tokens.
                    format: int64
                    minimum: 0
                    type: integer
                  outputTokens:
                    description: OutputTokens is the number of output tokens.
                    format: int64
                    minimum: 0
                    type: integer
                type: object
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'metadata.name must be at most 63 characters: it is the pod''s
            hostname'
          rule: self.metadata.name.size() <= 63
        - message: 'metadata.name must be a DNS label (lowercase letters, digits and
            ''-'', no dots): it is the pod''s hostname'
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    served: true
    storage: true
    subresources:
      status: {}
