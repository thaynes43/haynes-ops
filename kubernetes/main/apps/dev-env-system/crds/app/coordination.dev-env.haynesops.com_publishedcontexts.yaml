---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: publishedcontexts.coordination.dev-env.haynesops.com
spec:
  group: coordination.dev-env.haynesops.com
  names:
    kind: PublishedContext
    listKind: PublishedContextList
    plural: publishedcontexts
    singular: publishedcontext
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PublishedContext is deliberately published text, not a native history backup.
          It has no Session owner reference, lifecycle controller or expiry.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: 'The API and store enforce UTF-8 byte bounds too: CRD MaxLength
              counts characters.'
            properties:
              actor:
                properties:
                  kind:
                    enum:
                    - session
                    - coordinator
                    type: string
                  podName:
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$
                    type: string
                  podUID:
                    maxLength: 128
                    minLength: 1
                    pattern: ^[A-Za-z0-9-]+$
                    type: string
                  serviceAccount:
                    maxLength: 317
                    minLength: 3
                    pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?/[a-z0-9]([a-z0-9.-]*[a-z0-9])?$
                    type: string
                required:
                - kind
                - podName
                - podUID
                - serviceAccount
                type: object
              attribution:
                description: |-
                  Provider-neutral attribution records the requested model only. This unit
                  neither observes inference nor verifies provider output, usage or cost.
                properties:
                  costState:
                    enum:
                    - Unknown
                    type: string
                  observedModelState:
                    enum:
                    - Unknown
                    type: string
                  provider:
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                    type: string
                  requestedModel:
                    maxLength: 256
                    minLength: 1
                    type: string
                  usageState:
                    enum:
                    - Unknown
                    type: string
                required:
                - costState
                - observedModelState
                - provider
                - requestedModel
                - usageState
                type: object
              byteCount:
                format: int32
                maximum: 65536
                minimum: 1
                type: integer
              completeness:
                enum:
                - ExplicitExcerpt
                type: string
              contentSHA256:
                maxLength: 64
                pattern: ^[a-f0-9]{64}$
                type: string
              identity:
                properties:
                  key:
                    maxLength: 128
                    minLength: 1
                    pattern: ^[a-z0-9]([a-z0-9._-]{0,126}[a-z0-9])?$
                    type: string
                  kind:
                    enum:
                    - transcript-excerpt
                    - result
                    - memory
                    - handoff
                    type: string
                  sessionUID:
                    maxLength: 128
                    minLength: 1
                    pattern: ^[A-Za-z0-9-]+$
                    type: string
                required:
                - key
                - kind
                - sessionUID
                type: object
              origin:
                enum:
                - ExplicitPublished
                type: string
              project:
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                type: string
              provenance:
                properties:
                  catalogRevision:
                    maxLength: 64
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  defaultBranch:
                    maxLength: 255
                    minLength: 1
                    type: string
                  github:
                    maxLength: 140
                    pattern: ^[a-z0-9]([a-z0-9-]{0,37}[a-z0-9])?/[a-z0-9_.-]{1,100}$
                    type: string
                  initialPinState:
                    description: This first unit has no bound startup pin receipt.
                      A heartbeat cannot prove it.
                    enum:
                    - Unknown
                    type: string
                  reportedAt:
                    format: date-time
                    type: string
                  reportedHead:
                    maxLength: 64
                    pattern: ^[a-f0-9]{40}([a-f0-9]{24})?$
                    type: string
                  rulesRevision:
                    maxLength: 64
                    pattern: ^[a-f0-9]{64}$
                    type: string
                required:
                - catalogRevision
                - defaultBranch
                - github
                - initialPinState
                - rulesRevision
                type: object
                x-kubernetes-validations:
                - message: reported HEAD requires its observation timestamp
                  rule: has(self.reportedHead) == has(self.reportedAt)
                - message: GitHub repository is not a path
                  rule: '!self.github.endsWith(''/.'') && !self.github.endsWith(''/..'')'
                - message: GitHub identity omits the transport suffix
                  rule: '!self.github.endsWith(''.git'')'
              repository:
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                type: string
              source:
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$
                    type: string
                  namespace:
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                    type: string
                  uid:
                    maxLength: 128
                    minLength: 1
                    pattern: ^[A-Za-z0-9-]+$
                    type: string
                required:
                - name
                - namespace
                - uid
                type: object
              sourceGeneration:
                format: int64
                minimum: 1
                type: integer
              sourceParent:
                maxLength: 317
                minLength: 1
                type: string
              stopState:
                enum:
                - Unknown
                type: string
              text:
                maxLength: 65536
                minLength: 1
                type: string
            required:
            - actor
            - attribution
            - byteCount
            - completeness
            - contentSHA256
            - identity
            - origin
            - project
            - provenance
            - repository
            - source
            - sourceGeneration
            - sourceParent
            - stopState
            - text
            type: object
            x-kubernetes-validations:
            - message: published context and original provenance are immutable
              rule: self == oldSelf
            - message: source UID must equal original publication identity
              rule: self.identity.sessionUID == self.source.uid
        required:
        - spec
        type: object
    served: true
    storage: true
