---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: credentialjobs.dev-env.haynesops.com
spec:
  group: dev-env.haynesops.com
  names:
    kind: CredentialJob
    listKind: CredentialJobList
    plural: credentialjobs
    shortNames:
    - cjob
    singular: credentialjob
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.credential
      name: Credential
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.expiresAt
      name: Expires
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CredentialJob is a broker request and keeper receipt in dev-env-system.
          RBAC separates main/status writers. Admission must additionally limit keeper
          main-resource updates to its cleanup finalizer; CEL cannot identify a writer.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CredentialJobSpec is written by the broker, after approval. Keeper rechecks
              the live grant before acting; a job is never itself an approval.
            properties:
              credential:
                description: General hw-ssh grants await the connection and revocation
                  contract.
                enum:
                - proxmox
                - hw-ssh
                type: string
              expiresAt:
                format: date-time
                type: string
              grant:
                description: CredentialObjectReference identifies an object including
                  its replacement fence.
                properties:
                  name:
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  namespace:
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  uid:
                    description: |-
                      UID is a type that holds unique ID values, including UUIDs.  Because we
                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    maxLength: 36
                    pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$
                    type: string
                required:
                - name
                - namespace
                - uid
                type: object
              release:
                type: boolean
              session:
                description: CredentialObjectReference identifies an object including
                  its replacement fence.
                properties:
                  name:
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  namespace:
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  uid:
                    description: |-
                      UID is a type that holds unique ID values, including UUIDs.  Because we
                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    maxLength: 36
                    pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$
                    type: string
                required:
                - name
                - namespace
                - uid
                type: object
            required:
            - credential
            - expiresAt
            - grant
            - session
            type: object
            x-kubernetes-validations:
            - message: only proxmox credential execution is implemented
              rule: self.credential == 'proxmox'
            - message: credential request is immutable; only release may change
              rule: self.grant == oldSelf.grant && self.session == oldSelf.session
                && self.credential == oldSelf.credential && self.expiresAt == oldSelf.expiresAt
            - message: release cannot be taken back
              rule: '!(has(oldSelf.release) && oldSelf.release) || (has(self.release)
                && self.release)'
          status:
            description: |-
              CredentialJobStatus is exclusively keeper-owned. Material lives only in its
              named private Secret journal and the target pod's memory-backed grant store.
            properties:
              failureCode:
                description: CredentialFailureCode deliberately carries no raw provider
                  or exec error.
                enum:
                - InvalidRequest
                - BackendUnavailable
                - MintFailed
                - AmbiguousMint
                - IncompatiblePod
                type: string
              installedAt:
                format: date-time
                type: string
              installedPodUID:
                maxLength: 64
                type: string
              phase:
                description: CredentialJobPhase describes execution, never the grant's
                  approval.
                enum:
                - Pending
                - Installed
                - CleanupPending
                - Revoked
                type: string
              providerID:
                maxLength: 128
                type: string
              revokedAt:
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
