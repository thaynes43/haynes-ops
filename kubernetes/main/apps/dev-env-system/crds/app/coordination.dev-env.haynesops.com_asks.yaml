# The Ask CRD, generated by controller-gen in thaynes43/dev-env
# (config/crd/coordination.dev-env.haynesops.com_asks.yaml; copied verbatim below). Never edit it here:
# change api/coordination/v1alpha1 in dev-env, run `make generate`, and copy the result. The
# prune-disabled annotation is added by kustomization.yaml, so the body stays
# byte-identical to the generated file.
#
# Source: dev-env main 83428207d7662a079ddcdcfe3a3484442040d115 (merge of PR #1036),
# verified byte for byte (SHA-256 29aa07e25fb83f93b9f5709aeb06cef094d868360c5e16afff43890b27494e80
# below this header). The body last changed in d0927fc2353a (PR #1037, ADR-021, OpenProject #525).
# Adds the grant Ask kind and answer.answeredBy.username, and makes expiresAt optional with
# rules that keep it required for info and approval Asks. Asks and approvals board
# (DESIGN-034, Epic #254; activation story #264): immutable spec, a set-once status answer,
# and its name is its id. Asks live in dev-agents. Only the operator writes them
# (rbac/app/asks.yaml); the keeper only reads them.
#
# Keep it in step with the operator: copy a changed file here before (or with) the pin
# that writes its new fields.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: asks.coordination.dev-env.haynesops.com
spec:
  group: coordination.dev-env.haynesops.com
  names:
    kind: Ask
    listKind: AskList
    plural: asks
    singular: ask
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Ask is one agent question, approval request, or grant that needs a person
          (OpenProject Epic #254, ADR-021). The spec is immutable. The status carries
          the lifecycle, and its answer is set once. v1 stores no inbox delivery: the
          requester reads the answer from the ask. A root rule stops a status write
          from dropping a stored answer. The status type's own rule does not run once
          status itself is gone.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AskSpec is the ask as it was created. Nothing in it changes.
              A grant ask carries grant and omits expiresAt and the approval scope.
              An info or approval ask omits grant and keeps expiresAt. Stored info and
              approval asks already have expiresAt and no grant, so these rules do not
              make them invalid.
            properties:
              allowFreeText:
                type: boolean
              context:
                description: AskContext names the session that created the ask.
                properties:
                  links:
                    items:
                      maxLength: 300
                      minLength: 1
                      type: string
                    maxItems: 5
                    type: array
                  sessionName:
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  sessionUID:
                    maxLength: 128
                    minLength: 1
                    pattern: ^[A-Za-z0-9-]+$
                    type: string
                  workPackage:
                    maximum: 2000000000
                    minimum: 0
                    type: integer
                required:
                - sessionName
                - sessionUID
                type: object
              createdAt:
                format: date-time
                type: string
              expiresAt:
                description: |-
                  ExpiresAt is the answer deadline of an info or approval ask. A grant ask
                  omits it. The field stays optional so a grant can leave it unset; every
                  stored info or approval ask already sets it.
                format: date-time
                type: string
              grant:
                description: Grant is the typed scope of a grant ask. Info and approval
                  asks omit it.
                properties:
                  detail:
                    description: Detail is optional display, 0 to 200 runes. It is
                      not part of the binding.
                    maxLength: 800
                    type: string
                  scopeDigest:
                    description: 'ScopeDigest is grantattest.ScopeDigest of that object:
                      43 base64url characters.'
                    maxLength: 43
                    minLength: 43
                    pattern: ^[A-Za-z0-9_-]{43}$
                    type: string
                  target:
                    description: Target is one token, 1 to 200 runes. The byte ceiling
                      is four bytes per rune.
                    maxLength: 800
                    minLength: 1
                    type: string
                  ttl:
                    description: |-
                      TTL is the duration the grant asked, stored as a duration string of at
                      most 16 characters. The broker checks the 10m to 8h bounds.
                    maxLength: 16
                    minLength: 2
                    pattern: ^([0-9]+(h|m|s))+$
                    type: string
                  type:
                    description: Type is the grant's type.
                    enum:
                    - kube
                    - egress
                    - credential
                    - breakglass
                    - maintenance
                    maxLength: 11
                    type: string
                  uid:
                    description: UID is the AccessGrant object's metadata.uid.
                    maxLength: 64
                    minLength: 1
                    pattern: ^[A-Za-z0-9]([A-Za-z0-9._:-]*[A-Za-z0-9])?$
                    type: string
                required:
                - scopeDigest
                - target
                - ttl
                - type
                - uid
                type: object
              id:
                maxLength: 20
                minLength: 20
                pattern: ^ask-[0-9a-f]{16}$
                type: string
              options:
                items:
                  description: AskOption is one choice on an ask.
                  properties:
                    description:
                      maxLength: 1200
                      type: string
                    id:
                      maxLength: 24
                      minLength: 1
                      pattern: ^[a-z0-9-]{1,24}$
                      type: string
                    label:
                      maxLength: 320
                      minLength: 1
                      type: string
                  required:
                  - id
                  - label
                  type: object
                maxItems: 6
                type: array
              question:
                description: Question is 1 to 1000 runes. The byte ceiling is four
                  bytes per rune.
                maxLength: 4000
                minLength: 1
                type: string
              recommended:
                maxLength: 24
                pattern: ^[a-z0-9-]{0,24}$
                type: string
              requestDigest:
                description: RequestDigest is the server's sha256 of the normalized
                  create body.
                maxLength: 64
                minLength: 64
                pattern: ^[a-f0-9]{64}$
                type: string
              requestId:
                maxLength: 64
                minLength: 8
                pattern: ^[A-Za-z0-9-]{8,64}$
                type: string
              scope:
                description: |-
                  AskScope is the single action an approval ask names. Info asks omit it.
                  A grant ask omits it too; the grant object is that ask's scope.
                properties:
                  action:
                    maxLength: 800
                    minLength: 1
                    type: string
                  expiresAt:
                    format: date-time
                    type: string
                  target:
                    maxLength: 800
                    minLength: 1
                    type: string
                required:
                - action
                - expiresAt
                - target
                type: object
              type:
                description: Type is info, approval or grant.
                enum:
                - info
                - approval
                - grant
                maxLength: 8
                type: string
            required:
            - allowFreeText
            - context
            - createdAt
            - id
            - question
            - requestDigest
            - requestId
            - type
            type: object
            x-kubernetes-validations:
            - message: ask spec is immutable
              rule: self == oldSelf
            - message: an info or approval ask has no grant
              rule: self.type == 'grant' || !has(self.grant)
            - message: a grant ask has a typed scope
              rule: self.type != 'grant' || has(self.grant)
            - message: a grant ask has no approval scope
              rule: self.type != 'grant' || !has(self.scope)
            - message: a grant ask has no expiry
              rule: self.type != 'grant' || !has(self.expiresAt)
            - message: an info or approval ask has an expiry
              rule: self.type == 'grant' || has(self.expiresAt)
          status:
            description: |-
              AskStatus is the lifecycle. An answer is written once and never replaced
              (contract v1.2.1). Open can become answered, withdrawn or expired; those
              three do not change again.
              An optional answer is absent, not null. The set-once rule uses has() and
              requires the new object to still carry the answer, so clearing the field
              does not skip the comparison.
            properties:
              answer:
                description: AskAnswer is the one answer recorded for an ask.
                properties:
                  answeredAt:
                    format: date-time
                    type: string
                  answeredBy:
                    description: |-
                      AskActor is the portal principal the operator was given. Session responses
                      omit issuer and subject; the stored record keeps them.
                    properties:
                      displayName:
                        maxLength: 480
                        type: string
                      issuer:
                        maxLength: 1200
                        type: string
                      subject:
                        maxLength: 800
                        type: string
                      username:
                        description: |-
                          Username is the portal preferred_username. A grant answer requires it.
                          An info or approval answer omits it. Session responses omit it.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[A-Za-z0-9][A-Za-z0-9._@+-]{0,62}$
                        type: string
                    type: object
                  approved:
                    type: boolean
                  optionId:
                    maxLength: 24
                    pattern: ^[a-z0-9-]{0,24}$
                    type: string
                  text:
                    maxLength: 8000
                    type: string
                required:
                - answeredAt
                - answeredBy
                type: object
              state:
                enum:
                - open
                - answered
                - withdrawn
                - expired
                type: string
            required:
            - state
            type: object
            x-kubernetes-validations:
            - message: an ask answer is set once
              rule: '!has(oldSelf.answer) || (has(self.answer) && self.answer == oldSelf.answer)'
            - message: an answered, withdrawn or expired ask does not change state
              rule: '!(oldSelf.state in [''answered'', ''withdrawn'', ''expired''])
                || self.state == oldSelf.state'
            - message: an answered ask has an answer
              rule: self.state != 'answered' || has(self.answer)
            - message: only an answered ask has an answer
              rule: self.state == 'answered' || !has(self.answer)
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: the ask's name is its id
          rule: self.metadata.name == self.spec.id
        - message: an ask answer cannot be dropped with status
          rule: '!has(oldSelf.status) || !has(oldSelf.status.answer) || (has(self.status)
            && has(self.status.answer))'
        - message: a grant answer has a username
          rule: '!has(self.status) || !has(self.status.answer) || self.spec.type !=
            ''grant'' || has(self.status.answer.answeredBy.username)'
        - message: an info or approval answer has no username
          rule: '!has(self.status) || !has(self.status.answer) || self.spec.type ==
            ''grant'' || !has(self.status.answer.answeredBy.username)'
    served: true
    storage: true
    subresources:
      status: {}
