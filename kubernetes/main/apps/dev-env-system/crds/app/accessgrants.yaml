---
# The AccessGrant CRD, generated in thaynes43/dev-env from api/v1alpha1.
# Source: dev-env commit 96ea748 on agent/keeper-pve-impl1008 (implementation
# pending review), including the immutable requester sessionUID field.
# The generated config/crd/dev-env.haynesops.com_accessgrants.yaml follows below.
# Never edit the schema here: change api/v1alpha1 in dev-env, run `make generate`,
# and copy the result. Keep it in step with the broker/operator image pins.
# The prune-disabled annotation is applied by kustomization.yaml.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: accessgrants.dev-env.haynesops.com
spec:
  group: dev-env.haynesops.com
  names:
    kind: AccessGrant
    listKind: AccessGrantList
    plural: accessgrants
    singular: accessgrant
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.requester.session
      name: Session
      type: string
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.approvedBy
      name: Approved-By
      type: string
    - jsonPath: .status.expiresAt
      name: Expires
      type: date
    - jsonPath: .spec.kube.role
      name: Role
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AccessGrant is one time-boxed grant of more than the baseline for one
          session (DESIGN-001 6.12, D-25). Agents cannot write AccessGrants: they ask
          through the /v1 API, which records the requester from the caller's token.
          AccessGrants live in dev-agents beside their sessions (D-54), and the name
          is also the grant's ServiceAccount, bindings and network policy.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AccessGrantSpec is one request, as the /v1 API wrote it. The API takes the
              requester from the caller's token, never from the request body (D-25).
            properties:
              credential:
                description: Credential is the credential of a credential grant.
                properties:
                  name:
                    description: Name is the credential.
                    enum:
                    - proxmox
                    - hw-ssh
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: immutable after create; only release may change
                  rule: self == oldSelf
              egress:
                description: Egress is the destinations of an egress grant.
                properties:
                  cidrs:
                    description: CIDRs are address ranges, such as 192.168.40.21/32
                      for one LAN host.
                    items:
                      maxLength: 43
                      type: string
                      x-kubernetes-validations:
                      - message: must be a CIDR such as 192.168.40.21/32
                        rule: isCIDR(self)
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: set
                  endpoints:
                    description: Endpoints are in-cluster pods by namespace and labels.
                    items:
                      description: |-
                        EgressEndpoint is in-cluster pods: every pod of a namespace, or the ones with
                        these labels.
                      properties:
                        matchLabels:
                          additionalProperties:
                            description: |-
                              LabelValue is a label value: at most 63 letters, digits, '-', '_' and '.',
                              starting and ending with a letter or digit, or empty.
                            maxLength: 63
                            pattern: ^([A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?)?$
                            type: string
                          description: |-
                            MatchLabels narrows the pods; empty means every pod in the namespace. The
                            keys are plain pod labels: a Cilium or Kubernetes meta label such as
                            io.kubernetes.pod.namespace or k8s:io.cilium.k8s.policy.serviceaccount
                            would let the selector leave Namespace, so those are refused.
                          maxProperties: 8
                          type: object
                          x-kubernetes-validations:
                          - message: matchLabels keys are plain label keys, such as
                              app.kubernetes.io/name
                            rule: self.all(k, k.size() <= 253 && k.matches('^([a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?$'))
                          - message: 'matchLabels may not use the io.kubernetes.,
                              io.cilium. or k8s.io/ meta labels: the endpoint stays
                              in its namespace'
                            rule: self.all(k, !k.startsWith('io.kubernetes.') && !k.startsWith('io.cilium.')
                              && !k.startsWith('k8s.io/'))
                        namespace:
                          description: Namespace is the pods' namespace.
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                          x-kubernetes-validations:
                          - message: no grant reaches the dev-env namespaces (DESIGN-001
                              6.12)
                            rule: '!(self in [''dev-env-system'', ''dev-agents'',
                              ''dev-tools''])'
                      required:
                      - namespace
                      type: object
                    maxItems: 8
                    type: array
                    x-kubernetes-list-type: atomic
                  fqdns:
                    description: |-
                      FQDNs are DNS names, each exact or with one leading "*." for any
                      subdomain. In-cluster names go by endpoints, never by name.
                    items:
                      maxLength: 253
                      pattern: ^(\*\.)?([a-z0-9]([-a-z0-9]*[a-z0-9])?\.)+[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                      x-kubernetes-validations:
                      - message: 'in-cluster and .local names are not reached by name:
                          use endpoints, or cidrs for a LAN host'
                        rule: '!self.endsWith(''.local'')'
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: set
                  ports:
                    description: Ports are the ports opened to every destination above.
                    items:
                      description: GrantPort is one port.
                      properties:
                        port:
                          description: Port is the destination port.
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                        protocol:
                          default: TCP
                          description: Protocol is TCP or UDP.
                          enum:
                          - TCP
                          - UDP
                          type: string
                      required:
                      - port
                      type: object
                    maxItems: 16
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: atomic
                required:
                - ports
                type: object
                x-kubernetes-validations:
                - message: immutable after create; only release may change
                  rule: self == oldSelf
                - message: 'name at least one destination: fqdns, cidrs or endpoints'
                  rule: '(has(self.fqdns) ? size(self.fqdns) : 0) + (has(self.cidrs)
                    ? size(self.cidrs) : 0) + (has(self.endpoints) ? size(self.endpoints)
                    : 0) > 0'
              kube:
                description: Kube is the role and namespaces of a kube or breakglass
                  grant.
                properties:
                  namespaces:
                    description: Namespaces are where a namespaced role is bound,
                      each named.
                    items:
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                      x-kubernetes-validations:
                      - message: no grant reaches the dev-env namespaces (DESIGN-001
                          6.12)
                        rule: '!(self in [''dev-env-system'', ''dev-agents'', ''dev-tools''])'
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: set
                  role:
                    description: Role is a ClusterRole from the grant role catalog.
                    enum:
                    - dev-env-grant-workloads
                    - dev-env-grant-storage
                    - dev-env-grant-secrets-read
                    - dev-env-grant-nodes
                    - dev-env-grant-breakglass
                    type: string
                required:
                - role
                type: object
                x-kubernetes-validations:
                - message: immutable after create; only release may change
                  rule: self == oldSelf
                - message: dev-env-grant-nodes and dev-env-grant-breakglass are cluster-wide
                    and take no namespaces; the other roles name at least one
                  rule: (self.role == 'dev-env-grant-nodes' || self.role == 'dev-env-grant-breakglass')
                    == (!has(self.namespaces) || size(self.namespaces) == 0)
              reason:
                description: |-
                  Reason is why the agent asks, in its own words. The approval page shows
                  it as agent-written.
                maxLength: 1000
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: immutable after create; only release may change
                  rule: self == oldSelf
              release:
                description: |-
                  Release asks the broker to end the grant now: the session gave it back
                  (DELETE /v1/grants/{name}) or was reaped. It only ever goes from false to
                  true.
                type: boolean
              requester:
                description: |-
                  Requester is the session the grant is for, as the API found it from the
                  caller's token.
                properties:
                  agent:
                    description: Agent is the session's agent CLI.
                    enum:
                    - claude
                    - codex
                    - opencode
                    type: string
                  parent:
                    description: |-
                      Parent is the session's spec.parent: the session or caller that started
                      it.
                    maxLength: 253
                    type: string
                  profile:
                    description: Profile is the profile the session's pod was built
                      with (D-18).
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  repo:
                    description: Repo is the session's spec.repo.
                    maxLength: 100
                    pattern: ^[A-Za-z0-9_.-]*$
                    type: string
                  session:
                    description: Session is the requesting session's name.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  sessionUID:
                    description: |-
                      SessionUID is captured by the API from the authenticated session. It is
                      required for credential execution; older kube and egress requests omit it.
                    maxLength: 36
                    pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$
                    type: string
                required:
                - session
                type: object
                x-kubernetes-validations:
                - message: immutable after create; only release may change
                  rule: self == oldSelf
              ttl:
                description: |-
                  TTL is how long the grant lasts once approved. Tom may approve it for less
                  time (status.approvedTTL).
                type: string
                x-kubernetes-validations:
                - message: immutable after create; only release may change
                  rule: self == oldSelf
              type:
                description: Type is what the grant gives.
                enum:
                - kube
                - egress
                - credential
                - breakglass
                type: string
                x-kubernetes-validations:
                - message: immutable after create; only release may change
                  rule: self == oldSelf
            required:
            - reason
            - requester
            - ttl
            - type
            type: object
            x-kubernetes-validations:
            - message: kube is set for types kube and breakglass, and only there
              rule: (self.type == 'kube' || self.type == 'breakglass') == has(self.kube)
            - message: egress is set for type egress, and only there
              rule: (self.type == 'egress') == has(self.egress)
            - message: credential is set for type credential, and only there
              rule: (self.type == 'credential') == has(self.credential)
            - message: type breakglass and role dev-env-grant-breakglass go together
                (D-27)
              rule: '!has(self.kube) || ((self.type == ''breakglass'') == (self.kube.role
                == ''dev-env-grant-breakglass''))'
            - message: ttl runs from 10m to 8h
              rule: duration(self.ttl) >= duration('10m') && duration(self.ttl) <=
                duration('8h')
            - message: a credential grant lasts at most 4h
              rule: self.type != 'credential' || duration(self.ttl) <= duration('4h')
            - message: break-glass lasts at most 1h (D-27)
              rule: self.type != 'breakglass' || duration(self.ttl) <= duration('1h')
            - message: immutable after create; only release may change
              rule: has(self.kube) == has(oldSelf.kube) && has(self.egress) == has(oldSelf.egress)
                && has(self.credential) == has(oldSelf.credential)
            - message: release cannot be taken back
              rule: '!(has(oldSelf.release) && oldSelf.release) || (has(self.release)
                && self.release)'
          status:
            description: |-
              AccessGrantStatus is the broker's record of the grant. Only the broker
              writes it (accessgrants/status); the operator's API reads it.
            properties:
              approvedAt:
                description: ApprovedAt is when it was approved.
                format: date-time
                type: string
              approvedBy:
                description: |-
                  ApprovedBy is "policy/<name>" for a standing policy, or
                  "authentik/<username>" for Tom on the approval page.
                maxLength: 253
                type: string
              approvedTTL:
                description: |-
                  ApprovedTTL is the TTL it was approved for: spec.ttl, or less when Tom
                  chose "approve for less time".
                type: string
              deniedBy:
                description: |-
                  DeniedBy is "authentik/<username>", "broker" (a check failed) or
                  "timeout" (unanswered for 30 minutes).
                maxLength: 253
                type: string
              endedAt:
                description: EndedAt is when it was denied, failed, expired or released.
                format: date-time
                type: string
              expiresAt:
                description: ExpiresAt is when an approved grant ends.
                format: date-time
                type: string
              installedAt:
                description: InstalledAt is when it was installed there.
                format: date-time
                type: string
              installedPodUID:
                description: |-
                  InstalledPodUID is the session pod the grant was last installed in. A new
                  pod (a resume, a drain) gets it installed again.
                maxLength: 64
                type: string
              message:
                description: Message says why a grant was denied or failed, in a line.
                maxLength: 1024
                type: string
              notifiedAt:
                description: NotifiedAt is when Tom was sent the approval link.
                format: date-time
                type: string
              phase:
                description: Phase is where the grant stands.
                enum:
                - Pending
                - Active
                - Denied
                - Expired
                - Released
                - Failed
                type: string
              serviceAccount:
                description: |-
                  ServiceAccount is the grant's identity in dev-agents, for kube and
                  breakglass grants.
                maxLength: 253
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'metadata.name must be at most 63 characters: it names the grant''s
            ServiceAccount and bindings'
          rule: self.metadata.name.size() <= 63
        - message: 'metadata.name is grant-<id>, a DNS label: it names the grant''s
            ServiceAccount, and the audit log shows it'
          rule: self.metadata.name.matches('^grant-[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    served: true
    storage: true
    subresources:
      status: {}
