---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-env-session-directories
  namespace: dev-env-system
rules:
  - apiGroups: [coordination.dev-env.haynesops.com]
    resources: [sessiondirectories]
    verbs: [get, create, list]
  - apiGroups: [coordination.dev-env.haynesops.com]
    resources: [sessiondirectories/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-env-session-directories
  namespace: dev-env-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dev-env-session-directories
subjects:
  - kind: ServiceAccount
    name: dev-env-operator
    namespace: dev-env-system
