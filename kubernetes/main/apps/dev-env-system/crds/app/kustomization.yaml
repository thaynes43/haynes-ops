---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./agentsessions.yaml
  # CallerPolicy (DESIGN-060 7.1, OpenProject #526): schema only. No CallerPolicy
  # object and no ServiceAccount are declared here.
  - ./dev-env.haynesops.com_callerpolicies.yaml
  - ./accessgrants.yaml
  - ./grantpolicies.yaml
  - ./activities.yaml
  - ./credentialjobs.yaml
  - ./reminders.yaml
  - ./scheduledworks.yaml
  - ./coordination.dev-env.haynesops.com_taskclaims.yaml
  - ./taskclaims-operator.yaml
  - ./coordination.dev-env.haynesops.com_publishedcontexts.yaml
  - ./publishedcontexts-operator.yaml
  - ./coordination.dev-env.haynesops.com_inboxmessages.yaml
  - ./coordination.dev-env.haynesops.com_inboxreadacks.yaml
  - ./inbox-operator.yaml
  - ./coordination.dev-env.haynesops.com_sessiondirectories.yaml
  - ./sessiondirectories-operator.yaml
  # Asks (DESIGN-034, Epic #254, activation #264): schema only here. Its Roles are in
  # dev-env-rbac (rbac/app/asks.yaml), where pruning is on, so removing them is a clean rollback.
  - ./coordination.dev-env.haynesops.com_asks.yaml
patches:
  # A CRD is never pruned (DESIGN-001 D-03): deleting it deletes every session.
  - target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    patch: |-
      - op: add
        path: /metadata/annotations/kustomize.toolkit.fluxcd.io~1prune
        value: disabled
