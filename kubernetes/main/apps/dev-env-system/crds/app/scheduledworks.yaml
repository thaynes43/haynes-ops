# The ScheduledWork CRD, generated by controller-gen v0.22.0 in thaynes43/dev-env
# (config/crd/dev-env.haynesops.com_scheduledworks.yaml, added by dev-env ef2802b, PR #898, DESIGN-054 S2;
# byte-identical at tag v2.93.0 and at main a4b7715b; copied verbatim below). Never edit it here: change
# api/v1alpha1 in dev-env, run `make generate`, and copy the result. The prune-disabled annotation is
# added by kustomization.yaml, so the body stays byte-identical to the generated file.
#
# Schema only (DESIGN-054 S6, step "CRD copy"). The executor flag --enable-scheduled-work stays off, and
# its Roles, the CRD-get ClusterRole, the admission policies and the dispatch templates ConfigMap are
# separate PRs, so installing this CRD schedules and dispatches nothing.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: scheduledworks.dev-env.haynesops.com
spec:
  group: dev-env.haynesops.com
  names:
    kind: ScheduledWork
    listKind: ScheduledWorkList
    plural: scheduledworks
    shortNames:
    - sw
    singular: scheduledwork
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.nextDue
      name: Next
      type: date
    - jsonPath: .spec.owner
      name: Owner
      type: string
    - jsonPath: .spec.title
      name: Title
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ScheduledWork is agent work that starts at a scheduled time.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ScheduledWorkSpec is what the owner asked for.
            properties:
              calendar:
                description: |-
                  Calendar is an optional calendar projection, calendar:<ref>, kept
                  through a companion Reminder. The CRD stays the state of record; the
                  calendar never changes it.
                maxLength: 128
                pattern: ^calendar:[a-z0-9][a-z0-9-]{0,62}$
                type: string
              cancelled:
                description: |-
                  Cancelled is the cancel: no later occurrence is dispatched. It does not
                  stop a running session, and it cannot be undone: a cancelled item is
                  never re-armed by an edit.
                type: boolean
              due:
                description: |-
                  Due is the local wall time of the first occurrence, YYYY-MM-DDTHH:MM,
                  read in TimeZone, with DESIGN-032's gap and fold rules.
                maxLength: 16
                pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}$
                type: string
              editor:
                description: |-
                  Editor is the caller of the latest spec write, create included, in the
                  owner's form. The API writes it in the same write as every spec change,
                  so the two cannot diverge. A standing authority basis holds only while
                  the editor is the owner; any other editor leaves the item needing a human
                  approval of that exact spec.
                maxLength: 256
                minLength: 1
                pattern: ^(human|client|coordinator|session)/[^/]+/[^/]+$
                type: string
              mode:
                description: Mode is headless (a task session) or interactive (a remote
                  session).
                enum:
                - headless
                - interactive
                type: string
              notAfter:
                description: |-
                  NotAfter ends the item: no occurrence is dispatched after it. It is
                  required, so no scheduled work runs forever. Its upper bound, 180 days
                  after creation, needs the creation time, which this schema cannot read
                  on create; the API enforces it (DESIGN-054 S5).
                format: date-time
                type: string
              notify:
                description: |-
                  Notify are the page references, pushover:<ref> in Reminder target form.
                  Pages go through keyed one-shot Reminders, which the keeper sends. A
                  calendar is not a page: it is the separate Calendar projection.
                items:
                  maxLength: 128
                  pattern: ^pushover:[a-z0-9][a-z0-9-]{0,62}$
                  type: string
                maxItems: 8
                type: array
                x-kubernetes-list-type: set
              owner:
                description: |-
                  Owner is the caller that created it, from its token, in the form a
                  Reminder records: session/<name>/<uid>, client/<namespace>/<name>,
                  coordinator/<namespace>/<name> or human/<namespace>/<name>. It never
                  changes.
                maxLength: 256
                minLength: 1
                pattern: ^(human|client|coordinator|session)/[^/]+/[^/]+$
                type: string
                x-kubernetes-validations:
                - message: the owner of scheduled work never changes
                  rule: self == oldSelf
              recurrence:
                description: Recurrence repeats the work, in DESIGN-032's shape; absent
                  is one-shot.
                properties:
                  byDay:
                    description: |-
                      ByDay lists the weekdays of a weekly recurrence (MO..SU). Empty means
                      the weekday of the due time.
                    items:
                      enum:
                      - MO
                      - TU
                      - WE
                      - TH
                      - FR
                      - SA
                      - SU
                      type: string
                    maxItems: 7
                    type: array
                    x-kubernetes-list-type: set
                  byMonthDay:
                    description: |-
                      ByMonthDay is the day of the month of a monthly recurrence (1..31). A
                      day a month lacks is clamped to that month's last day. Zero means the
                      day of the due time.
                    format: int32
                    maximum: 31
                    minimum: 1
                    type: integer
                  count:
                    description: |-
                      Count ends the recurrence after this many occurrences, the first
                      included.
                    format: int32
                    maximum: 1000
                    minimum: 1
                    type: integer
                  freq:
                    description: Freq is daily, weekly or monthly.
                    enum:
                    - daily
                    - weekly
                    - monthly
                    type: string
                  until:
                    description: Until ends the recurrence at this instant, inclusive.
                    format: date-time
                    type: string
                required:
                - freq
                type: object
                x-kubernetes-validations:
                - message: byDay is for a weekly recurrence
                  rule: self.freq == 'weekly' || !has(self.byDay)
                - message: byMonthDay is for a monthly recurrence
                  rule: self.freq == 'monthly' || !has(self.byMonthDay)
                - message: until and count are exclusive
                  rule: '!(has(self.until) && has(self.count))'
              timeZone:
                description: TimeZone is an IANA zone name, such as America/New_York.
                maxLength: 64
                minLength: 1
                pattern: ^[A-Za-z][A-Za-z0-9_+/-]*$
                type: string
              title:
                description: Title names the work in pages, the calendar projection
                  and listings.
                maxLength: 120
                minLength: 1
                type: string
              work:
                description: Work is the work order and its dispatch template.
                properties:
                  prompt:
                    description: |-
                      Prompt is the work order: a headless session's prompt, or the message an
                      interactive session receives once it is ready. At most 8 KiB, counted in
                      bytes (MaxLength counts characters; the rule counts bytes).
                    maxLength: 8192
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: prompt is at most 8192 bytes
                      rule: size(bytes(self)) <= 8192
                  repo:
                    description: |-
                      Repo is the repository the session works in, as AgentSession's repo. The
                      template must allow it, at the due time.
                    maxLength: 100
                    minLength: 1
                    pattern: ^[A-Za-z0-9_.-]+$
                    type: string
                    x-kubernetes-validations:
                    - message: repo is a repository name, not a path
                      rule: self != '.' && self != '..'
                  template:
                    description: |-
                      Template names an entry in the scheduled-work ConfigMap
                      (dev-env-system/dev-env-scheduled-work). The template fixes the agent,
                      model id, effort, size, profile, allowed repos, maximum duration and the
                      owner classes it admits; the request cannot raise any of them.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - prompt
                - repo
                - template
                type: object
            required:
            - due
            - editor
            - mode
            - notAfter
            - owner
            - timeZone
            - title
            - work
            type: object
            x-kubernetes-validations:
            - message: cancelled scheduled work stays cancelled
              rule: '!has(oldSelf.cancelled) || !oldSelf.cancelled || (has(self.cancelled)
                && self.cancelled)'
            - message: 'interactive scheduled work needs a notify target: Tom is paged
                the session link'
              rule: self.mode != 'interactive' || (has(self.notify) && size(self.notify)
                > 0)
          status:
            description: |-
              ScheduledWorkStatus is what the executor did, and the approval that may
              authorise it.
            properties:
              approval:
                description: Approval is a human's approval of the current spec, if
                  any.
                properties:
                  at:
                    format: date-time
                    type: string
                  by:
                    description: By is the approving human, human/<namespace>/<name>.
                    maxLength: 256
                    minLength: 1
                    pattern: ^human/.+$
                    type: string
                  specHash:
                    description: |-
                      SpecHash is the SHA-256, in hex, of the spec the human approved: every
                      spec field except editor and cancelled. Any other edit, notify, calendar
                      and title included, changes it, so the approval no longer matches.
                    maxLength: 64
                    pattern: ^[0-9a-f]{64}$
                    type: string
                  templateDigest:
                    description: |-
                      TemplateDigest is the SHA-256, in hex, of the dispatch template the
                      spec named when the human approved it (authority.TemplateDigest): the
                      API's approve route reads the template and records it in the same write
                      as the approval. An edit of the template changes it, so the approval no
                      longer matches and is void, as for a spec edit. An approval without it
                      is void too, so an older writer that leaves it out authorises nothing.
                    maxLength: 64
                    pattern: ^[0-9a-f]{64}$
                    type: string
                required:
                - at
                - by
                - specHash
                type: object
              counts:
                description: ScheduledWorkCounts counts occurrences by outcome, over
                  the item's life.
                properties:
                  ambiguous:
                    format: int32
                    minimum: 0
                    type: integer
                  cancelled:
                    format: int32
                    minimum: 0
                    type: integer
                  ended:
                    format: int32
                    minimum: 0
                    type: integer
                  failed:
                    format: int32
                    minimum: 0
                    type: integer
                  parked:
                    format: int32
                    minimum: 0
                    type: integer
                  skipped:
                    format: int32
                    minimum: 0
                    type: integer
                  succeeded:
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              nextDue:
                description: NextDue is the instant of the next occurrence; absent
                  when none is left.
                format: date-time
                type: string
              occurrences:
                description: |-
                  Occurrences are the recorded occurrences, oldest first: the newest
                  ScheduledWorkTerminalKept terminal ones and every non-terminal one.
                  They are keyed by At, so each update is checked against the stored
                  occurrence with the same At (ScheduledWorkOccurrence's rules).
                items:
                  description: |-
                    ScheduledWorkOccurrence is one due time and what the executor did with it.
                    Occurrences are keyed by At, so an update is checked against the stored
                    record with the same At: a terminal state is final, the session and spec
                    hash are set once, and the attempt only grows. Whether a delivery note
                    belongs to interactive work is not checked here: the mode is in the spec,
                    which a rule on an occurrence cannot read, and an edit may change it after
                    the occurrence was claimed.
                  properties:
                    at:
                      description: At is the occurrence's instant, its due time resolved
                        in the zone.
                      format: date-time
                      type: string
                    attempt:
                      description: |-
                        Attempt is 0, then one more for each human approve or retry, at most
                        ScheduledWorkMaxAttempt: the API refuses a fourth retry. It never
                        decreases.
                      format: int32
                      maximum: 3
                      minimum: 0
                      type: integer
                    claimedAt:
                      description: ClaimedAt is when the executor claimed the occurrence.
                      format: date-time
                      type: string
                    delivery:
                      description: |-
                        Delivery is the interactive work order's delivery: accepted, refused or
                        ambiguous.
                      enum:
                      - accepted
                      - refused
                      - ambiguous
                      type: string
                    ending:
                      description: |-
                        Ending marks an occurrence the executor is about to end without a
                        session: written, by itself and while the occurrence is not final,
                        before the executor's last read of the session, and followed by the
                        final record. The launch gate refuses a session that such an
                        occurrence does not name, so a create that lands after the mark never
                        starts, and one that lands before it is found by that last read and
                        adopted. It is never removed.
                      type: boolean
                    execution:
                      description: |-
                        Execution is how a headless task ended, copied from the session's
                        status.taskResult. It decides the terminal state: Succeeded is Succeeded,
                        Failed and TimedOut are Failed, Unknown is Ended. It says only what the
                        task process reported, not that the work is right.
                      properties:
                        reason:
                          description: Reason is the task result's CamelCase reason,
                            such as TaskExitedNonZero.
                          maxLength: 128
                          type: string
                        state:
                          description: State is Succeeded, Failed, TimedOut or Unknown.
                          enum:
                          - Succeeded
                          - Failed
                          - TimedOut
                          - Unknown
                          type: string
                      required:
                      - state
                      type: object
                    missed:
                      description: |-
                        Missed is how many due times this one Skipped record stands for, when
                        the executor found several missed at once after an outage. Absent means
                        one. Only a Skipped occurrence carries it.
                      format: int32
                      maximum: 100000
                      minimum: 1
                      type: integer
                    pages:
                      description: |-
                        Pages are the pages this occurrence sent, at most one per event and
                        attempt and at most ScheduledWorkMaxPages. Write them with AppendPage,
                        which drops the oldest attempt's entries when the list is full (their
                        Reminders remain).
                      items:
                        description: |-
                          ScheduledWorkPage is one page an occurrence sent. Each page is its own
                          one-shot Reminder, keyed by the occurrence, the event and the attempt, and a sent Reminder
                          is never reused. Pages are best effort: a page Reminder that cannot be
                          created, or a Reminder kind that is not served, is recorded as skipped and
                          never holds a finalizer, a claim or a state change.
                        properties:
                          attempt:
                            default: 0
                            description: |-
                              Attempt is the occurrence's attempt the page belongs to: 0, then one
                              more for each human approve or retry, so a second park can be paged. At
                              most ScheduledWorkMaxAttempt, as on the occurrence.
                            format: int32
                            maximum: 3
                            minimum: 0
                            type: integer
                          event:
                            description: |-
                              Event is what the page reports: due, link, parked, failed, result or
                              skipped.
                            enum:
                            - due
                            - link
                            - parked
                            - failed
                            - result
                            - skipped
                            type: string
                          reminder:
                            description: |-
                              Reminder is the name of the Reminder that carries the page; absent when
                              none was created.
                            maxLength: 253
                            pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                            type: string
                          state:
                            description: |-
                              State is the Reminder's final delivery state, copied, or skipped when no
                              Reminder could be created; absent until there is one.
                            enum:
                            - sent
                            - failed
                            - ambiguous
                            - skipped
                            type: string
                        required:
                        - attempt
                        - event
                        type: object
                      maxItems: 8
                      type: array
                      x-kubernetes-list-map-keys:
                      - event
                      - attempt
                      x-kubernetes-list-type: map
                    reason:
                      description: |-
                        Reason says why the state is what it is, such as "no standing
                        authority", "previous still running" or, for interactive work that
                        ended, "participation not observed".
                      maxLength: 256
                      type: string
                    reported:
                      description: |-
                        Reported is a headless agent's own retained outcome, copied with the
                        Session outcome's limits. It is the agent's claim about the work and is
                        not validated; the receiver judges it. Interactive work has none.
                      properties:
                        headSHAs:
                          items:
                            maxLength: 40
                            pattern: ^[a-fA-F0-9]{40}$
                            type: string
                          maxItems: 3
                          type: array
                        prURLs:
                          items:
                            maxLength: 256
                            pattern: ^https://github\.com/thaynes43/(?:\.?[A-Za-z0-9_-][A-Za-z0-9._-]*|\.\.[A-Za-z0-9._-]+)/pull/[0-9]{1,6}$
                            type: string
                          maxItems: 3
                          type: array
                        summary:
                          maxLength: 200
                          minLength: 1
                          pattern: ^[\p{L}\p{M}\p{N}\p{P}\p{S}\p{Zs}]{1,200}$
                          type: string
                      required:
                      - summary
                      type: object
                    retriedAt:
                      description: |-
                        RetriedAt is when a human approved or retried this occurrence while it
                        was Parked. It opens a fresh window for this occurrence only: its grace,
                        the claim-without-session rule and the start deadline count from here,
                        not from At. It is set only with an attempt of 1 or more.
                      format: date-time
                      type: string
                    session:
                      description: |-
                        Session is the derived session name:
                        sw-<first 12 hex of the ScheduledWork UID>-<occurrence UTC YYYYMMDDHHMM>.
                        Once set it never changes.
                      maxLength: 28
                      pattern: ^sw-[0-9a-f]{12}-[0-9]{12}$
                      type: string
                    sessionUID:
                      description: |-
                        SessionUID is the UID of the session object the occurrence records:
                        set once, by the executor's Dispatched record or the releaser's
                        terminal record. A session of the same name with another UID (a second
                        create after the first was deleted, which comes only after its record)
                        is refused at its first pod by the launch gate.
                      maxLength: 64
                      type: string
                    specHash:
                      description: |-
                        SpecHash is the hash of the spec the occurrence was claimed with, in the
                        form of status.approval.specHash. An edit applies from the next
                        occurrence; this one runs on the spec it was claimed with. Once set it
                        never changes.
                      maxLength: 64
                      pattern: ^[0-9a-f]{64}$
                      type: string
                    state:
                      description: |-
                        State is where the occurrence is in its lifecycle. A terminal state
                        (OccurrenceTerminal) never changes.
                      enum:
                      - Pending
                      - Claimed
                      - Dispatched
                      - Delivered
                      - Opened
                      - Running
                      - Succeeded
                      - Failed
                      - Ended
                      - Parked
                      - Skipped
                      - Ambiguous
                      - Cancelled
                      maxLength: 10
                      type: string
                  required:
                  - at
                  - state
                  type: object
                  x-kubernetes-validations:
                  - message: a terminal occurrence never changes state
                    rule: '!(oldSelf.state in [''Succeeded'', ''Failed'', ''Ended'',
                      ''Skipped'', ''Ambiguous'', ''Cancelled'']) || self.state ==
                      oldSelf.state'
                  - message: an occurrence's session never changes once set
                    rule: '!has(oldSelf.session) || (has(self.session) && self.session
                      == oldSelf.session)'
                  - message: an occurrence's specHash never changes once set
                    rule: '!has(oldSelf.specHash) || (has(self.specHash) && self.specHash
                      == oldSelf.specHash)'
                  - message: an occurrence's reported outcome never changes once set
                    rule: '!has(oldSelf.reported) || (has(self.reported) && self.reported
                      == oldSelf.reported)'
                  - message: an occurrence's attempt never decreases
                    rule: '(has(self.attempt) ? self.attempt : 0) >= (has(oldSelf.attempt)
                      ? oldSelf.attempt : 0)'
                  - message: retriedAt is set only on a retried attempt, attempt 1
                      or more
                    rule: '!has(self.retriedAt) || (has(self.attempt) && self.attempt
                      > 0)'
                  - message: missed is set only on a Skipped occurrence
                    rule: '!has(self.missed) || self.state == ''Skipped'''
                  - message: an occurrence's sessionUID never changes once set
                    rule: '!has(oldSelf.sessionUID) || (has(self.sessionUID) && self.sessionUID
                      == oldSelf.sessionUID)'
                  - message: an occurrence's ending mark is never removed
                    rule: '!has(oldSelf.ending) || !oldSelf.ending || (has(self.ending)
                      && self.ending)'
                  - message: an occurrence is marked ending only while it is not final
                    rule: '!has(self.ending) || !self.ending || (has(oldSelf.ending)
                      && oldSelf.ending) || !(oldSelf.state in [''Succeeded'', ''Failed'',
                      ''Ended'', ''Skipped'', ''Ambiguous'', ''Cancelled''])'
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - at
                x-kubernetes-list-type: map
              planHash:
                description: |-
                  PlanHash is the hash of the schedule fields NextDue was computed from.
                  An edit re-plans from now.
                maxLength: 64
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
