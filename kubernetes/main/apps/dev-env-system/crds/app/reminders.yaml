    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Reminder is one durable reminder.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ReminderSpec is what the owner asked for.
              A projection reminder (DESIGN-054 S4) is a calendar image only. It has a
              retention end, so it always leaves pending, and it never changes into or out
              of a projection.
            properties:
              body:
                description: |-
                  Body is the notification and calendar description. It is the Pushover
                  message, so it is held to Pushover's 1024 limit (the API counts bytes).
                maxLength: 1024
                type: string
              cancelled:
                description: |-
                  Cancelled is the owner's cancel. The scheduler turns it into the
                  cancelled state and removes the calendar entry.
                type: boolean
              due:
                description: |-
                  Due is the local wall time of the first occurrence, YYYY-MM-DDTHH:MM,
                  read in TimeZone. A time the zone skips (a DST gap) or repeats (a fold)
                  is resolved by DESIGN-032: the gap shifts forward by its length, the fold
                  takes the first of the two.
                maxLength: 16
                pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}$
                type: string
              owner:
                description: |-
                  Owner is the caller that created it, from its token:
                  session/<name>/<uid> (the session's UID, so a later session that reuses
                  the name inherits nothing), client/<namespace>/<name> or
                  human/<namespace>/<name>. It never changes.
                maxLength: 256
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: the owner of a reminder never changes
                  rule: self == oldSelf
              projection:
                description: |-
                  Projection marks a calendar projection of scheduled work (DESIGN-054 S4).
                  The CRD allows calendar targets only, requires ProjectionRetainUntil, and
                  refuses any change of this field after creation. The scheduler keeps the
                  reminder pending until it is cancelled or ProjectionRetainUntil passes,
                  and does not finish it at the last occurrence.
                type: boolean
              projectionRetainUntil:
                description: |-
                  ProjectionRetainUntil is how long a projection reminder lives: the
                  item's notAfter (DESIGN-054 G1-R1). It is separate from the recurrence's
                  until, which ends the calendar event's own series at its last
                  occurrence. Once it is strictly in the past, the scheduler deletes the
                  event and the reminder ends skipped. It can be edited, because the item's
                  notAfter can be.
                format: date-time
                type: string
              recurrence:
                description: Recurrence repeats the reminder; absent is one-shot.
                properties:
                  byDay:
                    description: |-
                      ByDay lists the weekdays of a weekly recurrence (MO..SU). Empty means
                      the weekday of the due time.
                    items:
                      enum:
                      - MO
                      - TU
                      - WE
                      - TH
                      - FR
                      - SA
                      - SU
                      type: string
                    maxItems: 7
                    type: array
                    x-kubernetes-list-type: set
                  byMonthDay:
                    description: |-
                      ByMonthDay is the day of the month of a monthly recurrence (1..31). A
                      day a month lacks is clamped to that month's last day. Zero means the
                      day of the due time.
                    format: int32
                    maximum: 31
                    minimum: 1
                    type: integer
                  count:
                    description: |-
                      Count ends the recurrence after this many occurrences, the first
                      included.
                    format: int32
                    maximum: 1000
                    minimum: 1
                    type: integer
                  freq:
                    description: Freq is daily, weekly or monthly.
                    enum:
                    - daily
                    - weekly
                    - monthly
                    type: string
                  until:
                    description: Until ends the recurrence at this instant, inclusive.
                    format: date-time
                    type: string
                required:
                - freq
                type: object
                x-kubernetes-validations:
                - message: byDay is for a weekly recurrence
                  rule: self.freq == 'weekly' || !has(self.byDay)
                - message: byMonthDay is for a monthly recurrence
                  rule: self.freq == 'monthly' || !has(self.byMonthDay)
                - message: until and count are exclusive
                  rule: '!(has(self.until) && has(self.count))'
              targets:
                description: 'Targets are references: pushover:<ref> and calendar:<ref>.'
                items:
                  maxLength: 128
                  pattern: ^(pushover|calendar):[a-z0-9][a-z0-9-]{0,62}$
                  type: string
                maxItems: 8
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              timeZone:
                description: TimeZone is an IANA zone name, such as America/New_York.
                maxLength: 64
                minLength: 1
                pattern: ^[A-Za-z][A-Za-z0-9_+/-]*$
                type: string
              title:
                description: Title is the notification and calendar title.
                maxLength: 120
                minLength: 1
                type: string
            required:
            - due
            - owner
            - targets
            - timeZone
            - title
            type: object
            x-kubernetes-validations:
            - message: a projection reminder has calendar targets only
              rule: '!has(self.projection) || !self.projection || self.targets.all(t,
                t.startsWith(''calendar:''))'
            - message: a projection reminder needs projectionRetainUntil
              rule: '!has(self.projection) || !self.projection || has(self.projectionRetainUntil)'
            - message: projectionRetainUntil is for a projection reminder only
              rule: '!has(self.projectionRetainUntil) || (has(self.projection) &&
                self.projection)'
            - message: projection never changes
              rule: (has(self.projection) && self.projection) == (has(oldSelf.projection)
                && oldSelf.projection)
          status:
            description: ReminderStatus is what the scheduler did.
            properties:
              attempts:
                description: Attempts is the last attempts, oldest first, at most
                  20.
                items:
                  description: ReminderAttempt is one entry of the bounded attempt
                    log.
                  properties:
                    at:
                      format: date-time
                      type: string
                    detail:
                      maxLength: 128
                      type: string
                    occurrence:
                      format: int32
                      type: integer
                    outcome:
                      enum:
                      - sent
                      - failed
                      - ambiguous
                      - skipped
                      - missed
                      - retry
                      type: string
                    target:
                      maxLength: 128
                      type: string
                  required:
                  - at
                  - occurrence
                  - outcome
                  type: object
                maxItems: 20
                type: array
                x-kubernetes-list-type: atomic
              calendar:
                description: Calendar is the sync state of each calendar target.
                items:
                  description: ReminderCalendarSync is one calendar target's entry
                    for the whole series.
                  properties:
                    eventID:
                      description: |-
                        EventID is derived from the reminder's name, so a replayed create finds
                        the entry it already made.
                      maxLength: 64
                      type: string
                    reason:
                      maxLength: 128
                      type: string
                    specHash:
                      description: SpecHash is the hash of the fields the entry was
                        last written from.
                      maxLength: 64
                      type: string
                    state:
                      enum:
                      - synced
                      - skipped
                      - failed
                      - deleted
                      type: string
                    target:
                      maxLength: 128
                      type: string
                    updatedAt:
                      format: date-time
                      type: string
                  required:
                  - state
                  - target
                  - updatedAt
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-type: atomic
              deliveries:
                description: Deliveries are the current occurrence's, one per delivered
                  target.
                items:
                  description: ReminderDelivery is one target's delivery of the current
                    occurrence.
                  properties:
                    attempts:
                      description: Attempts counts the claims made for this occurrence.
                      format: int32
                      maximum: 100
                      minimum: 0
                      type: integer
                    notBefore:
                      description: NotBefore is the earliest a retry may be claimed.
                      format: date-time
                      type: string
                    occurrence:
                      description: Occurrence is the 1-based index of the occurrence
                        in its series.
                      format: int32
                      type: integer
                    reason:
                      maxLength: 128
                      type: string
                    receipt:
                      description: |-
                        Receipt is the provider's receipt when it gives one. Pushover's standard
                        priorities give none.
                      maxLength: 64
                      type: string
                    state:
                      enum:
                      - claimed
                      - retry
                      - sent
                      - failed
                      - ambiguous
                      - skipped
                      type: string
                    target:
                      maxLength: 128
                      type: string
                    updatedAt:
                      format: date-time
                      type: string
                  required:
                  - attempts
                  - occurrence
                  - state
                  - target
                  - updatedAt
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-type: atomic
              message:
                description: Message says why the state is what it is.
                maxLength: 256
                type: string
              nextDue:
                description: NextDue is the instant of the next occurrence; absent
                  when none is left.
                format: date-time
                type: string
              occurrence:
                description: Occurrence is the 1-based index of NextDue in its series.
                format: int32
                minimum: 0
                type: integer
              planHash:
                description: PlanHash is the hash of the schedule fields NextDue was
                  computed from.
                maxLength: 64
                type: string
              state:
                description: State is pending, sent, failed, skipped or cancelled.
                  Absent means pending.
                enum:
                - pending
                - sent
                - failed
                - skipped
                - cancelled
                type: string
            type: object
