---
# The portal's non-secret configuration: one file per key under
# /etc/dev-env-portal/config.
# - The eight URLs must equal the constants the portal pins, or it refuses to start.
# - Durations and auth-style are the tested fixture values, inside the parser's
#   bounds. They are not a measured service level.
# - No admission or witness keys: Tom dropped the admission witness and recovery
#   fence (2026-10-26), and the portal no longer reads them (dev-env#560).
# - No subject file: the portal authorizes by Authentik group membership.
# - session-actions.json: 2026-10-29, Tom: send and history for the group that admits
#   portal login; one pilot target; no subject (OP #244). It names only the target
#   session (name and UID, which are not secret) for each action, never a person: any
#   user the portal already admits may use it. The operator's own --portal-send-target
#   and --portal-history-target flags (operator/app/helmrelease.yaml) are the second,
#   independent allowlist for the same session. Launch is not listed, so it stays off.
#   A file with an issuer or subject is refused by the portal (dev-env#649). Kill switch:
#   a PR removing the two operator flags and this key.
# - asks.json: opt in to the Asks board and answer forms (Epic #254, dev-env#669).
#   The only accepted key is enabled. It uses operator-api-url and the existing
#   projected OPERATOR_TOKEN and operator CA; no new host or credential is needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dev-env-v2-portal-config
  namespace: dev-agents
data:
  origin: https://dev-env-v2.haynesops.com
  issuer: https://authentik.haynesnetwork.com/application/o/dev-env-v2-portal/
  authorization-url: https://authentik.haynesnetwork.com/application/o/authorize/
  token-url: https://authentik.haynesnetwork.com/application/o/token/
  userinfo-url: https://authentik.haynesnetwork.com/application/o/userinfo/
  jwks-url: https://authentik.haynesnetwork.com/application/o/dev-env-v2-portal/jwks/
  openproject-base-url: https://openproject-web.frontend.svc.cluster.local:8443
  operator-api-url: https://dev-env-operator.dev-env-system.svc.cluster.local:8443
  auth-style: header
  login-ttl: 1m
  idle-ttl: 30m
  absolute-ttl: 1h
  fresh-for: 1m
  clock-skew: 0s
  pages-alertmanager.json: '{"source_url":"http://alertmanager-operated.observability.svc.cluster.local:9093/api/v2/alerts"}'
  session-actions.json: '{"send":{"targets":[{"name":"dev-env-1028-031951","uid":"5da21936-7781-4760-82ce-2a0689b891f7"}]},"history":{"targets":[{"name":"dev-env-1028-031951","uid":"5da21936-7781-4760-82ce-2a0689b891f7"}]}}'
  asks.json: '{"enabled":true}'
