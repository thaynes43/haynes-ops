---
# The portal's private action scope (send and history), for one pilot session only.
# 2026-10-29, Tom chose target dev-env-1028-031951 (AskUserQuestion,
# OpenProject #244); the 2026-10-27 approval for dev-env-1027-185745 is not reused.
# Only Tom's portal principal may Send to and read the history of that pilot session.
# No other target, no other principal.
#
# The portal will read this as /etc/dev-env-portal/config/session-actions.json
# (dev-env docs/portal-session-runtime.md, "Default-off portal action source
# configuration"). The subject is Tom's Authentik user UUID for the provider
# dev-env-v2-portal-internal (Subject mode "Based on the User's UUID"). It comes from
# the new property PORTAL_ACTION_SUBJECT on the 1Password item HaynesKube/dev-env, which
# Tom writes himself. It is not committed here: this repo is public.
#
# Stage 1 of 2. This ExternalSecret is created first and nothing mounts it yet. Stage 2
# (a later PR) projects the Secret into the portal as an optional source and adds the two
# operator flags. Stage 2 is merged only after this ExternalSecret is SecretSynced, so the
# portal pod that stage 2 rolls starts with the file present: the portal reads its config
# files once at start, and Reloader restarts it when a mounted Secret changes, not when
# one is first created.
#
# Until the property exists, this ExternalSecret does not sync and both actions stay off.
# Write PORTAL_ACTION_SUBJECT before merging this stage.
# Merged first, the portal Flux Kustomization waits on this ExternalSecret, fails after its timeout, and the critical FluxReconciliationFailure alert fires after about 20 minutes.
#
# Revocation. There is NO automatic expiry. Removing the 1Password property does NOT
# revoke a running portal: it read the file at start, and Reloader ignores deletes. The
# immediate kill switch is a PR that removes the two operator flags (the operator rolls
# and the message and conversation routes disappear). Full removal is a PR that removes
# the flags, the Deployment's projection and this ExternalSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-v2-portal-actions
  namespace: dev-agents
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 1h
  target:
    name: dev-env-v2-portal-actions
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        session-actions.json: '{"send":{"issuer":"https://authentik.haynesnetwork.com/application/o/dev-env-v2-portal/","subject":"{{ .PORTAL_ACTION_SUBJECT }}","targets":[{"name":"dev-env-1028-031951","uid":"5da21936-7781-4760-82ce-2a0689b891f7"}]},"history":{"issuer":"https://authentik.haynesnetwork.com/application/o/dev-env-v2-portal/","subject":"{{ .PORTAL_ACTION_SUBJECT }}","targets":[{"name":"dev-env-1028-031951","uid":"5da21936-7781-4760-82ce-2a0689b891f7"}]}}'
  data:
    - secretKey: PORTAL_ACTION_SUBJECT
      remoteRef:
        key: dev-env
        property: PORTAL_ACTION_SUBJECT
