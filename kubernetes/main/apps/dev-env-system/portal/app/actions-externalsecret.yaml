---
# The portal's private action scope (send and history), for one pilot session only.
# Approved by Tom, 2026-10-27, Story 178: only Tom's portal principal may Send to and
# read the history of the pilot session dev-env-1027-185745. No other target, no other
# principal.
#
# The portal will read this as /etc/dev-env-portal/config/session-actions.json
# (dev-env docs/portal-session-runtime.md, "Default-off portal action source
# configuration"). The subject is Tom's Authentik user UUID for the provider
# dev-env-v2-portal-internal (Subject mode "Based on the User's UUID"). It comes from
# the new property PORTAL_ACTION_SUBJECT on the 1Password item HaynesKube/dev-env, which
# Tom writes himself. It is not committed here: this repo is public.
#
# Two stages. An earlier PR created this ExternalSecret with nothing mounting it. The
# Deployment now projects the Secret into the portal as an optional source, and the
# operator has the two target flags. The mounting PR is merged only after this
# ExternalSecret is SecretSynced, so the portal pod it rolls starts with the file
# present: the portal reads its config files once at start, and Reloader restarts it when
# a mounted Secret changes, not when one is first created.
#
# Until the property exists, this ExternalSecret does not sync and both actions stay off.
#
# Revocation. There is NO automatic expiry. Removing the 1Password property does NOT
# revoke a running portal: it read the file at start, and Reloader ignores deletes. The
# immediate kill switch is a PR that removes the two operator flags (the operator rolls
# and the message and conversation routes disappear). Full removal is a PR that removes
# the flags, the Deployment's projection and this ExternalSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-v2-portal-actions
  namespace: dev-agents
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 1h
  target:
    name: dev-env-v2-portal-actions
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        session-actions.json: '{"send":{"issuer":"https://authentik.haynesnetwork.com/application/o/dev-env-v2-portal/","subject":"{{ .PORTAL_ACTION_SUBJECT }}","targets":[{"name":"dev-env-1027-185745","uid":"54c61939-3ae4-43de-96fe-526e33bb56ad"}]},"history":{"issuer":"https://authentik.haynesnetwork.com/application/o/dev-env-v2-portal/","subject":"{{ .PORTAL_ACTION_SUBJECT }}","targets":[{"name":"dev-env-1027-185745","uid":"54c61939-3ae4-43de-96fe-526e33bb56ad"}]}}'
  data:
    - secretKey: PORTAL_ACTION_SUBJECT
      remoteRef:
        key: dev-env
        property: PORTAL_ACTION_SUBJECT
