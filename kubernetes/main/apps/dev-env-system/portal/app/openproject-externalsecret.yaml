---
# OPENPROJECT_TOKEN for the portal's Tasks page. Fast path (Tom, 2026-10-26: "fastest
# path to a working demo"): it reuses the agents' existing OpenProject API token,
# 1Password item openproject, property API_TOKEN, the same field dev/openproject-agent
# reads. The portal only sends GETs to /api/v3/projects/3/work_packages. A dedicated
# read-only account is a later hardening step.
# The Deployment mounts this Secret as optional and reads it once at start, so the pod
# needs a template change after this Secret first exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-v2-portal-openproject
  namespace: dev-agents
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 1h
  target:
    name: dev-env-v2-portal-openproject
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        OPENPROJECT_TOKEN: '{{ .OPENPROJECT_TOKEN }}'
  data:
    - secretKey: OPENPROJECT_TOKEN
      remoteRef:
        key: openproject
        property: API_TOKEN
