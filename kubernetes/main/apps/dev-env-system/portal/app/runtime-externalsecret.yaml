---
# The portal's four runtime files, from the existing 1Password item HaynesKube/dev-env.
# Four named properties and no dataFrom: nothing else on the item is projected.
# The spec is the reviewed pending runtime projection, unchanged.
# DB_USERNAME and DB_PASSWORD are the same properties the database role reads
# (database/dev-env-v2-portal-runtime-db), so the two stay equal by construction.
# No pod mounts this Secret until the Deployment step.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-v2-portal-runtime
  namespace: dev-agents
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 1h
  target:
    name: dev-env-v2-portal-runtime
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        DB_USERNAME: '{{ .DB_USERNAME }}'
        DB_PASSWORD: '{{ .DB_PASSWORD }}'
        SESSION_AEAD_KEY: '{{ .SESSION_AEAD_KEY }}'
        SESSION_GENERATION: '{{ .SESSION_GENERATION }}'
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: dev-env
        property: DB_USERNAME
    - secretKey: DB_PASSWORD
      remoteRef:
        key: dev-env
        property: DB_PASSWORD
    - secretKey: SESSION_AEAD_KEY
      remoteRef:
        key: dev-env
        property: SESSION_AEAD_KEY
    - secretKey: SESSION_GENERATION
      remoteRef:
        key: dev-env
        property: SESSION_GENERATION
