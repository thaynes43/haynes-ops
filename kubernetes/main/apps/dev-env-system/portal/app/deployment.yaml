---
# Story178 S8: the internal portal (dev-env-portal), one replica for the demo.
#
# The binary takes no flags and reads everything from /etc/dev-env-portal
# (dev-env web/portal/session/production.go, LoadProduction, after dev-env#560):
#   config/<key>        ConfigMap dev-env-v2-portal-config, one file per key
#   config/session-actions.json  optional: Secret dev-env-v2-portal-actions (Tom's private
#                       send and history scope for one pilot session; absent means both are off)
#   secrets/OIDC_*      Secret dev-env-v2-portal-oidc (dev-env-secrets owns its ExternalSecret)
#   secrets/DB_*, SESSION_*   Secret dev-env-v2-portal-runtime
#   secrets/OPENPROJECT_TOKEN optional: absent means Tasks shows "not connected"
#   secrets/OPERATOR_TOKEN    this pod's ServiceAccount token, audience dev-env-operator
#                             (optional to the binary; the operator reader accepts only it)
#   ca/ca.crt           Postgres CA          ca/issuer-ca.crt       Authentik edge roots
#   ca/openproject-ca.crt OpenProject CA     ca/operator-ca.crt     dev-env-api-ca (the operator's CA)
#   tls/tls.crt, tls/tls.key  serving leaf; ca.crt is not mounted, and the CA key Secret never is
# It reads no admission, witness or Kubernetes API input, so no API token is mounted.
#
# It loads every file once at start. Reloader restarts it when one changes. A Secret
# created after the pod starts (OPENPROJECT_TOKEN) needs a template change instead:
# Reloader does not act on a create. The same holds for dev-env-v2-portal-actions: the
# PR that mounts it is merged only after its ExternalSecret is SecretSynced, so the pod
# that PR rolls starts with the file present.
#
# dev-agents enforces Pod Security "restricted" and a Kyverno CPU limit. The S1 policy
# selects app.kubernetes.io/name and needs ClusterFirst DNS with ndots 1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-env-v2-portal
  namespace: dev-agents
  labels:
    app.kubernetes.io/name: dev-env-v2-portal
  annotations:
    configmap.reloader.stakater.com/reload: dev-env-v2-portal-config,dev-env-v2-portal-postgres-ca,dev-env-v2-portal-issuer-ca,dev-env-v2-portal-openproject-ca,dev-env-api-ca
    secret.reloader.stakater.com/reload: dev-env-v2-portal-oidc,dev-env-v2-portal-runtime,dev-env-v2-portal-actions,dev-env-v2-portal-openproject,dev-env-v2-portal-tls
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: dev-env-v2-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dev-env-v2-portal
    spec:
      # Registered by dev-env-rbac (portal-serviceaccount.yaml); not duplicated here.
      serviceAccountName: dev-env-v2-portal
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal
          # The one image line: dev-env v2.47.0 (main 7af05ef, dev-env#574), signed by publish.yml.
          image: ghcr.io/thaynes43/dev-env-portal:sha-7af05ef@sha256:9937f9a12fa10f4bb47ca89abaef00f00438d76de94c3d6f34331bf2939aed41
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          # The portal answers /healthz and /readyz only over TLS and only for its own
          # Host, so the probes send it. The dial target stays the pod IP.
          startupProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
              httpHeaders:
                - name: Host
                  value: dev-env-v2.haynesops.com
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
              httpHeaders:
                - name: Host
                  value: dev-env-v2.haynesops.com
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
              httpHeaders:
                - name: Host
                  value: dev-env-v2.haynesops.com
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/dev-env-portal/config
              readOnly: true
            - name: secrets
              mountPath: /etc/dev-env-portal/secrets
              readOnly: true
            - name: ca
              mountPath: /etc/dev-env-portal/ca
              readOnly: true
            - name: tls
              mountPath: /etc/dev-env-portal/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        # The ConfigMap, whole, plus the private action scope as config/session-actions.json.
        # That Secret is optional: until Tom writes PORTAL_ACTION_SUBJECT it does not exist,
        # the file is absent and send and history stay off (actions-externalsecret.yaml).
        # Reloader restarts the portal when the Secret changes, not when it is first created.
        # Removing the 1Password property does not revoke a running portal; the operator
        # flags are the kill switch.
        - name: config
          projected:
            sources:
              - configMap:
                  name: dev-env-v2-portal-config
              - secret:
                  name: dev-env-v2-portal-actions
                  optional: true
                  items:
                    - key: session-actions.json
                      path: session-actions.json
        - name: secrets
          projected:
            sources:
              - secret:
                  name: dev-env-v2-portal-oidc
                  items:
                    - key: OIDC_CLIENT_ID
                      path: OIDC_CLIENT_ID
                    - key: OIDC_CLIENT_SECRET
                      path: OIDC_CLIENT_SECRET
              - secret:
                  name: dev-env-v2-portal-runtime
                  items:
                    - key: DB_USERNAME
                      path: DB_USERNAME
                    - key: DB_PASSWORD
                      path: DB_PASSWORD
                    - key: SESSION_AEAD_KEY
                      path: SESSION_AEAD_KEY
                    - key: SESSION_GENERATION
                      path: SESSION_GENERATION
              - secret:
                  name: dev-env-v2-portal-openproject
                  optional: true
                  items:
                    - key: OPENPROJECT_TOKEN
                      path: OPENPROJECT_TOKEN
              - serviceAccountToken:
                  path: OPERATOR_TOKEN
                  audience: dev-env-operator
                  expirationSeconds: 3600
        - name: ca
          projected:
            sources:
              - configMap:
                  name: dev-env-v2-portal-postgres-ca
                  items:
                    - key: ca.crt
                      path: ca.crt
              - configMap:
                  name: dev-env-v2-portal-issuer-ca
                  items:
                    - key: ca.crt
                      path: issuer-ca.crt
              - configMap:
                  name: dev-env-v2-portal-openproject-ca
                  items:
                    - key: ca.crt
                      path: openproject-ca.crt
              - configMap:
                  name: dev-env-api-ca
                  items:
                    - key: ca.crt
                      path: operator-ca.crt
        - name: tls
          secret:
            secretName: dev-env-v2-portal-tls
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
