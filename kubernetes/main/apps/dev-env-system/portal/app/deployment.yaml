---
# OP280: two internal portal replicas on distinct hosts. Sessions and send
# reservations use shared Postgres and the same projected key/generation.
# Launch MUST remain disabled: its dispatch lock is process-local (dev-env
# web/portal/session/launch.go); qualify cross-replica launch before enabling it.
#
# The binary takes no flags and reads everything from /etc/dev-env-portal
# (dev-env web/portal/session/production.go, LoadProduction, after dev-env#560):
#   config/<key>        ConfigMap dev-env-v2-portal-config, one file per key
#   secrets/OIDC_*      Secret dev-env-v2-portal-oidc (dev-env-secrets owns its ExternalSecret)
#   secrets/DB_*, SESSION_*   Secret dev-env-v2-portal-runtime
#   secrets/OPENPROJECT_TOKEN optional: absent means Tasks shows "not connected"
#   secrets/OPERATOR_TOKEN    this pod's ServiceAccount token, audience dev-env-operator
#                             (optional to the binary; the operator reader accepts only it)
#   ca/ca.crt           Postgres CA          ca/issuer-ca.crt       Authentik edge roots
#   ca/openproject-ca.crt OpenProject CA     ca/operator-ca.crt     dev-env-api-ca (the operator's CA)
#   tls/tls.crt, tls/tls.key  serving leaf; ca.crt is not mounted, and the CA key Secret never is
# It reads no admission, witness or Kubernetes API input, so no API token is mounted.
#
# It loads every file once at start. Reloader restarts it when one changes. A Secret
# created after the pod starts (OPENPROJECT_TOKEN) needs a template change instead:
# Reloader does not act on a create.
#
# dev-agents enforces Pod Security "restricted" and a Kyverno CPU limit. The S1 policy
# selects app.kubernetes.io/name and needs ClusterFirst DNS with ndots 1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-env-v2-portal
  namespace: dev-agents
  labels:
    app.kubernetes.io/name: dev-env-v2-portal
  annotations:
    configmap.reloader.stakater.com/reload: dev-env-v2-portal-config,dev-env-v2-portal-postgres-ca,dev-env-v2-portal-issuer-ca,dev-env-v2-portal-openproject-ca,dev-env-api-ca
    secret.reloader.stakater.com/reload: dev-env-v2-portal-oidc,dev-env-v2-portal-runtime,dev-env-v2-portal-openproject,dev-env-v2-portal-tls,dev-env-v2-portal-allowance-trust
spec:
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: dev-env-v2-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dev-env-v2-portal
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: dev-env-v2-portal
              topologyKey: kubernetes.io/hostname
      # Registered by dev-env-rbac (portal-serviceaccount.yaml); not duplicated here.
      serviceAccountName: dev-env-v2-portal
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal
          # Source dev-env#1018 25b77247cdacb77a631d701b8bfab3364eea9355 (OP509); publish run 42740968309 signed and verified this exact digest.
          # Adds the built-in display rule for session allowance readings (DESIGN-059); it shows nothing new until the operator serves them.
          # Rollback target: sha-8daf137@sha256:b09c06a1100c24a7b07311db7f0abe066ea843b2ba0e406a232b8c6e9188e4f2.
          # Optional selected-source and question readers stay unconfigured; no config, route flags or access change.
          image: ghcr.io/thaynes43/dev-env-portal:sha-25b7724@sha256:18ed5a921b41737a3dd821d998b2e8a6ed3fde83bc69f4b8433b5dc8836d05b4
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          # The portal answers /healthz and /readyz only over TLS and only for its own
          # Host, so the probes send it. The dial target stays the pod IP.
          startupProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
              httpHeaders:
                - name: Host
                  value: dev-env-v2.haynesops.com
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
              httpHeaders:
                - name: Host
                  value: dev-env-v2.haynesops.com
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
              httpHeaders:
                - name: Host
                  value: dev-env-v2.haynesops.com
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/dev-env-portal/config
              readOnly: true
            - name: secrets
              mountPath: /etc/dev-env-portal/secrets
              readOnly: true
            - name: ca
              mountPath: /etc/dev-env-portal/ca
              readOnly: true
            - name: tls
              mountPath: /etc/dev-env-portal/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          projected:
            defaultMode: 288 # 0440; read-only existing mount, no subPath.
            sources:
              - configMap:
                  name: dev-env-v2-portal-config
                  items:
                    - key: origin
                      path: origin
                    - key: issuer
                      path: issuer
                    - key: authorization-url
                      path: authorization-url
                    - key: token-url
                      path: token-url
                    - key: userinfo-url
                      path: userinfo-url
                    - key: jwks-url
                      path: jwks-url
                    - key: openproject-base-url
                      path: openproject-base-url
                    - key: operator-api-url
                      path: operator-api-url
                    - key: auth-style
                      path: auth-style
                    - key: login-ttl
                      path: login-ttl
                    - key: idle-ttl
                      path: idle-ttl
                    - key: absolute-ttl
                      path: absolute-ttl
                    - key: fresh-for
                      path: fresh-for
                    - key: clock-skew
                      path: clock-skew
                    - key: pages-alertmanager.json
                      path: pages-alertmanager.json
                    - key: session-actions.json
                      path: session-actions.json
                    - key: asks.json
                      path: asks.json
              - secret:
                  name: dev-env-v2-portal-allowance-trust
                  items:
                    - key: provider-allowances.json
                      path: provider-allowances.json
        - name: secrets
          projected:
            sources:
              - secret:
                  name: dev-env-v2-portal-oidc
                  items:
                    - key: OIDC_CLIENT_ID
                      path: OIDC_CLIENT_ID
                    - key: OIDC_CLIENT_SECRET
                      path: OIDC_CLIENT_SECRET
              - secret:
                  name: dev-env-v2-portal-runtime
                  items:
                    - key: DB_USERNAME
                      path: DB_USERNAME
                    - key: DB_PASSWORD
                      path: DB_PASSWORD
                    - key: SESSION_AEAD_KEY
                      path: SESSION_AEAD_KEY
                    - key: SESSION_GENERATION
                      path: SESSION_GENERATION
              - secret:
                  name: dev-env-v2-portal-openproject
                  optional: true
                  items:
                    - key: OPENPROJECT_TOKEN
                      path: OPENPROJECT_TOKEN
              - serviceAccountToken:
                  path: OPERATOR_TOKEN
                  audience: dev-env-operator
                  expirationSeconds: 3600
        - name: ca
          projected:
            sources:
              - configMap:
                  name: dev-env-v2-portal-postgres-ca
                  items:
                    - key: ca.crt
                      path: ca.crt
              - configMap:
                  name: dev-env-v2-portal-issuer-ca
                  items:
                    - key: ca.crt
                      path: issuer-ca.crt
              - configMap:
                  name: dev-env-v2-portal-openproject-ca
                  items:
                    - key: ca.crt
                      path: openproject-ca.crt
              - configMap:
                  name: dev-env-api-ca
                  items:
                    - key: ca.crt
                      path: operator-ca.crt
        - name: tls
          secret:
            secretName: dev-env-v2-portal-tls
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
