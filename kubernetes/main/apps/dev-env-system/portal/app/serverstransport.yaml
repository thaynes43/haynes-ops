---
# Traefik's TLS check of the portal backend. It overrides the shared
# serversTransport.insecureSkipVerify=true for this backend only, once a route names it.
#
# Why dev-agents: Traefik v3.7.16 resolves an unqualified serversTransport name in
# the namespace of the Service it routes to (dev-agents), and reads the CA Secret
# from this object's own namespace. The future route can stay in dev for the
# reflected certificate.
#
# Why rootCAsSecrets: the installed ServersTransport CRD (controller-gen v0.16.1)
# has no rootCAs field, so the API server would drop a rootCAs list and Traefik
# would check against the system roots. v3.7.16 still reads rootCAsSecrets (it logs
# that the option is deprecated).
#
# Why the serving Secret: cert-manager writes the issuing CA (dev-env-v2-portal-ca)
# into ca.crt of dev-env-v2-portal-tls with every leaf, so the trusted CA and the
# leaf always change together. Traefik reads only its ca.crt key. The packet named
# a Secret dev-env-v2-portal-serving-ca that nothing creates.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: dev-env-v2-portal
  namespace: dev-agents
spec:
  serverName: dev-env-v2-portal.dev-agents.svc.cluster.local
  insecureSkipVerify: false
  rootCAsSecrets:
    - dev-env-v2-portal-tls
  maxIdleConnsPerHost: 2
  forwardingTimeouts:
    dialTimeout: 5s
    responseHeaderTimeout: 10s
    idleConnTimeout: 30s
