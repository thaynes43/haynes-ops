---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Story178 portal, steps S4, S6, S8 and S9: serving certificates, the Service,
# Traefik's backend TLS check, the non-secret config, three public CA bundles, the
# runtime ExternalSecret, the portal Deployment and its internal-only IngressRoute.
# No admission object. Nothing depends on this Kustomization, so a failed portal
# cannot hold back another app. wait covers the Deployment through kstatus: the
# Kustomization is Ready only once the portal pod is Ready.
#
# No targetNamespace: every object names its own namespace (dev-agents, and dev for
# the IngressRoute).
# It waits for the portal policy (S1), and for the cert-manager and 1Password stores
# that its Certificates and ExternalSecret need (the dev-env-pki and dev-env-secrets
# pattern).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-env-v2-portal
  namespace: dev-env-system
spec:
  dependsOn:
    - name: dev-env-v2-portal-policy
      namespace: dev-env-system
    - name: cert-manager
      namespace: cert-manager
    - name: external-secrets-stores
      namespace: external-secrets
  path: ./kubernetes/main/apps/dev-env-system/portal/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  wait: true
  # kstatus alone reads only observedGeneration and Reconciling/Stalled, which these
  # kinds do not set, so without these a Certificate that never issues or an
  # ExternalSecret that never syncs would still count as healthy. With them, the
  # Kustomization is Ready only when both are Ready, and fails after the timeout.
  healthCheckExprs:
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  interval: 30m
  retryInterval: 1m
  timeout: 5m
