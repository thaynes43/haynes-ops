# The one MCP bearer. Vault HaynesKube, the existing item dev-env, a new field
# FRONTDOOR_MCP_TOKEN (Tom, 2026-11-10: "I'll put it under dev-env if that works"):
# a random token of at least 32 bytes. The field does not exist until he adds it.
# The process reads the file on every request and trims surrounding space.
# A missing field fails this ExternalSecret and, under wait, this Kustomization.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-frontdoor-token
  namespace: dev-env-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-frontdoor-token
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: token
      remoteRef:
        key: dev-env
        property: FRONTDOOR_MCP_TOKEN
