# The one MCP bearer. The item does not exist yet. Vault HaynesKube, item
# dev-env-frontdoor, field MCP_TOKEN: a random token of at least 32 bytes.
# The process reads the file on every request and trims surrounding space.
# A missing field fails this ExternalSecret and, under wait, this Kustomization.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-frontdoor-token
  namespace: dev-env-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-frontdoor-token
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: token
      remoteRef:
        key: dev-env-frontdoor
        property: MCP_TOKEN
