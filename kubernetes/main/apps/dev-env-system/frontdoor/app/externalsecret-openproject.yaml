# The tracker credential opwork already uses. Session pods do not mount it.
# With OPWORK_TOKEN_FILE unset, agent-api.py reads it by exec into
# dev/openproject-agent-credentials, which mounts Secret openproject-agent.
# That ExternalSecret is HaynesKube item openproject, field API_TOKEN
# (apps/dev/openproject-agent/app/openproject-agent-credentials.yaml). The
# portal's ExternalSecret reads the same item and field. This is that item,
# not a new one. A pod in this namespace cannot mount the Secret in dev.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-frontdoor-openproject
  namespace: dev-env-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-frontdoor-openproject
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: token
      remoteRef:
        key: openproject
        property: API_TOKEN
