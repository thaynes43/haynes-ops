# Meatball's caller (DESIGN-060 section 6). The process never calls the
# Kubernetes API, so this account has no Role and no RoleBinding. The pod
# mounts one projected token for the operator API and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-env-meatball
  namespace: dev-env-system
automountServiceAccountToken: false
