---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# The operator binary's broker mode (DESIGN-001 3.1, 6.12; plan 07 H2).
# The broker reads grants from the API server and elects its own leader. Its upgrade
# leaves session pods alone; dev-env-rbac owns its ServiceAccount and RBAC.
# The approval page and Pushover arrive with plan 07 step 6.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dev-env-broker
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      dev-env-broker:
        replicas: 2
        strategy: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
        serviceAccount:
          name: dev-env-broker
        podDisruptionBudget:
          minAvailable: 1
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              matchLabelKeys:
                - pod-template-hash
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: *app
        containers:
          app:
            image:
              repository: ghcr.io/thaynes43/dev-env-operator
              # Source fd89b72e6eac3eaca8868406031358a29c1d0514 (v2.52.0, release #592); publish.yml run 40616512876 signed and verified keyless (Sign the image, Verify the signature: success); digest re-checked on ghcr by tag.
              # v2.52.0 brings attested grants (D-88) and hw-ssh credential grants (D-89), both default off: this pin sets neither --enable-attested-grants nor --enable-hw-ssh-grants.
              # Was thaynes43/dev-env main eeb15e3, signed/verified keyless
              # by publish.yml on main (run 37798469467).
              tag: sha-fd89b72@sha256:053d1905ecc6fb18c9a00189c50f1961949389264eaddd29b4e20c743eb8f5b3
              pullPolicy: IfNotPresent
            args:
              - broker
              - --session-namespace=dev-agents
              - --policy-namespace=dev-env-system
              - --leader-elect=true
              # Credential grants for `proxmox` (the keeper mints it; D-69/D-72). Enabled for the
              # workbench profile by Tom's ruling Q-110-08 via the standing
              # policy credential-proxmox; no policy matches any other profile. The keeper
              # flag is set in the same change.
              - --enable-proxmox-grants=true
              # No metrics Service until the console/monitoring deployment follows.
              - --metrics-bind-address=0
              - --health-probe-bind-address=:8081
            env:
              POD_NAMESPACE:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8081
                  periodSeconds: 20
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 8081
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
    defaultPodOptions:
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Mi
        globalMounts:
          - path: /tmp
