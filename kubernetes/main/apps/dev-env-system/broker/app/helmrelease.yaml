---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# The operator binary's broker mode (DESIGN-001 3.1, 6.12; plan 07 H2).
# The broker reads grants from the API server and elects its own leader. Its upgrade
# leaves session pods alone; dev-env-rbac owns its ServiceAccount and RBAC.
# The approval page and Pushover arrive with plan 07 step 6.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dev-env-broker
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      dev-env-broker:
        replicas: 0
        strategy: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
        serviceAccount:
          name: dev-env-broker
        podDisruptionBudget:
          # Keep zero as a percentage: the chart omits a numeric zero as false.
          minAvailable: "0%"
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              matchLabelKeys:
                - pod-template-hash
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: *app
        containers:
          app:
            image:
              repository: ghcr.io/thaynes43/dev-env-operator
              # Plan 07 kube installation and egress enforcement, signed/verified
              # by dev-env publish.yml on main (run 37699861688).
              tag: sha-763fe77@sha256:3063e5c4fb82641a3b8c3e6d1ba2d4968dd65e48d78acaf60f93e79796c5b91b
              pullPolicy: IfNotPresent
            args:
              - broker
              - --session-namespace=dev-agents
              - --policy-namespace=dev-env-system
              - --leader-elect=true
              # No metrics Service until the console/monitoring deployment follows.
              - --metrics-bind-address=0
              - --health-probe-bind-address=:8081
            env:
              POD_NAMESPACE:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8081
                  periodSeconds: 20
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 8081
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
    defaultPodOptions:
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Mi
        globalMounts:
          - path: /tmp
