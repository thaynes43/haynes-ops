---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# The operator binary's broker mode (DESIGN-001 3.1, 6.12; plan 07 H2).
# The broker reads grants from the API server and elects its own leader. Its upgrade
# leaves session pods alone; dev-env-rbac owns its ServiceAccount and RBAC.
# The approval page and Pushover arrive with plan 07 step 6.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dev-env-broker
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      dev-env-broker:
        replicas: 2
        strategy: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
        serviceAccount:
          name: dev-env-broker
        podDisruptionBudget:
          minAvailable: 1
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              matchLabelKeys:
                - pod-template-hash
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: *app
        containers:
          app:
            image:
              repository: ghcr.io/thaynes43/dev-env-operator
              # Source fd89b72e6eac3eaca8868406031358a29c1d0514 (v2.52.0, release #592); publish.yml run 40616512876 signed and verified keyless (Sign the image, Verify the signature: success); digest re-checked on ghcr by tag.
              # v2.52.0 brings attested grants (D-88) and hw-ssh credential grants (D-89), both default off: this pin sets neither --enable-attested-grants nor --enable-hw-ssh-grants.
              # Was thaynes43/dev-env main eeb15e3, signed/verified keyless
              # by publish.yml on main (run 37798469467).
              # Source dev-env#739 merge 386317b84e97817c511cc54ac9a75470f6538840; publish run 41129212774.
              # Operator job 124315516957 signed at 21:15:23Z and verified keyless at 21:15:24Z on 2026-10-30.
              # PROPOSED RD2 source bfd5143; publish41253643759 and local cosign verified; activation HELD.
              # Claim metadata source dev-env#815, merge 79085ea; publish41294218791 signed and verified this digest.
              # Schema4573 is installed first; operator follows before any taskClaim producer use. Arguments and permissions are unchanged.
              # dev-env main 4f3ef3d9 (release 2.111.0 plus workflow-only #1205 and broker #1208);
              # publish 44363676517, operator job 135011558410, signed and verified this digest.
              # CI - Success at the same source is green (OP920).
              # What changes in broker mode since the 2026-11-01 pin sha-79085ea:
              # - dev-env#991 bounds every grant Event note to 1024 bytes at a UTF-8 boundary.
              #   Existing grant clients can see the bounded note; token construction is unchanged.
              # - dev-env#1037/#1041 add the grant Ask kind, immutable scope validation, one stored
              #   Ask route, answer rechecks, terminal cleanup and bounded exponential cleanup retry.
              #   --enable-grant-asks stays unset, so no new Ask is opened or watched and an
              #   unrouted grant still times out at 30 minutes; a stored route still governs its
              #   decisions and cleanup even with the flag off, with unreadable routes closed.
              #   Existing policy selection now takes one live list, and approvals and Decide
              #   re-read the grant and write with preconditions even while new grant Asks are off.
              # - dev-env#1088/#1172 (OP802) end a reaped, closed, terminal summoned requester's
              #   grants while its Session is retained for filing, for name and UID-bound requests.
              #   A Session change wakes its grants; end revokes before storing Released or Denied.
              #   Ordinary requesters do not take this new path, and no session pod or PVC is deleted.
              # - dev-env#1208 (OP918) fixes the review's L1: with grant Asks off and no stored
              #   route, terminal denial/release cleanup performs no Ask read or cleanup retry.
              #   Stored routes keep cleanup; enabled grant Asks keep their bounded retry.
              # - Runtime dependencies move oauth2 0.37.0 to 0.38.0, x/sys 0.49.0 to 0.50.0,
              #   controller-runtime 0.25.2 to 0.25.3 and x/net 0.62.0 to 0.63.0 (#1024/#1025/#1190/#1201).
              #   These affect transport, OS, manager/client and leader election in the broker;
              #   existing agentd grant install/remove commands and token/expiry bytes are unchanged.
              # Raise slice (a) code is carried in the shared image but does not run in broker mode;
              # raise stays off, the keeper stays on sha-1ae9c7c and no keeper key is initialized.
              # Later grant Ask activation needs broker Ask CRUD/status RBAC and admission allowing
              # its origin; later keeper overflow paging needs named get on dev-env-summon-creates.
              # This pin needs neither activation prerequisite, and enables neither feature.
              # CRD bodies match 4f3ef3d9 except the held GrantPolicy difference (OP503); no copy.
              # No flag, permission, template, ConfigMap or Secret change; running sessions keep
              # their pods and existing clients keep the grant install/remove protocol.
              # Previous pin sha-79085ea@sha256:9ca4670835520b5749d229ee8f247e0e05776a9ace290ad9430d2b7afe85376d
              # (haynes-ops#4574); rollback target for the broker alone, with all current args.
              # Rollback leaves grant/Ask records behind; an old broker ignores status.ask and can
              # choose an independent policy/delegate path after activation, so review routes first.
              tag: sha-b113a50@sha256:ba57ece69d3b7f190e1b1b5d8061e0d6bf8730dd6efbd8d4ca95a808b0cd9050
              pullPolicy: IfNotPresent
            args:
              - broker
              - --session-namespace=dev-agents
              - --policy-namespace=dev-env-system
              - --leader-elect=true
              # Credential grants for `proxmox` (the keeper mints it; D-69/D-72). Enabled for the
              # workbench profile by Tom's ruling Q-110-08 via the standing
              # policy credential-proxmox; no policy matches any other profile. The keeper
              # flag is set in the same change.
              - --enable-proxmox-grants=true
              # Agent attestation (D-88, dev-env#586): a GrantPolicy with spec.attested approves
              # only a request whose requesting session recorded its claim that the user or a
              # coordinator approved it. The agent's claim, not verified human identity. Inert
              # until an attested policy exists (see grant-policies).
              - --enable-attested-grants=true
              # hw-ssh credential grants (D-89, dev-env#590): the keeper leases the ONE shared
              # hw-ssh key into the session pod. Anything in the pod can copy it while installed;
              # removal is neither containment nor revocation (no cryptographic expiry). Needs the
              # keeper flag and the dev-env-hw-ssh-secret get rule (rbac keeper-credentials). Tom's
              # action-specific approval 2026-10-28T01:37:41Z.
              - --enable-hw-ssh-grants=true
              - --enable-maintenance-grants=true
              - --maintenance-human-service-account=dev-env-system/dev-env-human
              # No metrics Service until the console/monitoring deployment follows.
              - --metrics-bind-address=0
              - --health-probe-bind-address=:8081
              - --grant-delegates=dev-agents/dev-env-agent
              - --grant-policy-delegates=dev-agents/dev-env-agent
              - --grant-legacy-delegates=dev-agents/dev-env-agent:5d30e3de-96a5-421c-8919-90459b1cb298:dev-env-1029-132039:ea234e80-f991-4e47-90e6-bc1a23f97ca7:dev-env-1029-132039:db36f5d3-6d3c-46a6-830e-67c196253a96
              - --reserved-decision-classes=rd2
              - --enable-admin-leases=true
              - --admin-issuer-namespace=dev-env-admin-issuance
            env:
              POD_NAMESPACE:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8081
                  periodSeconds: 20
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 8081
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
    defaultPodOptions:
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Mi
        globalMounts:
          - path: /tmp
