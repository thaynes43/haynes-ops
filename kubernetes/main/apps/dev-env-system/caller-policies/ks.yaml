---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# CallerPolicy objects for the summoning callers in upgrade-agent (dev-env DESIGN-064
# 6.4 and 6.5, OpenProject #739): one per ServiceAccount, named <namespace>.<name>.
# The operator API reads exactly that object, uncached, each time the account calls.
# A missing or deleted policy refuses its caller on that caller's next request; a
# request already admitted is not cancelled. Meatball's policy stays in the frontdoor
# app, beside its caller.
#
# Creates are off. The operator refuses a create from a summoning caller while its
# flag --summon-create-kinds (dev-env story 770; empty by default) does not name the
# entry's kind; reads of the caller's own sessions still work. A later haynes-ops PR
# switches a kind on: task not before story 741 is installed; remote not before
# stories 741 and 745 are installed and the pinned agent image accepts a summoned
# remote session. A create that sends any data member is refused (no entry has
# brief.fields); an empty data is accepted. A task entry's brief is delivered to the
# session; a remote entry's brief is stored and is not delivered until story 745.
#
# Why its own app, in dev-env-system: a CallerPolicy must live in dev-env-system,
# and the callers' own Kustomizations set targetNamespace: upgrade-agent. The
# grant-policies app is the pattern: policy objects in their own Kustomization that
# depends on the CRDs. Flux applies them from git; no caller can write here (callers
# have no RBAC in dev-env-system, and dev-env-identity-guard refuses session writes).
#
# dependsOn, and why each one:
# - dev-env-crds: the CallerPolicy CRD, with spec.summon, has to exist first.
# - dev-env-rbac: Role dev-env-operator-caller-policy names these objects, so the
#   operator can Get each one the moment it exists.
#
# Not a dependsOn: the operator Deployment. Flux Ready does not prove its image. This
# Kustomization is applied only when both operator replicas run an operator that has
# --summon-create-kinds, with the flag unset (coordinator ruling, haynes-ops PR 4850
# comment 6816662070); the coordinator checks both running pods' images and the
# HelmRelease's flags before merge.
#
# Nothing depends on this Kustomization. A failed apply leaves a policy that was not
# yet applied missing, so its caller is refused (403); a policy applied earlier stays
# in force. The API checks each caller's own policy at each request, not this
# Kustomization's Ready condition.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app dev-env-caller-policies
  namespace: dev-env-system
spec:
  targetNamespace: dev-env-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: dev-env-crds
    - name: dev-env-rbac
  path: ./kubernetes/main/apps/dev-env-system/caller-policies/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
