---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# CallerPolicy objects for the summoning callers in upgrade-agent (dev-env DESIGN-064
# 6.4 and 6.5, OpenProject #739): one per ServiceAccount, named <namespace>.<name>.
# The operator API reads exactly that object, uncached, each time the account calls.
# Deleting one revokes that caller at once. Meatball's policy stays in the frontdoor
# app, beside its caller.
#
# Why its own app, in dev-env-system: a CallerPolicy must live in dev-env-system,
# and the callers' own Kustomizations set targetNamespace: upgrade-agent. The
# grant-policies app is the pattern: policy objects in their own Kustomization that
# depends on the CRDs. Flux applies them from git; no caller can write here (callers
# have no RBAC in dev-env-system, and dev-env-identity-guard refuses session writes).
#
# dependsOn, and why each one:
# - dev-env-crds: the CallerPolicy CRD, with spec.summon, has to exist first.
# - dev-env-rbac: Role dev-env-operator-caller-policy names these objects, so the
#   operator can Get each one the moment it exists.
#
# Not a dependsOn: the operator Deployment. Flux Ready does not prove its image. A
# summoning policy is applied only when both operator replicas run dev-env ac1bbb58 or
# later (the summon ledger); the coordinator checks the running images before merge.
#
# Nothing depends on this Kustomization. A failed apply leaves the callers refused
# (403) and changes nothing else.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app dev-env-caller-policies
  namespace: dev-env-system
spec:
  targetNamespace: dev-env-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: dev-env-crds
    - name: dev-env-rbac
  path: ./kubernetes/main/apps/dev-env-system/caller-policies/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
