---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The keeper's notices go to the dedicated "dev-env" Pushover application (dev-env plan 13,
# story 13.1), sent by the keeper itself, not through Alertmanager. The application token is
# the field DEV_ENV_PUSHOVER_TOKEN Tom added to the existing 1Password item `dev-env`; the
# user key is the one the upgrade agents already use (item `upgrade-gate`). Both are read by
# property, so the new field reaches only this ExternalSecret.
#
# Only the keeper's `app` container mounts this Secret, at /etc/dev-env-keeper/pushover
# (token and user are the files its flags default to). The mount is optional, so a missing
# field can never keep the credential keeper from starting: it logs "notifier disabled" and
# the gauges still work. Keep this in the keeper app so a failed delivery affects only its
# reconciliation (as for the SSH CA).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-keeper-pushover
  namespace: dev-env-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-keeper-pushover
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: dev-env
        property: DEV_ENV_PUSHOVER_TOKEN
    - secretKey: user
      remoteRef:
        key: upgrade-gate
        property: PUSHOVER_USER_KEY
