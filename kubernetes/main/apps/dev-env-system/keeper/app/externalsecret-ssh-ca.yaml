---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Keeper-only CA projection (dev-env D-69/D-72). The owner already saved these two
# fields in existing HaynesKube/dev-env; this mapping never adds them to v1 or session
# Secrets. Decode the private file exactly once and preserve the public line.
# The keeper reads private-key/public-key from /etc/dev-env-keeper/ssh-ca. Projection
# alone does not validate the key pair, install node trust or enable Proxmox grants.
# Keep this in the keeper app so failed delivery affects only its reconciliation.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-keeper-ssh-ca
  namespace: dev-env-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-keeper-ssh-ca
    creationPolicy: Owner
  data:
    - secretKey: private-key
      remoteRef:
        key: dev-env
        property: SSH_CA_PRIVATE_KEY_B64
        decodingStrategy: Base64
    - secretKey: public-key
      remoteRef:
        key: dev-env
        property: SSH_CA_PUBLIC_KEY
        decodingStrategy: None
