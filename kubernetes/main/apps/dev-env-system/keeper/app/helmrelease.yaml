---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# dev-env-keeper (DESIGN-001 3.1, D-38, D-52; KICKOFF 8.9): the one holder of rotating
# credentials. Plan 01's keeper mints the haynes-dev-bot installation token every 40
# minutes (or at two thirds of its life) and merges it into dev-agents/dev-env-gh-token,
# which session pods mount at /creds. Since dev-env DESIGN-064 6.2 (OpenProject 736) it
# also mints the haynes-ops-bot installation token, on the same schedule, into
# dev-agents/dev-env-ops-gh-token, which only profile `ops` mounts at /creds.
#
# ONE OWNER PER CREDENTIAL: one replica, Recreate, and the Lease
# dev-env-keeper.dev-env.haynesops.com in this namespace. Never raise replicas or switch
# to RollingUpdate: two keepers refreshing one Max login or Codex auth.json (plans 03, 04)
# revoke the whole token family.
#
# The keeper is a second binary in the operator image (D-38), pinned independently for
# bounded keeper-only rollouts. Tokens it wrote stay valid for their hour, and a
# new keeper mints at once (5.1: an outage under 20 minutes is invisible).
#
# The ServiceAccount and its Roles come from dev-env-rbac (8.4), the App Secret and the
# empty dev-env-gh-token from dev-env-secrets (8.8).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dev-env-keeper
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    # One attempt, then one rollback, then stop (OpenProject 736, review of haynes-ops#4835).
    # The keeper is one replica with strategy Recreate and it holds the rotating logins, so
    # every Helm attempt and every rollback replaces its pod. With `retries: 3`, a release
    # that could not become ready meant four attempts and four rollbacks: up to eight
    # replacements. Now a failed upgrade is rolled back once: two replacements in all. The
    # old keeper then serves and the release stays stalled. It does not retry on its
    # interval or on an unrelated commit. It retries when this release's values or chart
    # change, or on `flux reconcile helmrelease dev-env-keeper -n dev-env-system --reset`
    # (or `--force`); a plain reconcile does neither. This bounds Helm's own remediation,
    # not crashes, controller errors or time. `install.remediation` is unchanged.
    remediation:
      retries: 0
      remediateLastFailure: true
  uninstall:
    keepHistory: false
  values:
    global:
      # The ServiceAccount is dev-env-rbac's (8.4).
      createDefaultServiceAccount: false
    controllers:
      dev-env-keeper:
        replicas: 1
        strategy: Recreate
        serviceAccount:
          name: dev-env-keeper
        containers:
          app:
            image:
              repository: ghcr.io/thaynes43/dev-env-operator
              # Source 1ae9c7ca2c0595157ab93bab74ff8640b3896ad7 (dev-env#1078: a second App token loop for the ops bot, DESIGN-064 6.2, OpenProject 736); publish.yml run 43120605930 signed and verified keyless (Sign the image, Verify the signature: success); digest re-checked on ghcr by tag.
              # Keeper-path changes since 3a46b8a: in internal/keeper and cmd/dev-env-keeper, #1078 only (and one test-only commit, #1015). In packages the keeper imports: internal/reminders (#917: a Reminder with spec.projection never pages and is ended at its retention end; the keeper wires no calendar adapter, so it makes no remote calendar call for it; no Reminder had spec.projection when this pin was written) and internal/asks with internal/apiserver/apiv1's Ask validation and state (#1037, #1041: the grant Ask kind; the Ask notifier calls that code and can now recognize an open grant Ask; the broker's current configuration, without --enable-grant-asks, creates none, which does not prove none exists). Also linked, on no path the keeper calls: the other additive API and wire types (api/v1alpha1, api/coordination/v1alpha1, the rest of internal/apiserver/apiv1, internal/agentd/protocol) and golang.org/x/oauth2 0.38.0 and golang.org/x/sys 0.50.0 (reviews: haynes-ops#4835 comments 6810258590 and 6810521550). The shared GitHub input checks and the grant log of #1078 also apply to the dev bot's mints. Flags added below: the ops token loop.
              # Rollback: tag sha-3a46b8a@sha256:7a19d78c1c6ff5bd736f7c793ea7f66fe21277e86d2d79fa5317af9fce8ae203 (publish.yml run 41897753199) AND remove the two ops flags below: an older keeper does not know them and would not start. The github-ops-bot mount may stay, but it then still needs its Secret to exist. Keep the upgrade.remediation stanza above when rolling back by hand: a plain revert of the PR that set this pin would also restore `retries: 3`. A rollback restarts the keeper, so it follows the same timing rule as the upgrade (clear of a Claude or Codex refresh). It does not clear an ops token already minted: that token stays usable until its expiry, at most an hour, and ops sessions lose GitHub access after it.
              # Was source 3a46b8a0e5a797ec9e16567b28d4fe38df8ef24c (dev-env#885: attempt-fenced Claude refresh, durable unsent-attempt marker in the existing journal Secret, third lease fence; no new RBAC); publish.yml run 41897753199 signed and verified keyless (Sign the image, Verify the signature: success).
              # Keeper-path changes since 4deca6e: #885; #898 (internal/reminders shared schedule, used by the live reminder scheduler); #687 (ask notifications, default off: the keeper's --enable-ask-notifications was NOT set by this pin). No keeper flag changes. The flag is set below since OpenProject #264, with the pin unchanged.
              # Rollback: tag sha-4deca6e@sha256:b478e768681294b3090e84c39982960f414a08a93b45f93a11c72c4175a17386 (v2.53.0, publish.yml run 40638019892).
              # Was source 4deca6e615beab468920bdd2b24b4ca299ab8464 (v2.53.0, release dev-env#601); publish.yml run 40638019892 signed and verified keyless (Sign the image, Verify the signature: success); digest re-checked on ghcr by tag.
              # v2.53.0 records each keeper page before it is sent (DESIGN-031, dev-env#599) under pages.json in the existing ConfigMap dev-env-keeper-notices (Role dev-env-keeper-notices: get, update, patch); keeper pages only, not all Pushover history. It also ships the reminder scheduler (dev-env#600), default off: --enable-reminders is NOT set by this pin; turning it on needs its own CRD, Role and flag change and Tom's approval. Keeper-only rollout, Tom-approved 2026-10-28T11:11:38Z: the broker, operator and portal pins, both helper pins below (dev-env-codex-login sha-617ed15, claude-login dev-env:2.39.1) and the agent templates stay where they are.
              # Rollback: tag sha-fd89b72@sha256:053d1905ecc6fb18c9a00189c50f1961949389264eaddd29b4e20c743eb8f5b3 (v2.52.0, publish.yml run 40616512876).
              # Was source fd89b72e6eac3eaca8868406031358a29c1d0514 (v2.52.0, release #592).
              # v2.52.0 added the default-off hw-ssh lease (D-89, dev-env#590); its pin did not set --enable-hw-ssh-grants, which #4366 set below with the Secret-get rule. Only this operator-image container moves: the dev-env-codex-login helper image below keeps sha-617ed15 (it is the login-only helper and v2.52.0 changes nothing in it), and the agent image keeps its pin.
              # Keeper binary with the Claude login worker and adoption socket (dev-env#452, #455).
              # Was source 617ed15fa850d8fff49a9d2c45fa11e4411cd077 (v2.39.1);
              # publish.yml run 39706772225 signed/verified. 2.39.1 makes a bad notice flag disable notices instead of stopping the keeper (dev-env#505). Was v2.39.0 (0c22cc0, run 39466593953), v2.38.3 (8f7311c, run 39391960144), v2.38.2 (2875abe, run 39387698019), v2.38.1 (fdf2542, run 39382009894), v2.38.0 (702a57f, run 39374328506). 2.38.0 adds the keeper control status
              # expiry times and SIGHUP cancel that the keeper-login routes need (dev-env#475):
              # this container, claude-login and codex-login moved together with the operator
              # up to v2.39.1. As of v2.52.0 only this keeper app container moves: the helper
              # protocols (the codex-login and claude-login control sockets) are unchanged since
              # 617ed15 (verified), so the helper images keep their pins.
              # Previously source 585692bbe730b0c7d435496d304cffb2276a0d6f (v2.34.0), run 39302323514.
              # The broker pin is separate and unchanged.
              tag: sha-1ae9c7c@sha256:89f151a003dfdfb1517298c2c2fa8c4ab62e03d73e76fca635e37e630674def3
              pullPolicy: IfNotPresent
            # The image's entrypoint is the operator.
            command:
              - /usr/local/bin/dev-env-keeper
            # Bounded keeper-only fresh-login and immediate-renewal acceptance.
            args:
              - --enable-codex-auth=true
              # The shared Claude login (plan 03, Q-11): the keeper keeps it fresh and publishes
              # the access-only projection. Journal dev-env-system/dev-env-keeper-claude-auth,
              # projection dev-agents/dev-env-claude-live, staging /run/dev-env-claude-login/private
              # are the defaults.
              - --enable-claude-auth=true
              # Proxmox credential grants (D-69/D-72), enabled for profile workbench by Tom's
              # ruling Q-110-08. Prerequisites, all in git: node trust installed
              # and CA pair validated (2026-10-09), pinned targets and host keys mounted at the
              # default /etc/dev-env-keeper/ssh (ConfigMap dev-env-keeper-ssh-trust), keeper
              # :22 egress to the five nodes (network/app/keeper.yaml). The broker flag is set
              # in the same change. readyz reports proxmox-trust, so a bad trust file shows as
              # NotReady rather than a failed mint.
              - --enable-proxmox-grants=true
              # hw-ssh credential grants (D-89, dev-env#590): lease the ONE shared hw-ssh key
              # into the requesting pod. Reads Secret dev-agents/dev-env-hw-ssh-secret by name
              # (rbac keeper-credentials, get only). Anything in the pod can copy the key while
              # installed; removal is neither containment nor revocation. The broker flag is set
              # in the same change. Tom's action-specific approval 2026-10-28T01:37:41Z.
              - --enable-hw-ssh-grants=true
              - --hw-ssh-key-secret=dev-env-hw-ssh-secret
              # Provider-neutral reminders (DESIGN-032, dev-env#600; OpenProject #396): the
              # leader-only scheduler delivers due Reminder objects to the one default Pushover
              # destination with the existing dev-env-keeper-pushover files. No new credential or
              # egress. Calendar targets are recorded as skipped (no adapter). Role
              # dev-env-keeper-reminders (rbac/app/reminders.yaml), CRD crds/app/reminders.yaml.
              - --enable-reminders=true
              # Asks board pushes (dev-env DESIGN-034 section 9, docs/asks.md "Keeper notifications";
              # Epic #254, activation story #264; source dev-env 8e30c74a #687, which this pin
              # contains). Every 30 seconds the leader lists the Asks in dev-agents (uncached, Role
              # dev-env-keeper-asks, get and list only) and sends one push for a requester's pending
              # open Asks: title and body "An agent needs your answer", priority 0, a link to
              # https://dev-env-v2.haynesops.com/portal/projects/dev-env/environments/internal/asks?ask=<id>,
              # and no question, person, token or approval. Caps: one push per requester per five
              # minutes, six per hour. Same Pushover files and endpoint as the login notices and
              # reminders above (dev-env-keeper-pushover); no new credential, egress or Secret.
              # Dedupe, rate and content-free page records go in the precreated ConfigMap
              # dev-env-keeper-ask-notifications (rbac/app/keeper-ask-notifications.yaml, get and
              # update by name only), never in dev-env-keeper-notices.
              # Window: Tom, 2026-11-10, Q-255-02 (OpenProject #264, journal 6225): "7AM to midnight
              # is fine". Start inclusive, end exclusive, America/New_York with its DST: pushes go
              # from 07:00 to 23:59; one that comes due outside waits for 07:00, and the Ask stays
              # open on the board meanwhile. Agents cannot override it. Login notices keep their
              # own window. A bad value here logs one fixed line and turns off only Ask pushes; the
              # credential keeper keeps minting.
              # Rollback: remove these five lines (or set the first false); keep the ConfigMap, whose
              # dedupe stops a repeat push if they return.
              - --enable-ask-notifications=true
              - --ask-notify-portal-origin=https://dev-env-v2.haynesops.com
              - --ask-notify-window=07:00-00:00
              - --ask-notify-timezone=America/New_York
              - --ask-notify-state-configmap=dev-env-keeper-ask-notifications
              # The ops bot's token (dev-env DESIGN-064 6.2, OpenProject 736, dev-env#1078): a second
              # mint loop for the haynes-ops-bot App, on the dev bot loop's schedule and Lease. It
              # reads the App's files from /etc/dev-env-keeper/github-ops-bot (the mount below) at
              # every mint and merges the token into dev-agents/dev-env-ops-gh-token (key gh_token),
              # which only profile `ops` mounts. Role dev-env-keeper already may patch that Secret
              # (rbac/app/keeper.yaml); secrets/app/keeper-secrets.yaml creates it empty. Defaults
              # kept: --ops-github-app-dir, --ops-gh-token-secret and --ops-gh-token-permissions
              # (v1's set: contents, pull requests and issues write, checks read).
              # The repository list is required with the flag and limits the token to these names.
              # They are the two repositories v1's own record says the installation covers
              # (upgrade-agent/dev-env-ops/app/resources/publish-report.sh, probed from that pod on
              # 2026-08-31 and 2026-09-06). Adding a name or a permission is a question for Tom
              # (DESIGN-064 Q-09). The keeper holding this App's key is his decision of 2026-11-11
              # (gate T-1): the same bot with the same rights.
              # Before any request the loop refuses when its App could be the dev bot's App (the
              # same issuer, key or installation). With the flag on, the keeper is ready only when
              # both tokens are minted, so a refused ops mint shows as NotReady. A normal mint logs
              # the granted permissions it asked for and permissionsDropped 1 (GitHub's metadata).
              # Rollback: remove these two lines; the mount, the Secret and the ExternalSecret can stay.
              # A token already minted stays valid until its expiry (at most an hour).
              - --enable-ops-gh-token=true
              - --ops-gh-token-repositories=haynes-ops,cigar-journal
            # Other flags retain the defaults: plan 01's names (--secret-namespace dev-agents,
            # --gh-token-secret dev-env-gh-token, --github-app-dir
            # /etc/dev-env-keeper/github-dev-bot, the Lease in POD_NAMESPACE, v1's
            # down-scoped token permissions, metrics :8080, probes :8081).
            env:
              POD_NAMESPACE:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8081
                  periodSeconds: 20
                  timeoutSeconds: 3
                  failureThreshold: 3
              # Ready while every credential holds a token this process wrote and none
              # has expired (D-52). A keeper that does not lead, or whose mints fail for a
              # token's whole life, is not ready, so the cluster's pod-not-ready alert
              # covers a dark gh token.
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 8081
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
          # Idle until a separately authorized authenticated exec starts a fresh
          # native ceremony. No App, CA, Secret or ServiceAccount volume is mounted.
          codex-login:
            image:
              repository: ghcr.io/thaynes43/dev-env-codex-login
              # v2.39.1 (dev-env#505); publish.yml run 39706772225 signed/verified. Was v2.39.0 (dev-env#495), run 39466593953 signed/verified. Was v2.38.3 (dev-env#489), run 39391960144 signed/verified. Was v2.38.2 (dev-env#485), run 39387698019 signed/verified. Was v2.38.1 (dev-env#481, #483: Proxmox response shape, Codex log level), run 39382009894 signed/verified. Was v2.38.0 (dev-env#475).
              tag: sha-617ed15@sha256:a19686db146fd79ef557a200028adfb9a35c229a378bacd58af78ec9e7ed802d
              pullPolicy: IfNotPresent
            # Clear the API service environment Kubernetes injects even when
            # enableServiceLinks is false; the native helper also uses a minimal env.
            env:
              KUBERNETES_SERVICE_HOST: ""
              KUBERNETES_SERVICE_PORT: ""
              KUBERNETES_SERVICE_PORT_HTTPS: ""
              KUBERNETES_PORT: ""
              KUBERNETES_PORT_443_TCP: ""
              KUBERNETES_PORT_443_TCP_ADDR: ""
              KUBERNETES_PORT_443_TCP_PORT: ""
              KUBERNETES_PORT_443_TCP_PROTO: ""
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
          # Idle until a separately authorized authenticated exec starts the fresh Claude
          # login ceremony (`agentd claude-login`). The signed agent image is the helper
          # because it carries the pinned claude CLI; no Secret or ServiceAccount volume is
          # mounted, and the pod's user (65532) matches the 0600 control socket.
          claude-login:
            image:
              repository: ghcr.io/thaynes43/dev-env
              # v2.39.1 (dev-env#505); publish-agent.yml run 39706793789 signed/verified. Was v2.39.0 (dev-env#495), run 39466623563 signed/verified. Was v2.38.3 (dev-env#489), run 39391981933 signed/verified. Was v2.38.2 (dev-env#485: per-pod login lock), run 39387720469 signed/verified. Was v2.38.1 (dev-env#483): agentd claude-login-abandon (the exec guard admits it, haynes-ops #4132); publish-agent.yml run 39382031869 signed/verified. Was v2.38.0 (dev-env#475).
              tag: 2.109.0@sha256:8b2b51d5997c7406271128143734e08b885de4c3efb2dcc271d9c6c2389a0dca
              pullPolicy: IfNotPresent
            args:
              - claude-login-idle
            env:
              KUBERNETES_SERVICE_HOST: ""
              KUBERNETES_SERVICE_PORT: ""
              KUBERNETES_SERVICE_PORT_HTTPS: ""
              KUBERNETES_PORT: ""
              KUBERNETES_PORT_443_TCP: ""
              KUBERNETES_PORT_443_TCP_ADDR: ""
              KUBERNETES_PORT_443_TCP_PORT: ""
              KUBERNETES_PORT_443_TCP_PROTO: ""
            # The claude CLI is a Node program; it runs only during the ceremony. The memory
            # limit is above the other sidecars' 256Mi and is the one value to measure at the
            # checkpoint (OOM during `claude auth login` would show as a fixed failure code).
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
    defaultPodOptions:
      # Query exact external names before cluster search suffixes, so Cilium
      # learns the same FQDN used by the credential endpoint allowlist.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      annotations:
        # The timezone init has no CPU limit; keep this keeper rollout bounded.
        k8tz.io/inject: "false"
      automountServiceAccountToken: false
      enableServiceLinks: false
      shareProcessNamespace: false
      securityContext:
        # distroless nonroot; fsGroup lets it read the 0440 App files.
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    # No Service until plan 03 adds the keeper's 8443 endpoint.
    persistence:
      # The haynes-dev-bot App (client-id, app-id, installation-id, private-key), read at
      # every mint, so a key rotated in 1Password arrives without a restart. Only the
      # keeper mounts this Secret.
      github-dev-bot:
        type: secret
        name: dev-env-keeper-github-dev-bot
        defaultMode: 0440
        advancedMounts:
          dev-env-keeper:
            app:
              - path: /etc/dev-env-keeper/github-dev-bot
                readOnly: true
      # The haynes-ops-bot App (the same four files), from ExternalSecret
      # dev-env-keeper-github-ops-bot (secrets/app/externalsecret-keeper.yaml), read at every
      # ops mint. Only the keeper's app container mounts it. Not optional on purpose: with
      # the ops flag on, a keeper without these files could never be ready.
      github-ops-bot:
        type: secret
        name: dev-env-keeper-github-ops-bot
        defaultMode: 0440
        advancedMounts:
          dev-env-keeper:
            app:
              - path: /etc/dev-env-keeper/github-ops-bot
                readOnly: true
      # Keeper-only D-69/D-72 input. The default --ssh-ca-dir reads these two keys.
      # Minting is switched on by --enable-proxmox-grants above (Q-110-08); the pair
      # was validated in the keeper on 2026-10-09 (docs/keeper-node-trust.md).
      ssh-ca:
        type: secret
        name: dev-env-keeper-ssh-ca
        defaultMode: 0440
        advancedMounts:
          dev-env-keeper:
            app:
              - path: /etc/dev-env-keeper/ssh-ca
                readOnly: true
      # Pinned SSH targets and node host keys for the Proxmox minter (public data). The
      # keeper rereads them per operation, so a ConfigMap change needs no restart.
      ssh-trust:
        type: configMap
        name: dev-env-keeper-ssh-trust
        defaultMode: 0444
        advancedMounts:
          dev-env-keeper:
            app:
              - path: /etc/dev-env-keeper/ssh
                readOnly: true
      # The dev-env Pushover application's token and the user key (dev-env plan 13, story 13.1):
      # the keeper's notifier reads token and user at /etc/dev-env-keeper/pushover, the paths
      # its flags default to. A custom volume rather than `type: secret` so the mount can be
      # optional: if the ExternalSecret has not synced (a missing 1Password field), the keeper
      # still starts, logs "notifier disabled: no Pushover credentials" and keeps its gauges.
      # Only the main keeper container mounts it. 0440 so the pod's group (fsGroup 65532) reads.
      pushover:
        type: custom
        volumeSpec:
          secret:
            secretName: dev-env-keeper-pushover
            defaultMode: 0440
            optional: true
        advancedMounts:
          dev-env-keeper:
            app:
              - path: /etc/dev-env-keeper/pushover
                readOnly: true
      # Only the main keeper can use the Kubernetes API. Project the normal
      # in-cluster token/CA/namespace path explicitly with pod automount disabled.
      kube-api-access:
        type: custom
        volumeSpec:
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
        advancedMounts:
          dev-env-keeper:
            app:
              - path: /var/run/secrets/kubernetes.io/serviceaccount
                readOnly: true
      # Staging is ephemeral; only the main keeper owns the durable private Secret.
      # The inner directory/socket are made 0700/0600 by the enabled source worker.
      codex-login:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Mi
        advancedMounts:
          dev-env-keeper:
            app:
              - path: /run/dev-env-codex-login
            codex-login:
              - path: /run/dev-env-codex-login
      # Claude login staging and control socket: memory-backed, shared by app and claude-login
      # only. 32Mi counts against the writer's memory; going over evicts the whole keeper pod.
      claude-login:
        type: emptyDir
        medium: Memory
        sizeLimit: 32Mi
        advancedMounts:
          dev-env-keeper:
            app:
              - path: /run/dev-env-claude-login
            claude-login:
              - path: /run/dev-env-claude-login
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Mi
        advancedMounts:
          dev-env-keeper:
            app:
              - path: /tmp
