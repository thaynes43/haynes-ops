---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# dev-env-keeper (DESIGN-001 3.1, D-38, D-52; KICKOFF 8.9): the HelmRelease. It needs, and
# so waits for: its ServiceAccount and Roles, the App Secret and the empty
# dev-env-gh-token it writes, and its network policy (api.github.com by name).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app dev-env-keeper
  namespace: &namespace dev-env-system
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: dev-env-crds
    - name: dev-env-rbac
    - name: dev-env-secrets
    - name: dev-env-network
  path: ./kubernetes/main/apps/dev-env-system/keeper/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
