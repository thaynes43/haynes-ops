---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The app-template OCIRepository the operator and keeper HelmReleases use, once for the
# namespace (frontend's pattern), so neither app's Flux Kustomization owns it alone.
namespace: dev-env-system
components:
  - ../../../shared/components/common/repos/app-template
resources:
  # Pre Flux-Kustomizations
  - ./namespace.yaml
  # Flux-Kustomizations
  - ./crds/ks.yaml
  - ./network/ks.yaml
  - ./scheduling/ks.yaml
  - ./templates/ks.yaml
  - ./storage/ks.yaml
  - ./shelf/ks.yaml
  - ./session-config/ks.yaml
  - ./secrets/ks.yaml
  - ./rbac/ks.yaml
  - ./pki/ks.yaml
  - ./operator/ks.yaml
  - ./broker/ks.yaml
  - ./keeper/ks.yaml
