---
# Run deliberately after the image is published:
#   kubectl create job -n dev --from=cronjob/audio-authoring-provision \
#     audio-authoring-provision-$(date +%s)
# The image's `prefetch` mode downloads anonymously and verifies the exact model
# revision baked into the image:
#   stabilityai/stable-audio-3-optimized
#   da6edc54ddba10bfd79a077102ded687f80e882b
# This template never runs on its own.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audio-authoring-provision
spec:
  schedule: '0 0 1 1 *'
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 14400
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: audio-authoring
            app.kubernetes.io/component: provisioner
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: provision
              image: ghcr.io/thaynes43/audio-authoring:0.1.0@sha256:2333f862d4108aca69d41c9eaba21df7710a105e8affb4d1a9787e65b5b647a1
              imagePullPolicy: IfNotPresent
              args: [prefetch]
              env:
                # Use the single-file HTTPS bridge path rather than the Xet CAS
                # reconstruction protocol and its broader endpoint set.
                - name: HF_HUB_DISABLE_XET
                  value: '1'
                - name: HF_HUB_DISABLE_TELEMETRY
                  value: '1'
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: '2'
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: models
                  mountPath: /models
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: models
              persistentVolumeClaim:
                claimName: audio-authoring-models
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi
