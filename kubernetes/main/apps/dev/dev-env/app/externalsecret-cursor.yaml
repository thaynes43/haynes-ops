---
# Cursor Cloud Agents API key for Meatball's supported read/management calls
# (Tom, 2026-10-14). Dedicated secret: nothing in this pod references it yet,
# so syncing it changes no container env/mounts and restarts nothing. It is
# NOT CURSOR_API_KEY on purpose: that name would switch the `agent` CLI and
# worker off their existing browser login. Consumption (mount/env) and egress
# to api.cursor.com are separate, separately approved changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-cursor-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-cursor-api-secret
    creationPolicy: Owner
  data:
    - secretKey: CURSOR_MEATBALL_KEY
      remoteRef: { key: dev-env, property: CURSOR_MEATBALL_KEY }
