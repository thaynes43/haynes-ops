---
# OPERATOR tier (saga Decision #1, plan 05) — the breadth Claude actually uses from
# the Mac, minus the dangerous parts. Two halves:
#   READ: core group ENUMERATED WITHOUT SECRETS (RBAC can't except a resource from a
#         wildcard, and secrets-read is explicitly withheld) + wildcard read of every
#         NON-core group (secrets live only in core, so this is safe breadth — and it
#         passes restrict-rbac-escalation, which only denies '*' verbs + '*' resources
#         together).
#   WRITE: the targeted GitOps-legal mutations ONLY — restart pods, rollout-restart
#         workloads, Flux reconcile/suspend (patch = annotations + spec.suspend),
#         create/delete Jobs (volsync unlock), suspend CronJobs, and pod exec
#         (added 2026-08-06 per Tom — parity with the WSL/workstation agent
#         workflow; e.g. `ceph crash archive-all` via the rook toolbox). NO
#         secrets, NO RBAC/node/namespace/CRD mutation. Writes go through git;
#         this is the "restart/reconcile/verify" loop, not a deploy path.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dev-env-operator
  labels:
    app.kubernetes.io/name: dev-env
rules:
  # Core group read — everything an operator inspects, EXCEPT secrets.
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - events
      - nodes
      - namespaces
      - services
      - endpoints
      - configmaps
      - persistentvolumeclaims
      - persistentvolumes
      - serviceaccounts
      - resourcequotas
      - limitranges
    verbs: [get, list, watch]
  # Non-core groups: wildcard READ (no secrets outside core; add groups as the
  # cluster grows — unknown-group denials are the signal).
  - apiGroups:
      - admissionregistration.k8s.io
      - apiextensions.k8s.io
      - apps
      - apps.emqx.io
      - autoscaling
      - batch
      - ceph.rook.io
      - cert-manager.io
      - cilium.io
      - coordination.k8s.io
      - discovery.k8s.io
      - dragonflydb.io
      - external-secrets.io
      - gateway.networking.k8s.io
      - helm.toolkit.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - kyverno.io
      - metrics.k8s.io
      - monitoring.coreos.com
      - networking.k8s.io
      - node.k8s.io
      - notification.toolkit.fluxcd.io
      - objectbucket.io
      - policy
      - postgresql.cnpg.io
      - rbac.authorization.k8s.io
      - snapshot.storage.k8s.io
      - source.toolkit.fluxcd.io
      - storage.k8s.io
      - traefik.io
      - volsync.backube
    resources: ["*"]
    verbs: [get, list, watch]
  # ── Targeted writes ──
  # Restart a wedged/stale pod (the delete-and-let-the-controller-recreate loop).
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  # `kubectl exec` (= create on the exec subresource). Secrets stay withheld at
  # the API, but note exec into a pod that MOUNTS a secret reads it anyway —
  # accepted trade-off (2026-08-06): the WSL workflow always had this.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  # Reach in-cluster HTTP APIs through the apiserver proxy (2026-09-12). This is
  # how runbooks query Prometheus directly —
  #   kubectl get --raw "/api/v1/namespaces/observability/services/http:<svc>:9090/proxy/api/v1/query?query=..."
  # `get` covers proxied GETs, `create` covers proxied POSTs (Prometheus accepts
  # both; a long PromQL expression has to go as a POST body).
  #
  # WHY THIS IS NOT A PRIVILEGE ESCALATION. It looks like one — proxy reaches any
  # service through the apiserver, sidestepping the default-deny egress
  # CiliumNetworkPolicy. But `pods/exec` two rules above already grants strictly
  # more: exec runs arbitrary commands inside any pod, which reaches every service
  # AND reads that pod's mounted secrets. Proxy is a strict subset of a capability
  # this tier accepted on 2026-08-06. It was never a deliberate boundary — the
  # operator tier (saga plan 05, #2039) simply never enumerated the subresource.
  #
  # WHAT IT FIXES. Without it these calls return 403, and runbooks that piped
  # stderr to /dev/null turned that 403 into an EMPTY result, which read as
  # "0 findings" — a false green. kyverno-enforce-verify.md reported all-clear on
  # 2026-09-12 while the true answer was 15 enforce blocks in 31 days. The
  # fail-loud guard added there stays regardless; this removes the cause.
  - apiGroups: [""]
    resources: [services/proxy, pods/proxy]
    verbs: [get, create]
  # `kubectl rollout restart` = patching the restartedAt annotation.
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [patch]
  # Force an ExternalSecrets refresh (annotate = patch) so agents never wait out
  # the 1h tick after Tom writes a 1Password field (2026-08-14, dues OIDC secret
  # lag). Values stay unreadable — secrets themselves remain withheld above.
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets]
    verbs: [patch]
  # `flux reconcile` = annotating; suspend/resume = spec.suspend patch. Sources too
  # (--with-source).
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [patch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [patch]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories, ocirepositories, helmrepositories, helmcharts, buckets]
    verbs: [patch]
  # Manual Jobs (volsync unlock/restore runbooks) + CronJob suspend kill-switches.
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, delete]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  # Named after the ROLE, not the app: CRB roleRef is immutable, so re-tiering the
  # SA's power means a NEW binding name (the old one gets pruned) — changing roleRef
  # in place wedges the Flux apply (hit live 2026-07-13).
  name: dev-env-operator
  labels:
    app.kubernetes.io/instance: dev-env
    app.kubernetes.io/name: dev-env
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dev-env-operator
subjects:
  - kind: ServiceAccount
    name: dev-env
    namespace: dev
