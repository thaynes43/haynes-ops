---
# CiliumNetworkPolicy for the dev-env pod. Broader than the shepherd's BY DESIGN
# (agents doing real dev work need package registries + both LLM vendors), but still
# default-deny + ENUMERATED — this list is the exfil boundary for yolo-mode agents
# holding subscription/git credentials (saga Hard news #1). Extend it deliberately,
# one named destination at a time; watch Hubble drops during bring-up.
#
# Ingress: ONLY traefik-internal → 8443 (code-server runs --auth none behind the
# Authentik forward-auth middleware, so nothing else may reach it directly).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dev-env
  namespace: dev
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: dev-env
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/instance: traefik-internal-network
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  egress:
    # 1. DNS via CoreDNS — only cluster-internal + the exact external names below
    #    (closes DNS-tunnel exfil, shepherd pattern; Cilium `*` does not cross label
    #    boundaries, so apex domains need matchName alongside their matchPattern).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*.cluster.local"
              - matchPattern: "*.svc"
              # Multi-label svc FQDNs need EXACT names — Cilium `*` is single-label,
              # so `*.cluster.local` does NOT match name.ns.svc.cluster.local (the
              # same trap the shepherd hit with the Prometheus FQDN; re-proven here
              # via `claude mcp list` failures 2026-07-13).
              - matchName: "ha-mcp.home-automation.svc.cluster.local"
              - matchName: "mcp-grafana.observability.svc.cluster.local"
              - matchName: "mcp-unifi.observability.svc.cluster.local"
              # Omni (self-hosted, frontend ns) — an in-cluster Omni svc, kept for a
              # possible future self-hosted route (backlog 10). It is NOT what manages
              # the main nodes today.
              - matchName: "omni.frontend.svc.cluster.local"
              # SaaS Omni — the instance that ACTUALLY registers the main nodes
              # (talosm0x). Node triage runs through it: omnictl (Reader SA) + an
              # Omni-proxied talosconfig fetched at runtime (`omnictl talosconfig`),
              # so talosctl traffic egresses here too (backlog 10, decision 2026-07-25:
              # SaaS tier denies break-glass, so LAN-direct os:reader is unavailable).
              - matchName: "haynes.na-west-1.omni.siderolabs.io"
              # git + gh + release notes + ghcr blobs
              - matchName: "github.com"
              - matchPattern: "*.github.com"
              - matchPattern: "*.githubusercontent.com"
              - matchName: "ghcr.io"
              # Anthropic: API + claude.ai (/remote-control relay) + claude.com
              # (platform.claude.com — claude-code startup checks, proven via Hubble
              # 2026-07-13) + statsig etc.
              - matchName: "anthropic.com"
              - matchPattern: "*.anthropic.com"
              - matchName: "claude.ai"
              - matchPattern: "*.claude.ai"
              - matchName: "claude.com"
              - matchPattern: "*.claude.com"
              # Remote Control bridge — claude-code 2.1.x dials
              # wss://bridge.claudeusercontent.com; a refused DNS lookup makes
              # /remote-control a SILENT no-op (hit live 2026-07-16, second
              # session; the claude.ai relay only covers already-established
              # connections).
              - matchName: "bridge.claudeusercontent.com"
              # OpenAI: Codex API + ChatGPT-plan auth/backend
              - matchName: "openai.com"
              - matchPattern: "*.openai.com"
              - matchName: "chatgpt.com"
              - matchPattern: "*.chatgpt.com"
              # package registries (real dev work)
              - matchName: "registry.npmjs.org"
              - matchName: "pypi.org"
              - matchName: "files.pythonhosted.org"
              # code-server extension marketplace (Open VSX)
              - matchName: "open-vsx.org"
              - matchName: "openvsxorg.blob.core.windows.net"
              # playwright browser downloads — a repo pinning its own @playwright/test
              # version fetches a matching chromium revision (haynesnetwork e2e).
              # cdn.playwright.dev REDIRECTS the actual zip to storage.googleapis.com
              # (Chrome-for-Testing bucket) — without it the download dies EAI_AGAIN.
              - matchName: "cdn.playwright.dev"
              - matchPattern: "*.playwright.dev"
              - matchName: "storage.googleapis.com"
              # our own apps' internal ingress names (playwright UI/UX testing —
              # traffic goes to the traefik-internal pods, rule 2b)
              - matchName: "haynesops.com"
              - matchPattern: "*.haynesops.com"
              - matchName: "haynesnetwork.com"
              - matchPattern: "*.haynesnetwork.com"
              # auth-watch pages via Pushover
              - matchName: "api.pushover.net"
              # ---- sigoalumni.org buildout (sigo-alumni backlog/tooling, 2026-08-05) ----
              # gcloud SDK tarball + component downloads
              - matchName: "dl.google.com"
              # Google OAuth: interactive `gcloud auth login` + token exchange
              - matchName: "accounts.google.com"
              - matchName: "oauth2.googleapis.com"
              # GCP control plane the sigo-alumni-prod bootstrap touches (tofu + gcloud):
              # projects, API enablement, SAs + keyless signing, secrets, AR, Cloud Run.
              # State bucket is storage.googleapis.com (already allowed above).
              - matchName: "cloudresourcemanager.googleapis.com"
              - matchName: "serviceusage.googleapis.com"
              - matchName: "iam.googleapis.com"
              - matchName: "iamcredentials.googleapis.com"
              - matchName: "secretmanager.googleapis.com"
              - matchName: "artifactregistry.googleapis.com"
              - matchName: "run.googleapis.com"
              # gcloud run describe/deploy use the REGIONAL endpoint, not the
              # global one (hit live 2026-08-05: NameResolutionError)
              - matchName: "us-east1-run.googleapis.com"
              # Cloud SQL admin (tofu provisions the frontpage Postgres instance)
              - matchName: "sqladmin.googleapis.com"
              # Compute Engine (wiki VM start/stop + Outline migration drill, 2026-08-08)
              - matchName: "compute.googleapis.com"
              # IAP-tunneled SSH to GCE VMs (Outline restore drill, 2026-08-09) — wss over 443
              - matchName: "tunnel.cloudproxy.app"
              # OS Login profile lookup — gcloud compute ssh requires it (2026-08-10)
              - matchName: "oslogin.googleapis.com"
              # Cloudflare API — zone migration, DNS-as-code, later LB/tunnel steering (2026-08-09)
              - matchName: "api.cloudflare.com"
              - matchPattern: "*.tunnel.cloudproxy.app"
              # Cloud Run log reads (debugging deployed services from the pod)
              - matchName: "logging.googleapis.com"
              # Uptime checks + alert policies for the demo site (2026-08-06)
              - matchName: "monitoring.googleapis.com"
              # Workspace SMTP relay (magic-link mail; members-portal, 2026-08-06)
              - matchName: "smtp-relay.gmail.com"
              # Workspace content/roles APIs (Calendar+Drive ride www.googleapis.com;
              # Sheets and Admin SDK have their own hosts)
              - matchName: "www.googleapis.com"
              - matchName: "sheets.googleapis.com"
              - matchName: "admin.googleapis.com"
              # Outline wiki MCP (mcp-outline → wiki API) + playwright against the
              # public sigoalumni.org properties; *.run.app is the Cloud Run demo URL
              # until DNS cutover.
              - matchName: "sigoalumni.org"
              - matchPattern: "*.sigoalumni.org"
              # student-site takeover audit (sigo-alumni backlog/student-site):
              # fetch the legacy chapter site + crest assets for the rebuild
              - matchName: "sigmaphiomicron.com"
              - matchPattern: "*.sigmaphiomicron.com"
              - matchPattern: "*.run.app"
              # Cloud Run URLs are <svc>-<hash>-<region>.a.run.app — two labels; Cilium
              # `*` is single-label (same trap as the svc FQDNs above)
              - matchPattern: "*.a.run.app"
              # OpenTofu provider registry (metadata only — binaries come from
              # github releases via *.githubusercontent.com, already allowed)
              - matchName: "registry.opentofu.org"
    # 2a. Cluster-local MCP servers (saga plan 03): HA + Grafana — the agents'
    #     introspection tools, reached via svc FQDNs, never the public ingress.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: home-automation
            app.kubernetes.io/name: ha-mcp
      toPorts:
        - ports:
            - port: "8086"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: mcp-grafana
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: mcp-unifi
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # 2c. Omni (self-hosted Talos manager, frontend ns) — node-triage omnictl reads
    #     machine/cluster status + events on the management API (8080) via svc FQDN,
    #     never the public ingress (backlog 10). See the topology caveat on the DNS
    #     matchName above: this reaches the SELF-HOSTED Omni; the main cluster's nodes
    #     are on SaaS Omni, for which omnictl would instead need *.omni.siderolabs.io.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: frontend
            app.kubernetes.io/name: omni
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # 2b. traefik-internal — playwright (headless chromium MCP) drives the cluster's
    #     own apps for UI/UX testing via their https://<app>.haynesops.com ingress.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/instance: traefik-internal-network
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    # 2. Kube API server — in-cluster kubectl via kubernetes.default.svc (the whole
    #    point of saga Decision #1).
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # 4. Talos apid (tcp/50000) on the cluster nodes — read-only node triage
    #    (backlog 10): talosctl with an os:reader talosconfig reads dmesg / service
    #    logs / machine resources directly from each node (masters talosm01-03 are
    #    bare metal and hard-reset 2026-07-18 & 2026-07-24 with no in-pod way to read
    #    machine events). SELECT NODE ENTITIES, NOT A CIDR: the repo uses toEntities
    #    for cluster infra and Cilium's policy-cidr-match-mode is unset, so a toCIDR
    #    on 192.168.40.0/24 would SILENTLY fail to match — Cilium classifies node IPs
    #    as host/remote-node identities, not CIDR. The port scopes this to apid; the
    #    os:reader cert role gates it to reads server-side.
    - toEntities: [remote-node, host]
      toPorts:
        - ports:
            - port: "50000"
              protocol: TCP
    # 3. HTTPS to the enumerated external names (same set as the DNS rules).
    - toFQDNs:
        - matchName: "github.com"
        - matchPattern: "*.github.com"
        - matchPattern: "*.githubusercontent.com"
        - matchName: "ghcr.io"
        - matchName: "anthropic.com"
        - matchPattern: "*.anthropic.com"
        - matchName: "claude.ai"
        - matchPattern: "*.claude.ai"
        - matchName: "claude.com"
        - matchPattern: "*.claude.com"
        - matchName: "bridge.claudeusercontent.com"
        - matchName: "openai.com"
        - matchPattern: "*.openai.com"
        - matchName: "chatgpt.com"
        - matchPattern: "*.chatgpt.com"
        - matchName: "registry.npmjs.org"
        - matchName: "pypi.org"
        - matchName: "files.pythonhosted.org"
        - matchName: "open-vsx.org"
        - matchName: "openvsxorg.blob.core.windows.net"
        - matchName: "api.pushover.net"
        - matchName: "cdn.playwright.dev"
        - matchPattern: "*.playwright.dev"
        - matchName: "storage.googleapis.com"
        # SaaS Omni — omnictl (Reader SA) + Omni-proxied talosctl for node triage
        # (backlog 10, decision 2026-07-25). This is a WAN dependency: triage now
        # needs Omni + internet reachable, unlike the LAN-direct route it replaces.
        - matchName: "haynes.na-west-1.omni.siderolabs.io"
        # ---- sigoalumni.org buildout (same set as the DNS rules above) ----
        - matchName: "dl.google.com"
        - matchName: "accounts.google.com"
        - matchName: "oauth2.googleapis.com"
        - matchName: "cloudresourcemanager.googleapis.com"
        - matchName: "serviceusage.googleapis.com"
        - matchName: "iam.googleapis.com"
        - matchName: "iamcredentials.googleapis.com"
        - matchName: "secretmanager.googleapis.com"
        - matchName: "artifactregistry.googleapis.com"
        - matchName: "run.googleapis.com"
        - matchName: "us-east1-run.googleapis.com"
        - matchName: "sqladmin.googleapis.com"
        - matchName: "compute.googleapis.com"
        - matchName: "tunnel.cloudproxy.app"
        - matchName: "oslogin.googleapis.com"
        - matchName: "api.cloudflare.com"
        - matchPattern: "*.tunnel.cloudproxy.app"
        - matchName: "logging.googleapis.com"
        - matchName: "monitoring.googleapis.com"
        - matchName: "smtp-relay.gmail.com"
        - matchName: "www.googleapis.com"
        - matchName: "sheets.googleapis.com"
        - matchName: "admin.googleapis.com"
        - matchName: "sigoalumni.org"
        - matchPattern: "*.sigoalumni.org"
        - matchName: "sigmaphiomicron.com"
        - matchPattern: "*.sigmaphiomicron.com"
        - matchPattern: "*.run.app"
        - matchPattern: "*.a.run.app"
        - matchName: "registry.opentofu.org"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
