---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dev-env
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      dev-env:
        # The 24/7 agent workhorse (saga .agents/sagas/dev-env/): code-server +
        # tmux-hosted agent CLI sessions on a persistent home. Recreate: the home
        # PVC is RWO and agent/tmux state doesn't survive a pod swap anyway.
        replicas: 1
        strategy: Recreate
        annotations:
          # Config/scripts ConfigMap changes roll the pod (dev-init re-links on boot).
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/thaynes43/dev-env
              tag: 0.5.0@sha256:ad33fe4e27eebdc6bd82eb456d1b4cd19a5abf87064badc235365fe6a20ec2e3
            command: ["/bin/bash", "-c"]
            args:
              # dev-init links GitOps configs into $HOME, then tmux (agent sessions
              # survive browser/exec disconnects; /remote-control + agent-run
              # sessions live here), then code-server.
              # --auth none is safe ONLY because ingress is traefik-internal + the
              # Authentik forward-auth middleware AND the CNP restricts ingress to
              # traefik — do not add other ingress paths without adding auth.
              - >-
                bash /opt/dev-env/scripts/dev-init.sh;
                tmux new-session -d -s main 2>/dev/null || true;
                exec code-server
                --bind-addr 0.0.0.0:8443
                --auth none
                --disable-telemetry
                --disable-update-check
                /home/dev
            env:
              HOME: /home/dev
              CLAUDE_CONFIG_DIR: /home/dev/.claude
              CODEX_HOME: /home/dev/.codex
              # The image pins CLI versions (Renovate-bumped); no self-updates.
              DISABLE_AUTOUPDATER: "1"
              DISABLE_ERROR_REPORTING: "1"
              # NO DISABLE_TELEMETRY here: /remote-control is Statsig-feature-flag
              # gated, and that var disables flag evaluation entirely — setting it
              # hides Remote Control (hit live 2026-07-14; saga Decision #6 depends
              # on it). There is no flags-only knob as of claude-code 2.1.207.
              # ── Read-only node triage via SaaS Omni (saga backlog 10; 2026-07-25
              # decision) ── omnictl authenticates headless with the Reader SA key and
              # reads Omni machine/cluster status; talosctl reaches nodes through an
              # Omni-proxied talosconfig fetched at runtime (`omnictl talosconfig`), so
              # no talosconfig file is mounted. Read-only BY ROLE (Omni Reader SA) — no
              # mutate reaches the pod even under a compromised agent. OMNI_ENDPOINT and
              # OMNI_SERVICE_ACCOUNT_KEY are exactly what `omnictl serviceaccount create`
              # printed (endpoint carries explicit :443).
              OMNI_ENDPOINT: https://haynes.na-west-1.omni.siderolabs.io:443
              OMNI_SERVICE_ACCOUNT_KEY:
                valueFrom:
                  secretKeyRef:
                    name: dev-env-node-triage-secret
                    key: OMNI_SERVICE_ACCOUNT_KEY
            envFrom:
              # HA_MCP_SECRET_PATH — expanded into the MCP URL by dev-init.
              - secretRef:
                  name: dev-env-mcp-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              # Workhorse sizing: 8Gi OOMKilled haynesnetwork's `pnpm test` (parallel
              # vitest × embedded Postgres across the monorepo) — and an OOMKill takes
              # the tmux server with it, killing every in-flight agent session. Nodes
              # carry ~122Gi, so give real headroom for concurrent agent builds; the
              # limit is a ceiling, not a reservation.
              requests:
                cpu: "1"
                memory: 4Gi
              limits:
                memory: 24Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
          # Mints a fresh haynes-DEV-bot ghs_ token to /creds every 40min (1h TTL) —
          # the dev identity, installed on All Repositories (Decision #5 revised).
          # The PEM lives ONLY here; agents read /creds/gh_token per shell (bashrc).
          gh-refresher:
            image:
              repository: ghcr.io/thaynes43/dev-env
              tag: 0.5.0@sha256:ad33fe4e27eebdc6bd82eb456d1b4cd19a5abf87064badc235365fe6a20ec2e3
            command: ["/bin/bash", "/opt/dev-env/scripts/gh-token-refresh.sh"]
            env:
              # Down-scope the minted token. NOTE: may only name permissions the App
              # itself was GRANTED — requesting ungranted ones (e.g. actions/issues,
              # tried 2026-07-13) makes the token mint 422. haynes-dev-bot grants:
              # contents/PRs/workflows write + checks read.
              GITHUB_BOT_TOKEN_PERMISSIONS: '{"contents":"write","pull_requests":"write","workflows":"write","checks":"read"}'
            envFrom:
              - secretRef:
                  name: dev-env-bot-secret
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { memory: 128Mi }
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
          # Daily credential probe (claude/codex/gh) → Pushover page on failure
          # (saga plan 04 expiry watch).
          auth-watch:
            image:
              repository: ghcr.io/thaynes43/dev-env
              tag: 0.5.0@sha256:ad33fe4e27eebdc6bd82eb456d1b4cd19a5abf87064badc235365fe6a20ec2e3
            command: ["/bin/bash", "/opt/dev-env/scripts/auth-check.sh"]
            env:
              HOME: /home/dev
              CLAUDE_CONFIG_DIR: /home/dev/.claude
              CODEX_HOME: /home/dev/.codex
              DISABLE_AUTOUPDATER: "1"
              DISABLE_ERROR_REPORTING: "1"
              DISABLE_TELEMETRY: "1"
            envFrom:
              - secretRef:
                  name: dev-env-watch-secret
            resources:
              requests: { cpu: 10m, memory: 64Mi }
              limits: { memory: 512Mi }
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      automountServiceAccountToken: true   # in-cluster kubectl via the dev-env SA
      # ndots:1 — external names resolve directly instead of first expanding through
      # the cluster search domains (api.anthropic.com.dev.svc.cluster.local…), which
      # the CNP DNS allowlist refuses (Cilium `*` is single-label) and Node/c-ares
      # treats a REFUSED as fatal EREFUSED (claude-code startup failure, proven via
      # Hubble 2026-07-13). In-cluster targets must use FQDNs (kubectl is unaffected
      # — in-cluster config connects to KUBERNETES_SERVICE_HOST, an IP).
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000                      # PVC ownership for /home/dev
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    serviceAccount:
      dev-env: {}
    service:
      app:
        controller: dev-env
        ports:
          http:
            port: 8443
    persistence:
      # Container scoping (advancedMounts): the gh-refresher holds the PEM env and
      # deliberately CANNOT see the home PVC (agent state); agents CANNOT see the
      # PEM (env-only, no mount). /creds is the only shared surface — the minted
      # short-lived token.
      home:
        existingClaim: dev-env-home
        advancedMounts:
          dev-env:
            app:
              - path: /home/dev
            auth-watch:
              - path: /home/dev
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      creds:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /creds
      # GitOps'd agent configs + init script (auditable in PR diffs, shepherd
      # pattern). dev-init.sh links/copies these into $HOME on every boot.
      scripts:
        type: configMap
        name: dev-env-scripts
        defaultMode: 0555
        globalMounts:
          - path: /opt/dev-env/scripts
      config-claude:
        type: configMap
        name: dev-env-config-claude
        advancedMounts:
          dev-env:
            app:
              - path: /opt/dev-env/config/claude
      config-codex:
        type: configMap
        name: dev-env-config-codex
        advancedMounts:
          dev-env:
            app:
              - path: /opt/dev-env/config/codex
      config-home:
        type: configMap
        name: dev-env-config-home
        advancedMounts:
          dev-env:
            app:
              - path: /opt/dev-env/config/home
