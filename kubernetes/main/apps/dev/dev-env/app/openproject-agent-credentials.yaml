---
# Token-only consumer for existing dev-env's approved pods/exec capability.
# No service, network access, Kubernetes token, app admin material, or dev-env bounce.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openproject-agent
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 1h
  target:
    name: openproject-agent
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: {key: openproject, property: API_TOKEN}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openproject-agent-credentials
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openproject-agent-credentials
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openproject-agent-credentials
      annotations:
        k8tz.io/inject: 'false'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: credentials
          image: docker.io/library/python:3.15-alpine@sha256:20a82dbc2783112ddb91d1534603f802d222a3e63e593cd002eb2ac534e70211
          command: [sh, -ec, 'exec sleep infinity']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 8Mi}
            limits: {cpu: 100m, memory: 32Mi}
          volumeMounts:
            - name: token
              mountPath: /run/openproject-agent
              readOnly: true
      volumes:
        - name: token
          secret:
            secretName: openproject-agent
            defaultMode: 0440
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openproject-agent-credentials
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: openproject-agent-credentials
  enableDefaultDeny: {ingress: true, egress: true}
  ingress: []
  egress: []
