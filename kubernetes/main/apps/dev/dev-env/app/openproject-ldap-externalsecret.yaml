---
# Dedicated in-cluster provisioning Job only. No dev-env Pod/env/mount change.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openproject-ldap-bind
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 1h
  target:
    name: openproject-ldap-bind
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: openproject
        property: LDAP_BIND_PASSWORD
