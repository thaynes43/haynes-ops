# Codex ADMIN REQUIREMENTS for the dev-env pod — the one config layer a client
# cannot override. The HelmRelease mounts this at /etc/codex/requirements.toml: the
# SYSTEM path codex reads on Linux (CODEX_HOME/requirements.toml is NOT read —
# verified 2026-09-10; no env var relocates the system dir either).
#
# Why (Tom, 2026-09-10: "supposed to be yolo mode … approval requests constantly"):
# the pod IS the sandbox (CLAUDE.md). bubblewrap cannot create user namespaces here
# (CapEff 0 + seccomp), so a workspace-write sandbox fails on EVERY command and
# codex escalates each one to an approval. config.toml's `approval_policy = "never"`
# + `sandbox_mode = "danger-full-access"` are only host DEFAULTS: the ChatGPT phone
# app sends its own thread settings at thread/start (on-request / workspace-write /
# effort high) AND writes them back into ~/.codex/config.toml (observed 11:00:08,
# the second Tom's thread started). Requirements are applied by the local runtime at
# session init ("disallowed by requirements; falling back to required value"), so a
# phone thread that asks for on-request/workspace-write runs as never/full-access.
#
# Validate after the pod rolls (cannot be tested on a read-only rootfs beforehand):
# start a phone thread, then in the newest ~/.codex/sessions/**/rollout-*.jsonl the
# turn_context must show approval_policy "never" + sandbox_policy danger-full-access,
# and ~/.codex/logs_2.sqlite should carry a "disallowed by requirements" line.
allowed_approval_policies = ["never"]
# "read-only" MUST be in the set: codex 0.153.4 refuses to load its config otherwise
# ("invalid value for `allowed_sandbox_modes`: `[DangerFullAccess]` is not in the
# allowed set must include 'read-only' to allow any PermissionProfile") — which is why
# `codex remote-control start` died at every boot on 2026-09-10 and the phone showed
# nothing. Listing it does not weaken the floor: approval stays "never" and every
# thread still defaults to danger-full-access from config.toml.
allowed_sandbox_modes = ["read-only", "danger-full-access"]
