---
# MCP secrets for the GitOps'd agent config (saga plan 03). Reuses the EXISTING
# 1Password items — nothing new to provision:
#   ha-mcp/MCP_SECRET_PATH — the private path segment of the in-cluster HA MCP
#   endpoint (same item the ha-mcp app itself consumes).
# dev-init.sh envsubst-expands ${HA_MCP_SECRET_PATH} into the registered MCP URL.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-mcp-secret
    creationPolicy: Owner
  data:
    - secretKey: HA_MCP_SECRET_PATH
      remoteRef: { key: ha-mcp, property: MCP_SECRET_PATH }
    # Outline wiki MCP (sigo-alumni backlog/tooling item 01) — token minted at
    # wiki.sigoalumni.org Settings → API Tokens ("dev-env MCP"), consolidated
    # 1Password item `sigo-dev-env`. Consumed by dev-init envsubst once the held
    # roster PR lands; bridged onto the PVC in the meantime (gh-scope-bridge
    # pattern) so the pod does not bounce mid-launch-push.
    - secretKey: OUTLINE_API_KEY
      remoteRef: { key: sigo-dev-env, property: OUTLINE_API_KEY }
    # Vexa meeting-bot MCP (ai ns, deployed 2026-08-18): the gateway /mcp key.
    # Tom: add TOP-LEVEL property VEXA_API_KEY to the `sigo-dev-env` item —
    # current value lives on the dev-env PVC in the agent memory note
    # vexa-homelab-access.md (cluster-internal-only credential).
    - secretKey: VEXA_API_KEY
      remoteRef: { key: sigo-dev-env, property: VEXA_API_KEY }
    # Cloudflare DNS token (sigo-alumni tooling/dev-env-outfitting/05): zone-scoped
    # to sigoalumni.org (DNS:Edit + Zone:Read), minted from Tom's personal account
    # until the org-account zone migration, then re-minted there and rotated here.
    # Reaches agents as $CLOUDFLARE_DNS_TOKEN via the existing envFrom. TOP-LEVEL
    # field on the same consolidated item (nested/section fields do not resolve).
    - secretKey: CLOUDFLARE_SIGO_DNS_TOKEN
      remoteRef: { key: sigo-dev-env, property: CLOUDFLARE_SIGO_DNS_TOKEN }
    # STANDING token for Tom's PERSONAL Cloudflare account (haynesops.com and
    # the rest of the homelab estate live there; sigo zone is there until the
    # org-account migration). dev-env manages DNS across BOTH accounts long
    # term (Tom, 2026-08-14) — homelab hosting work spans them indefinitely.
    - secretKey: CLOUDFLARE_PERSONAL_DNS_TOKEN
      remoteRef: { key: dev-env, property: CLOUDFLARE_PERSONAL_DNS_TOKEN }
---
# haynes-DEV-bot App credentials (Decision #5 REVISED: split identity — the ops bot
# haynes-ops-bot never enters this pod; dev agents author as haynes-dev-bot, which
# is installed on ALL repositories). Mounted ONLY by the gh-refresher sidecar, which
# mints short-lived ghs_ tokens to /creds. The PEM NEVER enters the agent (app)
# container (shepherd pattern).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-bot
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-bot-secret
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_BOT_APP_ID
      remoteRef: { key: github-dev-bot, property: GITHUB_BOT_APP_ID }
    - secretKey: GITHUB_BOT_APP_CLIENT_ID
      remoteRef: { key: github-dev-bot, property: GITHUB_BOT_APP_CLIENT_ID }
    - secretKey: GITHUB_BOT_APP_INSTALLATION_ID
      remoteRef: { key: github-dev-bot, property: GITHUB_BOT_APP_INSTALLATION_ID }
    - secretKey: GITHUB_BOT_APP_PRIVATE_KEY
      remoteRef: { key: github-dev-bot, property: GITHUB_BOT_APP_PRIVATE_KEY }
---
# Pushover (same item the upgrade gate pages with) — auth-watch sidecar ONLY.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-watch
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-watch-secret
    creationPolicy: Owner
  data:
    - secretKey: PUSHOVER_TOKEN
      remoteRef: { key: upgrade-gate, property: PUSHOVER_TOKEN }
    - secretKey: PUSHOVER_USER_KEY
      remoteRef: { key: upgrade-gate, property: PUSHOVER_USER_KEY }
---
# Read-only node-triage cred (saga backlog 10; 2026-07-25 decision: proxy-through-SaaS
# -Omni — LAN-direct os:reader talosconfig is unavailable on the SaaS tier). ONE field:
# the Omni `Reader` service-account key. omnictl authenticates headless with it, and
# talosctl rides an Omni-proxied talosconfig fetched at runtime (`omnictl talosconfig`)
# — so no talosconfig field is needed (and a missing 1Password property would fail the
# whole ES sync). Consumed by the app container ONLY (env valueFrom; see helmrelease).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-node-triage
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-node-triage-secret
    creationPolicy: Owner
  data:
    # Omni Reader SA key. 1Password item `dev-env`, field OMNI_SERVICE_ACCOUNT_KEY
    # (uppercase env-style — remoteRef.property must match the field name exactly).
    - secretKey: OMNI_SERVICE_ACCOUNT_KEY
      remoteRef: { key: dev-env, property: OMNI_SERVICE_ACCOUNT_KEY }
---
# GCP service account for the sigoalumni.org buildout (sigo-alumni
# backlog/tooling/dev-env-outfitting/04): key for dev-env-agent@sigo-alumni-prod,
# stored in 1Password item `sigo-dev-env` (field label SA_KEY_JSON — the full
# JSON key as the value). Non-expiring SA key BY DESIGN: Tom is hands-off dev-env
# (remote control only), so interactive gcloud auth refresh is not acceptable.
# Owner on sigo-alumni-prod for the launch bootstrap; down-scope + rotate the key
# post-launch (recorded in the sigo-alumni backlog item).
# NOTE: shows SecretSyncedError until the 1Password item exists — harmless; the
# consuming mount ships separately (held-draft) and merges only after this syncs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-gcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-gcp-secret
    creationPolicy: Owner
  data:
    - secretKey: sa_key.json
      remoteRef: { key: sigo-dev-env, property: SA_KEY_JSON }
---
# Standing Omni OPERATOR service account (2026-08-21, Tom's call after the first
# dev-env-driven Talos upgrade). DELIBERATELY its own Secret that NO deployment
# references: adding the field to dev-env-node-triage-secret would trip the
# reloader annotation and bounce the dev-env pod (killing live agent sessions).
# Consumers opt in explicitly — today the one-shot talos-upgrade Job; the pod-env
# wiring (OMNI_OPERATOR_KEY, opt-in per session) lands at the next deliberate
# bounce window. Default omnictl access stays the READER SA.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-omni-operator
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-omni-operator-secret
    creationPolicy: Owner
  data:
    - secretKey: OMNI_OPERATOR_KEY
      remoteRef: { key: dev-env, property: OMNI_OPERATOR_KEY }
---
# Claude Max LONG-LIVED OAuth token (saga plan 04's "1Password hardening", shipped
# after the 2026-08-29 expiry stranded a live agent mid-ship-chain). Root cause of
# that expiry: 5+ concurrent claude sessions share ~/.claude/.credentials.json and
# can race the OAuth refresh-token rotation — one process rotates, a sibling
# replays the now-stale refresh token, and the whole token family is revoked.
# This token (minted via `claude setup-token`, ~1yr TTL) has NO rotating refresh,
# and the env var takes precedence over .credentials.json, so the race disappears
# for those sessions and auth survives PVC loss. ONE EXCEPTION (proven 2026-08-29):
# the token cannot register /v1/code/sessions, so remote-control ("both") sessions
# silently never reach the phone/web list — agent-run strips the env var for that
# mode and those sessions ride .credentials.json (the /login ceremony still
# matters; auth-watch probes BOTH paths). Consumed by app (agents) AND auth-watch.
# Re-mint ceremony: 04-auth.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-claude
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dev-env-claude-secret
    creationPolicy: Owner
  data:
    # TOP-LEVEL field on the `dev-env` item — label verified via Connect
    # 2026-08-29 (exact match, no trailing space; nested/section fields do
    # not resolve).
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef: { key: dev-env, property: CLAUDE_CODE_OAUTH_TOKEN }
