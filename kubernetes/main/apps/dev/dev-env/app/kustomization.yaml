# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../../shared/components/common/repos/app-template
resources:
  - ./pvc.yaml
  - ./rbac.yaml
  - ./externalsecret.yaml
  - ./networkpolicy.yaml
  - ./ingressroute.yaml
  - ./helmrelease.yaml
configMapGenerator:
  # GitOps'd agent configuration (saga plan 03) — the declarative half of
  # ~/.claude and ~/.codex; mutable auth/state stays on the PVC (dev-init.sh
  # enforces the split).
  - name: dev-env-scripts
    files:
      - resources/dev-init.sh
      # The after-boot lane (2026-09-10): codex remote-control + the claude standby
      # session, launched from a detached tmux window once the KUBELET says the pod is
      # ready. Never in dev-init — that is the boot path (see both scripts' headers).
      - resources/post-ready.sh
      - resources/bashrc.sh
      - resources/agent-run.sh
      - resources/gh-token-refresh.sh
      - resources/auth-check.sh
      # declare-activity (2026-08-23): dev agents announce disruptive work so the
      # dev-env-ops remediation lane can tell a real incident from dev fallout
      # (Tom: "need a way for dev-env agents to try and avoid false escalations").
      - resources/declare-activity.sh
      # Renders claude's mcp.json as codex [mcp_servers.*] at boot (2026-09-06):
      # one MCP list for both agents.
      - resources/mcp-json-to-codex-toml.sh
      # pve (2026-09-09, saga backlog 14): Proxmox VE API helper — read tier via the
      # exporter's PVEAuditor token, operator tier via dev-env@pve!operator (both
      # from the pod env, see helmrelease). dev-init links it to ~/.local/bin/pve.
      - resources/pve.sh
  - name: dev-env-config-claude
    files:
      - resources/config/claude/CLAUDE.md
      - resources/config/claude/mcp.json
  - name: dev-env-config-codex
    files:
      - resources/config/codex/config.toml
      # Codex preamble; dev-init prepends it to the shared CLAUDE.md to make
      # ~/.codex/AGENTS.md — the same rules for both agents, one source.
      - resources/config/codex/AGENTS.header.md
      # Admin requirements (approval/sandbox floor the phone app cannot override);
      # the HelmRelease also mounts this key at /etc/codex/requirements.toml.
      - resources/config/codex/requirements.toml
  # The workspace README code-server opens on (~/README.md) — the human walkthrough.
  - name: dev-env-config-home
    files:
      - resources/config/home/README.md
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: dev-env
