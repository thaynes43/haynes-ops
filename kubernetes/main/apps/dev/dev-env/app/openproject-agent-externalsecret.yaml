---
# No dev-env Pod or session change. The acceptance command reads only this new
# dedicated non-admin token in-pod; it never enters agent/chat output.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openproject-agent
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 1h
  target:
    name: openproject-agent
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: openproject
        property: API_TOKEN
