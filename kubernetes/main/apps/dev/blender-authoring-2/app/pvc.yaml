---
# Second, isolated Blender authoring instance (haynes-quest PLAN-019): its own
# live scene and workspace so two authors can model in parallel. CephFS permits
# later independent render Jobs to consume explicit saved scenes.
# Protect editable sources from Flux inventory pruning. This is persistence, not
# a backup: copy approved exports/source bundles to their project artifact store.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blender-authoring-2-workspace
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 10Gi
  storageClassName: ceph-filesystem
