---
# Token-only consumer for existing dev-env's approved pods/exec capability.
# No service, network access, Kubernetes token, app admin material, or dev-env bounce.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openproject-agent
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 1h
  target:
    name: openproject-agent
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: {key: openproject, property: API_TOKEN}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openproject-agent-credentials
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openproject-agent-credentials
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openproject-agent-credentials
      annotations:
        k8tz.io/inject: 'false'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: credentials
          image: docker.io/library/python:3.15-alpine@sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a
          command: [sh, -ec, 'exec sleep infinity']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 8Mi}
            limits: {cpu: 100m, memory: 32Mi}
          volumeMounts:
            - name: token
              mountPath: /run/openproject-agent
              readOnly: true
      volumes:
        - name: token
          secret:
            secretName: openproject-agent
            defaultMode: 0440
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openproject-agent-credentials
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: openproject-agent-credentials
  # Lock the token pod down completely: no ingress, no egress. `opwork` reads the
  # token with `kubectl exec` (kubelet path, not pod networking), so the pod needs no
  # network. An empty rule (`- {}`) is Cilium's documented default-deny form: it puts
  # the endpoint under enforcement and allows nothing. `ingressDeny`/`egressDeny` are
  # not equivalent (explicit deny rules, and the old `ingress: []` made the CNP invalid:
  # "rule must have at least one of Ingress, IngressDeny, Egress, EgressDeny").
  ingress:
    - {}
  egress:
    - {}
