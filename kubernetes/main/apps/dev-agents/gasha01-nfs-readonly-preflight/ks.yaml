---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Disposable metadata-only NFS discovery; never a workspace acceptance result.
# Metadata receipt and actual init/main termination are captured privately.
# This cleanup keeps the same inventory owner while removing only its three objects.
# Prove Job/Pods/PVC/PV absence before removing the empty child registration.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gasha01-nfs-readonly-preflight
  namespace: dev-agents
spec:
  dependsOn:
    - name: dev-env-scheduling
      namespace: dev-env-system
  path: ./kubernetes/main/apps/dev-agents/gasha01-nfs-readonly-preflight/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  wait: true
  interval: 30m
  timeout: 4m
