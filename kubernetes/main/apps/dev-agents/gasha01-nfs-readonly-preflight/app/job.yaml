---
# One attempt, metadata only: no directory listing, file contents or NFS writes.
# Its exact image/template are frozen by .renovate/holds.json5; never upgrade or rerun it.
# Hard NFS kernel calls can outlive deadlines: prove termination before cleanup.
# Eligible worker labels were checked Ready and pressure-free before this proposal.
apiVersion: batch/v1
kind: Job
metadata:
  name: gasha01-nfs-readonly-discovery
  namespace: dev-agents
  labels: &id001
    app.kubernetes.io/name: gasha01-nfs-readonly-discovery
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels: *id001
    spec:
      restartPolicy: Never
      # Below household priority and never preempts; dev-env-scheduling supplies it.
      priorityClassName: dev-env-agent
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 15
      containers:
      - name: inspect
        image: ghcr.io/thaynes43/dev-env:2.10.0@sha256:a9b1fb9beea5ab38f606b3198843828727dfb21de345f8fd10e67dc1f59407cb
        command:
        - /bin/sh
        - -ec
        - exec timeout --signal=TERM --kill-after=2s 10s python3 -B -u -c "$READONLY_SCRIPT"
        env:
        - name: READONLY_SCRIPT
          value: |
            import os,json,stat,errno
            P="/mnt/preflight"
            def emit(x): print(json.dumps(x),flush=True)
            def phase(x): emit({"phase":x})
            phase("identity"); emit({"uid":os.getuid(),"gid":os.getgid()})
            if (os.getuid(),os.getgid()) != (1000,1000):
             emit({"refused":"UnexpectedIdentity"}); raise SystemExit(2)
            matched=False
            phase("mountinfo")
            for line in open("/proc/self/mountinfo"):
             parts=line.split(); sep=parts.index("-")
             if parts[4]==P:
              opts=[x for x in (parts[5]+","+parts[sep+3]).split(",") if not x.startswith(("addr=","clientaddr="))]
              matched=True
              if parts[sep+1] not in ("nfs","nfs4") or "ro" not in parts[5].split(",") or "vers=4.2" not in opts or "hard" not in opts:
               emit({"refused":"UnexpectedMountContract"}); raise SystemExit(2)
              emit({"filesystem":parts[sep+1],"mount_options":opts,"readonly":"ro" in parts[5].split(",")})
            if not matched:
             emit({"refused":"MissingNfsMount"}); raise SystemExit(2)
            phase("root_stat"); s=os.stat(P,follow_symlinks=False)
            emit({"root_uid":s.st_uid,"root_gid":s.st_gid,"root_mode":oct(stat.S_IMODE(s.st_mode)),"root_is_directory":stat.S_ISDIR(s.st_mode),"root_read_search_access":os.access(P,os.R_OK|os.X_OK)})
            phase("statfs"); v=os.statvfs(P)
            emit({"fragment_size":v.f_frsize,"total_blocks":v.f_blocks,"free_blocks":v.f_bfree,"available_blocks":v.f_bavail,"statfs_is_not_authoritative_directory_quota":True})
            phase("mountstats"); active=False
            for line in open("/proc/self/mountstats"):
             if line.startswith("device "):
              active=(" mounted on "+P+" ") in line; continue
             if active and line.lstrip().startswith(("events:","bytes:","xprt:","GETATTR:","ACCESS:","FSSTAT:","FSINFO:")):
              emit({"client_mountstats":line.strip()})
            for name in ("ceph.quota.max_bytes","ceph.quota.max_files"):
             phase("quota_xattr_"+name)
             try:
              value=os.getxattr(P,name,follow_symlinks=False).decode("ascii")
              emit({"quota_xattr":name,"value":int(value),"scope":"export-root attribute only; inherited quotas remain unproven"})
             except OSError as e: emit({"quota_xattr":name,"errno":e.errno,"status":"NotExposedOrUnreadable; not proof of no quota"})
             except (ValueError,UnicodeError): emit({"quota_xattr":name,"status":"Unparseable; no raw value retained"})
            emit({"completed":True,"filesystem_writes":0})
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: nfs
          mountPath: /mnt/preflight
          readOnly: true
      volumes:
      - name: nfs
        persistentVolumeClaim:
          claimName: gasha01-nfs-readonly-discovery
          readOnly: true
      enableServiceLinks: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                - w
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
              - key: node-role.kubernetes.io/master
                operator: DoesNotExist
              - key: haynesops.com/gpu-test
                operator: DoesNotExist
