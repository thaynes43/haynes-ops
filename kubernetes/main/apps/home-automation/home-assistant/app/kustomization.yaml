---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../../shared/components/common/repos/app-template
  - ../../../../../shared/components/gatus/gaurded
  - ../../../../../shared/components/volsync/aws
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ingressroutes.yaml
  - ./multus-iot.yaml
  - ./multus-sonos.yaml
configMapGenerator:
  - name: home-assistant-hnet-watch-maintenance
    files:
      - __init__.py=./resources/hnet_watch_maintenance/__init__.py
      - config_flow.py=./resources/hnet_watch_maintenance/config_flow.py
      - manifest.json=./resources/hnet_watch_maintenance/manifest.json
generatorOptions:
  disableNameSuffixHash: true
