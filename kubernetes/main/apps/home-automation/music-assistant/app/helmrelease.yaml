---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: music-assistant
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system
  values:
    controllers:
      music-assistant:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          nodeSelector:
            topology.kubernetes.io/zone: "m" # TODO select subnet
          hostNetwork: true
          #annotations:
          #  k8s.v1.cni.cncf.io/networks: static-sonos-mass
        containers:
          app:
            image:
              repository: ghcr.io/music-assistant/server
              tag: 2.10.4
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 100m
                memory: 2Gi
              limits:
                memory: 8Gi
    defaultPodOptions:
      # Runs the way upstream documents it (music-assistant.io "Installation": host network, /data,
      # and NO user override, cap_drop or privileged; the image has no USER line, so that means root
      # with the runtime's default capabilities). Owner ruling 2026-09-20: follow their documentation
      # rather than a hand-trimmed capability set. The uid-568 hardening broke AirPlay 2 multi-room
      # sync: "[PTP] Cannot bind UDP 319: Permission denied (privileged port; run as root for PTP)"
      # -> "sync ... degraded and members may drift" (KEF + Sonos groups played out of sync).
      # fsGroup and the RuntimeDefault seccomp profile stay: they do not conflict with upstream
      # (Docker applies its default seccomp profile too). Going back to uid 568 later needs a chown
      # of /data first: files written from now on are root-owned.
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      # http://music-assistant.home-automation.svc.cluster.local:8095
      # TODO need the official integration in a month cause this is getting weird https://github.com/music-assistant/hass-music-assistant/issues/3031 
      app:
        controller: music-assistant
        ports:
          http:
            port: 8095
    ingress:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/target: internal.haynesops
          external-dns.kubernetes.io/target: internal.haynesops
          # Homepage
          gethomepage.dev/href: &url "https://music-assistant.haynesops.com"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Home
          gethomepage.dev/name: Music Assistant
          gethomepage.dev/description: Home Assistant music server
          gethomepage.dev/icon: music-assistant
          gethomepage.dev/app: music-assistant
          gethomepage.dev/siteMonitor: *url
        className: traefik-internal
        hosts:
          - host: music-assistant.haynesops.com
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
    persistence:
      data:
        existingClaim: music-assistant
        advancedMounts:
          music-assistant:
            app:
              - path: /data
      music:
        type: nfs
        server: gasha01.haynesnetwork
        path: /hdd-nfs-repl
        advancedMounts:
          music-assistant:
            app:
              - path: /music
                subPath: data/media/music
                readOnly: true