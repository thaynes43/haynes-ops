---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
#
# cigar-mcp-hop -- a header-injecting reverse proxy that gives Home Assistant an
# in-cluster, no-auth hop to the cigar-journal MCP server.
#
# WHY IT EXISTS
#   Home Assistant's `mcp` integration (2026.9.2) has no static-bearer field and
#   cannot complete the PKCE OAuth flow cigar-journal's MCP server advertises.
#   The MCP app enforces a bearer token itself (packages/mcp/src/auth.ts), so the
#   only thing HA is missing is the Authorization header -- nginx adds it. The HA
#   pod can already reach cigar-journal-mcp.frontend directly (verified: it
#   answers the app's own 401, nothing in the network path blocks it).
#
# SCOPE: TEST (owner ruling, Tom 2026-09-22).
#   ClusterIP only. There is no ingress and there must never be one: anything that
#   can reach :8080 gets the journal with a full-scope token and no auth of its
#   own. The credential mounted here IS the dev-env consumer's full-scope service
#   token (cigar-journal ADR-011) -- the same one the agent pod uses. If this
#   becomes permanent, the follow-up is a dedicated read-only `home-assistant`
#   consumer token, not a wider blast radius on this one.
#
# NO GATUS ENDPOINT
#   Both gatus components probe a public https://<app>.haynesops.com URL. This app
#   deliberately has no ingress, so such a check would fail forever and page. The
#   kubelet probes below cover liveness.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cigar-mcp-hop
  annotations:
    # Same reason as the ConfigMap in kustomization.yaml: NGINX_ENVSUBST_FILTER's
    # trailing `$` anchor is load-bearing and must reach the container intact, so
    # keep Flux's postBuild envsubst off this document.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      cigar-mcp-hop:
        annotations:
          # The token is baked into the rendered nginx config at container start,
          # so a rotation in 1Password only takes effect on a restart.
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # nginx-unprivileged, not docker.io/library/nginx: the entrypoint
              # renders /etc/nginx/templates/*.template into /etc/nginx/conf.d,
              # which root owns in the stock image. The unprivileged variant is the
              # same entrypoint and the same template mechanism, built for uid 101
              # with a :8080 default listener.
              repository: docker.io/nginxinc/nginx-unprivileged
              tag: 1.31.6-alpine
            env:
              # Pins envsubst to this ONE name so nginx's own $variables survive
              # the render. See resources/default.conf.template.
              NGINX_ENVSUBST_FILTER: "^CIGAR_JOURNAL_TOKEN$"
              CIGAR_JOURNAL_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: cigar-mcp-hop-secret
                    key: CIGAR_JOURNAL_TOKEN
            probes:
              # /healthz is served by nginx itself and never touches the upstream:
              # a cigar-journal outage must not restart this pod.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        # uid/gid 101 is the `nginx` user in the unprivileged image. fsGroup makes
        # the emptyDirs below group-writable for it.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: cigar-mcp-hop
        ports:
          http:
            port: 8080
    persistence:
      nginx-template:
        type: configMap
        name: cigar-mcp-hop-nginx
        globalMounts:
          - path: /etc/nginx/templates/default.conf.template
            subPath: default.conf.template
            readOnly: true
      # readOnlyRootFilesystem needs three writable spots: the entrypoint renders
      # into conf.d, nginx writes its pid under /tmp, and proxy/client temp files
      # land under /var/cache/nginx.
      nginx-conf-d:
        type: emptyDir
        globalMounts:
          - path: /etc/nginx/conf.d
      nginx-cache:
        type: emptyDir
        globalMounts:
          - path: /var/cache/nginx
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
