---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
#
# Same 1Password item/field the dev-env agent pod reads (`dev-env-cigar` in
# namespace dev -> apps/dev/dev-env/app/externalsecret.yaml): a TOP-LEVEL field on
# the `dev-env` item, label matched exactly -- nested/section fields do not
# resolve, and a missing property fails the whole ExternalSecret. Nothing in
# 1Password changes for this app.
#
# Its own ExternalSecret carrying exactly one key, same isolation reasoning as
# dev-env-cigar: a mislabelled remoteRef here cannot take another app's secret
# down with it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cigar-mcp-hop
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cigar-mcp-hop-secret
    creationPolicy: Owner
  data:
    - secretKey: CIGAR_JOURNAL_TOKEN
      remoteRef: { key: dev-env, property: CIGAR_JOURNAL_TOKEN }
