---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ha-mcp
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      ha-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/homeassistant-ai/ha-mcp
              tag: 7.6.0
            command: ["ha-mcp-web"]
            args: []
            env:
              HOMEASSISTANT_URL: http://home-assistant.home-automation.svc.cluster.local:8123
              HOMEASSISTANT_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: ha-mcp-secret
                    key: HOMEASSISTANT_TOKEN
              MCP_PORT: "8086"
              MCP_SECRET_PATH:
                valueFrom:
                  secretKeyRef:
                    name: ha-mcp-secret
                    key: MCP_SECRET_PATH
            probes:
              # Exec probe over loopback instead of tcpSocket: a wedged event
              # loop still accepts TCP (see the 2026-08-12 z2m/open-webui
              # incidents) but cannot answer HTTP. ha-mcp has no health route --
              # any HTTP status (404 included) proves liveness, so HTTPError is
              # suppressed. Loopback is also immune to node/network blips like
              # 2026-08-13 10:31 ET, which false-failed network-path checks.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - python3
                      - -c
                      - |
                        import urllib.request, urllib.error, contextlib
                        with contextlib.suppress(urllib.error.HTTPError):
                            urllib.request.urlopen("http://localhost:8086/", timeout=5)
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 4
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                # Bumped 256Mi->512Mi with the limit bump below (2026-09-10).
                memory: 512Mi
              limits:
                # Bumped 512Mi->1Gi: container was OOMKilled 2026-06-20 at 512Mi. Audit 2026-07-07.
                # Bumped 1Gi->2Gi: OOMKilled 3x in 6 min at 1Gi on 2026-09-11 under
                # concurrent history/logbook MCP queries (#2837). Baseline ~95Mi.
                # Bumped 2Gi->4Gi after another OOMKill 2026-09-12 21:45Z. This is the FOURTH
                # bump, so read the two real causes before reaching for a fifth:
                #   1. A genuine slow leak. RSS climbs ~7-10Mi/hour, dead linear, uncorrelated
                #      with request volume: 95Mi -> ~790Mi over ~3 days, never plateaus, resets
                #      only on restart. Headroom is consumed just by uptime.
                #   2. Unbounded per-request allocation. A single ha_get_logs(source="error_log")
                #      with no `search` filter reads the whole HA log into memory and took the
                #      container from a 108Mi baseline through 2Gi in under 4 minutes — that is
                #      what actually killed it on 09-12, only ~4 min after a restart.
                # 4Gi buys headroom for (2) and delays (1); neither is fixed here. The real fix
                # is upstream: we are on 7.6.0 and latest stable is v8.4.3 (2026-09-04), but the
                # Renovate PR is stuck behind prConcurrentLimit (see the rate-limited dashboard).
                # Prefer landing that upgrade over a fifth bump.
                memory: 4Gi
    defaultPodOptions:
      # 2026-09-09: prefer bare-metal masters — all worker VMs share one Proxmox host (see incident)
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      securityContext:
        # The upstream image sets USER to a string ("mcpuser"), not a numeric UID.
        # With runAsNonRoot=true kubelet cannot verify the user is non-root and fails
        # CreateContainerConfigError. Rely on the image's non-root USER instead.
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: ha-mcp
        ports:
          http:
            port: 8086

