---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: appdaemon
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: appdaemon-secret
    template:
      engineVersion: v2
      data:
        TOKEN: "{{ .TOKEN }}"
        OPENAPI_TOKEN: "{{ .OPENAPI_TOKEN }}"
        HA_URL: "http://home-assistant.home-automation.svc.cluster.local:8123"
        MEDIA_FS_ROOT: "{{ .MEDIA_FS_ROOT }}"
        IMMICH_URL: "http://immich-server.photos.svc.cluster.local:2283"
        OLLAMA_URL: "http://ollama-assist02.ai.svc.cluster.local:11434"
        COMFYUI_URL: "http://comfyui.ai.svc.cluster.local:8188"
        IMMICH_API_KEY: "{{ .IMMICH_API_KEY }}"
        GEMINI_API_KEY: "{{ .GEMINI_API_KEY }}"
        VESTABOARD_IP: "{{ .VESTABOARD_IP }}"
        VESTABOARD_API_KEY: "{{ .VESTABOARD_API_KEY }}"
        MQTT_HOST: "{{ .MQTT_HOST }}"
        MQTT_USER: "{{ .MQTT_USER }}"
        MQTT_PASSWORD: "{{ .MQTT_PASSWORD }}"
        TAUTULLI_API_KEY: "{{ .TAUTULLI_API_KEY }}"
        TAUTULLI_URL: "{{ .TAUTULLI_URL }}"
        TMDB_API_KEY: "{{ .TMDB_API_KEY }}"
        SERPAPI_KEY: "{{ .SERPAPI_KEY }}"
        MDBLIST_API_KEY: "{{ .MDBLIST_API_KEY }}"
        SCHOOL_LUNCH: "{{ .SCHOOL_LUNCH }}"
        MIDDLE_ALL_EVENTS: "{{ .MIDDLE_ALL_EVENTS }}"
        MIDDLE_USER: "{{ .MIDDLE_USER }}"
        MIDDLE_PASSWORD: "{{ .MIDDLE_PASSWORD }}"
        POWER_SCHOOL: "{{ .POWER_SCHOOL }}"
        secrets.yaml: |
          ha_url: "http://home-assistant.home-automation.svc.cluster.local:8123"
          token: "{{ .TOKEN }}"
          mqtt_host: "{{ .MQTT_HOST }}"
          mqtt_user: "{{ .MQTT_USER }}"
          mqtt_password: "{{ .MQTT_PASSWORD }}"
        appdaemon.yaml: |
          appdaemon:
            time_zone: America/New_York
            latitude: 0
            longitude: 0
            elevation: 0

            plugins:
              HASS:
                type: hass
                ha_url: !secret ha_url
                token: !secret token
                ws_max_msg_size: 8388608
                ws_timeout: 60
              MQTT:
                type: mqtt
                namespace: mqtt
                # Start the apps even when the broker is down at boot.
                # AppDaemon's wait_for_plugins() is an unbounded
                # ALL_COMPLETED wait, so an unreachable EMQX blocks ALL 63
                # apps -- on 2026-09-09 that blanked the health dashboard and
                # every AppDaemon automation for 4h. force_start marks the
                # plugin ready on connect timeout and leaves paho's
                # background reconnect running, so MQTT self-heals when EMQX
                # returns with no AppDaemon restart. The 6 MQTT consumers all
                # wrap their calls in try/except, so the degraded window
                # shows up as the MQTT broker checker going critical -- which
                # pages -- instead of everything going silent.
                force_start: true
                client_host: !secret mqtt_host
                client_port: 1883
                client_user: !secret mqtt_user
                client_password: !secret mqtt_password
                client_topics:
                  - zigbee2mqtt/#
                  - appdaemon/health_check/#
          http:
            url: http://0.0.0.0:5050

          api:
          admin:
  dataFrom:
    - extract:
        key: appdaemon
