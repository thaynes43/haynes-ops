# Approved DB-only precursor for Story178. Select two fields from the existing
# HaynesKube/dev-env item; no whole-item extraction, session key, or migrator password.
# This projection does not create roles/databases or open the runtime HBA allow.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-v2-portal-runtime-db
  namespace: database
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 1h
  target:
    name: dev-env-v2-portal-runtime-db
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
      data:
        username: '{{ .DB_USERNAME }}'
        password: '{{ .DB_PASSWORD }}'
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: dev-env
        property: DB_USERNAME
    - secretKey: DB_PASSWORD
      remoteRef:
        key: dev-env
        property: DB_PASSWORD
