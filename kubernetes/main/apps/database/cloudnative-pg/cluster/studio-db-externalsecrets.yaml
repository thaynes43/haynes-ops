---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: studio-runtime-db
  namespace: database
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: studio-runtime-db
  namespace: database
spec:
  refreshPolicy: CreatedOnce
  target:
    name: studio-runtime-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: studio_app
        password: '{{ .password }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: studio-runtime-db
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: studio-migrator-db
  namespace: database
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: studio-migrator-db
  namespace: database
spec:
  refreshPolicy: CreatedOnce
  target:
    name: studio-migrator-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: studio_migrator
        password: '{{ .password }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: studio-migrator-db
