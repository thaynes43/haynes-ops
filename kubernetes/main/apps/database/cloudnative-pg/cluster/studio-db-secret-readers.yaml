---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: studio-runtime-db-reader
  namespace: database
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [studio-runtime-db]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: studio-runtime-db-reader
  namespace: database
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: studio-runtime-db-reader
subjects:
  - kind: ServiceAccount
    name: studio-runtime-db-reader
    namespace: ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: studio-migrator-db-reader
  namespace: database
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [studio-migrator-db]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: studio-migrator-db-reader
  namespace: database
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: studio-migrator-db-reader
subjects:
  - kind: ServiceAccount
    name: studio-migrator-db-reader
    namespace: ai
