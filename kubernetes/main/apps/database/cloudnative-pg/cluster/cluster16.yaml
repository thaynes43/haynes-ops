---
# yaml-language-server: $schema=https://gist.githubusercontent.com/thaynes43/21ef53eace2d3c6c8f00c8ee0fe4ec24/raw/b0fd8341723eee62b8a47127d40cb75f00056b67/empty-json-schema.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres16
spec:
  instances: 3
  minSyncReplicas: 0
  maxSyncReplicas: 0
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4-34
  primaryUpdateStrategy: unsupervised
  # A short network blip (e.g. the ~2min UDM auto-update reboot, 2026-07-29)
  # must not trigger a failover: the timeline switch can wedge a standby that
  # replayed past the fork point (CNPG never rewinds standbys → manual
  # destroy + re-clone is the only way back).
  failoverDelay: 120
  # Only count a replica Ready while it is actually streaming and near-current,
  # so a wedged/lagging replica drops out of the -r/-ro Services instead of
  # serving stale reads while the Cluster reports healthy.
  probes:
    readiness:
      type: streaming
      maximumLag: 64Mi
  storage:
    size: 100Gi
    storageClass: openebs-hostpath
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  # Story178 roles-only preproof stage: the two portal roles, exactly as
  # .agents/reports/portal178-m5c/pending/roles-stage-preproof.patch.yaml.
  # The six HBA rejects below still refuse both roles. The runtime hostssl
  # allow waits for the 010/020/030 proof; the migrator never gets one.
  managed:
    roles:
      - name: dev_env_v2_portal_runtime
        ensure: present
        login: true
        connectionLimit: 8
        inherit: false
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        inRoles: []
        passwordSecret:
          name: dev-env-v2-portal-runtime-db
      - name: dev_env_v2_portal_migrator
        ensure: present
        # Peer migration SET ROLE does not require LOGIN or a mounted password.
        login: false
        disablePassword: true
        connectionLimit: 1
        inherit: false
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        inRoles: []
  postgresql:
    parameters:
      max_connections: "400"
      shared_buffers: 256MB
    # Story178 M5D stage 1. These rejects precede CNPG's default
    # "host all all all scram-sha-256". No hostssl allow until the
    # 010/020/030 proof. The migrator has no allow line.
    pg_hba:
      - host replication dev_env_v2_portal_runtime,dev_env_v2_portal_migrator 0.0.0.0/0 reject
      - host replication dev_env_v2_portal_runtime,dev_env_v2_portal_migrator ::/0 reject
      - hostnossl all dev_env_v2_portal_runtime,dev_env_v2_portal_migrator 0.0.0.0/0 reject
      - hostnossl all dev_env_v2_portal_runtime,dev_env_v2_portal_migrator ::/0 reject
      - host all dev_env_v2_portal_runtime,dev_env_v2_portal_migrator 0.0.0.0/0 reject
      - host all dev_env_v2_portal_runtime,dev_env_v2_portal_migrator ::/0 reject
  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
  resources:
    requests:
      cpu: 1000m
    limits:
      memory: 8Gi
  monitoring:
    enablePodMonitor: true
  backup:
    retentionPolicy: 30d
    barmanObjectStore: &barmanObjectStore
      data:
        compression: bzip2
      wal:
        compression: bzip2
        maxParallel: 8
      destinationPath: s3://cnpg-haynesops/
      endpointURL: https://s3.us-east-2.amazonaws.com
      # Note: serverName version needs to be incremented
      # when recovering from an existing cnpg cluster
      serverName: &currentCluster postgres16-v6
      s3Credentials:
        accessKeyId:
          name: cloudnative-pg-secret
          key: aws-access-key-id
        secretAccessKey:
          name: cloudnative-pg-secret
          key: aws-secret-access-key
        region:
          name: cloudnative-pg-secret
          key: aws-region
  # Note: previousCluster needs to be set to the name of the previous
  # cluster when recovering from an existing cnpg cluster
  bootstrap:
    recovery:
      source: &previousCluster postgres16-v4
  # Note: externalClusters is needed when recovering from an existing cnpg cluster
  externalClusters:
    - name: *previousCluster
      barmanObjectStore:
        <<: *barmanObjectStore
        serverName: *previousCluster