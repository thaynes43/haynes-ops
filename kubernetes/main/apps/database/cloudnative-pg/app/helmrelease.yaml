---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: cloudnative-pg
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: openebs
      namespace: openebs-system
  values:
    crds:
      create: true
    # #3385: without requests the operator pod was BestEffort, and every
    # BestEffort pod on a node shares cpu.weight 1. On 2026-10-05 a runaway pod
    # saturated talosm02, the operator got no CPU, its 1s /readyz probe timed out
    # and the kubelet killed it in a loop (it also serves the CNPG admission
    # webhooks). A request makes it Burstable with a weight that follows the
    # request, so under contention it keeps at least about this much CPU.
    # Sized from Prometheus, 7 days to 2026-10-06: CPU p95 5m-rate 7m, 1m-rate
    # peak 17m; working set p95 89Mi, 30-day peak 355Mi.
    # No CPU limit; the memory limit is about 3x the 30-day peak.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 1Gi
    monitoring:
      podMonitorEnabled: false # TODO Monitoring
      grafanaDashboard:
        create: true