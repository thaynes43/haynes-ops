---
# yaml-language-server: $schema=https://kochhaus-schemas.pages.dev/dragonflydb.io/dragonfly_v1alpha1.json
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly
spec:
  image: ghcr.io/dragonflydb/dragonfly:v2.0.0@sha256:7426fdb31ddcf7bd9499b4205f36ebaa83b26149ba1609a0d5f8f474b3631233
  replicas: 2
  # No networkPolicyEnabled: operator v1.7.0 removed the field (and the operator-managed
  # NetworkPolicy) from the CRD, and SSA rejects an undeclared field. It was `false`
  # here anyway, so behaviour is unchanged. Safe to drop in the same change as the
  # operator bump: this Kustomization dependsOn `dragonfly` (wait: true), so the CR
  # only applies once v1.7.0 runs. v1.6.x read an unset field as `true`.
  env:
    - name: MAX_MEMORY
      value: 2048Mi
  args:
    - --maxmemory=2048Mi
    - --proactor_threads=2
    - --lock_on_hashtags
    - --default_lua_flags=allow-undeclared-keys
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 2048Mi
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: "kubernetes.io/hostname"
      whenUnsatisfiable: "DoNotSchedule"
      labelSelector:
        matchLabels:
          app.kubernetes.io/part-of: dragonfly
