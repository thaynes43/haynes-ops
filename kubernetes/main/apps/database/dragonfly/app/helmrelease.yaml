---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dragonfly-operator
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: dragonfly-operator
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # The retired app-template Deployment was also named "dragonfly-operator";
    # spec.selector is immutable, so the chart's Deployment needs a different
    # name — helm removes the old one and creates this one in the same upgrade.
    fullnameOverride: dragonfly-operator-controller
    crds:
      # Templated CRD: upgraded on every chart bump (no build-time remote fetch,
      # no hand-synced crd.yaml), kept on uninstall via helm.sh/resource-policy.
      install: true
      keep: true
    # No kube-rbac-proxy sidecar — metrics stay plain HTTP :8080 for the
    # ServiceMonitor below, same as the previous app-template setup.
    rbacProxy:
      enabled: false
    manager:
      image:
        repository: ghcr.io/dragonflydb/operator
      extraArgs:
        # Only defaulted by the chart when the rbac-proxy is enabled.
        - --metrics-bind-address=:8080
      resources:
        requests:
          cpu: 10m
        limits:
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: [ALL] }
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    serviceMonitor:
      enabled: true
      interval: 1m
