---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The broker's one user. It comes from the SAME 1Password item and keys that EMQX
# bootstrapped its `admin` superuser from (item `emqx`, X_EMQX_MQTT_USERNAME /
# X_EMQX_MQTT_PASSWORD), so zigbee2mqtt, Home Assistant and AppDaemon keep their
# existing credentials. The item keeps its old name: renaming it means editing every
# client ExternalSecret that extracts it, for no gain.
#
# `passwd` is a PLAINTEXT mosquitto password file (`user:password`). The
# hash-passwords initContainer copies it into an emptyDir and hashes it there with
# `mosquitto_passwd -U`; the broker only ever loads the hashed copy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mosquitto
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mosquitto-secret
    template:
      engineVersion: v2
      data:
        passwd: |
          {{ .X_EMQX_MQTT_USERNAME }}:{{ .X_EMQX_MQTT_PASSWORD }}
  dataFrom:
    - extract:
        key: emqx
