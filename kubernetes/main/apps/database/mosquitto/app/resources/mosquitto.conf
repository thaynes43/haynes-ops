# Mosquitto 2.1 -- the house MQTT broker (replaced EMQX, haynes-ops#3395).
# Runbook: .agents/runbooks/mqtt-broker.md
#
# One listener, plain MQTT on 1883, in-cluster only. Nothing used EMQX's TLS
# (8883) or websocket (8083/8084) listeners.
listener 1883
protocol mqtt

# Auth: password required, no anonymous clients. The password file is the
# hashed copy the initContainer writes into an emptyDir. There is no ACL, so
# every authenticated user can publish and subscribe to everything, which is
# what EMQX's single `admin` superuser had.
allow_anonymous false
plugin /usr/lib/mosquitto_password_file.so
plugin_opt_password_file /mosquitto/auth/passwd

# Retained store survives a restart: Home Assistant's ~7,400 discovery configs
# and zigbee2mqtt's device state are retained messages. Saved every 60 s and on
# SIGTERM.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# 2.1 lowered the default to 2,000,000 bytes. zigbee2mqtt's retained
# zigbee2mqtt/bridge/devices is about 3.7 MB and grows with the device count.
# 32 MiB leaves room; z2m itself caps what it accepts at 10 MiB
# (ZIGBEE2MQTT_CONFIG_MQTT_MAXIMUM_PACKET_SIZE).
max_packet_size 33554432

# Also caps QoS 0 delivery: a client whose outgoing packet queue holds this many
# packets gets further QoS 0 messages DROPPED. Home Assistant subscribes to
# homeassistant/# and receives every retained discovery config (~7,400) in one
# burst, which the default of 1000 can cut short. EMQX's retainer limiter did the
# same thing on 2026-09-09 (retained_fetch_rate_limit_exceeded). Every client
# here is trusted and authenticated, so a high cap is safe.
max_queued_messages 100000

log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S
