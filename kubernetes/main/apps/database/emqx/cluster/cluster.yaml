---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/apps.emqx.io/emqx_v2beta1.json
apiVersion: apps.emqx.io/v2beta1
kind: EMQX
metadata:
  name: emqx
spec:
  # Pinned to 6.2.0 — HELD, do not bump. 6.2.1+ crash-loops at boot with
  # SINGLE_NODE_LICENSE: the built-in single-node COMMUNITY (free) license aborts
  # emqx_license. Root cause is NOT the broker (and NOT 6.2.2, the earlier theory)
  # — it's the emqx-OPERATOR blue-green upgrade forming a transient 2-node cluster
  # that the single-node license rejects (maintainer-confirmed, emqx/emqx#17600).
  # Fix = emqx-operator 3.0.0; lift this pin only AFTER the operator is on 3.0.0.
  # Enforced + fully reasoned in .renovate/holds.json5. Rolled back 2026-06-15 (#1841).
  image: docker.io/emqx/emqx:6.2.0
  config:
    data: |
      mqtt {
        max_packet_size = 256MB
      }
      retainer {
        max_payload_size = 4MB
        backend {
          type = built_in_database
          storage_type = disc
        }
      }
      authentication {
        backend = "built_in_database"
        mechanism = "password_based"
        password_hash_algorithm {
            name = "bcrypt"
        }
        user_id_type = "username"
        bootstrap_file = "/opt/init-user.json"
        bootstrap_type = "plain"
      }
      authorization {
        sources = [
          {
            type = built_in_database
            enable = true
          }
        ]
        no_match: "deny"
      }
  coreTemplate:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      replicas: 1
      # DRAIN UNBLOCKER (2026-08-23). add_pdb.go in operator 2.3.1 creates the
      # emqx-core PDB *unconditionally*, copying nil min/max into an EMPTY spec.
      # The k8s disruption controller then can't compute an expected count, leaves
      # expectedCount=0, and clamps disruptionsAllowed to 0 — permanently. Live
      # proof before this change: `kubectl -n database get pdb emqx-core -o
      # jsonpath={.spec}` returned ONLY a selector, and status.disruptionsAllowed
      # was 0. That vetoed EVERY node drain; the 2026-08-21 Talos roll had to
      # `kubectl delete pod` past it by hand, and hand-deleting the PDB is futile
      # because the operator's CreateOrUpdateList recreates it each reconcile.
      # Setting maxUnavailable gives the controller a real budget -> allowed=1.
      #
      # NOT a blue-green trigger, which matters a great deal here: the broker is
      # pinned to 6.2.0 because the operator's blue-green upgrade forms a transient
      # 2-node cluster that the single-node COMMUNITY license aborts
      # (SINGLE_NODE_LICENSE, emqx/emqx#17600). computeHash() and
      # justCheckPodTemplate() both consider spec.template ONLY, and min/max never
      # enter the pod template — so no new StatefulSet and no crash-loop.
      #
      # NOTE for the operator 3.0 lift: 3.0 REMOVES PDB support entirely (no
      # add_pdb.go), and v3beta1's maxUnavailable is an unrelated replicant
      # rolling-update knob. This key must be DELETED at that upgrade, not carried
      # forward. (Auto-delete-when-unset arrives in 2.3.3-rc.1, not 3.0.)
      maxUnavailable: 1
      envFrom:
        - secretRef:
            name: emqx-secret
      extraVolumeMounts:
        - name: init-user
          mountPath: /opt/init-user.json
          subPath: init-user.json
          readOnly: true
      extraVolumes:
        - name: init-user
          secret:
            secretName: emqx-init-user-secret
      volumeClaimTemplates:
        accessModes: [ReadWriteOnce]
        storageClassName: ceph-block
        resources:
          requests:
            storage: 8Gi
  listenersServiceTemplate:
    metadata:
      annotations:
        lbipam.cilium.io/ips: 192.168.40.205
    spec:
      type: LoadBalancer
