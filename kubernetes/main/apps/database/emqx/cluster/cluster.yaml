---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/apps.emqx.io/emqx_v2beta1.json
apiVersion: apps.emqx.io/v2beta1
kind: EMQX
metadata:
  name: emqx
  annotations:
    # PINNED to spec.config.data (same YAML anchor) — this disables the
    # operator's runtime hot-apply on purpose. emqx-operator 2.3.1 re-prints
    # config.data through go-hocon before PUT /api/v5/configs and EMQX 6.2.0
    # rejects the result (`HTTP 400 parse_error "syntax error before: \"\""`,
    # every reconcile, 2026-09-09) — the same raw text is accepted with 200.
    # In June the same path silently clobbered retainer.max_payload_size back
    # to 1MB. With annotation == spec the operator sees "nothing to apply" and
    # the reconcile loop stays green. Consequence: a config.data edit reaches
    # the broker ONLY via base.hocon at the reloader restart, and only for keys
    # not already overridden in data/configs/cluster.hocon — so apply runtime
    # keys through the API first, per .agents/runbooks/emqx-config-drift.md.
    apps.emqx.io/last-emqx-configuration: &emqx_config |
      mqtt {
        max_packet_size = 256MB
      }
      retainer {
        max_payload_size = 8MB
        delivery_rate = "infinity"
        max_publish_rate = "infinity"
        backend {
          type = built_in_database
          storage_type = disc
        }
      }
      authentication {
        backend = "built_in_database"
        mechanism = "password_based"
        password_hash_algorithm {
            name = "bcrypt"
        }
        user_id_type = "username"
        bootstrap_file = "/opt/init-user.json"
        bootstrap_type = "plain"
      }
      authorization {
        sources = [
          {
            type = built_in_database
            enable = true
          }
        ]
        no_match: "deny"
      }
spec:
  # Pinned to 6.2.0 — HELD, do not bump. 6.2.1+ crash-loops at boot with
  # SINGLE_NODE_LICENSE: the built-in single-node COMMUNITY (free) license aborts
  # emqx_license. Root cause is NOT the broker (and NOT 6.2.2, the earlier theory)
  # — it's the emqx-OPERATOR blue-green upgrade forming a transient 2-node cluster
  # that the single-node license rejects (maintainer-confirmed, emqx/emqx#17600).
  # Fix = emqx-operator 3.0.0; lift this pin only AFTER the operator is on 3.0.0.
  # Enforced + fully reasoned in .renovate/holds.json5. Rolled back 2026-06-15 (#1841).
  image: docker.io/emqx/emqx:6.2.0
  # NO COMMENTS INSIDE config.data. The operator re-serializes this HOCON and
  # hot-applies it with PUT /api/v5/configs?mode=merge; with `#` comment lines
  # in the block EMQX answered `HTTP 400 parse_error "syntax error before: \"\""`
  # on every reconcile (2026-09-09), the hot-apply never landed and the operator's
  # reconcile loop stayed red. Keep the block plain; explain things here.
  #
  # retainer (2026-09-09): 8MB — the retained zigbee2mqtt/bridge/devices payload is
  # already 3.7MB and grows with the device count; 4MB left ~10% headroom.
  # delivery_rate / max_publish_rate = infinity: Home Assistant re-fetches ~7,400
  # retained homeassistant/# discovery configs on every reconnect, and the default
  # 1000/s limiter ABORTS that fetch (retained_fetch_rate_limit_exceeded →
  # entities/groups "unavailable" after a broker or HA restart). One broker, one
  # house: no limiter.
  #
  # DRIFT WARNING — read .agents/runbooks/emqx-config-drift.md before trusting
  # this block. The running broker keeps hot-applied overrides in
  # data/configs/cluster.hocon on its PVC, and those WIN over this file at boot
  # (that is how git said 4MB while the broker enforced 1MB from 2026-06-05 to
  # 2026-09-09). `emqx ctl conf show retainer` is the truth, this file is the
  # intent — keep them equal. Editing this block restarts the core pod (reloader).
  config:
    # The HOCON text itself lives under metadata.annotations above (YAML
    # anchors must be defined before use); this is the same string.
    data: *emqx_config
  coreTemplate:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      replicas: 1
      # 2026-09-09: prefer bare-metal masters — all worker VMs share one Proxmox
      # cluster that fenced wholesale this morning (see the incident report);
      # the broker was on talosw02 and took Zigbee2MQTT, every Zigbee automation
      # and the whole of AppDaemon down with it for 3.5 h. Soft preference only.
      # This IS a pod-template change → the operator blue-greens the core (new
      # StatefulSet, transient 2-node cluster, ~1–2 min MQTT bounce, z2m restart
      # after). Planned window; procedure in .agents/runbooks/emqx-config-drift.md.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      # DRAIN UNBLOCKER (2026-08-23). add_pdb.go in operator 2.3.1 creates the
      # emqx-core PDB *unconditionally*, copying nil min/max into an EMPTY spec.
      # The k8s disruption controller then can't compute an expected count, leaves
      # expectedCount=0, and clamps disruptionsAllowed to 0 — permanently. Live
      # proof before this change: `kubectl -n database get pdb emqx-core -o
      # jsonpath={.spec}` returned ONLY a selector, and status.disruptionsAllowed
      # was 0. That vetoed EVERY node drain; the 2026-08-21 Talos roll had to
      # `kubectl delete pod` past it by hand, and hand-deleting the PDB is futile
      # because the operator's CreateOrUpdateList recreates it each reconcile.
      # Setting maxUnavailable gives the controller a real budget -> allowed=1.
      #
      # NOT a blue-green trigger, which matters a great deal here: the broker is
      # pinned to 6.2.0 because the operator's blue-green upgrade forms a transient
      # 2-node cluster that the single-node COMMUNITY license aborts
      # (SINGLE_NODE_LICENSE, emqx/emqx#17600). computeHash() and
      # justCheckPodTemplate() both consider spec.template ONLY, and min/max never
      # enter the pod template — so no new StatefulSet and no crash-loop.
      #
      # NOTE for the operator 3.0 lift: 3.0 REMOVES PDB support entirely (no
      # add_pdb.go), and v3beta1's maxUnavailable is an unrelated replicant
      # rolling-update knob. This key must be DELETED at that upgrade, not carried
      # forward. (Auto-delete-when-unset arrives in 2.3.3-rc.1, not 3.0.)
      maxUnavailable: 1
      envFrom:
        - secretRef:
            name: emqx-secret
      extraVolumeMounts:
        - name: init-user
          mountPath: /opt/init-user.json
          subPath: init-user.json
          readOnly: true
      extraVolumes:
        - name: init-user
          secret:
            secretName: emqx-init-user-secret
      volumeClaimTemplates:
        accessModes: [ReadWriteOnce]
        storageClassName: ceph-block
        resources:
          requests:
            storage: 8Gi
  listenersServiceTemplate:
    metadata:
      annotations:
        lbipam.cilium.io/ips: 192.168.40.205
    spec:
      type: LoadBalancer
