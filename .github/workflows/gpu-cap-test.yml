---
name: Card B startup cap tests
on:
  pull_request:
    branches: [main]
    paths:
      - kubernetes/main/apps/ai/llama-server/**
      - kubernetes/main/apps/kyverno/policies/app/exceptions/llama-card-b-power-cap.yaml
      - scripts/gpu-soak/render-job.sh
      - scripts/tests/gpu-cap/**
      - .github/workflows/gpu-cap-test.yml
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    name: Card B Cap Fixtures
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify no-load and fail-closed behavior without a GPU
        run: |
          sh -n kubernetes/main/apps/ai/llama-server/app/card-b-power-cap.sh
          bash -n scripts/gpu-soak/render-job.sh
          nice -n 19 python3 -I -B scripts/tests/gpu-cap/test_cap.py -v
