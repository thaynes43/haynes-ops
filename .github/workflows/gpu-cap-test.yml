---
name: Card B startup cap tests
on:
  pull_request:
    branches: [main]
    paths:
      - kubernetes/main/apps/ai/llama-server/**
      - kubernetes/main/apps/kyverno/policies/app/exceptions/llama-card-b-power-cap.yaml
      - kubernetes/main/apps/kyverno/policies/app/pod-security-baseline.yaml
      - scripts/gpu-soak/render-job.sh
      - scripts/tests/gpu-cap/**
      - .github/workflows/gpu-cap-test.yml
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    name: Card B Cap Fixtures
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify no-load and fail-closed behavior without a GPU
        run: |
          sh -n kubernetes/main/apps/ai/llama-server/app/card-b-power-cap.sh
          bash -n scripts/gpu-soak/render-job.sh
          nice -n 19 python3 -I -B scripts/tests/gpu-cap/test_cap.py -v
      - name: Prepare pinned offline policy tools
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          helm pull oci://ghcr.io/bjw-s-labs/helm/app-template --version 5.3.0 --destination "$RUNNER_TEMP"
          curl --fail --silent --show-error --location https://github.com/kyverno/kyverno/releases/download/v1.19.2/kyverno-cli_v1.19.2_linux_x86_64.tar.gz -o "$RUNNER_TEMP/kyverno.tar.gz"
          echo "357eaf1df8bc24ddd5a73979fadeaae6a032e8710f11af264229756e4956bf4a  $RUNNER_TEMP/kyverno.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/kyverno.tar.gz" -C "$RUNNER_TEMP" kyverno
      - name: Verify script binding and actual admission decisions offline
        env:
          GPU_CAP_CHART: ${{ runner.temp }}/app-template-5.3.0.tgz
          GPU_CAP_KYVERNO: ${{ runner.temp }}/kyverno
          GOMAXPROCS: "2"
        run: nice -n 19 python3 -I -B scripts/tests/gpu-cap/test_binding.py -v
