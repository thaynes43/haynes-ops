---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# PR disposition labeler — makes the auto-merge board visible on the PR list itself,
# so "which merges itself vs which is waiting for me" is readable at a glance (the
# renovate/type labels don't tell you). Labels each OPEN Renovate PR with exactly one:
#
#   disposition:auto-merge  — GitHub auto-merge is enabled (Renovate Tier-0/2); it merges
#                             itself when checks go green. Nothing for you to do.
#   disposition:shepherd    — a shepherd-ramp component (coredns/traefik/multus/
#                             device-plugins/flux, ramp-infra patch/minor, or an immich
#                             major); the upgrade-shepherd run vets + auto-merges it.
#                             Nothing for you — and this label is VERDICT-AWARE: once the
#                             shepherd records a vet at the PR's current head, the label
#                             follows the verdict instead of lying "handled".
#   disposition:stranded    — needs ATTENTION: a shepherd HOLD (automation wanted to merge
#                             but a gap blocked it — fix the gap), a cluster-breaker, or a
#                             major that deserves release-note eyes before merging.
#   disposition:manual-only — requires a supervised merge: repository tooling,
#                             image compatibility checks, a chosen restart window,
#                             or a bump the shepherd ruled OUT-OF-SCOPE.
#                             (2026-07-17, split out of stranded so the two are separable).
#
# Read-only classification; only manipulates its own four labels. Runs on a schedule
# (catches Renovate enabling auto-merge after it re-evaluates) + on demand.
name: PR Disposition

on:
  schedule:
    - cron: '17 */2 * * *'   # every 2h at :17
  workflow_dispatch: {}

concurrency:
  group: pr-disposition
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label open Renovate PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const OWNER = context.repo.owner, REPO = context.repo.repo;
            // ── policy mirrors (keep in sync with .renovate/autoMerge.json5 + the
            //    shepherd HR UPGRADE_AGENT_PREFILTER_GLOBS) ────────────────────────────
            // Renovate Tier-2 auto-merges minor/patch/digest in these leaf-app domains:
            const TIER2_DOMAINS = ['media','ai','downloads','frontend','office','photos','observability','home-automation'];
            // ...and these curated kube-system/network leaves (by <domain>/<app>):
            const CURATED_LEAVES = ['kube-system/metrics-server','kube-system/reloader','kube-system/reflector','kube-system/k8tz','kube-system/spegel','network/cloudflare-ddns','network/cloudflare-tunnel','network/cloudflare-tunnel-sigoalumni','external-secrets/external-secrets','external-secrets/onepassword-connect'];
            // Shepherd-ramp clean-tier prefixes (shepherd auto-merges these, incl. minor):
            const RAMP_CLEAN = [
              'kubernetes/main/apps/kube-system/coredns/',
              'kubernetes/main/apps/network/traefik/','kubernetes/main/apps/network/multus/',
              'kubernetes/main/apps/kube-system/intel-device-plugin/',
              'kubernetes/main/apps/kube-system/nvidia-device-plugin/','kubernetes/main/flux/',
              // plex (2026-07-19) is shepherd-owned (Renovate carves it out; the shepherd
              // merges it after a Kometa-idle preflight) — label it shepherd, not auto-merge.
              'kubernetes/main/apps/media/plex/',
            ];
            const IMMICH = 'kubernetes/main/apps/photos/immich/';
            // Revertible cluster-infra ramp (2026-07-08): shepherd auto-merges PATCH/
            // safe-minor here (backup/health-gated + auto-revert); one-way MAJORS it
            // authors for human confirm. Prefix list mirrors ramp_globs_for.
            const RAMP_INFRA = [
              'kubernetes/main/apps/storage/rook-ceph/rook-ceph/',
              'kubernetes/main/apps/database/cloudnative-pg/',
              'kubernetes/main/apps/database/dragonfly/',
              'kubernetes/main/apps/kube-system/cilium/',
              'kubernetes/main/apps/network/authentik/',
              'kubernetes/main/apps/cert-manager/cert-manager/',
            ];
            // ── Name-matched Renovate carve-outs (mirror the matchPackageNames rules
            //    in .renovate/autoMerge.json5; KEEP IN SYNC) ─────────────────────────
            // Renovate evaluates packageRules per-dep with LAST-RULE-WINS, so a
            // name-matched `automerge:false` carve-out OVERRIDES the domain/leaf
            // path-tier above. The tier2Path/ownImage PREDICTION is otherwise carve-out
            // BLIND: it labeled these "auto-merge / Renovate owns it" when Renovate will
            // never touch them (qbittorrent #2132 stranded 5 days on a "left-for-renovate"
            // vet while its whole-package automerge:false meant Renovate never would).
            // Conservative direction: when Renovate will NOT auto-merge, force manual-only
            // (or shepherd where the shepherd owns it) — NEVER claim auto-merge. Matched by
            // each package's unique app path.
            const CARVEOUTS = [
              // Later group overrides keep HA, its companion, and Zigbee2MQTT supervised.
              { re: /^kubernetes\/[^/]+\/apps\/home-automation\/(home-assistant|ha-mcp|zigbee2mqtt)\//, dispo: 'disposition:manual-only' },
              // plex — automerge:false; the upgrade-shepherd owns it (Kometa-idle preflight).
              { re: /^kubernetes\/[^/]+\/apps\/media\/plex\//, dispo: 'disposition:shepherd', skipMajor: true },
              // dev-env — automerge:false, NEVER (pod Recreate kills in-flight agent
              // sessions); not shepherd-owned → a mindless human merge at a chosen moment.
              { re: /^kubernetes\/[^/]+\/apps\/dev\/dev-env\//, dispo: 'disposition:manual-only' },
              // dev-env v2 — the same automerge:false rule matches its image by package name
              // wherever it is pinned: dev-env-system templates.yaml (new agent Sessions) and
              // the shelf. Without this, an ownImage bump there was labelled auto-merge although
              // Renovate never enables it (haynes-ops #3710, 2026-10-13). A bump there must also
              // follow the dev-env deploy order (AgentSession CRD, operator, then templates).
              { re: /^kubernetes\/[^/]+\/apps\/dev-env-system\//, dispo: 'disposition:manual-only' },
              // comfyui — automerge:false (our own image; a restart is a cold model load and a
              // new ComfyUI version needs a render check) → supervised merge.
              { re: /^kubernetes\/[^/]+\/apps\/ai\/stable-diffusion\/comfyui\//, dispo: 'disposition:manual-only' },
              // qbittorrent — PATCH auto-merges within the MAM-approved minor line (let the
              // path-tier prediction handle it); MINOR/MAJOR/digest are automerge:false → manual.
              { re: /^kubernetes\/[^/]+\/apps\/downloads\/qbittorrent\//, dispo: 'disposition:manual-only', patchAuto: true },
              // LazyLibrarian + calibre — source overlays/converter checks must be
              // reviewed before merging either image (both live in this app path).
              { re: /^kubernetes\/[^/]+\/apps\/downloads\/lazylibrarian\//, dispo: 'disposition:manual-only' },
              // Kometa — revalidate the guarded daily IMDb dataset compatibility
              // path against the proposed image before merging.
              { re: /^kubernetes\/[^/]+\/apps\/media\/kometa\//, dispo: 'disposition:manual-only' },
            ];
            const DISPOS = ['disposition:auto-merge', 'disposition:shepherd', 'disposition:stranded', 'disposition:manual-only'];
            const isRenovate = login => login === 'renovate[bot]';
            const VET_AUTHOR = 'haynes-ops-bot[bot]';
            const isShepherd = pr => pr.user?.login === VET_AUTHOR && pr.head?.ref?.startsWith('shepherd/');
            const tier2Path = p => {
              const m = p.match(/^kubernetes\/[^/]+\/apps\/([^/]+)\/(.+)$/);
              return !!m && (TIER2_DOMAINS.includes(m[1]) || CURATED_LEAVES.includes(m[1] + '/' + m[2].split('/')[0]));
            };
            const mergeState = pr => {
              if (!Object.hasOwn(pr, 'auto_merge')) return 'Unknown';
              if (pr.auto_merge === null) return 'disabled';
              const m = pr.auto_merge;
              return m && typeof m === 'object' && !Array.isArray(m) &&
                typeof m.enabled_by?.login === 'string' && m.enabled_by.login.length > 0 &&
                typeof m.commit_title === 'string' && typeof m.commit_message === 'string' &&
                ['merge','squash','rebase'].includes(m.merge_method) ? 'enabled' : 'Unknown';
            };
            const labelKey = labels => Array.isArray(labels) && labels.every(l => typeof l?.name === 'string')
              ? JSON.stringify(labels.map(l => l.name).sort()) : null;
            const listed = await github.paginate(github.rest.pulls.list, { owner: OWNER, repo: REPO, state: 'open', per_page: 100 });
            if (!Array.isArray(listed)) throw new Error('PR list incomplete; no classification');
            let n = 0;
            for (const item of listed) {
              const logOnly = isShepherd(item);
              if (!isRenovate(item.user?.login) && !logOnly) continue;
              let pr, files, comments;
              try {
                ({ data: pr } = await github.rest.pulls.get({ owner: OWNER, repo: REPO, pull_number: item.number }));
                if (!pr || pr.number !== item.number || pr.state !== 'open' || !(logOnly ? isShepherd(pr) : isRenovate(pr.user?.login))) throw new Error('PR identity/state unavailable');
                if (!/^[0-9a-f]{40}$/.test(pr.head?.sha || '') || typeof pr.head?.ref !== 'string' || typeof pr.title !== 'string' || labelKey(pr.labels) === null) throw new Error('PR fields incomplete');
                files = await github.paginate(github.rest.pulls.listFiles, { owner: OWNER, repo: REPO, pull_number: pr.number, per_page: 100 });
                comments = await github.paginate(github.rest.issues.listComments, { owner: OWNER, repo: REPO, issue_number: pr.number, per_page: 100 });
                if (!Number.isSafeInteger(pr.changed_files) || pr.changed_files < 0 || !Array.isArray(files) || files.length !== pr.changed_files || !files.every(f => typeof f?.filename === 'string' && f.filename.length > 0)) throw new Error('file list incomplete');
                if (!Number.isSafeInteger(pr.comments) || pr.comments < 0 || !Array.isArray(comments) || comments.length !== pr.comments || !comments.every(c => c && typeof c === 'object' && typeof c.body === 'string')) throw new Error('comment list incomplete');
                const { data: latest } = await github.rest.pulls.get({ owner: OWNER, repo: REPO, pull_number: pr.number });
                if (latest?.number !== pr.number || latest.state !== 'open' || latest.user?.login !== pr.user.login ||
                    latest.head?.sha !== pr.head.sha || latest.head?.ref !== pr.head.ref || latest.title !== pr.title ||
                    latest.changed_files !== pr.changed_files || latest.comments !== pr.comments ||
                    labelKey(latest.labels) !== labelKey(pr.labels) ||
                    JSON.stringify(latest.auto_merge) !== JSON.stringify(pr.auto_merge)) throw new Error('PR changed during reads');
              } catch (error) {
                core.warning(`#${item.number} actual=Unknown reason=read-failure; no label changes`);
                continue;
              }
              // Reuse the exact-head vet read for provenance; prediction is never a claim.
              let verdict = null, vet = null;
              for (const c of comments) {
                if (c.user?.login !== VET_AUTHOR) continue;
                const m = c.body.match(/^<!-- shepherd-vet sha=([0-9a-f]{40}) -->\s*\n+\s*VERDICT:\s*([A-Za-z-]+)/);
                if (m && m[1] === pr.head.sha) {
                  verdict = m[2].toUpperCase();
                  vet = { commentId: c.id, sha: m[1], verdict };
                }
              }
              const provenance = {
                repository: `${OWNER}/${REPO}`,
                attempt: { headSha: pr.head.sha, vet },
                claim: 'Unknown', claimBasis: 'no-supported-upgrade-claim-actor',
              };
              if (logOnly) {
                core.info(JSON.stringify({ pullRequest: pr.number, ...provenance, disposition: null, labelPolicy: 'not-classified' }));
                continue;
              }
              n++;
              const paths = files.map(f => f.filename);
              const labelNames = pr.labels.map(l => l.name);
              const isMajor = labelNames.includes('type/major'), isDigest = labelNames.includes('type/digest');
              const brtitle = (pr.head.ref + ' ' + pr.title).toLowerCase();
              const allTier2 = paths.length > 0 && paths.every(tier2Path);
              const ownImage = /thaynes43/.test(brtitle) || /kube-prometheus-stack/.test(brtitle);
              const ghActions = paths.length > 0 && paths.every(p => p.startsWith('.github/'));
              const nonK8s = paths.length > 0 && !ghActions && !paths.some(p => p.startsWith('kubernetes/'));
              // Any manual member keeps a mixed update supervised, regardless of rule order.
              let carve = null;
              for (const c of CARVEOUTS) {
                if (!paths.some(p => c.re.test(p)) || (c.skipMajor && isMajor) || (c.patchAuto && labelNames.includes('type/patch'))) continue;
                carve = c.dispo;
                if (carve === 'disposition:manual-only') break;
              }
              const actual = mergeState(pr);
              let want, reason, predictedOwner = 'Unknown';
              if (actual === 'Unknown') {
                want = 'disposition:stranded'; reason = 'merge-state-unavailable';
              } else if (actual === 'enabled') {
                want = 'disposition:auto-merge'; reason = 'merge-request-enabled'; predictedOwner = 'GitHub';
                if (verdict === 'HOLD') core.warning(`#${pr.number} current-head hold conflicts with enabled auto-merge; no merge state changed`);
              } else if (verdict === 'HOLD') {
                want = 'disposition:stranded'; reason = 'current-head-hold'; predictedOwner = 'Shepherd';
              } else if (verdict && verdict !== 'AUTO-MERGE') {
                want = 'disposition:manual-only'; reason = 'current-head-declined'; predictedOwner = 'Manual';
              } else if (carve) {
                want = carve; reason = 'known-policy-carve-out'; predictedOwner = carve === 'disposition:shepherd' ? 'Shepherd' : 'Manual';
              } else if (verdict === 'AUTO-MERGE' || (isMajor && paths.some(p => p.startsWith(IMMICH)))) {
                want = 'disposition:shepherd'; reason = 'shepherd-owned'; predictedOwner = 'Shepherd';
              } else if ((ghActions && !isDigest) || (!isMajor && (allTier2 || ownImage))) {
                want = 'disposition:stranded'; reason = 'eligible-without-merge-request'; predictedOwner = 'Renovate';
              } else if (!isMajor && paths.some(p => RAMP_CLEAN.some(r => p.startsWith(r)) || RAMP_INFRA.some(r => p.startsWith(r)))) {
                want = 'disposition:shepherd'; reason = 'shepherd-ramp'; predictedOwner = 'Shepherd';
              } else if (nonK8s) {
                want = 'disposition:manual-only'; reason = 'repository-tooling'; predictedOwner = 'Manual';
              } else {
                want = 'disposition:stranded'; reason = 'no-existing-owner';
              }
              for (const d of DISPOS) {
                if (d !== want && labelNames.includes(d)) await github.rest.issues.removeLabel({ owner: OWNER, repo: REPO, issue_number: pr.number, name: d });
              }
              if (!labelNames.includes(want)) await github.rest.issues.addLabels({ owner: OWNER, repo: REPO, issue_number: pr.number, labels: [want] });
              core.info(JSON.stringify({ pullRequest: pr.number, head: pr.head.sha, actualAutoMerge: actual, predictedOwner, reason, disposition: want, ...provenance }));
            }
            core.info(`Classified ${n} open Renovate PR(s).`);
