---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# PR disposition labeler — makes the auto-merge board visible on the PR list itself,
# so "which merges itself vs which is waiting for me" is readable at a glance (the
# renovate/type labels don't tell you). Labels each OPEN Renovate PR with exactly one:
#
#   disposition:auto-merge  — GitHub auto-merge is enabled (Renovate Tier-0/2); it merges
#                             itself when checks go green. Nothing for you to do.
#   disposition:shepherd    — a shepherd-ramp component (coredns/traefik/multus/
#                             device-plugins/flux, ramp-infra patch/minor, or an immich
#                             major); the upgrade-shepherd run vets + auto-merges it.
#                             Nothing for you — and this label is VERDICT-AWARE: once the
#                             shepherd records a vet at the PR's current head, the label
#                             follows the verdict instead of lying "handled".
#   disposition:stranded    — needs ATTENTION: a shepherd HOLD (automation wanted to merge
#                             but a gap blocked it — fix the gap), a cluster-breaker, or a
#                             major that deserves release-note eyes before merging.
#   disposition:manual-only — needs only a MINDLESS human merge: repo tooling outside
#                             kubernetes/** (no health gate can ever own it), or a bump the
#                             shepherd examined and ruled OUT-OF-SCOPE. Merge and move on
#                             (2026-07-17, split out of stranded so the two are separable).
#
# Read-only classification; only manipulates its own four labels. Runs on a schedule
# (catches Renovate enabling auto-merge after it re-evaluates) + on demand.
name: PR Disposition

on:
  schedule:
    - cron: '17 */2 * * *'   # every 2h at :17
  workflow_dispatch: {}

concurrency:
  group: pr-disposition
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label open Renovate PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const OWNER = context.repo.owner, REPO = context.repo.repo;
            // ── policy mirrors (keep in sync with .renovate/autoMerge.json5 + the
            //    shepherd HR UPGRADE_AGENT_PREFILTER_GLOBS) ────────────────────────────
            // Renovate Tier-2 auto-merges minor/patch/digest in these leaf-app domains:
            const TIER2_DOMAINS = ['media','ai','downloads','frontend','office','photos','observability','home-automation'];
            // ...and these curated kube-system/network leaves (by <domain>/<app>):
            const CURATED_LEAVES = ['kube-system/metrics-server','kube-system/reloader','kube-system/reflector','kube-system/k8tz','kube-system/spegel','network/cloudflare-ddns','network/cloudflare-tunnel'];
            // Shepherd-ramp clean-tier prefixes (shepherd auto-merges these, incl. minor):
            const RAMP_CLEAN = [
              'kubernetes/main/apps/kube-system/coredns/','kubernetes/edge/apps/kube-system/coredns/',
              'kubernetes/main/apps/network/traefik/','kubernetes/main/apps/network/multus/',
              'kubernetes/main/apps/kube-system/generic-device-plugin/','kubernetes/main/apps/kube-system/intel-device-plugin/',
              'kubernetes/main/apps/kube-system/nvidia-device-plugin/','kubernetes/main/flux/','kubernetes/edge/flux/',
              // plex (2026-07-19) is shepherd-owned (Renovate carves it out; the shepherd
              // merges it after a Kometa-idle preflight) — label it shepherd, not auto-merge.
              'kubernetes/main/apps/media/plex/',
            ];
            const IMMICH = 'kubernetes/main/apps/photos/immich/';
            // Revertible cluster-infra ramp (2026-07-08): shepherd auto-merges PATCH/
            // safe-minor here (backup/health-gated + auto-revert); one-way MAJORS it
            // authors for human confirm. Prefix list mirrors ramp_globs_for.
            const RAMP_INFRA = [
              'kubernetes/main/apps/storage/rook-ceph/rook-ceph/',
              'kubernetes/main/apps/database/cloudnative-pg/',
              'kubernetes/main/apps/database/dragonfly/',
              'kubernetes/main/apps/kube-system/cilium/',
              'kubernetes/main/apps/network/authentik/',
              'kubernetes/main/apps/cert-manager/cert-manager/',
            ];
            const DISPOS = ['disposition:auto-merge', 'disposition:shepherd', 'disposition:stranded', 'disposition:manual-only'];
            const isRenovate = (l) => /renovate/i.test(l || '');
            const tier2Path = (p) => {
              const m = p.match(/^kubernetes\/[^/]+\/apps\/([^/]+)\/(.+)$/);
              if (!m) return false;
              if (TIER2_DOMAINS.includes(m[1])) return true;
              return CURATED_LEAVES.includes(m[1] + '/' + m[2].split('/')[0]);
            };

            const prs = await github.paginate(github.rest.pulls.list, { owner: OWNER, repo: REPO, state: 'open', per_page: 100 });
            let n = 0;
            for (const pr of prs) {
              if (!isRenovate(pr.user && pr.user.login)) continue;
              n++;
              const files = await github.paginate(github.rest.pulls.listFiles, { owner: OWNER, repo: REPO, pull_number: pr.number, per_page: 100 });
              const paths = files.map(f => f.filename);
              const labelNames = (pr.labels || []).map(l => l.name);
              const brtitle = (pr.head.ref + ' ' + pr.title).toLowerCase();
              const isMajor = labelNames.includes('type/major');
              const isImmich = paths.some(p => p.startsWith(IMMICH));
              const inCleanRamp = paths.some(p => RAMP_CLEAN.some(r => p.startsWith(r)));
              // Tier-2 auto-merge PREDICTION (Renovate will enable GH auto-merge on its
              // next run even if pr.auto_merge is not set yet): every changed file is
              // Tier-2-eligible, it's not a major, and nothing is held.
              const allTier2 = paths.length > 0 && paths.every(tier2Path);
              const ownImage = /thaynes43/.test(brtitle) || /kube-prometheus-stack/.test(brtitle);
              const ghActions = paths.length > 0 && paths.every(p => p.startsWith('.github/'));

              // Shepherd verdict at the CURRENT head, if any (the vet-once marker the
              // shepherd leaves: first line '<!-- shepherd-vet sha=<oid> -->', then
              // 'VERDICT: <word>'). A recorded verdict outranks path-based guesses —
              // without this, a durable HOLD sits labeled "shepherd, nothing for you"
              // forever (authentik #2005 sat 8 days that way).
              let verdict = null;
              const comments = await github.paginate(github.rest.issues.listComments, { owner: OWNER, repo: REPO, issue_number: pr.number, per_page: 100 });
              for (const c of comments) {
                const m = (c.body || '').match(/^<!-- shepherd-vet sha=([0-9a-f]{40}) -->\s*\n+\s*VERDICT:\s*([A-Za-z-]+)/);
                if (m && m[1] === pr.head.sha) verdict = m[2].toUpperCase();   // chronological: latest wins
              }
              const nonK8s = paths.length > 0 && !ghActions && !paths.some(p => p.startsWith('kubernetes/'));

              let want;
              if (pr.auto_merge) {
                want = 'disposition:auto-merge';                       // ground truth
              } else if (verdict === 'HOLD') {
                want = 'disposition:stranded';                         // shepherd wanted it but a gap blocked it — fix the gap
              } else if (verdict && verdict !== 'AUTO-MERGE') {
                want = 'disposition:manual-only';                      // examined and declined (OUT-OF-SCOPE etc.) — mindless merge
              } else if (isImmich && isMajor) {
                want = 'disposition:shepherd';                         // immich major → shepherd
              } else if (ghActions || (!isMajor && (allTier2 || ownImage))) {
                want = 'disposition:auto-merge';                       // Renovate Tier-0/2 (GHA incl. majors since 2026-07-08; pending its next run)
              } else if (!isMajor && inCleanRamp) {
                want = 'disposition:shepherd';                         // clean-tier ramp → shepherd
              } else if (!isMajor && paths.some(p => RAMP_INFRA.some(r => p.startsWith(r)))) {
                want = 'disposition:shepherd';                         // revertible cluster-infra PATCH/minor → shepherd
              } else if (nonK8s) {
                want = 'disposition:manual-only';                      // repo tooling — no health gate can ever own it
              } else {
                // remaining: one-way MAJORS (Ceph/PG/cilium/authentik) the shepherd
                // authors for human confirm, plus non-ramp majors and anything
                // off-ramp. Needs your judgment — but for ramp-infra majors the shepherd
                // will hand you a one-click-ready 'ONE-WAY — human confirm' PR.
                want = 'disposition:stranded';
              }

              for (const d of DISPOS) {
                if (d !== want && labelNames.includes(d)) {
                  try { await github.rest.issues.removeLabel({ owner: OWNER, repo: REPO, issue_number: pr.number, name: d }); } catch (e) {}
                }
              }
              if (!labelNames.includes(want)) {
                await github.rest.issues.addLabels({ owner: OWNER, repo: REPO, issue_number: pr.number, labels: [want] });
              }
              core.info(`#${pr.number} ${pr.title.slice(0,60)} -> ${want}`);
            }
            core.info(`Classified ${n} open Renovate PR(s).`);
