name: Build and Push Peloton Scraper Image

on:
  push:
    # main only: every run pushes the fixed :0.3.2 and :latest tags, so a run from
    # any other branch would overwrite the published image before review.
    branches: [main]
    paths:
      - 'scripts/peloton-scrape/**'
      - '.github/workflows/peloton-scraper-build.yml'
  workflow_dispatch:
  
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./scripts/peloton-scrape
          file: ./scripts/peloton-scrape/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/peloton-scraper:0.3.2
            ghcr.io/${{ github.repository_owner }}/peloton-scraper:latest
