name: Build and Push Peloton Scraper Image

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/peloton-scrape/**'
      - '.github/workflows/peloton-scraper-build.yml'
  push:
    branches: [main]
    # Workflow-only main edits must not re-push the fixed tags in place.
    paths:
      - 'scripts/peloton-scrape/**'
  workflow_dispatch:
  
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the runtime image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./scripts/peloton-scrape
          file: ./scripts/peloton-scrape/Dockerfile
          push: false
          load: true
          tags: peloton-scraper:validation

      - name: Smoke-test imports and headless Chromium without network or credentials
        timeout-minutes: 3
        run: |
          timeout 90s docker run --rm --interactive --read-only --network none \
            --cpus 2 --memory 1g --memory-swap 1g --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,exec,uid=1000,gid=1000,size=512m --shm-size 256m \
            --user 1000:1000 -e HOME=/tmp/peloton-home \
            --entrypoint python peloton-scraper:validation -I -B - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          import sys
          from urllib.parse import quote

          import yaml
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By

          # Importing under another name never enters the authenticated scraper main.
          spec = importlib.util.spec_from_file_location("peloton_fixture", "/app/scrape.py")
          scraper = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(scraper)
          activity = scraper.Activity.CYCLING
          assert scraper.ActivityData.parseActivitiesFromEnv("cycling,yoga") == [activity, scraper.Activity.YOGA]
          older, newer = scraper.ActivityData(activity), scraper.ActivityData(activity)
          older.update(2026, 1)
          newer.update(2026, 2)
          merged = scraper.ActivityData.mergeCollections({activity: older}, {activity: newer})
          assert merged[activity].maxEpisode == {2026: 2}
          fixture = {"activity": "cycling", "episode": 2}
          assert yaml.safe_load(yaml.safe_dump(fixture)) == fixture

          Path(os.environ["HOME"]).mkdir()
          options = Options()
          options.binary_location = "/usr/bin/chromium"
          # The browser runs inside an unprivileged, offline container.
          for flag in ("--headless=new", "--no-sandbox", "--disable-background-networking",
                       "--disable-component-update", "--no-first-run", "--no-default-browser-check"):
              options.add_argument(flag)
          driver = webdriver.Chrome(service=Service("/usr/bin/chromedriver"), options=options)
          try:
              driver.set_page_load_timeout(10)
              html = "<title>Peloton fixture</title><p id='ready'>ready</p>"
              driver.get("data:text/html;charset=utf-8," + quote(html))
              assert driver.title == "Peloton fixture"
              assert driver.find_element(By.ID, "ready").text == "ready"
              print("Python", sys.version.split()[0], "Chromium", driver.capabilities["browserVersion"],
                    "imports, fake data, YAML and browser passed")
          finally:
              driver.quit()
          PY

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the validated runtime image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/peloton-scraper
        run: |
          docker tag peloton-scraper:validation "${IMAGE}:0.3.2"
          docker tag peloton-scraper:validation "${IMAGE}:latest"
          docker push "${IMAGE}:0.3.2"
          docker push "${IMAGE}:latest"
