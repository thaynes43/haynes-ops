name: Build and Push Audio Authoring Image

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audio-authoring/**'
      - '.github/workflows/audio-authoring-build.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/audio-authoring/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0
      - name: Build test image for validation
        uses: docker/build-push-action@v7
        with:
          context: ./scripts/audio-authoring
          target: test
          push: false
          load: true
          cache-from: type=gha,scope=audio-authoring-linux-amd64
          cache-to: type=gha,mode=max,scope=audio-authoring-linux-amd64
          tags: audio-authoring:test
      - name: Smoke-test MCP control plane without models, network, or credentials
        timeout-minutes: 8
        run: |
          docker run --rm --read-only --network none \
            --cpus 4 --memory 4g \
            --tmpfs /tmp:rw,exec,uid=1000,gid=1000,size=512m \
            --tmpfs /workspace:rw,uid=1000,gid=1000,size=1g \
            --tmpfs /models:rw,uid=1000,gid=1000,size=64m \
            --user 1000:1000 \
            audio-authoring:test test
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish validated runtime image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: ./scripts/audio-authoring
          target: runtime
          push: true
          cache-from: type=gha,scope=audio-authoring-linux-amd64
          tags: ghcr.io/${{ github.repository_owner }}/audio-authoring:0.1.0
      - name: Install cosign
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/audio-authoring
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
