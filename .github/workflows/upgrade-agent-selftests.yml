---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Upgrade Agent Selftests (OP512 rollout step 2).
#
# Runs every selftest under scripts/upgrade-agent/ that needs no cluster, network or
# LLM: the night lane's classifier (with the check-map drift test, which reads every
# file in .github/workflows and .renovate), its dry-run tick, its merge step and change
# lock (story 752), the settle gate (story 551), the record format of update items and
# events (OP592, which maps the lane's records), the PR records and stalled-check retry
# (story 549), the seven shell selftests of the shepherd (its stand-aside for the night
# lane, story 551, and its vet-marker author check, story 549, included), triage, gate and
# responder helpers, the callers' API client and the curation caller (stories 739, 805),
# and the delivery helper's offline suite. Before this workflow nothing ran them in CI.
#
# Paths: the lane's own code and the sources the selftests execute, scripts/upgrade-agent,
# every workflow file (the drift test compares them with upgrade-rules.json) and the
# Renovate config (the classifier reads holds.json5 and autoMerge.json5). This workflow's
# own entry in upgrade-rules.json is what keeps the drift test green.
#
# Advisory: "Upgrade Agent Selftests - Success" is NOT a required check. Branch
# protection is the owner's; making it required is his call. Read-only token, no
# secrets, nice -n 19 and one suite at a time.
name: Upgrade Agent Selftests

on:
  pull_request:
    branches: [main]
    paths:
      - kubernetes/main/apps/upgrade-agent/shepherd/app/**
      - kubernetes/main/apps/upgrade-agent/health-gate/app/resources/coordination-lib.sh
      - kubernetes/main/apps/upgrade-agent/alert-responder/app/resources/respond.sh
      - kubernetes/main/apps/upgrade-agent/health-gate/app/resources/dev-env-api.sh
      - kubernetes/main/apps/upgrade-agent/health-gate/app/resources/gate.sh
      - kubernetes/main/apps/upgrade-agent/cigar-curation/app/**
      - scripts/upgrade-agent/**
      - .github/workflows/**
      - .renovate/**
  push:
    branches: [main]
    paths:
      - kubernetes/main/apps/upgrade-agent/shepherd/app/**
      - kubernetes/main/apps/upgrade-agent/health-gate/app/resources/coordination-lib.sh
      - kubernetes/main/apps/upgrade-agent/alert-responder/app/resources/respond.sh
      - kubernetes/main/apps/upgrade-agent/health-gate/app/resources/dev-env-api.sh
      - kubernetes/main/apps/upgrade-agent/health-gate/app/resources/gate.sh
      - kubernetes/main/apps/upgrade-agent/cigar-curation/app/**
      - scripts/upgrade-agent/**
      - .github/workflows/**
      - .renovate/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lane:
    name: Upgrade Agent Selftests - Night lane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the Node major of the upgrade-shepherd image (node:24-slim)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
      - name: Syntax of the shipped lane files
        run: |
          node --check kubernetes/main/apps/upgrade-agent/shepherd/app/resources/lane-classify.mjs
          node --check kubernetes/main/apps/upgrade-agent/shepherd/app/resources/run-night.mjs
          node --check kubernetes/main/apps/upgrade-agent/shepherd/app/resources/night-merge.mjs
          node --check kubernetes/main/apps/upgrade-agent/shepherd/app/resources/upgrade-history.mjs
          node --check kubernetes/main/apps/upgrade-agent/shepherd/app/resources/record-format.mjs
          jq -e . kubernetes/main/apps/upgrade-agent/shepherd/app/resources/upgrade-rules.json > /dev/null
      - name: Classifier, rules and check-map drift
        run: nice -n 19 node scripts/upgrade-agent/lane-classify-selftest.mjs
      - name: Dry-run tick against stubs
        run: nice -n 19 node scripts/upgrade-agent/lane-night-dryrun-selftest.mjs
      - name: Merge step and change lock against stubs (story 752)
        run: nice -n 19 node scripts/upgrade-agent/lane-merge-step-selftest.mjs
      - name: Record format of update items and events (OP592)
        run: nice -n 19 node scripts/upgrade-agent/record-format-selftest.mjs
      - name: PR records and the stalled-check retry (story 549)
        run: nice -n 19 node scripts/upgrade-agent/lane-pr-records-selftest.mjs
      - name: History of every attempt, rotation and backfill (story 593)
        run: nice -n 19 node scripts/upgrade-agent/lane-history-selftest.mjs

  shell:
    name: Upgrade Agent Selftests - Shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shell selftests, one at a time
        run: |
          set -euo pipefail
          for t in coordination-sig held-audit shepherd-verdict shepherd-stand-aside shepherd-prefilter stale-corpse triage-claim; do
            echo "::group::${t}-selftest.sh"
            nice -n 19 bash "scripts/upgrade-agent/${t}-selftest.sh"
            echo "::endgroup::"
          done
      # The callers' client for the dev-env v2 operator API (dev-env DESIGN-064 6.5,
      # OpenProject #739) against a fake HTTPS server on 127.0.0.1: its exit codes,
      # the refusal of a create that carries a prompt, that its token is in no
      # output, and the reach line in respond.sh, run-shepherd.sh, triage.sh and
      # gate.sh. Its own step, after the loop above.
      - name: Caller API client against a fake server (OP739)
        run: nice -n 19 bash scripts/upgrade-agent/dev-env-api-selftest.sh
      # The daily cigar curation's v2 caller (dev-env DESIGN-064 6.11, OpenProject #746
      # slice a, story 805): summon.sh with the shipped client against a scripted fake
      # HTTPS server: 201, 200, a session that exists before the create, 403, 409, 422,
      # 429, 503 then 201, 503 then the session exists, that the token is in no output,
      # and that its worst case fits the Job's activeDeadlineSeconds.
      - name: Curation caller against a fake server (OP805)
        run: nice -n 19 bash scripts/upgrade-agent/cigar-curation-selftest.sh

  deliver:
    name: Upgrade Agent Selftests - Delivery helper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline deliver-reviewed-pr suite
        run: nice -n 19 python3 -I -B scripts/upgrade-agent/test_deliver_reviewed_pr.py -v

  success:
    if: ${{ always() }}
    needs:
      - lane
      - shell
      - deliver
    name: Upgrade Agent Selftests - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any job failed or cancelled?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
