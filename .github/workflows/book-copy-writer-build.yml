name: Book Copy Writer

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/book-copy-writer/**
      - kubernetes/main/apps/downloads/lazylibrarian/app/epub-convert/epub_copies.py
      - kubernetes/main/apps/downloads/lazylibrarian/app/epub-convert/epub_metadata.py
      - kubernetes/main/apps/downloads/lazylibrarian/app/epub-convert/test_epub_metadata.py
      - .github/workflows/book-copy-writer-build.yml
  push:
    branches: [main]
    paths:
      - scripts/book-copy-writer/**
      - kubernetes/main/apps/downloads/lazylibrarian/app/epub-convert/epub_copies.py
      - kubernetes/main/apps/downloads/lazylibrarian/app/epub-convert/epub_metadata.py
      - .github/workflows/book-copy-writer-build.yml
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Book Copy Writer - Success
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the pinned driver image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: scripts/book-copy-writer/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: book-copy-writer:validation
          cache-from: type=gha,scope=book-copy-writer
          cache-to: type=gha,mode=max,scope=book-copy-writer

      - name: Verify the actual runtime driver and complete finite PG16 failure tests
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f copy-writer-pg16 >/dev/null 2>&1 || true' EXIT
          docker run --detach --name copy-writer-pg16 --cpus 1 --memory 256m \
            --tmpfs /var/lib/postgresql/data:rw,size=128m \
            -e POSTGRES_DB=copy_writer_fixture -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=isolated-fixture postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d \
            -c shared_buffers=16MB -c max_connections=8 -c max_worker_processes=0 \
            -c autovacuum=off -c jit=off
          timeout 20 bash -c 'until docker exec copy-writer-pg16 pg_isready -U postgres -d copy_writer_fixture; do sleep .2; done'
          docker run --rm --read-only --cpus 1 --memory 256m --user 1000:1000 \
            --network container:copy-writer-pg16 --tmpfs /tmp:rw,uid=1000,gid=1000,size=64m \
            -e COPY_TEST_DSN='host=127.0.0.1 user=postgres password=isolated-fixture dbname=copy_writer_fixture' \
            -e COPY_TEST_MODULES=/epub-tests \
            -v "$GITHUB_WORKSPACE/scripts/book-copy-writer:/writer-tests:ro" \
            -v "$GITHUB_WORKSPACE/kubernetes/main/apps/downloads/lazylibrarian/app/epub-convert:/epub-tests:ro" \
            --entrypoint nice book-copy-writer:validation -n 19 python /writer-tests/test_book_copy_writer.py

      - name: Verify bounded proof stdin transport without a network
        run: |
          docker run --rm --read-only --network none --cpus 1 --memory 128m --user 1000:1000 \
            --tmpfs /tmp:rw,uid=1000,gid=1000,size=16m \
            -e PYTHONPATH=/copy-writer \
            -v "$GITHUB_WORKSPACE/scripts/book-copy-writer:/writer-tests:ro" \
            --entrypoint nice book-copy-writer:validation -n 19 python /writer-tests/test_proof_transport.py

      - name: Verify finite manual bound-census guards without a network
        timeout-minutes: 1
        run: |
          docker run --rm --read-only --network none --cpus 1 --memory 128m --user 1000:1000 \
            --tmpfs /tmp:rw,uid=1000,gid=1000,size=16m \
            -e COPY_TEST_MODULES=/epub-tests \
            -v "$GITHUB_WORKSPACE/scripts/book-copy-writer:/writer-tests:ro" \
            -v "$GITHUB_WORKSPACE/kubernetes/main/apps/downloads/lazylibrarian/app/epub-convert:/epub-tests:ro" \
            --entrypoint nice book-copy-writer:validation -n 19 python /writer-tests/test_bound_census.py

      - name: Verify native LIVE host inventory and lifecycle guards without a network
        timeout-minutes: 1
        run: |
          docker run --rm --read-only --network none --cpus 1 --memory 128m --user 1000:1000 \
            --tmpfs /tmp:rw,uid=1000,gid=1000,size=16m \
            -v "$GITHUB_WORKSPACE/scripts/book-copy-writer:/writer-tests:ro" \
            --entrypoint nice book-copy-writer:validation -n 19 python -B /writer-tests/live-baseline-host/test-live-baseline-lifecycle.py

      - name: Preserve the exact validated image for main-only publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save book-copy-writer:validation --output "${RUNNER_TEMP}/book-copy-writer-image.tar"

      - name: Upload the validated image artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: book-copy-writer-${{ github.sha }}
          path: ${{ runner.temp }}/book-copy-writer-image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish validated copy writer
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download this run's exact validated image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: book-copy-writer-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Load the validated image without rebuilding
        run: docker load --input "${RUNNER_TEMP}/book-copy-writer-image.tar"

      - name: Log in for main-only publication
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the exact validated image
        id: publish
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/book-copy-writer
        run: |
          set -euo pipefail
          docker tag book-copy-writer:validation "${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${IMAGE}:sha-${GITHUB_SHA}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:sha-${GITHUB_SHA}")"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign the main image digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/book-copy-writer
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: >-
          cosign sign --yes --new-bundle-format=false --use-signing-config=false
          --registry-referrers-mode=legacy "${IMAGE}@${DIGEST}"
