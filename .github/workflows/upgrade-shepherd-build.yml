name: Build and Push Upgrade Shepherd Image

# Builds the Tier-4 breaking-change shepherd image (ghcr.io/thaynes43/upgrade-shepherd).
# Fatter than the gate image (claude-code + gh + git + flux + kubectl). Build context
# is the REPO ROOT so the Dockerfile can COPY scripts/github-app-token.sh (single
# source of truth); a repo-root .dockerignore keeps secrets/.git out of the context.
# Builds only on main.

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/upgrade-shepherd/**'
      - 'scripts/github-app-token.sh'
      # NOTE (2026-07-28): this workflow deliberately does NOT list its own file
      # here. When it did, ANY edit to the workflow — including Renovate's Tier-0
      # auto-merged action bumps (e.g. the cosign v2.6.4/v3.1.2 pair, 07-25) —
      # rebuilt the image from unchanged source, re-pushed the same tag with a new
      # digest, and Renovate then opened a pointless digest-drift PR. Trade-off: a
      # workflow-file change no longer proves itself post-merge — after deliberately
      # editing this workflow, run it once by hand (`gh workflow run <file>`); a
      # broken action bump now surfaces at the next dispatch/source build instead
      # of immediately.
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write   # keyless cosign signing (OIDC) — proves the image came from THIS workflow

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3   # v2 writes legacy .sig tags (Kyverno-verifiable)

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./scripts/upgrade-shepherd/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/upgrade-shepherd:0.1.0
            ghcr.io/${{ github.repository_owner }}/upgrade-shepherd:latest

      # Keyless sign by DIGEST (covers both tags — they share the manifest). The
      # signature is verified in-cluster by the Kyverno verify-thaynes43-images policy
      # against this workflow's OIDC identity (no key to manage or leak).
      - name: Sign the image (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/upgrade-shepherd
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
