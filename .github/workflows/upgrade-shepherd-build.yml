name: Build and Push Upgrade Shepherd Image

# Builds the Tier-4 breaking-change shepherd image (ghcr.io/thaynes43/upgrade-shepherd).
# Fatter than the gate image (claude-code + gh + git + flux + kubectl). Build context
# is the REPO ROOT so the Dockerfile can COPY scripts/github-app-token.sh (single
# source of truth); a repo-root .dockerignore keeps secrets/.git out of the context.
# PRs build and smoke-test without publishing; main builds publish and sign.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/upgrade-shepherd/**'
      - 'scripts/github-app-token.sh'
      - '.github/workflows/upgrade-shepherd-build.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/upgrade-shepherd/**'
      - 'scripts/github-app-token.sh'
      # NOTE (2026-07-28): this workflow deliberately does NOT list its own file
      # here. When it did, ANY edit to the workflow — including Renovate's Tier-0
      # auto-merged action bumps (e.g. the cosign v2.6.4/v3.1.2 pair, 07-25) —
      # rebuilt the image from unchanged source, re-pushed the same tag with a new
      # digest, and Renovate then opened a pointless digest-drift PR. Trade-off: a
      # workflow-file change no longer proves itself post-merge — after deliberately
      # editing this workflow, run it once by hand (`gh workflow run <file>`); a
      # broken action bump now surfaces at the next dispatch/source build instead
      # of immediately.
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write   # keyless cosign signing (OIDC) — proves the image came from THIS workflow

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for validation
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./scripts/upgrade-shepherd/Dockerfile
          push: false
          load: true
          tags: upgrade-shepherd:validation

      - name: Smoke-test toolchain as the runtime user
        timeout-minutes: 3
        run: |
          docker run --rm --read-only --network none \
            --cpus 2 --memory 2g \
            --tmpfs /tmp:rw,exec,uid=1000,gid=1000,size=256m \
            --user 1000:1000 \
            --entrypoint /bin/bash \
            upgrade-shepherd:validation \
            -euc '
              test "$(id -u)" = 1000
              gh --version
              kubectl version --client=true
              flux --version
              git --version
              claude --version
            '

  build-and-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # The sign step selects v3's legacy .sig mode for Kyverno.
          # Keep in step with the other OCI image build workflows.
          cosign-release: v3.1.4

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./scripts/upgrade-shepherd/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/upgrade-shepherd:0.1.0
            ghcr.io/${{ github.repository_owner }}/upgrade-shepherd:latest

      # Keyless sign by DIGEST (covers both tags — they share the manifest). The
      # signature is verified in-cluster by the Kyverno verify-thaynes43-images policy
      # against this workflow's OIDC identity (no key to manage or leak).
      - name: Sign the image (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/upgrade-shepherd
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          cosign sign --yes --new-bundle-format=false --use-signing-config=false
          --registry-referrers-mode=legacy "${IMAGE}@${DIGEST}"
