name: Native Scanner Fixture
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/book-native-scan-fixture/**
      - scripts/ci-cache/**
      - .github/workflows/book-native-scan-fixture.yml
      - kubernetes/main/apps/media/kavita/app/helmrelease.yaml
      - .github/renovate.json5
  push:
    branches: [main]
    paths:
      - scripts/book-native-scan-fixture/**
      - scripts/ci-cache/**
      - .github/workflows/book-native-scan-fixture.yml
      - kubernetes/main/apps/media/kavita/app/helmrelease.yaml
      - .github/renovate.json5
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Native scanner source - Success
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scope source build independently from production-only upgrades
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: nice -n 19 python3 -B scripts/book-native-scan-fixture/test_prepared_manifest.py --scope
      - name: Always validate frozen source consistency and independent production admission
        env:
          FIXTURE_SOURCE_BUILD: ${{ steps.scope.outputs.build }}
        run: nice -n 19 python3 -B scripts/book-native-scan-fixture/test_prepared_manifest.py
      - name: Verify exact public cached native index and amd64 manifest metadata
        id: cache
        timeout-minutes: 2
        if: steps.scope.outputs.build == 'true'
        run: |
          nice -n 19 python3 -B scripts/ci-cache/test_verify_dockerhub_cache.py
          nice -n 19 python3 -B scripts/ci-cache/verify_dockerhub_cache.py --profile native-scanner --github-output "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.scope.outputs.build == 'true'
        with:
          buildkitd-config-inline: ${{ steps.cache.outputs.buildkit_config }}
          driver-opts: image=${{ steps.cache.outputs.buildkit_image }}
      - name: Resolve the official exact SDK image once
        id: sdk
        if: steps.scope.outputs.build == 'true'
        run: |
          set -euo pipefail
          sdk=mcr.microsoft.com/dotnet/sdk:10.0.101
          digest="$(docker buildx imagetools inspect "$sdk" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=${sdk}@${digest}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${sdk}@${digest}" > sdk-image.txt
      - name: Build generic harness against official pinned SDK and exact deployed native image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.scope.outputs.build == 'true'
        with:
          context: .
          file: scripts/book-native-scan-fixture/Dockerfile
          build-args: SDK_IMAGE=${{ steps.sdk.outputs.image }}
          platforms: linux/amd64
          push: false
          load: true
          tags: native-scanner-fixture:validation
      - name: Launch exact native-image apphost and finite source guards without host/scan/input
        timeout-minutes: 1
        if: steps.scope.outputs.build == 'true'
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cpus .5 --memory 256m \
            --cap-drop ALL --security-opt no-new-privileges --user 1000:1000 \
            --tmpfs /tmp:rw,uid=1000,gid=1000,size=16m \
            --entrypoint nice native-scanner-fixture:validation -n 19 /fixture/NativeScannerFixture --self-test
          docker run --rm --network none --read-only --cpus .5 --memory 256m \
            --cap-drop ALL --security-opt no-new-privileges --user 1000:1000 \
            --entrypoint nice native-scanner-fixture:validation -n 19 /fixture/NativeScannerFixture --self-test-deadline
          docker run --rm --network none --read-only --cpus .5 --memory 256m \
            --entrypoint sh native-scanner-fixture:validation -c \
            'sha256sum /fixture/NativeScannerFixture /fixture/NativeScannerFixture.dll /fixture/libcoreclr.so /fixture/libhostfxr.so /fixture/System.Private.CoreLib.dll /kavita/Kavita.Server.dll /kavita/Kavita.API.dll /kavita/Kavita.Models.dll /kavita/Kavita.Services.dll /kavita/Kavita.Database.dll /kavita/Microsoft.Data.Sqlite.dll /kavita/Microsoft.EntityFrameworkCore.dll /kavita/Microsoft.EntityFrameworkCore.Relational.dll' > native-module-pins.txt
      - name: Preserve only generic source/build/runtime receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.scope.outputs.build == 'true'
        with:
          name: native-scanner-source-${{ github.sha }}
          path: |
            sdk-image.txt
            native-module-pins.txt
          retention-days: 3
          if-no-files-found: error
      - name: Preserve exact tested generic image for main-only publication
        if: steps.scope.outputs.build == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save native-scanner-fixture:validation --output "${RUNNER_TEMP}/native-scanner-fixture.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.scope.outputs.build == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: native-scanner-image-${{ github.sha }}
          path: ${{ runner.temp }}/native-scanner-fixture.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  publish:
    name: Publish tested generic scanner fixture
    needs: validate
    if: needs.validate.outputs.build == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-scanner-image-${{ github.sha }}
          path: ${{ runner.temp }}
      - run: docker load --input "${RUNNER_TEMP}/native-scanner-fixture.tar"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exact validated public image
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/book-native-scan-fixture
        run: |
          set -euo pipefail
          docker tag native-scanner-fixture:validation "${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${IMAGE}:sha-${GITHUB_SHA}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:sha-${GITHUB_SHA}")"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign generic image digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/book-native-scan-fixture
          DIGEST: ${{ steps.image.outputs.digest }}
        run: >-
          cosign sign --yes --new-bundle-format=false --use-signing-config=false
          --registry-referrers-mode=legacy "${IMAGE}@${DIGEST}"
