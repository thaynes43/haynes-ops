name: Wan Video API
on:
  pull_request:
    paths:
      - scripts/wan-video/**
      - kubernetes/main/apps/ai/wan-video/**
      - kubernetes/main/apps/ai/open-webui/app/wan_video.py
      - .github/workflows/wan-video-test.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - run: python -m unittest discover -s scripts/wan-video -v
