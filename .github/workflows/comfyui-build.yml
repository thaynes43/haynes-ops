name: Build and Push ComfyUI Image

# Builds ghcr.io/thaynes43/comfyui — our own ComfyUI image, replacing the dead
# ghcr.io/ai-dock/comfyui. PRs build and smoke-test without publishing; only a
# push to main publishes and signs.

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/comfyui/**'
      - 'kubernetes/main/apps/ai/stable-diffusion/comfyui/resources/workflows/**'
      - 'kubernetes/main/apps/ai/stable-diffusion/comfyui/resources/api-workflows/**'
      - '.github/workflows/comfyui-build.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/comfyui/**'
      # The deployed workflow JSONs are the provisioner's test fixtures, so a
      # change to them must re-run the parser tests. This workflow deliberately
      # does NOT list its own file here — see the note in dev-env-build.yml:
      # rebuilding on a Renovate action bump re-pushes the same tag with a new
      # digest and provokes a pointless digest-drift PR.
      - 'kubernetes/main/apps/ai/stable-diffusion/comfyui/resources/workflows/**'
      - 'kubernetes/main/apps/ai/stable-diffusion/comfyui/resources/api-workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write   # keyless cosign signing (OIDC)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # <ComfyUI version without the v>-<image revision>. Bump the revision when
  # only our own scripts change; bump the version half by editing
  # scripts/comfyui/Dockerfile's COMFYUI_VERSION ARG (Renovate does that) and
  # then resetting the revision to 1.
  IMAGE_TAG: 0.37.0-2

jobs:
  build-and-push-comfyui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The 6.5 GB image, the builder's layer cache and the loaded copy come to
      # roughly 20 GB. Today's ubuntu-latest runner has ~87 GB free, so the
      # reclaim is dead weight — but runner sizing has changed before, and a
      # disk-full failure mid-build is opaque. Keep the escape hatch, skip it
      # when it is not needed (it costs ~4 minutes when it runs).
      - name: Free up runner disk if needed
        run: |
          df -h /
          avail=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          if [ "${avail:-0}" -lt 40 ]; then
            echo "only ${avail}G free, reclaiming preinstalled toolchains"
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                        /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
            df -h /
          else
            echo "${avail}G free; the build needs ~20G, nothing to reclaim"
          fi

      # One source of truth: the parser is tested against the workflow JSONs the
      # app actually deploys, not a copy in scripts/ that can drift out of step.
      - name: Stage the deployed workflows as test fixtures
        run: |
          set -euo pipefail
          res=kubernetes/main/apps/ai/stable-diffusion/comfyui/resources
          mkdir -p scripts/comfyui/testdata/deployed/workflows \
                   scripts/comfyui/testdata/deployed/api-workflows
          cp "$res"/workflows/*.json scripts/comfyui/testdata/deployed/workflows/
          cp "$res"/api-workflows/*.json scripts/comfyui/testdata/deployed/api-workflows/
          ls -l scripts/comfyui/testdata/deployed/workflows \
                scripts/comfyui/testdata/deployed/api-workflows

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # No cache-from/cache-to: the GitHub Actions cache is 10 GB repo-wide and
      # this image alone would evict every other workflow's cache. The runtime
      # build below reuses this builder's local cache instead, so it is nearly
      # free despite being a second build.
      - name: Build test image for validation
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./scripts/comfyui
          target: test
          push: false
          load: true
          tags: comfyui:test

      - name: Report image size
        run: |
          docker images comfyui:test --format '{{.Repository}}:{{.Tag}}  {{.Size}}'
          df -h /

      - name: Smoke-test on a read-only root filesystem, no network, no GPU, no models
        timeout-minutes: 25
        run: |
          docker run --rm --read-only --network none \
            --cpus 4 --memory 10g \
            --tmpfs /tmp:rw,exec,uid=1000,gid=1000,size=3g \
            --tmpfs /workspace:rw,uid=1000,gid=1000,size=2g \
            --user 1000:1000 \
            -e COMFYUI_TEST_STRICT_FIXTURES=1 \
            comfyui:test test

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish validated runtime image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./scripts/comfyui
          target: runtime
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/comfyui:${{ env.IMAGE_TAG }}

      - name: Install cosign
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Kept in step with the other image workflows. cosign v3 writes only
          # the Sigstore bundle format, which Kyverno's Cosign-type verifyImages
          # does not yet read — see the long note in dev-env-build.yml; change
          # all four workflows together.
          cosign-release: v3.1.3

      - name: Sign the image (keyless)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/comfyui
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
