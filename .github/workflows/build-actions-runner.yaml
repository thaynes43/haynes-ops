name: Build and Push Actions Runner Image

# This repository is public: build and validate on GitHub-hosted Ubuntu.
# Only repository-scoped private workloads use the published ARC image.
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/actions-runner/**'
      - '.github/workflows/build-actions-runner.yaml'
  push:
    branches: [main]
    paths:
      - 'scripts/actions-runner/**'
      # Workflow changes validate on PRs; publishing them requires a new VERSION
      # and a manual dispatch, so action updates cannot replace an existing tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/thaynes43/actions-runner

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read image version
        id: version
        run: |
          version="$(cat scripts/actions-runner/VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::scripts/actions-runner/VERSION must contain a semver release'
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require a new version for runner source changes
        if: github.event_name == 'pull_request'
        timeout-minutes: 2
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Invalid pull-request base commit'
            exit 1
          fi
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$BASE_SHA"
          if ! git -C "$GITHUB_WORKSPACE" diff --quiet "$BASE_SHA" HEAD -- scripts/actions-runner/Dockerfile; then
            previous="$(git -C "$GITHUB_WORKSPACE" show "$BASE_SHA:scripts/actions-runner/VERSION" 2>/dev/null || true)"
            if [ "$VERSION" = "$previous" ]; then
              echo '::error::Runner Dockerfile changes require a new scripts/actions-runner/VERSION'
              exit 1
            fi
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for validation
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./scripts/actions-runner
          platforms: linux/amd64
          push: false
          load: true
          # Validate the exact single-platform image that will be published.
          # Its keyless signature below records this workflow's OIDC identity.
          provenance: false
          cache-from: type=gha,scope=actions-runner-linux-amd64
          cache-to: type=gha,mode=max,scope=actions-runner-linux-amd64
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Smoke-test tools as the ARC runtime user
        timeout-minutes: 3
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run --rm --read-only --network none \
            --cpus 2 --memory 2g \
            --cap-drop NET_RAW \
            --tmpfs /tmp:rw,exec,size=128m \
            --tmpfs /run:rw,size=16m \
            --tmpfs /home/runner/_diag:rw,uid=1001,gid=1001,size=16m \
            --tmpfs /home/runner/.local:rw,uid=1001,gid=1001,size=32m \
            --entrypoint /bin/bash \
            "${IMAGE}:${VERSION}" -euo pipefail -c '
              test "$(id -u)" = 1001
              test "$(sudo -n id -u)" = 0
              test "$ImageOS" = ubuntu24
              test -x /home/runner/run.sh
              /home/runner/bin/Runner.Listener --version
              /home/runner/externals/node24/bin/node --version
              git --version
              gh --version
              python3 --version
              python3 -m venv /tmp/python-smoke
              /tmp/python-smoke/bin/python -c "import ssl, venv"
              pipx --version
              pg_isready --version
              zstd --version
              gcc --version
              printf "int main(void) { return 0; }\n" > /tmp/compiler-smoke.c
              gcc /tmp/compiler-smoke.c -o /tmp/compiler-smoke
              /tmp/compiler-smoke
              docker --version | grep "29.8.2"
              docker buildx version
              dpkg-query -W libicu74 libssl3t64 libnss3 libgbm1 libasound2t64
            '

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require an unpublished version tag
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          error_file="${RUNNER_TEMP}/actions-runner-manifest-error"
          if docker manifest inspect "${IMAGE}:${VERSION}" > /dev/null 2> "$error_file"; then
            echo '::error::Runner image version already exists; bump scripts/actions-runner/VERSION before publishing'
            exit 1
          fi
          # Only an absent manifest permits publication. Auth/network failures
          # must fail safely instead of allowing an existing tag to be replaced.
          if ! grep -Eiq 'manifest unknown|no such manifest|name unknown' "$error_file"; then
            cat "$error_file" >&2
            echo '::error::Unable to confirm that the runner version is unpublished'
            exit 1
          fi

      - name: Publish validated image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker push "${IMAGE}:${VERSION}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${VERSION}")"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign image for Kyverno's Cosign verifier
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        # Kyverno's current policy reads legacy .sig tags rather than v3 bundles.
        # v3.1.3 supports this mode and includes the current verification fix.
        run: >-
          cosign sign --yes --new-bundle-format=false --use-signing-config=false
          --registry-referrers-mode=legacy "${IMAGE}@${DIGEST}"

      - name: Verify signature and workflow identity
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build-actions-runner.yaml@refs/heads/main
        run: >-
          cosign verify --new-bundle-format=false
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          --certificate-identity "$CERTIFICATE_IDENTITY" "${IMAGE}@${DIGEST}"
