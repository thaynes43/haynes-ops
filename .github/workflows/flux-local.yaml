---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Flux Local

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Flux Local - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
      portal-files: ${{ steps.portal-files.outputs.changed_files }}
      studio-files: ${{ steps.studio-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: kubernetes/**/*
      - name: Get Portal Identity Guard Files
        id: portal-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |
            kubernetes/main/apps/network/authentik/**
            scripts/tests/portal178-m5a/**
            .agents/reports/portal178-m5a/pending/**
            .github/workflows/flux-local.yaml

      - name: Get Studio Release Guard Files
        id: studio-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |
            kubernetes/main/apps/ai/studio/**
            kubernetes/main/apps/ai/studio-render/**
            scripts/tests/studio-release/**
            scripts/studio-release/op967*
            docs/reference/studio-fourth-release.md
            docs/reference/studio-matting-deployment.md
            docs/reference/studio-upscaling-deployment.md
            scripts/studio-segmentation/**
            .github/workflows/flux-local.yaml

  # The `cluster` matrix carries a single entry since the edge cluster was retired
  # (2026-09-22): `kubernetes/edge/` is gone, so there is nothing else to render. It
  # stays a matrix so the check names keep their `(main)` / `(main/helmrelease)` shape
  # and a second cluster is a one-line re-add. Branch protection requires only the
  # aggregate contexts `Flux Local - Success` and `Diff Scope - Success`, never a
  # per-matrix name — do not make a matrix leg a required check.
  test:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flux Local - Test (${{ matrix.cluster }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cluster:
          - main
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run flux-local test
        uses: docker://ghcr.io/allenporter/flux-local:v8.4.0@sha256:c0be852e30f299ce6a220cc992b0c21a2a0b0684cc17713b9d718e18d9c8beff
        with:
          args: >-
            test
            --all-namespaces
            --enable-helm
            --path /github/workspace/kubernetes/${{ matrix.cluster }}/flux
            --verbose

  diff:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flux Local - Diff (${{ matrix.cluster }}/${{ matrix.resource }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        cluster:
          - main
        resource:
          - helmrelease
          - kustomization
      fail-fast: false
    steps:
      - name: Checkout Pull Request Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pull
          persist-credentials: false

      - name: Checkout Default Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: default
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Run flux-local diff
        uses: docker://ghcr.io/allenporter/flux-local:v8.4.0@sha256:c0be852e30f299ce6a220cc992b0c21a2a0b0684cc17713b9d718e18d9c8beff
        with:
          args: >-
            diff ${{ matrix.resource }}
            --unified 6
            --path /github/workspace/pull/kubernetes/${{ matrix.cluster }}/flux
            --path-orig /github/workspace/default/kubernetes/${{ matrix.cluster }}/flux
            --strip-attrs "helm.sh/chart,checksum/config,app.kubernetes.io/version,chart"
            --limit-bytes 10000
            --all-namespaces
            --output-file diff.patch

      - name: Generate Diff
        id: diff
        run: |-
          # Random delimiter: the rendered diff is PR-controlled, and a bare `EOF` line
          # in it would end the value early and let the rest set arbitrary outputs.
          delim="EOF_$(openssl rand -hex 16)"
          echo "diff<<${delim}" >> $GITHUB_OUTPUT
          cat diff.patch >> $GITHUB_OUTPUT
          echo "${delim}" >> $GITHUB_OUTPUT

      - if: ${{ steps.diff.outputs.diff != '' }}
        name: Add Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: ${{ github.event.pull_request.number }}/${{ matrix.cluster }}/${{ matrix.resource }}
          message: |-
            ## Flux `${{ matrix.cluster }}` `${{ matrix.resource }}` diff
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```

  annotation-guard:
    # external-dns >=0.22 reads ONLY `external-dns.kubernetes.io/` (the GA prefix, the
    # default — neither instance sets --annotation-prefix). An `external-dns.alpha…`
    # annotation is silently ignored: the /target override vanishes and, with
    # policy: sync, a public name is rewritten to the private ingress LB IP. The repo was
    # migrated 2026-09-21 (#3044-#3047, issue #3002); this keeps the old prefix from
    # creeping back in via a copied manifest. Whole-tree grep, so it is cheap and fail-closed.
    name: Flux Local - external-dns annotation prefix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject the retired alpha prefix
        run: |
          if grep -rn --include='*.yaml' --include='*.yml' --include='*.j2' \
               'external-dns\.alpha\.kubernetes\.io/' kubernetes/; then
            echo "::error::Use external-dns.kubernetes.io/<key> — the alpha prefix is ignored by external-dns >=0.22 (see issue #3002)."
            exit 1
          fi
          echo "no alpha-prefixed external-dns annotations under kubernetes/"

  portal-identity-guard:
    if: ${{ needs.filter.outputs.portal-files != '[]' }}
    needs: filter
    name: Flux Local - Portal OIDC guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install isolated hash-locked guard dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/portal-guard-venv"
          "$RUNNER_TEMP/portal-guard-venv/bin/python" -I -m pip install \
            --only-binary=:all: --require-hashes --disable-pip-version-check \
            -r scripts/tests/portal178-m5a/requirements.lock
      - name: Install checksum-pinned Kustomize
        run: |
          mkdir "$RUNNER_TEMP/portal-kustomize"
          cd "$RUNNER_TEMP/portal-kustomize"
          curl --fail --silent --show-error --location \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz \
            --output kustomize_v5.8.3_linux_amd64.tar.gz
          sha256sum --check "$GITHUB_WORKSPACE/scripts/tests/portal178-m5a/kustomize.sha256"
          tar -xzf kustomize_v5.8.3_linux_amd64.tar.gz
      - name: Check staged-deny configuration and unsafe mutations
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/goauthentik/authentik/4ec0d19b98da3c329781894cd550da95d3033954/blueprints/schema.json \
            --output "$RUNNER_TEMP/authentik-schema.json"
          nice -n 19 "$RUNNER_TEMP/portal-kustomize/kustomize" build \
            kubernetes/main/apps/network/authentik/app > "$RUNNER_TEMP/authentik-rendered.yaml"
          nice -n 19 "$RUNNER_TEMP/portal-guard-venv/bin/python" -I -B \
            scripts/tests/portal178-m5a/validate.py \
            --schema "$RUNNER_TEMP/authentik-schema.json" \
            --rendered "$RUNNER_TEMP/authentik-rendered.yaml"

  studio-effective-policy:
    # Any active Flux source or shared base can add a selecting policy.
    if: ${{ needs.filter.outputs.changed-files != '[]' || needs.filter.outputs.studio-files != '[]' }}
    needs: filter
    name: Flux Local - Studio effective policy guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Flux for offline policy inventory rendering
        run: bash scripts/tests/studio-release/install-flux.sh
      - name: Verify the rendered effective Studio policy
        run: |
          python3 -m venv "$RUNNER_TEMP/studio-policy-venv"
          "$RUNNER_TEMP/studio-policy-venv/bin/python" -I -m pip install \
            --only-binary=:all: --no-deps --disable-pip-version-check PyYAML==6.0.3
          "$RUNNER_TEMP/studio-policy-venv/bin/python" -I -B scripts/tests/studio-release/check.py --effective-policies

  studio-release-guard:
    if: ${{ needs.filter.outputs.studio-files != '[]' }}
    needs: filter
    name: Flux Local - Studio release guard
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:63e83b5a3dc36a917dccb76fe1bd2ac51f1ec9c1deb47ff20d4f04233bf6eae9
        env:
          POSTGRES_DB: studio_op967_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d studio_op967_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Flux for offline policy inventory rendering
        run: bash scripts/tests/studio-release/install-flux.sh
      - name: Test Studio Flux Job gates
        run: |
          python3 -m venv "$RUNNER_TEMP/studio-release-venv"
          "$RUNNER_TEMP/studio-release-venv/bin/python" -I -m pip install \
            --only-binary=:all: --no-deps --disable-pip-version-check PyYAML==6.0.3
          mkdir "$RUNNER_TEMP/studio-kustomize"
          (
            cd "$RUNNER_TEMP/studio-kustomize"
            curl --fail --silent --show-error --location \
              https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz \
              --output kustomize_v5.8.3_linux_amd64.tar.gz
            sha256sum --check "$GITHUB_WORKSPACE/scripts/tests/portal178-m5a/kustomize.sha256"
            tar -xzf kustomize_v5.8.3_linux_amd64.tar.gz
          )
          "$RUNNER_TEMP/studio-release-venv/bin/python" -I -B scripts/tests/studio-release/test_matting_provision.py
          PATH="$RUNNER_TEMP/studio-kustomize:$PATH" \
            "$RUNNER_TEMP/studio-release-venv/bin/python" -B scripts/tests/studio-release/test_matting_quality.py
          PATH="$RUNNER_TEMP/studio-kustomize:$PATH" \
            "$RUNNER_TEMP/studio-release-venv/bin/python" -I -B scripts/tests/studio-release/test_segmentation.py
          PATH="$RUNNER_TEMP/studio-kustomize:$PATH" \
            "$RUNNER_TEMP/studio-release-venv/bin/python" -I -B scripts/tests/studio-release/test_upscaling.py
          PATH="$RUNNER_TEMP/studio-kustomize:$PATH" \
            "$RUNNER_TEMP/studio-release-venv/bin/python" -I -B scripts/tests/studio-release/test_release.py
          "$RUNNER_TEMP/studio-release-venv/bin/python" -I -B scripts/tests/studio-release/test_op967.py
      - name: Check out the Studio matting source for the synthetic trial
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: thaynes43/haynes-studio
          # Build revision of the pinned OP459 matting image.
          ref: f217cd21ed7899ab7d2b633d19813c536b1c2a14
          path: studio-trial-source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
      - name: Test and dry-run the trial with a synthetic cast still
        env:
          STUDIO_THREADS: "2"
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "1"
          UV_CONCURRENT_DOWNLOADS: "2"
          UV_CONCURRENT_INSTALLS: "2"
          UV_CONCURRENT_BUILDS: "1"
        run: |
          uv sync --project studio-trial-source --locked --python 3.12
          PYTHONPATH="$GITHUB_WORKSPACE/studio-trial-source" \
            studio-trial-source/.venv/bin/python -B scripts/tests/studio-release/test_matting_trial.py
      - name: Check out the retry probe's Studio migrations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: thaynes43/haynes-studio
          # First released source containing all three schema revisions under test.
          ref: 0f6ca21e48f8a8e4d6745cba91267c4726733b47
          path: studio-retry-source
          persist-credentials: false
      - name: Exercise the retry probe against PostgreSQL
        env:
          STUDIO_OP967_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/studio_op967_test
          PYTHONPATH: ${{ github.workspace }}/studio-retry-source/src
        run: studio-trial-source/.venv/bin/python -B scripts/tests/studio-release/test_retry_schema.py -v
      - name: Verify Studio release pins
        run: |
          PATH="$RUNNER_TEMP/studio-kustomize:$PATH" \
            "$RUNNER_TEMP/studio-release-venv/bin/python" -I -B scripts/tests/studio-release/check.py

  success:
    if: ${{ always() }}
    needs:
      - filter
      - test
      - diff
      - annotation-guard
      - portal-identity-guard
      - studio-effective-policy
      - studio-release-guard
    name: Flux Local - Success
    runs-on: ubuntu-latest
    steps:
      - name: Filter not successful, or any jobs failed or cancelled?
        if: ${{ needs.filter.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ needs.filter.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
