name: Build and Push ControlFoley Image

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/controlfoley/**'
      - '.github/workflows/controlfoley-build.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/controlfoley/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build test image for validation
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./scripts/controlfoley
          target: test
          push: false
          load: true
          tags: controlfoley:test
      - name: Test control plane and real backend imports without models, network or GPU
        timeout-minutes: 8
        run: |
          docker run --rm --read-only --network none \
            --cpus 2 --memory 6g \
            --tmpfs /tmp:rw,exec,uid=1000,gid=1000,size=512m \
            --tmpfs /workspace:rw,uid=1000,gid=1000,size=1g \
            --user 1000:1000 \
            --entrypoint /bin/sh controlfoley:test -c 'python -m unittest discover -s /opt/controlfoley-tools -v && python /opt/controlfoley-tools/run.py --check-imports'
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish validated runtime image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./scripts/controlfoley
          target: runtime
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/controlfoley:0.1.0
      - name: Install cosign
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/controlfoley
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: >-
          cosign sign --yes --new-bundle-format=false --use-signing-config=false
          --registry-referrers-mode=legacy "${IMAGE}@${DIGEST}"
