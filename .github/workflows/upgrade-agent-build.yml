name: Build and Push Upgrade Agent Image

# Builds the Tier-4 health-gate toolbox image (ghcr.io/thaynes43/upgrade-agent).
# Minimal by design (kubectl/jq/curl/bash) — see scripts/upgrade-agent/Dockerfile.
# Build context is scripts/upgrade-agent (Dockerfile only) so nothing from the repo
# — no secrets, no .git — can enter an image layer. Builds only on main.

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/upgrade-agent/**'
      - '.github/workflows/upgrade-agent-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write   # keyless cosign signing (OIDC) — proves the image came from THIS workflow

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.4   # v2 writes legacy .sig tags (Kyverno-verifiable)

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./scripts/upgrade-agent
          file: ./scripts/upgrade-agent/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/upgrade-agent:0.1.0
            ghcr.io/${{ github.repository_owner }}/upgrade-agent:latest

      # Keyless sign by DIGEST (covers both tags). Verified in-cluster by the Kyverno
      # verify-thaynes43-images policy against this workflow's OIDC identity.
      - name: Sign the image (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/upgrade-agent
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
