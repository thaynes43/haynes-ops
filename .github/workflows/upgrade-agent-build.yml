name: Build and Push Upgrade Agent Image

# Builds the Tier-4 health-gate toolbox image (ghcr.io/thaynes43/upgrade-agent).
# Minimal by design (kubectl/jq/curl/bash) — see scripts/upgrade-agent/Dockerfile.
# Build context is scripts/upgrade-agent (Dockerfile only) so nothing from the repo
# — no secrets, no .git — can enter an image layer. Builds only on main.
#
# deliver_reviewed_pr.py is the interactive delivery command. It is not an image
# input. Pull requests that touch it, its offline test, or this workflow run that
# suite here. Push builds stay on the Dockerfile so a helper edit does not
# republish the toolbox tag.

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/upgrade-agent/Dockerfile'
      # NOTE (2026-07-28): this workflow deliberately does NOT list its own file
      # here. When it did, ANY edit to the workflow — including Renovate's Tier-0
      # auto-merged action bumps (e.g. the cosign v2.6.4/v3.1.2 pair, 07-25) —
      # rebuilt the image from unchanged source, re-pushed the same tag with a new
      # digest, and Renovate then opened a pointless digest-drift PR. Trade-off: a
      # workflow-file change no longer proves itself post-merge — after deliberately
      # editing this workflow, run it once by hand (`gh workflow run <file>`); a
      # broken action bump now surfaces at the next dispatch/source build instead
      # of immediately.
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/upgrade-agent/deliver_reviewed_pr.py'
      - 'scripts/upgrade-agent/test_deliver_reviewed_pr.py'
      - '.github/workflows/upgrade-agent-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write   # keyless cosign signing (OIDC) — proves the image came from THIS workflow

jobs:
  build-and-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # The sign step selects v3's legacy .sig mode for Kyverno.
          # Keep in step with the other OCI image build workflows.
          cosign-release: v3.1.4

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./scripts/upgrade-agent
          file: ./scripts/upgrade-agent/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/upgrade-agent:0.1.0
            ghcr.io/${{ github.repository_owner }}/upgrade-agent:latest

      # Keyless sign by DIGEST (covers both tags). Verified in-cluster by the Kyverno
      # verify-thaynes43-images policy against this workflow's OIDC identity.
      - name: Sign the image (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/upgrade-agent
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          cosign sign --yes --new-bundle-format=false --use-signing-config=false
          --registry-referrers-mode=legacy "${IMAGE}@${DIGEST}"

  deliver-reviewed-pr:
    name: Deliver Reviewed PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Offline deliver-reviewed-pr suite
        run: nice -n 19 python3 -I -B scripts/upgrade-agent/test_deliver_reviewed_pr.py -v
