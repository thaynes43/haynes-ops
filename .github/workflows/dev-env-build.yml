name: Build and Push Dev Env Image

# Builds the dev-env workhorse image (ghcr.io/thaynes43/dev-env) for the dev-env saga
# (.agents/sagas/dev-env/): agent CLIs + ops toolchain + code-server + SDKs. Build
# context is the REPO ROOT so the Dockerfile can COPY scripts/github-app-token.sh
# (single source of truth); the repo-root .dockerignore keeps secrets/.git out of the
# context. PRs build and smoke-test without publishing; only main can publish.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/dev-env/**'
      - 'scripts/github-app-token.sh'
      - '.github/workflows/dev-env-build.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/dev-env/**'
      - 'scripts/github-app-token.sh'
      # NOTE (2026-07-28): this workflow deliberately does NOT list its own file
      # here. When it did, ANY edit to the workflow — including Renovate's Tier-0
      # auto-merged action bumps (e.g. the cosign v2.6.4/v3.1.2 pair, 07-25) —
      # rebuilt the image from unchanged source, re-pushed the same tag with a new
      # digest, and Renovate then opened a pointless digest-drift PR. Trade-off: a
      # workflow-file change no longer proves itself post-merge — after deliberately
      # editing this workflow, run it once by hand (`gh workflow run <file>`); a
      # broken action bump now surfaces at the next dispatch/source build instead
      # of immediately.
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write   # keyless cosign signing (OIDC) — proves the image came from THIS workflow

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # cosign v3 (since the 2026-07-25 Renovate bump) writes ONLY the Sigstore
          # bundle format — an OCI referrer, which GHCR (no referrers API) stores as
          # the `sha256-<digest>` tag — and has no legacy-format switch. Kyverno's
          # Cosign-type verifyImages looks for the legacy `sha256-<digest>.sig` tag,
          # so verify-thaynes43-images has reported "no signatures found" for every
          # image built since: harmless while that policy is Audit, but it means
          # image verification is NOT actually happening. Open as of 2026-09-01;
          # the two fixes are (a) pin cosign v2.6.4 here plus a Renovate
          # allowedVersions "<3" rule so .sig tags come back (cosign v2 rides the
          # Rekor v1 API — check its sunset before choosing this), or (b) move the
          # Kyverno rule to a bundle-aware verifier once one reads plain-signature
          # bundles. Same situation in upgrade-shepherd-build.yml and
          # upgrade-agent-build.yml — change all three together.
          cosign-release: v3.1.3

      - name: Build image for validation
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./scripts/dev-env/Dockerfile
          push: false
          load: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dev-env:0.6.0
            ghcr.io/${{ github.repository_owner }}/dev-env:latest

      - name: Smoke-test authoring as the runtime user
        timeout-minutes: 8
        run: |
          docker run --rm --read-only --network none \
            --cpus 4 --memory 8g --shm-size 64m \
            --tmpfs /tmp:rw,exec,size=512m \
            --tmpfs /home/dev:rw,uid=1000,gid=1000,size=1g \
            --user 1000:1000 \
            --entrypoint /opt/dev-env/blender-mcp/.venv/bin/python \
            ghcr.io/${{ github.repository_owner }}/dev-env:0.6.0 \
            /opt/dev-env/test-blender-authoring.py

      - name: Publish validated image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: publish
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/dev-env
        run: |
          docker push "${IMAGE}:0.6.0"
          docker push "${IMAGE}:latest"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:0.6.0")"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      # The live HelmRelease remains on its old digest until a separate held-draft
      # activation PR is merged at a natural break. Image builds do not roll it.
      - name: Sign the image (keyless)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/dev-env
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
