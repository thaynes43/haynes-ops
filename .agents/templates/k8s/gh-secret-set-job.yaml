# One-off Job: set the CLAUDE_CODE_OAUTH_TOKEN Actions secret on one repo.
# Used by .agents/runbooks/new-repo-setup.md step 4. Not a Flux manifest: it lives
# outside kubernetes/ and is applied by hand with `kubectl create -f -`.
#
# Why a Job: the dev-env pod's own token (/creds/gh_token) is minted with a fixed
# permission list that has no `secrets` scope, and widening it means editing the
# gh-refresher env, which bounces the pod. This Job runs the sidecar's image and mint
# script with the sidecar's App Secret, so the App PEM never enters the app container,
# and it mints a separate token with only `secrets: write`. The secret value comes in
# through a secretKeyRef from the same Kubernetes Secret that feeds the pod's
# CLAUDE_CODE_OAUTH_TOKEN, so no agent shell or log ever holds it.
#
# Placeholders: <<REPO>> = repo name without the owner (also used in the Job name,
# so it must be a valid DNS label), <<IMAGE>> = the gh-refresher sidecar's image.
# No labels on purpose: the dev-env CiliumNetworkPolicy selects
# app.kubernetes.io/name=dev-env, and this pod must reach api.github.com.
apiVersion: batch/v1
kind: Job
metadata:
  name: gh-secret-set-<<REPO>>
  namespace: dev
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 900
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: set-secret
          image: <<IMAGE>>
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          envFrom:
            # GITHUB_BOT_APP_{ID,CLIENT_ID,INSTALLATION_ID,PRIVATE_KEY}: the same
            # Secret the gh-refresher sidecar mints from.
            - secretRef:
                name: dev-env-bot-secret
          env:
            - name: HOME
              value: /tmp
            - name: REPO
              value: thaynes43/<<REPO>>
            # Read by /opt/dev-env/github-app-token.sh. A request beyond the App's
            # grant fails the mint with HTTP 422.
            - name: GITHUB_BOT_TOKEN_PERMISSIONS
              value: '{"secrets":"write","metadata":"read"}'
            - name: SECRET_VALUE
              valueFrom:
                secretKeyRef:
                  name: dev-env-claude-secret
                  key: CLAUDE_CODE_OAUTH_TOKEN
          command: ["/bin/bash", "-c"]
          # Never add `set -x` or print the environment: SECRET_VALUE, the PEM and the
          # minted token are all in it.
          args:
            - |
              set -euo pipefail
              if ! GH_TOKEN="$(/opt/dev-env/github-app-token.sh)"; then
                echo "MINT FAILED: HTTP 422 means the haynes-dev-bot App lacks 'Secrets: Read and write'" >&2
                exit 2
              fi
              export GH_TOKEN
              unset GITHUB_BOT_APP_PRIVATE_KEY
              printf '%s' "$SECRET_VALUE" | gh secret set CLAUDE_CODE_OAUTH_TOKEN -R "$REPO"
              unset SECRET_VALUE
              echo "secrets on $REPO (names only):"
              gh secret list -R "$REPO" --json name,updatedAt --jq '.[] | "\(.name) \(.updatedAt)"'
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
