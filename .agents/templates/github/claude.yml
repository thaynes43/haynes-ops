# TEMPLATE - copy to <repo>/.github/workflows/claude.yml.
# Runbook: .agents/runbooks/new-repo-setup.md (haynes-ops). Replace every
# `<<...>>` marker; `grep -n '<<'` must be empty before commit.
name: Claude Code

# Interactive "@claude" handler: mention @claude in an issue, a PR comment or a
# review and Claude picks the work up from there. claude-code-action's default
# applies: only actors with write access can trigger it. Do not add
# `allowed_non_write_users`.
#
# Public repos: anyone can comment, so the job's `if:` also gates on who wrote the
# text: the owner, a member or a collaborator (`author_association`), or the dev bot
# `haynes-dev-bot[bot]` (agent-authored issues and PRs). A stranger's @claude starts
# no job, and a stranger's issue stays unanswered even when someone trusted, the bot
# included, assigns it later: for issues the gate reads the issue's author
# (`issue.user`), never the assigner. Added 2026-10-07 (dev-env #56).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  claude-assistant:
    name: Claude assistant (@claude)
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
         github.event.comment.user.login == 'haynes-dev-bot[bot]')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
         github.event.comment.user.login == 'haynes-dev-bot[bot]')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) ||
         github.event.review.user.login == 'haynes-dev-bot[bot]')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) ||
         github.event.issue.user.login == 'haynes-dev-bot[bot]'))
    # One @claude run per thread: a follow-up mention waits for the run in flight.
    # Job-level, so a skipped (ungated) event never enters the group and cannot
    # displace a pending run.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # OIDC exchange for the Claude GitHub App token (used to comment)
      actions: read # lets Claude read CI results on PRs

    steps:
      # Secrets cannot appear in `if:`, so expose presence as a step output.
      - name: Check for CLAUDE_CODE_OAUTH_TOKEN
        id: gate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set for this repo; skipping @claude."
          fi

      - name: Checkout repository
        if: steps.gate.outputs.present == 'true'
        # <<PINNING>> match the repo's existing style (tag, or full SHA + "# vX.Y.Z").
        # Keep the default credential persistence: claude-code-action runs `git fetch origin
        # <pr-branch>` before it sets up its own git auth, and a private repo refuses that without
        # a credential. Do NOT add `persist-credentials: false` (failed in sigmaphiomicron-com
        # PR 25). If zizmor flags artipacked, set `persist-credentials: true` with an inline
        # `# zizmor: ignore[artipacked]`: the job token is contents: read.
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code
        if: steps.gate.outputs.present == 'true'
        id: claude
        # <<PINNING>> same rule; the reference rollout uses the floating @v1.
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Agent-authored issues/PRs come from the dev bot; allow it to summon Claude.
          allowed_bots: "haynes-dev-bot"
          # Automated surfaces pin the newest Opus explicitly, never an alias.
          claude_args: "--model claude-opus-5-5"
          additional_permissions: |
            actions: read
