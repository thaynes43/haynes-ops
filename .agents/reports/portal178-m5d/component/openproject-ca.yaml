# UNREGISTERED peer CA input. No PEM is present. The mount requires
# ca/openproject-ca.crt, so a pod cannot start until an attested public
# certificate is added.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dev-env-v2-portal-openproject-ca
  namespace: dev-agents
  annotations:
    dev-env.haynesops.com/ca-input: public-only-awaiting-owner-attestation
    dev-env.haynesops.com/ca-sha256: UNVERIFIED
data:
  provenance: absent
