# UNREGISTERED single BFF consumer. Same HaynesKube item and fields as the
# historical dev-env-system proposal. Do not apply both. dev-agents is the
# namespace that can mount this Secret; no new 1Password item or field.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-v2-portal-oidc
  namespace: dev-agents
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 1h
  target:
    name: dev-env-v2-portal-oidc
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        OIDC_CLIENT_ID: '{{ .OIDC_CLIENT_ID }}'
        OIDC_CLIENT_SECRET: '{{ .OIDC_CLIENT_SECRET }}'
  data:
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: dev-env-v2-portal
        property: OIDC_CLIENT_ID
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: dev-env-v2-portal
        property: OIDC_CLIENT_SECRET
