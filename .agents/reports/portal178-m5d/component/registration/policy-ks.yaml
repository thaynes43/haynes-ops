# UNREGISTERED. Not referenced from kubernetes/. Apply this stage and verify
# the default-deny policy before any portal pod exists. A single build that
# also contains the Deployment does not prove isolation.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-env-v2-portal-policy
  namespace: dev-agents
  annotations:
    dev-env.haynesops.com/portal-registration: unregistered
spec:
  targetNamespace: dev-agents
  path: .agents/reports/portal178-m5d/component/policy
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  prune: true
  wait: true
  interval: 30m
  timeout: 5m
