# UNREGISTERED. Depends on the policy stage. Do not apply while required
# inputs are absent. This object is not referenced from kubernetes/.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-env-v2-portal
  namespace: dev-agents
  annotations:
    dev-env.haynesops.com/portal-registration: unregistered
spec:
  targetNamespace: dev-agents
  dependsOn:
    - name: dev-env-v2-portal-policy
      namespace: dev-agents
  path: .agents/reports/portal178-m5d/component
  sourceRef:
    kind: GitRepository
    name: haynes-ops
    namespace: flux-system
  prune: true
  wait: true
  interval: 30m
  timeout: 5m
