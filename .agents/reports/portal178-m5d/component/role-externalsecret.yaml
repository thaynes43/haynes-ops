# Inert staged projection. ValidatePortalConsumer accepts these properties.
# Population and install remain HELD. Rendering this unregistered component is not installation.
# UNREGISTERED. CNPG basic-auth projection. Secret name unchanged.
# remoteRef.key is existing item dev-env. Username and password only.
# Supersedes item name dev-env-v2-portal-runtime. Population is HELD.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-v2-portal-runtime-db
  namespace: database
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 1h
  target:
    name: dev-env-v2-portal-runtime-db
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
      data:
        username: '{{ .DB_USERNAME }}'
        password: '{{ .DB_PASSWORD }}'
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: dev-env
        property: DB_USERNAME
    - secretKey: DB_PASSWORD
      remoteRef:
        key: dev-env
        property: DB_PASSWORD
