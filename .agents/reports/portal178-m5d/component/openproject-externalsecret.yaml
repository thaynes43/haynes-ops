# UNREGISTERED. Selects one existing property. No dataFrom and no vault writer.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-v2-portal-openproject
  namespace: dev-agents
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 1h
  target:
    name: dev-env-v2-portal-openproject
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        OPENPROJECT_TOKEN: '{{ .OPENPROJECT_TOKEN }}'
  data:
    - secretKey: OPENPROJECT_TOKEN
      remoteRef:
        key: dev-env
        property: OPENPROJECT_TOKEN
