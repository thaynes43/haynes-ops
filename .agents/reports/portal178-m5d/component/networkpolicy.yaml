# UNREGISTERED proposal. Ineffective as an isolation boundary until the matching
# exact BFF-only shared-tier exclusions are reviewed/applied. Additive policies
# cannot subtract inherited public web/MCP/API permissions. No shared edits here.
# REQUIRED pod DNS: ClusterFirst + dnsConfig.options ndots=1 (contract JSON).
# Exact names stay narrow; never deploy this with the default ndots=5. Verify
# actual DNS/resolver behavior in the runtime network tests before activation.
# OpenProject and the operator are the fixed metadata destinations. DNS allows
# those two names and the earlier three. OpenProject egress is that exact FQDN
# on TCP 443. Operator egress selects the repository operator pod label and
# TCP 8443. This file does not create tokens or enable metadata.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dev-env-v2-portal
  namespace: dev-agents
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: dev-env-v2-portal
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-internal-network
      toPorts:
        - ports: [{port: '8443', protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports: [{port: '53', protocol: ANY}]
          rules:
            dns:
              - matchName: authentik.haynesnetwork.com
              - matchName: postgres16-rw.database.svc.cluster.local
              - matchName: kubernetes.default.svc.cluster.local
              - matchName: work.haynesnetwork.com
              - matchName: dev-env-operator.dev-env-system.svc.cluster.local
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: database
            cnpg.io/cluster: postgres16
      toPorts:
        - ports: [{port: '5432', protocol: TCP}]
    - toEntities: [kube-apiserver]
      toPorts:
        - ports: [{port: '443', protocol: TCP}, {port: '6443', protocol: TCP}]
    - toFQDNs:
        - matchName: authentik.haynesnetwork.com
      toPorts:
        - ports: [{port: '443', protocol: TCP}]
    - toFQDNs:
        - matchName: work.haynesnetwork.com
      toPorts:
        - ports: [{port: '443', protocol: TCP}]
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: dev-env-system
            app.kubernetes.io/name: dev-env-operator
      toPorts:
        - ports: [{port: '8443', protocol: TCP}]
