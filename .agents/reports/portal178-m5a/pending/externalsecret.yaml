# PROPOSAL ONLY. Not referenced by any Kustomization/HelmRelease or mounted.
# Namespace dev-env-system is the historical placement. The rendered BFF
# consumer is dev-agents; do not apply both.
# Supersession 2026-10-24: remoteRef.key is existing HaynesKube item dev-env.
# The prior item name dev-env-v2-portal is not created. Object name unchanged.
# Only OIDC_CLIENT_ID and OIDC_CLIENT_SECRET. No dataFrom.
# Historical 2026-10-23 text: this proposal said Tom would write a dedicated item
# after the provider existed. That dedicated item is not created.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-v2-portal-oidc
  namespace: dev-env-system
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 1h
  target:
    name: dev-env-v2-portal-oidc
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        OIDC_CLIENT_ID: '{{ .OIDC_CLIENT_ID }}'
        OIDC_CLIENT_SECRET: '{{ .OIDC_CLIENT_SECRET }}'
  data:
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: dev-env
        property: OIDC_CLIENT_ID
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: dev-env
        property: OIDC_CLIENT_SECRET
