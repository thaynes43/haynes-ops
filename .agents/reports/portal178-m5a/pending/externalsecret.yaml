---
# PROPOSAL ONLY. Not referenced by any Kustomization/HelmRelease or mounted.
# Namespace/consumer placement must be reviewed with the actual runtime artifact.
# Only Tom writes the dedicated 1Password item, after the reviewed provider exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-v2-portal-oidc
  namespace: dev-env-system
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 1h
  target:
    name: dev-env-v2-portal-oidc
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        OIDC_CLIENT_ID: '{{ .OIDC_CLIENT_ID }}'
        OIDC_CLIENT_SECRET: '{{ .OIDC_CLIENT_SECRET }}'
  data:
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: dev-env-v2-portal
        property: OIDC_CLIENT_ID
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: dev-env-v2-portal
        property: OIDC_CLIENT_SECRET
