# UNREGISTERED. Proposed same-namespace CA key projection avoids a new projector.
# Runtime placement/consumer must be ratified before this is registered/mounted.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-v2-portal-runtime
  namespace: database
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 1h
  target:
    name: dev-env-v2-portal-runtime
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        DB_USERNAME: '{{ .DB_USERNAME }}'
        DB_PASSWORD: '{{ .DB_PASSWORD }}'
        SESSION_AEAD_KEY: '{{ .SESSION_AEAD_KEY }}'
        SESSION_GENERATION: '{{ .SESSION_GENERATION }}'
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: dev-env-v2-portal-runtime
        property: DB_USERNAME
    - secretKey: DB_PASSWORD
      remoteRef:
        key: dev-env-v2-portal-runtime
        property: DB_PASSWORD
    - secretKey: SESSION_AEAD_KEY
      remoteRef:
        key: dev-env-v2-portal-runtime
        property: SESSION_AEAD_KEY
    - secretKey: SESSION_GENERATION
      remoteRef:
        key: dev-env-v2-portal-runtime
        property: SESSION_GENERATION
