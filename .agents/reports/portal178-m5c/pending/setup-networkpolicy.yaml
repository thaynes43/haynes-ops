# UNREGISTERED. Select only the two isolated setup jobs, never namespace-wide.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dev-env-v2-portal-db-setup
  namespace: database
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: dev-env-v2-portal-db-setup
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres16
      ports:
        - {port: 5432, protocol: TCP}
