# Registered 2026-10-26: roles by #4310, this HBA list by S7 (cluster16.yaml).
# UNREGISTERED future proposal. Do not register this file as the first change.
# Stage 1 is pending/hba-stage-reject.yaml, already represented on cluster16.
# This pg_hba list is the post-proof composition: reject stage plus the single
# runtime allow inserted before the catch-all. No migrator allow.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres16
  namespace: database
spec:
  managed:
    roles:
      - name: dev_env_v2_portal_runtime
        ensure: present
        login: true
        connectionLimit: 8
        inherit: false
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        inRoles: []
        passwordSecret:
          name: dev-env-v2-portal-runtime-db
      - name: dev_env_v2_portal_migrator
        ensure: present
        # Peer migration SET ROLE does not require LOGIN or a mounted password.
        login: false
        disablePassword: true
        connectionLimit: 1
        inherit: false
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        inRoles: []
  postgresql:
    pg_hba:
      # Actual current pod CIDRs are 10.42.0.0/24 through 10.42.8.0/24;
      # the cluster pod range is the candidate bound, not a BFF identity proof.
      # Narrow workload NetworkPolicy/placement still needs runtime review.
      - host replication dev_env_v2_portal_runtime,dev_env_v2_portal_migrator 0.0.0.0/0 reject
      - host replication dev_env_v2_portal_runtime,dev_env_v2_portal_migrator ::/0 reject
      - hostnossl all dev_env_v2_portal_runtime,dev_env_v2_portal_migrator 0.0.0.0/0 reject
      - hostnossl all dev_env_v2_portal_runtime,dev_env_v2_portal_migrator ::/0 reject
      - hostssl dev_env_v2_portal dev_env_v2_portal_runtime 10.42.0.0/16 scram-sha-256
      - host all dev_env_v2_portal_runtime,dev_env_v2_portal_migrator 0.0.0.0/0 reject
      - host all dev_env_v2_portal_runtime,dev_env_v2_portal_migrator ::/0 reject
# CNPG fixed local peer rules precede user rules. Its live map contains only
# postgres->postgres; neither portal role maps. A later local reject is shadowed
# and is deliberately not represented as protection here. Test the actual map.
