# UNREGISTERED. CNPG gets database credentials only; it never receives the AEAD
# key or generation. Historical text said Tom would populate a dedicated item.
# Supersession 2026-10-24: remoteRef.key is existing item dev-env. The prior item
# name dev-env-v2-portal-runtime is not created. Secret name unchanged.
# Population of these properties is HELD. No dataFrom.
# Inert staged projection. ValidatePortalConsumer accepts these properties.
# Population and install remain HELD. Not a Flux resource.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-env-v2-portal-runtime-db
  namespace: database
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 1h
  target:
    name: dev-env-v2-portal-runtime-db
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
      data:
        username: '{{ .DB_USERNAME }}'
        password: '{{ .DB_PASSWORD }}'
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: dev-env
        property: DB_USERNAME
    - secretKey: DB_PASSWORD
      remoteRef:
        key: dev-env
        property: DB_PASSWORD
