---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# NOTE: the cluster-template bootstrap targets (`init`, `configure`, the makejinja
# `.template` step and the whole `repository:` / `talos:` namespaces) were removed in
# the 2026-09-22 taskfile audit — they templated a repo that no longer exists in that
# shape. Git history keeps them. Cluster bring-up is documented in docs/cluster/index.md
# and driven by Omni (`omni:sync`) + `flux:install-helm-apps` + `flux:bootstrap`.
# The follow-on retire-edge pass (also 2026-09-22) removed the `edge:` namespace's last
# traces plus `workstation:venv` / `requirements.txt` — makejinja was their only
# consumer, so no Python venv is needed to work in this repo.

vars:
  # Directories
  KUBERNETES_DIR: "{{.ROOT_DIR}}/kubernetes"
  SCRIPTS_DIR: "{{.ROOT_DIR}}/scripts"
  # Files
  AGE_FILE: "{{.ROOT_DIR}}/age.key"
  KUBECONFIG_FILE: "{{.ROOT_DIR}}/kubeconfig"
  SOPS_CONFIG_FILE: "{{.ROOT_DIR}}/.sops.yaml"

env:
  KUBECONFIG: "{{.KUBECONFIG_FILE}}"
  SOPS_AGE_KEY_FILE: "{{.AGE_FILE}}"

includes:
  kubernetes: .taskfiles/Kubernetes
  flux: .taskfiles/Flux
  omni: .taskfiles/Omni
  rook: .taskfiles/Rook
  sops: .taskfiles/Sops
  workstation: .taskfiles/Workstation

tasks:

  default: task --list
